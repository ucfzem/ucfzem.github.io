iq Masood","role":"Muftí","up":"El muftí Tariq Masood nació en Pakistán en 1975 y creció en un entorno que fomentaba el estudio de las ciencias islámicas. Ingresó en la Jamia Tur Rasheed de Karachi, una institución reconocida en el subcontinente indio por la enseñanza de ciencias islámicas según la tradición deobandi.<br><br>Completó el programa Dars-e-Nizami, especializándose en jurisprudencia, sus fundamentos y emisión de fatwas, y estudió Corán, hadiz y creencia con eruditos cualificados. Esta formación lo preparó para la enseñanza, la predicación y la orientación religiosa.","da":"Es un erudito y predicador destacado en Pakistán, activo en la emisión de fatwas y en la impartición de clases y conferencias difundidas por televisión y plataformas digitales. Es conocido por sus series sobre jurisprudencia, interpretación coránica y biografía profética, así como por responder a preguntas cotidianas y familiares.<br><br>Su estilo se caracteriza por un tratamiento directo y práctico de las cuestiones contemporáneas, con énfasis en la reforma del hogar, el carácter y el cumplimiento de las normas islámicas. Sus lecciones gozan de gran popularidad entre el público de habla urdu, en Pakistán y en el extranjero.","works":["<strong>Fatwas:</strong> Respuestas a cuestiones religiosas."],"quote":"El fiqh no es complicación."}}},{"id":"ourayfi","initials":"م.ع","meta":{"ar":"1970 | السعودية","en":"1970 | KSA","fr":"1970 | Arabie Saoudite","es":"1970 | Arabia Saudita"},"tags":{"ar":["العقيدة"],"en":["Aqeedah"],"fr":["Aqidah"],"es":["Aqidah"]},"platforms":["YouTube","X (Twitter)"],"series":{"ar":["خطب"],"en":["Sermons"],"fr":["Sermons"],"es":["Sermones"]},"tr":{"ar":{"title":"الشيخ الدكتور محمد العريفي","role":"داعية","up":"وُلد الشيخ الدكتور محمد بن عبد الرحمن العريفي في المملكة العربية السعودية عام 1970م، ونشأ في بيئة علمية محافظة. التحق بجامعة الإمام محمد بن سعود الإسلامية بالرياض، حيث درس في كلية أصول الدين وتخصص في العقيدة والمذاهب المعاصرة.<br><br>حصل على درجات علمية متقدمة في التخصص ذاته، ونال درجة الدكتوراه في العقيدة، مما أرسى تكوينه العلمي في مجال التوحيد والرد على الشبهات العقدية والفكرية. وقد عمل في التدريس الأكاديمي والإشراف العلمي إلى جانب نشاطه الدعوي.","da":"اشتهر بوصفه أحد أبرز الدعاة والخطباء في المملكة العربية السعودية والعالم العربي، وله محاضرات ودروس وخطب جمعة واسعة الانتشار عبر الفضائيات والإنترنت. تركز موضوعاته على العقيدة الصحيحة، والإيمان، وتزكية النفوس، والتربية الأسرية، مع معالجة لقضايا معاصرة تهم المسلمين.<br><br>شارك في مؤتمرات ولقاءات دعوية داخل المملكة وخارجها، وحظي بحضور جماهيري كبير في دروسه وخطبه. ويتميز أسلوبه بالجمع بين التقرير العلمي للمسائل العقدية واللغة الوعظية المؤثرة، مما جعله من الأصوات الدعوية المؤثرة لدى شريحة واسعة من المتابعين في العالم العربي.","works":["<strong>مؤلفات.</strong>"],"quote":"العقيدة الصحيحة هي الأساس."},"en":{"title":"Sheikh Dr. Mohammed Al-Ourayfi","role":"Preacher","up":"Sheikh Dr. Mohammed bin Abdulrahman Al-Ourayfi was born in Saudi Arabia in 1970 and grew up in a conservative scholarly environment. He studied at Imam Muhammad ibn Saud Islamic University in Riyadh, specializing in creed and contemporary doctrines at the College of Fundamentals of Religion.<br><br>He obtained advanced degrees in the same specialization and earned a PhD in creed, establishing a strong scholarly foundation in monotheism and in responding to intellectual and doctrinal doubts. He has worked in academic teaching and scholarly supervision alongside his da‘wah activities.","da":"He became one of the most prominent preachers and speakers in Saudi Arabia and the Arab world, with widely circulated lectures, lessons, and Friday sermons on satellite channels and the internet. His topics focus on sound creed, faith, spiritual refinement, and family upbringing, while addressing contemporary issues relevant to Muslims.<br><br>He has participated in conferences and da‘wah events inside and outside the Kingdom and has attracted large audiences. His style combines scholarly presentation of theological matters with an inspiring exhortative tone, making him an influential voice among a wide audience in the Arab world.","works":["<strong>Books.</strong>"],"quote":"Correct Aqeedah is the foundation."},"fr":{"title":"Cheikh Dr Mohammed ben Abdulrahman Al-Ourayfi","role":"Prédicateur","up":"Le cheikh Dr Mohammed ben Abdulrahman Al-Ourayfi est né en Arabie saoudite en 1970 et a grandi dans un environnement attaché à la science religieuse. Il a étudié à l’Université islamique Imam Mohammed ibn Saoud de Riyad, se spécialisant en croyance et doctrines contemporaines.<br><br>Il a obtenu des diplômes supérieurs dans la même spécialité, dont un doctorat en ‘aqida, ce qui lui a donné une solide base en théologie islamique et dans la réponse aux doutes intellectuels. Il a exercé dans l’enseignement universitaire et l’encadrement scientifique en parallèle de son activité de prédication.","da":"Il est devenu l’un des prédicateurs les plus connus d’Arabie saoudite et du monde arabe, avec des conférences, cours et sermons largement diffusés sur les chaînes satellitaires et Internet. Ses thèmes portent sur la croyance authentique, la foi, la purification spirituelle et l’éducation familiale, en lien avec les questions contemporaines.<br><br>Il a participé à des conférences et rencontres dans le Royaume et à l’étranger et a touché un large public. Son style associe exposé scientifique des questions doctrinales et ton exhortatif inspirant, ce qui en fait une voix influente dans le monde arabe.","works":["<strong>Ouvrages :</strong> Travaux en croyance et prédication."],"quote":"La croyance correcte est le fondement."},"es":{"title":"Jeque Dr. Mohammed bin Abdulrahman Al-Ourayfi","role":"Predicador","up":"El jeque Dr. Mohammed bin Abdulrahman Al-Ourayfi nació en Arabia Saudita en 1970 y creció en un entorno dedicado al conocimiento religioso. Estudió en la Universidad Islámica Imam Muhammad ibn Saud en Riad, especializándose en creencia y doctrinas contemporáneas.<br><br>Obtuvo títulos avanzados en la misma especialidad y un doctorado en ‘aqida, lo que le proporcionó una base sólida en teología islámica y en la respuesta a dudas intelectuales. Ha trabajado en la enseñanza académica y la supervisión científica junto a su actividad de predicación.","da":"Se convirtió en uno de los predicadores más destacados de Arabia Saudita y del mundo árabe, con conferencias, clases y sermones ampliamente difundidos por televisión e internet. Sus temas se centran en la creencia correcta, la fe, la purificación espiritual y la educación familiar, abordando cuestiones contemporáneas relevantes para los musulmanes.<br><br>Ha participado en conferencias y eventos dentro y fuera del Reino y ha atraído a grandes audiencias. Su estilo combina la exposición académica de cuestiones doctrinales con un tono exhortativo inspirador, lo que lo convierte en una voz influyente en el mundo árabe.","works":["<strong>Libros:</strong> Obras en creencia y predicación."],"quote":"La creencia correcta es el fundamento."}}},{"id":"nabil","initials":"ن.ع","meta":{"ar":"1970 | الكويت","en":"1970 | Kuwait","fr":"1970 | Koweït","es":"1970 | Kuwait"},"tags":{"ar":["التربية"],"en":["Education"],"fr":["Éducation"],"es":["Educación"]},"platforms":["YouTube","Facebook"],"series":{"ar":["قصص السيرة"],"en":["Seerah Stories"],"fr":["Récits de la sira"],"es":["Relatos de la sira"]},"tr":{"ar":{"title":"الشيخ الدكتور نبيل العوضي","role":"داعية","up":"وُلد الشيخ الدكتور نبيل العوضي في الكويت عام 1970م، ونشأ في بيئة اجتماعية محافظة. حصل على شهادة جامعية في التربية من جامعة الكويت، ثم عمل في المجال الإعلامي والتربوي، حيث قدّم برامج تلفزيونية موجهة للشباب والأسرة.<br><br>اتجه لاحقًا إلى تعميق دراسته الشرعية، فسافر إلى المملكة المتحدة لاستكمال دراساته العليا، وحصل على درجة الدكتوراه في موضوع متعلق بالسيرة النبوية والتاريخ الإسلامي. وقد جمع هذا المسار بين الخبرة الإعلامية والتكوين الأكاديمي والاهتمام بالدراسات الإسلامية.","da":"يُعد من أبرز الدعاة والمقدّمين في الكويت والعالم العربي، واشتهر ببرامجه التلفزيونية والمحاضرات التي تناولت السيرة النبوية وقصص الأنبياء والتاريخ الإسلامي بأسلوب قصصي مشوق. قدّم برامج ناجحة أسهمت في تقريب الأحداث التاريخية والسير إلى الجمهور العام، ولا سيما الشباب.<br><br>شارك في أنشطة دعوية وتربوية داخل الكويت وخارجها، وحظي بمتابعة واسعة عبر الفضائيات والمنصات الرقمية. ويركز في رسالته على استلهام العبر من السيرة والتاريخ، وغرس القيم الإيمانية والأخلاقية، وبناء الوعي لدى الأجيال الجديدة بروح تجمع بين التشويق والفائدة التربوية.","works":["<strong>محاضرات.</strong>"],"quote":"التربية بالقدوة أبلغ."},"en":{"title":"Sheikh Dr. Nabil Al-Awadhi","role":"Preacher","up":"Sheikh Dr. Nabil Al-Awadhi was born in Kuwait in 1970 and grew up in a conservative social environment. He earned a university degree in education from Kuwait University and worked in media and educational fields, presenting television programs aimed at youth and families.<br><br>He later deepened his Islamic studies by pursuing graduate education in the United Kingdom, where he obtained a PhD related to Prophetic biography and Islamic history. This path combined media experience with academic formation and a strong interest in Islamic studies.","da":"He is one of the most prominent preachers and presenters in Kuwait and the Arab world, known for television programs and lectures on the Prophetic biography, stories of the prophets, and Islamic history presented in an engaging narrative style. His successful programs helped bring historical events and biographies closer to the general public, especially youth.<br><br>He has participated in educational and da‘wah activities inside and outside Kuwait and gained wide followership through satellite channels and digital platforms. His message focuses on drawing lessons from the Prophetic biography and history, instilling faith-based and moral values, and building awareness among new generations in a way that combines inspiration with educational benefit.","works":["<strong>Lectures.</strong>"],"quote":"Education by example is more effective."},"fr":{"title":"Cheikh Dr Nabil Al-Awadhi","role":"Prédicateur","up":"Le cheikh Dr Nabil Al-Awadhi est né au Koweït en 1970 et a grandi dans un environnement social conservateur. Il a obtenu un diplôme universitaire en éducation à l’Université du Koweït et a travaillé dans les domaines médiatique et éducatif, présentant des émissions destinées aux jeunes et aux familles.<br><br>Il a ensuite approfondi ses études islamiques au Royaume-Uni, où il a obtenu un doctorat lié à la biographie prophétique et à l’histoire islamique. Ce parcours a combiné expérience médiatique, formation académique et intérêt pour les études islamiques.","da":"Il est l’un des prédicateurs et présentateurs les plus connus du Koweït et du monde arabe, célèbre pour ses émissions et conférences sur la biographie prophétique, les récits des prophètes et l’histoire islamique, présentés dans un style narratif captivant. Ses programmes ont contribué à rapprocher les événements historiques et les biographies du grand public, en particulier des jeunes.<br><br>Il a participé à des activités éducatives et de prédication au Koweït et à l’étranger et a bénéficié d’un large suivi sur les chaînes satellitaires et les plateformes numériques. Son message met l’accent sur les leçons tirées de la sira et de l’histoire, l’inculcation des valeurs de foi et d’éthique, et le développement de la conscience des nouvelles générations.","works":["<strong>Conférences :</strong> Enseignements sur la sira et l’histoire."],"quote":"L’éducation par l’exemple est plus efficace."},"es":{"title":"Jeque Dr. Nabil Al-Awadhi","role":"Predicador","up":"El jeque Dr. Nabil Al-Awadhi nació en Kuwait en 1970 y creció en un entorno social conservador. Obtuvo un título universitario en educación en la Universidad de Kuwait y trabajó en los ámbitos mediático y educativo, presentando programas de televisión dirigidos a jóvenes y familias.<br><br>Posteriormente profundizó sus estudios islámicos en el Reino Unido, donde obtuvo un doctorado relacionado con la biografía profética y la historia islámica. Este recorrido combinó experiencia mediática, formación académica e interés por los estudios islámicos.","da":"Es uno de los predicadores y presentadores más destacados de Kuwait y del mundo árabe, conocido por sus programas y conferencias sobre la biografía profética, las historias de los profetas y la historia islámica, presentadas en un estilo narrativo atractivo. Sus programas ayudaron a acercar los acontecimientos históricos y las biografías al público general, especialmente a los jóvenes.<br><br>Ha participado en actividades educativas y de divulgación dentro y fuera de Kuwait y ha logrado un amplio seguimiento en canales satelitales y plataformas digitales. Su mensaje se centra en extraer lecciones de la sira y la historia, inculcar valores de fe y ética, y fomentar la conciencia de las nuevas generaciones.","works":["<strong>Conferencias:</strong> Enseñanzas sobre la sira y la historia."],"quote":"La educación con el ejemplo es más eficaz."}}}];


/* =====================================================================
   3) Logic & Rendering
   ===================================================================== */
let currentLang = localStorage.getItem('dawa-lang') || 'ar';
let currentTheme = localStorage.getItem('dawa-theme') || (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light');


const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const countEl = document.getElementById('count');
const langBtns = document.querySelectorAll('.lang-btn');


// Helper: Fallback to English if FR/ES is missing, then Arabic
function getT(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getArr(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getMeta(scholar) { return scholar.meta[currentLang] || scholar.meta['en']; }
function getTags(scholar) { return scholar.tags[currentLang] || scholar.tags['en']; }
function getSeries(scholar) { return scholar.series[currentLang] || scholar.series['en']; }


// Smart Links
function getPlatformURL(platform, name) {
  const q = encodeURIComponent(name);
  const p = platform.toLowerCase();
  if (p.includes('youtube')) return `https://www.youtube.com/results?search_query=${q}`;
  if (p.includes('facebook')) return `https://www.facebook.com/search/top?q=${q}`;
  if (p.includes('instagram')) return `https://www.instagram.com/explore/search/keyword/?q=${q}`;
  if (p.includes('twitter')) return `https://twitter.com/search?q=${q}&f=user`;
  if (p.includes('telegram')) return `https://www.google.com/search?q=site%3At.me+${q}`;
  if (p.includes('tiktok')) return `https://www.tiktok.com/search?q=${q}`;
  if (p.includes('soundcloud')) return `https://soundcloud.com/search?q=${q}`;
  if (p.includes('snapchat')) return `https://www.snapchat.com/add/${q}`;
  if (p.includes('website')) return `https://www.google.com/search?q=${q}+الموقع+الرسمي`;
  return `https://www.google.com/search?q=${q}+${encodeURIComponent(platform)}`;
}
function getSeriesURL(seriesName, scholarName) {
  const q = encodeURIComponent(`"${seriesName}" ${scholarName}`);
  return `https://www.youtube.com/results?search_query=${q}`;
}


// Render Card
const PHOTO_IDS = new Set(["othman","said","ayman","eyad","menk","omar","yasir","nouman","zakir","hamza","tariq","ahmed","amri","nafi","belal","adnaan","yahya","abdelkafy","huwaini","yaqoubi","benhamza","philips","siraj","suhaib","masood","ourayfi","nabil"]);

function cardHTML(s) {
  const name = getT(s, 'title'); // Use title for search links
  const platforms = s.platforms.map(p => `<li><a href="${getPlatformURL(p, name)}" target="_blank" rel="noopener noreferrer" class="pill">${p}</a></li>`).join("");
  const series = getSeries(s).map(x => `<li><a href="${getSeriesURL(x, name)}" target="_blank" rel="noopener noreferrer" class="series-list__item">${x}</a></li>`).join("");
  const works = getArr(s, 'works').map(w => `<li class="works-list__item">${w}</li>`).join("");
  const tags = getTags(s).map(t => `<span class="tag">${t}</span>`).join("");
  const quote = getT(s, 'quote');
  const photo = PHOTO_IDS.has(s.id) ? `<img src="pictures/${s.id}.jpg" alt="" loading="lazy" decoding="async">` : "";
  
  return `
  <article class="scholar-card" data-search="${(name + ' ' + getT(s,'role') + ' ' + getTags(s).join(' ') + ' ' + s.platforms.join(' ')).toLowerCase()}">
    <header class="scholar-card__head">
      <div class="scholar-card__avatar"><span>${s.initials}</span>${photo}</div>
      <div class="scholar-card__ident">
        <h2 class="scholar-card__title">${name}</h2>
        <p class="scholar-card__meta">${getMeta(s)}</p>
        <p class="scholar-card__role">${getT(s, 'role')}</p>
      </div>
    </header>
    <div class="scholar-card__tags">${tags}</div>
    <div class="scholar-card__body">
      <p>${getT(s, 'up')}</p>
      <p>${getT(s, 'da')}</p>
    </div>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].platforms}</h3>
      <ul class="pill-list">${platforms}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].series}</h3>
      <ul class="series-list">${series}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].works}</h3>
      <ul class="works-list">${works}</ul>
    </section>
    ${quote ? `<blockquote class="scholar-card__quote">${quote}</blockquote>` : ''}
  </article>`;
}


// Main Render
function render() {
  // Set Direction & Lang
  document.body.dir = UI[currentLang].dir;
  document.documentElement.dir = UI[currentLang].dir;
  document.documentElement.lang = currentLang;
  
  // Update UI Text
  document.getElementById('ui-eyebrow').textContent = UI[currentLang].eyebrow;
  document.getElementById('ui-title').textContent = UI[currentLang].title;
  document.getElementById('ui-lede').textContent = UI[currentLang].lede;
  searchInput.placeholder = UI[currentLang].search;
  noResults.textContent = UI[currentLang].noResults;
  
  // Update Buttons
  langBtns.forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });


  // Render Grid
  grid.innerHTML = scholars.map(cardHTML).join("");
  
  // Re-apply search filter
  searchInput.dispatchEvent(new Event('input'));
}


// Search Logic
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  let visible = 0;
  [...grid.children].forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? "" : "none";
    if (match) visible++;
  });
  noResults.classList.toggle('is-visible', visible === 0);
  countEl.textContent = q ? `${visible} / ${scholars.length}` : scholars.length;
});


// Lang Switch
langBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('dawa-lang', currentLang);
    render();
  });
});



// Theme Logic
const themeToggle = document.getElementById('themeToggle');
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dawa-theme', currentTheme);
  applyTheme();
});


// Init
applyTheme();
render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    }, { once: true });
  }
</script>
</body>
