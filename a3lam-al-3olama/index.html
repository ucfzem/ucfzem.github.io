stique, pédagogique et religieuse.<br><br>Son intérêt pour la science et la prédication s’est développé dans un cadre éducatif attaché à l’authenticité et au lien avec le réel. Cela se reflète dans son style, qui allie clarté, équilibre méthodologique et souci pédagogique pratique, en particulier auprès des jeunes et des familles.","da":"Il a présenté de nombreuses leçons, conférences et programmes éducatifs portant sur la foi, le comportement, la purification spirituelle et la prise de conscience, en mettant l’accent sur le lien avec le Coran et la Sunna selon une approche modérée. Il est connu pour son attention aux questions de la jeunesse et de la famille et pour un discours apaisé et équilibré.<br><br>Il diffuse ses contenus via son site officiel et ses plateformes numériques, proposant des séries sur la biographie prophétique, l’explication des quarante hadiths, des séances coraniques et des programmes éducatifs. Ses efforts contribuent à rendre les enseignements religieux et éducatifs accessibles dans un langage clair et pratique.","works":["<strong>Leçons, conférences et articles :</strong> Contenus scientifiques et éducatifs publiés sur son site officiel.","<strong>Programmes éducatifs :</strong> Contenus destinés aux jeunes, aux familles et au développement de la conscience."],"quote":"La science utile est une lumière par laquelle Allah guide les cœurs et les esprits vers le droit chemin."},"es":{"title":"Ustadh Yassine El Amri","role":"Predicador, estudiante de conocimiento y conferenciante educativo","up":"El ustadh Yassine El Amri es un predicador marroquí contemporáneo y conferenciante educativo reconocido en Marruecos. Posee un diploma en técnicas de expresión y comunicación y una licenciatura en lengua y literatura francesas, además de estudios en ciencias islámicas y educación, combinando formación lingüística, pedagógica y religiosa.<br><br>Su interés por el conocimiento y la divulgación se desarrolló en un contexto educativo que valora la autenticidad y la conexión con la realidad. Esto se refleja en su estilo, que combina claridad de ideas, equilibrio metodológico y un enfoque educativo práctico, especialmente dirigido a jóvenes y familias.","da":"Ha impartido numerosas lecciones, conferencias y programas educativos sobre fe, conducta, purificación espiritual y concienciación, con énfasis en vincular al musulmán con el Corán y la Sunnah desde un enfoque moderado. Es conocido por su atención a los temas de juventud y familia y por un discurso sereno y equilibrado.<br><br>Difunde sus contenidos a través de su sitio oficial y plataformas digitales, presentando series sobre la biografía profética, la explicación de los cuarenta hadices, sesiones coránicas y programas educativos. Sus esfuerzos han ayudado a acercar los significados religiosos y educativos en un lenguaje claro y con pasos prácticos.","works":["<strong>Lecciones, conferencias y artículos:</strong> Material científico y educativo publicado en su sitio oficial.","<strong>Programas educativos:</strong> Contenidos dirigidos a jóvenes, familias y desarrollo de la conciencia."],"quote":"El conocimiento beneficioso es una luz con la que Allah guía los corazones y las mentes hacia el camino recto."}}},{"id":"nafi","initials":"ر.ن","meta":{"ar":"1961 | المغرب","en":"1961 | Morocco","fr":"1961 | Maroc","es":"1961 | Marruecos"},"tags":{"ar":["السنة","الدعوة"],"en":["Hadith","Da'wah"],"fr":["Hadith","Da'wah"],"es":["Hadiz","Da'wah"]},"platforms":["YouTube","Website"],"series":{"ar":["دروس علمية بمساجد الرباط","برامج دعوية"],"en":["Lessons in Rabat Mosques","Da'wah Programs"],"fr":["Leçons dans les mosquées de Rabat","Programmes de prédication"],"es":["Lecciones en las mezquitas de Rabat","Programas de divulgación"]},"tr":{"ar":{"title":"فضيلة الشيخ الدكتور رشيد نافع","role":"عالم في السنة وعلومها وداعية","up":"وُلد الشيخ الدكتور رشيد بن عبد السلام نافع الصنهاجي في الرباط يوم 16 رمضان 1382هـ الموافق 23 فبراير 1961م. نشأ في رحاب مسجد قصبة الأوداية والمسجد الأعظم بالرباط، وتعلم القرآن الكريم في كتّابيهما، ثم تابع دراسته الابتدائية والثانوية بمدارس محمد الخامس. وكانت بداياته العلمية على يد الشيخين تقي الدين الهلالي والشيخ حماد الأنصاري، فكان لهما أثر بالغ في توجيهه نحو العناية بالسنة.<br><br>التحق بالجامعة الإسلامية بالمدينة المنورة ونال الإجازة من كلية الدعوة وأصول الدين تخصص العقيدة، ثم واصل مساره الأكاديمي بالمغرب فحصل على دبلوم الدراسات المعمقة من جامعة محمد الخامس بالرباط، ودبلوم الدراسات العليا والدكتوراه الدولة في السنة وعلومها من جامعة الحسن الثاني بالدار البيضاء. وقد صقل هذا التكوين المزدوج بين الدراسة في المشرق والمغرب شخصيته العلمية المنهجية.","da":"يُعد عضوًا في رابطة علماء المغرب وخطيبًا لمسجد الوحدة بالحي الصناعي بالرباط، وله دروس علمية منتظمة بمساجد الرباط عبر المجلس العلمي المحلي. عُرف باهتمامه العميق بالسنة النبوية وعلومها، وبالحرص على تعظيم الدليل وضبط مسائل الاعتقاد والمنهج وفق فهم السلف.<br><br>امتد نشاطه الدعوي والعلمي إلى داخل المغرب وخارجه عبر الندوات والمحاضرات والبرامج، كما عُرف بمشاركته في العمل الإغاثي والإنساني في مناطق متعددة. وله مؤلفات ورسائل علمية في التاريخ والدعوة وقضايا السنة، ويواصل دوره في التربية العلمية والدعوية بخطاب هادئ يجمع بين التأصيل والرفق والاهتمام بواقع الأمة.","works":["<strong>يوسف بن تاشفين ودعوته</strong>","<strong>أيها التائب أقبل</strong>","<strong>المرسل الخفي وحجيته</strong>"]},"en":{"title":"Sheikh Dr. Rachid Nafi","role":"Scholar of Hadith and Islamic Sciences; preacher","up":"Sheikh Dr. Rachid bin Abdessalam Nafi al-Sanhaji was born in Rabat on 16 Ramadan 1382 AH (23 February 1961). He grew up around the mosques of the Oudaya Kasbah and the Great Mosque of Rabat, learned the Qur’an in their schools, and later studied at Mohammed V schools. His early scholarly formation was shaped by Sheikh Taqi al-Din al-Hilali and Sheikh Hammad al-Ansari, who directed him toward deep care for the Sunnah.<br><br>He joined the Islamic University of Madinah and earned a degree in Aqeedah from the College of Da‘wah and Fundamentals of Religion. He continued his academic path in Morocco, obtaining advanced diplomas at Mohammed V University in Rabat and a State Doctorate in Sunnah and its sciences from Hassan II University in Casablanca. This combined training in the East and Morocco shaped his disciplined scholarly approach.","da":"He is a member of the League of Moroccan Scholars and serves as a preacher at the Unity Mosque in Rabat’s industrial district, delivering regular lessons in Rabat mosques under the local scholarly council. He is known for his deep concern for the Sunnah and its sciences and for upholding sound creed and methodology in accordance with the understanding of the early generations.<br><br>His educational and outreach activities have extended within Morocco and abroad through seminars, lectures, and programs. He is also known for participation in humanitarian and relief work in various regions. He has authored works on history, da‘wah, and issues related to the Sunnah, continuing his role in scholarly and spiritual education with a calm discourse that combines authenticity, compassion, and attention to contemporary realities.","works":["<strong>Yusuf ibn Tashfin and His Da'wah</strong>","<strong>O Repentant One, Come Forward</strong>","<strong>The Hidden Mursal and Its Authority</strong>"]},"fr":{"title":"Cheikh Dr Rachid Nafi","role":"Spécialiste du hadith et des sciences islamiques ; prédicateur","up":"Le cheikh Dr Rachid ben Abdessalam Nafi al-Sanhaji est né à Rabat le 16 ramadan 1382 (23 février 1961). Il a grandi auprès des mosquées de la Kasbah des Oudayas et de la Grande Mosquée de Rabat, y a appris le Coran, puis a poursuivi sa scolarité dans les écoles Mohammed V. Sa formation initiale a été marquée par les cheikhs Taqi al-Din al-Hilali et Hammad al-Ansari, qui l’ont orienté vers l’étude approfondie de la Sunna.<br><br>Il a rejoint l’Université islamique de Médine où il a obtenu une licence en croyance (‘aqida), puis a poursuivi ses études au Maroc avec des diplômes supérieurs à l’Université Mohammed V de Rabat et un doctorat d’État en sciences de la Sunna à l’Université Hassan II de Casablanca. Cette formation entre Orient et Maroc a forgé sa rigueur méthodologique.","da":"Il est membre de la Ligue des oulémas du Maroc et prédicateur à la mosquée de l’Unité à Rabat, où il donne régulièrement des cours sous l’égide du conseil scientifique local. Il est reconnu pour son attachement à la Sunna et à ses sciences, ainsi que pour la défense d’une croyance et d’une méthodologie conformes à la voie des pieux prédécesseurs.<br><br>Son activité scientifique et éducative s’étend au Maroc et à l’étranger par des séminaires, conférences et programmes. Il est également connu pour son engagement dans des actions humanitaires. Auteur d’ouvrages sur l’histoire, la prédication et les questions liées à la Sunna, il poursuit un rôle d’éducation et de conseil dans un discours serein alliant authenticité et bienveillance.","works":["<strong>Yusuf ibn Tashfin et son appel :</strong> Ouvrage sur l’histoire et la da‘wa.","<strong>Ô repentant, avance :</strong> Ouvrage de rappel et de conseil.","<strong>Le mursal caché et son autorité :</strong> Étude en sciences du hadith."]},"es":{"title":"Jeque Dr. Rachid Nafi","role":"Especialista en hadiz y ciencias islámicas; predicador","up":"El jeque Dr. Rachid bin Abdessalam Nafi al-Sanhaji nació en Rabat el 16 de Ramadán de 1382 H (23 de febrero de 1961). Creció en torno a las mezquitas de la Kasbah de los Udayas y la Gran Mezquita de Rabat, aprendió el Corán en sus escuelas y continuó sus estudios en centros Mohammed V. Su formación temprana estuvo marcada por los jeques Taqi al-Din al-Hilali y Hammad al-Ansari, quienes lo orientaron hacia el estudio profundo de la Sunnah.<br><br>Ingresó en la Universidad Islámica de Medina y obtuvo la licenciatura en ‘aqida. Prosiguió sus estudios en Marruecos, obteniendo diplomas avanzados en la Universidad Mohammed V de Rabat y un doctorado estatal en ciencias de la Sunnah en la Universidad Hassan II de Casablanca. Esta formación combinada forjó su enfoque académico riguroso.","da":"Es miembro de la Liga de Ulemas de Marruecos y predicador en la Mezquita de la Unidad en Rabat, donde imparte clases regulares bajo el consejo científico local. Es conocido por su dedicación a la Sunnah y sus ciencias, así como por la defensa de una creencia y metodología acordes con la comprensión de las primeras generaciones.<br><br>Su actividad educativa y de divulgación se extiende por Marruecos y el extranjero mediante seminarios, conferencias y programas. También es conocido por su participación en labores humanitarias. Autor de obras sobre historia, da‘wah y cuestiones relacionadas con la Sunnah, continúa su labor educativa con un discurso sereno que combina autenticidad y compasión.","works":["<strong>Yusuf ibn Tashfin y su llamada:</strong> Obra sobre historia y da‘wah.","<strong>Oh arrepentido, acércate:</strong> Obra de exhortación y consejo.","<strong>El mursal oculto y su autoridad:</strong> Estudio en ciencias del hadiz."]}}},{"id":"belal","initials":"ب.أ","meta":{"ar":"1970s | أستراليا","en":"1970s | Australia","fr":"1970s | Australie","es":"1970s | Australia"},"tags":{"ar":["الشريعة"],"en":["Sharia"],"fr":["Charia"],"es":["Sharia"]},"platforms":["YouTube","Instagram"],"series":{"ar":["خطب الجمعة"],"en":["Friday Sermons"],"fr":["Sermons du vendredi"],"es":["Sermones del viernes"]},"tr":{"ar":{"title":"الشيخ بلال أسعد","role":"داعية ومحاضر","up":"وُلد الشيخ بلال أسعد في لبنان، ونشأ في بيئة عُنيت بالعلم الشرعي والقيم الإسلامية. تابع دراسته الجامعية في لبنان حيث حصل على درجة علمية في الشريعة الإسلامية والدعوة، فتأسس على علوم القرآن والسنة والفقه والعقيدة.<br><br>انتقل لاحقًا إلى أستراليا حيث استقر وواصل مسيرته التعليمية والدعوية، فجمع بين التكوين الشرعي المكتسب في بلاد الشام وبين الخبرة الميدانية في التعامل مع مجتمعات المسلمين في الغرب. وقد أكسبه هذا الاحتكاك فهمًا عميقًا لتحديات الهوية والتربية والإيمان في السياقات الغربية.","da":"يُعد من الدعاة والمحاضرين البارزين في أستراليا، وله نشاط واسع في إلقاء الخطب والدروس والمحاضرات في المساجد والمراكز الإسلامية والمؤتمرات. يركز في خطابه على قضايا الإيمان، وبناء الأسرة، وتربية الشباب، ومعالجة المشكلات الاجتماعية والنفسية من منظور إسلامي متوازن.<br><br>تنتشر دروسه وخطبه عبر المنصات الرقمية ومواقع التواصل، حيث يحرص على تقديم محتوى عملي يمس واقع الناس ويعينهم على الثبات وحسن الخلق. ويتميز أسلوبه بالوضوح والدفء والقدرة على مخاطبة مختلف الأعمار، مع التأكيد على وسطية الإسلام وشموليته للحياة الروحية والاجتماعية.","works":["<strong>محاضرات وخطب.</strong>"],"quote":"الدين ليس عاطفة عابرة."},"en":{"title":"Sheikh Belal Assaad","role":"Preacher and Lecturer","up":"Sheikh Belal Assaad was born in Lebanon and grew up in an environment that valued Islamic knowledge and values. He pursued university studies in Lebanon, obtaining a degree in Islamic Sharia and da‘wah, which provided him with foundations in Qur’an, Sunnah, jurisprudence, and creed.<br><br>He later moved to Australia, where he settled and continued his educational and outreach work. This combination of religious training in the Levant and practical experience with Muslim communities in the West gave him a deep understanding of challenges related to identity, upbringing, and faith in Western contexts.","da":"He is a prominent preacher and lecturer in Australia, active in delivering sermons, lessons, and talks in mosques, Islamic centers, and conferences. His discourse focuses on faith, family building, youth development, and addressing social and psychological challenges from a balanced Islamic perspective.<br><br>His lessons and sermons are widely shared through digital platforms, where he offers practical content that relates to people’s realities and helps them remain steadfast and cultivate good character. He is known for a clear and warm style that addresses different age groups, emphasizing the moderation and comprehensiveness of Islam.","works":["<strong>Lectures and Sermons.</strong>"],"quote":"Religion is not a passing emotion."},"fr":{"title":"Cheikh Belal Assaad","role":"Prédicateur et conférencier","up":"Le cheikh Belal Assaad est né au Liban et a grandi dans un environnement attaché au savoir islamique et aux valeurs religieuses. Il a poursuivi des études universitaires au Liban et obtenu un diplôme en charia et en prédication, acquérant des bases en Coran, Sunna, jurisprudence et croyance.<br><br>Il s’est ensuite installé en Australie, où il a poursuivi son activité éducative et de prédication. Cette combinaison de formation religieuse au Levant et d’expérience auprès des communautés musulmanes en Occident lui a donné une compréhension approfondie des défis liés à l’identité, à l’éducation et à la foi.","da":"Il est un prédicateur et conférencier reconnu en Australie, actif dans les mosquées, centres islamiques et conférences. Son discours porte sur la foi, la construction familiale, l’éducation des jeunes et le traitement des difficultés sociales et psychologiques dans une perspective islamique équilibrée.<br><br>Ses cours et sermons sont largement diffusés sur les plateformes numériques, offrant un contenu pratique proche des réalités des gens et les aidant à persévérer et à cultiver le bon caractère. Il est apprécié pour son style clair et chaleureux, qui s’adresse à tous les âges et met en avant la modération de l’islam.","works":["<strong>Conférences et sermons :</strong> Enseignements diffusés en présentiel et en ligne."],"quote":"La religion n’est pas une émotion passagère."},"es":{"title":"Jeque Belal Assaad","role":"Predicador y conferenciante","up":"El jeque Belal Assaad nació en Líbano y creció en un entorno que valoraba el conocimiento islámico y los valores religiosos. Cursó estudios universitarios en Líbano y obtuvo un título en sharía y divulgación, adquiriendo bases en Corán, Sunnah, jurisprudencia y creencia.<br><br>Posteriormente se trasladó a Australia, donde continuó su labor educativa y de predicación. Esta combinación de formación religiosa en el Levante y experiencia con comunidades musulmanas en Occidente le otorgó una comprensión profunda de los desafíos relacionados con la identidad, la educación y la fe.","da":"Es un predicador y conferenciante destacado en Australia, activo en mezquitas, centros islámicos y conferencias. Su discurso se centra en la fe, la construcción familiar, el desarrollo de los jóvenes y el abordaje de desafíos sociales y psicológicos desde una perspectiva islámica equilibrada.<br><br>Sus lecciones y sermones se difunden ampliamente en plataformas digitales, ofreciendo contenido práctico cercano a la realidad de las personas y ayudándolas a mantenerse firmes y cultivar el buen carácter. Es conocido por un estilo claro y cercano, que enfatiza la moderación y la integralidad del islam.","works":["<strong>Conferencias y sermones:</strong> Enseñanzas difundidas presencialmente y en línea."],"quote":"La religión no es una emoción pasajera."}}},{"id":"adnaan","initials":"ع.م","meta":{"ar":"1980s | بريطانيا","en":"1980s | UK","fr":"1980s | Royaume-Uni","es":"1980s | Reino Unido"},"tags":{"ar":["الاقتصاد"],"en":["Economics"],"fr":["Économie"],"es":["Economía"]},"platforms":["YouTube","Instagram"],"series":{"ar":["التزكية"],"en":["Spirituality"],"fr":["Spiritualité"],"es":["Espiritualidad"]},"tr":{"ar":{"title":"الشيخ عدنان منك","role":"عالم إسلامي","up":"وُلد الشيخ عدنان منك في إنجلترا ونشأ في زيمبابوي ضمن أسرة علمية ودعوية معروفة، وهو ابن شقيق المفتي إسماعيل منك. تلقى تعليمه المبكر في زيمبابوي، ثم التحق بالجامعة الإسلامية بالمدينة المنورة حيث درس اللغة العربية والعلوم الشرعية.<br><br>حصل على درجة البكالوريوس في الشريعة من الجامعة الإسلامية بالمدينة المنورة، ثم تابع دراساته العليا فنال درجة الماجستير في الاقتصاد والتمويل الإسلامي. وقد جمع هذا المسار بين التأصيل الشرعي والمعرفة المعاصرة في المجالات الاقتصادية، مما أضاف بُعدًا تخصصيًا إلى نشاطه الدعوي والعلمي.","da":"يعمل داعية ومحاضرًا إسلاميًا في المملكة المتحدة وخارجها، ويشارك في المؤتمرات والبرامج الدعوية والتربوية الموجهة للشباب والأسر. يركز في دروسه على التزكية، والأخلاق، وبناء الشخصية المسلمة، إلى جانب موضوعات الوعي المالي والاقتصاد الإسلامي من منظور شرعي.<br><br>ينشر محتواه عبر المنصات الرقمية ومحاضراته المرئية، ويحرص على تقديم خطاب هادئ عملي يجمع بين الموعظة الحسنة والفائدة التطبيقية. ويُعرف بأسلوبه القريب من الناس واهتمامه بقضايا المسلمين في الغرب، مسهمًا في تعزيز القيم الإيمانية والاتزان في الحياة المعاصرة.","works":["<strong>محاضرات.</strong>"],"quote":"الامتنان ليس مجرد كلمة."},"en":{"title":"Sheikh Adnaan Menk","role":"Islamic Scholar","up":"Sheikh Adnaan Menk was born in England and raised in Zimbabwe in a well-known scholarly and da‘wah-oriented family; he is the nephew of Mufti Ismail Menk. He received his early education in Zimbabwe and later studied Arabic and Islamic sciences at the Islamic University of Madinah.<br><br>He earned a bachelor’s degree in Sharia from the Islamic University of Madinah and went on to complete a Master’s degree in Islamic economics and finance. This path combined religious foundations with contemporary knowledge in economics, adding a specialized dimension to his scholarly and outreach activities.","da":"He works as an Islamic preacher and lecturer in the United Kingdom and abroad, participating in conferences and educational programs aimed at youth and families. His lessons focus on spiritual refinement, ethics, character building, and topics related to financial awareness and Islamic economics from a Sharia perspective.<br><br>He shares his content through digital platforms and lectures, offering a calm and practical discourse that combines good counsel with applicable guidance. He is known for his approachable style and attention to the concerns of Muslims in the West, contributing to the strengthening of faith-based values and balance in contemporary life.","works":["<strong>Lectures.</strong>"],"quote":"Gratitude is not just a word."},"fr":{"title":"Cheikh Adnaan Menk","role":"Érudit islamique","up":"Le cheikh Adnaan Menk est né en Angleterre et a grandi au Zimbabwe au sein d’une famille connue pour son engagement scientifique et religieux ; il est le neveu du moufti Ismail Menk. Il a reçu sa première éducation au Zimbabwe puis a étudié la langue arabe et les sciences islamiques à l’Université islamique de Médine.<br><br>Il a obtenu une licence en charia à l’Université islamique de Médine, puis un master en économie et finance islamiques. Ce parcours associe fondements religieux et connaissances contemporaines en économie, enrichissant son activité éducative et de prédication.","da":"Il exerce comme prédicateur et conférencier au Royaume-Uni et à l’étranger, participant à des conférences et programmes éducatifs destinés aux jeunes et aux familles. Ses enseignements portent sur la purification spirituelle, l’éthique, la formation du caractère, ainsi que sur la sensibilisation financière et l’économie islamique dans une perspective de la charia.<br><br>Il diffuse ses contenus via les plateformes numériques et ses conférences, proposant un discours calme et pratique alliant conseil et guidance applicable. Il est apprécié pour son style accessible et son attention aux préoccupations des musulmans en Occident, contribuant au renforcement des valeurs et de l’équilibre dans la vie contemporaine.","works":["<strong>Conférences :</strong> Enseignements sur la spiritualité et l’éthique."],"quote":"La gratitude n’est pas seulement un mot."},"es":{"title":"Jeque Adnaan Menk","role":"Erudito islámico","up":"El jeque Adnaan Menk nació en Inglaterra y creció en Zimbabue en una familia conocida por su dedicación al conocimiento y la divulgación; es sobrino del muftí Ismail Menk. Recibió su educación temprana en Zimbabue y luego estudió lengua árabe y ciencias islámicas en la Universidad Islámica de Medina.<br><br>Obtuvo una licenciatura en Sharía en la Universidad Islámica de Medina y posteriormente completó una maestría en economía y finanzas islámicas. Este recorrido combina fundamentos religiosos con conocimientos contemporáneos en economía, aportando una dimensión especializada a su labor educativa y de predicación.","da":"Trabaja como predicador y conferenciante en el Reino Unido y en otros países, participando en conferencias y programas educativos dirigidos a jóvenes y familias. Sus lecciones se centran en la purificación espiritual, la ética, la formación del carácter y temas de conciencia financiera y economía islámica desde una perspectiva de la sharía.<br><br>Comparte sus contenidos a través de plataformas digitales y conferencias, ofreciendo un discurso sereno y práctico que combina consejo y orientación aplicable. Es conocido por su estilo cercano y su atención a las preocupaciones de los musulmanes en Occidente, contribuyendo al fortalecimiento de los valores y el equilibrio en la vida contemporánea.","works":["<strong>Conferencias:</strong> Enseñanzas sobre espiritualidad y ética."],"quote":"La gratitud no es solo una palabra."}}},{"id":"yahya","initials":"ي.ر","meta":{"ar":"1990s | بريطانيا","en":"1990s | UK","fr":"1990s | Royaume-Uni","es":"1990s | Reino Unido"},"tags":{"ar":["القرآن"],"en":["Quran"],"fr":["Coran"],"es":["Corán"]},"platforms":["YouTube","Instagram","TikTok"],"series":{"ar":["تلاوات"],"en":["Recitations"],"fr":["Récitations"],"es":["Recitaciones"]},"tr":{"ar":{"title":"الأستاذ يحيى الرعابي","role":"معلم إسلامي ومقرئ","up":"وُلد الأستاذ يحيى الرعبي في الدنمارك ونشأ في بيئة أوروبية، ثم انتقل إلى المملكة المتحدة حيث استقر وواصل مسيرته التعليمية والدعوية. أتم حفظ القرآن الكريم في سن مبكرة، وتلقى تعليمًا في العلوم الشرعية واللغة العربية على أيدي معلمين ومشايخ متخصصين.<br><br>اشتغل بتعليم القرآن وتحفيظه، وطوّر أدواته في التجويد والتربية الإيمانية، مع اهتمام خاص بمخاطبة الناشئة والشباب في المجتمعات الغربية. وقد ساعده إتقانه للغات وثقافات متعددة على التواصل الفعال مع جمهور متنوع الخلفيات.","da":"يُعرف بوصفه معلمًا للقرآن ومقرئًا ومحاضرًا في برامج إيمانية وتربوية، ويشارك في دورات ومخيمات وأنشطة شبابية في المملكة المتحدة وخارجها. يركز في عمله على ربط القلوب بالقرآن الكريم، وتعليم التلاوة والتدبر، وغرس القيم والأخلاق الإسلامية.<br><br>ينشر تلاواته ودروسه ومقاطع التوجيه عبر منصات التواصل الاجتماعي، حيث لاقت مشاركاته قبولًا واسعًا لدى الشباب والأسر. ويتميز أسلوبه بالجمع بين جمال الأداء القرآني والرسالة التربوية العملية، داعيًا إلى جعل القرآن منهاج حياة ومصدرًا للهداية والسكينة.","works":["<strong>تلاوات قرآنية.</strong>"],"quote":"القرآن إذا دخل القلب، غيّر صاحبه."},"en":{"title":"Ustadh Yahya Raaby","role":"Islamic Teacher and Reciter","up":"Ustadh Yahya Raaby was born in Denmark and grew up in a European environment before moving to the United Kingdom, where he settled and continued his educational and outreach work. He completed memorization of the Qur’an at an early age and received instruction in Islamic sciences and Arabic from specialized teachers and scholars.<br><br>He has worked in Qur’an teaching and memorization, developing his skills in tajweed and faith-based education, with particular attention to addressing youth in Western communities. His familiarity with multiple languages and cultures has helped him communicate effectively with diverse audiences.","da":"He is known as a Qur’an teacher, reciter, and speaker in faith-based and educational programs, participating in courses, camps, and youth activities in the UK and abroad. His work focuses on connecting hearts to the Qur’an, teaching recitation and reflection, and instilling Islamic values and character.<br><br>He shares his recitations, lessons, and guidance through social media platforms, where his contributions have been well received by youth and families. His style combines beautiful Qur’anic recitation with practical educational messages, encouraging people to make the Qur’an a guide for life and a source of tranquility.","works":["<strong>Quranic Recitations.</strong>"],"quote":"When the Quran enters the heart, it changes its owner."},"fr":{"title":"Oustadh Yahya Raaby","role":"Enseignant islamique et récitant du Coran","up":"L’oustadh Yahya Raaby est né au Danemark et a grandi dans un environnement européen avant de s’installer au Royaume-Uni, où il a poursuivi son activité éducative et de prédication. Il a mémorisé le Coran très jeune et a reçu une formation en sciences islamiques et en langue arabe auprès d’enseignants spécialisés.<br><br>Il a travaillé dans l’enseignement et la mémorisation du Coran, développant ses compétences en tajwid et en éducation spirituelle, avec une attention particulière aux jeunes des communautés occidentales. Sa maîtrise de plusieurs langues et cultures lui permet de communiquer efficacement avec des publics variés.","da":"Il est connu comme enseignant du Coran, récitant et conférencier dans des programmes éducatifs et spirituels, participant à des cours, camps et activités pour la jeunesse au Royaume-Uni et ailleurs. Son travail vise à rapprocher les cœurs du Coran, à enseigner la récitation et la méditation, et à transmettre les valeurs islamiques.<br><br>Il diffuse ses récitations, leçons et conseils sur les réseaux sociaux, où ses contributions sont appréciées des jeunes et des familles. Son style allie beauté de la récitation coranique et message éducatif pratique, invitant à faire du Coran un guide de vie et une source de sérénité.","works":["<strong>Récitations coraniques :</strong> Enregistrements et enseignements."],"quote":"Quand le Coran entre dans le cœur, il transforme celui qui le porte."},"es":{"title":"Ustadh Yahya Raaby","role":"Profesor islámico y recitador del Corán","up":"El ustadh Yahya Raaby nació en Dinamarca y creció en un entorno europeo antes de trasladarse al Reino Unido, donde continuó su labor educativa y de divulgación. Completó la memorización del Corán a temprana edad y recibió formación en ciencias islámicas y lengua árabe con maestros especializados.<br><br>Ha trabajado en la enseñanza y memorización del Corán, desarrollando sus habilidades en taywid y educación espiritual, con especial atención a los jóvenes en comunidades occidentales. Su conocimiento de varios idiomas y culturas le permite comunicarse eficazmente con audiencias diversas.","da":"Es conocido como profesor del Corán, recitador y conferenciante en programas educativos y espirituales, participando en cursos, campamentos y actividades juveniles en el Reino Unido y otros lugares. Su trabajo se centra en acercar los corazones al Corán, enseñar la recitación y la reflexión, e inculcar valores islámicos.<br><br>Comparte sus recitaciones, lecciones y consejos en redes sociales, donde sus aportes son bien recibidos por jóvenes y familias. Su estilo combina la belleza de la recitación coránica con mensajes educativos prácticos, animando a hacer del Corán una guía de vida y fuente de tranquilidad.","works":["<strong>Recitaciones coránicas:</strong> Grabaciones y enseñanzas."],"quote":"Cuando el Corán entra en el corazón, transforma a quien lo lleva."}}},{"id":"abdelkafy","initials":"ع.ع","meta":{"ar":"1951 | مصر","en":"1951 | Egypt","fr":"1951 | Égypte","es":"1951 | Egipto"},"tags":{"ar":["الإعجاز العلمي"],"en":["Scientific Miracles"],"fr":["Miracles Scientifiques"],"es":["Milagros Científicos"]},"platforms":["YouTube","Facebook"],"series":{"ar":["الإعجاز العلمي"],"en":["Scientific Miracles"],"fr":["Miracles scientifiques"],"es":["Milagros científicos"]},"tr":{"ar":{"title":"فضيلة الشيخ الدكتور عمر عبد الكافي","role":"داعية","up":"وُلد الشيخ الدكتور عمر عبد الكافي في محافظة المنيا بصعيد مصر عام 1951م، ونشأ في بيئة ريفية محافظة. درس في كلية الزراعة بجامعة المنيا وتخرّج فيها، ثم اتجه إلى العمل الدعوي والاهتمام بالعلوم الشرعية، فجمع بين تكوينه الأكاديمي ودراسته للقرآن والسنة.<br><br>حفظ أجزاء كبيرة من القرآن الكريم واهتم بتدبر آياته، ولا سيما ما يتعلق بالكون والإنسان والحياة. وقد أسهمت خلفيته العلمية في الزراعة والعلوم الطبيعية في صقل اهتمامه بموضوعات الإعجاز والربط بين الآيات الكونية والقرآنية.","da":"اشتهر على نطاق واسع في العالم العربي ببرامجه ومحاضراته التلفزيونية والمرئية التي تناولت قضايا الإيمان والأخلاق والإعجاز العلمي في القرآن والسنة. قدّم سلاسل وبرامج عديدة عُرضت على قنوات فضائية مختلفة، وحظيت بمتابعة جماهيرية كبيرة لعقود.<br><br>يركز في خطابه على تربية النفس، وتقوية الصلة بالله، وتقديم القدوة الحسنة، مع أسلوب وعظي قصصي قريب من الناس. وأسهمت رحلاته الدعوية ومحاضراته داخل مصر وخارجها في نشر الوعي الديني والأخلاقي، وجعلته من الوجوه الدعوية المعروفة لدى أجيال متعددة من المشاهدين.","works":["<strong>موسوعة الإعجاز العلمي.</strong>"],"quote":"العلم الصحيح يزيد المؤمن إيماناً."},"en":{"title":"Sheikh Dr. Omar Abdelkafy","role":"Preacher","up":"Sheikh Dr. Omar Abdelkafy was born in Minya Governorate in Upper Egypt in 1951 and grew up in a conservative rural environment. He studied at the Faculty of Agriculture at Minya University, then turned to da‘wah and the study of Islamic sciences, combining his academic background with learning the Qur’an and Sunnah.<br><br>He memorized large portions of the Qur’an and devoted attention to reflecting on its verses, particularly those relating to the universe, humanity, and life. His scientific background in agriculture and natural sciences contributed to his interest in topics linking Qur’anic verses with signs in creation.","da":"He became widely known in the Arab world for his television programs and lectures addressing faith, ethics, and signs of creation in the Qur’an and Sunnah. He presented numerous series broadcast on various satellite channels, gaining a large audience over decades.<br><br>His discourse focuses on self-purification, strengthening one’s relationship with God, and offering moral guidance in an accessible, story-based style. His preaching tours and lectures inside and outside Egypt have contributed to spreading religious and ethical awareness, making him a familiar figure to multiple generations of viewers.","works":["<strong>Encyclopedia of Scientific Miracles.</strong>"],"quote":"Correct science increases a believer's faith."},"fr":{"title":"Cheikh Dr Omar Abdelkafy","role":"Prédicateur","up":"Le cheikh Dr Omar Abdelkafy est né dans le gouvernorat de Minya en Haute-Égypte en 1951 et a grandi dans un milieu rural conservateur. Il a étudié à la faculté d’agriculture de l’Université de Minya, puis s’est orienté vers la prédication et l’étude des sciences islamiques, associant sa formation académique à l’apprentissage du Coran et de la Sunna.<br><br>Il a mémorisé une grande partie du Coran et s’est attaché à la méditation de ses versets, notamment ceux relatifs à l’univers et à la vie. Sa formation scientifique en agriculture et en sciences naturelles a nourri son intérêt pour les thèmes reliant les versets coraniques aux signes de la création.","da":"Il est devenu très connu dans le monde arabe grâce à ses émissions et conférences télévisées traitant de la foi, de l’éthique et des signes dans la création. Il a présenté de nombreuses séries diffusées sur diverses chaînes satellitaires, touchant un large public pendant des décennies.<br><br>Son discours met l’accent sur la purification de l’âme, le renforcement du lien avec Dieu et la guidance morale dans un style accessible et narratif. Ses tournées et conférences en Égypte et à l’étranger ont contribué à diffuser une conscience religieuse et éthique auprès de plusieurs générations.","works":["<strong>Encyclopédie des miracles scientifiques :</strong> Travaux sur les signes dans le Coran."],"quote":"La science correcte renforce la foi du croyant."},"es":{"title":"Jeque Dr. Omar Abdelkafy","role":"Predicador","up":"El jeque Dr. Omar Abdelkafy nació en la gobernación de Minya, en el Alto Egipto, en 1951 y creció en un entorno rural conservador. Estudió en la Facultad de Agricultura de la Universidad de Minya y luego se orientó hacia la predicación y el estudio de las ciencias islámicas, combinando su formación académica con el aprendizaje del Corán y la Sunnah.<br><br>Memorizó gran parte del Corán y se dedicó a reflexionar sobre sus versículos, especialmente los relacionados con el universo y la vida. Su formación científica en agricultura y ciencias naturales contribuyó a su interés por los temas que vinculan los versículos coránicos con los signos de la creación.","da":"Se hizo ampliamente conocido en el mundo árabe por sus programas y conferencias televisivas sobre fe, ética y signos en la creación. Presentó numerosas series emitidas en distintos canales satelitales, llegando a una gran audiencia durante décadas.<br><br>Su discurso se centra en la purificación del alma, el fortalecimiento del vínculo con Dios y la orientación moral en un estilo accesible y narrativo. Sus giras y conferencias dentro y fuera de Egipto han contribuido a difundir la conciencia religiosa y ética entre varias generaciones.","works":["<strong>Enciclopedia de los milagros científicos:</strong> Obras sobre los signos en el Corán."],"quote":"La ciencia correcta aumenta la fe del creyente."}}},{"id":"huwaini","initials":"أ.ح","meta":{"ar":"1956–2025 | مصر","en":"1956–2025 | Egypt","fr":"1956–2025 | Égypte","es":"1956–2025 | Egipto"},"tags":{"ar":["الحديث","الفقه الشافعي"],"en":["Hadith","Shafi'i Fiqh"],"fr":["Hadith","Fiqh Chaféite"],"es":["Hadiz","Fiqh Shafií"]},"platforms":["YouTube","Facebook"],"series":{"ar":["فضفضة","أصداف اللؤلؤ"],"en":["Fadfada","Asdaf al-Lu'lu'"],"fr":["Fadfada","Asdaf al-Lu’lu’"],"es":["Fadfada","Asdaf al-Lu’lu’"]},"tr":{"ar":{"title":"فضيلة الشيخ أبو إسحاق الحويني","role":"محدّث وداعية مصري","up":"وُلد الشيخ أبو إسحاق الحويني (حجازي محمد يوسف شريف) يوم 10 يونيو 1956م في قرية حوِين بمحافظة كفر الشيخ في مصر. تخرّج في كلية الألسن بجامعة عين شمس بقسم اللغة الإسبانية بترتيب متقدم، غير أن شغفه بالعلم الشرعي غلب عليه منذ وقت مبكر، فبدأ رحلته في طلب العلم على يد علماء ومشايخ بلده.<br><br>تلقى القرآن الكريم على خاله الشيخ عبد الحي زيان، ودرس على الشيخ محمد نجيب المطيعي، ثم رحل إلى الأردن والسعودية حيث لازم الشيخ المحدّث محمد ناصر الدين الألباني وتأثر بمنهجه في تحقيق الأحاديث وتمييز صحيحها من ضعيفها. كما حضر دروس عدد من كبار العلماء مثل الشيخ عبد العزيز بن باز والشيخ محمد بن عثيمين والشيخ عبد الله بن جبرين، فاستفاد من مدرستهم الحديثية والفقهية.","da":"يُعد من أبرز علماء الحديث والدعاة في مصر والعالم العربي في العقود الأخيرة، واشتهر بعنايته بنشر السنة النبوية والتحذير من البدع والخرافات. تولّى الخطابة وإلقاء الدروس في مساجد كفر الشيخ، وقدّم برامج ودروسًا علمية عبر القنوات الفضائية والمنصات الرقمية، من أشهرها برنامج «فضفضة».<br><br>خلّف إنتاجًا علميًا ودعويًا واسعًا في تحقيق الأحاديث وشرحها والتربية على منهج أهل السنة والجماعة، مع اهتمام بالفقه الشافعي والآداب الشرعية. وقد أثّر خطابه في شريحة واسعة من طلاب العلم ومحبي السنة، وتوفي في الدوحة يوم 17 مارس 2025م بعد مسيرة طويلة في التعليم والدعوة، تاركًا أثرًا علميًا ودعويًا ممتدًا.","works":["<strong>فصل الخطاب بنقد المغني عن الحفظ والكتاب</strong> (1985)","<strong>الانشراح في آداب النكاح</strong> (1987)","<strong>النافلة في الأحاديث الضعيفة والباطلة</strong> (1988)"],"quote":"دراستي لكتاب «السلسلة الضعيفة» مدة سنتين أيام الجامعة كانت أعظم فائدة من كل سني التحصيل العلمي الأخرى."},"en":{"title":"Sheikh Abu Ishaq al-Huwaini","role":"Egyptian Hadith scholar and preacher","up":"Sheikh Abu Ishaq al-Huwaini (Hijazi Muhammad Yusuf Sharif) was born on 10 June 1956 in the village of Huwain, Kafr El-Sheikh, Egypt. He graduated from the Faculty of Al-Alsun at Ain Shams University in the Spanish Department with distinction, but his passion for Islamic knowledge led him early to seek religious learning under scholars in Egypt.<br><br>He studied the Qur’an with his uncle Sheikh Abdul Hayy Zayyan and learned under Sheikh Muhammad Najib al-Muti‘i. He later traveled to Jordan and Saudi Arabia, where he closely accompanied the hadith scholar Muhammad Nasir al-Din al-Albani and was deeply influenced by his methodology in hadith verification. He also attended lessons of senior scholars such as Ibn Baz, Ibn Uthaymeen, and Ibn Jibrin, benefiting from their hadith and juristic scholarship.","da":"He became one of the most prominent hadith scholars and preachers in Egypt and the Arab world in recent decades, known for his dedication to spreading the Sunnah and warning against innovations and superstitions. He delivered sermons and lessons in mosques in Kafr El-Sheikh and presented scholarly programs through satellite channels and digital platforms, including “Fadfada.”<br><br>He left a wide scholarly and educational legacy in hadith verification, explanation, and nurturing upon the methodology of Ahl al-Sunnah, with attention to Shafi‘i jurisprudence and Islamic manners. His discourse influenced many students of knowledge and lovers of the Sunnah. He passed away in Doha on 17 March 2025 after a long life in teaching and da‘wah, leaving a lasting scholarly and spiritual impact.","works":["<strong>Fasl al-Khitab: A Critique of al-Mughni</strong> (1985)","<strong>Al-Inshirah fi Adab al-Nikah</strong> (1987)","<strong>Al-Nafila fi al-Ahadith al-Da'ifa wa al-Batila</strong> (1988)"],"quote":"My study of al-Albani's 'Silsilat al-Da'ifa' for two years during university was more beneficial to me than all my other years of study."},"fr":{"title":"Cheikh Abou Ishaq al-Houwayni","role":"Spécialiste du hadith et prédicateur égyptien","up":"Le cheikh Abou Ishaq al-Houwayni (Hijazi Muhammad Yusuf Sharif) est né le 10 juin 1956 dans le village de Houwayn, dans le gouvernorat de Kafr el-Cheikh en Égypte. Diplômé avec distinction du département d’espagnol de la faculté Al-Alsun à l’Université Ain Shams, il s’est très tôt orienté vers l’étude des sciences islamiques auprès de savants de son pays.<br><br>Il a appris le Coran auprès de son oncle, le cheikh Abdul Hayy Zayyan, et étudié avec le cheikh Muhammad Najib al-Muti‘i. Il a ensuite voyagé en Jordanie et en Arabie saoudite, où il a accompagné le muhaddith Muhammad Nasir al-Din al-Albani et bénéficié de sa méthode de vérification des hadiths. Il a également suivi les enseignements de grands savants tels qu’Ibn Baz, Ibn Uthaymin et Ibn Jibrin.","da":"Il est devenu l’un des plus éminents spécialistes du hadith et prédicateurs d’Égypte et du monde arabe, reconnu pour son attachement à la diffusion de la Sunna et à la mise en garde contre les innovations. Il a donné des sermons et des cours dans les mosquées de Kafr el-Cheikh et présenté des programmes scientifiques sur les chaînes satellitaires et les plateformes numériques, dont « Fadfada ».<br><br>Il a laissé un important héritage dans la vérification et l’explication des hadiths, ainsi que dans l’éducation selon la voie des gens de la Sunna, avec un intérêt pour le fiqh chaféite et les bonnes mœurs. Son discours a marqué de nombreux étudiants. Il est décédé à Doha le 17 mars 2025, laissant un héritage scientifique et spirituel durable.","works":["<strong>Fasl al-Khitab : critique d’al-Mughni</strong> (1985).","<strong>Al-Inshirah fi adab al-nikah</strong> (1987).","<strong>Al-Nafila fi al-ahadith al-da‘ifa wa al-batila</strong> (1988)."],"quote":"Mon étude de la « Silsila al-Da‘ifa » d’al-Albani pendant deux ans à l’université m’a été plus bénéfique que toutes mes autres années d’études."},"es":{"title":"Jeque Abu Ishaq al-Huwaini","role":"Especialista en hadiz y predicador egipcio","up":"El jeque Abu Ishaq al-Huwaini (Hijazi Muhammad Yusuf Sharif) nació el 10 de junio de 1956 en la aldea de Huwain, en la gobernación de Kafr el-Sheij (Egipto). Se graduó con distinción en el Departamento de Español de la Facultad de Al-Alsun de la Universidad Ain Shams, pero desde temprano se orientó hacia el estudio de las ciencias islámicas con eruditos de su país.<br><br>Estudió el Corán con su tío, el jeque Abdul Hayy Zayyan, y aprendió con el jeque Muhammad Najib al-Muti‘i. Más tarde viajó a Jordania y Arabia Saudita, donde acompañó al muhaddiz Muhammad Nasir al-Din al-Albani y se benefició de su metodología en la verificación de hadices. También asistió a lecciones de grandes eruditos como Ibn Baz, Ibn Uzaimin e Ibn Yibrin.","da":"Se convirtió en uno de los especialistas en hadiz y predicadores más destacados de Egipto y del mundo árabe, conocido por su dedicación a difundir la Sunnah y advertir contra las innovaciones. Impartió sermones y clases en mezquitas de Kafr el-Sheij y presentó programas científicos en canales satelitales y plataformas digitales, incluido «Fadfada».<br><br>Dejó un amplio legado en la verificación y explicación de hadices y en la educación según la metodología de Ahl al-Sunnah, con atención al fiqh shafií y la ética islámica. Su discurso influyó en muchos estudiantes de conocimiento. Falleció en Doha el 17 de marzo de 2025, dejando un impacto científico y espiritual duradero.","works":["<strong>Fasl al-Khitab: crítica de al-Mughni</strong> (1985).","<strong>Al-Inshirah fi adab al-nikah</strong> (1987).","<strong>Al-Nafila fi al-ahadith al-da‘ifa wa al-batila</strong> (1988)."],"quote":"Mi estudio de la «Silsila al-Da‘ifa» de al-Albani durante dos años en la universidad fue más beneficioso que todos mis otros años de estudio."}}},{"id":"yaqoubi","initials":"م.ي","meta":{"ar":"1963 | سوريا","en":"1963 | Syria","fr":"1963 | Syrie","es":"1963 | Siria"},"tags":{"ar":["الحديث"],"en":["Hadith"],"fr":["Hadith"],"es":["Hadiz"]},"platforms":["YouTube","Facebook"],"series":{"ar":["دروس الحديث"],"en":["Hadith Lessons"],"fr":["Leçons de hadith"],"es":["Lecciones de hadiz"]},"tr":{"ar":{"title":"الشيخ الدكتور محمد أبو الهدى اليعقوبي","role":"عالم إسلامي","up":"وُلد الشيخ الدكتور محمد أبو الهدى اليعقوبي في دمشق بسوريا عام 1963م، ونشأ في بيت علم وفضل؛ فوالده الشيخ إبراهيم اليعقوبي وجدّه من علماء الشام المعروفين. تلقى علومه الأولى على يد والده وكبار علماء دمشق، فحفظ قدرًا من القرآن ودرس العربية والفقه والحديث والعقيدة في حلقات العلم التقليدية.<br><br>تابع دراساته الأكاديمية في جامعة دمشق حيث درس الفقه وأصوله، ثم واصل تحصيله العلمي في عدد من المؤسسات والبلدان، وحصل على تدريب متقدم في العلوم الشرعية واللغة العربية. وقد جمع في تكوينه بين الإرث العلمي الشامي الأصيل والانفتاح على البحث الأكاديمي المعاصر.","da":"اشتهر بوصفه عالمًا في الحديث والفقه والتصوف السني، وله نشاط دعوي وتعليمي واسع في سوريا وخارجها. ألقى دروسًا وخطبًا ومحاضرات في مساجد ومراكز علمية ومؤتمرات دولية، وشارك في برامج حوارية وتعليمية تناولت قضايا العقيدة والسلوك والاجتماع الإسلامي.<br><br>يُعرف بخطابه الذي يدعو إلى الاعتدال والرحمة وصيانة السلم المجتمعي، مع التأكيد على المنهج العلمي في طلب العلم والتحقق. وله مؤلفات ودروس مطولة في علوم الحديث والسيرة والفقه، وأسهم في تعليم أجيال من الطلبة داخل الشام وفي بلدان المهجر عبر الدروس المباشرة والمنصات الرقمية.","works":["<strong>مؤلفات في الحديث.</strong>"],"quote":"العلم النافع هو الذي يزيدك تواضعاً."},"en":{"title":"Sheikh Dr. Muhammad Abu al-Huda al-Yaqoubi","role":"Islamic Scholar","up":"Sheikh Dr. Muhammad Abu al-Huda al-Yaqoubi was born in Damascus, Syria, in 1963 into a family of scholarship and virtue; his father, Sheikh Ibrahim al-Yaqoubi, and his grandfather were among the well-known scholars of the Levant. He received his early education from his father and senior scholars of Damascus, studying Arabic, jurisprudence, hadith, and creed in traditional learning circles.<br><br>He pursued academic studies at the University of Damascus in jurisprudence and its principles, and continued his scholarly training in various institutions and countries. His formation combined the authentic scholarly heritage of the Levant with engagement in contemporary academic study.","da":"He became known as a scholar of hadith, jurisprudence, and Sunni spirituality, with wide educational and outreach activity in Syria and abroad. He delivered lessons, sermons, and lectures in mosques, scholarly centers, and international conferences, and participated in educational programs addressing creed, ethics, and social issues.<br><br>He is recognized for a discourse that calls for moderation, compassion, and the preservation of social harmony, while emphasizing scholarly rigor in seeking knowledge. He has authored works and taught extensively in hadith sciences, Prophetic biography, and jurisprudence, contributing to the education of students in the Levant and in the diaspora through direct teaching and digital platforms.","works":["<strong>Books on Hadith.</strong>"],"quote":"Beneficial knowledge is what increases your humility."},"fr":{"title":"Cheikh Dr Muhammad Abou al-Houda al-Yaqoubi","role":"Érudit islamique","up":"Le cheikh Dr Muhammad Abou al-Houda al-Yaqoubi est né à Damas (Syrie) en 1963 dans une famille de science et de vertu ; son père, le cheikh Ibrahim al-Yaqoubi, et son grand-père comptaient parmi les savants renommés du Levant. Il a reçu sa première formation auprès de son père et des grands savants damascènes, étudiant l’arabe, le fiqh, le hadith et la croyance dans les cercles traditionnels.<br><br>Il a poursuivi des études académiques à l’Université de Damas en fiqh et en fondements du droit, et a continué sa formation dans diverses institutions et pays. Son parcours associe l’héritage savant du Levant à une ouverture sur la recherche contemporaine.","da":"Il est connu comme érudit en hadith, en jurisprudence et en spiritualité sunnite, avec une activité éducative et de prédication en Syrie et à l’étranger. Il a donné des cours, sermons et conférences dans des mosquées, centres scientifiques et rencontres internationales, abordant la croyance, l’éthique et les questions sociales.<br><br>Son discours appelle à la modération, à la miséricorde et à la préservation de la cohésion sociale, tout en insistant sur la rigueur scientifique dans la quête du savoir. Auteur d’ouvrages et enseignant en sciences du hadith, en biographie prophétique et en fiqh, il a contribué à la formation d’étudiants au Levant et dans la diaspora.","works":["<strong>Ouvrages sur le hadith :</strong> Travaux en sciences du hadith et enseignements."],"quote":"La science utile est celle qui accroît ton humilité."},"es":{"title":"Jeque Dr. Muhammad Abu al-Huda al-Yaqoubi","role":"Erudito islámico","up":"El jeque Dr. Muhammad Abu al-Huda al-Yaqoubi nació en Damasco (Siria) en 1963 en una familia de conocimiento y virtud; su padre, el jeque Ibrahim al-Yaqoubi, y su abuelo fueron destacados eruditos del Levante. Recibió su formación inicial de su padre y de grandes eruditos damascenos, estudiando árabe, jurisprudencia, hadiz y creencia en círculos tradicionales.<br><br>Cursó estudios académicos en la Universidad de Damasco en jurisprudencia y sus fundamentos, y continuó su formación en diversas instituciones y países. Su trayectoria combina la herencia académica del Levante con la apertura al estudio contemporáneo.","da":"Es conocido como erudito en hadiz, jurisprudencia y espiritualidad suní, con una amplia actividad educativa y de divulgación en Siria y en el extranjero. Ha impartido clases, sermones y conferencias en mezquitas, centros académicos y encuentros internacionales, abordando la creencia, la ética y cuestiones sociales.<br><br>Su discurso promueve la moderación, la misericordia y la cohesión social, al tiempo que enfatiza el rigor académico en la búsqueda del conocimiento. Autor de obras y docente en ciencias del hadiz, biografía profética y jurisprudencia, ha contribuido a la formación de estudiantes en el Levante y en la diáspora.","works":["<strong>Libros sobre el hadiz:</strong> Obras y enseñanzas en ciencias del hadiz."],"quote":"El conocimiento beneficioso es el que aumenta tu humildad."}}},{"id":"benhamza","initials":"م.ب","meta":{"ar":"1949 | المغرب","en":"1949 | Morocco","fr":"1949 | Maroc","es":"1949 | Marruecos"},"tags":{"ar":["الفقه المالكي","الدراسات الإسلامية"],"en":["Maliki Fiqh","Islamic Studies"],"fr":["Fiqh Malékite","Études Islamiques"],"es":["Fiqh Malikí","Estudios Islámicos"]},"platforms":["YouTube","Website"],"series":{"ar":["الدروس الحسنية الرمضانية","برامج الفتوى"],"en":["Ramadan Hassanian Lectures","Fatwa Programs"],"fr":["Conférences hassaniennes de Ramadan","Programmes de fatwa"],"es":["Conferencias hasaníes de Ramadán","Programas de fatwas"]},"tr":{"ar":{"title":"العلامة مصطفى بن حمزة","role":"عالم دين وباحث وأكاديمي، رئيس المجلس العلمي الجهوي لجهة الشرق","up":"وُلد العلامة مصطفى بن حمزة في مدينة وجدة بالمغرب يوم 17 يوليوز 1949م (21 رمضان 1368هـ). تلقى تعليمه الأولي في مسقط رأسه، ثم انتقل إلى طلب العلم في كبريات المؤسسات المغربية، فحصل على الإجازة في الشريعة من كلية الشريعة بفاس (جامعة القرويين)، والإجازة في الأدب العربي من كلية الآداب بالرباط (جامعة محمد الخامس).<br><br>واصل دراساته العليا فنال دبلوم الدراسات العليا من دار الحديث الحسنية وجامعة محمد الخامس، ثم تُوّج مساره العلمي بالحصول على الدكتوراه الدولة من جامعة محمد الأول بوجدة. وقد منحته هذه الرحلة الأكاديمية الطويلة تكوينًا راسخًا يجمع بين علوم الشريعة وأصولها واللغة العربية وآدابها.","da":"تبوّأ مكانة علمية ومؤسسية بارزة، حيث يشغل منصب رئيس المجلس العلمي الجهوي لجهة الشرق بالمغرب، وهو عضو في المجلس العلمي الأعلى ومؤسسة محمد السادس للعلماء الأفارقة ومجلس حكماء المسلمين. كما تولّى إدارة معهد البعث الإسلامي للعلوم الشرعية بوجدة وعمل أستاذًا للتعليم العالي بجامعة محمد الأول.<br><br>أسهم في البحث العلمي والتأليف في الفقه المالكي واللغة العربية والقضايا الاجتماعية، وشارك في اللجان العلمية والاستشارية، ومن أبرز جهوده مشاركته في اللجنة الملكية الاستشارية لمراجعة مدونة الأسرة. عُرف أيضًا بمبادراته الخيرية والاجتماعية في الجهة الشرقية، وبخطاب علمي معتدل يجمع بين الأصالة والانفتاح على قضايا العصر.","works":["<strong>حقوق المعوقين في الإسلام</strong> (1993): دراسة رائدة تبرز عناية التشريع الإسلامي بذوي الاحتياجات الخاصة وحفظ كرامتهم.","<strong>نظرية العامل في النحو العربي</strong> (2004): بحث لغوي أكاديمي يتناول أصول التقعيد النحوي.","<strong>شخصية الفقه المالكي:</strong> كتاب يوضح خصائص المذهب المالكي ومرونته في مراعاة المصالح والأعراف.","<strong>الأسس الثقافية لمنع تطبيق الشريعة:</strong> مؤلف يناقش الإشكالات الفكرية والثقافية المرتبطة بتنزيل الأحكام الشرعية."]},"en":{"title":"Allama Mustapha Ben Hamza","role":"Islamic scholar, researcher and academic; President of the Regional Scientific Council of the Oriental Region","up":"Allama Mustapha Ben Hamza was born in Oujda, Morocco, on 17 July 1949 (21 Ramadan 1368 AH). He received his early education in his hometown and then pursued higher studies at major Moroccan institutions, earning a degree in Sharia from the Faculty of Sharia in Fez (Al-Qarawiyyin University) and a degree in Arabic literature from the Faculty of Letters in Rabat (Mohammed V University).<br><br>He continued his graduate studies, obtaining a postgraduate diploma from Dar al-Hadith al-Hassania and Mohammed V University, and crowned his academic journey with a State Doctorate from Mohammed I University in Oujda. This long academic path gave him a solid formation combining Islamic sciences, jurisprudential principles, and Arabic language and literature.","da":"He has held prominent scholarly and institutional positions, serving as President of the Regional Scientific Council of the Oriental Region in Morocco, and as a member of the Supreme Scientific Council, the Mohammed VI Foundation for African Scholars, and the Council of Muslim Elders. He also directed the Al-Baath Islamic Institute for Sharia Sciences in Oujda and worked as a professor of higher education at Mohammed I University.<br><br>He has contributed to research and authorship in Maliki fiqh, Arabic language, and social issues, and participated in scholarly and advisory committees, including the Royal Consultative Commission for the revision of the Family Code. He is also known for charitable and social initiatives in the Oriental region and for a moderate scholarly discourse that combines authenticity with engagement in contemporary issues.","works":["<strong>Rights of Persons with Disabilities in Islam</strong> (1993): A pioneering study highlighting Islamic law's care for people with special needs and preservation of their dignity.","<strong>The Theory of the Operator in Arabic Grammar</strong> (2004): An academic linguistic study of the foundations of grammatical rules.","<strong>The Character of Maliki Fiqh:</strong> A book explaining the features of the Maliki school and its flexibility in considering interests and customs.","<strong>The Cultural Foundations Preventing the Application of Sharia:</strong> A work discussing the intellectual and cultural issues related to implementing Islamic rulings."]},"fr":{"title":"Allama Mustapha Ben Hamza","role":"Érudit, chercheur et universitaire ; président du Conseil scientifique régional de l’Oriental","up":"L’allama Mustapha Ben Hamza est né à Oujda (Maroc) le 17 juillet 1949 (21 ramadan 1368 H). Il a reçu sa formation initiale dans sa ville natale, puis a poursuivi ses études dans de grandes institutions marocaines, obtenant une licence en charia à la faculté de charia de Fès (Université Al Quaraouiyine) et une licence en littérature arabe à la faculté des lettres de Rabat (Université Mohammed V).<br><br>Il a poursuivi ses études supérieures avec un diplôme de troisième cycle à Dar al-Hadith al-Hassania et à l’Université Mohammed V, avant d’obtenir un doctorat d’État à l’Université Mohammed Premier d’Oujda. Ce parcours académique lui a conféré une solide formation en sciences islamiques, fondements du droit et langue arabe.","da":"Il a occupé des fonctions scientifiques et institutionnelles importantes, notamment la présidence du Conseil scientifique régional de la région de l’Oriental, et il est membre du Conseil scientifique supérieur, de la Fondation Mohammed VI des oulémas africains et du Conseil des sages musulmans. Il a également dirigé l’Institut islamique Al-Baath des sciences de la charia à Oujda et enseigné comme professeur à l’Université Mohammed Premier.<br><br>Il a contribué à la recherche et à l’écriture en fiqh malikite, en langue arabe et sur des questions sociales, et participé à des commissions scientifiques et consultatives, dont la Commission royale consultative pour la révision du Code de la famille. Il est également connu pour ses initiatives caritatives et sociales et pour un discours scientifique modéré alliant authenticité et ouverture.","works":["<strong>Droits des personnes en situation de handicap en islam</strong> (1993) : Étude sur la prise en charge et la dignité dans la charia.","<strong>La théorie de l’opérateur en grammaire arabe</strong> (2004) : Étude linguistique académique.","<strong>Le caractère du fiqh malikite :</strong> Ouvrage sur les spécificités de l’école malikite.","<strong>Les fondements culturels empêchant l’application de la charia :</strong> Réflexion sur les questions intellectuelles et culturelles."]},"es":{"title":"Allama Mustapha Ben Hamza","role":"Erudito, investigador y académico; presidente del Consejo Científico Regional de la Región Oriental","up":"El allama Mustapha Ben Hamza nació en Uchda (Marruecos) el 17 de julio de 1949 (21 de Ramadán de 1368 H). Recibió su educación inicial en su ciudad natal y luego continuó sus estudios en importantes instituciones marroquíes, obteniendo una licenciatura en Sharía en la Facultad de Sharía de Fez (Universidad Al-Qarawiyyin) y una licenciatura en literatura árabe en la Facultad de Letras de Rabat (Universidad Mohammed V).<br><br>Prosiguió sus estudios de posgrado con un diploma en Dar al-Hadith al-Hassania y la Universidad Mohammed V, y culminó su trayectoria con un doctorado estatal en la Universidad Mohammed I de Uchda. Este recorrido académico le brindó una sólida formación en ciencias islámicas, fundamentos jurídicos y lengua árabe.","da":"Ha ocupado destacados cargos académicos e institucionales, entre ellos la presidencia del Consejo Científico Regional de la Región Oriental de Marruecos, y es miembro del Consejo Científico Supremo, la Fundación Mohammed VI de Ulemas Africanos y el Consejo de Sabios Musulmanes. También dirigió el Instituto Islámico Al-Baath de Ciencias de la Sharía en Uchda y fue profesor de educación superior en la Universidad Mohammed I.<br><br>Ha contribuido a la investigación y la autoría en fiqh malikí, lengua árabe y cuestiones sociales, y ha participado en comités científicos y consultivos, incluida la Comisión Consultiva Real para la revisión del Código de Familia. También es conocido por sus iniciativas benéficas y sociales y por un discurso académico moderado que combina autenticidad y apertura.","works":["<strong>Derechos de las personas con discapacidad en el islam</strong> (1993): Estudio sobre la dignidad y el cuidado en la sharía.","<strong>La teoría del operador en la gramática árabe</strong> (2004): Estudio lingüístico académico.","<strong>El carácter del fiqh malikí:</strong> Obra sobre las características de la escuela malikí.","<strong>Los fundamentos culturales que impiden la aplicación de la sharía:</strong> Reflexión sobre cuestiones intelectuales y culturales."]}}},{"id":"philips","initials":"ب.ف","meta":{"ar":"1947 | كندا","en":"1947 | Canada","fr":"1947 | Canada","es":"1947 | Canadá"},"tags":{"ar":["العقيدة"],"en":["Aqeedah"],"fr":["Aqidah"],"es":["Aqidah"]},"platforms":["YouTube","Facebook"],"series":{"ar":["دورات العقيدة"],"en":["Aqeedah Courses"],"fr":["Cours de ‘aqida"],"es":["Cursos de ‘aqida"]},"tr":{"ar":{"title":"الدكتور بلال فيليبس","role":"عالم إسلامي","up":"وُلد الدكتور بلال فيليبس في جامايكا عام 1947م ونشأ في كندا حيث تلقى تعليمه العام. اعتنق الإسلام عام 1972م، ثم سافر إلى المملكة العربية السعودية لطلب العلم الشرعي، فالتحق بالجامعة الإسلامية بالمدينة المنورة.<br><br>حصل على درجة البكالوريوس في أصول الدين من كلية الدعوة وأصول الدين بالجامعة الإسلامية بالمدينة المنورة، ثم نال درجة الماجستير في العقيدة من كلية الشريعة بجامعة الملك سعود بالرياض، وأكمل الدكتوراه في العقيدة الإسلامية من جامعة ويلز في المملكة المتحدة. وقد شكّل هذا المسار الأكاديمي المتدرج أساسًا راسخًا لتخصصه في العقيدة والتربية الإسلامية.","da":"أسس الجامعة الإسلامية المفتوحة (International Open University)، وهي مؤسسة تعليمية تهدف إلى إتاحة التعليم الإسلامي العالي عن بُعد لطلاب من مختلف أنحاء العالم بتكاليف ميسرة. كما عمل محاضرًا وأستاذًا في جامعات ومراكز إسلامية في عدة دول، وشارك في برامج تلفزيونية ودعوية.<br><br>ألّف كتبًا ومقررات دراسية في العقيدة والفقه والثقافة الإسلامية تُدرَّس في برامج أكاديمية ودعوية، واشتهر بجهوده في نشر التعليم الشرعي المنهجي باللغة الإنجليزية. وتميز نشاطه بالتركيز على التأسيس العقدي الصحيح، وتصحيح المفاهيم، وتيسير الوصول إلى العلم الشرعي الموثوق للمسلمين في الغرب والبلدان غير العربية.","works":["<strong>مؤلفات وترجمات.</strong>"],"quote":"العلم الشرعي يجب أن يكون في متناول كل مسلم."},"en":{"title":"Dr. Bilal Philips","role":"Islamic Scholar","up":"Dr. Bilal Philips was born in Jamaica in 1947 and grew up in Canada, where he received his early education. He embraced Islam in 1972 and later traveled to Saudi Arabia to pursue Islamic studies, enrolling at the Islamic University of Madinah.<br><br>He earned a bachelor’s degree in Islamic Studies from the College of Da‘wah and Fundamentals of Religion in Madinah, then obtained a Master’s degree in Aqeedah from King Saud University in Riyadh, and completed a PhD in Islamic Theology at the University of Wales in the UK. This progressive academic path formed a solid foundation for his specialization in creed and Islamic education.","da":"He founded the International Open University (IOU), an educational institution aimed at making higher Islamic education accessible online to students around the world at affordable costs. He has also taught at universities and Islamic centers in several countries and participated in media and educational programs.<br><br>He has authored books and study materials in creed, jurisprudence, and Islamic culture used in academic and da‘wah programs, and is known for his efforts to spread structured Islamic education in English. His work focuses on sound theological foundations, correcting misconceptions, and facilitating access to reliable Islamic knowledge for Muslims in the West and beyond.","works":["<strong>Books and Translations.</strong>"],"quote":"Islamic knowledge should be accessible to every Muslim."},"fr":{"title":"Dr Bilal Philips","role":"Érudit islamique","up":"Le Dr Bilal Philips est né en Jamaïque en 1947 et a grandi au Canada. Converti à l’islam en 1972, il s’est rendu en Arabie saoudite pour étudier les sciences islamiques et s’est inscrit à l’Université islamique de Médine.<br><br>Il a obtenu une licence en sciences islamiques à Médine, puis un master en ‘aqida à l’Université du Roi Saoud à Riyad, et enfin un doctorat en théologie islamique à l’Université du Pays de Galles au Royaume-Uni. Ce parcours académique progressif a constitué une base solide pour sa spécialisation en croyance et en éducation islamique.","da":"Il a fondé l’International Open University (IOU), une institution visant à rendre l’enseignement islamique supérieur accessible en ligne à des étudiants du monde entier à faible coût. Il a également enseigné dans des universités et centres islamiques dans plusieurs pays et participé à des programmes médiatiques.<br><br>Auteur d’ouvrages et de supports pédagogiques en croyance, fiqh et culture islamique, il est reconnu pour ses efforts de diffusion d’un enseignement islamique structuré en langue anglaise. Son travail met l’accent sur les fondements doctrinaux solides, la correction des idées reçues et l’accès à un savoir fiable.","works":["<strong>Livres et traductions :</strong> Ouvrages en croyance et culture islamique."],"quote":"La science islamique doit être accessible à chaque musulman."},"es":{"title":"Dr. Bilal Philips","role":"Erudito islámico","up":"El Dr. Bilal Philips nació en Jamaica en 1947 y creció en Canadá. Se convirtió al islam en 1972 y luego viajó a Arabia Saudita para estudiar ciencias islámicas, ingresando en la Universidad Islámica de Medina.<br><br>Obtuvo una licenciatura en Estudios Islámicos en Medina, una maestría en ‘aqida en la Universidad Rey Saud en Riad y completó un doctorado en Teología Islámica en la Universidad de Gales (Reino Unido). Este recorrido académico progresivo consolidó su especialización en creencia y educación islámica.","da":"Fundó la International Open University (IOU), una institución educativa que busca hacer accesible la educación islámica superior en línea para estudiantes de todo el mundo. También ha enseñado en universidades y centros islámicos en varios países y participado en programas educativos y mediáticos.<br><br>Es autor de libros y materiales de estudio en creencia, jurisprudencia y cultura islámica, y es conocido por sus esfuerzos por difundir una educación islámica estructurada en inglés. Su labor se centra en los fundamentos doctrinales correctos, la corrección de conceptos erróneos y el acceso a un conocimiento islámico fiable.","works":["<strong>Libros y traducciones:</strong> Obras en creencia y cultura islámica."],"quote":"El conocimiento islámico debe ser accesible para todo musulmán."}}},{"id":"siraj","initials":"س.و","meta":{"ar":"1950 | أمريكا","en":"1950 | USA","fr":"1950 | États-Unis","es":"1950 | EE.UU."},"tags":{"ar":["الإصلاح"],"en":["Reform"],"fr":["Réforme"],"es":["Reforma"]},"platforms":["YouTube","Facebook"],"series":{"ar":["خطب الجمعة"],"en":["Friday Sermons"],"fr":["Sermons du vendredi"],"es":["Sermones del viernes"]},"tr":{"ar":{"title":"الإمام سراج وهاج","role":"إمام مسجد","up":"وُلد الإمام سراج وهاج (جيفري كيرس) في بروكلين بنيويورك عام 1950م، ونشأ في الولايات المتحدة. اعتنق الإسلام عام 1969م بعد مسيرة بحث روحي، ثم التوجّه إلى طلب العلم الشرعي لتعميق فهمه للدين.<br><br>سافر إلى المملكة العربية السعودية حيث درس في جامعة أم القرى بمكة المكرمة، وتلقى علومًا في الشريعة واللغة العربية. وقد أكسبه هذا الجمع بين التجربة الأمريكية والتكوين الشرعي في مكة رؤية خاصة لقضايا المسلمين في المجتمعات الغربية.","da":"يُعد إمام مسجد التقوى في بروكلين بنيويورك، وأحد أبرز القيادات الإسلامية والدعوية في الولايات المتحدة منذ عقود. اشتهر بخطبه المؤثرة في الإصلاح الاجتماعي، ومكافحة الجريمة والمخدرات، وبناء المجتمع المسلم، والدعوة إلى القيم الأخلاقية والعدالة.<br><br>شارك في تأسيس وقيادة مبادرات ومؤسسات إسلامية ومجتمعية، وأسهم في الحوار بين الأديان والجهود المدنية في أمريكا. وتميز خطابه بالتركيز على المسؤولية الفردية والجماعية، وخدمة المجتمع، والتمسك بالهوية الإسلامية مع الإيجابية في الانخراط المجتمعي، مما جعله صوتًا مؤثرًا في الخطاب الإسلامي الأمريكي.","works":["<strong>خطب ومحاضرات.</strong>"],"quote":"الإسلام ليس مجرد عبادة فردية."},"en":{"title":"Imam Siraj Wahhaj","role":"Imam","up":"Imam Siraj Wahhaj (Jeffrey Kearse) was born in Brooklyn, New York, in 1950 and grew up in the United States. He embraced Islam in 1969 after a spiritual journey and then turned to studying Islamic sciences to deepen his understanding of the faith.<br><br>He traveled to Saudi Arabia, where he studied at Umm al-Qura University in Makkah and received instruction in Sharia and Arabic. This combination of American experience and religious training in Makkah gave him a distinctive perspective on the concerns of Muslims in Western societies.","da":"He serves as the imam of Masjid At-Taqwa in Brooklyn, New York, and has been one of the most prominent Islamic leaders and preachers in the United States for decades. He is known for impactful sermons on social reform, combating crime and drugs, community building, and promoting moral values and justice.<br><br>He has participated in founding and leading Islamic and community initiatives and contributed to interfaith dialogue and civic efforts in America. His discourse emphasizes individual and collective responsibility, service to society, and maintaining Islamic identity while engaging positively in the broader community.","works":["<strong>Sermons and Lectures.</strong>"],"quote":"Islam is not just individual worship."},"fr":{"title":"Imam Siraj Wahhaj","role":"Imam","up":"L’imam Siraj Wahhaj (Jeffrey Kearse) est né à Brooklyn (New York) en 1950 et a grandi aux États-Unis. Converti à l’islam en 1969 après une quête spirituelle, il s’est orienté vers l’étude des sciences islamiques pour approfondir sa compréhension de la foi.<br><br>Il s’est rendu en Arabie saoudite, où il a étudié à l’Université Umm al-Qura à La Mecque, recevant une formation en charia et en langue arabe. Cette combinaison d’expérience américaine et de formation religieuse à La Mecque lui a donné une vision particulière des enjeux des musulmans en Occident.","da":"Il est imam de la mosquée At-Taqwa à Brooklyn et l’un des leaders islamiques les plus influents aux États-Unis depuis des décennies. Il est connu pour ses sermons sur la réforme sociale, la lutte contre la criminalité et la drogue, la construction communautaire et la promotion des valeurs morales et de la justice.<br><br>Il a participé à la création et à la direction d’initiatives islamiques et communautaires et contribué au dialogue interreligieux et aux efforts civiques. Son discours met l’accent sur la responsabilité individuelle et collective, le service à la société et l’engagement positif tout en préservant l’identité islamique.","works":["<strong>Sermons et conférences :</strong> Enseignements sur la réforme communautaire."],"quote":"L’islam n’est pas seulement un culte individuel."},"es":{"title":"Imam Siraj Wahhaj","role":"Imam","up":"El imán Siraj Wahhaj (Jeffrey Kearse) nació en Brooklyn (Nueva York) en 1950 y creció en Estados Unidos. Se convirtió al islam en 1969 tras una búsqueda espiritual y luego se dedicó al estudio de las ciencias islámicas para profundizar su comprensión de la fe.<br><br>Viajó a Arabia Saudita, donde estudió en la Universidad Umm al-Qura en La Meca, recibiendo formación en sharía y lengua árabe. Esta combinación de experiencia estadounidense y formación religiosa en La Meca le dio una perspectiva particular sobre las preocupaciones de los musulmanes en sociedades occidentales.","da":"Es imán de la mezquita At-Taqwa en Brooklyn y uno de los líderes islámicos más destacados de Estados Unidos durante décadas. Es conocido por sus sermones sobre reforma social, lucha contra el crimen y las drogas, construcción comunitaria y promoción de valores morales y justicia.<br><br>Ha participado en la creación y dirección de iniciativas islámicas y comunitarias y ha contribuido al diálogo interreligioso y a esfuerzos cívicos. Su discurso enfatiza la responsabilidad individual y colectiva, el servicio a la sociedad y el compromiso positivo manteniendo la identidad islámica.","works":["<strong>Sermones y conferencias:</strong> Enseñanzas sobre reforma comunitaria."],"quote":"El islam no es solo adoración individual."}}},{"id":"suhaib","initials":"ص.و","meta":{"ar":"1972 | أمريكا","en":"1972 | USA","fr":"1972 | États-Unis","es":"1972 | EE.UU."},"tags":{"ar":["الفقه"],"en":["Fiqh"],"fr":["Fiqh"],"es":["Fiqh"]},"platforms":["YouTube","Snapchat"],"series":{"ar":["محاضرات الفقه"],"en":["Fiqh Lectures"],"fr":["Cours de fiqh"],"es":["Lecciones de fiqh"]},"tr":{"ar":{"title":"الإمام صهيب ويب","role":"داعية","up":"وُلد الإمام صهيب ويب (ويليام ويب) في أوكلاهوما بالولايات المتحدة الأمريكية عام 1972م، ونشأ في بيئة مسيحية. اعتنق الإسلام عام 1992م، ثم انصرف إلى طلب العلم الشرعي بشكل جاد، فدرس على عدد من العلماء في الولايات المتحدة وخارجها.<br><br>تابع دراساته في الأزهر الشريف بالقاهرة وفي مراكز علمية أخرى، وتلقى تدريبًا في الفقه وأصوله واللغة العربية والعلوم الإسلامية. وقد جمع في مسيرته بين فهم الواقع الأمريكي المعاصر والتكوين الشرعي التقليدي، مع اهتمام خاص بقضايا الشباب والأسرة.","da":"عمل إمامًا وخطيبًا ومحاضرًا في عدة مراكز إسلامية في الولايات المتحدة، وعُرف بنشاطه الدعوي والتربوي الموجه للمسلمين في الغرب. يركز في خطاباته ودروسه على الفقه العملي، وبناء الهوية الإسلامية المتوازنة، ومعالجة التحديات المعاصرة بلغة قريبة من الشباب.<br><br>أسهم في مبادرات تعليمية ومجتمعية، وشارك في مؤتمرات ولقاءات دعوية واسعة الانتشار، مع حضور مؤثر عبر المنصات الرقمية. ويتميز أسلوبه بالجمع بين العلم الشرعي والاهتمام بالصحة النفسية والاجتماعية، والدعوة إلى حكمة الخطاب ورحمة التعامل في بيئات متنوعة.","works":["<strong>محاضرات.</strong>"],"quote":"الدعوة في العصر الرقمي تحتاج إلى حكمة."},"en":{"title":"Imam Suhaib Webb","role":"Preacher","up":"Imam Suhaib Webb (William Webb) was born in Oklahoma, USA, in 1972 and grew up in a Christian environment. He embraced Islam in 1992 and then devoted himself to seeking Islamic knowledge, studying with scholars in the United States and abroad.<br><br>He continued his studies at Al-Azhar in Cairo and at other centers, receiving training in jurisprudence, its principles, Arabic, and Islamic sciences. His journey combines an understanding of contemporary American realities with traditional Islamic learning, with particular attention to youth and family issues.","da":"He has served as an imam, preacher, and lecturer at several Islamic centers in the United States and is known for his educational and outreach work aimed at Muslims in the West. His talks and lessons focus on practical jurisprudence, building a balanced Islamic identity, and addressing contemporary challenges in a relatable manner.<br><br>He has contributed to educational and community initiatives and participated in widely attended conferences and events, with an active presence on digital platforms. His style combines Islamic scholarship with attention to psychological and social well-being, promoting wise speech and compassionate engagement in diverse settings.","works":["<strong>Lectures.</strong>"],"quote":"Da'wah in the digital age needs wisdom."},"fr":{"title":"Imam Souhaib Webb","role":"Prédicateur","up":"L’imam Souhaib Webb (William Webb) est né en Oklahoma (États-Unis) en 1972 et a grandi dans un environnement chrétien. Converti à l’islam en 1992, il s’est consacré à l’étude des sciences islamiques auprès de savants aux États-Unis et à l’étranger.<br><br>Il a poursuivi ses études à Al-Azhar au Caire et dans d’autres centres, recevant une formation en jurisprudence, en fondements du droit, en arabe et en sciences islamiques. Son parcours associe compréhension des réalités américaines contemporaines et formation islamique traditionnelle, avec une attention particulière aux jeunes et aux familles.","da":"Il a exercé comme imam, prédicateur et conférencier dans plusieurs centres islamiques aux États-Unis et est reconnu pour son travail éducatif auprès des musulmans d’Occident. Ses enseignements portent sur le fiqh pratique, la construction d’une identité islamique équilibrée et le traitement des défis contemporains de manière accessible.<br><br>Il a contribué à des initiatives éducatives et communautaires et participé à de nombreuses conférences, avec une présence active sur les plateformes numériques. Son style allie savoir islamique et attention au bien-être psychologique et social, en promouvant un discours sage et bienveillant.","works":["<strong>Conférences :</strong> Enseignements en fiqh et éducation."],"quote":"La prédication à l’ère numérique nécessite de la sagesse."},"es":{"title":"Imam Suhaib Webb","role":"Predicador","up":"El imán Suhaib Webb (William Webb) nació en Oklahoma (EE. UU.) en 1972 y creció en un entorno cristiano. Se convirtió al islam en 1992 y se dedicó al estudio de las ciencias islámicas con eruditos en Estados Unidos y en el extranjero.<br><br>Continuó sus estudios en Al-Azhar en El Cairo y en otros centros, recibiendo formación en jurisprudencia, sus fundamentos, árabe y ciencias islámicas. Su trayectoria combina la comprensión de la realidad estadounidense contemporánea con el aprendizaje islámico tradicional, con especial atención a los jóvenes y las familias.","da":"Ha trabajado como imán, predicador y conferenciante en varios centros islámicos de Estados Unidos y es conocido por su labor educativa dirigida a los musulmanes en Occidente. Sus charlas se centran en la jurisprudencia práctica, la construcción de una identidad islámica equilibrada y el abordaje de desafíos contemporáneos de forma cercana.<br><br>Ha contribuido a iniciativas educativas y comunitarias y participado en numerosas conferencias, con presencia activa en plataformas digitales. Su estilo combina el conocimiento islámico con la atención al bienestar psicológico y social, promoviendo un discurso sabio y compasivo.","works":["<strong>Conferencias:</strong> Enseñanzas en fiqh y educación."],"quote":"La predicación en la era digital necesita sabiduría."}}},{"id":"masood","initials":"ط.م","meta":{"ar":"1975 | باكستان","en":"1975 | Pakistan","fr":"1975 | Pakistan","es":"1975 | Pakistán"},"tags":{"ar":["الإفتاء"],"en":["Fatwa"],"fr":["Fatwa"],"es":["Fatwa"]},"platforms":["YouTube","Facebook"],"series":{"ar":["فتاوى"],"en":["Fatwas"],"fr":["Fatwas"],"es":["Fatwas"]},"tr":{"ar":{"title":"المفتي طارق مسعود","role":"مفتي","up":"وُلد المفتي طارق مسعود في باكستان عام 1975م، ونشأ في بيئة محافظة حرصت على طلب العلم الشرعي. التحق بجامعة تراث الرشيد (Jamia Tur Rasheed) في كراتشي، وهي من المؤسسات العلمية المعروفة في شبه القارة الهندية بتدريس العلوم الشرعية على المنهج الديوبندي.<br><br>تخرّج في برنامج دورة الحديث (الماجستير الشرعي التقليدي)، وتخصص في الفقه وأصوله والفتوى، وتلقى علوم القرآن والحديث والعقيدة على يد علماء مختصين. وقد أهّله هذا التكوين العلمي للانخراط في الإفتاء والتدريس والخطابة.","da":"يُعد من العلماء والخطباء البارزين في باكستان، وله نشاط واسع في الإفتاء والدروس والمحاضرات التي تُبث عبر القنوات الفضائية والمنصات الرقمية. اشتهر بسلاسل دروسه في الفقه وتفسير القرآن والسيرة، وبإجاباته على أسئلة الناس في المسائل اليومية والأسرية.<br><br>يميل في خطابه إلى الطرح المباشر والمعالجة العملية لقضايا الواقع، مع التركيز على إصلاح البيوت والأخلاق والالتزام بالأحكام الشرعية. وقد حظيت دروسه بانتشار كبير بين الناطقين بالأردية، وأسهمت في تقديم الفتاوى والتوجيهات الشرعية لجمهور واسع داخل باكستان وخارجها.","works":["<strong>فتاوى.</strong>"],"quote":"الفقه ليس تعقيداً."},"en":{"title":"Mufti Tariq Masood","role":"Mufti","up":"Mufti Tariq Masood was born in Pakistan in 1975 and grew up in a conservative environment that encouraged the pursuit of Islamic knowledge. He enrolled at Jamia Tur Rasheed in Karachi, a well-known institution in the Indian subcontinent for teaching Islamic sciences according to the Deobandi tradition.<br><br>He completed the Dars-e-Nizami program (traditional scholarly degree), specializing in jurisprudence, its principles, and issuing fatwas, and studied Qur’an, hadith, and creed under qualified scholars. This training prepared him for roles in teaching, preaching, and religious guidance.","da":"He is a prominent scholar and preacher in Pakistan, active in issuing fatwas and delivering lessons and lectures broadcast on television and digital platforms. He is known for series on jurisprudence, Qur’anic interpretation, and Prophetic biography, as well as for answering people’s questions on daily and family matters.<br><br>His style tends toward direct and practical treatment of contemporary issues, with an emphasis on reforming homes, character, and adherence to Islamic rulings. His lessons have gained wide popularity among Urdu-speaking audiences, contributing to providing religious guidance to a large public in Pakistan and abroad.","works":["<strong>Fatwas.</strong>"],"quote":"Fiqh is not complication."},"fr":{"title":"Moufti Tariq Masood","role":"Moufti","up":"Le moufti Tariq Masood est né au Pakistan en 1975 et a grandi dans un environnement attaché à l’étude des sciences islamiques. Il a rejoint la Jamia Tur Rasheed à Karachi, institution reconnue du sous-continent indien pour l’enseignement des sciences islamiques selon la tradition déobandie.<br><br>Il a achevé le programme Dars-e-Nizami, se spécialisant en jurisprudence, fondements du droit et fatwa, et a étudié le Coran, le hadith et la croyance auprès de savants qualifiés. Cette formation l’a préparé à l’enseignement, à la prédication et au conseil religieux.","da":"Il est un érudit et prédicateur reconnu au Pakistan, actif dans l’émission de fatwas et la diffusion de cours et conférences à la télévision et sur les plateformes numériques. Il est connu pour ses séries sur le fiqh, l’interprétation du Coran et la biographie prophétique, ainsi que pour ses réponses aux questions quotidiennes et familiales.<br><br>Son discours se caractérise par une approche directe et pratique des questions contemporaines, avec un accent sur la réforme des foyers, des mœurs et le respect des règles islamiques. Ses enseignements sont largement suivis par le public ourdophone, au Pakistan et à l’étranger.","works":["<strong>Fatwas :</strong> Réponses aux questions religieuses."],"quote":"Le fiqh n’est pas une complication."},"es":{"title":"Muftí Tar
