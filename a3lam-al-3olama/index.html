<script>
(function () {
  try {
    if (localStorage.getItem('a3lam-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    var lang = localStorage.getItem('a3lam-lang');
    if (lang && ['ar', 'en', 'fr', 'es'].indexOf(lang) !== -1) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    }
  } catch (e) {}
})();

<style>
  :root {
    --bg: #f5f7f9;
    --card: #ffffff;
    --text: #1b2430;
    --muted: #5b6b7c;
    --accent: #0e7c66;
    --accent-soft: #e6f4f0;
    --border: #e4e8ee;
    --on-accent: #ffffff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px rgba(16, 24, 40, .06);
    --shadow-hover: 0 2px 6px rgba(16, 24, 40, .06), 0 16px 36px rgba(16, 24, 40, .10);
  }

  [data-theme="dark"] {
    --bg: #0d1319;
    --card: #131a22;
    --text: #e8edf3;
    --muted: #9fb0c0;
    --accent: #3ddcbb;
    --accent-soft: #12312a;
    --border: #222c38;
    --on-accent: #062a23;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .30);
    --shadow-hover: 0 2px 8px rgba(0, 0, 0, .40), 0 18px 44px rgba(0, 0, 0, .40);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(900px 420px at 100% -8%, var(--accent-soft), transparent 62%),
      var(--bg);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.75;
    transition: background-color .25s ease, color .25s ease;
  }

  html[lang="en"] body,
  html[lang="fr"] body,
  html[lang="es"] body {
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.65;
  }

  a { color: inherit; }

  .wrap {
    width: min(1240px, 100% - 32px);
    margin-inline: auto;
  }

  /* ===== Header ===== */
  .site-header { padding: 38px 0 22px; }

  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand { max-width: 720px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: "Noto Naskh Arabic", "IBM Plex Sans Arabic", serif;
    font-size: clamp(30px, 4.6vw, 48px);
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  html:not([lang="ar"]) h1 {
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.15;
  }

  .lede {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 15.5px;
    max-width: 62ch;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 6px;
  }

  .count-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ===== Language switch ===== */
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
  }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .01em;
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease, transform .18s ease;
  }

  .lang-btn .flag {
    font-size: 14px;
    line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }

  .lang-btn:hover {
    background: var(--accent-soft);
    color: var(--text);
  }

  .lang-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 28%, transparent);
  }

  .theme-toggle {
    display: inline-grid;
    place-items: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: border-color .2s ease, transform .2s ease, background-color .2s ease;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .theme-toggle:focus-visible,
  .lang-btn:focus-visible,
  .search-input:focus-visible,
  .pill:focus-visible,
  .series a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  /* ===== Search ===== */
  .search {
    position: relative;
    margin: 26px 0 30px;
  }

  .search svg {
    position: absolute;
    inset-inline-start: 17px;
    top: 50%;
    width: 20px;
    height: 20px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 56px;
    padding-block: 0;
    padding-inline: 50px 18px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 15.5px;
    box-shadow: var(--shadow);
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .search-input::placeholder { color: var(--muted); opacity: .85; }

  .search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  /* ===== Masonry cards ===== */
  .cards {
    column-count: 1;
    column-gap: 18px;
    padding-bottom: 44px;
  }

  @media (min-width: 720px)  { .cards { column-count: 2; } }
  @media (min-width: 1120px) { .cards { column-count: 3; } }

  .card {
    display: inline-block;
    width: 100%;
    margin: 0 0 18px;
    padding: 20px;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
    vertical-align: top;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
    box-shadow: var(--shadow-hover);
  }

  .card.is-hidden { display: none; }

  .card-top {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .avatar {
    flex: none;
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 58%, #0b3d33));
    color: var(--on-accent);
    font-family: "Noto Naskh Arabic", serif;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .01em;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 32%, transparent);
  }

  html:not([lang="ar"]) .avatar {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 17px;
  }

  .ident { min-width: 0; }

  .ident h2 {
    margin: 0;
    font-size: 19px;
    line-height: 1.4;
    font-weight: 700;
  }

  .honorific {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.6;
  }

  .meta {
    margin: 12px 0 0;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
  }

  .role {
    margin: 6px 0 0;
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0 0;
  }

  .tag {
    padding: 3px 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--border));
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.7;
  }

  .bio {
    margin: 12px 0 0;
    font-size: 13.5px;
    line-height: 1.9;
  }

  html:not([lang="ar"]) .bio { line-height: 1.75; }

  .block { margin-top: 16px; }

  .block-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 9px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  html[lang="ar"] .block-title { text-transform: none; }

  .block-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ===== Platforms ===== */
  .platforms {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color .18s ease, color .18s ease, border-color .18s ease,
                transform .18s ease, box-shadow .18s ease;
  }

  .pill::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    transition: background-color .18s ease;
  }

  .pill:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 28%, transparent);
  }

  .pill:hover::before { background: var(--on-accent); }

  /* ===== Series ===== */
  .series {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .series li + li { margin-top: 7px; }

  .series a {
    display: inline-block;
    position: relative;
    padding-inline-start: 15px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.7;
    text-decoration: none;
    transition: color .18s ease, transform .18s ease;
  }

  .series a::before {
    content: "";
    position: absolute;
    inset-inline-start: 1px;
    top: .68em;
    width: 6px;
    height: 6px;
    transform: rotate(45deg);
    background: var(--accent);
    border-radius: 1px;
  }

  .series a:hover {
    color: var(--accent);
    transform: translateX(-4px);
  }

  /* ===== Works ===== */
  .works {
    margin: 0;
    padding-inline-start: 18px;
    font-size: 13px;
    line-height: 1.8;
  }

  .works li { margin: 6px 0; }
  .works li::marker { color: var(--accent); }
  .works strong { color: var(--accent); font-weight: 700; }

  /* ===== Quote ===== */
  .quote {
    margin: 16px 0 0;
    padding: 11px 14px;
    border-inline-start: 3px solid var(--accent);
    border-start-start-radius: 0;
    border-start-end-radius: 12px;
    border-end-end-radius: 12px;
    border-end-start-radius: 0;
    background: linear-gradient(135deg, var(--accent-soft), transparent 78%);
    color: var(--text);
    font-family: "Noto Naskh Arabic", serif;
    font-size: 14.5px;
    line-height: 1.9;
  }

  html:not([lang="ar"]) .quote {
    font-family: "Inter", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.75;
  }

  /* ===== Empty state ===== */
  .empty {
    margin: 8px 0 54px;
    padding: 46px 24px;
    border: 1px dashed var(--border);
    border-radius: 18px;
    background: var(--card);
    color: var(--muted);
    text-align: center;
    font-size: 14.5px;
  }

  .empty strong {
    display: block;
    margin-bottom: 4px;
    color: var(--text);
    font-size: 17px;
  }

  .empty span { display: block; }

  [hidden] { display: none !important; }

  /* ===== Footer ===== */
  .site-footer {
    padding: 18px 0 34px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12.5px;
    text-align: center;
  }

  @media (max-width: 640px) {
    .site-header { padding-top: 26px; }
    .header-actions { width: 100%; }
    .lang-switch { order: 3; width: 100%; justify-content: space-between; }
    .lang-btn { flex: 1; justify-content: center; }
    .card { padding: 17px; }
    .avatar { width: 48px; height: 48px; font-size: 17px; }
    .ident h2 { font-size: 17.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .card:hover, .pill:hover, .series a:hover { transform: none; }
  }
</style>
</head>

  <footer class="site-footer">

   كل عالم: name + tags متعدد اللغات + translations (ar/en/fr/es)
   + digitalPresence (platforms / notableSeries).
   ========================================================================= */

/* =========================================================================
   الحالة واللغة
   ========================================================================= */
var currentLang = document.documentElement.lang || "ar";
if (!uiStrings[currentLang]) currentLang = "ar";

function STR(key) {
  var table = uiStrings[currentLang] || uiStrings.ar;
  return table[key] != null ? table[key] : (uiStrings.ar[key] || "");
}

function L(value) {
  if (value && typeof value === "object" && !Array.isArray(value)) {
    if (value[currentLang] != null) return value[currentLang];
    if (value.ar != null) return value.ar;
    if (value.en != null) return value.en;
    var keys = Object.keys(value);
    return keys.length ? value[keys[0]] : "";
  }
  return value == null ? "" : value;
}

function localizedList(value) {
  if (Array.isArray(value)) return value;
  if (value && typeof value === "object") {
    var v = value[currentLang] || value.ar || value.en;
    return Array.isArray(v) ? v : [];
  }
  return [];
}

/* يقرأ حقلاً من translations مع الرجوع إلى العربية ثم إلى الحقل القديم. */
function T(s, field) {
  var tr = s.translations;
  if (tr && typeof tr === "object") {
    if (tr[currentLang] && tr[currentLang][field] != null) return tr[currentLang][field];
    if (tr.ar && tr.ar[field] != null) return tr.ar[field];
    if (tr.en && tr.en[field] != null) return tr.en[field];
  }
  return L(s[field]);
}

function scholarName(s) {
  var tr = s.translations;
  if (tr && tr[currentLang] && tr[currentLang].name != null) return tr[currentLang].name;
  return L(s.name);
}

/* الوسوم قد تكون مصفوفة واحدة أو كائنًا بحسب اللغة. */
function localizedTags(s) {
  var v = s.tags;
  if (Array.isArray(v)) return v;
  if (v && typeof v === "object") {
    var arr = v[currentLang] || v.ar || v.en || [];
    return Array.isArray(arr) ? arr : [];
  }
  return [];
}

/* =========================================================================
   أدوات الأمان
   ========================================================================= */
function escapeHTML(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}

/* يسمح فقط بوسم <strong> ويعطّل كل وسوم HTML الأخرى. */
function sanitizeWorks(html) {
  return escapeHTML(html)
    .replace(/&lt;strong&gt;/gi, "<strong>")
    .replace(/&lt;\/strong&gt;/gi, "</strong>");
}

/* =========================================================================
   روابط المنصات والسلاسل الذكية
   ========================================================================= */
function getPlatformURL(platform, scholarName) {
  var p = String(platform || "").trim();
  var key = p.toLowerCase();
  var name = encodeURIComponent(scholarName || "");
  var q = encodeURIComponent("\"" + (scholarName || "") + "\"");

  var searchMap = {
    "youtube": "https://www.youtube.com/results?search_query=" + q,
    "يوتيوب": "https://www.youtube.com/results?search_query=" + q,
    "facebook": "https://www.facebook.com/search/top?q=" + name,
    "فيسبوك": "https://www.facebook.com/search/top?q=" + name,
    "instagram": "https://www.instagram.com/explore/search/keyword/?q=" + name,
    "انستغرام": "https://www.instagram.com/explore/search/keyword/?q=" + name,
    "إنستغرام": "https://www.instagram.com/explore/search/keyword/?q=" + name,
    "twitter": "https://twitter.com/search?q=" + q,
    "x (twitter)": "https://twitter.com/search?q=" + q,
    "x": "https://twitter.com/search?q=" + q,
    "تويتر": "https://twitter.com/search?q=" + q,
    "tiktok": "https://www.tiktok.com/search?q=" + name,
    "تيك توك": "https://www.tiktok.com/search?q=" + name,
    "soundcloud": "https://soundcloud.com/search?q=" + name,
    "ساوند كلاود": "https://soundcloud.com/search?q=" + name,
    "telegram": "https://www.google.com/search?q=" + encodeURIComponent("site:t.me " + (scholarName || "")),
    "تيليجرام": "https://www.google.com/search?q=" + encodeURIComponent("site:t.me " + (scholarName || ""))
  };

  if (searchMap[key]) return searchMap[key];

  if (key.indexOf("موقع") !== -1 || key.indexOf("website") !== -1) {
    return "https://www.google.com/search?q=" + encodeURIComponent((scholarName || "") + " الموقع الرسمي");
  }

  return "https://www.google.com/search?q=" + encodeURIComponent((scholarName || "") + " " + p + " الموقع الرسمي");
}

function getSeriesURL(seriesName, scholarName) {
  var q = '"' + (seriesName || "") + '" ' + (scholarName || "");
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
}

/* =========================================================================
   بناء البطاقة
   ========================================================================= */
function flatten(value) {
  if (value == null) return "";
  if (Array.isArray(value)) return value.map(flatten).join(" ");
  if (typeof value === "object") {
    return Object.keys(value).map(function (k) { return flatten(value[k]); }).join(" ");
  }
  return String(value);
}

function buildSearchIndex(s) {
  return flatten([
    s.name, s.title, s.role, s.meta,
    s.tags, s.translations,
    s.digitalPresence && s.digitalPresence.platforms,
    s.digitalPresence && s.digitalPresence.notableSeries
  ]).toLowerCase();
}

function cardHTML(s) {
  var name = scholarName(s);

  var tags = localizedTags(s).map(function (t) {
    return '<span class="tag">' + escapeHTML(L(t)) + "</span>";
  }).join("");

  var platforms = localizedList(s.digitalPresence && s.digitalPresence.platforms);
  var platformLinks = platforms.map(function (p) {
    var platformName = L(p);
    return '<a class="pill" href="' + escapeHTML(getPlatformURL(platformName, name)) + '" target="_blank" rel="noopener noreferrer">' +
      escapeHTML(platformName) + "</a>";
  }).join("");

  var series = localizedList(s.digitalPresence && s.digitalPresence.notableSeries);
  var seriesLinks = series.map(function (x) {
    var seriesName = L(x);
    return '<li><a href="' + escapeHTML(getSeriesURL(seriesName, name)) + '" target="_blank" rel="noopener noreferrer">' +
      escapeHTML(seriesName) + "</a></li>";
  }).join("");

  var works = localizedList(T(s, "works")).map(function (w) {
    return "<li>" + sanitizeWorks(L(w)) + "</li>";
  }).join("");

  var quote = T(s, "quote");

  return (
    '<article class="card" data-search="' + escapeHTML(buildSearchIndex(s)) + '">' +
      '<div class="card-top">' +
        '<div class="avatar" aria-hidden="true">' + escapeHTML(L(s.initials)) + "</div>" +
        '<div class="ident">' +
          "<h2>" + escapeHTML(name) + "</h2>" +
          '<p class="honorific">' + escapeHTML(T(s, "title")) + "</p>" +
        "</div>" +
      "</div>" +
      '<p class="meta">' + escapeHTML(L(s.meta)) + "</p>" +
      '<p class="role">' + escapeHTML(T(s, "role")) + "</p>" +
      (tags ? '<div class="tags">' + tags + "</div>" : "") +
      '<p class="bio">' + escapeHTML(T(s, "upbringing")) + "</p>" +
      '<p class="bio">' + escapeHTML(T(s, "daWahAndPositions")) + "</p>" +
      (platformLinks
        ? '<div class="block"><h3 class="block-title">' + escapeHTML(STR("platforms")) + '</h3><div class="platforms">' + platformLinks + "</div></div>"
        : "") +
      (seriesLinks
        ? '<div class="block"><h3 class="block-title">' + escapeHTML(STR("series")) + '</h3><ul class="series">' + seriesLinks + "</ul></div>"
        : "") +
      (works
        ? '<div class="block"><h3 class="block-title">' + escapeHTML(STR("works")) + '</h3><ul class="works">' + works + "</ul></div>"
        : "") +
      (quote ? '<blockquote class="quote">' + escapeHTML(quote) + "</blockquote>" : "") +
    "</article>"
  );
}

/* =========================================================================
   العرض والبحث والوضع الليلي واللغة
   ========================================================================= */
var grid = document.getElementById("cards");
var countEl = document.getElementById("count");
var emptyEl = document.getElementById("empty");
var emptyTitleEl = document.getElementById("empty-title");
var emptyHintEl = document.getElementById("empty-hint");
var searchEl = document.getElementById("search");
var themeBtn = document.getElementById("theme-toggle");
var appTitleEl = document.getElementById("app-title");
var eyebrowEl = document.getElementById("eyebrow");
var ledeEl = document.getElementById("lede");
var footerEl = document.getElementById("footer-text");
var cards = [];
var total = 0;

function updateCount(visible) {
  countEl.textContent = visible + " " + STR("countFiltered") + " " + total + " " + STR("countLabel");
}

function applyFilter(rawQuery) {
  var q = String(rawQuery || "").trim().toLowerCase();
  var visible = 0;

  cards.forEach(function (card) {
    var match = !q || (card.getAttribute("data-search") || "").indexOf(q) !== -1;
    card.classList.toggle("is-hidden", !match);
    if (match) visible += 1;
  });

  updateCount(visible);
  emptyEl.hidden = visible !== 0;
}

function render() {
  grid.innerHTML = scholars.map(cardHTML).join("");
  cards = Array.prototype.slice.call(grid.querySelectorAll(".card"));
  total = cards.length;
  applyFilter(searchEl.value);
}

function updateChrome() {
  searchEl.placeholder = STR("searchPlaceholder");
  searchEl.setAttribute("aria-label", STR("searchLabel"));
  appTitleEl.textContent = STR("appTitle");
  eyebrowEl.textContent = STR("eyebrow");
  ledeEl.textContent = STR("lede");
  footerEl.textContent = STR("footer");
  emptyTitleEl.textContent = STR("noResults");
  emptyHintEl.textContent = STR("noResultsHint");
  themeBtn.setAttribute("aria-label", STR("themeToggle"));
  themeBtn.setAttribute("title", STR("themeToggle"));
  grid.setAttribute("aria-label", STR("cardsLabel"));
  document.title = STR("appTitle") + " | " + STR("eyebrow");
}

function applyLanguage(lang, persist) {
  if (!uiStrings[lang]) lang = "ar";
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  if (persist !== false) {
    try { localStorage.setItem("a3lam-lang", lang); } catch (e) {}
  }

  var buttons = document.querySelectorAll(".lang-btn");
  Array.prototype.forEach.call(buttons, function (btn) {
    btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
  });

  updateChrome();
  render();
}

searchEl.addEventListener("input", function () {
  applyFilter(searchEl.value);
});

themeBtn.addEventListener("click", function () {
  var root = document.documentElement;
  var isDark = root.getAttribute("data-theme") === "dark";
  if (isDark) {
    root.removeAttribute("data-theme");
  } else {
    root.setAttribute("data-theme", "dark");
  }
  try {
    localStorage.setItem("a3lam-theme", isDark ? "light" : "dark");
  } catch (e) {}
});

Array.prototype.forEach.call(document.querySelectorAll(".lang-btn"), function (btn) {
  btn.addEventListener("click", function () {
    applyLanguage(btn.getAttribute("data-lang"));
  });
});

applyLanguage(currentLang, false);
</script>
