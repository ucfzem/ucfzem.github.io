/* =====================================================================

const scholars = [{"id":"othman","initials":"ع.خ","meta":{"ar":"1962 | الكويت","en":"1962 | Kuwait","fr":"1962 | Koweït","es":"1962 | Kuwait"},"tags":{"ar":["الحديث","العقيدة"],"en":["Hadith","Aqeedah"],"fr":["Hadith","Aqidah"],"es":["Hadiz","Aqidah"]},"platforms":["YouTube","Telegram","X (Twitter)","Website"],"series":{"ar":["شرح كتاب التوحيد","سلسلة حقبة من التاريخ"],"en":["Explanation of Kitab al-Tawheed","A Period of History"],"fr":["Explication du Livre de l’Unicité","Série : Une époque de l’histoire"],"es":["Explicación del Libro del Monoteísmo","Serie: Una etapa de la historia"]},"tr":{"ar":{"title":"فضيلة الشيخ الدكتور عثمان بن محمد الخميس","role":"باحث في التاريخ الإسلامي والحديث","up":"وُلد الشيخ عثمان بن محمد الخميس في الكويت عام 1962م، ونشأ في بيئة علمية وشرعية حرصت على طلب العلم والالتزام. التحق بجامعة الإمام محمد بن سعود الإسلامية بالرياض، فدرس في كلية أصول الدين بقسم الحديث الشريف وعلومه، وتخرّج فيها متزوّدًا بأدوات البحث والتحقيق.<br><br>واصل مسيرته الأكاديمية حتى نال درجة الماجستير ثم الدكتوراه بتقدير امتياز في تخصص الحديث الشريف والدراسات التاريخية. وقد أسهمت هذه الرحلة الطويلة في تكوين شخصيته العلمية الدقيقة، وجعلته يجمع بين المنهج الحديثي في النقد والتحقيق وبين الإلمام الواسع بتاريخ الأمم والفرق الإسلامية.","da":"تولّى الإمامة والخطابة والتدريس في الكويت لسنوات طويلة، وأسهم في نشر العلم الشرعي عبر الدروس والمحاضرات والفتاوى المباشرة. عُرف بقدرته الفائقة على تبسيط المسائل العقدية والفقهية والتاريخية، وبأسلوب واضح يجمع بين الرصانة العلمية والقرب من الناس، مع اعتماد الأدلة من الكتاب والسنة وفهم السلف.<br><br>امتد أثره العلمي عبر الفضائيات والمنصات الرقمية، فصار مرجعًا لكثير من طلاب العلم في قضايا الحديث والعقيدة والرد على الشبهات التاريخية والمذهبية. ومن أبرز إنتاجه العلمي سلسلة «حقبة من التاريخ» التي قدّم فيها عرضًا تحليليًا موثقًا للأحداث والوقائع، إلى جانب مؤلفات وبحوث في نقد الروايات الضعيفة والرد على الطروحات المخالفة.","works":["<strong>حقبة من التاريخ:</strong> عرض تحليلي موثق للأحداث التاريخية.","<strong>كشف الجاني محمد التيجاني:</strong> دراسة نقدية حديثية."],"quote":"طلب العلم الشرعي في هذا العصر صار ميسوراً بضغطة زر، لكن البركة تبقى في الصبر والملازمة."},"en":{"title":"Sheikh Dr. Othman bin Mohammed Al-Khamees","role":"Researcher in Islamic History and Hadith","up":"Sheikh Dr. Othman bin Mohammed Al-Khamees was born in Kuwait in 1962 and grew up in an environment that valued religious learning and commitment. He studied at Imam Muhammad ibn Saud Islamic University in Riyadh, graduating from the College of Fundamentals of Religion, Department of Hadith and its Sciences, where he built a strong foundation in research and verification.<br><br>He continued his academic journey, earning both a Master’s degree and a PhD with distinction in Hadith and historical studies. This long scholarly path shaped his precise methodology, combining hadith criticism and verification with broad knowledge of Islamic history, nations, and sects.","da":"For many years he served as an imam, preacher, and teacher in Kuwait, contributing to the spread of Islamic knowledge through lessons, lectures, and guidance. He is known for simplifying complex issues in creed, jurisprudence, and history in a clear style grounded in the Qur’an, the Sunnah, and the understanding of the early generations.<br><br>His influence extended through media and digital platforms, making him a reference for students of knowledge on hadith, creed, and responses to historical and sectarian doubts. Among his notable works is the series “A Period of History,” a documented analytical presentation of events, alongside research critiquing weak reports and addressing misleading claims.","works":["<strong>A Period of History:</strong> Documented analytical presentation of historical events.","<strong>Exposing Muhammad al-Tijani:</strong> A critical Hadith study."],"quote":"Seeking Islamic knowledge today is easy with a click, but blessing remains in patience and consistency."},"fr":{"title":"Cheikh Dr Othman ben Mohammed Al-Khamees","role":"Chercheur en histoire islamique et en hadith","up":"Le cheikh Dr Othman ben Mohammed Al-Khamees est né au Koweït en 1962 et a grandi dans un environnement attaché à la science religieuse. Il a étudié à l’Université islamique Imam Mohammed ibn Saoud de Riyad, au département du hadith et de ses sciences, où il a acquis de solides bases en recherche et en vérification.<br><br>Il a poursuivi son parcours académique jusqu’à l’obtention d’un master puis d’un doctorat avec mention excellente en hadith et en études historiques. Cette formation a forgé sa rigueur méthodologique, alliant la critique du hadith à une vaste connaissance de l’histoire islamique et des courants doctrinaux.","da":"Il a longtemps exercé comme imam, prédicateur et enseignant au Koweït, diffusant le savoir par des cours, des conférences et des conseils. Il est reconnu pour sa capacité à simplifier les questions de croyance, de jurisprudence et d’histoire, dans un style clair fondé sur le Coran, la Sunna et la compréhension des pieux prédécesseurs.<br><br>Son influence s’est étendue aux médias et aux plateformes numériques, faisant de lui une référence en hadith, en croyance et dans la réponse aux ambiguïtés historiques et doctrinales. Parmi ses œuvres majeures figure la série « Une époque de l’histoire », analyse documentée des événements, ainsi que des recherches critiques sur les récits faibles.","works":["<strong>Une époque de l’histoire :</strong> Présentation analytique et documentée des événements historiques.","<strong>Démasquer Muhammad al-Tijani :</strong> Étude critique fondée sur la science du hadith."],"quote":"Rechercher la science religieuse est aujourd’hui facile d’un clic, mais la bénédiction demeure dans la patience et la constance."},"es":{"title":"Jeque Dr. Othman bin Mohammed Al-Khamees","role":"Investigador de historia islámica y hadiz","up":"El jeque Dr. Othman bin Mohammed Al-Khamees nació en Kuwait en 1962 y creció en un entorno que valoraba el conocimiento religioso. Estudió en la Universidad Islámica Imam Muhammad ibn Saud en Riad, en el Departamento de Hadiz y sus Ciencias, donde adquirió una sólida base en investigación y verificación.<br><br>Continuó su trayectoria académica hasta obtener una maestría y un doctorado con honores en hadiz y estudios históricos. Esta formación consolidó su rigor metodológico, combinando la crítica hadítica con un amplio conocimiento de la historia islámica y de las corrientes doctrinales.","da":"Durante muchos años se desempeñó como imán, predicador y maestro en Kuwait, difundiendo el conocimiento islámico mediante clases, conferencias y orientación. Es conocido por su capacidad para simplificar cuestiones de creencia, jurisprudencia e historia, con un estilo claro basado en el Corán, la Sunnah y la comprensión de las primeras generaciones.<br><br>Su influencia se extendió a los medios y plataformas digitales, convirtiéndolo en una referencia en hadiz, creencia y respuesta a dudas históricas y doctrinales. Entre sus obras destaca la serie «Una etapa de la historia», análisis documentado de los acontecimientos, junto con investigaciones críticas sobre relatos débiles.","works":["<strong>Una etapa de la historia:</strong> Presentación analítica y documentada de los acontecimientos históricos.","<strong>Al descubierto Muhammad al-Tijani:</strong> Estudio crítico desde la ciencia del hadiz."],"quote":"Buscar el conocimiento islámico hoy es fácil con un clic, pero la bendición permanece en la paciencia y la constancia."}}},{"id":"said","initials":"س.ك","meta":{"ar":"1972 | المغرب","en":"1972 | Morocco","fr":"1972 | Maroc","es":"1972 | Marruecos"},"tags":{"ar":["الفقه المالكي","الحديث"],"en":["Maliki Fiqh","Hadith"],"fr":["Fiqh Malékite","Hadith"],"es":["Fiqh Malikí","Hadiz"]},"platforms":["YouTube","Facebook","Instagram","Podcasts"],"series":{"ar":["شرح موطأ الإمام مالك","شرح صحيح البخاري"],"en":["Explanation of Muwatta Imam Malik","Explanation of Sahih Al-Bukhari"],"fr":["Explication du Muwatta de l’imam Malik","Explication de Sahih al-Bukhari"],"es":["Explicación del Muwatta del imán Malik","Explicación de Sahih al-Bujari"]},"tr":{"ar":{"title":"فضيلة الشيخ الدكتور سعيد بن محمد الكملي","role":"فقيه مالكي ومحدث وأستاذ التعليم العالي","up":"وُلد الشيخ سعيد بن محمد الكملي في مدينة الرباط بالمغرب عام 1972م، ونشأ في أسرة عُرفت بالاهتمام بالعلم وحفظ القرآن. حفظ كتاب الله في سن مبكرة، ثم تتلمذ على عدد من علماء المغرب الأجلاء، فجمع بين التلقي التقليدي في حلقات العلم وبين الدراسة الأكاديمية النظامية.<br><br>تابع دراساته العليا في العلوم الشرعية، وتخصّص في الفقه المالكي والحديث وعلومهما، وتأثر بالمدرسة العلمية المغربية الأصيلة التي تعنى بالإسناد والتحقيق وضبط المتون. وقد مكّنه هذا التكوين المزدوج من الجمع بين عمق الفهم الفقهي ودقة النظر الحديثي والأصولي.","da":"اشتغل بالتدريس الجامعي والدروس العلمية، وصار من الوجوه البارزة في تجديد أساليب العرض والإلقاء مع الحفاظ على أصالة المحتوى. يتميز شرحه بالجمع بين دقة الاستنباط الفقهي على مذهب الإمام مالك، والبلاغة الأدبية، وحسن توظيف النقولات والشواهد، مما جعل دروسه في موطأ الإمام مالك وصحيح البخاري محط إقبال واسع.<br><br>له حضور علمي ودعوي داخل المغرب وخارجه عبر المحاضرات والمؤتمرات والمنصات الرقمية، حيث يعنى بتربية الطلبة على منهجية طلب العلم، والتدرج في المطولات، واحترام مذاهب الفقهاء. وأسهمت مؤلفاته وبحوثه في تناول مسائل معاصرة وفق الضوابط الشرعية، مع عناية خاصة بأصول الفقه وفروع الفقه المالكي.","works":["<strong>الأحكام الشرعية في الأسفار الجوية:</strong> بحث فقهي معاصر.","<strong>جني الثمرات من نظم الورقات</strong> في أصول الفقه."],"quote":"العلم رحم بين أهله، ولا يُنال إلا بالتواضع للأشياخ والصبر على جرد المطولات."},"en":{"title":"Sheikh Dr. Said bin Mohammed Al-Kamali","role":"Maliki Jurist, Hadith Scholar, and Professor","up":"Sheikh Dr. Said bin Mohammed Al-Kamali was born in Rabat, Morocco, in 1972 and grew up in a family known for its care for knowledge and Qur’an memorization. He memorized the Qur’an at an early age and studied under senior Moroccan scholars, combining traditional learning circles with formal academic education.<br><br>He pursued advanced studies in the Islamic sciences, specializing in Maliki jurisprudence, hadith, and their related disciplines. Influenced by the Moroccan scholarly tradition—distinguished by attention to chains of transmission and textual verification—he developed an approach joining deep juristic insight with careful methodology.","da":"He has worked in university teaching and scholarly instruction, becoming known for renewing methods of presentation while preserving authenticity of content. His explanations are marked by precise Maliki legal reasoning and effective use of evidences, making his lessons on the Muwatta of Imam Malik and Sahih al-Bukhari widely appreciated.<br><br>His scholarly presence extends within Morocco and abroad through lectures, conferences, and digital platforms. He trains students in sound methodology and gradual study of advanced texts, and his writings address contemporary issues within the framework of Maliki fiqh.","works":["<strong>Islamic Rulings on Air Travel:</strong> Contemporary Fiqh research.","<strong>Harvesting Fruits from Nadhm al-Waraqat</strong> in Usul al-Fiqh."],"quote":"Knowledge is a mercy among its people, attained only through humility to teachers."},"fr":{"title":"Cheikh Dr Saïd ben Mohammed Al-Kamali","role":"Juriste malikite, spécialiste du hadith et professeur","up":"Le cheikh Dr Saïd ben Mohammed Al-Kamali est né à Rabat en 1972, dans une famille attachée à la science et à la mémorisation du Coran. Il a mémorisé le Coran très jeune et a étudié auprès de grands savants marocains, alliant enseignement traditionnel et études académiques.<br><br>Il a poursuivi des études supérieures en sciences islamiques, se spécialisant en fiqh malikite, en hadith et dans leurs disciplines. Héritier de l’école savante marocaine, reconnue pour la rigueur des chaînes de transmission, il a développé une approche alliant profondeur juridique et précision méthodologique.","da":"Il a exercé dans l’enseignement universitaire et la transmission scientifique, se distinguant par le renouvellement des méthodes pédagogiques tout en préservant l’authenticité du contenu. Ses explications, fondées sur une déduction malikite précise, ont rendu ses cours sur le Muwatta et Sahih al-Bukhari très appréciés.<br><br>Sa présence s’étend au Maroc et à l’étranger par des conférences et des plateformes numériques. Il forme les étudiants à une méthodologie rigoureuse et à l’étude progressive des ouvrages de référence, et ses écrits traitent de questions contemporaines selon le fiqh malikite.","works":["<strong>Règles religieuses relatives aux voyages aériens :</strong> Recherche de fiqh contemporain.","<strong>Les fruits tirés de Nadhm al-Waraqat :</strong> Sur les fondements du droit islamique."],"quote":"La science est une miséricorde entre ses gens ; elle ne s’obtient que par l’humilité envers les maîtres et la patience."},"es":{"title":"Jeque Dr. Said bin Mohammed Al-Kamali","role":"Jurista malikí, especialista en hadiz y profesor","up":"El jeque Dr. Said bin Mohammed Al-Kamali nació en Rabat en 1972, en una familia dedicada al conocimiento y a la memorización del Corán. Memorizó el Corán a temprana edad y estudió con eruditos marroquíes, combinando el aprendizaje tradicional con la formación académica.<br><br>Realizó estudios avanzados en ciencias islámicas, especializándose en jurisprudencia malikí, hadiz y sus disciplinas. Influido por la tradición académica marroquí, distinguida por el cuidado de las cadenas de transmisión, desarrolló un enfoque que une profundidad jurídica y rigor metodológico.","da":"Ha trabajado en la enseñanza universitaria y la instrucción académica, destacando por renovar los métodos de exposición sin perder la autenticidad del contenido. Sus explicaciones, basadas en una precisa deducción malikí, han hecho muy valoradas sus clases sobre el Muwatta y Sahih al-Bujari.<br><br>Su presencia se extiende por Marruecos y el extranjero mediante conferencias y plataformas digitales. Forma a los estudiantes en una metodología sólida y el estudio gradual de obras clásicas, y sus escritos abordan cuestiones contemporáneas desde el fiqh malikí.","works":["<strong>Normas islámicas sobre los viajes aéreos:</strong> Investigación de fiqh contemporáneo.","<strong>Frutos de Nadhm al-Waraqat:</strong> Sobre los fundamentos de la jurisprudencia."],"quote":"El conocimiento es una misericordia entre su gente; solo se alcanza con humildad ante los maestros y paciencia."}}},{"id":"ayman","initials":"أ.ع","meta":{"ar":"1973 | مصر","en":"1973 | Egypt","fr":"1973 | Égypte","es":"1973 | Egipto"},"tags":{"ar":["اللغة العربية","الفكر"],"en":["Arabic Language","Thought"],"fr":["Langue Arabe","Pensée"],"es":["Lengua Árabe","Pensamiento"]},"platforms":["YouTube","Telegram","SoundCloud"],"series":{"ar":["دورة تأسيس وعي المسلم المعاصر"],"en":["Foundations of Contemporary Muslim Awareness"],"fr":["Fondements de la conscience du musulman contemporain"],"es":["Fundamentos de la conciencia del musulmán contemporáneo"]},"tr":{"ar":{"title":"المهندس الباحث أيمن عبد الرحيم","role":"باحث في العلوم الإنسانية واللغوية","up":"نشأ المهندس والباحث أيمن عبد الرحيم في مصر، ودرس الهندسة حيث اكتسب منهجية التفكير المنظم والتحليل الدقيق. ولم يقتصر اهتمامه على الجانب التقني، بل واظب على قراءة موسوعية في علوم اللغة العربية والتاريخ والاجتماع والفكر الإسلامي والإنساني.<br><br>شكّل هذا المسار المزدوج بين التكوين الهندسي والدراسة الإنسانية رافدًا مهمًا لمشروعه المعرفي، إذ اعتمد أدوات التحليل والنقد مع عناية باللغة والمصطلح والسياق التاريخي. وقد انعكس ذلك في اهتمامه بقضايا الوعي وبناء المفاهيم عند المسلم المعاصر.","da":"اشتهر عبر المنصات الرقمية بسلاسل محاضرات تأسيسية مكثفة تستهدف العقل الشبابي المثقف، وتهدف إلى بناء خريطة معرفية متماسكة تساعد المتلقي على فهم ذاته ودينه وتاريخه. تتناول محاضراته موضوعات اللغة، والتاريخ، والفكر، والاجتماع، وربط العلوم بالمنظور الإسلامي الشامل.<br><br>تميّز أسلوبه بالتركيز على الجذور والمقدمات المعرفية قبل الجزئيات، وبالدعوة إلى القراءة المنهجية والصبر على طلب العلم. وقد تحولت كثير من سلاسله الصوتية والمرئية إلى مواد مفرغة يستفيد منها الباحثون وطلاب العلم بوصفها مدخلًا لإعادة ترتيب الوعي وبناء الرؤية النقدية المتوازنة.","works":["<strong>سلاسل صوتية ومرئية مفرغة:</strong> تحولت إلى مقررات قراءة ذاتية."],"quote":"أزمة المسلم المعاصر ليست في نقص المعلومات، بل في غياب الخريطة المعرفية."},"en":{"title":"Eng. Ayman Abdel Rahim","role":"Researcher in Humanities and Linguistics","up":"Engineer and researcher Ayman Abdel Rahim was raised in Egypt and studied engineering, gaining a disciplined and analytical way of thinking. Beyond his technical background, he pursued extensive reading in Arabic language, history, sociology, and Islamic and human thought.<br><br>This dual path—engineering training combined with humanistic study—became a foundation for his intellectual project. He employs analytical tools while paying close attention to language, concepts, and historical context, especially regarding awareness and concept-building for contemporary Muslims.","da":"He became widely known through digital platforms for foundational lecture series aimed at educated youth, seeking to build a coherent intellectual map for understanding oneself, faith, and history. His talks address language, history, thought, and society from a comprehensive Islamic perspective.<br><br>His style emphasizes foundations before details and encourages methodical reading and patience in seeking knowledge. Many of his audio and video series have been transcribed into study materials used by those seeking to develop a balanced critical outlook.","works":["<strong>Transcribed Audio/Video Series:</strong> Turned into self-study curricula."],"quote":"The crisis of the contemporary Muslim is the absence of an epistemological map."},"fr":{"title":"Ingénieur et chercheur Ayman Abdel Rahim","role":"Chercheur en sciences humaines et linguistiques","up":"L’ingénieur et chercheur Ayman Abdel Rahim a grandi en Égypte et a étudié l’ingénierie, acquérant une pensée rigoureuse et analytique. Au-delà de sa formation technique, il a mené de vastes lectures en langue arabe, en histoire, en sociologie ainsi qu’en pensée islamique et humaine.<br><br>Ce double parcours, entre ingénierie et sciences humaines, constitue le socle de son projet intellectuel. Il s’appuie sur des outils d’analyse tout en accordant une grande attention à la langue, aux concepts et au contexte historique, notamment pour la conscience du musulman contemporain.","da":"Il s’est fait connaître sur les plateformes numériques par des séries de conférences fondatrices destinées aux jeunes instruits, visant à construire une carte intellectuelle cohérente pour comprendre soi-même, sa religion et son histoire. Ses interventions abordent la langue, l’histoire, la pensée et la société dans une perspective islamique globale.<br><br>Son approche met l’accent sur les fondements avant les détails et encourage la lecture méthodique et la patience dans l’apprentissage. Nombre de ses séries ont été transcrites et servent de supports d’étude pour développer une vision critique équilibrée.","works":["<strong>Séries audio et vidéo transcrites :</strong> Devenues des supports d’autoformation."],"quote":"La crise du musulman contemporain n’est pas le manque d’informations, mais l’absence de carte intellectuelle."},"es":{"title":"Ingeniero e investigador Ayman Abdel Rahim","role":"Investigador en ciencias humanas y lingüísticas","up":"El ingeniero e investigador Ayman Abdel Rahim creció en Egipto y estudió ingeniería, adquiriendo un pensamiento riguroso y analítico. Más allá de su formación técnica, realizó amplias lecturas en lengua árabe, historia, sociología y pensamiento islámico y humano.<br><br>Este doble recorrido, entre ingeniería y ciencias humanas, constituye la base de su proyecto intelectual. Emplea herramientas de análisis prestando especial atención al lenguaje, los conceptos y el contexto histórico, en particular para la conciencia del musulmán contemporáneo.","da":"Se hizo conocido en plataformas digitales por sus series de conferencias fundamentales dirigidas a jóvenes instruidos, con el objetivo de construir un mapa intelectual coherente para comprenderse a uno mismo, la fe y la historia. Sus charlas abordan la lengua, la historia, el pensamiento y la sociedad desde una perspectiva islámica integral.<br><br>Su enfoque enfatiza los fundamentos antes que los detalles y fomenta la lectura metódica y la paciencia en el aprendizaje. Muchas de sus series han sido transcritas y se utilizan como materiales de estudio para desarrollar una visión crítica equilibrada.","works":["<strong>Series de audio y vídeo transcritas:</strong> Convertidas en materiales de autoaprendizaje."],"quote":"La crisis del musulmán contemporáneo no es la falta de información, sino la ausencia de un mapa intelectual."}}},{"id":"eyad","initials":"إ.ق","meta":{"ar":"1975 | الأردن","en":"1975 | Jordan","fr":"1975 | Jordanie","es":"1975 | Jordania"},"tags":{"ar":["الإلحاد المعاصر","علم الأدوية"],"en":["Atheism","Pharmacology"],"fr":["Athéisme","Pharmacologie"],"es":["Ateísmo","Farmacología"]},"platforms":["YouTube","Telegram","Facebook"],"series":{"ar":["سلسلة رحلة اليقين"],"en":["Journey of Certainty"],"fr":["Série : Le voyage de la certitude"],"es":["Serie: El viaje de la certeza"]},"tr":{"ar":{"title":"الدكتور إياد بن عبد الحافظ قنيبي","role":"أستاذ جامعي في علم الأدوية وباحث في القضايا الفكرية","up":"وُلد الدكتور إياد بن عبد الحافظ قنيبي في الأردن عام 1975م، وتلقى تعليمه العام في بلده، ثم تابع دراساته العليا في العلوم الصيدلانية. حصل على درجة الدكتوراه في علم الأدوية (Pharmacology) من جامعة هيوستن بولاية تكساس في الولايات المتحدة الأمريكية، وهو تخصص دقيق يقوم على البحث التجريبي والتحليل العلمي.<br><br>عمل أستاذًا جامعيًا في علم الأدوية في الجامعات الأردنية، ونشر أبحاثًا علمية محكّمة في مجاله الأكاديمي. وقد منحته خلفيته العلمية الصلبة قدرة على التعامل مع القضايا المعاصرة التي تُطرح باسم العلم، والتمييز بين النتائج التجريبية والتأويلات الفلسفية الملبسة بها.","da":"برز على الساحة الفكرية والدعوية بوصفه أحد أبرز المتخصصين في تفكيك شبهات الإلحاد الجديد والمادية العلمية، ولا سيما ما يُوجَّه منها إلى الشباب في الفضاء الرقمي. قدّم سلسلة «رحلة اليقين» التي ناقش فيها قضايا الإيمان والعلم والغاية بمعالجة تجمع بين وضوح الطرح وعمق الحجة.<br><br>يعتمد في خطابه على المنهج العقلاني المنضبط واحترام حقائق العلم التجريبي، مع بيان حدود المنهج العلمي وعدم خلطه بالفلسفات الإلحادية. وأسهمت محاضراته ومقالاته ومشاركاته في ترسيخ الثقة بالإسلام لدى كثير من الباحثين، وفي تقديم نموذج للمثقف المسلم الذي يجمع بين التخصص الأكاديمي والاهتمام بالقضايا العقدية والفكرية.","works":["<strong>أبحاث علمية محكمة:</strong> في مجال الصيدلة وعلم الأدوية."],"quote":"العلم التجريبي الصحيح إذا تجرد من الأيديولوجيا فإنه يقود حتماً إلى الإيمان."},"en":{"title":"Dr. Eyad bin Abdul Hafiz Qunaibi","role":"Professor of Pharmacology & Intellectual Researcher","up":"Dr. Eyad bin Abdul Hafiz Qunaibi was born in Jordan in 1975 and completed his early education there before pursuing advanced studies in pharmaceutical sciences. He earned a PhD in Pharmacology from the University of Houston, Texas, a field grounded in experimental research and scientific analysis.<br><br>He worked as a university professor of pharmacology in Jordan and published peer-reviewed research in his academic field. His strong scientific background enables him to address contemporary issues presented in the name of science, distinguishing empirical findings from philosophical interpretations.","da":"He emerged as a prominent intellectual voice addressing doubts of New Atheism and scientific materialism, particularly among youth in the digital space. He presented the series “Journey of Certainty,” discussing faith, science, and purpose with clarity and depth.<br><br>His approach combines disciplined rational discourse with respect for empirical science, while clarifying the limits of the scientific method and avoiding its confusion with atheistic philosophies. His lectures and writings have strengthened confidence in Islam among many seekers and presented a model of a Muslim academic engaging intellectual concerns.","works":["<strong>Peer-Reviewed Research:</strong> In pharmacy and pharmacology."],"quote":"Correct empirical science, stripped of ideology, inevitably leads to faith."},"fr":{"title":"Dr Eyad ben Abdul Hafiz Qunaibi","role":"Professeur de pharmacologie et chercheur en pensée contemporaine","up":"Le Dr Eyad ben Abdul Hafiz Qunaibi est né en Jordanie en 1975. Il a poursuivi des études supérieures en sciences pharmaceutiques et a obtenu un doctorat en pharmacologie à l’Université de Houston (Texas), une spécialité fondée sur la recherche expérimentale.<br><br>Il a enseigné la pharmacologie dans des universités jordaniennes et publié des recherches scientifiques évaluées par des pairs. Cette solide formation lui permet d’aborder avec rigueur les questions contemporaines présentées au nom de la science, en distinguant les faits empiriques des interprétations philosophiques.","da":"Il s’est imposé comme une voix majeure dans la réponse aux doutes liés au nouvel athéisme et au matérialisme scientifique, notamment auprès des jeunes. Il a présenté la série « Le voyage de la certitude », traitant de la foi, de la science et du sens avec clarté et profondeur.<br><br>Son discours se distingue par une approche rationnelle mesurée et le respect des faits scientifiques, tout en soulignant les limites de la méthode scientifique. Ses conférences et écrits ont contribué à renforcer la confiance en l’islam et à offrir un modèle d’universitaire musulman engagé sur les questions intellectuelles.","works":["<strong>Recherches scientifiques évaluées par des pairs :</strong> Dans le domaine de la pharmacie et de la pharmacologie."],"quote":"La science expérimentale correcte, débarrassée de l’idéologie, conduit inévitablement à la foi."},"es":{"title":"Dr. Eyad bin Abdul Hafiz Qunaibi","role":"Profesor de farmacología e investigador intelectual","up":"El Dr. Eyad bin Abdul Hafiz Qunaibi nació en Jordania en 1975. Realizó estudios avanzados en ciencias farmacéuticas y obtuvo un doctorado en Farmacología en la Universidad de Houston (Texas), una especialidad basada en la investigación experimental.<br><br>Trabajó como profesor universitario de farmacología en Jordania y publicó investigaciones revisadas por pares. Su sólida formación científica le permite abordar con rigor cuestiones contemporáneas presentadas en nombre de la ciencia, distinguiendo los hallazgos empíricos de las interpretaciones filosóficas.","da":"Se destacó como una voz relevante en la respuesta a las dudas del nuevo ateísmo y del materialismo científico, especialmente entre los jóvenes. Presentó la serie «El viaje de la certeza», en la que abordó la fe, la ciencia y el propósito con claridad y profundidad.<br><br>Su enfoque combina un discurso racional disciplinado con el respeto por la ciencia empírica, aclarando los límites del método científico. Sus conferencias y escritos han contribuido a fortalecer la confianza en el islam y a ofrecer un modelo de académico musulmán comprometido con las cuestiones intelectuales.","works":["<strong>Investigaciones científicas revisadas por pares:</strong> En el ámbito de la farmacia y la farmacología."],"quote":"La ciencia experimental correcta, libre de ideología, conduce inevitablemente a la fe."}}},{"id":"menk","initials":"م.م","meta":{"ar":"1975 | زيمبابوي","en":"1975 | Zimbabwe","fr":"1975 | Zimbabwe","es":"1975 | Zimbabue"},"tags":{"ar":["الفقه","الدعوة"],"en":["Fiqh","Da'wah"],"fr":["Fiqh","Da'wah"],"es":["Fiqh","Da'wah"]},"platforms":["YouTube","Facebook","Instagram","X (Twitter)"],"series":{"ar":["سلسلة قصص الأنبياء"],"en":["Stories of the Prophets"],"fr":["Histoires des prophètes"],"es":["Historias de los profetas"]},"tr":{"ar":{"title":"فضيلة المفتي إسماعيل بن موسى منك","role":"المفتي الأكبر في زيمبابوي","up":"وُلد الشيخ إسماعيل بن موسى منك في هراري بزيمبابوي عام 1975م، ونشأ في أسرة مسلمة محافظة. حفظ القرآن الكريم في سن مبكرة، وتلقى علومه الأولى في بلده، ثم شدّ الرحال إلى المدينة المنورة حيث التحق بالجامعة الإسلامية.<br><br>تخرّج في كلية الشريعة بالجامعة الإسلامية بالمدينة المنورة، وتلقّى العلم على أيدي عدد من المشايخ والأساتذة، فتكوّن لديه أساس متين في الفقه وأصوله وعلوم القرآن والسنة. وقد ساعده هذا التكوين الشرعي النظامي، إلى جانب نشأته في بيئة متعددة الثقافات، على مخاطبة شرائح واسعة بلغات وأساليب متنوعة.","da":"يشغل منصب المفتي الأكبر في زيمبابوي، ويُعد من أكثر الدعاة المسلمين تأثيرًا وانتشارًا على المستوى العالمي. اشتهر بخطبه ودروسه القصيرة والمؤثرة التي تركز على التزكية، وإصلاح النفس، والتسامح، وتعزيز القيم الأخلاقية، مع حرص على الخطاب الوسطى الميسر.<br><br>شارك في مؤتمرات ولقاءات دعوية في قارات مختلفة، وبلغت محاضراته ومقاطعه المرئية ملايين المتابعين عبر منصات التواصل. ومن أبرز أعماله سلسلة «قصص الأنبياء» ودروس في السيرة والرقائق، حيث يجمع في طرحه بين الموعظة العملية والربط بواقع الناس اليومي، داعيًا إلى حسن الظن بالله والإحسان إلى الخلق.","works":["<strong>محاضرات ودروس صوتية ومرئية:</strong> تُعد من أكثر المحتوى الإسلامي انتشاراً."],"quote":"أحسن الظن بالله، واعمل صالحاً، ولا تحقرن من المعروف شيئاً."},"en":{"title":"Mufti Ismail ibn Musa Menk","role":"Grand Mufti of Zimbabwe","up":"Mufti Ismail ibn Musa Menk was born in Harare, Zimbabwe, in 1975 and grew up in a devout Muslim family. He memorized the Qur’an at an early age and received his early education in Zimbabwe before traveling to Madinah to study at the Islamic University.<br><br>He graduated from the College of Sharia at the Islamic University of Madinah, studying under several scholars. This formal training, together with his upbringing in a multicultural environment, provided him with a solid foundation in Islamic sciences and the ability to address diverse audiences.","da":"He serves as the Grand Mufti of Zimbabwe and is among the most influential Muslim preachers globally. He is known for short, impactful talks focusing on spiritual development, self-reform, compassion, and ethical values in a moderate and accessible style.<br><br>He has participated in conferences worldwide and his lectures reach millions through digital platforms. Among his well-known works is the series “Stories of the Prophets” as well as lessons on biography and spiritual reminders, combining practical advice with encouragement toward trust in God and kindness to others.","works":["<strong>Audio/Video Lectures:</strong> Among the most widespread Islamic content."],"quote":"Think well of Allah, do good, and never belittle a good deed."},"fr":{"title":"Moufti Ismaïl ibn Moussa Menk","role":"Grand moufti du Zimbabwe","up":"Le moufti Ismaïl ibn Moussa Menk est né à Harare (Zimbabwe) en 1975 et a grandi dans une famille musulmane pratiquante. Il a mémorisé le Coran très jeune et a reçu sa première formation au Zimbabwe avant d’étudier à l’Université islamique de Médine.<br><br>Diplômé de la faculté de charia de l’Université islamique de Médine, il a étudié auprès de nombreux enseignants. Cette formation religieuse solide, associée à son expérience dans un environnement multiculturel, lui permet de s’adresser à un public très divers.","da":"Il est grand moufti du Zimbabwe et l’un des prédicateurs musulmans les plus influents au monde. Il est connu pour ses discours courts et percutants axés sur la purification de l’âme, la réforme personnelle, la compassion et les valeurs éthiques, dans un style modéré et accessible.<br><br>Il participe à des conférences internationales et ses enseignements touchent des millions de personnes via les plateformes numériques. Parmi ses œuvres figurent la série « Histoires des prophètes » et des leçons sur la biographie prophétique, alliant conseils pratiques et encouragement à la confiance en Dieu.","works":["<strong>Conférences et cours audio/vidéo :</strong> Parmi les contenus islamiques les plus diffusés."],"quote":"Aie une bonne opinion d’Allah, fais le bien et ne méprise aucune bonne action."},"es":{"title":"Muftí Ismail ibn Musa Menk","role":"Gran muftí de Zimbabue","up":"El muftí Ismail ibn Musa Menk nació en Harare (Zimbabue) en 1975 y creció en una familia musulmana practicante. Memorizó el Corán a temprana edad y recibió su formación inicial en Zimbabue antes de estudiar en la Universidad Islámica de Medina.<br><br>Se graduó en la Facultad de Sharía de la Universidad Islámica de Medina, donde estudió con diversos maestros. Esta formación religiosa, junto con su experiencia en un entorno multicultural, le permite dirigirse a audiencias muy diversas.","da":"Ejerce como gran muftí de Zimbabue y es uno de los predicadores musulmanes más influyentes del mundo. Es conocido por sus charlas breves y profundas centradas en la purificación del alma, la reforma personal, la compasión y los valores éticos, con un estilo moderado y accesible.<br><br>Participa en conferencias internacionales y sus enseñanzas alcanzan a millones de personas a través de plataformas digitales. Entre sus trabajos destacan la serie «Historias de los profetas» y lecciones sobre la biografía profética, que combinan consejos prácticos y confianza en Dios.","works":["<strong>Conferencias y lecciones en audio/vídeo:</strong> Entre los contenidos islámicos más difundidos."],"quote":"Piensa bien de Allah, haz el bien y no menosprecies ninguna buena acción."}}},{"id":"omar","initials":"ع.س","meta":{"ar":"1986 | أمريكا","en":"1986 | USA","fr":"1986 | États-Unis","es":"1986 | EE.UU."},"tags":{"ar":["البحوث الإسلامية"],"en":["Islamic Research"],"fr":["Recherche Islamique"],"es":["Investigación Islámica"]},"platforms":["YouTube","Instagram","Facebook","X (Twitter)"],"series":{"ar":["شرح أسماء الله الحسنى"],"en":["Names of Allah"],"fr":["Les Noms d’Allah"],"es":["Los Nombres de Allah"]},"tr":{"ar":{"title":"الإمام الدكتور عمر سليمان","role":"مؤسس ورئيس معهد يقين للبحوث الإسلامية","up":"وُلد الإمام عمر سليمان في مدينة نيو أورلينز بولاية لويزيانا في الولايات المتحدة الأمريكية عام 1986م، ونشأ في بيئة مسلمة نشطة. بدأ طلب العلم الشرعي في سن مبكرة، فدرس في الأردن وماليزيا والإمارات وعدة مراكز علمية، وحصل على إجازات في العلوم الشرعية.<br><br>أكمل دراساته العليا فحصل على درجتي الماجستير والدكتوراه في الفكر الإسلامي والحضارة الإسلامية من المعهد الدولي للفكر والحضارة الإسلامية في ماليزيا. وقد جمع في تكوينه بين الدراسة الأكاديمية الحديثة والاطلاع على التراث الفقهي والعقدي، مع اهتمام خاص بالقضايا المعاصرة التي تواجه المسلمين في الغرب.","da":"يُعرف بوصفه مؤسس ورئيس معهد «يقين» للبحوث الإسلامية، وهي مؤسسة بحثية تسعى إلى تقديم محتوى إسلامي موثوق يعالج الشبهات الفكرية والاجتماعية بلغة علمية رصينة وميسرة. كما يعمل أستاذًا للدراسات الإسلامية، وله نشاط واسع في الخطابة والتدريس والإرشاد المجتمعي.<br><br>قدّم محاضرات وسلاسل مؤثرة في السيرة النبوية، وأسماء الله الحسنى، والعدالة الاجتماعية، والقضايا الأخلاقية المعاصرة. ويتميز خطابه بالجمع بين التأصيل الشرعي والاهتمام بالواقع الإنساني، مع حضور بارز في المبادرات الدعوية والخيرية، مما جعله من الأصوات المؤثرة لدى المسلمين في أمريكا الشمالية وخارجها.","works":["<strong>مؤلفات وبحوث محكمة</strong> في الفكر الإسلامي."],"quote":"الإيمان ليس مجرد شعور، بل هو منظومة معرفية وأخلاقية."},"en":{"title":"Imam Dr. Omar Suleiman","role":"Founder of Yaqeen Institute","up":"Imam Omar Suleiman was born in New Orleans, Louisiana, in 1986 and grew up in an active Muslim environment. He began studying Islamic sciences at an early age in various countries and centers, earning traditional licenses in religious studies.<br><br>He completed graduate studies, obtaining both a Master’s and a PhD in Islamic thought and civilization from the International Institute of Islamic Thought and Civilization in Malaysia. His education combines modern academic training with classical Islamic scholarship, with attention to contemporary issues facing Muslims in the West.","da":"He is the founder and president of Yaqeen Institute for Islamic Research, an organization dedicated to providing reliable Islamic content that addresses intellectual and social questions. He also serves as a professor of Islamic studies and is active in teaching, preaching, and community service.<br><br>He has delivered influential lectures and series on the Prophetic biography, the Names of Allah, social justice, and contemporary ethics. His work combines scholarly grounding with concern for real human needs, making him a prominent voice among Muslims in North America and beyond.","works":["<strong>Books and Research</strong> in Islamic Thought."],"quote":"Faith is not just a feeling; it is a knowledge and moral system."},"fr":{"title":"Imam Dr Omar Suleiman","role":"Fondateur de l’Institut Yaqeen","up":"L’imam Omar Suleiman est né à La Nouvelle-Orléans en 1986 et a grandi dans un environnement musulman actif. Il a commencé très jeune l’étude des sciences islamiques dans plusieurs pays et a obtenu des autorisations traditionnelles d’enseignement.<br><br>Il a obtenu un master puis un doctorat en pensée et civilisation islamiques à l’Institut international de la pensée et de la civilisation islamiques en Malaisie. Son parcours associe formation académique moderne et étude du patrimoine islamique, avec une attention particulière aux enjeux contemporains des musulmans en Occident.","da":"Il est le fondateur et président de l’Institut Yaqeen pour la recherche islamique, qui produit des contenus fiables répondant aux questions intellectuelles et sociales. Il enseigne les études islamiques et mène des activités de prédication et de service communautaire.<br><br>Il a présenté des conférences et séries influentes sur la biographie prophétique, les Noms d’Allah, la justice sociale et l’éthique contemporaine. Son discours allie rigueur scientifique et sens des réalités humaines, ce qui en fait une voix influente en Amérique du Nord et ailleurs.","works":["<strong>Livres et recherches :</strong> En pensée islamique."],"quote":"La foi n’est pas seulement un sentiment ; c’est un savoir et un système moral."},"es":{"title":"Imam Dr. Omar Suleiman","role":"Fundador del Instituto Yaqeen","up":"El imán Omar Suleiman nació en Nueva Orleans en 1986 y creció en un entorno musulmán activo. Desde joven estudió ciencias islámicas en varios países y obtuvo licencias tradicionales de enseñanza.<br><br>Obtuvo una maestría y un doctorado en pensamiento y civilización islámicos en el Instituto Internacional de Pensamiento y Civilización Islámicos de Malasia. Su formación combina la academia moderna con el estudio del patrimonio islámico, con atención a los desafíos contemporáneos de los musulmanes en Occidente.","da":"Es fundador y presidente del Instituto Yaqeen para la Investigación Islámica, que ofrece contenidos fiables sobre cuestiones intelectuales y sociales. También es profesor de estudios islámicos y participa activamente en la enseñanza, la predicación y el servicio comunitario.<br><br>Ha impartido conferencias y series influyentes sobre la biografía profética, los Nombres de Allah, la justicia social y la ética contemporánea. Su labor combina rigor académico y sensibilidad humana, lo que lo convierte en una voz destacada en Norteamérica y más allá.","works":["<strong>Libros e investigaciones:</strong> En pensamiento islámico."],"quote":"La fe no es solo un sentimiento; es conocimiento y un sistema moral."}}},{"id":"yasir","initials":"ي.ق","meta":{"ar":"1975 | أمريكا","en":"1975 | USA","fr":"1975 | États-Unis","es":"1975 | EE.UU."},"tags":{"ar":["العقيدة"],"en":["Aqeedah"],"fr":["Aqidah"],"es":["Aqidah"]},"platforms":["YouTube","Facebook","X (Twitter)"],"series":{"ar":["شرح العقيدة الطحاوية"],"en":["Aqeedah Tahawiyyah"],"fr":["Explication de la ‘Aqida Tahawiyya"],"es":["Explicación de la ‘Aqida Tahawiyya"]},"tr":{"ar":{"title":"الشيخ الدكتور ياسر قاضي","role":"عالم مسلم وباحث في العقيدة","up":"وُلد الشيخ ياسر قاضي في هيوستن بولاية تكساس عام 1975م لأبوين باكستانيين، ونشأ في الولايات المتحدة. بدأ دراسته الجامعية في الهندسة الكيميائية بجامعة هيوستن، ثم اتجه إلى دراسة العلوم الشرعية، فالتحق بالجامعة الإسلامية بالمدينة المنورة حيث حصل على درجة البكالوريوس في علوم الحديث.<br><br>واصل دراساته العليا في المدينة المنورة فنال درجة الماجستير في العقيدة والمذاهب المعاصرة، ثم عاد إلى الولايات المتحدة وأكمل الدكتوراه في الدراسات الإسلامية بجامعة ييل. وقد منحه هذا المسار الفريد الجمع بين البيئة الغربية والتكوين الشرعي النظامي والبحث الأكاديمي المتقدم.","da":"يُعد من أبرز العلماء والدعاة المسلمين في أمريكا الشمالية، وله إسهامات واسعة في التدريس والخطابة والتأليف. شغل مناصب أكاديمية ودعوية عديدة، من بينها عميد الشؤون الأكاديمية في معهد «المغرب»، والعمل في الإرشاد الديني والتعليم الإسلامي المؤسسي، مع اهتمام خاص بقضايا العقيدة والفكر المعاصر.<br><br>قدّم شروحًا ودروسًا مطولة في كتب العقيدة والحديث والسيرة، واشتهر بقدرته على معالجة الإشكالات العقدية والفكرية التي تواجه الشباب المسلم في الغرب بلغة تجمع بين العمق العلمي والوضوح. كما شارك في حوارات ومؤتمرات علمية ودعوية، وأسهم في بناء خطاب إسلامي متوازن يراعي الثوابت ويعالج الواقع.","works":["<strong>مؤلفات في العقيدة.</strong>"],"quote":"لا خير في علم لا يورث خشية."},"en":{"title":"Sheikh Dr. Yasir Qadhi","role":"Scholar and Researcher in Aqeedah","up":"Sheikh Dr. Yasir Qadhi was born in Houston, Texas, in 1975 and grew up in the United States. He initially studied chemical engineering at the University of Houston before turning to Islamic sciences, earning a bachelor’s degree in Hadith Sciences from the Islamic University of Madinah.<br><br>He continued his graduate studies in Madinah with a Master’s degree in Islamic Theology and later completed a PhD in Islamic Studies at Yale University. This unique path combined a Western upbringing with formal Islamic training and advanced academic research.","da":"He is one of the most prominent Muslim scholars and speakers in North America, contributing widely to teaching, preaching, and writing. He has held various academic and religious roles, including Dean of Academic Affairs at Al-Maghrib Institute, with a focus on creed and contemporary thought.<br><br>He has delivered extensive lectures on theology, hadith, and Prophetic biography. Known for addressing intellectual challenges faced by Muslim youth in the West, he combines scholarly depth with clarity and participates actively in educational initiatives and conferences.","works":["<strong>Books on Aqeedah.</strong>"],"quote":"There is no good in knowledge that does not breed piety."},"fr":{"title":"Cheikh Dr Yasir Qadhi","role":"Érudit et chercheur en croyance (‘aqida)","up":"Le cheikh Dr Yasir Qadhi est né à Houston en 1975 et a grandi aux États-Unis. Après des études en génie chimique, il s’est orienté vers les sciences islamiques et a obtenu une licence en sciences du hadith à l’Université islamique de Médine.<br><br>Il a poursuivi un master en théologie islamique à Médine, puis un doctorat en études islamiques à l’Université Yale. Ce parcours associe culture occidentale, formation religieuse classique et recherche académique avancée.","da":"Il est l’un des érudits et conférenciers musulmans les plus influents d’Amérique du Nord, actif dans l’enseignement, la prédication et l’écriture. Il a occupé diverses fonctions, notamment doyen des affaires académiques à l’Institut Al-Maghrib, avec un intérêt pour la croyance et la pensée contemporaine.<br><br>Il a donné de nombreux cours sur la théologie, le hadith et la biographie prophétique. Reconnu pour traiter les questions intellectuelles des jeunes musulmans en Occident, il allie profondeur scientifique et clarté dans un discours équilibré.","works":["<strong>Ouvrages sur la croyance :</strong> Travaux en ‘aqida et études islamiques."],"quote":"Il n’y a aucun bien dans une science qui n’engendre pas la piété."},"es":{"title":"Jeque Dr. Yasir Qadhi","role":"Erudito e investigador en creencia (‘aqida)","up":"El jeque Dr. Yasir Qadhi nació en Houston en 1975 y creció en Estados Unidos. Tras iniciar estudios de ingeniería química, se orientó hacia las ciencias islámicas y obtuvo una licenciatura en Ciencias del Hadiz en la Universidad Islámica de Medina.<br><br>Continuó con una maestría en teología islámica en Medina y posteriormente obtuvo un doctorado en Estudios Islámicos en la Universidad de Yale. Esta trayectoria combina formación occidental, educación islámica formal e investigación académica avanzada.","da":"Es uno de los eruditos y conferenciantes musulmanes más destacados de Norteamérica, con aportes en la enseñanza, la predicación y la escritura. Ha desempeñado diversos cargos, incluido el de decano académico en el Instituto Al-Maghrib, con interés en la creencia y el pensamiento contemporáneo.<br><br>Ha impartido numerosas clases sobre teología, hadiz y biografía profética. Es conocido por abordar los desafíos intelectuales de los jóvenes musulmanes en Occidente, combinando profundidad académica y claridad en un discurso equilibrado.","works":["<strong>Libros sobre la creencia:</strong> Obras en ‘aqida y estudios islámicos."],"quote":"No hay bien en un conocimiento que no genere piedad."}}},{"id":"nouman","initials":"ن.ع","meta":{"ar":"1978 | ألمانيا","en":"1978 | Germany","fr":"1978 | Allemagne","es":"1978 | Alemania"},"tags":{"ar":["اللغة العربية"],"en":["Arabic"],"fr":["Arabe"],"es":["Árabe"]},"platforms":["YouTube","Instagram","Facebook"],"series":{"ar":["تفسير جزء عم"],"en":["Tafsir Juz Amma"],"fr":["Tafsir du Juz Amma"],"es":["Tafsir del Yuz Amma"]},"tr":{"ar":{"title":"الأستاذ نعمان علي خان","role":"مؤسس معهد البيان","up":"وُلد الأستاذ نعمان علي خان في برلين بألمانيا عام 1978م لأبوين باكستانيين، وانتقل مع أسرته إلى الولايات المتحدة في سن مبكرة حيث نشأ وتلقى تعليمه. اهتم باللغة العربية منذ صغره، فالتحق بدورات مكثفة في دراسة العربية والقرآن في باكستان والمملكة العربية السعودية.<br><br>كرّس سنوات طويلة لدراسة النحو والبلاغة وعلوم القرآن، وتأثر بالمدرسة اللغوية في مقاربة النص القرآني. وقد شكّل هذا التخصص المبكر في العربية أساس مشروعه التعليمي الذي يهدف إلى تقريب معاني القرآن إلى الناطقين بالإنجليزية وغير المختصين بأسلوب مباشر وعميق.","da":"أسس معهد «بيّنة» (Bayyinah Institute) في الولايات المتحدة، وهو مؤسسة تعليمية تُعنى بتدريس اللغة العربية وعلوم القرآن، وقدّمت برامج مكثفة حضورية وإلكترونية استفاد منها آلاف الطلاب حول العالم. اشتهر بسلاسل تفسير أجزاء من القرآن الكريم، ولا سيما تفسير جزء عمّ وسور مختارة، بأسلوب لغوي تربوي مميز.<br><br>يُعد من أكثر الدعاة والمربين المسلمين تأثيرًا في الغرب، حيث يركز على تدبر القرآن وبناء الصلة الشخصية به، مع معالجة قضايا الهوية والإيمان والتربية. وتمتاز محاضراته بالجمع بين التحليل اللغوي الدقيق واللمسة الوعظية المؤثرة، مما جعل محتواه واسع الانتشار بين الشباب والأسر المسلمة.","works":["<strong>سلسلة محاضرات ودروس.</strong>"],"quote":"القرآن ليس كتاباً يُقرأ فحسب، بل هو خطاب حي."},"en":{"title":"Ustadh Nouman Ali Khan","role":"Founder of Bayyinah Institute","up":"Ustadh Nouman Ali Khan was born in Berlin, Germany, in 1978 to Pakistani parents and moved to the United States at a young age. He developed an early interest in Arabic and pursued intensive studies in Arabic and Qur’anic sciences in Pakistan and Saudi Arabia.<br><br>He devoted years to studying Arabic grammar, rhetoric, and Qur’anic sciences, adopting a linguistic approach to the Qur’anic text. This specialization formed the basis of his mission to make the meanings of the Qur’an accessible to English speakers and non-specialists in a direct and profound way.","da":"He founded Bayyinah Institute in the United States, an educational institution focused on teaching Arabic and Qur’anic studies through intensive in-person and online programs. He is widely known for tafsir series on portions of the Qur’an, especially Juz Amma, delivered in a distinctive linguistic and educational style.<br><br>He is considered one of the most influential Muslim educators in the West, emphasizing reflection on the Qur’an and building a personal connection with it while addressing identity, faith, and upbringing. His lectures combine careful linguistic analysis with heartfelt reminders.","works":["<strong>Lecture Series.</strong>"],"quote":"The Quran is not just a book to be read; it is a living address."},"fr":{"title":"Oustadh Nouman Ali Khan","role":"Fondateur de l’Institut Bayyinah","up":"L’oustadh Nouman Ali Khan est né à Berlin en 1978 et a grandi aux États-Unis. Il s’est intéressé très tôt à la langue arabe et a suivi des études intensives en arabe et en sciences coraniques au Pakistan et en Arabie saoudite.<br><br>Il a consacré plusieurs années à l’étude de la grammaire arabe, de la rhétorique et des sciences du Coran, en adoptant une approche linguistique du texte. Cette spécialisation a fondé son projet visant à rendre les sens du Coran accessibles aux anglophones et aux non-spécialistes.","da":"Il a fondé l’Institut Bayyinah aux États-Unis, dédié à l’enseignement de l’arabe et des sciences coraniques par des programmes intensifs en présentiel et en ligne. Il est connu pour ses séries de tafsir, notamment sur le Juz Amma, dans un style linguistique et pédagogique distinctif.<br><br>Il est l’un des éducateurs musulmans les plus influents en Occident, mettant l’accent sur la méditation du Coran et le lien personnel avec celui-ci, tout en abordant les questions d’identité, de foi et d’éducation. Ses conférences allient analyse linguistique rigoureuse et rappels inspirants.","works":["<strong>Séries de conférences :</strong> Notamment des cours de tafsir."],"quote":"Le Coran n’est pas seulement un livre à lire ; c’est un message vivant."},"es":{"title":"Ustadh Nouman Ali Khan","role":"Fundador del Instituto Bayyinah","up":"El ustadh Nouman Ali Khan nació en Berlín en 1978 y creció en Estados Unidos. Desde joven se interesó por la lengua árabe y realizó estudios intensivos de árabe y ciencias coránicas en Pakistán y Arabia Saudita.<br><br>Dedicó años al estudio de la gramática árabe, la retórica y las ciencias del Corán, adoptando un enfoque lingüístico del texto. Esta especialización fue la base de su proyecto para acercar los significados del Corán a hablantes de inglés y no especialistas.","da":"Fundó el Instituto Bayyinah en Estados Unidos, dedicado a la enseñanza del árabe y las ciencias coránicas mediante programas intensivos presenciales y en línea. Es conocido por sus series de tafsir, especialmente del Yuz Amma, con un estilo lingüístico y educativo distintivo.<br><br>Es uno de los educadores musulmanes más influyentes en Occidente, enfocado en la reflexión sobre el Corán y en fortalecer la conexión personal con él, abordando cuestiones de identidad, fe y educación. Sus conferencias combinan análisis lingüístico cuidadoso y recordatorios inspiradores.","works":["<strong>Series de conferencias:</strong> Incluidos cursos de tafsir."],"quote":"El Corán no es solo un libro para leer; es un mensaje vivo."}}},{"id":"zakir","initials":"ذ.ن","meta":{"ar":"1965 | الهند","en":"1965 | India","fr":"1965 | Inde","es":"1965 | India"},"tags":{"ar":["الأديان المقارنة"],"en":["Comparative Religion"],"fr":["Religions Comparées"],"es":["Religión Comparada"]},"platforms":["YouTube","Facebook","Website"],"series":{"ar":["الأديان المقارنة"],"en":["Comparative Religion"],"fr":["Religions comparées"],"es":["Religiones comparadas"]},"tr":{"ar":{"title":"الدكتور ذاكر عبد الكريم نايك","role":"محاضر دولي في الأديان المقارنة","up":"وُلد الدكتور ذاكر عبد الكريم نايك في مدينة مومباي بالهند عام 1965م، ونشأ في أسرة مسلمة مهتمة بالعلم والدعوة. درس الطب والجراحة وحصل على درجة البكالوريوس في الطب والجراحة (MBBS) من جامعة مومباي، ومارس المهنة الطبية لفترة.<br><br>إلى جانب تكوينه الطبي، انكبّ على دراسة الأديان المقارنة والكتب المقدسة، وتأثر بالداعية أحمد ديدات، فجمع بين الخلفية العلمية والمنهجية الحوارية في عرض القضايا العقدية. وقد مكّنه ذلك من مخاطبة جمهور متنوع في بيئات متعددة الثقافات والأديان.","da":"أسس «مؤسسة البحوث الإسلامية» (IRF) وقناة «Peace TV» التي بثّت محاضراته ومناظراته إلى جمهور واسع حول العالم. اشتهر بمحاضرات الأديان المقارنة والحوار مع أتباع الديانات الأخرى، واعتمد أسلوبًا يقوم على الاستشهاد بالنصوص من القرآن والكتب المقدسة الأخرى في إطار مناظرات ومنتديات عامة.<br><br>ألقى مئات المحاضرات في بلدان مختلفة، وأثار اهتمامًا واسعًا بقضايا الدعوة والتعريف بالإسلام والرد على الشبهات الشائعة. ويظل حضوره الإعلامي والرقمي مؤثرًا لدى قطاعات كبيرة من المهتمين بالحوار الديني، مع تركيز مستمر على عرض الإسلام بوصفه رسالة شاملة تقوم على التوحيد والعقل والهدى.","works":["<strong>محاضرات وندوات مسجلة.</strong>"],"quote":"أفضل طريقة للدعوة هي أن تعرض الإسلام كما هو."},"en":{"title":"Dr. Zakir Abdul Karim Naik","role":"International Lecturer in Comparative Religion","up":"Dr. Zakir Abdul Karim Naik was born in Mumbai, India, in 1965 and grew up in a Muslim family interested in learning and outreach. He studied medicine and surgery, earning an MBBS degree from the University of Mumbai and practicing as a medical doctor for a period.<br><br>Alongside his medical background, he devoted himself to the study of comparative religion and scriptures, influenced by the preacher Ahmed Deedat. This combination of scientific training and dialogical methodology shaped his approach to presenting religious issues to diverse audiences.","da":"He founded the Islamic Research Foundation (IRF) and Peace TV, which broadcast his lectures and debates to a wide global audience. He became known for lectures on comparative religion and dialogue with followers of other faiths, citing texts from the Qur’an and other scriptures in public forums and debates.<br><br>He has delivered hundreds of lectures in different countries and generated wide interest in da‘wah, introducing Islam, and responding to common misconceptions. His media and digital presence remains influential among audiences interested in interfaith dialogue, with a consistent focus on presenting Islam as a comprehensive message based on monotheism and guidance.","works":["<strong>Recorded Lectures.</strong>"],"quote":"The best way to give Da'wah is to present Islam as it is."},"fr":{"title":"Dr Zakir Abdul Karim Naik","role":"Conférencier international en religions comparées","up":"Le Dr Zakir Abdul Karim Naik est né à Mumbai (Inde) en 1965 et a grandi dans une famille musulmane attachée au savoir et à la prédication. Il a étudié la médecine et obtenu un diplôme MBBS à l’Université de Mumbai, exerçant ensuite comme médecin.<br><br>Parallèlement à sa formation médicale, il s’est consacré à l’étude des religions comparées et des Écritures, influencé par le prédicateur Ahmed Deedat. Cette combinaison de formation scientifique et de méthode dialogique a façonné sa manière de présenter les questions religieuses à des publics divers.","da":"Il a fondé la Fondation de recherche islamique (IRF) et la chaîne Peace TV, qui ont diffusé ses conférences et débats à un large public international. Il est connu pour ses interventions en religions comparées et ses dialogues avec des adeptes d’autres confessions, s’appuyant sur les textes du Coran et d’autres Écritures.<br><br>Il a donné des centaines de conférences dans différents pays et suscité un grand intérêt pour la présentation de l’islam et la réponse aux idées reçues. Sa présence médiatique et numérique demeure influente auprès de ceux qui s’intéressent au dialogue interreligieux, avec un accent constant sur l’unicité de Dieu et la guidance.","works":["<strong>Conférences et débats enregistrés :</strong> Diffusés à l’échelle internationale."],"quote":"La meilleure manière d’appeler à l’islam est de le présenter tel qu’il est."},"es":{"title":"Dr. Zakir Abdul Karim Naik","role":"Conferenciante internacional en religiones comparadas","up":"El Dr. Zakir Abdul Karim Naik nació en Mumbai (India) en 1965 y creció en una familia musulmana interesada en el conocimiento y la divulgación. Estudió medicina y obtuvo el título de MBBS en la Universidad de Mumbai, ejerciendo como médico durante un tiempo.<br><br>Junto a su formación médica, se dedicó al estudio de las religiones comparadas y las escrituras, influido por el predicador Ahmed Deedat. Esta combinación de formación científica y metodología dialógica moldeó su forma de presentar temas religiosos a audiencias diversas.","da":"Fundó la Fundación de Investigación Islámica (IRF) y Peace TV, que difundieron sus conferencias y debates a una audiencia global. Es conocido por sus charlas sobre religiones comparadas y el diálogo con seguidores de otras creencias, citando textos del Corán y de otras escrituras en foros públicos.<br><br>Ha impartido cientos de conferencias en distintos países y despertado un amplio interés por la presentación del islam y la respuesta a conceptos erróneos. Su presencia mediática y digital sigue siendo influyente entre quienes se interesan por el diálogo interreligioso, con un enfoque constante en el monoteísmo y la guía.","works":["<strong>Conferencias y debates grabados:</strong> Difundidos internacionalmente."],"quote":"La mejor manera de invitar al islam es presentarlo tal como es."}}},{"id":"hamza","initials":"ح.ي","meta":{"ar":"1958 | أمريكا","en":"1958 | USA","fr":"1958 | États-Unis","es":"1958 | EE.UU."},"tags":{"ar":["الفقه","التزكية"],"en":["Fiqh","Spirituality"],"fr":["Fiqh","Spiritualité"],"es":["Fiqh","Espiritualidad"]},"platforms":["YouTube","Facebook","Podcasts"],"series":{"ar":["شرح متن الآجرومية"],"en":["Al-Ajrumiyyah"],"fr":["Al-Ajrumiyyah"],"es":["Al-Ajrumiyyah"]},"tr":{"ar":{"title":"الشيخ حمزة يوسف هانسون","role":"مؤسس ورئيس كلية زيتونة","up":"وُلد الشيخ حمزة يوسف هانسون عام 1958م في ولاية واشنطن بالولايات المتحدة الأمريكية، ونشأ في بيئة أكاديمية مسيحية. اعتنق الإسلام عام 1977م، ثم سافر في رحلة علمية طويلة امتدت لسنوات، فدرس العلوم الشرعية واللغة العربية في الإمارات العربية المتحدة والجزائر والمغرب وموريتانيا وغيرها.<br><br>تتلمذ على عدد من العلماء التقليديين، ولا سيما في المغرب وموريتانيا، حيث درس الفقه المالكي وأصوله والعقيدة والتزكية وعلوم العربية. وقد أكسبه هذا المسار تجمعًا نادرًا بين الخلفية الغربية والثقافة الإسلامية التقليدية، مع إلمام بالفكر والفلسفة الغربية.","da":"شارك في تأسيس معهد «زيتونة» في كاليفورنيا عام 1996م، ثم أسهم في تحويله إلى «كلية زيتونة» التي تُعد أول كلية فنون ليبرالية إسلامية معتمدة في الولايات المتحدة. يشغل منصب رئيس الكلية، ويعنى بتخريج طلاب يجمعون بين العلوم الشرعية والعلوم الإنسانية المعاصرة.<br><br>يُعرف بخطابه الذي يركز على التزكية، وإحياء السنن، والتجديد المنضبط، ومعالجة قضايا المسلمين في الغرب. له محاضرات ودروس مترجمة ومؤلفات في الفقه والسيرة والفكر الإسلامي، وأسهم في حوارات بين الأديان ومبادرات مجتمعية، مما جعله من أبرز الأصوات الإسلامية المؤثرة في العالم الناطق بالإنجليزية.","works":["<strong>ترجمات ومؤلفات.</strong>"],"quote":"التجديد الحقيقي ليس في تغيير الدين."},"en":{"title":"Sheikh Hamza Yusuf Hanson","role":"Founder of Zaytuna College","up":"Sheikh Hamza Yusuf Hanson was born in 1958 in Washington State, USA, and grew up in an academic Christian environment. He embraced Islam in 1977 and then embarked on a long journey of study, spending years learning Islamic sciences and Arabic in the UAE, Algeria, Morocco, Mauritania, and elsewhere.<br><br>He studied under traditional scholars, particularly in Morocco and Mauritania, covering Maliki jurisprudence, theology, spiritual purification, and Arabic sciences. This path gave him a rare combination of Western background and traditional Islamic learning, along with familiarity with Western thought and philosophy.","da":"He co-founded Zaytuna Institute in California in 1996 and later helped transform it into Zaytuna College, the first accredited Muslim liberal arts college in the United States, where he serves as president. The college aims to educate students in both Islamic sciences and contemporary humanities.<br><br>He is known for his focus on spiritual refinement, reviving prophetic character, and addressing the concerns of Muslims in the West with balanced renewal. His translated lectures and writings on jurisprudence, biography, and Islamic thought have made him one of the most influential Muslim voices in the English-speaking world.","works":["<strong>Translations and Books.</strong>"],"quote":"True renewal is not changing the religion."},"fr":{"title":"Cheikh Hamza Yusuf Hanson","role":"Fondateur du Zaytuna College","up":"Le cheikh Hamza Yusuf Hanson est né en 1958 dans l’État de Washington (États-Unis) et a grandi dans un milieu chrétien universitaire. Converti à l’islam en 1977, il a entrepris un long parcours d’études, apprenant les sciences islamiques et l’arabe aux Émirats arabes unis, en Algérie, au Maroc, en Mauritanie et ailleurs.<br><br>Il a étudié auprès de savants traditionnels, notamment au Maroc et en Mauritanie, en fiqh malikite, théologie, purification spirituelle et sciences de la langue arabe. Ce parcours lui a donné une combinaison rare de culture occidentale et de formation islamique traditionnelle.","da":"Il a cofondé l’Institut Zaytuna en Californie en 1996, puis contribué à sa transformation en Zaytuna College, premier collège musulman d’arts libéraux accrédité aux États-Unis, dont il est président. L’établissement vise à former des étudiants aux sciences islamiques et aux humanités contemporaines.<br><br>Il est connu pour son accent sur la purification spirituelle, le renouveau mesuré et les questions des musulmans en Occident. Ses conférences et écrits traduits sur le fiqh, la biographie prophétique et la pensée islamique en font l’une des voix musulmanes les plus influentes du monde anglophone.","works":["<strong>Traductions et ouvrages :</strong> En fiqh, sira et pensée islamique."],"quote":"Le véritable renouveau ne consiste pas à changer la religion."},"es":{"title":"Jeque Hamza Yusuf Hanson","role":"Fundador de Zaytuna College","up":"El jeque Hamza Yusuf Hanson nació en 1958 en el estado de Washington (EE. UU.) y creció en un entorno cristiano académico. Se convirtió al islam en 1977 y emprendió un largo viaje de estudios, aprendiendo ciencias islámicas y árabe en Emiratos Árabes Unidos, Argelia, Marruecos, Mauritania y otros lugares.<br><br>Estudió con eruditos tradicionales, especialmente en Marruecos y Mauritania, en jurisprudencia malikí, teología, purificación espiritual y ciencias de la lengua árabe. Este recorrido le brindó una combinación singular de formación occidental y aprendizaje islámico tradicional.","da":"Cofundó el Instituto Zaytuna en California en 1996 y luego contribuyó a su transformación en Zaytuna College, la primera universidad musulmana de artes liberales acreditada en Estados Unidos, de la cual es presidente. La institución busca formar estudiantes en ciencias islámicas y humanidades contemporáneas.<br><br>Es conocido por su énfasis en la purificación espiritual, la renovación equilibrada y las cuestiones de los musulmanes en Occidente. Sus conferencias y escritos traducidos sobre jurisprudencia, biografía y pensamiento islámico lo convierten en una de las voces musulmanas más influyentes del mundo anglófono.","works":["<strong>Traducciones y libros:</strong> En fiqh, sira y pensamiento islámico."],"quote":"La verdadera renovación no consiste en cambiar la religión."}}},{"id":"tariq","initials":"ط.ج","meta":{"ar":"1953 | باكستان","en":"1953 | Pakistan","fr":"1953 | Pakistan","es":"1953 | Pakistán"},"tags":{"ar":["التزكية"],"en":["Spirituality"],"fr":["Spiritualité"],"es":["Espiritualidad"]},"platforms":["YouTube","Facebook"],"series":{"ar":["خطب الجمعة"],"en":["Friday Sermons"],"fr":["Sermons du vendredi"],"es":["Sermones del viernes"]},"tr":{"ar":{"title":"المولانا طارق جميل","role":"داعية باكستاني","up":"وُلد المولانا طارق جميل عام 1953م في مدينة تولامبا بإقليم البنجاب في باكستان. نشأ في أسرة ميسورة، وبدأ دراسته الأكاديمية في مجال الطب، ثم تركه متجهًا إلى طلب العلم الشرعي بدافع إيماني عميق.<br><br>التحق بجامعة العربية في ريويند (رايويند) القريبة من لاهور، حيث درس العلوم الإسلامية واللغة العربية والحديث والفقه. وقد شكّل هذا التحول في مساره الدراسي نقطة فارقة في حياته، فكرّس وقته وجهده للدعوة والإرشاد والتربية الروحية.","da":"اشتهر بخطبه المؤثرة في التزكية وإصلاح القلوب والدعوة إلى التوبة والالتزام بالأخلاق الإسلامية، وأصبح من أكثر الدعاة شعبية في باكستان والعالم الإسلامي. تُبث خطبه ومحاضراته عبر التلفزيون والإنترنت، وتحظى بمتابعة ملايين الأشخاص من خلفيات مختلفة.<br><br>يركز في دعوته على محاسبة النفس، وتعظيم شأن العبادة، وإصلاح العلاقات الأسرية والاجتماعية، بأسلوب عاطفي قريب من القلوب. وقد أسهمت جولاته الدعوية داخل باكستان وخارجها في التأثير في قطاعات واسعة من الشباب والعامة، مع حرص على خطاب جامع يدعو إلى الوئام والتقوى.","works":["<strong>خطب ومحاضرات مسجلة.</strong>"],"quote":"الدعوة ليست كلاماً يُقال، بل حال يُرى."},"en":{"title":"Maulana Tariq Jameel","role":"Pakistani Preacher","up":"Maulana Tariq Jameel was born in 1953 in Tulamba, Punjab, Pakistan. He grew up in a well-off family and initially studied medicine before leaving it to pursue Islamic knowledge out of deep religious conviction.<br><br>He enrolled at Jamia Arabia in Raiwind near Lahore, where he studied Islamic sciences, Arabic, hadith, and jurisprudence. This turning point in his educational path led him to dedicate his life to preaching, guidance, and spiritual nurturing.","da":"He became renowned for his moving sermons on spiritual purification, repentance, and Islamic ethics, and is among the most popular preachers in Pakistan and the wider Muslim world. His talks are broadcast on television and the internet and followed by millions from diverse backgrounds.<br><br>His message focuses on self-accountability, devotion, and reforming family and social relations in a heartfelt style close to people’s hearts. His preaching tours inside and outside Pakistan have influenced broad segments of society, with an emphasis on unity and piety.","works":["<strong>Recorded Sermons.</strong>"],"quote":"Da'wah is not words spoken, but a state seen."},"fr":{"title":"Maulana Tariq Jameel","role":"Prédicateur pakistanais","up":"Maulana Tariq Jameel est né en 1953 à Tulamba, au Pendjab (Pakistan). Issu d’une famille aisée, il a d’abord étudié la médecine avant de se tourner vers les sciences islamiques par conviction religieuse.<br><br>Il a rejoint l’université Jamia Arabia de Raiwind, près de Lahore, où il a étudié les sciences islamiques, l’arabe, le hadith et la jurisprudence. Ce tournant l’a conduit à consacrer sa vie à la prédication, au conseil et à l’éducation spirituelle.","da":"Il est devenu célèbre pour ses sermons émouvants sur la purification spirituelle, le repentir et l’éthique islamique, et compte parmi les prédicateurs les plus populaires au Pakistan et dans le monde musulman. Ses discours sont diffusés à la télévision et sur Internet et suivis par des millions de personnes.<br><br>Son message met l’accent sur l’examen de conscience, la dévotion et la réforme des relations familiales et sociales, dans un style proche des cœurs. Ses tournées de prédication ont influencé de larges publics, avec un appel constant à la piété et à l’unité.","works":["<strong>Sermons enregistrés :</strong> Largement diffusés."],"quote":"La prédication n’est pas seulement des paroles, mais un état que l’on voit."},"es":{"title":"Maulana Tariq Jameel","role":"Predicador pakistaní","up":"Maulana Tariq Jameel nació en 1953 en Tulamba, Punyab (Pakistán). Procedente de una familia acomodada, inicialmente estudió medicina antes de dedicarse a las ciencias islámicas por una profunda convicción religiosa.<br><br>Ingresó en la Universidad Jamia Arabia de Raiwind, cerca de Lahore, donde estudió ciencias islámicas, árabe, hadiz y jurisprudencia. Este giro en su vida lo llevó a consagrarse a la predicación, la orientación y la educación espiritual.","da":"Se hizo conocido por sus sermones conmovedores sobre la purificación espiritual, el arrepentimiento y la ética islámica, y es uno de los predicadores más populares de Pakistán y del mundo musulmán. Sus charlas se difunden por televisión e internet y son seguidas por millones de personas.<br><br>Su mensaje se centra en la autoevaluación, la devoción y la reforma de las relaciones familiares y sociales, con un estilo cercano al corazón. Sus giras de predicación han influido en amplios sectores, con un énfasis constante en la piedad y la unidad.","works":["<strong>Sermones grabados:</strong> Ampliamente difundidos."],"quote":"La predicación no son solo palabras, sino un estado que se ve."}}},{"id":"ahmed","initials":"أ.ش","meta":{"ar":"1973 | السعودية","en":"1973 | KSA","fr":"1973 | Arabie Saoudite","es":"1973 | Arabia Saudita"},"tags":{"ar":["الإعلام"],"en":["Media"],"fr":["Médias"],"es":["Medios"]},"platforms":["YouTube","X (Twitter)","Instagram"],"series":{"ar":["برنامج خواطر"],"en":["Khawater"],"fr":["Khawater"],"es":["Khawater"]},"tr":{"ar":{"title":"الأستاذ أحمد الشقيري","role":"إعلامي وداعية","up":"وُلد الأستاذ أحمد مازن الشقيري في مدينة جدة بالمملكة العربية السعودية عام 1973م، ونشأ في بيئة محافظة. انتقل إلى الولايات المتحدة الأمريكية لاستكمال دراسته الجامعية، حيث حصل على درجة البكالوريوس في نظم إدارة المعلومات من جامعة كاليفورنيا الحكومية في لونغ بيتش.<br><br>عاد لاحقًا لإكمال دراساته العليا، فنال درجة الماجستير في إدارة الأعمال (MBA) من جامعة كاليفورنيا في بيركلي. وقد منحه هذا التكوين الأكاديمي في الإدارة والإعلام فهمًا عميقًا لآليات التأثير والتواصل، ساعده في تطوير مشروعه الإعلامي الدعوي الهادف.","da":"برز بوصفه أحد أبرز الإعلاميين في العالم العربي، واشتهر بتقديم برنامج «خواطر» الذي عُرض لسنوات متتالية وتناول قضايا النهضة، والتعليم، والإنتاجية، والأخلاق، والتجربة التنموية بروح إيمانية محفزة. كما قدّم برامج أخرى مثل «يلا شباب» و«قمرة».<br><br>اعتمد في عمله على أسلوب بصري جذاب ورسائل عملية تدعو إلى التغيير الإيجابي بدءًا من الفرد والمجتمع. وأسهمت برامجه في إلهام شريحة واسعة من الشباب العربي نحو التطوير الذاتي، والعمل التطوعي، والوعي بالقدوة الحسنة، مع حضور مؤثر عبر منصات التواصل الاجتماعي والمبادرات المجتمعية.","works":["<strong>برامج تلفزيونية.</strong>"],"quote":"التغيير يبدأ من الداخل."},"en":{"title":"Ustadh Ahmed Al-Shugairi","role":"Media Personality and Preacher","up":"Ahmed Mazen Al-Shugairi was born in Jeddah, Saudi Arabia, in 1973 and grew up in a conservative environment. He moved to the United States for higher education, earning a bachelor’s degree in Management Information Systems from California State University, Long Beach.<br><br>He later completed a Master of Business Administration (MBA) at the University of California, Berkeley. This academic background in management and media gave him a strong understanding of communication and influence, which helped shape his purposeful media work.","da":"He emerged as one of the most prominent media figures in the Arab world, best known for presenting the program “Khawater,” which aired for many years and addressed issues of development, education, productivity, ethics, and reform with an inspiring faith-based spirit. He also presented programs such as “Yalla Shabab” and “Qomrah.”<br><br>His work relies on engaging visual style and practical messages that encourage positive change starting with the individual and society. His programs have inspired many Arab youth toward self-development, volunteerism, and social awareness, with a strong presence on social media and community initiatives.","works":["<strong>TV Shows.</strong>"],"quote":"Change starts from within."},"fr":{"title":"Oustadh Ahmed Mazen Al-Shugairi","role":"Personnalité médiatique et prédicateur","up":"Ahmed Mazen Al-Shugairi est né à Djeddah (Arabie saoudite) en 1973 et a grandi dans un environnement conservateur. Il a poursuivi ses études aux États-Unis, obtenant une licence en systèmes d’information de gestion à l’Université d’État de Californie à Long Beach.<br><br>Il a ensuite obtenu un MBA à l’Université de Californie à Berkeley. Cette formation en gestion et en communication a nourri sa compréhension des mécanismes d’influence, au service de son projet médiatique éducatif.","da":"Il s’est imposé comme l’une des figures médiatiques les plus marquantes du monde arabe, notamment grâce à l’émission « Khawater », diffusée pendant des années et consacrée au développement, à l’éducation, à la productivité, à l’éthique et à l’expérience des sociétés, dans un esprit inspirant. Il a également présenté « Yalla Shabab » et « Qomrah ».<br><br>Son travail repose sur un style visuel attractif et des messages pratiques appelant au changement positif, à partir de l’individu et de la société. Ses programmes ont inspiré de nombreux jeunes arabes vers le développement personnel, le bénévolat et la conscience sociale, avec une forte présence sur les réseaux sociaux.","works":["<strong>Émissions télévisées :</strong> Dont « Khawater »."],"quote":"Le changement commence de l’intérieur."},"es":{"title":"Ustadh Ahmed Mazen Al-Shugairi","role":"Personalidad mediática y predicador","up":"Ahmed Mazen Al-Shugairi nació en Yeda (Arabia Saudita) en 1973 y creció en un entorno conservador. Se trasladó a Estados Unidos para cursar estudios superiores, obteniendo una licenciatura en Sistemas de Información de Gestión en la Universidad Estatal de California en Long Beach.<br><br>Posteriormente obtuvo un MBA en la Universidad de California en Berkeley. Esta formación en gestión y comunicación le brindó una comprensión profunda de la influencia y el mensaje, clave para su labor mediática educativa.","da":"Se consolidó como una de las figuras mediáticas más destacadas del mundo árabe, conocido especialmente por el programa «Khawater», emitido durante años y dedicado al desarrollo, la educación, la productividad, la ética y la reforma con un espíritu inspirador. También presentó programas como «Yalla Shabab» y «Qomrah».<br><br>Su trabajo se basa en un estilo visual atractivo y mensajes prácticos que fomentan el cambio positivo desde el individuo y la sociedad. Sus programas han inspirado a muchos jóvenes árabes hacia el desarrollo personal, el voluntariado y la conciencia social, con una fuerte presencia en redes sociales.","works":["<strong>Programas de televisión:</strong> Incluido «Khawater»."],"quote":"El cambio comienza desde dentro."}}},{"id":"amri","initials":"ي.ع","meta":{"ar":"المغرب","en":"Morocco","fr":"Maroc","es":"Marruecos"},"tags":{"ar":["الدعوة","التربية"],"en":["Da'wah","Education"],"fr":["Da'wah","Éducation"],"es":["Da'wah","Educación"]},"platforms":["YouTube","Website"],"series":{"ar":["السيرة النبوية","شرح الأربعون النووية","مجالس القرآن"],"en":["The Prophet's Biography","Explanation of the Forty Hadiths","Quranic Sessions"],"fr":["La biographie prophétique","Explication des quarante hadiths","Séances coraniques"],"es":["La biografía profética","Explicación de los cuarenta hadices","Sesiones coránicas"]},"tr":{"ar":{"title":"الأستاذ الداعية ياسين العمري","role":"داعية وطالب علم ومحاضر تربوي","up":"الأستاذ ياسين العمري داعية مغربي معاصر ومحاضر تربوي، يُعد من الوجوه الدعوية والعلمية المعروفة بالمغرب. حصل على دبلوم الأهلية لتدريس تقنيات التعبير والتواصل، وعلى إجازة في اللغة الفرنسية وآدابها، إلى جانب دراسته للعلوم الشرعية وعلوم التربية، مما أتاح له الجمع بين التكوين اللغوي والتربوي والمعرفي الشرعي.<br><br>نشأ اهتمامه بالعلم والدعوة في سياق تربوي يحرص على التأصيل والربط بالواقع، فاشتغل بتطوير أدوات الخطاب والتواصل مع مختلف الفئات، ولا سيما الشباب والأسر. وقد انعكس هذا المسار في أسلوبه الذي يجمع بين وضوح الفكرة وسلامة المنهج والاهتمام بالبُعد التربوي العملي.","da":"قدّم العديد من الدروس والمحاضرات والبرامج التربوية التي تناولت قضايا الإيمان والسلوك والتزكية وبناء الوعي، مع تركيز على ربط المسلم بالقرآن الكريم والسنة النبوية وفق المنهج الوسطي المعتدل. عُرف بعنايته بقضايا الشباب والأسرة والتربية الإيمانية، وبحرصه على تقديم خطاب هادئ متوازن يراعي واقع الناس.<br><br>ينشر محتواه العلمي والتوجيهي عبر موقعه الرسمي ومنصاته الرقمية، ويقدّم سلاسل في السيرة النبوية وشرح الأربعين النووية ومجالس القرآن والبرامج التربوية المتخصصة. وقد أسهمت جهوده في تقريب المعاني الشرعية والتربوية إلى المتلقي بلغة واضحة وخطوات عملية تعين على الاستقامة وبناء الشخصية المسلمة الواعية.","works":["<strong>دروس ومحاضرات ومقالات:</strong> مواد علمية وتربوية منشورة عبر الموقع الرسمي.","<strong>برامج تربوية:</strong> محتوى موجّه لقضايا الشباب والأسرة وبناء الوعي."],"quote":"العلم النافع نورٌ يهدي الله به القلوب والعقول إلى طريق الاستقامة."},"en":{"title":"Ustadh Yassine El Amri","role":"Preacher, student of knowledge and educational lecturer","up":"Ustadh Yassine El Amri is a contemporary Moroccan preacher and educational lecturer known in Morocco for his scholarly and educational work. He holds a diploma in teaching expression and communication techniques and a degree in French language and literature, alongside studies in Islamic sciences and education, combining linguistic, pedagogical, and religious training.<br><br>His interest in knowledge and outreach developed within an educational context that values sound foundations and relevance to reality. This background is reflected in his style, which combines clarity of ideas, methodological balance, and practical educational focus, particularly in addressing youth and families.","da":"He has delivered numerous lessons, lectures, and educational programs addressing faith, conduct, spiritual refinement, and awareness-building, with an emphasis on connecting Muslims to the Qur’an and Sunnah according to a moderate approach. He is known for his attention to youth and family issues and for offering a calm, balanced discourse.<br><br>He shares his scholarly and guidance content through his official website and digital platforms, presenting series on the Prophetic biography, the explanation of the Forty Hadiths, Qur’anic sessions, and specialized educational programs. His efforts have helped make religious and educational meanings accessible in clear language with practical steps for personal development.","works":["<strong>Lessons, lectures and articles:</strong> Scholarly and educational material published on his official website.","<strong>Educational programs:</strong> Content addressing youth, family and awareness-building."],"quote":"Beneficial knowledge is a light by which Allah guides hearts and minds to the path of uprightness."},"fr":{"title":"Oustadh Yassine El Amri","role":"Prédicateur, étudiant en sciences et conférencier éducatif","up":"L’oustadh Yassine El Amri est un prédicateur marocain contemporain et conférencier éducatif reconnu au Maroc. Il est titulaire d’un diplôme en techniques d’expression et de communication et d’une licence en langue et littérature françaises, en plus d’études en sciences islamiques et en éducation, combinant ainsi formation lingui
