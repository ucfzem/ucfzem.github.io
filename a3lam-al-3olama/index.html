<style>
  :root{

  }
  :root[data-theme="dark"]{
    --bg:#0d1319; --bg-glow:#12312a; --fg:#e8edf3; --muted:#93a1b1;
    --card:#131a22; --line:#222c38; --accent:#3ddcbb; --accent-soft:#12312a;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 10px 30px rgba(0,0,0,.55);

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0; min-height:100vh; padding:clamp(1rem, 3vw, 2.75rem);

    color:var(--fg); line-height:1.7; font-size:16px; -webkit-font-smoothing:antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body[dir="rtl"] { font-family:"IBM Plex Sans Arabic", system-ui, sans-serif; }
  body[dir="ltr"] { font-family:"Inter", system-ui, sans-serif; }

  .page-head{ display:flex; flex-wrap:wrap; gap:1.25rem; align-items:flex-end; justify-content:space-between; max-width:1400px; margin:0 auto clamp(1.5rem,3vw,2.5rem); }
  .eyebrow{ margin:0 0 .35rem; font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .page-head h1{ margin:0; font-size:clamp(1.8rem, 4vw, 2.6rem); font-weight:700; line-height:1.25; }
  .lede{ margin:.6rem 0 0; max-width:60ch; font-size:clamp(.9rem, 1.6vw, 1rem); color:var(--muted); }
  .page-head__side{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }


  /* Language Switcher */
  .lang-switcher { display: flex; gap: 0.4rem; background: var(--card); padding: 0.35rem; border-radius: 12px; border: 1px solid var(--line); }
  .lang-btn { background: transparent; border: none; cursor: pointer; padding: 0.4rem 0.7rem; border-radius: 8px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; color: var(--muted); transition: all 0.2s ease; }
  .lang-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .lang-btn.active { background: var(--accent); color: #fff; }


  .count{ font-size:.8rem; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; }
  .theme-toggle{ width:44px; height:44px; display:grid; place-items:center; font-size:1.15rem; cursor:pointer; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:50%; transition:transform .18s ease; }
  .theme-toggle:hover{ transform:rotate(-12deg) scale(1.06); border-color:var(--accent); }


  .toolbar{ max-width:1400px; margin:0 auto clamp(1.25rem,2.5vw,2rem); display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }
  .search-wrap{ flex:1 1 280px; position:relative; display:flex; align-items:center; }
  .search-wrap svg{ position:absolute; inset-inline-start:1rem; width:18px; height:18px; color:var(--muted); pointer-events:none; }
  .search-input{ width:100%; padding:.75rem 2.6rem .75rem 1rem; font-family:inherit; font-size:.92rem; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; transition:border-color .18s ease; }
  .search-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }


  .grid{ max-width:1400px; margin:0 auto; column-count:2; column-gap:clamp(1rem, 2vw, 1.75rem); }
  @media (max-width:900px){ .grid{ column-count:1; } }
  @media (min-width:1600px){ .grid{ column-count:3; } }


  .scholar-card{ display:block; width:100%; break-inside:avoid; margin:0 0 clamp(1rem, 2vw, 1.75rem); padding:clamp(1.1rem, 2vw, 1.6rem); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); transition:all .22s ease; animation:rise .5s ease both; }
  .scholar-card:hover{ box-shadow:var(--shadow-hover); transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }


  .scholar-card__head{ display:flex; gap:.9rem; align-items:flex-start; }
  .scholar-card__avatar{ position:relative; flex:0 0 58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:.92rem; border:1px solid color-mix(in srgb, var(--accent) 18%, transparent); overflow:hidden; }

  .scholar-card__block{ margin-top:1.3rem; }
  .scholar-card__label{ margin:0 0 .55rem; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }


  .pill-list{ display:flex; flex-wrap:wrap; gap:.4rem; margin:0; padding:0; list-style:none; }
  .pill{ display:inline-flex; align-items:center; gap:0.4rem; text-decoration:none; font-size:.76rem; font-weight:600; padding:.28rem .78rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 16%, transparent); transition:all .2s ease; }
  .pill:hover{ background:var(--accent); color:var(--card); transform:translateY(-2px); }
  .pill::after{ content:"↗"; font-size:.85em; opacity:.6; }


  .series-list{ margin:0; padding:0; list-style:none; display:grid; gap:.5rem; }
  .series-list__item{ display:block; text-decoration:none; color:var(--fg); position:relative; padding-inline-start:1.3rem; font-size:.88rem; transition:color .2s ease; }
  .series-list__item::before{ content:""; position:absolute; inset-inline-start:.15rem; top:.6em; width:.48rem; height:.48rem; border-radius:2px; background:var(--accent); transform:rotate(45deg); }
  .series-list__item:hover{ color:var(--accent); }


  .works-list{ margin:0; padding-inline-start:1.1rem; font-size:.88rem; }
  .works-list__item{ margin-bottom:.45rem; }
  .works-list__item strong{ color:var(--accent); font-weight:700; }
  .scholar-card__quote{ margin:1.3rem 0 0; padding:.8rem 1rem; font-size:.88rem; font-style:italic; border-inline-start:3px solid var(--accent); background:linear-gradient(to left, var(--accent-soft), transparent 85%); border-radius:0 var(--radius) var(--radius) 0; }
  body[dir="ltr"] .scholar-card__quote { background:linear-gradient(to right, var(--accent-soft), transparent 85%); }
  .no-results{ display:none; max-width:1400px; margin:2rem auto; padding:2rem; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); }
  .no-results.is-visible{ display:block; }

  /* Copy names */
  .copy-names{ display:inline-flex; align-items:center; gap:.5rem; padding:.72rem 1rem; font-family:inherit; font-size:.85rem; font-weight:600; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer; white-space:nowrap; transition:color .18s ease, border-color .18s ease, background .18s ease; }
  .copy-names:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .copy-names:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .copy-names svg{ width:16px; height:16px; flex:none; }
  .copy-names.is-copied{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
</style>
</head>

const scholars = [
  { id:"othman", initials:"ع.خ", meta:{ar:"1962 | الكويت",en:"1962 | Kuwait",fr:"1962 | Koweït",es:"1962 | Kuwait"}, tags:{ar:["الحديث","العقيدة"],en:["Hadith","Aqeedah"],fr:["Hadith","Aqidah"],es:["Hadiz","Aqidah"]}, platforms:["YouTube","Telegram","X (Twitter)","Website"], series:{ar:["شرح كتاب التوحيد","سلسلة حقبة من التاريخ"],en:["Explanation of Kitab al-Tawheed","A Period of History"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور عثمان بن محمد الخميس", role:"باحث في التاريخ الإسلامي والحديث", up:"وُلد في الكويت عام 1962 م، وتلقى تعليمه الجامعي في جامعة الإمام محمد بن سعود الإسلامية بالرياض حيث تخرج في قسم الحديث الشريف، ثم حصل على درجتي الماجستير والدكتوراه في الدراسات الحديثية والتاريخية بتقدير امتياز.", da:"تولى الإمامة والخطابة في الكويت لسنوات طويلة، واشتهر بقدرته الفائقة على تبسيط المسائل العقدية والتاريخية والفقهية بأسلوب ميسر يجمع بين الرصانة العلمية والقرب من الناس.", works:["<strong>حقبة من التاريخ:</strong> عرض تحليلي موثق للأحداث التاريخية.","<strong>كشف الجاني محمد التيجاني:</strong> دراسة نقدية حديثية."], quote:"طلب العلم الشرعي في هذا العصر صار ميسوراً بضغطة زر، لكن البركة تبقى في الصبر والملازمة." }, en:{title:"Sheikh Dr. Othman bin Mohammed Al-Khamees", role:"Researcher in Islamic History and Hadith", up:"Born in Kuwait in 1962, he graduated from Imam Muhammad ibn Saud Islamic University in Riyadh in the Department of Hadith, then earned his Master's and PhD in Hadith and Historical Studies with honors.", da:"He served as an Imam in Kuwait for years. He is known for his ability to simplify theological and historical issues combining academic rigor with accessibility.", works:["<strong>A Period of History:</strong> Documented analytical presentation of historical events.","<strong>Exposing Muhammad al-Tijani:</strong> A critical Hadith study."], quote:"Seeking Islamic knowledge today is easy with a click, but blessing remains in patience and consistency." } } },


  { id:"said", initials:"س.ك", meta:{ar:"1972 | المغرب",en:"1972 | Morocco",fr:"1972 | Maroc",es:"1972 | Marruecos"}, tags:{ar:["الفقه المالكي","الحديث"],en:["Maliki Fiqh","Hadith"],fr:["Fiqh Malékite","Hadith"],es:["Fiqh Malikí","Hadiz"]}, platforms:["YouTube","Facebook","Instagram","Podcasts"], series:{ar:["شرح موطأ الإمام مالك","شرح صحيح البخاري"],en:["Explanation of Muwatta Imam Malik","Explanation of Sahih Al-Bukhari"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور سعيد بن محمد الكملي", role:"فقيه مالكي ومحدث وأستاذ التعليم العالي", up:"وُلد في مدينة الرباط بالمغرب عام 1972 م، وحفظ القرآن الكريم في صغره، ثم جمع بين الدراسة الأكاديمية والرحلة في طلب العلم على كبار علماء المغرب والمشرق.", da:"يُعد من أبرز المجددين في أسلوب الإلقاء العلمي المعاصر؛ حيث يمزج بين دقة الاستنباط الفقهي على مذهب الإمام مالك، وبين البلاغة الأدبية والشعر العربي الأصيل.", works:["<strong>الأحكام الشرعية في الأسفار الجوية:</strong> بحث فقهي معاصر.","<strong>جني الثمرات من نظم الورقات</strong> في أصول الفقه."], quote:"العلم رحم بين أهله، ولا يُنال إلا بالتواضع للأشياخ والصبر على جرد المطولات." }, en:{title:"Sheikh Dr. Said bin Mohammed Al-Kamali", role:"Maliki Jurist, Hadith Scholar, and Professor", up:"Born in Rabat, Morocco in 1972, he memorized the Quran young, combining academic studies with travels to study under senior scholars of Morocco and the East.", da:"He is considered one of the most prominent innovators in contemporary academic delivery, blending precise Maliki jurisprudential deduction with literary rhetoric.", works:["<strong>Islamic Rulings on Air Travel:</strong> Contemporary Fiqh research.","<strong>Harvesting Fruits from Nadhm al-Waraqat</strong> in Usul al-Fiqh."], quote:"Knowledge is a mercy among its people, attained only through humility to teachers." } } },


  { id:"ayman", initials:"أ.ع", meta:{ar:"1973 | مصر",en:"1973 | Egypt",fr:"1973 | Égypte",es:"1973 | Egipto"}, tags:{ar:["اللغة العربية","الفكر"],en:["Arabic Language","Thought"],fr:["Langue Arabe","Pensée"],es:["Lengua Árabe","Pensamiento"]}, platforms:["YouTube","Telegram","SoundCloud"], series:{ar:["دورة تأسيس وعي المسلم المعاصر"],en:["Foundations of Contemporary Muslim Awareness"]}, tr:{ ar:{title:"المهندس الباحث أيمن عبد الرحيم", role:"باحث في العلوم الإنسانية واللغوية", up:"نشأ في مصر وجمع بين التكوين الهندسي الدقيق والدراسة الموسوعية في علوم اللغة العربية، والتاريخ، والاجتماع.", da:"اشتهر عبر منصات الإنترنت بسلاسل محاضراته التأسيسية التي تخاطب العقل الشبابي المثقف، وتهدف إلى بناء أرضية معرفية متماسكة.", works:["<strong>سلاسل صوتية ومرئية مفرغة:</strong> تحولت إلى مقررات قراءة ذاتية."], quote:"أزمة المسلم المعاصر ليست في نقص المعلومات، بل في غياب الخريطة المعرفية." }, en:{title:"Eng. Ayman Abdel Rahim", role:"Researcher in Humanities and Linguistics", up:"Raised in Egypt, he combined engineering training with encyclopedic studies in Arabic language, history, and sociology.", da:"He became famous online for his foundational lecture series addressing educated youth, aiming to build a coherent epistemological base.", works:["<strong>Transcribed Audio/Video Series:</strong> Turned into self-study curricula."], quote:"The crisis of the contemporary Muslim is the absence of an epistemological map." } } },


  { id:"eyad", initials:"إ.ق", meta:{ar:"1975 | الأردن",en:"1975 | Jordan",fr:"1975 | Jordanie",es:"1975 | Jordania"}, tags:{ar:["الإلحاد المعاصر","علم الأدوية"],en:["Atheism","Pharmacology"],fr:["Athéisme","Pharmacologie"],es:["Ateísmo","Farmacología"]}, platforms:["YouTube","Telegram","Facebook"], series:{ar:["سلسلة رحلة اليقين"],en:["Journey of Certainty"]}, tr:{ ar:{title:"الدكتور إياد بن عبد الحافظ قنيبي", role:"أستاذ جامعي في علم الأدوية وباحث في القضايا الفكرية", up:"حصل على درجة الدكتوراه في علم الأدوية من جامعة هيوستن بالولايات المتحدة الأمريكية، وعمل أستاذاً جامعياً في الأردن.", da:"برز على الساحة الرقمية كأحد أهم المتخصصين في تفكيك الشبهات الفلسفية والعلمية الموجهة للشباب المسلم.", works:["<strong>أبحاث علمية محكمة:</strong> في مجال الصيدلة وعلم الأدوية."], quote:"العلم التجريبي الصحيح إذا تجرد من الأيديولوجيا فإنه يقود حتماً إلى الإيمان." }, en:{title:"Dr. Eyad bin Abdul Hafiz Qunaibi", role:"Professor of Pharmacology & Intellectual Researcher", up:"He earned his PhD in Pharmacology from the University of Houston, USA, and worked as a university professor in Jordan.", da:"He emerged digitally as a key specialist in deconstructing philosophical and scientific doubts facing Muslim youth.", works:["<strong>Peer-Reviewed Research:</strong> In pharmacy and pharmacology."], quote:"Correct empirical science, stripped of ideology, inevitably leads to faith." } } },

  { id:"ahmed", initials:"أ.ش", meta:{ar:"1973 | السعودية",en:"1973 | KSA",fr:"1973 | Arabie Saoudite",es:"1973 | Arabia Saudita"}, tags:{ar:["الإعلام"],en:["Media"],fr:["Médias"],es:["Medios"]}, platforms:["YouTube","X (Twitter)","Instagram"], series:{ar:["برنامج خواطر"],en:["Khawater"]}, tr:{ ar:{title:"الأستاذ أحمد الشقيري", role:"إعلامي وداعية", up:"وُلد في جدة عام 1973 م، ودرس إدارة نظم المعلومات في جامعة كاليفورنيا.", da:"من أبرز الإعلاميين في العالم العربي، اشتهر ببرنامجه 'خواطر'.", works:["<strong>برامج تلفزيونية.</strong>"], quote:"التغيير يبدأ من الداخل." }, en:{title:"Ustadh Ahmed Al-Shugairi", role:"Media Personality and Preacher", up:"Born in Jeddah in 1973, he studied Information Systems at the University of California.", da:"One of the most prominent media figures in the Arab world, famous for his show 'Khawater'.", works:["<strong>TV Shows.</strong>"], quote:"Change starts from within." } } },


  { id:"amri", initials:"ي.ع", meta:{ar:"المغرب",en:"Morocco",fr:"Maroc",es:"Marruecos"}, tags:{ar:["الدعوة","التربية"],en:["Da'wah","Education"],fr:["Da'wah","Éducation"],es:["Da'wah","Educación"]}, platforms:["YouTube","Website"], series:{ar:["السيرة النبوية","شرح الأربعون النووية","مجالس القرآن"],en:["The Prophet's Biography","Explanation of the Forty Hadiths","Quranic Sessions"]}, tr:{ ar:{title:"الأستاذ الداعية ياسين العمري", role:"داعية وطالب علم ومحاضر تربوي", up:"داعية مغربي معاصر ومحاضر تربوي، يُعد من الوجوه الدعوية والعلمية المعروفة بالمغرب، حيث يشتغل بنشر العلم الشرعي والتوجيه التربوي بأسلوب يجمع بين التأصيل والواقع، مع اهتمام خاص بقضايا التربية والإصلاح وبناء الوعي. حاصل على دبلوم الأهلية لتدريس تقنيات التعبير والتواصل، وإجازة في اللغة الفرنسية وآدابها، ودرس العلوم الشرعية وعلوم التربية.", da:"قدّم العديد من الدروس والمحاضرات والبرامج التربوية التي تناولت قضايا الإيمان والسلوك والتزكية وبناء الوعي، مع تركيز على ربط المسلم بالقرآن الكريم والسنة النبوية وفق المنهج الوسطي. عُرف باهتمامه بقضايا الشباب والأسرة والتربية، وينشر محتواه العلمي والتوجيهي عبر موقعه الرسمي ومنصاته الرقمية.", works:["<strong>دروس ومحاضرات ومقالات:</strong> مواد علمية وتربوية منشورة عبر الموقع الرسمي.","<strong>برامج تربوية:</strong> محتوى موجّه لقضايا الشباب والأسرة وبناء الوعي."], quote:"العلم النافع نورٌ يهدي الله به القلوب والعقول إلى طريق الاستقامة." }, en:{title:"Ustadh Yassine El Amri", role:"Preacher, student of knowledge and educational lecturer", up:"A contemporary Moroccan preacher and educational lecturer, recognized among Morocco's known da'wah and scholarly figures. He works to spread Islamic knowledge and educational guidance in a way that combines authenticity with contemporary reality, with special attention to education, reform and awareness-building. He holds a diploma in teaching expression and communication, a licentiate in French language and literature, and has studied Islamic sciences and education.", da:"He has delivered numerous lessons, lectures and educational programs on faith, behavior, spiritual refinement and awareness-building, with a focus on connecting Muslims to the Quran and Sunnah according to the moderate Islamic approach. He is known for his interest in youth, family and education, and publishes his scholarly and guidance content through his official website and digital platforms.", works:["<strong>Lessons, lectures and articles:</strong> Scholarly and educational material published on his official website.","<strong>Educational programs:</strong> Content addressing youth, family and awareness-building."], quote:"Beneficial knowledge is a light by which Allah guides hearts and minds to the path of uprightness." } } },


  { id:"nafi", initials:"ر.ن", meta:{ar:"1961 | المغرب",en:"1961 | Morocco",fr:"1961 | Maroc",es:"1961 | Marruecos"}, tags:{ar:["السنة","الدعوة"],en:["Hadith","Da'wah"],fr:["Hadith","Da'wah"],es:["Hadiz","Da'wah"]}, platforms:["YouTube","Website"], series:{ar:["دروس علمية بمساجد الرباط","برامج دعوية"],en:["Lessons in Rabat Mosques","Da'wah Programs"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور رشيد نافع", role:"عالم في السنة وعلومها وداعية", up:"وُلد في الرباط يوم 16 رمضان 1382هـ الموافق 23 فبراير 1961م. نشأ بمسجد قصبة الأوداية والمسجد الأعظم بالرباط، وتعلم القرآن في كتّابه، ثم درس بمدارس محمد الخامس بالرباط. رحل لطلب العلم على يد الشيخ تقي الدين الهلالي والشيخ حماد الأنصاري، والتحق بالجامعة الإسلامية بالمدينة المنورة فحصل على الإجازة من كلية الدعوة وأصول الدين تخصص العقيدة، ثم نال دبلوم الدراسات المعمقة من جامعة محمد الخامس، ودبلوم الدراسات العليا والدكتوراه الدولة في السنة وعلومها من جامعة الحسن الثاني بالدار البيضاء.", da:"عضو رابطة علماء المغرب وخطيب مسجد الوحدة بالحي الصناعي بالرباط، وله دروس علمية بمساجد الرباط عبر المجلس العلمي المحلي. عُرف باهتمامه بالسنة وعلومها وتعظيم الدليل، وله نشاط إغاثي واسع في البوسنة ومخيم الزعتري وكوكس بازار والمغرب. وهو عضو مؤسس لمؤتمر نصرة النبي ﷺ بالبحرين سنة 2005، وشارك في ندوات وبرامج دعوية داخل المغرب وخارجه.", works:["<strong>يوسف بن تاشفين ودعوته</strong>","<strong>أيها التائب أقبل</strong>","<strong>المرسل الخفي وحجيته</strong>"] }, en:{title:"Sheikh Dr. Rachid Nafi", role:"Scholar of Hadith and Islamic Sciences; preacher", up:"Born in Rabat on 16 Ramadan 1382 AH (23 February 1961). He grew up between the Qasbah of the Udayas mosque and the Great Mosque of Rabat, learned the Quran in its kuttab, and studied at Mohammed V schools in Rabat. He traveled to study under Sheikh Taqi al-Din al-Hilali and Sheikh Hammad al-Ansari, joined the Islamic University of Madinah, and obtained a licentiate from the Faculty of Da'wah and Usul al-Din (Aqeedah). He later earned a higher studies diploma from Mohammed V University and a higher studies diploma and State Doctorate in Hadith and its sciences from Hassan II University in Casablanca.", da:"He is a member of the League of Moroccan Scholars and the preacher of the Unity Mosque in the Industrial District of Rabat, with regular lessons in Rabat mosques through the local Scientific Council. He is known for his focus on Hadith and its sciences and his emphasis on evidence. He has extensive relief work in Bosnia, the Zaatari camp, Cox's Bazar and Morocco. He is a founding member of the Conference for the Support of the Prophet in Bahrain (2005) and has participated in conferences and da'wah programs in Morocco and abroad.", works:["<strong>Yusuf ibn Tashfin and His Da'wah</strong>","<strong>O Repentant One, Come Forward</strong>","<strong>The Hidden Mursal and Its Authority</strong>"] } } },

/* =====================================================================
   3) Logic & Rendering
   ===================================================================== */
let currentLang = localStorage.getItem('dawa-lang') || 'ar';
let currentTheme = localStorage.getItem('dawa-theme') || (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light');


const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const countEl = document.getElementById('count');
const copyBtn = document.getElementById('copyNames');
const copyLabel = document.getElementById('copyNamesLabel');
const langBtns = document.querySelectorAll('.lang-btn');


// Helper: Fallback to English if FR/ES is missing, then Arabic
function getT(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getArr(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getMeta(scholar) { return scholar.meta[currentLang] || scholar.meta['en']; }
function getTags(scholar) { return scholar.tags[currentLang] || scholar.tags['en']; }
function getSeries(scholar) { return scholar.series[currentLang] || scholar.series['en']; }


// Smart Links
function getPlatformURL(platform, name) {
  const q = encodeURIComponent(name);
  const p = platform.toLowerCase();
  if (p.includes('youtube')) return `https://www.youtube.com/results?search_query=${q}`;
  if (p.includes('facebook')) return `https://www.facebook.com/search/top?q=${q}`;
  if (p.includes('instagram')) return `https://www.instagram.com/explore/search/keyword/?q=${q}`;
  if (p.includes('twitter')) return `https://twitter.com/search?q=${q}&f=user`;
  if (p.includes('telegram')) return `https://www.google.com/search?q=site%3At.me+${q}`;
  if (p.includes('tiktok')) return `https://www.tiktok.com/search?q=${q}`;
  if (p.includes('soundcloud')) return `https://soundcloud.com/search?q=${q}`;
  if (p.includes('snapchat')) return `https://www.snapchat.com/add/${q}`;
  if (p.includes('website')) return `https://www.google.com/search?q=${q}+الموقع+الرسمي`;
  return `https://www.google.com/search?q=${q}+${encodeURIComponent(platform)}`;
}
function getSeriesURL(seriesName, scholarName) {
  const q = encodeURIComponent(`"${seriesName}" ${scholarName}`);
  return `https://www.youtube.com/results?search_query=${q}`;
}


// Render Card
const PHOTO_IDS = new Set(["othman","said","ayman","eyad","menk","omar","yasir","nouman","zakir","hamza","tariq","ahmed","amri","belal","yahya","abdelkafy","huwaini","yaqoubi","benhamza","philips","siraj","suhaib","masood","ourayfi","nabil"]);

function cardHTML(s) {
  const name = getT(s, 'title'); // Use title for search links
  const platforms = s.platforms.map(p => `<li><a href="${getPlatformURL(p, name)}" target="_blank" rel="noopener noreferrer" class="pill">${p}</a></li>`).join("");
  const series = getSeries(s).map(x => `<li><a href="${getSeriesURL(x, name)}" target="_blank" rel="noopener noreferrer" class="series-list__item">${x}</a></li>`).join("");
  const works = getArr(s, 'works').map(w => `<li class="works-list__item">${w}</li>`).join("");
  const tags = getTags(s).map(t => `<span class="tag">${t}</span>`).join("");
  const quote = getT(s, 'quote');
  const photo = PHOTO_IDS.has(s.id) ? `<img src="pictures/${s.id}.jpg" alt="" loading="lazy" decoding="async">` : "";
  
  return `
  <article class="scholar-card" data-search="${(name + ' ' + getT(s,'role') + ' ' + getTags(s).join(' ') + ' ' + s.platforms.join(' ')).toLowerCase()}">
    <header class="scholar-card__head">
      <div class="scholar-card__avatar"><span>${s.initials}</span>${photo}</div>
      <div class="scholar-card__ident">
        <h2 class="scholar-card__title">${name}</h2>
        <p class="scholar-card__meta">${getMeta(s)}</p>
        <p class="scholar-card__role">${getT(s, 'role')}</p>
      </div>
    </header>
    <div class="scholar-card__tags">${tags}</div>
    <div class="scholar-card__body">
      <p>${getT(s, 'up')}</p>
      <p>${getT(s, 'da')}</p>
    </div>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].platforms}</h3>
      <ul class="pill-list">${platforms}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].series}</h3>
      <ul class="series-list">${series}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].works}</h3>
      <ul class="works-list">${works}</ul>
    </section>
    ${quote ? `<blockquote class="scholar-card__quote">${quote}</blockquote>` : ''}
  </article>`;
}


// Main Render
function render() {
  // Set Direction & Lang
  document.body.dir = UI[currentLang].dir;
  document.documentElement.dir = UI[currentLang].dir;
  document.documentElement.lang = currentLang;
  
  // Update UI Text
  document.getElementById('ui-eyebrow').textContent = UI[currentLang].eyebrow;
  document.getElementById('ui-title').textContent = UI[currentLang].title;
  document.getElementById('ui-lede').textContent = UI[currentLang].lede;
  searchInput.placeholder = UI[currentLang].search;
  noResults.textContent = UI[currentLang].noResults;
  copyLabel.textContent = UI[currentLang].copyNames;
  copyBtn.classList.remove('is-copied');
  clearTimeout(copyBtn._copyTimer);
  
  // Update Buttons
  langBtns.forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });


  // Render Grid
  grid.innerHTML = scholars.map(cardHTML).join("");
  
  // Re-apply search filter
  searchInput.dispatchEvent(new Event('input'));
}


// Search Logic
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  let visible = 0;
  [...grid.children].forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? "" : "none";
    if (match) visible++;
  });
  noResults.classList.toggle('is-visible', visible === 0);
  countEl.textContent = q ? `${visible} / ${scholars.length}` : scholars.length;
});


// Lang Switch
langBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('dawa-lang', currentLang);
    render();
  });
});


// Copy all names
async function copyScholarNames() {
  const names = scholars.map((s, i) => `${i + 1}. ${getT(s, 'title')}`).join('\n');
  let ok = false;
  try {
    await navigator.clipboard.writeText(names);
    ok = true;
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = names;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    ok = document.execCommand('copy');
    ta.remove();
  }
  if (!ok) return;
  copyLabel.textContent = UI[currentLang].copied;
  copyBtn.classList.add('is-copied');
  clearTimeout(copyBtn._copyTimer);
  copyBtn._copyTimer = setTimeout(() => {
    copyLabel.textContent = UI[currentLang].copyNames;
    copyBtn.classList.remove('is-copied');
  }, 2000);
}
copyBtn.addEventListener('click', copyScholarNames);


// Theme Logic
const themeToggle = document.getElementById('themeToggle');
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dawa-theme', currentTheme);
  applyTheme();
});


// Init
applyTheme();
render();
</script>
</body>
