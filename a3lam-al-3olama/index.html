<!DOCTYPE html>

<head>

<title>A'lam al-Dawa | أعلام الدعوة</title>
<style>
  :root{
    --bg:#f5f7f9; --bg-glow:#dff1eb; --fg:#1b2430; --muted:#5b6675;
    --card:#ffffff; --line:#e4e8ee; --accent:#0e7c66; --accent-soft:#e6f4f0;
    --shadow:0 1px 2px rgba(16,24,40,.04); --shadow-hover:0 10px 30px rgba(16,24,40,.10);
    --radius:18px;
  }
  :root[data-theme="dark"]{
    --bg:#0d1319; --bg-glow:#12312a; --fg:#e8edf3; --muted:#93a1b1;
    --card:#131a22; --line:#222c38; --accent:#3ddcbb; --accent-soft:#12312a;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 10px 30px rgba(0,0,0,.55);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
  body{
    margin:0; min-height:100vh; padding:clamp(1rem, 3vw, 2.75rem);
    background: radial-gradient(1100px 520px at 100% -8%, var(--bg-glow), transparent 62%), var(--bg);
    color:var(--fg); line-height:1.7; font-size:16px; -webkit-font-smoothing:antialiased;
    transition: background 0.3s ease, color 0.3s ease;
  }
  body[dir="rtl"] { font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif; }
  body[dir="ltr"] { font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }

  .page-head{ display:flex; flex-wrap:wrap; gap:1.25rem; align-items:flex-end; justify-content:space-between; max-width:1400px; margin:0 auto clamp(1.5rem,3vw,2.5rem); }
  .eyebrow{ margin:0 0 .35rem; font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  .page-head h1{ margin:0; font-size:clamp(1.8rem, 4vw, 2.6rem); font-weight:700; line-height:1.25; }
  .lede{ margin:.6rem 0 0; max-width:60ch; font-size:clamp(.9rem, 1.6vw, 1rem); color:var(--muted); }
  .page-head__side{ display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }


  /* Language Switcher */
  .lang-switcher { display: flex; gap: 0.4rem; background: var(--card); padding: 0.35rem; border-radius: 12px; border: 1px solid var(--line); }
  .lang-btn { background: transparent; border: none; cursor: pointer; padding: 0.4rem 0.7rem; border-radius: 8px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; color: var(--muted); transition: all 0.2s ease; }
  .lang-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .lang-btn.active { background: var(--accent); color: #fff; }


  .count{ font-size:.8rem; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line); padding:.5rem .9rem; border-radius:999px; white-space:nowrap; }
  .theme-toggle{ width:44px; height:44px; display:grid; place-items:center; font-size:1.15rem; cursor:pointer; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:50%; transition:transform .18s ease; }
  .theme-toggle:hover{ transform:rotate(-12deg) scale(1.06); border-color:var(--accent); }


  .toolbar{ max-width:1400px; margin:0 auto clamp(1.25rem,2.5vw,2rem); display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }
  .search-wrap{ flex:1 1 280px; position:relative; display:flex; align-items:center; }
  .search-wrap svg{ position:absolute; inset-inline-start:1rem; width:18px; height:18px; color:var(--muted); pointer-events:none; }
  .search-input{ width:100%; padding:.75rem 2.6rem .75rem 1rem; font-family:inherit; font-size:.92rem; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; transition:border-color .18s ease; }
  .search-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }


  .grid{ max-width:1400px; margin:0 auto; column-count:2; column-gap:clamp(1rem, 2vw, 1.75rem); }
  @media (max-width:900px){ .grid{ column-count:1; } }
  @media (min-width:1600px){ .grid{ column-count:3; } }


  .scholar-card{ display:block; width:100%; break-inside:avoid; margin:0 0 clamp(1rem, 2vw, 1.75rem); padding:clamp(1.1rem, 2vw, 1.6rem); background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); transition:all .22s ease; animation:rise .5s ease both; }
  .scholar-card:hover{ box-shadow:var(--shadow-hover); transform:translateY(-3px); border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }


  .scholar-card__head{ display:flex; gap:.9rem; align-items:flex-start; }
  .scholar-card__avatar{ position:relative; flex:0 0 58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:.92rem; border:1px solid color-mix(in srgb, var(--accent) 18%, transparent); overflow:hidden; }
  .scholar-card__avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .scholar-card__title{ margin:0; font-size:clamp(1rem, 1.8vw, 1.12rem); font-weight:700; line-height:1.45; }
  .scholar-card__meta{ margin:.25rem 0 0; font-size:.78rem; color:var(--muted); font-weight:500; }
  .scholar-card__role{ margin:.4rem 0 0; font-size:.86rem; font-weight:600; color:var(--accent); line-height:1.5; }
  .scholar-card__tags{ display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.85rem; }
  .tag{ font-size:.72rem; font-weight:600; color:var(--muted); padding:.18rem .6rem; border-radius:6px; border:1px dashed color-mix(in srgb, var(--muted) 40%, transparent); }
  .scholar-card__body p{ margin:.9rem 0 0; font-size:.92rem; }
  .scholar-card__block{ margin-top:1.3rem; }
  .scholar-card__label{ margin:0 0 .55rem; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }


  .pill-list{ display:flex; flex-wrap:wrap; gap:.4rem; margin:0; padding:0; list-style:none; }
  .pill{ display:inline-flex; align-items:center; gap:0.4rem; text-decoration:none; font-size:.76rem; font-weight:600; padding:.28rem .78rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); border:1px solid color-mix(in srgb, var(--accent) 16%, transparent); transition:all .2s ease; }
  .pill:hover{ background:var(--accent); color:var(--card); transform:translateY(-2px); }
  .pill::after{ content:"↗"; font-size:.85em; opacity:.6; }


  .series-list{ margin:0; padding:0; list-style:none; display:grid; gap:.5rem; }
  .series-list__item{ display:block; text-decoration:none; color:var(--fg); position:relative; padding-inline-start:1.3rem; font-size:.88rem; transition:color .2s ease; }
  .series-list__item::before{ content:""; position:absolute; inset-inline-start:.15rem; top:.6em; width:.48rem; height:.48rem; border-radius:2px; background:var(--accent); transform:rotate(45deg); }
  .series-list__item:hover{ color:var(--accent); }


  .works-list{ margin:0; padding-inline-start:1.1rem; font-size:.88rem; }
  .works-list__item{ margin-bottom:.45rem; }
  .works-list__item strong{ color:var(--accent); font-weight:700; }
  .scholar-card__quote{ margin:1.3rem 0 0; padding:.8rem 1rem; font-size:.88rem; font-style:italic; border-inline-start:3px solid var(--accent); background:linear-gradient(to left, var(--accent-soft), transparent 85%); border-radius:0 var(--radius) var(--radius) 0; }
  body[dir="ltr"] .scholar-card__quote { background:linear-gradient(to right, var(--accent-soft), transparent 85%); }
  .no-results{ display:none; max-width:1400px; margin:2rem auto; padding:2rem; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:var(--radius); }
  .no-results.is-visible{ display:block; }

  /* Copy names */
  .copy-names{ display:inline-flex; align-items:center; gap:.5rem; padding:.72rem 1rem; font-family:inherit; font-size:.85rem; font-weight:600; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:12px; cursor:pointer; white-space:nowrap; transition:color .18s ease, border-color .18s ease, background .18s ease; }
  .copy-names:hover{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .copy-names:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .copy-names svg{ width:16px; height:16px; flex:none; }
  .copy-names.is-copied{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
</style>
</head>

  fr: { dir:"ltr", eyebrow:"Base de données", title:"A'lam al-Dawa", lede:"27 profils d'érudits, de chercheurs et de prédicateurs contemporains.", search:"Rechercher par nom, tag ou plateforme...", platforms:"Plateformes (Cliquez pour chercher)", series:"Séries notables (Cliquez pour regarder)", works:"Œuvres et publications", noResults:"Aucun résultat trouvé.", copyNames:"Copier les noms", copied:"Copié" },

/* =====================================================================
   2) Data (27 Scholars with Fallback Logic)

const scholars = [
    { id:"othman", initials:"ع.خ", meta:{ar:"1962 | الكويت",en:"1962 | Kuwait",fr:"1962 | Koweït",es:"1962 | Kuwait"}, tags:{ar:["الحديث","العقيدة"],en:["Hadith","Aqeedah"],fr:["Hadith","Aqidah"],es:["Hadiz","Aqidah"]}, platforms:["YouTube","Telegram","X (Twitter)","Website"], series:{ar:["شرح كتاب التوحيد","سلسلة حقبة من التاريخ"],en:["Explanation of Kitab al-Tawheed","A Period of History"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور عثمان بن محمد الخميس", role:"باحث في التاريخ الإسلامي والحديث", up:"وُلد الشيخ عثمان بن محمد الخميس في الكويت عام 1962م، ونشأ في بيئة علمية وشرعية حرصت على طلب العلم والالتزام. التحق بجامعة الإمام محمد بن سعود الإسلامية بالرياض، فدرس في كلية أصول الدين بقسم الحديث الشريف وعلومه، وتخرّج فيها متزوّدًا بأدوات البحث والتحقيق.<br><br>واصل مسيرته الأكاديمية حتى نال درجة الماجستير ثم الدكتوراه بتقدير امتياز في تخصص الحديث الشريف والدراسات التاريخية. وقد أسهمت هذه الرحلة الطويلة في تكوين شخصيته العلمية الدقيقة، وجعلته يجمع بين المنهج الحديثي في النقد والتحقيق وبين الإلمام الواسع بتاريخ الأمم والفرق الإسلامية.", da:"تولّى الإمامة والخطابة والتدريس في الكويت لسنوات طويلة، وأسهم في نشر العلم الشرعي عبر الدروس والمحاضرات والفتاوى المباشرة. عُرف بقدرته الفائقة على تبسيط المسائل العقدية والفقهية والتاريخية، وبأسلوب واضح يجمع بين الرصانة العلمية والقرب من الناس، مع اعتماد الأدلة من الكتاب والسنة وفهم السلف.<br><br>امتد أثره العلمي عبر الفضائيات والمنصات الرقمية، فصار مرجعًا لكثير من طلاب العلم في قضايا الحديث والعقيدة والرد على الشبهات التاريخية والمذهبية. ومن أبرز إنتاجه العلمي سلسلة «حقبة من التاريخ» التي قدّم فيها عرضًا تحليليًا موثقًا للأحداث والوقائع، إلى جانب مؤلفات وبحوث في نقد الروايات الضعيفة والرد على الطروحات المخالفة.", works:["<strong>حقبة من التاريخ:</strong> عرض تحليلي موثق للأحداث التاريخية.","<strong>كشف الجاني محمد التيجاني:</strong> دراسة نقدية حديثية."], quote:"طلب العلم الشرعي في هذا العصر صار ميسوراً بضغطة زر، لكن البركة تبقى في الصبر والملازمة." }, en:{title:"Sheikh Dr. Othman bin Mohammed Al-Khamees", role:"Researcher in Islamic History and Hadith", up:"Born in Kuwait in 1962, he graduated from Imam Muhammad ibn Saud Islamic University in Riyadh in the Department of Hadith, then earned his Master's and PhD in Hadith and Historical Studies with honors.", da:"He served as an Imam in Kuwait for years. He is known for his ability to simplify theological and historical issues combining academic rigor with accessibility.", works:["<strong>A Period of History:</strong> Documented analytical presentation of historical events.","<strong>Exposing Muhammad al-Tijani:</strong> A critical Hadith study."], quote:"Seeking Islamic knowledge today is easy with a click, but blessing remains in patience and consistency." } } },


    { id:"said", initials:"س.ك", meta:{ar:"1972 | المغرب",en:"1972 | Morocco",fr:"1972 | Maroc",es:"1972 | Marruecos"}, tags:{ar:["الفقه المالكي","الحديث"],en:["Maliki Fiqh","Hadith"],fr:["Fiqh Malékite","Hadith"],es:["Fiqh Malikí","Hadiz"]}, platforms:["YouTube","Facebook","Instagram","Podcasts"], series:{ar:["شرح موطأ الإمام مالك","شرح صحيح البخاري"],en:["Explanation of Muwatta Imam Malik","Explanation of Sahih Al-Bukhari"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور سعيد بن محمد الكملي", role:"فقيه مالكي ومحدث وأستاذ التعليم العالي", up:"وُلد الشيخ سعيد بن محمد الكملي في مدينة الرباط بالمغرب عام 1972م، ونشأ في أسرة عُرفت بالاهتمام بالعلم وحفظ القرآن. حفظ كتاب الله في سن مبكرة، ثم تتلمذ على عدد من علماء المغرب الأجلاء، فجمع بين التلقي التقليدي في حلقات العلم وبين الدراسة الأكاديمية النظامية.<br><br>تابع دراساته العليا في العلوم الشرعية، وتخصّص في الفقه المالكي والحديث وعلومهما، وتأثر بالمدرسة العلمية المغربية الأصيلة التي تعنى بالإسناد والتحقيق وضبط المتون. وقد مكّنه هذا التكوين المزدوج من الجمع بين عمق الفهم الفقهي ودقة النظر الحديثي والأصولي.", da:"اشتغل بالتدريس الجامعي والدروس العلمية، وصار من الوجوه البارزة في تجديد أساليب العرض والإلقاء مع الحفاظ على أصالة المحتوى. يتميز شرحه بالجمع بين دقة الاستنباط الفقهي على مذهب الإمام مالك، والبلاغة الأدبية، وحسن توظيف النقولات والشواهد، مما جعل دروسه في موطأ الإمام مالك وصحيح البخاري محط إقبال واسع.<br><br>له حضور علمي ودعوي داخل المغرب وخارجه عبر المحاضرات والمؤتمرات والمنصات الرقمية، حيث يعنى بتربية الطلبة على منهجية طلب العلم، والتدرج في المطولات، واحترام مذاهب الفقهاء. وأسهمت مؤلفاته وبحوثه في تناول مسائل معاصرة وفق الضوابط الشرعية، مع عناية خاصة بأصول الفقه وفروع الفقه المالكي.", works:["<strong>الأحكام الشرعية في الأسفار الجوية:</strong> بحث فقهي معاصر.","<strong>جني الثمرات من نظم الورقات</strong> في أصول الفقه."], quote:"العلم رحم بين أهله، ولا يُنال إلا بالتواضع للأشياخ والصبر على جرد المطولات." }, en:{title:"Sheikh Dr. Said bin Mohammed Al-Kamali", role:"Maliki Jurist, Hadith Scholar, and Professor", up:"Born in Rabat, Morocco in 1972, he memorized the Quran young, combining academic studies with travels to study under senior scholars of Morocco and the East.", da:"He is considered one of the most prominent innovators in contemporary academic delivery, blending precise Maliki jurisprudential deduction with literary rhetoric.", works:["<strong>Islamic Rulings on Air Travel:</strong> Contemporary Fiqh research.","<strong>Harvesting Fruits from Nadhm al-Waraqat</strong> in Usul al-Fiqh."], quote:"Knowledge is a mercy among its people, attained only through humility to teachers." } } },


    { id:"ayman", initials:"أ.ع", meta:{ar:"1973 | مصر",en:"1973 | Egypt",fr:"1973 | Égypte",es:"1973 | Egipto"}, tags:{ar:["اللغة العربية","الفكر"],en:["Arabic Language","Thought"],fr:["Langue Arabe","Pensée"],es:["Lengua Árabe","Pensamiento"]}, platforms:["YouTube","Telegram","SoundCloud"], series:{ar:["دورة تأسيس وعي المسلم المعاصر"],en:["Foundations of Contemporary Muslim Awareness"]}, tr:{ ar:{title:"المهندس الباحث أيمن عبد الرحيم", role:"باحث في العلوم الإنسانية واللغوية", up:"نشأ المهندس والباحث أيمن عبد الرحيم في مصر، ودرس الهندسة حيث اكتسب منهجية التفكير المنظم والتحليل الدقيق. ولم يقتصر اهتمامه على الجانب التقني، بل واظب على قراءة موسوعية في علوم اللغة العربية والتاريخ والاجتماع والفكر الإسلامي والإنساني.<br><br>شكّل هذا المسار المزدوج بين التكوين الهندسي والدراسة الإنسانية رافدًا مهمًا لمشروعه المعرفي، إذ اعتمد أدوات التحليل والنقد مع عناية باللغة والمصطلح والسياق التاريخي. وقد انعكس ذلك في اهتمامه بقضايا الوعي وبناء المفاهيم عند المسلم المعاصر.", da:"اشتهر عبر المنصات الرقمية بسلاسل محاضرات تأسيسية مكثفة تستهدف العقل الشبابي المثقف، وتهدف إلى بناء خريطة معرفية متماسكة تساعد المتلقي على فهم ذاته ودينه وتاريخه. تتناول محاضراته موضوعات اللغة، والتاريخ، والفكر، والاجتماع، وربط العلوم بالمنظور الإسلامي الشامل.<br><br>تميّز أسلوبه بالتركيز على الجذور والمقدمات المعرفية قبل الجزئيات، وبالدعوة إلى القراءة المنهجية والصبر على طلب العلم. وقد تحولت كثير من سلاسله الصوتية والمرئية إلى مواد مفرغة يستفيد منها الباحثون وطلاب العلم بوصفها مدخلًا لإعادة ترتيب الوعي وبناء الرؤية النقدية المتوازنة.", works:["<strong>سلاسل صوتية ومرئية مفرغة:</strong> تحولت إلى مقررات قراءة ذاتية."], quote:"أزمة المسلم المعاصر ليست في نقص المعلومات، بل في غياب الخريطة المعرفية." }, en:{title:"Eng. Ayman Abdel Rahim", role:"Researcher in Humanities and Linguistics", up:"Raised in Egypt, he combined engineering training with encyclopedic studies in Arabic language, history, and sociology.", da:"He became famous online for his foundational lecture series addressing educated youth, aiming to build a coherent epistemological base.", works:["<strong>Transcribed Audio/Video Series:</strong> Turned into self-study curricula."], quote:"The crisis of the contemporary Muslim is the absence of an epistemological map." } } },


    { id:"eyad", initials:"إ.ق", meta:{ar:"1975 | الأردن",en:"1975 | Jordan",fr:"1975 | Jordanie",es:"1975 | Jordania"}, tags:{ar:["الإلحاد المعاصر","علم الأدوية"],en:["Atheism","Pharmacology"],fr:["Athéisme","Pharmacologie"],es:["Ateísmo","Farmacología"]}, platforms:["YouTube","Telegram","Facebook"], series:{ar:["سلسلة رحلة اليقين"],en:["Journey of Certainty"]}, tr:{ ar:{title:"الدكتور إياد بن عبد الحافظ قنيبي", role:"أستاذ جامعي في علم الأدوية وباحث في القضايا الفكرية", up:"وُلد الدكتور إياد بن عبد الحافظ قنيبي في الأردن عام 1975م، وتلقى تعليمه العام في بلده، ثم تابع دراساته العليا في العلوم الصيدلانية. حصل على درجة الدكتوراه في علم الأدوية (Pharmacology) من جامعة هيوستن بولاية تكساس في الولايات المتحدة الأمريكية، وهو تخصص دقيق يقوم على البحث التجريبي والتحليل العلمي.<br><br>عمل أستاذًا جامعيًا في علم الأدوية في الجامعات الأردنية، ونشر أبحاثًا علمية محكّمة في مجاله الأكاديمي. وقد منحته خلفيته العلمية الصلبة قدرة على التعامل مع القضايا المعاصرة التي تُطرح باسم العلم، والتمييز بين النتائج التجريبية والتأويلات الفلسفية الملبسة بها.", da:"برز على الساحة الفكرية والدعوية بوصفه أحد أبرز المتخصصين في تفكيك شبهات الإلحاد الجديد والمادية العلمية، ولا سيما ما يُوجَّه منها إلى الشباب في الفضاء الرقمي. قدّم سلسلة «رحلة اليقين» التي ناقش فيها قضايا الإيمان والعلم والغاية بمعالجة تجمع بين وضوح الطرح وعمق الحجة.<br><br>يعتمد في خطابه على المنهج العقلاني المنضبط واحترام حقائق العلم التجريبي، مع بيان حدود المنهج العلمي وعدم خلطه بالفلسفات الإلحادية. وأسهمت محاضراته ومقالاته ومشاركاته في ترسيخ الثقة بالإسلام لدى كثير من الباحثين، وفي تقديم نموذج للمثقف المسلم الذي يجمع بين التخصص الأكاديمي والاهتمام بالقضايا العقدية والفكرية.", works:["<strong>أبحاث علمية محكمة:</strong> في مجال الصيدلة وعلم الأدوية."], quote:"العلم التجريبي الصحيح إذا تجرد من الأيديولوجيا فإنه يقود حتماً إلى الإيمان." }, en:{title:"Dr. Eyad bin Abdul Hafiz Qunaibi", role:"Professor of Pharmacology & Intellectual Researcher", up:"He earned his PhD in Pharmacology from the University of Houston, USA, and worked as a university professor in Jordan.", da:"He emerged digitally as a key specialist in deconstructing philosophical and scientific doubts facing Muslim youth.", works:["<strong>Peer-Reviewed Research:</strong> In pharmacy and pharmacology."], quote:"Correct empirical science, stripped of ideology, inevitably leads to faith." } } },


    { id:"menk", initials:"م.م", meta:{ar:"1975 | زيمبابوي",en:"1975 | Zimbabwe",fr:"1975 | Zimbabwe",es:"1975 | Zimbabue"}, tags:{ar:["الفقه","الدعوة"],en:["Fiqh","Da'wah"],fr:["Fiqh","Da'wah"],es:["Fiqh","Da'wah"]}, platforms:["YouTube","Facebook","Instagram","X (Twitter)"], series:{ar:["سلسلة قصص الأنبياء"],en:["Stories of the Prophets"]}, tr:{ ar:{title:"فضيلة المفتي إسماعيل بن موسى منك", role:"المفتي الأكبر في زيمبابوي", up:"وُلد الشيخ إسماعيل بن موسى منك في هراري بزيمبابوي عام 1975م، ونشأ في أسرة مسلمة محافظة. حفظ القرآن الكريم في سن مبكرة، وتلقى علومه الأولى في بلده، ثم شدّ الرحال إلى المدينة المنورة حيث التحق بالجامعة الإسلامية.<br><br>تخرّج في كلية الشريعة بالجامعة الإسلامية بالمدينة المنورة، وتلقّى العلم على أيدي عدد من المشايخ والأساتذة، فتكوّن لديه أساس متين في الفقه وأصوله وعلوم القرآن والسنة. وقد ساعده هذا التكوين الشرعي النظامي، إلى جانب نشأته في بيئة متعددة الثقافات، على مخاطبة شرائح واسعة بلغات وأساليب متنوعة.", da:"يشغل منصب المفتي الأكبر في زيمبابوي، ويُعد من أكثر الدعاة المسلمين تأثيرًا وانتشارًا على المستوى العالمي. اشتهر بخطبه ودروسه القصيرة والمؤثرة التي تركز على التزكية، وإصلاح النفس، والتسامح، وتعزيز القيم الأخلاقية، مع حرص على الخطاب الوسطى الميسر.<br><br>شارك في مؤتمرات ولقاءات دعوية في قارات مختلفة، وبلغت محاضراته ومقاطعه المرئية ملايين المتابعين عبر منصات التواصل. ومن أبرز أعماله سلسلة «قصص الأنبياء» ودروس في السيرة والرقائق، حيث يجمع في طرحه بين الموعظة العملية والربط بواقع الناس اليومي، داعيًا إلى حسن الظن بالله والإحسان إلى الخلق.", works:["<strong>محاضرات ودروس صوتية ومرئية:</strong> تُعد من أكثر المحتوى الإسلامي انتشاراً."], quote:"أحسن الظن بالله، واعمل صالحاً، ولا تحقرن من المعروف شيئاً." }, en:{title:"Mufti Ismail ibn Musa Menk", role:"Grand Mufti of Zimbabwe", up:"Born in Harare, Zimbabwe in 1975, he memorized the Quran young and graduated from the Islamic University of Madinah.", da:"He is one of the most influential Muslim preachers globally, serving as the Grand Mufti of Zimbabwe.", works:["<strong>Audio/Video Lectures:</strong> Among the most widespread Islamic content."], quote:"Think well of Allah, do good, and never belittle a good deed." } } },


    { id:"omar", initials:"ع.س", meta:{ar:"1986 | أمريكا",en:"1986 | USA",fr:"1986 | États-Unis",es:"1986 | EE.UU."}, tags:{ar:["البحوث الإسلامية"],en:["Islamic Research"],fr:["Recherche Islamique"],es:["Investigación Islámica"]}, platforms:["YouTube","Instagram","Facebook","X (Twitter)"], series:{ar:["شرح أسماء الله الحسنى"],en:["Names of Allah"]}, tr:{ ar:{title:"الإمام الدكتور عمر سليمان", role:"مؤسس ورئيس معهد يقين للبحوث الإسلامية", up:"وُلد الإمام عمر سليمان في مدينة نيو أورلينز بولاية لويزيانا في الولايات المتحدة الأمريكية عام 1986م، ونشأ في بيئة مسلمة نشطة. بدأ طلب العلم الشرعي في سن مبكرة، فدرس في الأردن وماليزيا والإمارات وعدة مراكز علمية، وحصل على إجازات في العلوم الشرعية.<br><br>أكمل دراساته العليا فحصل على درجتي الماجستير والدكتوراه في الفكر الإسلامي والحضارة الإسلامية من المعهد الدولي للفكر والحضارة الإسلامية في ماليزيا. وقد جمع في تكوينه بين الدراسة الأكاديمية الحديثة والاطلاع على التراث الفقهي والعقدي، مع اهتمام خاص بالقضايا المعاصرة التي تواجه المسلمين في الغرب.", da:"يُعرف بوصفه مؤسس ورئيس معهد «يقين» للبحوث الإسلامية، وهي مؤسسة بحثية تسعى إلى تقديم محتوى إسلامي موثوق يعالج الشبهات الفكرية والاجتماعية بلغة علمية رصينة وميسرة. كما يعمل أستاذًا للدراسات الإسلامية، وله نشاط واسع في الخطابة والتدريس والإرشاد المجتمعي.<br><br>قدّم محاضرات وسلاسل مؤثرة في السيرة النبوية، وأسماء الله الحسنى، والعدالة الاجتماعية، والقضايا الأخلاقية المعاصرة. ويتميز خطابه بالجمع بين التأصيل الشرعي والاهتمام بالواقع الإنساني، مع حضور بارز في المبادرات الدعوية والخيرية، مما جعله من الأصوات المؤثرة لدى المسلمين في أمريكا الشمالية وخارجها.", works:["<strong>مؤلفات وبحوث محكمة</strong> في الفكر الإسلامي."], quote:"الإيمان ليس مجرد شعور، بل هو منظومة معرفية وأخلاقية." }, en:{title:"Imam Dr. Omar Suleiman", role:"Founder of Yaqeen Institute", up:"Born in the USA in 1986, he holds a PhD in Islamic Thought.", da:"Founder and President of Yaqeen Institute and Professor of Islamic Studies at Southern Methodist University.", works:["<strong>Books and Research</strong> in Islamic Thought."], quote:"Faith is not just a feeling; it is a knowledge and moral system." } } },


    { id:"yasir", initials:"ي.ق", meta:{ar:"1975 | أمريكا",en:"1975 | USA",fr:"1975 | États-Unis",es:"1975 | EE.UU."}, tags:{ar:["العقيدة"],en:["Aqeedah"],fr:["Aqidah"],es:["Aqidah"]}, platforms:["YouTube","Facebook","X (Twitter)"], series:{ar:["شرح العقيدة الطحاوية"],en:["Aqeedah Tahawiyyah"]}, tr:{ ar:{title:"الشيخ الدكتور ياسر قاضي", role:"عالم مسلم وباحث في العقيدة", up:"وُلد الشيخ ياسر قاضي في هيوستن بولاية تكساس عام 1975م لأبوين باكستانيين، ونشأ في الولايات المتحدة. بدأ دراسته الجامعية في الهندسة الكيميائية بجامعة هيوستن، ثم اتجه إلى دراسة العلوم الشرعية، فالتحق بالجامعة الإسلامية بالمدينة المنورة حيث حصل على درجة البكالوريوس في علوم الحديث.<br><br>واصل دراساته العليا في المدينة المنورة فنال درجة الماجستير في العقيدة والمذاهب المعاصرة، ثم عاد إلى الولايات المتحدة وأكمل الدكتوراه في الدراسات الإسلامية بجامعة ييل. وقد منحه هذا المسار الفريد الجمع بين البيئة الغربية والتكوين الشرعي النظامي والبحث الأكاديمي المتقدم.", da:"يُعد من أبرز العلماء والدعاة المسلمين في أمريكا الشمالية، وله إسهامات واسعة في التدريس والخطابة والتأليف. شغل مناصب أكاديمية ودعوية عديدة، من بينها عميد الشؤون الأكاديمية في معهد «المغرب»، والعمل في الإرشاد الديني والتعليم الإسلامي المؤسسي، مع اهتمام خاص بقضايا العقيدة والفكر المعاصر.<br><br>قدّم شروحًا ودروسًا مطولة في كتب العقيدة والحديث والسيرة، واشتهر بقدرته على معالجة الإشكالات العقدية والفكرية التي تواجه الشباب المسلم في الغرب بلغة تجمع بين العمق العلمي والوضوح. كما شارك في حوارات ومؤتمرات علمية ودعوية، وأسهم في بناء خطاب إسلامي متوازن يراعي الثوابت ويعالج الواقع.", works:["<strong>مؤلفات في العقيدة.</strong>"], quote:"لا خير في علم لا يورث خشية." }, en:{title:"Sheikh Dr. Yasir Qadhi", role:"Scholar and Researcher in Aqeedah", up:"Born in Houston, he holds a PhD from Yale University.", da:"One of the most prominent Muslim scholars in North America and Dean of Academic Affairs at Al-Maghrib Institute.", works:["<strong>Books on Aqeedah.</strong>"], quote:"There is no good in knowledge that does not breed piety." } } },


    { id:"nouman", initials:"ن.ع", meta:{ar:"1978 | ألمانيا",en:"1978 | Germany",fr:"1978 | Allemagne",es:"1978 | Alemania"}, tags:{ar:["اللغة العربية"],en:["Arabic"],fr:["Arabe"],es:["Árabe"]}, platforms:["YouTube","Instagram","Facebook"], series:{ar:["تفسير جزء عم"],en:["Tafsir Juz Amma"]}, tr:{ ar:{title:"الأستاذ نعمان علي خان", role:"مؤسس معهد البيان", up:"وُلد الأستاذ نعمان علي خان في برلين بألمانيا عام 1978م لأبوين باكستانيين، وانتقل مع أسرته إلى الولايات المتحدة في سن مبكرة حيث نشأ وتلقى تعليمه. اهتم باللغة العربية منذ صغره، فالتحق بدورات مكثفة في دراسة العربية والقرآن في باكستان والمملكة العربية السعودية.<br><br>كرّس سنوات طويلة لدراسة النحو والبلاغة وعلوم القرآن، وتأثر بالمدرسة اللغوية في مقاربة النص القرآني. وقد شكّل هذا التخصص المبكر في العربية أساس مشروعه التعليمي الذي يهدف إلى تقريب معاني القرآن إلى الناطقين بالإنجليزية وغير المختصين بأسلوب مباشر وعميق.", da:"أسس معهد «بيّنة» (Bayyinah Institute) في الولايات المتحدة، وهو مؤسسة تعليمية تُعنى بتدريس اللغة العربية وعلوم القرآن، وقدّمت برامج مكثفة حضورية وإلكترونية استفاد منها آلاف الطلاب حول العالم. اشتهر بسلاسل تفسير أجزاء من القرآن الكريم، ولا سيما تفسير جزء عمّ وسور مختارة، بأسلوب لغوي تربوي مميز.<br><br>يُعد من أكثر الدعاة والمربين المسلمين تأثيرًا في الغرب، حيث يركز على تدبر القرآن وبناء الصلة الشخصية به، مع معالجة قضايا الهوية والإيمان والتربية. وتمتاز محاضراته بالجمع بين التحليل اللغوي الدقيق واللمسة الوعظية المؤثرة، مما جعل محتواه واسع الانتشار بين الشباب والأسر المسلمة.", works:["<strong>سلسلة محاضرات ودروس.</strong>"], quote:"القرآن ليس كتاباً يُقرأ فحسب، بل هو خطاب حي." }, en:{title:"Ustadh Nouman Ali Khan", role:"Founder of Bayyinah Institute", up:"Born in Berlin in 1978 to Pakistani parents, he grew up in the USA.", da:"One of the most prominent Muslim educators in the West, known for his ability to simplify Quranic sciences.", works:["<strong>Lecture Series.</strong>"], quote:"The Quran is not just a book to be read; it is a living address." } } },


    { id:"zakir", initials:"ذ.ن", meta:{ar:"1965 | الهند",en:"1965 | India",fr:"1965 | Inde",es:"1965 | India"}, tags:{ar:["الأديان المقارنة"],en:["Comparative Religion"],fr:["Religions Comparées"],es:["Religión Comparada"]}, platforms:["YouTube","Facebook","Website"], series:{ar:["الأديان المقارنة"],en:["Comparative Religion"]}, tr:{ ar:{title:"الدكتور ذاكر عبد الكريم نايك", role:"محاضر دولي في الأديان المقارنة", up:"وُلد الدكتور ذاكر عبد الكريم نايك في مدينة مومباي بالهند عام 1965م، ونشأ في أسرة مسلمة مهتمة بالعلم والدعوة. درس الطب والجراحة وحصل على درجة البكالوريوس في الطب والجراحة (MBBS) من جامعة مومباي، ومارس المهنة الطبية لفترة.<br><br>إلى جانب تكوينه الطبي، انكبّ على دراسة الأديان المقارنة والكتب المقدسة، وتأثر بالداعية أحمد ديدات، فجمع بين الخلفية العلمية والمنهجية الحوارية في عرض القضايا العقدية. وقد مكّنه ذلك من مخاطبة جمهور متنوع في بيئات متعددة الثقافات والأديان.", da:"أسس «مؤسسة البحوث الإسلامية» (IRF) وقناة «Peace TV» التي بثّت محاضراته ومناظراته إلى جمهور واسع حول العالم. اشتهر بمحاضرات الأديان المقارنة والحوار مع أتباع الديانات الأخرى، واعتمد أسلوبًا يقوم على الاستشهاد بالنصوص من القرآن والكتب المقدسة الأخرى في إطار مناظرات ومنتديات عامة.<br><br>ألقى مئات المحاضرات في بلدان مختلفة، وأثار اهتمامًا واسعًا بقضايا الدعوة والتعريف بالإسلام والرد على الشبهات الشائعة. ويظل حضوره الإعلامي والرقمي مؤثرًا لدى قطاعات كبيرة من المهتمين بالحوار الديني، مع تركيز مستمر على عرض الإسلام بوصفه رسالة شاملة تقوم على التوحيد والعقل والهدى.", works:["<strong>محاضرات وندوات مسجلة.</strong>"], quote:"أفضل طريقة للدعوة هي أن تعرض الإسلام كما هو." }, en:{title:"Dr. Zakir Abdul Karim Naik", role:"International Lecturer in Comparative Religion", up:"Born in Mumbai, India in 1965, he graduated as a medical doctor.", da:"Founder of the Islamic Research Foundation and one of the most famous international lecturers in comparative religion.", works:["<strong>Recorded Lectures.</strong>"], quote:"The best way to give Da'wah is to present Islam as it is." } } },
    { id:"hamza", initials:"ح.ي", meta:{ar:"1958 | أمريكا",en:"1958 | USA",fr:"1958 | États-Unis",es:"1958 | EE.UU."}, tags:{ar:["الفقه","التزكية"],en:["Fiqh","Spirituality"],fr:["Fiqh","Spiritualité"],es:["Fiqh","Espiritualidad"]}, platforms:["YouTube","Facebook","Podcasts"], series:{ar:["شرح متن الآجرومية"],en:["Al-Ajrumiyyah"]}, tr:{ ar:{title:"الشيخ حمزة يوسف هانسون", role:"مؤسس ورئيس كلية زيتونة", up:"وُلد الشيخ حمزة يوسف هانسون عام 1958م في ولاية واشنطن بالولايات المتحدة الأمريكية، ونشأ في بيئة أكاديمية مسيحية. اعتنق الإسلام عام 1977م، ثم سافر في رحلة علمية طويلة امتدت لسنوات، فدرس العلوم الشرعية واللغة العربية في الإمارات العربية المتحدة والجزائر والمغرب وموريتانيا وغيرها.<br><br>تتلمذ على عدد من العلماء التقليديين، ولا سيما في المغرب وموريتانيا، حيث درس الفقه المالكي وأصوله والعقيدة والتزكية وعلوم العربية. وقد أكسبه هذا المسار تجمعًا نادرًا بين الخلفية الغربية والثقافة الإسلامية التقليدية، مع إلمام بالفكر والفلسفة الغربية.", da:"شارك في تأسيس معهد «زيتونة» في كاليفورنيا عام 1996م، ثم أسهم في تحويله إلى «كلية زيتونة» التي تُعد أول كلية فنون ليبرالية إسلامية معتمدة في الولايات المتحدة. يشغل منصب رئيس الكلية، ويعنى بتخريج طلاب يجمعون بين العلوم الشرعية والعلوم الإنسانية المعاصرة.<br><br>يُعرف بخطابه الذي يركز على التزكية، وإحياء السنن، والتجديد المنضبط، ومعالجة قضايا المسلمين في الغرب. له محاضرات ودروس مترجمة ومؤلفات في الفقه والسيرة والفكر الإسلامي، وأسهم في حوارات بين الأديان ومبادرات مجتمعية، مما جعله من أبرز الأصوات الإسلامية المؤثرة في العالم الناطق بالإنجليزية.", works:["<strong>ترجمات ومؤلفات.</strong>"], quote:"التجديد الحقيقي ليس في تغيير الدين." }, en:{title:"Sheikh Hamza Yusuf Hanson", role:"Founder of Zaytuna College", up:"Born in Washington in 1958, he embraced Islam in 1977 and studied Islamic sciences for over a decade.", da:"Founder and President of Zaytuna College in California, the first accredited Islamic college in the USA.", works:["<strong>Translations and Books.</strong>"], quote:"True renewal is not changing the religion." } } },


    { id:"tariq", initials:"ط.ج", meta:{ar:"1953 | باكستان",en:"1953 | Pakistan",fr:"1953 | Pakistan",es:"1953 | Pakistán"}, tags:{ar:["التزكية"],en:["Spirituality"],fr:["Spiritualité"],es:["Espiritualidad"]}, platforms:["YouTube","Facebook"], series:{ar:["خطب الجمعة"],en:["Friday Sermons"]}, tr:{ ar:{title:"المولانا طارق جميل", role:"داعية باكستاني", up:"وُلد المولانا طارق جميل عام 1953م في مدينة تولامبا بإقليم البنجاب في باكستان. نشأ في أسرة ميسورة، وبدأ دراسته الأكاديمية في مجال الطب، ثم تركه متجهًا إلى طلب العلم الشرعي بدافع إيماني عميق.<br><br>التحق بجامعة العربية في ريويند (رايويند) القريبة من لاهور، حيث درس العلوم الإسلامية واللغة العربية والحديث والفقه. وقد شكّل هذا التحول في مساره الدراسي نقطة فارقة في حياته، فكرّس وقته وجهده للدعوة والإرشاد والتربية الروحية.", da:"اشتهر بخطبه المؤثرة في التزكية وإصلاح القلوب والدعوة إلى التوبة والالتزام بالأخلاق الإسلامية، وأصبح من أكثر الدعاة شعبية في باكستان والعالم الإسلامي. تُبث خطبه ومحاضراته عبر التلفزيون والإنترنت، وتحظى بمتابعة ملايين الأشخاص من خلفيات مختلفة.<br><br>يركز في دعوته على محاسبة النفس، وتعظيم شأن العبادة، وإصلاح العلاقات الأسرية والاجتماعية، بأسلوب عاطفي قريب من القلوب. وقد أسهمت جولاته الدعوية داخل باكستان وخارجها في التأثير في قطاعات واسعة من الشباب والعامة، مع حرص على خطاب جامع يدعو إلى الوئام والتقوى.", works:["<strong>خطب ومحاضرات مسجلة.</strong>"], quote:"الدعوة ليست كلاماً يُقال، بل حال يُرى." }, en:{title:"Maulana Tariq Jameel", role:"Pakistani Preacher", up:"Born in Pakistan in 1953, he received his religious education in Islamic schools.", da:"One of the most famous preachers in Pakistan and the Islamic world, known for his impactful sermons.", works:["<strong>Recorded Sermons.</strong>"], quote:"Da'wah is not words spoken, but a state seen." } } },


    { id:"ahmed", initials:"أ.ش", meta:{ar:"1973 | السعودية",en:"1973 | KSA",fr:"1973 | Arabie Saoudite",es:"1973 | Arabia Saudita"}, tags:{ar:["الإعلام"],en:["Media"],fr:["Médias"],es:["Medios"]}, platforms:["YouTube","X (Twitter)","Instagram"], series:{ar:["برنامج خواطر"],en:["Khawater"]}, tr:{ ar:{title:"الأستاذ أحمد الشقيري", role:"إعلامي وداعية", up:"وُلد الأستاذ أحمد مازن الشقيري في مدينة جدة بالمملكة العربية السعودية عام 1973م، ونشأ في بيئة محافظة. انتقل إلى الولايات المتحدة الأمريكية لاستكمال دراسته الجامعية، حيث حصل على درجة البكالوريوس في نظم إدارة المعلومات من جامعة كاليفورنيا الحكومية في لونغ بيتش.<br><br>عاد لاحقًا لإكمال دراساته العليا، فنال درجة الماجستير في إدارة الأعمال (MBA) من جامعة كاليفورنيا في بيركلي. وقد منحه هذا التكوين الأكاديمي في الإدارة والإعلام فهمًا عميقًا لآليات التأثير والتواصل، ساعده في تطوير مشروعه الإعلامي الدعوي الهادف.", da:"برز بوصفه أحد أبرز الإعلاميين في العالم العربي، واشتهر بتقديم برنامج «خواطر» الذي عُرض لسنوات متتالية وتناول قضايا النهضة، والتعليم، والإنتاجية، والأخلاق، والتجربة التنموية بروح إيمانية محفزة. كما قدّم برامج أخرى مثل «يلا شباب» و«قمرة».<br><br>اعتمد في عمله على أسلوب بصري جذاب ورسائل عملية تدعو إلى التغيير الإيجابي بدءًا من الفرد والمجتمع. وأسهمت برامجه في إلهام شريحة واسعة من الشباب العربي نحو التطوير الذاتي، والعمل التطوعي، والوعي بالقدوة الحسنة، مع حضور مؤثر عبر منصات التواصل الاجتماعي والمبادرات المجتمعية.", works:["<strong>برامج تلفزيونية.</strong>"], quote:"التغيير يبدأ من الداخل." }, en:{title:"Ustadh Ahmed Al-Shugairi", role:"Media Personality and Preacher", up:"Born in Jeddah in 1973, he studied Information Systems at the University of California.", da:"One of the most prominent media figures in the Arab world, famous for his show 'Khawater'.", works:["<strong>TV Shows.</strong>"], quote:"Change starts from within." } } },


    { id:"amri", initials:"ي.ع", meta:{ar:"المغرب",en:"Morocco",fr:"Maroc",es:"Marruecos"}, tags:{ar:["الدعوة","التربية"],en:["Da'wah","Education"],fr:["Da'wah","Éducation"],es:["Da'wah","Educación"]}, platforms:["YouTube","Website"], series:{ar:["السيرة النبوية","شرح الأربعون النووية","مجالس القرآن"],en:["The Prophet's Biography","Explanation of the Forty Hadiths","Quranic Sessions"]}, tr:{ ar:{title:"الأستاذ الداعية ياسين العمري", role:"داعية وطالب علم ومحاضر تربوي", up:"الأستاذ ياسين العمري داعية مغربي معاصر ومحاضر تربوي، يُعد من الوجوه الدعوية والعلمية المعروفة بالمغرب. حصل على دبلوم الأهلية لتدريس تقنيات التعبير والتواصل، وعلى إجازة في اللغة الفرنسية وآدابها، إلى جانب دراسته للعلوم الشرعية وعلوم التربية، مما أتاح له الجمع بين التكوين اللغوي والتربوي والمعرفي الشرعي.<br><br>نشأ اهتمامه بالعلم والدعوة في سياق تربوي يحرص على التأصيل والربط بالواقع، فاشتغل بتطوير أدوات الخطاب والتواصل مع مختلف الفئات، ولا سيما الشباب والأسر. وقد انعكس هذا المسار في أسلوبه الذي يجمع بين وضوح الفكرة وسلامة المنهج والاهتمام بالبُعد التربوي العملي.", da:"قدّم العديد من الدروس والمحاضرات والبرامج التربوية التي تناولت قضايا الإيمان والسلوك والتزكية وبناء الوعي، مع تركيز على ربط المسلم بالقرآن الكريم والسنة النبوية وفق المنهج الوسطي المعتدل. عُرف بعنايته بقضايا الشباب والأسرة والتربية الإيمانية، وبحرصه على تقديم خطاب هادئ متوازن يراعي واقع الناس.<br><br>ينشر محتواه العلمي والتوجيهي عبر موقعه الرسمي ومنصاته الرقمية، ويقدّم سلاسل في السيرة النبوية وشرح الأربعين النووية ومجالس القرآن والبرامج التربوية المتخصصة. وقد أسهمت جهوده في تقريب المعاني الشرعية والتربوية إلى المتلقي بلغة واضحة وخطوات عملية تعين على الاستقامة وبناء الشخصية المسلمة الواعية.", works:["<strong>دروس ومحاضرات ومقالات:</strong> مواد علمية وتربوية منشورة عبر الموقع الرسمي.","<strong>برامج تربوية:</strong> محتوى موجّه لقضايا الشباب والأسرة وبناء الوعي."], quote:"العلم النافع نورٌ يهدي الله به القلوب والعقول إلى طريق الاستقامة." }, en:{title:"Ustadh Yassine El Amri", role:"Preacher, student of knowledge and educational lecturer", up:"A contemporary Moroccan preacher and educational lecturer, recognized among Morocco's known da'wah and scholarly figures. He works to spread Islamic knowledge and educational guidance in a way that combines authenticity with contemporary reality, with special attention to education, reform and awareness-building. He holds a diploma in teaching expression and communication, a licentiate in French language and literature, and has studied Islamic sciences and education.", da:"He has delivered numerous lessons, lectures and educational programs on faith, behavior, spiritual refinement and awareness-building, with a focus on connecting Muslims to the Quran and Sunnah according to the moderate Islamic approach. He is known for his interest in youth, family and education, and publishes his scholarly and guidance content through his official website and digital platforms.", works:["<strong>Lessons, lectures and articles:</strong> Scholarly and educational material published on his official website.","<strong>Educational programs:</strong> Content addressing youth, family and awareness-building."], quote:"Beneficial knowledge is a light by which Allah guides hearts and minds to the path of uprightness." } } },


    { id:"nafi", initials:"ر.ن", meta:{ar:"1961 | المغرب",en:"1961 | Morocco",fr:"1961 | Maroc",es:"1961 | Marruecos"}, tags:{ar:["السنة","الدعوة"],en:["Hadith","Da'wah"],fr:["Hadith","Da'wah"],es:["Hadiz","Da'wah"]}, platforms:["YouTube","Website"], series:{ar:["دروس علمية بمساجد الرباط","برامج دعوية"],en:["Lessons in Rabat Mosques","Da'wah Programs"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور رشيد نافع", role:"عالم في السنة وعلومها وداعية", up:"وُلد الشيخ الدكتور رشيد بن عبد السلام نافع الصنهاجي في الرباط يوم 16 رمضان 1382هـ الموافق 23 فبراير 1961م. نشأ في رحاب مسجد قصبة الأوداية والمسجد الأعظم بالرباط، وتعلم القرآن الكريم في كتّابيهما، ثم تابع دراسته الابتدائية والثانوية بمدارس محمد الخامس. وكانت بداياته العلمية على يد الشيخين تقي الدين الهلالي والشيخ حماد الأنصاري، فكان لهما أثر بالغ في توجيهه نحو العناية بالسنة.<br><br>التحق بالجامعة الإسلامية بالمدينة المنورة ونال الإجازة من كلية الدعوة وأصول الدين تخصص العقيدة، ثم واصل مساره الأكاديمي بالمغرب فحصل على دبلوم الدراسات المعمقة من جامعة محمد الخامس بالرباط، ودبلوم الدراسات العليا والدكتوراه الدولة في السنة وعلومها من جامعة الحسن الثاني بالدار البيضاء. وقد صقل هذا التكوين المزدوج بين الدراسة في المشرق والمغرب شخصيته العلمية المنهجية.", da:"يُعد عضوًا في رابطة علماء المغرب وخطيبًا لمسجد الوحدة بالحي الصناعي بالرباط، وله دروس علمية منتظمة بمساجد الرباط عبر المجلس العلمي المحلي. عُرف باهتمامه العميق بالسنة النبوية وعلومها، وبالحرص على تعظيم الدليل وضبط مسائل الاعتقاد والمنهج وفق فهم السلف.<br><br>امتد نشاطه الدعوي والعلمي إلى داخل المغرب وخارجه عبر الندوات والمحاضرات والبرامج، كما عُرف بمشاركته في العمل الإغاثي والإنساني في مناطق متعددة. وله مؤلفات ورسائل علمية في التاريخ والدعوة وقضايا السنة، ويواصل دوره في التربية العلمية والدعوية بخطاب هادئ يجمع بين التأصيل والرفق والاهتمام بواقع الأمة.", works:["<strong>يوسف بن تاشفين ودعوته</strong>","<strong>أيها التائب أقبل</strong>","<strong>المرسل الخفي وحجيته</strong>"] }, en:{title:"Sheikh Dr. Rachid Nafi", role:"Scholar of Hadith and Islamic Sciences; preacher", up:"Born in Rabat on 16 Ramadan 1382 AH (23 February 1961). He grew up between the Qasbah of the Udayas mosque and the Great Mosque of Rabat, learned the Quran in its kuttab, and studied at Mohammed V schools in Rabat. He traveled to study under Sheikh Taqi al-Din al-Hilali and Sheikh Hammad al-Ansari, joined the Islamic University of Madinah, and obtained a licentiate from the Faculty of Da'wah and Usul al-Din (Aqeedah). He later earned a higher studies diploma from Mohammed V University and a higher studies diploma and State Doctorate in Hadith and its sciences from Hassan II University in Casablanca.", da:"He is a member of the League of Moroccan Scholars and the preacher of the Unity Mosque in the Industrial District of Rabat, with regular lessons in Rabat mosques through the local Scientific Council. He is known for his focus on Hadith and its sciences and his emphasis on evidence. He has extensive relief work in Bosnia, the Zaatari camp, Cox's Bazar and Morocco. He is a founding member of the Conference for the Support of the Prophet in Bahrain (2005) and has participated in conferences and da'wah programs in Morocco and abroad.", works:["<strong>Yusuf ibn Tashfin and His Da'wah</strong>","<strong>O Repentant One, Come Forward</strong>","<strong>The Hidden Mursal and Its Authority</strong>"] } } },


    { id:"belal", initials:"ب.أ", meta:{ar:"1970s | أستراليا",en:"1970s | Australia",fr:"1970s | Australie",es:"1970s | Australia"}, tags:{ar:["الشريعة"],en:["Sharia"],fr:["Charia"],es:["Sharia"]}, platforms:["YouTube","Instagram"], series:{ar:["خطب الجمعة"],en:["Friday Sermons"]}, tr:{ ar:{title:"الشيخ بلال أسعد", role:"داعية ومحاضر", up:"وُلد الشيخ بلال أسعد في لبنان، ونشأ في بيئة عُنيت بالعلم الشرعي والقيم الإسلامية. تابع دراسته الجامعية في لبنان حيث حصل على درجة علمية في الشريعة الإسلامية والدعوة، فتأسس على علوم القرآن والسنة والفقه والعقيدة.<br><br>انتقل لاحقًا إلى أستراليا حيث استقر وواصل مسيرته التعليمية والدعوية، فجمع بين التكوين الشرعي المكتسب في بلاد الشام وبين الخبرة الميدانية في التعامل مع مجتمعات المسلمين في الغرب. وقد أكسبه هذا الاحتكاك فهمًا عميقًا لتحديات الهوية والتربية والإيمان في السياقات الغربية.", da:"يُعد من الدعاة والمحاضرين البارزين في أستراليا، وله نشاط واسع في إلقاء الخطب والدروس والمحاضرات في المساجد والمراكز الإسلامية والمؤتمرات. يركز في خطابه على قضايا الإيمان، وبناء الأسرة، وتربية الشباب، ومعالجة المشكلات الاجتماعية والنفسية من منظور إسلامي متوازن.<br><br>تنتشر دروسه وخطبه عبر المنصات الرقمية ومواقع التواصل، حيث يحرص على تقديم محتوى عملي يمس واقع الناس ويعينهم على الثبات وحسن الخلق. ويتميز أسلوبه بالوضوح والدفء والقدرة على مخاطبة مختلف الأعمار، مع التأكيد على وسطية الإسلام وشموليته للحياة الروحية والاجتماعية.", works:["<strong>محاضرات وخطب.</strong>"], quote:"الدين ليس عاطفة عابرة." }, en:{title:"Sheikh Belal Assaad", role:"Preacher and Lecturer", up:"Holds a degree in Sharia and Da'wah from Lebanon.", da:"One of the prominent preachers in Australia.", works:["<strong>Lectures and Sermons.</strong>"], quote:"Religion is not a passing emotion." } } },


    { id:"adnaan", initials:"ع.م", meta:{ar:"1980s | بريطانيا",en:"1980s | UK",fr:"1980s | Royaume-Uni",es:"1980s | Reino Unido"}, tags:{ar:["الاقتصاد"],en:["Economics"],fr:["Économie"],es:["Economía"]}, platforms:["YouTube","Instagram"], series:{ar:["التزكية"],en:["Spirituality"]}, tr:{ ar:{title:"الشيخ عدنان منك", role:"عالم إسلامي", up:"وُلد الشيخ عدنان منك في إنجلترا ونشأ في زيمبابوي ضمن أسرة علمية ودعوية معروفة، وهو ابن شقيق المفتي إسماعيل منك. تلقى تعليمه المبكر في زيمبابوي، ثم التحق بالجامعة الإسلامية بالمدينة المنورة حيث درس اللغة العربية والعلوم الشرعية.<br><br>حصل على درجة البكالوريوس في الشريعة من الجامعة الإسلامية بالمدينة المنورة، ثم تابع دراساته العليا فنال درجة الماجستير في الاقتصاد والتمويل الإسلامي. وقد جمع هذا المسار بين التأصيل الشرعي والمعرفة المعاصرة في المجالات الاقتصادية، مما أضاف بُعدًا تخصصيًا إلى نشاطه الدعوي والعلمي.", da:"يعمل داعية ومحاضرًا إسلاميًا في المملكة المتحدة وخارجها، ويشارك في المؤتمرات والبرامج الدعوية والتربوية الموجهة للشباب والأسر. يركز في دروسه على التزكية، والأخلاق، وبناء الشخصية المسلمة، إلى جانب موضوعات الوعي المالي والاقتصاد الإسلامي من منظور شرعي.<br><br>ينشر محتواه عبر المنصات الرقمية ومحاضراته المرئية، ويحرص على تقديم خطاب هادئ عملي يجمع بين الموعظة الحسنة والفائدة التطبيقية. ويُعرف بأسلوبه القريب من الناس واهتمامه بقضايا المسلمين في الغرب، مسهمًا في تعزيز القيم الإيمانية والاتزان في الحياة المعاصرة.", works:["<strong>محاضرات.</strong>"], quote:"الامتنان ليس مجرد كلمة." }, en:{title:"Sheikh Adnaan Menk", role:"Islamic Scholar", up:"Born in England and raised in Zimbabwe.", da:"One of the prominent preachers in the UK.", works:["<strong>Lectures.</strong>"], quote:"Gratitude is not just a word." } } },


    { id:"yahya", initials:"ي.ر", meta:{ar:"1990s | بريطانيا",en:"1990s | UK",fr:"1990s | Royaume-Uni",es:"1990s | Reino Unido"}, tags:{ar:["القرآن"],en:["Quran"],fr:["Coran"],es:["Corán"]}, platforms:["YouTube","Instagram","TikTok"], series:{ar:["تلاوات"],en:["Recitations"]}, tr:{ ar:{title:"الأستاذ يحيى الرعابي", role:"معلم إسلامي ومقرئ", up:"وُلد الأستاذ يحيى الرعبي في الدنمارك ونشأ في بيئة أوروبية، ثم انتقل إلى المملكة المتحدة حيث استقر وواصل مسيرته التعليمية والدعوية. أتم حفظ القرآن الكريم في سن مبكرة، وتلقى تعليمًا في العلوم الشرعية واللغة العربية على أيدي معلمين ومشايخ متخصصين.<br><br>اشتغل بتعليم القرآن وتحفيظه، وطوّر أدواته في التجويد والتربية الإيمانية، مع اهتمام خاص بمخاطبة الناشئة والشباب في المجتمعات الغربية. وقد ساعده إتقانه للغات وثقافات متعددة على التواصل الفعال مع جمهور متنوع الخلفيات.", da:"يُعرف بوصفه معلمًا للقرآن ومقرئًا ومحاضرًا في برامج إيمانية وتربوية، ويشارك في دورات ومخيمات وأنشطة شبابية في المملكة المتحدة وخارجها. يركز في عمله على ربط القلوب بالقرآن الكريم، وتعليم التلاوة والتدبر، وغرس القيم والأخلاق الإسلامية.<br><br>ينشر تلاواته ودروسه ومقاطع التوجيه عبر منصات التواصل الاجتماعي، حيث لاقت مشاركاته قبولًا واسعًا لدى الشباب والأسر. ويتميز أسلوبه بالجمع بين جمال الأداء القرآني والرسالة التربوية العملية، داعيًا إلى جعل القرآن منهاج حياة ومصدرًا للهداية والسكينة.", works:["<strong>تلاوات قرآنية.</strong>"], quote:"القرآن إذا دخل القلب، غيّر صاحبه." }, en:{title:"Ustadh Yahya Raaby", role:"Islamic Teacher and Reciter", up:"Born in Denmark and moved to the UK.", da:"One of the prominent teachers in the UK.", works:["<strong>Quranic Recitations.</strong>"], quote:"When the Quran enters the heart, it changes its owner." } } },


    { id:"abdelkafy", initials:"ع.ع", meta:{ar:"1951 | مصر",en:"1951 | Egypt",fr:"1951 | Égypte",es:"1951 | Egipto"}, tags:{ar:["الإعجاز العلمي"],en:["Scientific Miracles"],fr:["Miracles Scientifiques"],es:["Milagros Científicos"]}, platforms:["YouTube","Facebook"], series:{ar:["الإعجاز العلمي"],en:["Scientific Miracles"]}, tr:{ ar:{title:"فضيلة الشيخ الدكتور عمر عبد الكافي", role:"داعية", up:"وُلد الشيخ الدكتور عمر عبد الكافي في محافظة المنيا بصعيد مصر عام 1951م، ونشأ في بيئة ريفية محافظة. درس في كلية الزراعة بجامعة المنيا وتخرّج فيها، ثم اتجه إلى العمل الدعوي والاهتمام بالعلوم الشرعية، فجمع بين تكوينه الأكاديمي ودراسته للقرآن والسنة.<br><br>حفظ أجزاء كبيرة من القرآن الكريم واهتم بتدبر آياته، ولا سيما ما يتعلق بالكون والإنسان والحياة. وقد أسهمت خلفيته العلمية في الزراعة والعلوم الطبيعية في صقل اهتمامه بموضوعات الإعجاز والربط بين الآيات الكونية والقرآنية.", da:"اشتهر على نطاق واسع في العالم العربي ببرامجه ومحاضراته التلفزيونية والمرئية التي تناولت قضايا الإيمان والأخلاق والإعجاز العلمي في القرآن والسنة. قدّم سلاسل وبرامج عديدة عُرضت على قنوات فضائية مختلفة، وحظيت بمتابعة جماهيرية كبيرة لعقود.<br><br>يركز في خطابه على تربية النفس، وتقوية الصلة بالله، وتقديم القدوة الحسنة، مع أسلوب وعظي قصصي قريب من الناس. وأسهمت رحلاته الدعوية ومحاضراته داخل مصر وخارجها في نشر الوعي الديني والأخلاقي، وجعلته من الوجوه الدعوية المعروفة لدى أجيال متعددة من المشاهدين.", works:["<strong>موسوعة الإعجاز العلمي.</strong>"], quote:"العلم الصحيح يزيد المؤمن إيماناً." }, en:{title:"Sheikh Dr. Omar Abdelkafy", role:"Preacher", up:"Born in Minya, Egypt in 1951.", da:"One of the prominent preachers in the Arab world.", works:["<strong>Encyclopedia of Scientific Miracles.</strong>"], quote:"Correct science increases a believer's faith." } } },
    { id:"huwaini", initials:"أ.ح", meta:{ar:"1956–2025 | مصر",en:"1956–2025 | Egypt",fr:"1956–2025 | Égypte",es:"1956–2025 | Egipto"}, tags:{ar:["الحديث","الفقه الشافعي"],en:["Hadith","Shafi'i Fiqh"],fr:["Hadith","Fiqh Chaféite"],es:["Hadiz","Fiqh Shafií"]}, platforms:["YouTube","Facebook"], series:{ar:["فضفضة","أصداف اللؤلؤ"],en:["Fadfada","Asdaf al-Lu'lu'"]}, tr:{ ar:{title:"فضيلة الشيخ أبو إسحاق الحويني", role:"محدّث وداعية مصري", up:"وُلد الشيخ أبو إسحاق الحويني (حجازي محمد يوسف شريف) يوم 10 يونيو 1956م في قرية حوِين بمحافظة كفر الشيخ في مصر. تخرّج في كلية الألسن بجامعة عين شمس بقسم اللغة الإسبانية بترتيب متقدم، غير أن شغفه بالعلم الشرعي غلب عليه منذ وقت مبكر، فبدأ رحلته في طلب العلم على يد علماء ومشايخ بلده.<br><br>تلقى القرآن الكريم على خاله الشيخ عبد الحي زيان، ودرس على الشيخ محمد نجيب المطيعي، ثم رحل إلى الأردن والسعودية حيث لازم الشيخ المحدّث محمد ناصر الدين الألباني وتأثر بمنهجه في تحقيق الأحاديث وتمييز صحيحها من ضعيفها. كما حضر دروس عدد من كبار العلماء مثل الشيخ عبد العزيز بن باز والشيخ محمد بن عثيمين والشيخ عبد الله بن جبرين، فاستفاد من مدرستهم الحديثية والفقهية.", da:"يُعد من أبرز علماء الحديث والدعاة في مصر والعالم العربي في العقود الأخيرة، واشتهر بعنايته بنشر السنة النبوية والتحذير من البدع والخرافات. تولّى الخطابة وإلقاء الدروس في مساجد كفر الشيخ، وقدّم برامج ودروسًا علمية عبر القنوات الفضائية والمنصات الرقمية، من أشهرها برنامج «فضفضة».<br><br>خلّف إنتاجًا علميًا ودعويًا واسعًا في تحقيق الأحاديث وشرحها والتربية على منهج أهل السنة والجماعة، مع اهتمام بالفقه الشافعي والآداب الشرعية. وقد أثّر خطابه في شريحة واسعة من طلاب العلم ومحبي السنة، وتوفي في الدوحة يوم 17 مارس 2025م بعد مسيرة طويلة في التعليم والدعوة، تاركًا أثرًا علميًا ودعويًا ممتدًا.", works:["<strong>فصل الخطاب بنقد المغني عن الحفظ والكتاب</strong> (1985)","<strong>الانشراح في آداب النكاح</strong> (1987)","<strong>النافلة في الأحاديث الضعيفة والباطلة</strong> (1988)"], quote:"دراستي لكتاب «السلسلة الضعيفة» مدة سنتين أيام الجامعة كانت أعظم فائدة من كل سني التحصيل العلمي الأخرى." }, en:{title:"Sheikh Abu Ishaq al-Huwaini", role:"Egyptian Hadith scholar and preacher", up:"Born on 10 June 1956 in the village of Huwain, Kafr El-Sheikh Governorate, Egypt. He graduated from the Faculty of Al-Alsun at Ain Shams University (Spanish Department) with honors, then pursued Islamic studies: he learned the Quran from his maternal uncle Abd al-Hayy Zayyan, studied under Sheikh Muhammad Najib al-Muti'i, and traveled to Jordan and Saudi Arabia, where he studied closely with Sheikh Muhammad Nasir al-Din al-Albani and was influenced by his works and hadith verifications. He also attended the lessons of Ibn Baz, Ibn Uthaymeen, Ibn Jibrin and Abdullah ibn Qu'ud.", da:"He is considered one of the most prominent Hadith scholars and preachers in contemporary Egypt. He delivered two Friday sermons a month at the Sheikh al-Islam Mosque in his hometown and a weekly lecture at the Ibn Taymiyyah Mosque in Kafr El-Sheikh. He presented the program 'Fadfada' on Al-Nas TV and appeared on Al-Hekma and Al-Rahma channels, and supervised Al-Nada channel. He died in Doha on 17 Ramadan 1446 AH (17 March 2025) and was buried in Mesaimeer Cemetery.", works:["<strong>Fasl al-Khitab: A Critique of al-Mughni</strong> (1985)","<strong>Al-Inshirah fi Adab al-Nikah</strong> (1987)","<strong>Al-Nafila fi al-Ahadith al-Da'ifa wa al-Batila</strong> (1988)"], quote:"My study of al-Albani's 'Silsilat al-Da'ifa' for two years during university was more beneficial to me than all my other years of study." } } },


    { id:"yaqoubi", initials:"م.ي", meta:{ar:"1963 | سوريا",en:"1963 | Syria",fr:"1963 | Syrie",es:"1963 | Siria"}, tags:{ar:["الحديث"],en:["Hadith"],fr:["Hadith"],es:["Hadiz"]}, platforms:["YouTube","Facebook"], series:{ar:["دروس الحديث"],en:["Hadith Lessons"]}, tr:{ ar:{title:"الشيخ الدكتور محمد أبو الهدى اليعقوبي", role:"عالم إسلامي", up:"وُلد الشيخ الدكتور محمد أبو الهدى اليعقوبي في دمشق بسوريا عام 1963م، ونشأ في بيت علم وفضل؛ فوالده الشيخ إبراهيم اليعقوبي وجدّه من علماء الشام المعروفين. تلقى علومه الأولى على يد والده وكبار علماء دمشق، فحفظ قدرًا من القرآن ودرس العربية والفقه والحديث والعقيدة في حلقات العلم التقليدية.<br><br>تابع دراساته الأكاديمية في جامعة دمشق حيث درس الفقه وأصوله، ثم واصل تحصيله العلمي في عدد من المؤسسات والبلدان، وحصل على تدريب متقدم في العلوم الشرعية واللغة العربية. وقد جمع في تكوينه بين الإرث العلمي الشامي الأصيل والانفتاح على البحث الأكاديمي المعاصر.", da:"اشتهر بوصفه عالمًا في الحديث والفقه والتصوف السني، وله نشاط دعوي وتعليمي واسع في سوريا وخارجها. ألقى دروسًا وخطبًا ومحاضرات في مساجد ومراكز علمية ومؤتمرات دولية، وشارك في برامج حوارية وتعليمية تناولت قضايا العقيدة والسلوك والاجتماع الإسلامي.<br><br>يُعرف بخطابه الذي يدعو إلى الاعتدال والرحمة وصيانة السلم المجتمعي، مع التأكيد على المنهج العلمي في طلب العلم والتحقق. وله مؤلفات ودروس مطولة في علوم الحديث والسيرة والفقه، وأسهم في تعليم أجيال من الطلبة داخل الشام وفي بلدان المهجر عبر الدروس المباشرة والمنصات الرقمية.", works:["<strong>مؤلفات في الحديث.</strong>"], quote:"العلم النافع هو الذي يزيدك تواضعاً." }, en:{title:"Sheikh Dr. Muhammad Abu al-Huda al-Yaqoubi", role:"Islamic Scholar", up:"Born in Syria in 1963.", da:"One of the prominent scholars in Syria.", works:["<strong>Books on Hadith.</strong>"], quote:"Beneficial knowledge is what increases your humility." } } },


    { id:"benhamza", initials:"م.ب", meta:{ar:"1949 | المغرب",en:"1949 | Morocco",fr:"1949 | Maroc",es:"1949 | Marruecos"}, tags:{ar:["الفقه المالكي","الدراسات الإسلامية"],en:["Maliki Fiqh","Islamic Studies"],fr:["Fiqh Malékite","Études Islamiques"],es:["Fiqh Malikí","Estudios Islámicos"]}, platforms:["YouTube","Website"], series:{ar:["الدروس الحسنية الرمضانية","برامج الفتوى"],en:["Ramadan Hassanian Lectures","Fatwa Programs"]}, tr:{ ar:{title:"العلامة مصطفى بن حمزة", role:"عالم دين وباحث وأكاديمي، رئيس المجلس العلمي الجهوي لجهة الشرق", up:"وُلد العلامة مصطفى بن حمزة في مدينة وجدة بالمغرب يوم 17 يوليوز 1949م (21 رمضان 1368هـ). تلقى تعليمه الأولي في مسقط رأسه، ثم انتقل إلى طلب العلم في كبريات المؤسسات المغربية، فحصل على الإجازة في الشريعة من كلية الشريعة بفاس (جامعة القرويين)، والإجازة في الأدب العربي من كلية الآداب بالرباط (جامعة محمد الخامس).<br><br>واصل دراساته العليا فنال دبلوم الدراسات العليا من دار الحديث الحسنية وجامعة محمد الخامس، ثم تُوّج مساره العلمي بالحصول على الدكتوراه الدولة من جامعة محمد الأول بوجدة. وقد منحته هذه الرحلة الأكاديمية الطويلة تكوينًا راسخًا يجمع بين علوم الشريعة وأصولها واللغة العربية وآدابها.", da:"تبوّأ مكانة علمية ومؤسسية بارزة، حيث يشغل منصب رئيس المجلس العلمي الجهوي لجهة الشرق بالمغرب، وهو عضو في المجلس العلمي الأعلى ومؤسسة محمد السادس للعلماء الأفارقة ومجلس حكماء المسلمين. كما تولّى إدارة معهد البعث الإسلامي للعلوم الشرعية بوجدة وعمل أستاذًا للتعليم العالي بجامعة محمد الأول.<br><br>أسهم في البحث العلمي والتأليف في الفقه المالكي واللغة العربية والقضايا الاجتماعية، وشارك في اللجان العلمية والاستشارية، ومن أبرز جهوده مشاركته في اللجنة الملكية الاستشارية لمراجعة مدونة الأسرة. عُرف أيضًا بمبادراته الخيرية والاجتماعية في الجهة الشرقية، وبخطاب علمي معتدل يجمع بين الأصالة والانفتاح على قضايا العصر.", works:["<strong>حقوق المعوقين في الإسلام</strong> (1993): دراسة رائدة تبرز عناية التشريع الإسلامي بذوي الاحتياجات الخاصة وحفظ كرامتهم.","<strong>نظرية العامل في النحو العربي</strong> (2004): بحث لغوي أكاديمي يتناول أصول التقعيد النحوي.","<strong>شخصية الفقه المالكي:</strong> كتاب يوضح خصائص المذهب المالكي ومرونته في مراعاة المصالح والأعراف.","<strong>الأسس الثقافية لمنع تطبيق الشريعة:</strong> مؤلف يناقش الإشكالات الفكرية والثقافية المرتبطة بتنزيل الأحكام الشرعية."] }, en:{title:"Allama Mustapha Ben Hamza", role:"Islamic scholar, researcher and academic; President of the Regional Scientific Council of the Oriental Region", up:"Born in Oujda on 17 July 1949 (21 Ramadan 1368 AH). He received his early education in his hometown, then studied at major Moroccan universities, combining traditional Islamic training with Arabic literature. He holds a licentiate in Sharia from the Faculty of Sharia in Fez (Al-Qarawiyyin University), a licentiate in Arabic Literature from the Faculty of Letters in Rabat (Mohammed V University), a higher studies diploma from Dar al-Hadith al-Hassania and Mohammed V University, and a State Doctorate from Mohammed First University in Oujda.", da:"He is President of the Regional Scientific Council of the Oriental Region and a member of Morocco's Supreme Scientific Council, the Mohammed VI Foundation for African Ulema, and the Muslim Council of Elders. He directs the Institute of Islamic Revival for Sharia Sciences in Oujda and is a former professor of higher education at Mohammed First University. He took part in the Royal Advisory Committee for the revision of the Family Code and is known for his charitable and social initiatives in the Oriental Region. King Mohammed VI awarded him the Alawite Order of Commander in 2007.", works:["<strong>Rights of Persons with Disabilities in Islam</strong> (1993): A pioneering study highlighting Islamic law's care for people with special needs and preservation of their dignity.","<strong>The Theory of the Operator in Arabic Grammar</strong> (2004): An academic linguistic study of the foundations of grammatical rules.","<strong>The Character of Maliki Fiqh:</strong> A book explaining the features of the Maliki school and its flexibility in considering interests and customs.","<strong>The Cultural Foundations Preventing the Application of Sharia:</strong> A work discussing the intellectual and cultural issues related to implementing Islamic rulings."] } } },


    { id:"philips", initials:"ب.ف", meta:{ar:"1947 | كندا",en:"1947 | Canada",fr:"1947 | Canada",es:"1947 | Canadá"}, tags:{ar:["العقيدة"],en:["Aqeedah"],fr:["Aqidah"],es:["Aqidah"]}, platforms:["YouTube","Facebook"], series:{ar:["دورات العقيدة"],en:["Aqeedah Courses"]}, tr:{ ar:{title:"الدكتور بلال فيليبس", role:"عالم إسلامي", up:"وُلد الدكتور بلال فيليبس في جامايكا عام 1947م ونشأ في كندا حيث تلقى تعليمه العام. اعتنق الإسلام عام 1972م، ثم سافر إلى المملكة العربية السعودية لطلب العلم الشرعي، فالتحق بالجامعة الإسلامية بالمدينة المنورة.<br><br>حصل على درجة البكالوريوس في أصول الدين من كلية الدعوة وأصول الدين بالجامعة الإسلامية بالمدينة المنورة، ثم نال درجة الماجستير في العقيدة من كلية الشريعة بجامعة الملك سعود بالرياض، وأكمل الدكتوراه في العقيدة الإسلامية من جامعة ويلز في المملكة المتحدة. وقد شكّل هذا المسار الأكاديمي المتدرج أساسًا راسخًا لتخصصه في العقيدة والتربية الإسلامية.", da:"أسس الجامعة الإسلامية المفتوحة (International Open University)، وهي مؤسسة تعليمية تهدف إلى إتاحة التعليم الإسلامي العالي عن بُعد لطلاب من مختلف أنحاء العالم بتكاليف ميسرة. كما عمل محاضرًا وأستاذًا في جامعات ومراكز إسلامية في عدة دول، وشارك في برامج تلفزيونية ودعوية.<br><br>ألّف كتبًا ومقررات دراسية في العقيدة والفقه والثقافة الإسلامية تُدرَّس في برامج أكاديمية ودعوية، واشتهر بجهوده في نشر التعليم الشرعي المنهجي باللغة الإنجليزية. وتميز نشاطه بالتركيز على التأسيس العقدي الصحيح، وتصحيح المفاهيم، وتيسير الوصول إلى العلم الشرعي الموثوق للمسلمين في الغرب والبلدان غير العربية.", works:["<strong>مؤلفات وترجمات.</strong>"], quote:"العلم الشرعي يجب أن يكون في متناول كل مسلم." }, en:{title:"Dr. Bilal Philips", role:"Islamic Scholar", up:"Born in Jamaica in 1947.", da:"Founder of the International Open University.", works:["<strong>Books and Translations.</strong>"], quote:"Islamic knowledge should be accessible to every Muslim." } } },


    { id:"siraj", initials:"س.و", meta:{ar:"1950 | أمريكا",en:"1950 | USA",fr:"1950 | États-Unis",es:"1950 | EE.UU."}, tags:{ar:["الإصلاح"],en:["Reform"],fr:["Réforme"],es:["Reforma"]}, platforms:["YouTube","Facebook"], series:{ar:["خطب الجمعة"],en:["Friday Sermons"]}, tr:{ ar:{title:"الإمام سراج وهاج", role:"إمام مسجد", up:"وُلد الإمام سراج وهاج (جيفري كيرس) في بروكلين بنيويورك عام 1950م، ونشأ في الولايات المتحدة. اعتنق الإسلام عام 1969م بعد مسيرة بحث روحي، ثم التوجّه إلى طلب العلم الشرعي لتعميق فهمه للدين.<br><br>سافر إلى المملكة العربية السعودية حيث درس في جامعة أم القرى بمكة المكرمة، وتلقى علومًا في الشريعة واللغة العربية. وقد أكسبه هذا الجمع بين التجربة الأمريكية والتكوين الشرعي في مكة رؤية خاصة لقضايا المسلمين في المجتمعات الغربية.", da:"يُعد إمام مسجد التقوى في بروكلين بنيويورك، وأحد أبرز القيادات الإسلامية والدعوية في الولايات المتحدة منذ عقود. اشتهر بخطبه المؤثرة في الإصلاح الاجتماعي، ومكافحة الجريمة والمخدرات، وبناء المجتمع المسلم، والدعوة إلى القيم الأخلاقية والعدالة.<br><br>شارك في تأسيس وقيادة مبادرات ومؤسسات إسلامية ومجتمعية، وأسهم في الحوار بين الأديان والجهود المدنية في أمريكا. وتميز خطابه بالتركيز على المسؤولية الفردية والجماعية، وخدمة المجتمع، والتمسك بالهوية الإسلامية مع الإيجابية في الانخراط المجتمعي، مما جعله صوتًا مؤثرًا في الخطاب الإسلامي الأمريكي.", works:["<strong>خطب ومحاضرات.</strong>"], quote:"الإسلام ليس مجرد عبادة فردية." }, en:{title:"Imam Siraj Wahhaj", role:"Imam", up:"Born in Brooklyn, NY in 1950.", da:"One of the most prominent Muslim leaders in the USA.", works:["<strong>Sermons and Lectures.</strong>"], quote:"Islam is not just individual worship." } } },

/* =====================================================================
   3) Logic & Rendering
   ===================================================================== */
let currentLang = localStorage.getItem('dawa-lang') || 'ar';
let currentTheme = localStorage.getItem('dawa-theme') || (window.matchMedia("(prefers-color-scheme: dark)").matches ? 'dark' : 'light');


const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');
const countEl = document.getElementById('count');
const copyBtn = document.getElementById('copyNames');
const copyLabel = document.getElementById('copyNamesLabel');
const langBtns = document.querySelectorAll('.lang-btn');


// Helper: Fallback to English if FR/ES is missing, then Arabic
function getT(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getArr(scholar, field) {
  const langData = scholar.tr[currentLang] || scholar.tr['en'] || scholar.tr['ar'];
  return langData[field] || scholar.tr['en'][field] || scholar.tr['ar'][field];
}
function getMeta(scholar) { return scholar.meta[currentLang] || scholar.meta['en']; }
function getTags(scholar) { return scholar.tags[currentLang] || scholar.tags['en']; }
function getSeries(scholar) { return scholar.series[currentLang] || scholar.series['en']; }


// Smart Links
function getPlatformURL(platform, name) {
  const q = encodeURIComponent(name);
  const p = platform.toLowerCase();
  if (p.includes('youtube')) return `https://www.youtube.com/results?search_query=${q}`;
  if (p.includes('facebook')) return `https://www.facebook.com/search/top?q=${q}`;
  if (p.includes('instagram')) return `https://www.instagram.com/explore/search/keyword/?q=${q}`;
  if (p.includes('twitter')) return `https://twitter.com/search?q=${q}&f=user`;
  if (p.includes('telegram')) return `https://www.google.com/search?q=site%3At.me+${q}`;
  if (p.includes('tiktok')) return `https://www.tiktok.com/search?q=${q}`;
  if (p.includes('soundcloud')) return `https://soundcloud.com/search?q=${q}`;
  if (p.includes('snapchat')) return `https://www.snapchat.com/add/${q}`;
  if (p.includes('website')) return `https://www.google.com/search?q=${q}+الموقع+الرسمي`;
  return `https://www.google.com/search?q=${q}+${encodeURIComponent(platform)}`;
}
function getSeriesURL(seriesName, scholarName) {
  const q = encodeURIComponent(`"${seriesName}" ${scholarName}`);
  return `https://www.youtube.com/results?search_query=${q}`;
}


// Render Card
const PHOTO_IDS = new Set(["othman","said","ayman","eyad","menk","omar","yasir","nouman","zakir","hamza","tariq","ahmed","amri","nafi","belal","adnaan","yahya","abdelkafy","huwaini","yaqoubi","benhamza","philips","siraj","suhaib","masood","ourayfi","nabil"]);

function cardHTML(s) {
  const name = getT(s, 'title'); // Use title for search links
  const platforms = s.platforms.map(p => `<li><a href="${getPlatformURL(p, name)}" target="_blank" rel="noopener noreferrer" class="pill">${p}</a></li>`).join("");
  const series = getSeries(s).map(x => `<li><a href="${getSeriesURL(x, name)}" target="_blank" rel="noopener noreferrer" class="series-list__item">${x}</a></li>`).join("");
  const works = getArr(s, 'works').map(w => `<li class="works-list__item">${w}</li>`).join("");
  const tags = getTags(s).map(t => `<span class="tag">${t}</span>`).join("");
  const quote = getT(s, 'quote');
  const photo = PHOTO_IDS.has(s.id) ? `<img src="pictures/${s.id}.jpg" alt="" loading="lazy" decoding="async">` : "";
  
  return `
  <article class="scholar-card" data-search="${(name + ' ' + getT(s,'role') + ' ' + getTags(s).join(' ') + ' ' + s.platforms.join(' ')).toLowerCase()}">
    <header class="scholar-card__head">
      <div class="scholar-card__avatar"><span>${s.initials}</span>${photo}</div>
      <div class="scholar-card__ident">
        <h2 class="scholar-card__title">${name}</h2>
        <p class="scholar-card__meta">${getMeta(s)}</p>
        <p class="scholar-card__role">${getT(s, 'role')}</p>
      </div>
    </header>
    <div class="scholar-card__tags">${tags}</div>
    <div class="scholar-card__body">
      <p>${getT(s, 'up')}</p>
      <p>${getT(s, 'da')}</p>
    </div>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].platforms}</h3>
      <ul class="pill-list">${platforms}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].series}</h3>
      <ul class="series-list">${series}</ul>
    </section>
    <section class="scholar-card__block">
      <h3 class="scholar-card__label">${UI[currentLang].works}</h3>
      <ul class="works-list">${works}</ul>
    </section>
    ${quote ? `<blockquote class="scholar-card__quote">${quote}</blockquote>` : ''}
  </article>`;
}


// Main Render
function render() {
  // Set Direction & Lang
  document.body.dir = UI[currentLang].dir;
  document.documentElement.dir = UI[currentLang].dir;
  document.documentElement.lang = currentLang;
  
  // Update UI Text
  document.getElementById('ui-eyebrow').textContent = UI[currentLang].eyebrow;
  document.getElementById('ui-title').textContent = UI[currentLang].title;
  document.getElementById('ui-lede').textContent = UI[currentLang].lede;
  searchInput.placeholder = UI[currentLang].search;
  noResults.textContent = UI[currentLang].noResults;
  copyLabel.textContent = UI[currentLang].copyNames;
  copyBtn.classList.remove('is-copied');
  clearTimeout(copyBtn._copyTimer);
  
  // Update Buttons
  langBtns.forEach(btn => {
    const active = btn.dataset.lang === currentLang;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });


  // Render Grid
  grid.innerHTML = scholars.map(cardHTML).join("");
  
  // Re-apply search filter
  searchInput.dispatchEvent(new Event('input'));
}


// Search Logic
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  let visible = 0;
  [...grid.children].forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.style.display = match ? "" : "none";
    if (match) visible++;
  });
  noResults.classList.toggle('is-visible', visible === 0);
  countEl.textContent = q ? `${visible} / ${scholars.length}` : scholars.length;
});


// Lang Switch
langBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    localStorage.setItem('dawa-lang', currentLang);
    render();
  });
});


// Copy all names
async function copyScholarNames() {
  const names = scholars.map((s, i) => `${i + 1}. ${getT(s, 'title')}`).join('\n');
  let ok = false;
  try {
    await navigator.clipboard.writeText(names);
    ok = true;
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = names;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    ok = document.execCommand('copy');
    ta.remove();
  }
  if (!ok) return;
  copyLabel.textContent = UI[currentLang].copied;
  copyBtn.classList.add('is-copied');
  clearTimeout(copyBtn._copyTimer);
  copyBtn._copyTimer = setTimeout(() => {
    copyLabel.textContent = UI[currentLang].copyNames;
    copyBtn.classList.remove('is-copied');
  }, 2000);
}
copyBtn.addEventListener('click', copyScholarNames);


// Theme Logic
const themeToggle = document.getElementById('themeToggle');
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dawa-theme', currentTheme);
  applyTheme();
});


// Init
applyTheme();
render();
</script>
