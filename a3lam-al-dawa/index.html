 da'wa a través de conferencias, debates y programas, centrada en afianzar un enfoque académico equilibrado de la creencia."}},{"n":"26","name":{"ar":"الشيخ أبو المنتصر البلوشي","en":"Sheikh Abu al-Muntaser al-Balushi","fr":"Sheikh Abu al-Muntaser al-Balushi","es":"Sheikh Abu al-Muntaser al-Balushi"},"website":"","tag":{"ar":"الفرق والملل","en":"Sects and Creeds","fr":"Sectes et confessions","es":"Sectas y confesiones"},"desc":{"ar":"الشيخ أبو المنتصر البلوشي داعية ومناظر عُماني وُلد في سبعينيات القرن العشرين في سلطنة عُمان، اهتم بدراسة الفرق والمذاهب والرد على الشبهات المثارة حول الإسلام. عُرف بنشاطه في المناظرات والحوارات الدينية، وبحرصه على تتبع المسائل الخلافية وتحليلها.\n\nيقدّم عبر دروسه ومشاركاته المرئية محتوى يركز على قضايا العقيدة والتعريف بالمنهج الإسلامي في فهم النصوص، مع اعتماد على الاستدلال والنقل. ويسعى في خطابه إلى توضيح المفاهيم وتصحيح التصورات الخاطئة، مخاطبًا جمهورًا واسعًا من المهتمين بقضايا الفكر والدين.","en":"Sheikh Abu al-Muntaser al-Balushi is an Omani preacher and debater, born in Oman in the 1970s, interested in the study of sects and schools of thought and in responding to doubts raised about Islam. He is known for his activity in religious debates and dialogues and for his attention to examining and analyzing contested issues.\n\nThrough his lessons and video contributions he presents content focused on matters of creed and on explaining the Islamic methodology for understanding texts, relying on evidence and citation. His discourse seeks to clarify concepts and correct misconceptions, addressing a wide audience interested in questions of thought and religion.","fr":"Le cheikh Abu al-Muntaser al-Balushi est un prédicateur et débatteur omanais, né à Oman dans les années 1970, qui s’intéresse à l’étude des sectes et des courants ainsi qu’aux réponses aux objections soulevées contre l’islam. Il est connu pour son activité dans les débats et dialogues religieux et pour son souci d’examiner et d’analyser les questions controversées.\n\nÀ travers ses cours et interventions vidéo, il propose des contenus centrés sur les questions de croyance et sur l’explication de la méthodologie islamique de compréhension des textes, en s’appuyant sur les preuves et les références. Son discours vise à clarifier les concepts et à corriger les idées erronées, s’adressant à un large public intéressé par les questions de pensée et de religion.","es":"El sheij Abu al-Muntaser al-Balushi es un predicador y polemista omaní, nacido en Omán en la década de 1970, interesado en el estudio de sectas y corrientes y en la respuesta a las dudas planteadas sobre el islam. Es conocido por su actividad en debates y diálogos religiosos y por su atención al examen y análisis de las cuestiones controvertidas.\n\nA través de sus lecciones y aportaciones en vídeo presenta contenidos centrados en cuestiones de creencia y en la explicación de la metodología islámica para comprender los textos, apoyándose en pruebas y citas. Su discurso busca aclarar conceptos y corregir ideas erróneas, dirigiéndose a un amplio público interesado en cuestiones de pensamiento y religión."}},{"n":"27","name":{"ar":"الشيخ أشرف غريب","en":"Sheikh Ashraf Gharib","fr":"Cheikh Achraf Gharib","es":"Sheij Ashraf Gharib"},"website":"","tag":{"ar":"ردود ودراسات","en":"responses and studies","fr":"réponses et études","es":"respuestas y estudios"},"desc":{"ar":"الشيخ أشرف غريب باحث وداعية مصري وُلد في سبعينيات القرن العشرين في مصر، اهتم بدراسة العقيدة الإسلامية والردود على الشبهات والطروحات المخالفة. عُرف بجهوده في تقديم دروس ومحاضرات تتناول مسائل الاعتقاد بمنهجية تعليمية واضحة.\n\nيركز في عمله على تحرير المصطلحات وبيان الأدلة الشرعية والعقلية، مع معالجة القضايا الفكرية المعاصرة التي تثير التساؤلات لدى الشباب. ويسعى من خلال محتواه المرئي والمكتوب إلى ترسيخ الفهم الصحيح للعقيدة وتقديم خطاب متوازن يجمع بين الدقة واليسر.","en":"Sheikh Ashraf Gharib is an Egyptian researcher and preacher, born in Egypt in the 1970s, interested in the study of Islamic creed and in responses to doubts and opposing views. He is known for offering lessons and lectures that address matters of belief in a clear educational manner.\n\nHis work focuses on clarifying terminology and presenting scriptural and rational evidence, while engaging with contemporary intellectual issues that raise questions among young people. Through his video and written content he seeks to ground a sound understanding of creed and to offer a balanced discourse that combines precision with accessibility.","fr":"Le cheikh Achraf Gharib est un chercheur et prédicateur égyptien, né en Égypte dans les années 1970, qui s’intéresse à l’étude de la croyance islamique et aux réponses aux doutes et aux thèses opposées. Il est connu pour ses cours et conférences traitant des questions de croyance de manière pédagogique et claire.\n\nSon travail se concentre sur la clarification des termes et la présentation des preuves scripturaires et rationnelles, tout en abordant les questions intellectuelles contemporaines qui suscitent des interrogations chez les jeunes. À travers ses contenus vidéo et écrits, il cherche à ancrer une compréhension juste de la croyance et à proposer un discours équilibré alliant rigueur et accessibilité.","es":"El sheij Ashraf Gharib es un investigador y predicador egipcio, nacido en Egipto en la década de 1970, interesado en el estudio de la creencia islámica y en las respuestas a las dudas y posturas opuestas. Es conocido por ofrecer lecciones y conferencias que abordan cuestiones de fe de manera educativa y clara.\n\nSu trabajo se centra en precisar la terminología y presentar pruebas textuales y racionales, a la vez que aborda cuestiones intelectuales contemporáneas que suscitan preguntas entre los jóvenes. A través de sus contenidos en vídeo y escritos busca afianzar una comprensión correcta de la creencia y ofrecer un discurso equilibrado que combine rigor y accesibilidad."}},{"n":"28","name":{"ar":"الشيخ فراج الصهيبي","en":"Sheikh Faraj Al-Sahibi","fr":"Cheikh Faraj Al-Sahibi","es":"Sheij Faraj Al-Sahibi"},"website":"","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ فراج الصهيبي داعية سعودي وُلد في سبعينيات القرن العشرين في المملكة العربية السعودية، متخصص في العقيدة الإسلامية والرد على الشبهات الفكرية والعقدية. يقدّم دروسًا ومحاضرات تستهدف تثبيت أصول الإيمان وتعزيز اليقين لدى المسلمين.\n\nيعتمد في خطابه على أسلوب مباشر يجمع بين الدليل الشرعي والمعالجة التربوية، مع اهتمام خاص بمخاطبة الشباب وقضاياهم المعاصرة. ويسهم من خلال حضوره الدعوي والإعلامي في نشر الوعي العقدي وتصحيح المفاهيم، داعيًا إلى التمسك بالمنهج العلمي والوسطية.","en":"Sheikh Faraj al-Sahibi is a Saudi preacher, born in Saudi Arabia in the 1970s, specializing in Islamic creed and in responding to intellectual and doctrinal doubts. He delivers lessons and lectures aimed at strengthening the foundations of faith and reinforcing certainty among Muslims.\n\nHis discourse adopts a direct style that combines scriptural evidence with educational guidance, with particular attention to addressing young people and their contemporary concerns. Through his da'wah and media presence he contributes to spreading doctrinal awareness and correcting misconceptions, calling for adherence to a scholarly and balanced methodology.","fr":"Le cheikh Faraj al-Sahibi est un prédicateur saoudien, né en Arabie saoudite dans les années 1970, spécialisé dans la croyance islamique et dans les réponses aux doutes intellectuels et doctrinaux. Il donne des cours et des conférences visant à affermir les fondements de la foi et à renforcer la certitude chez les musulmans.\n\nSon discours adopte un style direct qui associe la preuve scripturaire et l’accompagnement éducatif, avec une attention particulière aux jeunes et à leurs préoccupations contemporaines. Par sa présence dans la da'wa et les médias, il contribue à diffuser la conscience doctrinale et à corriger les idées reçues, en appelant à l’adhésion à une méthodologie savante et équilibrée.","es":"El sheij Faraj al-Sahibi es un predicador saudí, nacido en Arabia Saudita en la década de 1970, especializado en la creencia islámica y en la respuesta a las dudas intelectuales y doctrinales. Imparte lecciones y conferencias orientadas a afianzar los fundamentos de la fe y reforzar la certeza entre los musulmanes.\n\nSu discurso adopta un estilo directo que combina la prueba textual con la orientación educativa, con especial atención a los jóvenes y a sus inquietudes contemporáneas. A través de su presencia en la da'wa y los medios contribuye a difundir la conciencia doctrinal y a corregir conceptos erróneos, llamando a la adhesión a una metodología académica y equilibrada."}},{"n":"29","name":{"ar":"الشيخ د. عمرو نور الدين","en":"al-Sheikh Dr. Amr al-Nour al-Din","fr":"al-Sheikh Dr. Amr al-Nour al-Din","es":"al-Sheikh Dr. Amr al-Nour al-Din"},"website":"","tag":{"ar":"الفكر الإسلامي","en":"Islamic Thought","fr":"Pensée islamique","es":"Pensamiento islámico"},"desc":{"ar":"الدكتور عمرو نور الدين باحث وأكاديمي مصري وُلد في سبعينيات القرن العشرين في مصر، متخصص في الفكر الإسلامي المعاصر وقضاياه المنهجية والمعرفية. يجمع في أعماله بين الدراسة الأكاديمية والاهتمام بقضايا النهضة والهوية والإصلاح الفكري.\n\nيقدّم من خلال كتاباته ومحاضراته قراءات في التراث الإسلامي وفي إشكالات الحداثة، ساعيًا إلى بناء خطاب فكري متجدد يستند إلى الأصول ويستجيب لتحديات العصر. ويهتم في طرحه بتطوير أدوات التفكير النقدي وتعزيز الوعي الحضاري لدى المتلقي.","en":"Dr. Amr al-Nour al-Din is an Egyptian researcher and academic, born in Egypt in the 1970s, specializing in contemporary Islamic thought and its methodological and epistemological issues. His work combines academic study with concern for questions of renewal, identity, and intellectual reform.\n\nThrough his writings and lectures he offers readings of the Islamic heritage and of the challenges of modernity, seeking to develop a renewed intellectual discourse grounded in foundational principles while responding to contemporary challenges. His approach emphasizes developing critical thinking tools and fostering civilizational awareness among audiences.","fr":"Le Dr Amr al-Nour al-Din est un chercheur et universitaire égyptien, né en Égypte dans les années 1970, spécialisé dans la pensée islamique contemporaine et ses questions méthodologiques et épistémologiques. Ses travaux associent l’étude académique et l’intérêt pour les questions de renouveau, d’identité et de réforme intellectuelle.\n\nÀ travers ses écrits et conférences, il propose des lectures du patrimoine islamique et des défis de la modernité, cherchant à élaborer un discours intellectuel renouvelé ancré dans les principes fondateurs tout en répondant aux défis contemporains. Son approche met l’accent sur le développement des outils de pensée critique et le renforcement de la conscience civilisationnelle.","es":"El Dr. Amr al-Nour al-Din es un investigador y académico egipcio, nacido en Egipto en la década de 1970, especializado en el pensamiento islámico contemporáneo y sus cuestiones metodológicas y epistemológicas. Su obra combina el estudio académico con el interés por las cuestiones de renovación, identidad y reforma intelectual.\n\nA través de sus escritos y conferencias ofrece lecturas del patrimonio islámico y de los desafíos de la modernidad, buscando desarrollar un discurso intelectual renovado anclado en los principios fundamentales y capaz de responder a los retos contemporáneos. Su enfoque enfatiza el desarrollo de herramientas de pensamiento crítico y el fomento de la conciencia civilizacional."}},{"n":"30","name":{"ar":"د. حاتم العوني","en":"D. Hatam al-Uni","fr":"D. Hatam al-Uni","es":"D. Hatam al-Uni"},"website":"https://alawny.com/","tag":{"ar":"أصول الفقه","en":"Jurisprudence Principles","fr":"Principes de jurisprudence","es":"Principios de jurisprudencia"},"desc":{"ar":"الدكتور حاتم بن عارف العوني باحث سعودي وُلد عام 1966 في مدينة الطائف بالمملكة العربية السعودية، متخصص في أصول الفقه ومقاصد الشريعة والحديث الشريف. عُرف بكتاباته الأكاديمية المحكمة وباهتمامه بتجديد النظر في المسائل الأصولية والفقهية المعاصرة.\n\nيقدّم دروسًا ومحاضرات وبحوثًا تتناول العلاقة بين النص والمقصد، وتطبيقات القواعد الأصولية في الواقع المعاصر. ويسعى في مشروعه العلمي إلى الجمع بين التأصيل الشرعي والانفتاح على القضايا المستجدة، مع الحرص على الدقة المنهجية والوضوح في العرض.","en":"Dr. Hatem al-Awni is a Saudi researcher, born in 1966 in Taif, Saudi Arabia, specializing in the principles of Islamic jurisprudence (usul al-fiqh), the higher objectives of Islamic law (maqasid al-shari'ah), and Hadith studies. He is known for his rigorous academic writings and for his interest in re-examining contemporary usuli and jurisprudential issues.\n\nHe offers lessons, lectures, and research addressing the relationship between text and objective and the application of usul principles to contemporary realities. His scholarly project seeks to combine sound religious grounding with engagement with emerging issues, while maintaining methodological precision and clarity of presentation.","fr":"Le Dr Hatem al-Awni est un chercheur saoudien, né en 1966 à Taïf en Arabie saoudite, spécialisé dans les fondements du droit musulman (usul al-fiqh), les finalités de la loi islamique (maqasid al-shari'ah) et les études du hadith. Il est connu pour ses écrits académiques rigoureux et pour son intérêt à réexaminer les questions contemporaines d’usul et de jurisprudence.\n\nIl propose des cours, conférences et recherches portant sur la relation entre le texte et l’objectif, ainsi que sur l’application des principes d’usul aux réalités contemporaines. Son projet scientifique vise à conjuguer enracinement religieux solide et ouverture aux questions émergentes, avec un souci constant de rigueur méthodologique et de clarté.","es":"El Dr. Hatem al-Awni es un investigador saudí, nacido en 1966 en Taif (Arabia Saudita), especializado en los fundamentos de la jurisprudencia islámica (usul al-fiqh), los objetivos superiores de la ley islámica (maqasid al-shari'ah) y los estudios de hadiz. Es conocido por sus rigurosos escritos académicos y por su interés en reexaminar cuestiones contemporáneas de usul y jurisprudencia.\n\nOfrece lecciones, conferencias e investigaciones que abordan la relación entre el texto y el objetivo, y la aplicación de los principios de usul a las realidades contemporáneas. Su proyecto académico busca combinar una sólida fundamentación religiosa con la apertura a cuestiones emergentes, manteniendo precisión metodológica y claridad expositiva."}},{"n":"31","name":{"ar":"د. عمرو بسيوني","en":"D. Amr Bayuni","fr":"D. Amr Bayuni","es":"D. Amr Bayuni"},"website":"","tag":{"ar":"مصادر المعرفة","en":"Sources of Knowledge","fr":"Sources du savoir","es":"Fuentes del conocimiento"},"desc":{"ar":"الدكتور عمرو بسيوني باحث مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بالفكر الإسلامي ومصادر المعرفة وقضايا المنهج. يسعى في أعماله إلى دراسة العلاقة بين الوحي والعقل، وبحث الأسس المعرفية التي تقوم عليها الرؤية الإسلامية.\n\nيقدّم محاضرات ومواد فكرية تناقش قضايا الوعي والتجديد والنقد المعرفي، مع التركيز على مخاطبة النخب الشبابية والمهتمين بالشأن الفكري. ويحرص في طرحه على الجمع بين العمق النظري والربط بالقضايا المعاصرة، بلغة تحليلية واضحة.","en":"Dr. Amr Basyouni is an Egyptian researcher, born in Egypt in the 1970s, interested in Islamic thought, sources of knowledge, and methodological questions. His work seeks to examine the relationship between revelation and reason and to explore the epistemological foundations of the Islamic worldview.\n\nHe offers lectures and intellectual materials discussing issues of awareness, renewal, and epistemic critique, with a focus on engaging young intellectuals and those interested in contemporary thought. His approach combines theoretical depth with relevance to contemporary issues, presented in clear analytical language.","fr":"Le Dr Amr Basyouni est un chercheur égyptien, né en Égypte dans les années 1970, qui s’intéresse à la pensée islamique, aux sources de la connaissance et aux questions de méthode. Ses travaux visent à étudier la relation entre révélation et raison et à explorer les fondements épistémologiques de la vision islamique.\n\nIl propose des conférences et des contenus intellectuels abordant les questions de conscience, de renouveau et de critique épistémique, en s’adressant particulièrement aux jeunes intellectuels et aux personnes intéressées par la pensée contemporaine. Son approche associe profondeur théorique et pertinence face aux enjeux actuels, dans un langage analytique clair.","es":"El Dr. Amr Basyouni es un investigador egipcio, nacido en Egipto en la década de 1970, interesado en el pensamiento islámico, las fuentes del conocimiento y las cuestiones metodológicas. Su trabajo busca examinar la relación entre revelación y razón y explorar los fundamentos epistemológicos de la cosmovisión islámica.\n\nOfrece conferencias y materiales intelectuales que abordan cuestiones de conciencia, renovación y crítica epistémica, con especial atención a los jóvenes intelectuales y a quienes se interesan por el pensamiento contemporáneo. Su enfoque combina profundidad teórica y relevancia ante los asuntos actuales, en un lenguaje analítico claro."}},{"n":"32","name":{"ar":"شمس الدين الجزائري","en":"Sun ad-Din al-Aljiri","fr":"Sun ad-Din al-Aljiri","es":"Sun ad-Din al-Aljiri"},"website":"","tag":{"ar":"الدعوة","en":"Da'wah","fr":"Prédication (Da'wa)","es":"Da'wa (predicación)"},"desc":{"ar":"شمس الدين الجزائري داعية وباحث جزائري وُلد في سبعينيات القرن العشرين في الجزائر، نشط في مجالات الدعوة والتعليم والتوجيه الشرعي. اهتم بتقديم دروس وخطب تركز على تزكية النفس وتقويم السلوك وبناء الوعي الديني.\n\nيقدّم محتوى دعويًا وتربويًا يخاطب شرائح مختلفة من المجتمع، مع الحرص على تبسيط المعاني وربطها بواقع الناس اليومي. ويسعى في نشاطه إلى تعزيز القيم الإسلامية الأصيلة ونشر خطاب معتدل يجمع بين العلم والعمل.","en":"Shams al-Din al-Jaza'iri is an Algerian preacher and researcher, born in Algeria in the 1970s, active in the fields of da'wah, education, and religious guidance. He focuses on delivering lessons and sermons centered on spiritual refinement, moral conduct, and building religious awareness.\n\nHe offers da'wah and educational content addressed to diverse segments of society, with care to simplify meanings and connect them to people's daily lives. His work seeks to promote authentic Islamic values and to spread a balanced discourse that combines knowledge with practice.","fr":"Shams al-Din al-Jaza'iri est un prédicateur et chercheur algérien, né en Algérie dans les années 1970, actif dans les domaines de la da'wa, de l’éducation et de l’orientation religieuse. Il se consacre à des cours et sermons axés sur la purification spirituelle, la conduite morale et le développement de la conscience religieuse.\n\nIl propose des contenus de da'wa et d’éducation destinés à différents segments de la société, en veillant à simplifier les notions et à les relier au vécu quotidien. Son activité vise à promouvoir les valeurs islamiques authentiques et à diffuser un discours équilibré alliant savoir et pratique.","es":"Shams al-Din al-Jaza'iri es un predicador e investigador argelino, nacido en Argelia en la década de 1970, activo en los ámbitos de la da'wa, la educación y la orientación religiosa. Se centra en impartir lecciones y sermones orientados a la purificación espiritual, la conducta moral y el desarrollo de la conciencia religiosa.\n\nOfrece contenidos de da'wa y educativos dirigidos a diversos sectores de la sociedad, con el cuidado de simplificar los significados y vincularlos a la vida cotidiana. Su labor busca promover los valores islámicos auténticos y difundir un discurso equilibrado que combine conocimiento y práctica."}},{"n":"33","name":{"ar":"الشيخ د. ياسر قاضي","en":"Sheikh Dr. Yasir Qadhi","fr":"Cheikh Dr Yasir Qadhi","es":"Sheij Dr. Yasir Qadhi"},"website":"https://www.yasirqadhi.com/","tag":{"ar":"عقيدة وفكر إسلامي","en":"Islamic creed and thought","fr":"Croyance et pensée islamique","es":"Creencia y pensamiento islámico"},"desc":{"ar":"الشيخ الدكتور ياسر قاضي عالم وداعية أمريكي من أصل باكستاني، وُلد في 30 يناير 1975 في مدينة هيوستن بولاية تكساس، ونشأ في جدة بالمملكة العربية السعودية. تلقى تكوينًا علميًا مميزًا جمع بين الدراسة في جامعة المدينة المنورة وجامعة ييل، حيث حصل على الدكتوراه في الدراسات الإسلامية.\n\nعُرف بمحاضراته ودروسه في العقيدة والفقه والسيرة والفكر الإسلامي المعاصر، وبقدرته على مخاطبة الجمهور المسلم في الغرب بلغتين العربية والإنجليزية. شغل مناصب تعليمية ودعوية بارزة، وأسهم في تقديم خطاب يجمع بين الأصالة العلمية ومراعاة واقع المسلمين في المجتمعات المعاصرة.","en":"Sheikh Dr. Yasir Qadhi is an American scholar and preacher of Pakistani heritage, born on 30 January 1975 in Houston, Texas, and raised in Jeddah, Saudi Arabia. He received a distinguished academic formation combining studies at the Islamic University of Madinah and at Yale University, where he earned a PhD in Islamic studies.\n\nHe is known for his lectures and courses on creed, jurisprudence, prophetic biography, and contemporary Islamic thought, and for his ability to address Muslim audiences in the West in both Arabic and English. He has held prominent educational and da'wah roles and has contributed to a discourse that combines scholarly authenticity with attention to the lived realities of Muslims in contemporary societies.","fr":"Le cheikh Dr Yasir Qadhi est un savant et prédicateur américain d’origine pakistanaise, né le 30 janvier 1975 à Houston (Texas) et ayant grandi à Djeddah en Arabie saoudite. Il a reçu une formation académique remarquable alliant des études à l’Université islamique de Médine et à l’Université Yale, où il a obtenu un doctorat en études islamiques.\n\nIl est connu pour ses conférences et cours sur la croyance, le droit musulman, la biographie prophétique et la pensée islamique contemporaine, ainsi que pour sa capacité à s’adresser aux publics musulmans d’Occident en arabe et en anglais. Il a occupé des fonctions éducatives et de da'wa importantes et a contribué à un discours qui associe authenticité savante et prise en compte des réalités vécues par les musulmans dans les sociétés contemporaines.","es":"El sheij Dr. Yasir Qadhi es un erudito y predicador estadounidense de origen pakistaní, nacido el 30 de enero de 1975 en Houston (Texas) y criado en Yeda (Arabia Saudita). Recibió una destacada formación académica que combinó estudios en la Universidad Islámica de Medina y en la Universidad de Yale, donde obtuvo un doctorado en estudios islámicos.\n\nEs conocido por sus conferencias y cursos sobre creencia, jurisprudencia, biografía profética y pensamiento islámico contemporáneo, y por su capacidad para dirigirse al público musulmán en Occidente tanto en árabe como en inglés. Ha desempeñado importantes funciones educativas y de da'wa y ha contribuido a un discurso que combina autenticidad académica con atención a las realidades vividas por los musulmanes en las sociedades contemporáneas."},"yt":"https://www.youtube.com/@yasirqadhi"},{"n":"34","name":{"ar":"محمود شعبان","en":"Mahmoud Shaaban","fr":"Mahmoud Shaaban","es":"Mahmoud Shaaban"},"website":"","tag":{"ar":"بلاغة وفكر","en":"Rhetoric and Thought","fr":"Rhétorique et pensée","es":"Retórica y pensamiento"},"desc":{"ar":"الأستاذ محمود شعبان باحث ومربي مصري وُلد في سبعينيات القرن العشرين في مصر، متخصص في البلاغة العربية والفكر الإسلامي. عُرف باهتمامه بالجمع بين جمال اللغة العربية وعمق المعاني القرآنية، وبأسلوبه التعليمي الذي يسعى إلى تقريب علوم البلاغة والفكر إلى جمهور واسع.\n\nيقدّم دروسًا ومحاضرات تركز على الإعجاز البياني للقرآن الكريم، وعلى قراءة النصوص التراثية قراءة معاصرة واعية. ويسهم من خلال إنتاجه العلمي والدعوي في تعزيز الصلة باللغة العربية وبالتراث الإسلامي، مع عناية خاصة بالتربية القيمية وبناء الوعي.","en":"Professor Mahmoud Shaaban is an Egyptian researcher and educator, born in Egypt in the 1970s, specializing in Arabic rhetoric (balagha) and Islamic thought. He is known for bringing together the beauty of the Arabic language and the depth of Qur’anic meanings, and for an educational style that seeks to make the sciences of rhetoric and thought accessible to a wide audience.\n\nHe offers lessons and lectures focused on the rhetorical inimitability of the Qur’an and on reading classical texts with contemporary awareness. Through his scholarly and da'wah work he contributes to strengthening the connection to the Arabic language and Islamic heritage, with particular care for values-based education and the cultivation of awareness.","fr":"Le professeur Mahmoud Chabaan est un chercheur et éducateur égyptien, né en Égypte dans les années 1970, spécialisé en rhétorique arabe (balagha) et en pensée islamique. Il est connu pour son souci d’allier la beauté de la langue arabe à la profondeur des significations coraniques, et pour un style pédagogique qui vise à rendre les sciences de la rhétorique et de la pensée accessibles à un large public.\n\nIl propose des cours et conférences centrés sur l’inimitabilité rhétorique du Coran et sur une lecture contemporaine et réfléchie des textes classiques. Par son travail scientifique et de da'wa, il contribue à renforcer le lien avec la langue arabe et le patrimoine islamique, avec une attention particulière à l’éducation aux valeurs et au développement de la conscience.","es":"El profesor Mahmoud Shaaban es un investigador y educador egipcio, nacido en Egipto en la década de 1970, especializado en retórica árabe (balagha) y pensamiento islámico. Es conocido por su interés en unir la belleza de la lengua árabe con la profundidad de los significados coránicos, y por un estilo educativo que busca acercar las ciencias de la retórica y el pensamiento a un público amplio.\n\nOfrece lecciones y conferencias centradas en la inimitabilidad retórica del Corán y en la lectura contemporánea y consciente de los textos clásicos. A través de su labor académica y de da'wa contribuye a fortalecer el vínculo con la lengua árabe y el patrimonio islámico, con especial atención a la educación en valores y al desarrollo de la conciencia."},"yt":"https://www.youtube.com/@dr.mahmoud_shaban"}];

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}


// ASCII-only helpers (char codes, no Arabic literals or \u escapes in regexes) so copy/paste or editors cannot corrupt them
function norm(s) {
  s = String(s || '').toLowerCase();
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if ((c >= 0x64B && c <= 0x65F) || c === 0x670 || c === 0x640) continue; // tashkeel, tatweel
    if (c === 0x623 || c === 0x625 || c === 0x622 || c === 0x671) c = 0x627;  // alef variants -> alef
    else if (c === 0x649) c = 0x64A;                                          // alef maqsura -> ya
    else if (c === 0x629) c = 0x647;                                          // ta marbuta -> ha
    out += String.fromCharCode(c);
  }
  return out;
}

var TITLES = [
  chars([0x627, 0x644, 0x634, 0x64A, 0x62E]),                 // sheikh

];


function cleanName(name) {
  var core = String(name || '').replace(/\s*\([^)]*\)\s*/g, ' ').replace(/^\s+|\s+$/g, '');
  var changed = true;
  while (changed) {
    changed = false;
    for (var i = 0; i < TITLES.length; i++) {
      if (core.indexOf(TITLES[i]) === 0) {
        core = core.slice(TITLES[i].length).replace(/^\s+/, '');
        changed = true;
        break;
      }
    }
  }
  return core;
}

  var first = core ? core.charAt(0) : '?';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">' +
    '<rect width="128" height="128" fill="#2a2a2a"/>' +
    '<text x="64" y="70" text-anchor="middle" dominant-baseline="middle" ' +
    'font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" fill="#d4af37">' +
    esc(first) + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}


function avatar(name) {
  name = name || '';
  if (!avatarCache[name]) avatarCache[name] = initials(name);
  return avatarCache[name];
}


function photo(s) {
  if (s.img) return s.img;
  return IMG_DIR + s.n + '.' + IMG_EXT;
}


// Global image fallback, invoked by inline onerror= so it is reliable even for
// imgs injected through innerHTML.
window.__fb = function (img) {
  if (!img || img.getAttribute('data-fb')) return;
  img.setAttribute('data-fb', '1');
  img.onerror = null;
  img.style.display = 'none';
};


function render() {
  var gridEl = document.getElementById('grid');
  var searchEl = document.getElementById('search');
  var t = I18N[currentLang];
  var q = norm(searchEl ? searchEl.value.trim() : '');
  var list = [];
  for (var i = 0; i < scholars.length; i++) {
    if (!q || scholars[i]._k.indexOf(q) !== -1) list.push(scholars[i]);
  }
  if (!list.length) {
    gridEl.innerHTML = '<div class="empty">' + esc(t.none) + '</div>';
  } else {
    var html = '';
    for (var j = 0; j < list.length; j++) {
      var s = list[j];
      var nm = L(s.name);
      var dsc = L(s.desc);
      var tg = L(s.tag);
      var qn = encodeURIComponent(cleanName(nm));
      var yt = s.yt || (YT_BASE + qn);
      var web = String(s.website || '').trim();
      if (web && !/^https?:\/\//i.test(web)) web = '';
      var webTag = web ? '<a class="btn website" href="' + esc(web) + '" target="_blank" rel="noopener noreferrer">' + t.site + '</a>' : '';
      var imgTag = (ENABLE_PHOTOS || s.img)
        ? '<img src="' + esc(photo(s)) + '" data-name="' + esc(nm) + '" data-n="' + s.n + '" alt="" width="65" height="65" loading="lazy" decoding="async" onerror="window.__fb&&window.__fb(this)">'
        : '';
      var descHtml = '';
      if (dsc) {
        var parts = String(dsc).split(/\n\n+/);
        for (var pi = 0; pi < parts.length; pi++) {
          if (parts[pi].trim()) descHtml += '<p class="desc" dir="auto">' + esc(parts[pi].trim()).replace(/\n/g, '<br>') + '</p>';
        }
      }
      html += '<article class="card"><div class="card-top">' +
        '<div class="avatar"><span class="mono" aria-hidden="true">' + esc((cleanName(nm) || nm || '?').trim().charAt(0) || '?') + '</span>' + imgTag + '</div>' +
        '<div class="head-info"><div class="row"><h2 class="name" dir="auto">' + esc(nm) + '</h2>' +
        (tg ? '<span class="tag" dir="auto">' + esc(tg) + '</span>' : '') + '</div></div>' +
        (descHtml ? '<div class="desc-wrap">' + descHtml + '</div>' : '') +
        '</div>' +
        '<div class="actions">' +
        '<a class="btn" href="' + esc(yt) + '" target="_blank" rel="noopener noreferrer">' + t.yt + '</a>' + webTag +
        '</div></article>';
    }
    gridEl.innerHTML = html;
  }
  document.getElementById('count').textContent = t.count.replace('{n}', list.length);
}


// 'error' doesn't bubble, so capture as a backstop for any injected image
document.addEventListener('error', function (e) {
  var img = e.target;
  if (img && img.tagName === 'IMG') window.__fb(img);
}, true);




function mark(box, attr, val) {
  var btns = box.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute(attr) === val) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}


function setLang(l) {
  if (!I18N[l]) l = 'ar';
  currentLang = l;
  store('app-lang', l);
  var t = I18N[l];
  document.documentElement.lang = l;
  document.documentElement.dir = t.dir;
  document.title = t.title;
  document.getElementById('title').textContent = t.title;
  document.getElementById('subtitle').textContent = t.sub.replace('{n}', scholars.length);
  document.getElementById('search').placeholder = t.ph;
  document.getElementById('footerText').textContent = t.footer;
  mark(document.getElementById('langs'), 'data-lang', l);
  render();
}


function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  store('app-theme', th);
  mark(document.getElementById('themes'), 'data-theme', th);
  var m = document.querySelector('meta[name="theme-color"]');
  var colors = { dark: '#121212', light: '#f8fafc', sepia: '#f4ecd8' };
  if (m) m.setAttribute('content', colors[th] || '#121212');
}


document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('langs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]');
    if (b) setLang(b.getAttribute('data-lang'));
  });
  document.getElementById('themes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-theme]');
    if (b) setTheme(b.getAttribute('data-theme'));
  });
  var timer;
  document.getElementById('search').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  setTheme(store('app-theme') || 'dark');
  setLang(store('app-lang') || 'ar');
});


if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
