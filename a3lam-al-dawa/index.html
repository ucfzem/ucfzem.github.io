ophone.\n\nIl fut célèbre pour ses débats marquants sur la Bible et l’islam et pour son style oratoire direct dans le domaine des religions comparées. Il laissa un vaste héritage de conférences, d’ouvrages et de débats enregistrés, et son influence continua de toucher les générations suivantes de prédicateurs et de chercheurs jusqu’à son décès en 2005.","es":"El sheij Ahmed Deedat fue un predicador sudafricano, nacido el 1 de julio de 1918 en la localidad de Tadkeshwar en la India británica, que se trasladó a Sudáfrica en su infancia, donde creció y desarrolló su labor de da'wa. Fundó el Islamic Propagation Centre International (IPCI) en Durban y se convirtió en una de las figuras más destacadas de la da'wa en el mundo angloparlante.\n\nFue célebre por sus famosos debates sobre la Biblia y el islam y por su estilo oratorio directo en el ámbito de las religiones comparadas. Dejó un amplio legado de conferencias, libros y debates grabados, y su influencia siguió llegando a generaciones posteriores de predicadores e investigadores hasta su fallecimiento en 2005."}},{"n":"25","name":{"ar":"الشيخ عثمان الخميس","en":"Sheikh Othman Al-Khamis","fr":"Cheikh Othman Al-Khamis","es":"Sheij Othman Al-Khamis"},"website":"https://othmanalkhamees.com/","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ عثمان الخميس داعية وعالم كويتي وُلد في 26 مايو 1962 في الكويت، تخصص في علوم العقيدة والرد على الفرق والمذاهب المخالفة. تلقى تكوينًا شرعيًا في جامعة الإمام محمد بن سعود الإسلامية بالرياض، واشتغل بالتدريس والإفتاء والدعوة.\n\nاشتهر بدروسه المنهجية في شرح أصول الاعتقاد وبسلاسله في نقد الطروحات الفكرية والعقدية، مع الحرص على الاستدلال بالكتاب والسنة وفهم سلف الأمة. وله حضور إعلامي ودعوي واسع عبر المحاضرات والمناظرات والبرامج، حيث يركز على ترسيخ المنهج العلمي الوسطي في تلقي العقيدة.","en":"Sheikh Othman al-Khamis is a Kuwaiti preacher and scholar, born on 26 May 1962 in Kuwait, specializing in creed and in responding to sects and divergent schools of thought. He received religious training at Imam Muhammad ibn Saud Islamic University in Riyadh and has worked in teaching, issuing religious guidance, and da'wah.\n\nHe is known for his methodical lessons explaining the foundations of belief and for series critiquing intellectual and doctrinal positions, with careful reliance on the Qur’an, the Sunnah, and the understanding of the early generations. He has a broad media and da'wah presence through lectures, debates, and programs, focusing on grounding a balanced scholarly approach to creed.","fr":"Le cheikh Othman al-Khamis est un prédicateur et savant koweïtien, né le 26 mai 1962 au Koweït, spécialisé dans la croyance et dans les réponses aux sectes et courants divergents. Il a reçu une formation religieuse à l’Université islamique Imam Muhammad ibn Saoud de Riyad et a exercé dans l’enseignement, le conseil religieux et la da'wa.\n\nIl est connu pour ses cours méthodiques expliquant les fondements de la croyance et pour ses séries critiquant diverses positions intellectuelles et doctrinales, en s’appuyant avec rigueur sur le Coran, la Sunna et la compréhension des premières générations. Il bénéficie d’une large présence médiatique et de da'wa à travers des conférences, débats et émissions, mettant l’accent sur un ancrage méthodique et équilibré de la croyance.","es":"El sheij Othman al-Khamis es un predicador y erudito kuwaití, nacido el 26 de mayo de 1962 en Kuwait, especializado en la creencia y en la respuesta a sectas y corrientes divergentes. Recibió formación religiosa en la Universidad Islámica Imam Muhammad ibn Saud de Riad y ha trabajado en la enseñanza, la orientación religiosa y la da'wa.\n\nEs conocido por sus lecciones metódicas que explican los fundamentos de la creencia y por series que critican diversas posturas intelectuales y doctrinales, con una cuidadosa apoyatura en el Corán, la Sunna y la comprensión de las primeras generaciones. Tiene una amplia presencia mediática y de da'wa a través de conferencias, debates y programas, centrada en afianzar un enfoque académico equilibrado de la creencia."}},{"n":"26","name":{"ar":"الشيخ أبو المنتصر البلوشي","en":"Sheikh Abu al-Muntaser al-Balushi","fr":"Sheikh Abu al-Muntaser al-Balushi","es":"Sheikh Abu al-Muntaser al-Balushi"},"website":"","tag":{"ar":"الفرق والملل","en":"Sects and Creeds","fr":"Sectes et confessions","es":"Sectas y confesiones"},"desc":{"ar":"الشيخ أبو المنتصر البلوشي داعية ومناظر عُماني وُلد في سبعينيات القرن العشرين في سلطنة عُمان، اهتم بدراسة الفرق والمذاهب والرد على الشبهات المثارة حول الإسلام. عُرف بنشاطه في المناظرات والحوارات الدينية، وبحرصه على تتبع المسائل الخلافية وتحليلها.\n\nيقدّم عبر دروسه ومشاركاته المرئية محتوى يركز على قضايا العقيدة والتعريف بالمنهج الإسلامي في فهم النصوص، مع اعتماد على الاستدلال والنقل. ويسعى في خطابه إلى توضيح المفاهيم وتصحيح التصورات الخاطئة، مخاطبًا جمهورًا واسعًا من المهتمين بقضايا الفكر والدين.","en":"Sheikh Abu al-Muntaser al-Balushi is an Omani preacher and debater, born in Oman in the 1970s, interested in the study of sects and schools of thought and in responding to doubts raised about Islam. He is known for his activity in religious debates and dialogues and for his attention to examining and analyzing contested issues.\n\nThrough his lessons and video contributions he presents content focused on matters of creed and on explaining the Islamic methodology for understanding texts, relying on evidence and citation. His discourse seeks to clarify concepts and correct misconceptions, addressing a wide audience interested in questions of thought and religion.","fr":"Le cheikh Abu al-Muntaser al-Balushi est un prédicateur et débatteur omanais, né à Oman dans les années 1970, qui s’intéresse à l’étude des sectes et des courants ainsi qu’aux réponses aux objections soulevées contre l’islam. Il est connu pour son activité dans les débats et dialogues religieux et pour son souci d’examiner et d’analyser les questions controversées.\n\nÀ travers ses cours et interventions vidéo, il propose des contenus centrés sur les questions de croyance et sur l’explication de la méthodologie islamique de compréhension des textes, en s’appuyant sur les preuves et les références. Son discours vise à clarifier les concepts et à corriger les idées erronées, s’adressant à un large public intéressé par les questions de pensée et de religion.","es":"El sheij Abu al-Muntaser al-Balushi es un predicador y polemista omaní, nacido en Omán en la década de 1970, interesado en el estudio de sectas y corrientes y en la respuesta a las dudas planteadas sobre el islam. Es conocido por su actividad en debates y diálogos religiosos y por su atención al examen y análisis de las cuestiones controvertidas.\n\nA través de sus lecciones y aportaciones en vídeo presenta contenidos centrados en cuestiones de creencia y en la explicación de la metodología islámica para comprender los textos, apoyándose en pruebas y citas. Su discurso busca aclarar conceptos y corregir ideas erróneas, dirigiéndose a un amplio público interesado en cuestiones de pensamiento y religión."}},{"n":"27","name":{"ar":"الشيخ أشرف غريب","en":"Sheikh Ashraf Gharib","fr":"Cheikh Achraf Gharib","es":"Sheij Ashraf Gharib"},"website":"","tag":{"ar":"ردود ودراسات","en":"responses and studies","fr":"réponses et études","es":"respuestas y estudios"},"desc":{"ar":"الشيخ أشرف غريب باحث وداعية مصري وُلد في سبعينيات القرن العشرين في مصر، اهتم بدراسة العقيدة الإسلامية والردود على الشبهات والطروحات المخالفة. عُرف بجهوده في تقديم دروس ومحاضرات تتناول مسائل الاعتقاد بمنهجية تعليمية واضحة.\n\nيركز في عمله على تحرير المصطلحات وبيان الأدلة الشرعية والعقلية، مع معالجة القضايا الفكرية المعاصرة التي تثير التساؤلات لدى الشباب. ويسعى من خلال محتواه المرئي والمكتوب إلى ترسيخ الفهم الصحيح للعقيدة وتقديم خطاب متوازن يجمع بين الدقة واليسر.","en":"Sheikh Ashraf Gharib is an Egyptian researcher and preacher, born in Egypt in the 1970s, interested in the study of Islamic creed and in responses to doubts and opposing views. He is known for offering lessons and lectures that address matters of belief in a clear educational manner.\n\nHis work focuses on clarifying terminology and presenting scriptural and rational evidence, while engaging with contemporary intellectual issues that raise questions among young people. Through his video and written content he seeks to ground a sound understanding of creed and to offer a balanced discourse that combines precision with accessibility.","fr":"Le cheikh Achraf Gharib est un chercheur et prédicateur égyptien, né en Égypte dans les années 1970, qui s’intéresse à l’étude de la croyance islamique et aux réponses aux doutes et aux thèses opposées. Il est connu pour ses cours et conférences traitant des questions de croyance de manière pédagogique et claire.\n\nSon travail se concentre sur la clarification des termes et la présentation des preuves scripturaires et rationnelles, tout en abordant les questions intellectuelles contemporaines qui suscitent des interrogations chez les jeunes. À travers ses contenus vidéo et écrits, il cherche à ancrer une compréhension juste de la croyance et à proposer un discours équilibré alliant rigueur et accessibilité.","es":"El sheij Ashraf Gharib es un investigador y predicador egipcio, nacido en Egipto en la década de 1970, interesado en el estudio de la creencia islámica y en las respuestas a las dudas y posturas opuestas. Es conocido por ofrecer lecciones y conferencias que abordan cuestiones de fe de manera educativa y clara.\n\nSu trabajo se centra en precisar la terminología y presentar pruebas textuales y racionales, a la vez que aborda cuestiones intelectuales contemporáneas que suscitan preguntas entre los jóvenes. A través de sus contenidos en vídeo y escritos busca afianzar una comprensión correcta de la creencia y ofrecer un discurso equilibrado que combine rigor y accesibilidad."}},{"n":"28","name":{"ar":"الشيخ فراج الصهيبي","en":"Sheikh Faraj Al-Sahibi","fr":"Cheikh Faraj Al-Sahibi","es":"Sheij Faraj Al-Sahibi"},"website":"","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ فراج الصهيبي داعية سعودي وُلد في سبعينيات القرن العشرين في المملكة العربية السعودية، متخصص في العقيدة الإسلامية والرد على الشبهات الفكرية والعقدية. يقدّم دروسًا ومحاضرات تستهدف تثبيت أصول الإيمان وتعزيز اليقين لدى المسلمين.\n\nيعتمد في خطابه على أسلوب مباشر يجمع بين الدليل الشرعي والمعالجة التربوية، مع اهتمام خاص بمخاطبة الشباب وقضاياهم المعاصرة. ويسهم من خلال حضوره الدعوي والإعلامي في نشر الوعي العقدي وتصحيح المفاهيم، داعيًا إلى التمسك بالمنهج العلمي والوسطية.","en":"Sheikh Faraj al-Sahibi is a Saudi preacher, born in Saudi Arabia in the 1970s, specializing in Islamic creed and in responding to intellectual and doctrinal doubts. He delivers lessons and lectures aimed at strengthening the foundations of faith and reinforcing certainty among Muslims.\n\nHis discourse adopts a direct style that combines scriptural evidence with educational guidance, with particular attention to addressing young people and their contemporary concerns. Through his da'wah and media presence he contributes to spreading doctrinal awareness and correcting misconceptions, calling for adherence to a scholarly and balanced methodology.","fr":"Le cheikh Faraj al-Sahibi est un prédicateur saoudien, né en Arabie saoudite dans les années 1970, spécialisé dans la croyance islamique et dans les réponses aux doutes intellectuels et doctrinaux. Il donne des cours et des conférences visant à affermir les fondements de la foi et à renforcer la certitude chez les musulmans.\n\nSon discours adopte un style direct qui associe la preuve scripturaire et l’accompagnement éducatif, avec une attention particulière aux jeunes et à leurs préoccupations contemporaines. Par sa présence dans la da'wa et les médias, il contribue à diffuser la conscience doctrinale et à corriger les idées reçues, en appelant à l’adhésion à une méthodologie savante et équilibrée.","es":"El sheij Faraj al-Sahibi es un predicador saudí, nacido en Arabia Saudita en la década de 1970, especializado en la creencia islámica y en la respuesta a las dudas intelectuales y doctrinales. Imparte lecciones y conferencias orientadas a afianzar los fundamentos de la fe y reforzar la certeza entre los musulmanes.\n\nSu discurso adopta un estilo directo que combina la prueba textual con la orientación educativa, con especial atención a los jóvenes y a sus inquietudes contemporáneas. A través de su presencia en la da'wa y los medios contribuye a difundir la conciencia doctrinal y a corregir conceptos erróneos, llamando a la adhesión a una metodología académica y equilibrada."}},{"n":"29","name":{"ar":"الشيخ الدكتور عمرو نور الدين","en":"Dr. Amr Nour al-Din","fr":"Dr Amr Nour al-Din","es":"Dr. Amr Nour al-Din"},"website":"https://amrnoureldeen.com/","tag":{"ar":"مقارنة الأديان والرد على الشبهات","en":"comparative religion and responding to doubts","fr":"religions comparées et réponse aux doutes","es":"religiones comparadas y respuesta a las dudas"},"desc":{"ar":"الشيخ الدكتور عمرو نور الدين داعية وباحث مصري وُلد في 1 يونيو 1987 في قرية البيوم بمركز الزقازيق بمحافظة الشرقية في مصر. حفظ القرآن الكريم في سن مبكرة وأجيز في القراءات، وتلقى تعليمه الشرعي في الرواق الأزهري وفي كلية المسجد النبوي بالمدينة المنورة حيث نال درجة البكالوريوس في الشريعة، ثم واصل دراساته العليا في الفقه والتاريخ والحضارة الإسلامية.\n\nيعمل إمامًا وخطيبًا لمسجد الفاروق عمر في مدينة العبور بمصر، وعُرف بنشاطه الدعوي في الرد على الشبهات ومقارنة الأديان وعرض السيرة والتاريخ الإسلامي بأسلوب معاصر. يقدّم دروسًا ومحاضرات ومواد مرئية عبر المنابر والمنصات الإعلامية، ومن أبرز مشاريعه الدعوية «قذائف الحق»، ساعيًا إلى ترسيخ اليقين وتبسيط المعارف الشرعية ومعالجة الإشكالات الفكرية المطروحة.","en":"Dr. Amr Nour al-Din is an Egyptian preacher and researcher, born on 1 June 1987 in Al-Bayoum village, Zagazig, in Egypt’s Sharqia Governorate. He memorized the Qur’an at an early age and received religious training through al-Azhar’s traditional learning circles and at the College of the Prophet’s Mosque in Madinah, where he earned a bachelor’s degree in Sharia, later pursuing graduate studies in fiqh and Islamic history and civilization.\n\nHe serves as the imam and preacher of Al-Faruq Omar Mosque in Obour City, Egypt, and is known for his da'wah work in responding to doubts, comparative religion, and presenting the Prophetic biography and Islamic history in a contemporary style. Through lessons, lectures, and media content, including his outreach project “Qadha’if al-Haqq” (Projectiles of Truth), he seeks to strengthen certainty, convey Islamic knowledge clearly, and address contemporary intellectual questions.","fr":"Le Dr Amr Nour al-Din est un prédicateur et chercheur égyptien, né le 1er juin 1987 dans le village d’Al-Bayoum, à Zagazig, dans le gouvernorat de Sharqia en Égypte. Il a mémorisé le Coran à un âge précoce et a reçu une formation religieuse dans les cercles traditionnels d’Al-Azhar ainsi qu’au Collège de la Mosquée du Prophète à Médine, où il a obtenu une licence en charia, avant de poursuivre des études supérieures en fiqh et en histoire et civilisation islamiques.\n\nIl est imam et prédicateur de la mosquée Al-Faruq Omar dans la ville d’Obour, en Égypte, et il est connu pour son activité de da'wa dans la réponse aux doutes, les religions comparées et la présentation de la sira prophétique et de l’histoire islamique dans un style contemporain. À travers ses cours, conférences et contenus médiatiques, notamment son projet « Qadha’if al-Haqq » (Projectiles de la vérité), il vise à renforcer la certitude, à transmettre les connaissances islamiques avec clarté et à traiter les questions intellectuelles contemporaines.","es":"El Dr. Amr Nour al-Din es un predicador e investigador egipcio, nacido el 1 de junio de 1987 en la aldea de Al-Bayoum, en Zagazig, gobernación de Sharqia (Egipto). Memorizó el Corán a temprana edad y recibió formación religiosa en los círculos tradicionales de Al-Azhar y en la Facultad de la Mezquita del Profeta en Medina, donde obtuvo la licenciatura en Sharía, y posteriormente realizó estudios de posgrado en fiqh e historia y civilización islámicas.\n\nSe desempeña como imán y predicador de la mezquita Al-Faruq Omar en la ciudad de Obour (Egipto), y es conocido por su labor de da'wa en la respuesta a las dudas, las religiones comparadas y la presentación de la biografía profética y la historia islámica en un estilo contemporáneo. A través de lecciones, conferencias y contenidos en medios, incluido su proyecto «Qadha’if al-Haqq» (Proyectiles de la verdad), busca fortalecer la certeza, transmitir el conocimiento islámico con claridad y abordar las cuestiones intelectuales actuales."}},{"n":"30","name":{"ar":"د. حاتم العوني","en":"D. Hatam al-Uni","fr":"D. Hatam al-Uni","es":"D. Hatam al-Uni"},"website":"https://alawny.com/","tag":{"ar":"أصول الفقه","en":"Jurisprudence Principles","fr":"Principes de jurisprudence","es":"Principios de jurisprudencia"},"desc":{"ar":"الدكتور حاتم بن عارف العوني باحث سعودي وُلد عام 1966 في مدينة الطائف بالمملكة العربية السعودية، متخصص في أصول الفقه ومقاصد الشريعة والحديث الشريف. عُرف بكتاباته الأكاديمية المحكمة وباهتمامه بتجديد النظر في المسائل الأصولية والفقهية المعاصرة.\n\nيقدّم دروسًا ومحاضرات وبحوثًا تتناول العلاقة بين النص والمقصد، وتطبيقات القواعد الأصولية في الواقع المعاصر. ويسعى في مشروعه العلمي إلى الجمع بين التأصيل الشرعي والانفتاح على القضايا المستجدة، مع الحرص على الدقة المنهجية والوضوح في العرض.","en":"Dr. Hatem al-Awni is a Saudi researcher, born in 1966 in Taif, Saudi Arabia, specializing in the principles of Islamic jurisprudence (usul al-fiqh), the higher objectives of Islamic law (maqasid al-shari'ah), and Hadith studies. He is known for his rigorous academic writings and for his interest in re-examining contemporary usuli and jurisprudential issues.\n\nHe offers lessons, lectures, and research addressing the relationship between text and objective and the application of usul principles to contemporary realities. His scholarly project seeks to combine sound religious grounding with engagement with emerging issues, while maintaining methodological precision and clarity of presentation.","fr":"Le Dr Hatem al-Awni est un chercheur saoudien, né en 1966 à Taïf en Arabie saoudite, spécialisé dans les fondements du droit musulman (usul al-fiqh), les finalités de la loi islamique (maqasid al-shari'ah) et les études du hadith. Il est connu pour ses écrits académiques rigoureux et pour son intérêt à réexaminer les questions contemporaines d’usul et de jurisprudence.\n\nIl propose des cours, conférences et recherches portant sur la relation entre le texte et l’objectif, ainsi que sur l’application des principes d’usul aux réalités contemporaines. Son projet scientifique vise à conjuguer enracinement religieux solide et ouverture aux questions émergentes, avec un souci constant de rigueur méthodologique et de clarté.","es":"El Dr. Hatem al-Awni es un investigador saudí, nacido en 1966 en Taif (Arabia Saudita), especializado en los fundamentos de la jurisprudencia islámica (usul al-fiqh), los objetivos superiores de la ley islámica (maqasid al-shari'ah) y los estudios de hadiz. Es conocido por sus rigurosos escritos académicos y por su interés en reexaminar cuestiones contemporáneas de usul y jurisprudencia.\n\nOfrece lecciones, conferencias e investigaciones que abordan la relación entre el texto y el objetivo, y la aplicación de los principios de usul a las realidades contemporáneas. Su proyecto académico busca combinar una sólida fundamentación religiosa con la apertura a cuestiones emergentes, manteniendo precisión metodológica y claridad expositiva."}},{"n":"31","name":{"ar":"د. عمرو بسيوني","en":"Dr. Amr Basyouni","fr":"Dr Amr Basyouni","es":"Dr. Amr Basyouni"},"website":"","tag":{"ar":"مصادر المعرفة","en":"Sources of Knowledge","fr":"Sources du savoir","es":"Fuentes del conocimiento"},"desc":{"ar":"الدكتور عمرو بسيوني باحث وكاتب ومحقق مصري وُلد في 22 سبتمبر 1985 في الإسكندرية بمصر، مهتم بالتراث الإسلامي والفكر الإسلامي المعاصر والفلسفة وقضايا المنهج ومصادر المعرفة. تخرّج في كلية التربية بجامعة الإسكندرية (قسم اللغة العربية)، وله إسهامات في التأليف والتحقيق والترجمة.\n\nيسعى في أعماله إلى دراسة العلاقة بين الوحي والعقل وبحث الأسس المعرفية للرؤية الإسلامية، مع معالجة إشكالات الفكر المعاصر والقراءات الحديثة للتراث. ويقدّم إنتاجه في صورة بحوث ومقالات وكتب تهدف إلى الجمع بين العناية التراثية والنقاش الفكري المنهجي.","en":"Dr. Amr Basyouni is an Egyptian researcher, writer, and editor, born on 22 September 1985 in Alexandria, Egypt. He is interested in Islamic heritage, contemporary Islamic thought, philosophy, and questions of methodology and sources of knowledge. He graduated from the Faculty of Education at Alexandria University (Department of Arabic Language) and has contributed to authorship, critical editing, and translation.\n\nHis work seeks to examine the relationship between revelation and reason and to explore the epistemological foundations of the Islamic worldview, while engaging contemporary thought and modern readings of the tradition. He presents his work through research, articles, and books that aim to combine attention to heritage with rigorous intellectual discussion.","fr":"Le Dr Amr Basyouni est un chercheur, écrivain et éditeur égyptien, né le 22 septembre 1985 à Alexandrie, en Égypte. Il s’intéresse au patrimoine islamique, à la pensée islamique contemporaine, à la philosophie ainsi qu’aux questions de méthode et de sources de la connaissance. Diplômé de la faculté d’éducation de l’Université d’Alexandrie (département de langue arabe), il a contribué à l’écriture, à l’édition critique et à la traduction.\n\nSes travaux cherchent à étudier la relation entre la révélation et la raison et à explorer les fondements épistémologiques de la vision islamique, tout en abordant la pensée contemporaine et les lectures modernes du patrimoine. Il présente ses recherches sous forme d’articles et d’ouvrages visant à conjuguer l’attention portée au patrimoine et une réflexion intellectuelle rigoureuse.","es":"El Dr. Amr Basyouni es un investigador, escritor y editor egipcio, nacido el 22 de septiembre de 1985 en Alejandría (Egipto). Está interesado en el patrimonio islámico, el pensamiento islámico contemporáneo, la filosofía y las cuestiones de metodología y fuentes del conocimiento. Se graduó en la Facultad de Educación de la Universidad de Alejandría (Departamento de Lengua Árabe) y ha contribuido en la autoría, la edición crítica y la traducción.\n\nSu trabajo busca examinar la relación entre la revelación y la razón y explorar los fundamentos epistemológicos de la cosmovisión islámica, al tiempo que aborda el pensamiento contemporáneo y las lecturas modernas del patrimonio. Presenta su producción a través de investigaciones, artículos y libros que procuran combinar el cuidado del legado con un debate intelectual riguroso."}},{"n":"32","name":{"ar":"الشيخ شمس الدين الجزائري","en":"Sheikh Shams al-Din al-Jaza'iri","fr":"Cheikh Chams Eddine al-Jazaïri","es":"Sheij Shams al-Din al-Yazairi"},"website":"","tag":{"ar":"الدعوة","en":"Da'wah","fr":"Prédication (Da'wa)","es":"Da'wa (predicación)"},"desc":{"ar":"الشيخ شمس الدين الجزائري (واسمه الحقيقي شمس الدين بوروبي) داعية جزائري وُلد في 17 يناير 1965 في مدينة الجزائر العاصمة بالجزائر. اشتهر بنشاطه الدعوي والإعلامي وبرامجه التي عُنيت بالإفتاء والتوجيه والجواب عن أسئلة الناس، ولا سيما عبر التلفزيون الجزائري.\n\nقدّم دروسًا وخطبًا ومشاركات تركز على التعليم الشرعي والتربية وبناء الوعي الديني، مع اهتمام بقضايا الأسرة والمجتمع. ويتميّز خطابه بأسلوب مباشر يسعى إلى تقريب الأحكام الشرعية ومعانيها إلى الجمهور العام وربطها بواقع الناس اليومي.","en":"Sheikh Shams al-Din al-Jaza'iri (real name Shams al-Din Bouroubi) is an Algerian preacher, born on 17 January 1965 in Algiers, Algeria. He became widely known for his da'wah and media activity, particularly programs focused on religious guidance and answering people's questions on Algerian television.\n\nHe has delivered lessons, sermons, and contributions centered on religious education, moral upbringing, and building religious awareness, with attention to family and social issues. His discourse is marked by a direct style that seeks to make religious rulings and their meanings accessible to a broad audience and relevant to everyday life.","fr":"Le cheikh Chams Eddine al-Jazaïri (de son vrai nom Chams Eddine Bouroubi) est un prédicateur algérien, né le 17 janvier 1965 à Alger, en Algérie. Il s’est fait largement connaître par son activité de da'wa et médiatique, notamment à travers des émissions consacrées à l’orientation religieuse et aux réponses aux questions du public à la télévision algérienne.\n\nIl a donné des cours, des sermons et des interventions axés sur l’enseignement religieux, l’éducation morale et le développement de la conscience religieuse, avec un intérêt particulier pour les questions familiales et sociales. Son discours se distingue par un style direct visant à rendre les enseignements religieux accessibles au grand public et en lien avec la vie quotidienne.","es":"El sheij Shams al-Din al-Yazairi (nombre real Shams al-Din Bouroubi) es un predicador argelino, nacido el 17 de enero de 1965 en Argel, Argelia. Alcanzó amplia notoriedad por su actividad de da'wa y mediática, especialmente por programas dedicados a la orientación religiosa y a responder preguntas del público en la televisión argelina.\n\nHa impartido lecciones, sermones y participaciones centradas en la educación religiosa, la formación moral y el desarrollo de la conciencia religiosa, con atención a las cuestiones familiares y sociales. Su discurso se caracteriza por un estilo directo que busca acercar las enseñanzas religiosas al público general y vincularlas con la vida cotidiana."}},{"n":"33","name":{"ar":"الشيخ د. ياسر قاضي","en":"Sheikh Dr. Yasir Qadhi","fr":"Cheikh Dr Yasir Qadhi","es":"Sheij Dr. Yasir Qadhi"},"website":"https://www.yasirqadhi.com/","tag":{"ar":"عقيدة وفكر إسلامي","en":"Islamic creed and thought","fr":"Croyance et pensée islamique","es":"Creencia y pensamiento islámico"},"desc":{"ar":"الشيخ الدكتور ياسر قاضي عالم وداعية أمريكي من أصل باكستاني، وُلد في 30 يناير 1975 في مدينة هيوستن بولاية تكساس، ونشأ في جدة بالمملكة العربية السعودية. تلقى تكوينًا علميًا مميزًا جمع بين الدراسة في جامعة المدينة المنورة وجامعة ييل، حيث حصل على الدكتوراه في الدراسات الإسلامية.\n\nعُرف بمحاضراته ودروسه في العقيدة والفقه والسيرة والفكر الإسلامي المعاصر، وبقدرته على مخاطبة الجمهور المسلم في الغرب بلغتين العربية والإنجليزية. شغل مناصب تعليمية ودعوية بارزة، وأسهم في تقديم خطاب يجمع بين الأصالة العلمية ومراعاة واقع المسلمين في المجتمعات المعاصرة.","en":"Sheikh Dr. Yasir Qadhi is an American scholar and preacher of Pakistani heritage, born on 30 January 1975 in Houston, Texas, and raised in Jeddah, Saudi Arabia. He received a distinguished academic formation combining studies at the Islamic University of Madinah and at Yale University, where he earned a PhD in Islamic studies.\n\nHe is known for his lectures and courses on creed, jurisprudence, prophetic biography, and contemporary Islamic thought, and for his ability to address Muslim audiences in the West in both Arabic and English. He has held prominent educational and da'wah roles and has contributed to a discourse that combines scholarly authenticity with attention to the lived realities of Muslims in contemporary societies.","fr":"Le cheikh Dr Yasir Qadhi est un savant et prédicateur américain d’origine pakistanaise, né le 30 janvier 1975 à Houston (Texas) et ayant grandi à Djeddah en Arabie saoudite. Il a reçu une formation académique remarquable alliant des études à l’Université islamique de Médine et à l’Université Yale, où il a obtenu un doctorat en études islamiques.\n\nIl est connu pour ses conférences et cours sur la croyance, le droit musulman, la biographie prophétique et la pensée islamique contemporaine, ainsi que pour sa capacité à s’adresser aux publics musulmans d’Occident en arabe et en anglais. Il a occupé des fonctions éducatives et de da'wa importantes et a contribué à un discours qui associe authenticité savante et prise en compte des réalités vécues par les musulmans dans les sociétés contemporaines.","es":"El sheij Dr. Yasir Qadhi es un erudito y predicador estadounidense de origen pakistaní, nacido el 30 de enero de 1975 en Houston (Texas) y criado en Yeda (Arabia Saudita). Recibió una destacada formación académica que combinó estudios en la Universidad Islámica de Medina y en la Universidad de Yale, donde obtuvo un doctorado en estudios islámicos.\n\nEs conocido por sus conferencias y cursos sobre creencia, jurisprudencia, biografía profética y pensamiento islámico contemporáneo, y por su capacidad para dirigirse al público musulmán en Occidente tanto en árabe como en inglés. Ha desempeñado importantes funciones educativas y de da'wa y ha contribuido a un discurso que combina autenticidad académica con atención a las realidades vividas por los musulmanes en las sociedades contemporáneas."},"yt":"https://www.youtube.com/@yasirqadhi"},{"n":"34","name":{"ar":"محمود شعبان","en":"Mahmoud Shaaban","fr":"Mahmoud Shaaban","es":"Mahmoud Shaaban"},"website":"","tag":{"ar":"بلاغة وفكر","en":"Rhetoric and Thought","fr":"Rhétorique et pensée","es":"Retórica y pensamiento"},"desc":{"ar":"الأستاذ محمود شعبان باحث ومربي مصري وُلد في سبعينيات القرن العشرين في مصر، متخصص في البلاغة العربية والفكر الإسلامي. عُرف باهتمامه بالجمع بين جمال اللغة العربية وعمق المعاني القرآنية، وبأسلوبه التعليمي الذي يسعى إلى تقريب علوم البلاغة والفكر إلى جمهور واسع.\n\nيقدّم دروسًا ومحاضرات تركز على الإعجاز البياني للقرآن الكريم، وعلى قراءة النصوص التراثية قراءة معاصرة واعية. ويسهم من خلال إنتاجه العلمي والدعوي في تعزيز الصلة باللغة العربية وبالتراث الإسلامي، مع عناية خاصة بالتربية القيمية وبناء الوعي.","en":"Professor Mahmoud Shaaban is an Egyptian researcher and educator, born in Egypt in the 1970s, specializing in Arabic rhetoric (balagha) and Islamic thought. He is known for bringing together the beauty of the Arabic language and the depth of Qur’anic meanings, and for an educational style that seeks to make the sciences of rhetoric and thought accessible to a wide audience.\n\nHe offers lessons and lectures focused on the rhetorical inimitability of the Qur’an and on reading classical texts with contemporary awareness. Through his scholarly and da'wah work he contributes to strengthening the connection to the Arabic language and Islamic heritage, with particular care for values-based education and the cultivation of awareness.","fr":"Le professeur Mahmoud Chabaan est un chercheur et éducateur égyptien, né en Égypte dans les années 1970, spécialisé en rhétorique arabe (balagha) et en pensée islamique. Il est connu pour son souci d’allier la beauté de la langue arabe à la profondeur des significations coraniques, et pour un style pédagogique qui vise à rendre les sciences de la rhétorique et de la pensée accessibles à un large public.\n\nIl propose des cours et conférences centrés sur l’inimitabilité rhétorique du Coran et sur une lecture contemporaine et réfléchie des textes classiques. Par son travail scientifique et de da'wa, il contribue à renforcer le lien avec la langue arabe et le patrimoine islamique, avec une attention particulière à l’éducation aux valeurs et au développement de la conscience.","es":"El profesor Mahmoud Shaaban es un investigador y educador egipcio, nacido en Egipto en la década de 1970, especializado en retórica árabe (balagha) y pensamiento islámico. Es conocido por su interés en unir la belleza de la lengua árabe con la profundidad de los significados coránicos, y por un estilo educativo que busca acercar las ciencias de la retórica y el pensamiento a un público amplio.\n\nOfrece lecciones y conferencias centradas en la inimitabilidad retórica del Corán y en la lectura contemporánea y consciente de los textos clásicos. A través de su labor académica y de da'wa contribuye a fortalecer el vínculo con la lengua árabe y el patrimonio islámico, con especial atención a la educación en valores y al desarrollo de la conciencia."},"yt":"https://www.youtube.com/@dr.mahmoud_shaban"}];

  ar: { dir: 'rtl', title: 'أعلام الدعوة والفكر', sub: 'دليل الدعاة والمحاورين والباحثين المعاصرين في مقارنة الأديان والرد على الشبهات ({n} شخصية).', ph: 'ابحث بالاسم أو التخصص...', none: 'لا توجد نتائج.', yt: '🎥 YouTube', site: '🌐 موقع', count: '{n} نتيجة', footer: 'جميع المعلومات الواردة استرشادية قابلة للتحديث' },
  fr: { dir: 'ltr', title: 'Figures de la prédication et de la pensée', sub: 'Guide des prédicateurs et chercheurs contemporains en religions comparées ({n} personnalités).', ph: 'Rechercher par nom ou spécialité...', none: 'Aucun résultat.', yt: '🎥 YouTube', site: '🌐 Site', count: '{n} résultat(s)', footer: 'Informations indicatives sujettes à mise à jour' },

  es: { dir: 'ltr', title: 'Figuras de la predicación y el pensamiento', sub: 'Guía de predicadores e investigadores contemporáneos en religiones comparadas ({n} personalidades).', ph: 'Buscar por nombre o tema...', none: 'Sin resultados.', yt: '🎥 YouTube', site: '🌐 Sitio web', count: '{n} resultado(s)', footer: 'La información es orientativa' }
};


var currentLang = 'ar';
var avatarCache = {};


function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) {}
  return null;
}


function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}


// ASCII-only helpers (char codes, no Arabic literals or \u escapes in regexes) so copy/paste or editors cannot corrupt them
function norm(s) {
  s = String(s || '').toLowerCase();
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if ((c >= 0x64B && c <= 0x65F) || c === 0x670 || c === 0x640) continue; // tashkeel, tatweel
    if (c === 0x623 || c === 0x625 || c === 0x622 || c === 0x671) c = 0x627;  // alef variants -> alef
    else if (c === 0x649) c = 0x64A;                                          // alef maqsura -> ya
    else if (c === 0x629) c = 0x647;                                          // ta marbuta -> ha
    out += String.fromCharCode(c);
  }
  return out;
}


function chars(codes) { return String.fromCharCode.apply(null, codes); }
var TITLES = [
  chars([0x627, 0x644, 0x634, 0x64A, 0x62E]),                 // sheikh
  chars([0x627, 0x644, 0x62F, 0x643, 0x62A, 0x648, 0x631]),   // doctor
  chars([0x627, 0x644, 0x623, 0x633, 0x62A, 0x627, 0x630]),   // professor
  chars([0x623, 0x2E, 0x62F, 0x2E]),                          // a.d.
  chars([0x62F, 0x2E])                                        // d.
];


function cleanName(name) {
  var core = String(name || '').replace(/\s*\([^)]*\)\s*/g, ' ').replace(/^\s+|\s+$/g, '');
  var changed = true;
  while (changed) {
    changed = false;
    for (var i = 0; i < TITLES.length; i++) {
      if (core.indexOf(TITLES[i]) === 0) {
        core = core.slice(TITLES[i].length).replace(/^\s+/, '');
        changed = true;
        break;
      }
    }
  }
  return core;
}


for (var i = 0; i < scholars.length; i++) {
  var s0 = scholars[i];
  var k = '';
  k += ' ' + (typeof s0.name === 'string' ? s0.name : [s0.name.ar, s0.name.en, s0.name.fr, s0.name.es].join(' '));
  k += ' ' + (typeof s0.desc === 'string' ? s0.desc : [s0.desc.ar, s0.desc.en, s0.desc.fr, s0.desc.es].join(' '));
  k += ' ' + (typeof s0.tag === 'string' ? s0.tag : [s0.tag.ar, s0.tag.en, s0.tag.fr, s0.tag.es].join(' '));
  s0._k = norm(k + ' ' + s0.n);
}


// Resolve a field that may be a plain Arabic string (legacy entry) or an
// {ar,en,fr,es} object. Falls back to Arabic, then English.
function L(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  return v[currentLang] || v.ar || v.en || v.fr || v.es || '';
}


// Deterministic SVG initials avatar. No canvas dependency; works offline and on
// low-RAM webviews where a 2D context may be unavailable (previous cause of
// empty grey circles).
function initials(name) {
  var core = cleanName(name || '').replace(/^\s+/, '');
  var first = core ? core.charAt(0) : '?';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">' +
    '<rect width="128" height="128" fill="#2a2a2a"/>' +
    '<text x="64" y="70" text-anchor="middle" dominant-baseline="middle" ' +
    'font-family="Tahoma,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" fill="#d4af37">' +
    esc(first) + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}


function avatar(name) {
  name = name || '';
  if (!avatarCache[name]) avatarCache[name] = initials(name);
  return avatarCache[name];
}


function photo(s) {
  if (s.img) return s.img;
  return IMG_DIR + s.n + '.' + IMG_EXT;
}


// Global image fallback, invoked by inline onerror= so it is reliable even for
// imgs injected through innerHTML.
window.__fb = function (img) {
  if (!img || img.getAttribute('data-fb')) return;
  img.setAttribute('data-fb', '1');
  img.onerror = null;
  img.style.display = 'none';
};


function render() {
  var gridEl = document.getElementById('grid');
  var searchEl = document.getElementById('search');
  var t = I18N[currentLang];
  var q = norm(searchEl ? searchEl.value.trim() : '');
  var list = [];
  for (var i = 0; i < scholars.length; i++) {
    if (!q || scholars[i]._k.indexOf(q) !== -1) list.push(scholars[i]);
  }
  if (!list.length) {
    gridEl.innerHTML = '<div class="empty">' + esc(t.none) + '</div>';
  } else {
    var html = '';
    for (var j = 0; j < list.length; j++) {
      var s = list[j];
      var nm = L(s.name);
      var dsc = L(s.desc);
      var tg = L(s.tag);
      var qn = encodeURIComponent(cleanName(nm));
      var yt = s.yt || (YT_BASE + qn);
      var web = String(s.website || '').trim();
      if (web && !/^https?:\/\//i.test(web)) web = '';
      var webTag = web ? '<a class="btn website" href="' + esc(web) + '" target="_blank" rel="noopener noreferrer">' + t.site + '</a>' : '';
      var imgTag = (ENABLE_PHOTOS || s.img)
        ? '<img src="' + esc(photo(s)) + '" data-name="' + esc(nm) + '" data-n="' + s.n + '" alt="" width="65" height="65" loading="lazy" decoding="async" onerror="window.__fb&&window.__fb(this)">'
        : '';
      var descHtml = '';
      if (dsc) {
        var parts = String(dsc).split(/\n\n+/);
        for (var pi = 0; pi < parts.length; pi++) {
          if (parts[pi].trim()) descHtml += '<p class="desc" dir="auto">' + esc(parts[pi].trim()).replace(/\n/g, '<br>') + '</p>';
        }
      }
      html += '<article class="card"><div class="card-top">' +
        '<div class="avatar"><span class="mono" aria-hidden="true">' + esc((cleanName(nm) || nm || '?').trim().charAt(0) || '?') + '</span>' + imgTag + '</div>' +
        '<div class="head-info"><div class="row"><h2 class="name" dir="auto">' + esc(nm) + '</h2>' +
        (tg ? '<span class="tag" dir="auto">' + esc(tg) + '</span>' : '') + '</div></div>' +
        (descHtml ? '<div class="desc-wrap">' + descHtml + '</div>' : '') +
        '</div>' +
        '<div class="actions">' +
        '<a class="btn" href="' + esc(yt) + '" target="_blank" rel="noopener noreferrer">' + t.yt + '</a>' + webTag +
        '</div></article>';
    }
    gridEl.innerHTML = html;
  }
  document.getElementById('count').textContent = t.count.replace('{n}', list.length);
}


// 'error' doesn't bubble, so capture as a backstop for any injected image
document.addEventListener('error', function (e) {
  var img = e.target;
  if (img && img.tagName === 'IMG') window.__fb(img);
}, true);




function mark(box, attr, val) {
  var btns = box.querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute(attr) === val) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }
}


function setLang(l) {
  if (!I18N[l]) l = 'ar';
  currentLang = l;
  store('app-lang', l);
  var t = I18N[l];
  document.documentElement.lang = l;
  document.documentElement.dir = t.dir;
  document.title = t.title;
  document.getElementById('title').textContent = t.title;
  document.getElementById('subtitle').textContent = t.sub.replace('{n}', scholars.length);
  document.getElementById('search').placeholder = t.ph;
  document.getElementById('footerText').textContent = t.footer;
  mark(document.getElementById('langs'), 'data-lang', l);
  render();
}


function setTheme(th) {
  document.documentElement.setAttribute('data-theme', th);
  store('app-theme', th);
  mark(document.getElementById('themes'), 'data-theme', th);
  var m = document.querySelector('meta[name="theme-color"]');
  var colors = { dark: '#121212', light: '#f8fafc', sepia: '#f4ecd8' };
  if (m) m.setAttribute('content', colors[th] || '#121212');
}


document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('langs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]');
    if (b) setLang(b.getAttribute('data-lang'));
  });
  document.getElementById('themes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-theme]');
    if (b) setTheme(b.getAttribute('data-theme'));
  });
  var timer;
  document.getElementById('search').addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(render, 120);
  });
  setTheme(store('app-theme') || 'dark');
  setLang(store('app-lang') || 'ar');
});


if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
