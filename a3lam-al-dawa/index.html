<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="sepia">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>أعلام الدعوة والفكر والمناظرة في العصر الرقمي</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">


    <style>
        :root {
            --bg-parchemin: #f4ecd8;
            --bg-ivoire: #fcf8f0;
            --primary-emerald: #15472a;
            --accent-bronze: #9c722e;
            --text-main: #2c2c2c;
            --text-muted: #5a5a5a;
            --border-color: #d1c7b3;
            --font-title: 'Amiri', serif;
            --font-body: 'Scheherazade New', 'Amiri', serif;
        }


        [data-theme="light"] {
            --bg-parchemin: #ffffff;
            --bg-ivoire: #f8f9fa;
            --text-main: #111111;
            --text-muted: #444444;
            --border-color: #dddddd;
        }


        [data-theme="dark"] {
            --bg-parchemin: #1a1a1a;
            --bg-ivoire: #2a2a2a;
            --primary-emerald: #4ade80;
            --accent-bronze: #d4af37;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --border-color: #444444;
        }


        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-parchemin);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }


        header {
            background-color: var(--bg-ivoire);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
            border-bottom: 2px solid var(--accent-bronze);
        }


        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }


        .app-title {
            font-family: var(--font-title);
            font-size: 1.3rem;
            color: var(--primary-emerald);
            font-weight: 700;
        }


        .menu-toggle-btn {
            background: var(--primary-emerald);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: var(--font-title);
            cursor: pointer;
        }


        .search-container { width: 100%; }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 1.05rem;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-parchemin);
            color: var(--text-main);
        }
        .search-input:focus { outline: none; border-color: var(--primary-emerald); }


        .header-controls {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
        }


        .control-group {
            display: flex; background: var(--bg-parchemin);
            border: 1px solid var(--border-color); border-radius: 15px; overflow: hidden;
        }


        .control-btn {
            padding: 6px 10px; font-size: 0.85rem; color: var(--text-main);
            border-inline-end: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
        }
        .control-btn:last-child { border-inline-end: none; }
        .control-btn.active, .control-btn:hover {
            background: var(--accent-bronze);
            color: white;
        }


        main { padding: 16px; max-width: 1100px; margin: 0 auto; }
        .intro-text { text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 1.1rem; }


        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 600px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }


        .card {
            background: var(--bg-ivoire);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }


        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card-title { font-family: var(--font-title); font-size: 1.25rem; color: var(--primary-emerald); font-weight: 700; }
        .card-badge { background: var(--accent-bronze); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; }
        .card-body { font-size: 1.05rem; color: var(--text-main); margin-bottom: 12px; flex-grow: 1; }
        .card-actions { display: flex; gap: 8px; }
        
        .btn-action {
            flex: 1; padding: 6px; border-radius: 6px; font-size: 0.9rem;
            background: var(--bg-parchemin); border: 1px solid var(--border-color); color: var(--text-main);
            text-align: center;
            cursor: pointer;
        }
        .btn-action:hover { background: var(--primary-emerald); color: white; }


        /* القائمة الجانبية (Drawer) */
        .overlay {
            position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important;
            background: rgba(0,0,0,0.6) !important; z-index: 9998 !important; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .overlay.active { opacity: 1 !important; visibility: visible !important; }


        .drawer {
            position: fixed !important; top: 0 !important; right: 0 !important; width: 280px !important; height: 100vh !important;
            background: var(--bg-ivoire) !important; z-index: 9999 !important; box-shadow: -5px 0 20px rgba(0,0,0,0.3) !important;
            transform: translateX(100%) !important; transition: transform 0.3s ease !important; display: flex !important; flex-direction: column !important;
        }
        .drawer.open { transform: translateX(0) !important; }
        
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--bg-parchemin); border-bottom: 1px solid var(--border-color); }
        .close-btn { background: #fee2e2; color: #dc2626; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
        .drawer-content { padding: 14px; overflow-y: auto; }
        .drawer-list { list-style: none; }
        .drawer-list li { margin-bottom: 8px; }
        .drawer-list a, .drawer-list button { 
            display: block; width: 100%; text-align: right; padding: 8px; color: var(--text-main); 
            border-radius: 6px; text-decoration: none; background: transparent; border: none; font-family: inherit; font-size: 1rem; cursor: pointer;
        }
        .drawer-list a:hover, .drawer-list button:hover { background: var(--primary-emerald); color: white; }
    </style>
</head>
<body>


    <header>
        <div class="header-top">
            <h1 class="app-title" id="ui-title">أعلام الدعوة والفكر</h1>
            <button class="menu-toggle-btn" id="openDrawerBtn" type="button">☰ الفهرس</button>
        </div>
        
        <div class="search-container">
            <input type="search" id="searchInput" class="search-input" placeholder="ابحث بالاسم أو التخصص..." autocomplete="off">
        </div>


        <div class="header-controls">
            <div class="control-group" id="langGroup">
                <button class="control-btn active" data-lang="ar" type="button">🇲🇦 AR</button>
                <button class="control-btn" data-lang="en" type="button">🇬🇧 EN</button>
                <button class="control-btn" data-lang="fr" type="button">🇫🇷 FR</button>
                <button class="control-btn" data-lang="es" type="button">🇪🇸 ES</button>
            </div>
            
            <div class="control-group" id="themeGroup">
                <button class="control-btn active" data-theme="sepia" type="button">📜 Sépia</button>
                <button class="control-btn" data-theme="light" type="button">☀️ Clair</button>
                <button class="control-btn" data-theme="dark" type="button">🌙 Sombre</button>
            </div>
        </div>
    </header>


    <main>
        <p class="intro-text" id="ui-intro">خمسة وثلاثون علماً من ميادين الدعوة والمناظرة والفكر في العصر الرقمي.</p>
        <div class="cards-grid" id="cardsContainer"></div>
    </main>


    <div class="overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="sidebarDrawer">
        <div class="drawer-header">
            <h3 style="color:var(--primary-emerald); font-family:var(--font-title); margin:0;">الفهرس</h3>
            <button class="close-btn" id="closeDrawerBtn" type="button">✕</button>
        </div>
        <div class="drawer-content">
            <ul class="drawer-list">
                <li><button type="button" onclick="filterByCategory('all')">📚 كل الشخصيات (35)</button></li>
                <li><button type="button" onclick="filterByCategory('01')">01 دعاة ومبادئون</button></li>
                <li><button type="button" onclick="filterByCategory('02')">02 محاضرون ومناظرون</button></li>
                <li><button type="button" onclick="filterByCategory('03')">03 باحثون في العقيدة</button></li>
                <li><button type="button" onclick="filterByCategory('04')">04 نقد الإلحاد والفكر</button></li>
                <li><button type="button" onclick="filterByCategory('05')">05 مناظرو الشارع</button></li>
                <li><button type="button" onclick="filterByCategory('06')">06 علماء حضور عالمي</button></li>
            </ul>
        </div>
    </aside>


    <script>
        // قاعدة البيانات الحقيقية والمنظمة (تحتوي على الأسماء الحقيقية والتصنيفات)
        const scholarsData = [
            {
                id: 1,
                category: "02",
                ar: { name: "الشيخ أحمد ديدات", badge: "مناظر", bio: "من أشهر المناظرين في مقارنة الأديان وحوار الأديان عالمياً." },
                en: { name: "Sheikh Ahmed Deedat", badge: "Debater", bio: "One of the most famous debaters in comparative religion." }
            },
            {
                id: 2,
                category: "02",
                ar: { name: "د. ذاكر نايك", badge: "محاضر", bio: "باحث ومحاضر شهير في مقارنة الأديان وعلوم القرآن." },
                en: { name: "Dr. Zakir Naik", badge: "Lecturer", bio: "Renowned researcher and lecturer in comparative religion." }
            },
            {
                id: 3,
                category: "03",
                ar: { name: "الشيخ عثمان الخميس", badge: "باحث وعقيدة", bio: "مناظر وباحث بارز في العقيدة الإسلامية والرد على الفرق." },
                en: { name: "Sheikh Othman Al-Khamis", badge: "Researcher", bio: "Prominent researcher and debater in Islamic creed." }
            },
            {
                id: 4,
                category: "04",
                ar: { name: "أ.د. سامي عامري", badge: "مفكر وباحث", bio: "باحث متحصّص في نقد الإلحاد ودفع الشبهات المعاصرة." },
                en: { name: "Dr. Sami Amerii", badge: "Thinker", bio: "Specialized researcher in refuting atheism and contemporary doubts." }
            },
            {
                id: 5,
                category: "05",
                ar: { name: "الشيخ محمد حجاب", badge: "مناظر شوارع", bio: "داعية ومناظر أكاديمي وشارع باللغة الإنجليزية في الغرب." },
                en: { name: "Sheikh Mohammed Hijab", badge: "Debater", bio: "Academic and street debater in the West." }
            },
            {
                id: 6,
                category: "06",
                ar: { name: "الشيخ عبد الرحمن السحيم", badge: "داعية", bio: "داعية ومؤصل شرعي له جهود واسعة في الدعوة عبر الشبكات." },
                en: { name: "Sheikh Abdulrahman Al-Suhaim", badge: "Preacher", bio: "Preacher with extensive efforts in online da'wah." }
            }
            // يمكنك إضافة باقي الشخصيات هنا حتى تصل إلى 35 بنفس الهيكل ودقة التصنيف (category: "01" إلى "06")
        ];


        // توليد باقي الشخصيات تلقائياً إذا أردت إكمال العدد إلى 35 في حال لم تضفها يدوياً بعد
        for (let i = 7; i <= 35; i++) {
            scholarsData.push({
                id: i,
                category: "0" + ((i % 6) + 1),
                ar: { name: `العالم الجليل الشيخ فلان (${i})`, badge: "عالم وباحث", bio: "شخصية علمية بارزة في ميادين الدعوة والمناظرة والفكر المعاصر." },
                en: { name: `Scholar Figure (${i})`, badge: "Scholar", bio: "Prominent scientific figure in da'wah and contemporary thought." },
                fr: { name: `Érudit Figure (${i})`, badge: "Érudit", bio: "Figure scientifique éminente dans la da'wa." },
                es: { name: `Erudito Figura (${i})`, badge: "Erudito", bio: "Figura científica prominente en la da'wa." }
            });
        }


        let currentLang = localStorage.getItem('a3lam-lang') || 'ar';
        let currentQuery = '';
        let currentCategory = 'all';


        const container = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');
        const htmlEl = document.documentElement;


        function renderCards() {
            container.innerHTML = '';
            const filtered = scholarsData.filter(item => {
                const d = item[currentLang] || item['ar'];
                const matchesQuery = d.name.toLowerCase().includes(currentQuery.toLowerCase()) || d.bio.toLowerCase().includes(currentQuery.toLowerCase());
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                return matchesQuery && matchesCategory;
            });


            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">لا توجد نتائج مطابقة.</p>';
                return;
            }


            filtered.forEach(item => {
                const d = item[currentLang] || item['ar'];
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${d.name}</h3>
                        <span class="card-badge">${d.badge}</span>
                    </div>
                    <p class="card-body">${d.bio}</p>
                    <div class="card-actions">
                        <button class="btn-action btn-bio" type="button">السيرة</button>
                        <button class="btn-action btn-youtube" type="button">يوتيوب</button>
                    </div>
                `;


                card.querySelector('.btn-bio').addEventListener('click', () => {
                    alert(`${d.name}\n\n${d.bio}`);
                });


                card.querySelector('.btn-youtube').addEventListener('click', () => {
                    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(d.name)}`, '_blank');
                });


                container.appendChild(card);
            });
        }


        // دالة تصفية الفهرس
        window.filterByCategory = function(cat) {
            currentCategory = cat;
            toggleDrawer(false);
            renderCards();
        };


        document.addEventListener('DOMContentLoaded', () => {
            searchInput.addEventListener('input', (e) => {
                currentQuery = e.target.value.trim();
                renderCards();
            });


            // تغيير اللغات
            document.querySelectorAll('#langGroup .control-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#langGroup .control-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    currentLang = e.currentTarget.getAttribute('data-lang');
                    localStorage.setItem('a3lam-lang', currentLang);
                    htmlEl.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
                    htmlEl.setAttribute('lang', currentLang);
                    renderCards();
                });
            });


            // الثيمات
            const themeBtns = document.querySelectorAll('#themeGroup .control-btn');
            const savedTheme = localStorage.getItem('a3lam-theme') || 'sepia';
            htmlEl.setAttribute('data-theme', savedTheme);
            themeBtns.forEach(b => {
                if(b.getAttribute('data-theme') === savedTheme) b.classList.add('active');
                else b.classList.remove('active');
            });


            themeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    themeBtns.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    const theme = e.currentTarget.getAttribute('data-theme');
                    htmlEl.setAttribute('data-theme', theme);
                    localStorage.setItem('a3lam-theme', theme);
                });
            });


            // القائمة الجانبية
            const drawer = document.getElementById('sidebarDrawer');
            const overlay = document.getElementById('drawerOverlay');
            
            window.toggleDrawer = function(open) {
                if(open) {
                    drawer.classList.add('open');
                    overlay.classList.add('active');
                } else {
                    drawer.classList.remove('open');
                    overlay.classList.remove('active');
                }
            };


            document.getElementById('openDrawerBtn').addEventListener('click', () => toggleDrawer(true));
            document.getElementById('closeDrawerBtn').addEventListener('click', () => toggleDrawer(false));
            overlay.addEventListener('click', () => toggleDrawer(false));


            htmlEl.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.querySelector(`#langGroup .control-btn[data-lang="${currentLang}"]`)?.classList.add('active');
            renderCards();
        });
    </script>
</body>
</html>
