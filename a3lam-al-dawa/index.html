    :root {
      --bg: #f5efe0;
      --bg-deep: #ede2cb;
      --surface: rgba(255, 252, 244, 0.9);
      --surface-solid: #fffcf4;
      --surface-soft: #f9f2e3;
      --ink: #28231d;
      --ink-soft: #675d51;
      --ink-faint: #8c8172;
      --green: #14523b;
      --green-2: #1f6b4d;
      --green-soft: rgba(20, 82, 59, 0.09);
      --gold: #ad7c2f;
      --gold-bright: #d6a64a;
      --gold-soft: rgba(173, 124, 47, 0.12);
      --line: rgba(84, 66, 44, 0.16);
      --line-strong: rgba(84, 66, 44, 0.28);
      --mark: #ffe39a;
      --mark-ink: #2a1d00;
      --shadow: 0 18px 55px rgba(71, 52, 24, 0.12);
      --shadow-soft: 0 6px 22px rgba(71, 52, 24, 0.08);
      --radius: 20px;
      --reading-scale: 1;
      --font-body: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      --font-title: 'Amiri', Georgia, serif;
      --max: 1180px;
      color-scheme: light;
    }

    [data-theme="light"] {
      --bg: #f3f6f4;
      --bg-deep: #e4ece7;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --surface-soft: #f5f8f6;
      --ink: #17221d;
      --ink-soft: #52625a;
      --ink-faint: #7b8b83;
      --green: #14523b;
      --green-2: #217253;
      --green-soft: rgba(20, 82, 59, 0.08);
      --gold: #a8782d;
      --gold-bright: #c99a3f;
      --gold-soft: rgba(168, 120, 45, 0.1);
      --line: rgba(23, 52, 38, 0.13);
      --line-strong: rgba(23, 52, 38, 0.24);
      --mark: #ffe68f;
      --mark-ink: #211700;
      --shadow: 0 18px 55px rgba(25, 49, 37, 0.1);
      --shadow-soft: 0 6px 22px rgba(25, 49, 37, 0.07);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0d1714;
      --bg-deep: #09110f;
      --surface: rgba(18, 34, 29, 0.88);
      --surface-solid: #12221d;
      --surface-soft: #162a23;
      --ink: #edf3ee;
      --ink-soft: #aabbb2;
      --ink-faint: #7f9489;
      --green: #67d2a1;
      --green-2: #8ce3ba;
      --green-soft: rgba(103, 210, 161, 0.11);
      --gold: #e2b45c;
      --gold-bright: #f3cd7c;
      --gold-soft: rgba(226, 180, 92, 0.12);
      --line: rgba(196, 224, 208, 0.14);
      --line-strong: rgba(196, 224, 208, 0.25);
      --mark: #805c13;
      --mark-ink: #fff4c8;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
      --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.28);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 120px; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 2%, var(--gold-soft), transparent 34rem),
        radial-gradient(circle at 88% 12%, var(--green-soft), transparent 30rem),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: calc(16px * var(--reading-scale));

    .skip-link {

    .theme-btn {
      width: 2.1rem;

    .hero {

    .hero-shell {

        linear-gradient(135deg, color-mix(in srgb, var(--surface-solid) 92%, transparent), color-mix(in srgb, var(--surface-soft) 82%, transparent));

      content: '';

    .eyebrow {

    .hero-lede {
      max-width: 61ch;
      margin: 0;
      color: var(--ink-soft);
      font-size: calc(.96rem * var(--reading-scale));
      line-height: 1.95;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: 1.25rem;
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .36rem .68rem;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: .7rem;
      font-weight: 700;
    }
    .meta-pill.gold { background: var(--gold-soft); color: var(--gold); }
    .search-panel { margin-top: 1.7rem; }
    .search-box {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .48rem .55rem .48rem 1rem;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: var(--surface-solid);
      box-shadow: var(--shadow-soft);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    [dir="rtl"] .search-box { padding: .48rem 1rem .48rem .55rem; }
    .search-box:focus-within {
      border-color: color-mix(in srgb, var(--green) 60%, transparent);
      box-shadow: 0 0 0 4px var(--green-soft);
    }
    .search-icon { width: 1.2rem; height: 1.2rem; color: var(--ink-faint); flex: 0 0 auto; }
    .search-input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: .94rem;
      padding: .34rem 0;
    }
    .search-input::placeholder { color: var(--ink-faint); }
    .search-clear {
      display: none;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--ink-soft);
      border-radius: 10px;
      padding: .38rem .65rem;
      font-size: .7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-clear.visible { display: inline-flex; }
    .search-clear:hover { border-color: var(--gold); color: var(--gold); }
    .search-status {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .45rem .9rem;
      min-height: 1.65rem;
      margin-top: .65rem;
      color: var(--ink-faint);
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
    }
    .status-item { display: inline-flex; align-items: center; gap: .28rem; }
    .status-item b { color: var(--ink-soft); font-weight: 700; }
    .status-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
    .status-online { color: var(--green); font-weight: 700; }
    .status-online::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .layout {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.2rem 4rem;
      display: grid;
      grid-template-columns: 255px minmax(0, 1fr);
      gap: 1.6rem;
      align-items: start;
    }
    .toc {
      position: sticky;
      top: 6.2rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      padding: 1.1rem;
    }
    .toc-title {
      display: flex;
      align-items: center;
      gap: .45rem;
      margin: 0 0 .8rem;
      padding-bottom: .65rem;
      border-bottom: 1px solid var(--line);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .toc-list { display: flex; flex-direction: column; gap: .18rem; }
    .toc-link {
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      padding: .55rem .6rem;
      border-radius: 11px;

    .content { min-width: 0; }
    .section-card {
      margin-bottom: 1.35rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);

    .section-kicker::before {

    .about-title {

    .bio-card {
      position: relative;

      padding: 1.15rem;

    .bio-mark {
      position: absolute;

    }
    .bio-card h3 {
      position: relative;

    .catalog-head {

    [data-theme="dark"] .catalog-title { color: var(--green-2); }
    .catalog-note { color: var(--ink-faint); font-size: .72rem; text-align: end; }

    .category { padding: clamp(1.1rem, 2.6vw, 1.7rem); }
    .category-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: .85rem;
      align-items: center;
      padding-bottom: .85rem;
      margin-bottom: .9rem;
      border-bottom: 1px solid var(--line);
    }
    .category-number {
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
      border-radius: 50%;
      background: var(--gold-soft);
      color: var(--gold);
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .category-title {
      margin: 0;
      font-family: var(--font-title);

      line-height: 1.4;
      color: var(--ink);

    .category-kicker { margin: .1rem 0 0; color: var(--ink-faint); font-size: .7rem; }

      border: 1px solid var(--line);

      font-variant-numeric: tabular-nums;

    .figure-card {
      position: relative;

      grid-template-columns: 2.2rem minmax(0, 1fr);
      gap: .8rem;

      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;

    .figure-card:hover {
      border-color: color-mix(in srgb, var(--gold) 50%, var(--line));

    .figure-index {
      width: 2.2rem;
      height: 2.2rem;

      place-items: center;
      border-radius: 12px;
      background: var(--green-soft);

      font-size: .7rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    [data-theme="dark"] .figure-index { color: var(--green-2); }
    .figure-body { min-width: 0; }
    .figure-name {
      margin: 0 0 .25rem;
      font-family: var(--font-title);
      font-size: calc(1.1rem * var(--reading-scale));
      line-height: 1.42;

    .channel {

    mark {
      padding: .02em .14em;

      box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 18%, transparent);

      color: var(--ink-soft);

    .empty-title { margin: 0 0 .25rem; font-family: var(--font-title); font-size: 1.4rem; color: var(--green); }
    .empty-hint { margin: 0; font-size: .78rem; color: var(--ink-faint); }

    .site-footer {
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg-deep) 70%, transparent);
    }
    .footer-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1.6rem 1.2rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;

    .footer-copy { color: var(--ink-faint); font-size: .7rem; line-height: 1.7; }
    .footer-links { display: flex; flex-wrap: wrap; gap: .45rem; }
    .footer-link {
      padding: .38rem .68rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: .68rem;
      text-decoration: none;
      transition: border-color .2s ease, color .2s ease, background-color .2s ease;
    }
    .footer-link:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
    .top-link {
      position: fixed;
      inset-inline-end: 1rem;
      bottom: 1rem;
      z-index: 80;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface-solid);
      color: var(--green);
      box-shadow: var(--shadow-soft);
      text-decoration: none;

      transition: opacity .2s ease, transform .2s ease;

    [dir="ltr"] { --font-title: 'Cairo', Georgia, serif; }
    [dir="ltr"] .hero-title,
    [dir="ltr"] .about-title,
    [dir="ltr"] .catalog-title,
    [dir="ltr"] .category-title,
    [dir="ltr"] .figure-name,
    [dir="ltr"] .bio-card h3,
    [dir="ltr"] .empty-title,
    [dir="ltr"] .brand-title { letter-spacing: -.015em; }
    [dir="ltr"] .hero-title { max-width: 20ch; }
    [dir="ltr"] .bio-mark { font-family: Georgia, serif; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .toc { position: static; order: 2; }
      .toc-list { display: grid; grid-template-columns: 1fr 1fr; }
      .content { order: 1; }
      .about-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .header-inner { align-items: flex-start; flex-direction: column; gap: .65rem; }
      .header-controls { width: 100%; justify-content: space-between; }
      .brand-sub { display: none; }
      .hero { padding-top: 1.4rem; }
      .hero-shell { padding: 1.35rem; }
      .catalog-head { align-items: flex-start; flex-direction: column; gap: .2rem; }
      .catalog-note { text-align: start; }
      .category-head { grid-template-columns: auto minmax(0, 1fr); }
      .category-count { grid-column: 2; justify-self: start; }
    }
    @media (max-width: 520px) {
      html { scroll-padding-top: 150px; }
      .header-inner { padding: .7rem .8rem; }
      .brand img { width: 36px; height: 36px; }
      .brand-title { font-size: .92rem; }
      .lang-btn { padding: .38rem .45rem; font-size: .64rem; }
      .lang-btn .flag { font-size: .8rem; }
      .theme-btn { width: 1.9rem; height: 1.9rem; }
      .font-btn { width: 1.8rem; height: 1.8rem; }
      .font-readout { display: none; }
      .hero { padding-inline: .8rem; }
      .layout { padding-inline: .8rem; }
      .figure-card { grid-template-columns: 1fr; }
      .figure-index { width: 1.85rem; height: 1.85rem; }
      .toc-list { grid-template-columns: 1fr; }

    function normalizeChar(ch) {
      const code = ch.charCodeAt(0);
      if ((code >= 0x064B && code <= 0x065F) || code === 0x0670 || code === 0x06D6 || code === 0x06D7 || code === 0x06D8 || code === 0x06D9 || code === 0x06DA || code === 0x06DB || code === 0x06DC || code === 0x06DD || code === 0x06DE || code === 0x06DF || code === 0x06E0 || code === 0x06E1 || code === 0x06E2 || code === 0x06E3 || code === 0x06E4 || code === 0x06E5 || code === 0x06E6 || code === 0x06E7 || code === 0x06E8 || code === 0x06E9 || code === 0x06EA || code === 0x06EB || code === 0x06EC || code === 0x06ED) return '';
      if (ch === '\u0640') return '';
      if (ch === 'أ' || ch === 'إ' || ch === 'آ' || ch === 'ٱ') return 'ا';
      if (ch === 'ى') return 'ي';
      if (ch === 'ة') return 'ه';
      if (ch === 'ؤ') return 'و';
      if (ch === 'ئ') return 'ي';
      if (ch === 'ء') return '';
      return ch.toLowerCase();
    }

    function normalizeText(text) {
      let out = '';
      const map = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const normalized = normalizeChar(ch);
        if (normalized) {
          out += normalized;
          for (let j = 0; j < normalized.length; j++) map.push(i);
        }
      }
      return { text: out, map };
    }

    function getTokens(query) {
      const normalized = normalizeText(query).text.trim();
      if (!normalized) return [];
      return Array.from(new Set(normalized.split(/\s+/).filter(Boolean)));
    }

    function tokenMatches(text, tokens) {
      if (!tokens.length) return true;
      const normalized = normalizeText(text).text;
      return tokens.every(token => normalized.includes(token));
    }

    function countWords(text) {
      const clean = String(text || '').trim();
      if (!clean) return 0;
      return clean.split(/\s+/).filter(Boolean).length;
    }

    function findRanges(text, tokens) {
      if (!tokens.length || !text) return [];
      const normalized = normalizeText(text);
      const ranges = [];
      tokens.forEach(token => {
        let from = 0;
        while (from <= normalized.text.length - token.length) {
          const index = normalized.text.indexOf(token, from);
          if (index === -1) break;
          const start = normalized.map[index];
          const end = normalized.map[index + token.length - 1] + 1;
          if (typeof start === 'number' && typeof end === 'number' && end > start) ranges.push([start, end]);
          from = index + Math.max(1, token.length);
        }
      });
      if (!ranges.length) return ranges;
      ranges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const merged = [ranges[0]];
      for (let i = 1; i < ranges.length; i++) {
        const last = merged[merged.length - 1];
        const current = ranges[i];
        if (current[0] <= last[1]) last[1] = Math.max(last[1], current[1]);
        else merged.push(current);
      }
      return merged;
    }

    function appendHighlighted(parent, text, tokens) {
      const ranges = findRanges(text, tokens);
      let count = 0;
      if (!ranges.length) {
        parent.appendChild(document.createTextNode(text));
        return count;
      }
      let cursor = 0;
      ranges.forEach(([start, end]) => {
        if (start > cursor) parent.appendChild(document.createTextNode(text.slice(cursor, start)));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(start, end);
        parent.appendChild(mark);
        cursor = end;
        count += 1;
      });
      if (cursor < text.length) parent.appendChild(document.createTextNode(text.slice(cursor)));
      return count;
    }

    function renderCategory(cat, lang, tokens) {
      const section = document.createElement('section');

      titleWrap.append(title, kicker);

      const count = document.createElement('span');

      count.textContent = formatNumber(cat.visibleItems.length) + ' ' + lang.figures;

      head.append(number, titleWrap, count);

      const grid = document.createElement('div');
      grid.className = 'figures';

      cat.visibleItems.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'figure-card';

        const idx = document.createElement('span');
        idx.className = 'figure-index';
        idx.textContent = String(index + 1).padStart(2, '0');

        const body = document.createElement('div');
        body.className = 'figure-body';

        const name = document.createElement('h3');
        name.className = 'figure-name';
        appendHighlighted(name, item.name, tokens);

        const desc = document.createElement('p');
        desc.className = 'figure-desc';
        appendHighlighted(desc, item.desc, tokens);

        const channel = document.createElement('a');
        channel.className = 'channel';
        channel.href = youtubeSearchUrl(item.channel);
        channel.target = '_blank';
        channel.rel = 'noopener noreferrer';
        channel.setAttribute('aria-label', lang.channel + ': ' + item.channel);
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        icon.setAttribute('stroke-width', '2');
        icon.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'm10 8 6 4-6 4V8Z');
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', '3');
        rect.setAttribute('y', '5');
        rect.setAttribute('width', '18');
        rect.setAttribute('height', '14');
        rect.setAttribute('rx', '4');
        icon.append(rect, path);
        const channelText = document.createElement('span');
        appendHighlighted(channelText, item.channel, tokens);
        channel.append(icon, channelText);

        body.append(name, desc, channel);
        card.append(idx, body);
        grid.appendChild(card);
      });

      section.append(head, grid);
      return section;

        pill.className = 'meta-pill' + (index === 1 ? ' gold' : '');
        pill.textContent = item;
        heroMeta.appendChild(pill);
      });

      const queryTokens = getTokens(activeQuery);
      let totalWords = 0;
      DATA[currentLang].categories.forEach(cat => cat.items.forEach(item => {
        totalWords += countWords(item.name) + countWords(item.desc) + countWords(item.channel);
      }));

      let visibleItems = 0;
      let shownWords = 0;
      let matches = 0;
      const visibleCategories = [];

      DATA[currentLang].categories.forEach(cat => {
        const categoryText = cat.title + ' ' + cat.kicker;
        const categoryMatches = tokenMatches(categoryText, queryTokens);
        const visible = cat.items.filter(item => {
          if (!activeQuery) return true;
          if (categoryMatches) return true;
          const itemText = [item.name, item.desc, item.channel, ALIASES[item.id] || ''].join(' ');
          return tokenMatches(itemText, queryTokens);
        });
        if (visible.length) {
          visibleCategories.push({ ...cat, visibleItems: visible });
          visibleItems += visible.length;
          visible.forEach(item => { shownWords += countWords(item.name) + countWords(item.desc) + countWords(item.channel); });
        }
      });

      categoriesEl.replaceChildren();
      visibleCategories.forEach(cat => {
        const section = renderCategory(cat, lang, queryTokens);
        categoriesEl.appendChild(section);
        if (activeQuery) {
          const textFields = [cat.title, cat.kicker].concat(cat.visibleItems.reduce((acc, item) => acc.concat([item.name, item.desc, item.channel, ALIASES[item.id] || '']), []));
          textFields.forEach(text => { matches += findRanges(text, queryTokens).length; });
        }
      });

      emptyState.classList.toggle('visible', visibleItems === 0);
      renderToc(visibleCategories, lang);
      updateMetaCounts(lang, visibleCategories, visibleItems, shownWords, totalWords, matches);

      document.getElementById('searchClear').classList.toggle('visible', Boolean(activeQuery));
      document.getElementById('searchClear').setAttribute('aria-hidden', activeQuery ? 'false' : 'true');
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.setAttribute('aria-pressed', String(btn.dataset.lang === currentLang));
      });

    });
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.themeChoice));
    });
    document.getElementById('fontUp').addEventListener('click', () => setReadingScale(readingScale + 0.06));
    document.getElementById('fontDown').addEventListener('click', () => setReadingScale(readingScale - 0.06));
    window.addEventListener('online', render);
    window.addEventListener('offline', render);
    window.addEventListener('scroll', () => {
      topLink.classList.toggle('visible', window.scrollY > 600);
    }, { passive: true });

    const storedLang = safeGet(LANG_KEY);
    const storedTheme = safeGet(THEME_KEY);
    const storedSize = parseFloat(safeGet(SIZE_KEY) || '1');
    if (storedLang && DATA[storedLang]) currentLang = storedLang;
    if (storedTheme && ['sepia', 'light', 'dark'].includes(storedTheme)) currentTheme = storedTheme;
    if (!Number.isNaN(storedSize)) readingScale = Math.max(0.86, Math.min(1.26, storedSize));

    setTheme(currentTheme);
    setReadingScale(readingScale);
    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
