<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#e2e8f0;--muted:#94a3b8;--accent:#d4af37;--on-accent:#111;--border:#2a2a2a}

*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;transition:background .3s,color .3s;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;margin-bottom:20px}
.top-controls{display:flex;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pill{display:flex;gap:4px;background:var(--card);padding:4px 8px;border-radius:20px;border:1px solid var(--border)}
.pill button{background:none;border:none;cursor:pointer;font-size:.85rem;padding:5px 9px;border-radius:12px;color:var(--text)}
.pill button.active{background:var(--accent);color:var(--on-accent)}
h1{font-size:1.5rem;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:.85rem;line-height:1.5}
.search-container{max-width:800px;margin:0 auto 18px;width:100%}
.search-input{width:100%;padding:12px 18px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem}
.search-input:focus{outline:none;border-color:var(--accent)}
.count{max-width:800px;margin:0 auto 10px;font-size:.8rem;color:var(--muted);width:100%}
main{flex:1}
.grid{display:flex;flex-direction:column;gap:14px;max-width:800px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px}
.card-top{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:10px;align-items:start}
.avatar{position:relative;width:65px;height:65px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:#2a2a2a;border:2px solid var(--accent);flex-shrink:0}
.avatar .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:1.55rem;line-height:1}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.head-info{min-width:0;align-self:center}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.name{font-size:1.1rem;font-weight:700;color:var(--accent);margin:0}
.tag{background:rgba(212,175,55,.15);color:var(--accent);font-size:.75rem;padding:3px 8px;border-radius:6px;border:1px solid var(--accent)}
.desc-wrap{grid-column:1 / -1;width:100%}
.desc{font-size:.85rem;color:var(--muted);line-height:1.7;margin:0 0 8px;text-align:justify}
.desc:last-child{margin-bottom:0}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:9px;font-size:.85rem;font-weight:600;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;text-align:center;display:inline-block;cursor:pointer}
.btn:hover{background:var(--border)}
.btn{transition:opacity .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.7}
.empty{text-align:center;color:var(--muted);padding:20px}
footer{text-align:center;margin-top:30px;padding:15px 0;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>

// Optional per-person overrides: img, yt (full URLs). Leave out to use defaults.
var scholars = [{"n":"01","name":{"ar":"الدكتور هيثم طلعت","en":"Dr. Haitham Talaat","fr":"Dr Haïtham Talaat","es":"Dr. Haitham Talaat"},"website":"https://haithamt.com/","tag":{"ar":"نقد الإلحاد","en":"critique of atheism","fr":"critique de l'athéisme","es":"crítica del ateísmo"},"desc":{"ar":"الدكتور هيثم طلعت طبيب وباحث مصري وُلد في ستينيات القرن العشرين في مصر، وأصبح من أبرز الأصوات العربية المعاصرة في نقد الإلحاد والرد على الشبهات الفكرية. جمع في مسيرته بين التكوين الطبي والاهتمام بالفلسفة والمنطق والعلاقة بين العلم والإيمان، مما منحه قدرة على مخاطبة الجمهور المتخصص والعام معًا.\n\nيركز في محاضراته وكتاباته على تفكيك دعاوى الإلحاد الجديد ومناقشة قضايا الوعي والسببية والأخلاق من منظور علمي وعقلي، مع عرض الحجج الإيمانية بلغة منهجية واضحة. وله حضور رقمي واسع عبر محاضرات مرئية ومقالات ومواد تعليمية تسعى إلى بناء وعي نقدي رصين لدى الشباب المسلم.","en":"Dr. Haitham Talaat is an Egyptian physician and researcher, born in Egypt in the 1960s, who has become one of the most prominent contemporary Arabic voices in critiquing atheism and addressing intellectual doubts. His path combines medical training with a sustained interest in philosophy, logic, and the relationship between science and faith, enabling him to speak to both specialist and general audiences.\n\nIn his lectures and writings he focuses on dismantling the claims of New Atheism and discussing questions of consciousness, causality, and morality from scientific and rational perspectives, while presenting the case for faith in a clear, methodical language. He maintains a wide digital presence through video lectures, articles, and educational materials aimed at fostering critical and grounded awareness among Muslim youth.","fr":"Le Dr Haïtham Talaat est un médecin et chercheur égyptien, né en Égypte dans les années 1960, devenu l’une des voix arabes contemporaines les plus en vue dans la critique de l’athéisme et la réponse aux doutes intellectuels. Son parcours associe une formation médicale à un intérêt approfondi pour la philosophie, la logique et la relation entre science et foi, ce qui lui permet de s’adresser aussi bien au public spécialisé qu’au grand public.\n\nDans ses conférences et ses écrits, il s’attache à déconstruire les thèses du nouvel athéisme et à examiner les questions de la conscience, de la causalité et de la morale dans une perspective scientifique et rationnelle, tout en exposant les arguments de la foi dans un langage méthodique et clair. Il bénéficie d’une large présence numérique grâce à des conférences vidéo, des articles et des supports pédagogiques destinés à renforcer l’esprit critique des jeunes musulmans.","es":"El Dr. Haitham Talaat es un médico e investigador egipcio, nacido en Egipto en la década de 1960, que se ha convertido en una de las voces árabes contemporáneas más destacadas en la crítica del ateísmo y la respuesta a las dudas intelectuales. Su trayectoria combina la formación médica con un interés constante por la filosofía, la lógica y la relación entre ciencia y fe, lo que le permite dirigirse tanto a públicos especializados como generales.\n\nEn sus conferencias y escritos se centra en desmontar las tesis del nuevo ateísmo y en abordar cuestiones de conciencia, causalidad y moral desde perspectivas científicas y racionales, presentando los argumentos de la fe con un lenguaje claro y metódico. Mantiene una amplia presencia digital mediante conferencias en vídeo, artículos y materiales educativos orientados a fomentar una conciencia crítica y sólida entre los jóvenes musulmanes."}},{"n":"02","name":{"ar":"الشيخ زين خير الله","en":"Sheikh Zain Khairallah","fr":"Cheikh Zaïn Khaïrallah","es":"Sheij Zain Khairallah"},"website":"https://www.facebook.com/profile.php?id=100070009880112","tag":{"ar":"مناظرات ومقارنة أديان","en":"debate and comparative religion","fr":"débat et religions comparées","es":"debate y religiones comparadas"},"desc":{"ar":"الشيخ زين خير الله باحث وداعية ليبي وُلد في سبعينيات القرن العشرين في ليبيا، اشتهر في مجال مقارنة الأديان والحوار والمناظرة. تلقى تكوينًا شرعيًا ومعرفيًا مكّنه من دراسة النصوص الدينية دراسة تحليلية، مع اهتمام خاص بالأساليب الحوارية الهادئة والمنضبطة.\n\nيركز في نشاطه على عرض الحجج بطريقة عقلية منهجية، والرد على الشبهات المثارة حول الإسلام من خلال الرجوع إلى المصادر الأصلية والنصوص المحققة. وله مشاركات ومحاضرات ومناظرات متداولة رقميًا، عُرف فيها بالهدوء والالتزام بأدب الاختلاف والسعي إلى توضيح المفاهيم بموضوعية.","en":"Sheikh Zain Khairallah is a Libyan researcher and preacher, born in Libya in the 1970s, well known in the fields of comparative religion, dialogue, and debate. His religious and intellectual formation enabled him to study religious texts analytically, with particular attention to calm and disciplined methods of discussion.\n\nHis work focuses on presenting arguments in a rational, methodical manner and responding to objections raised about Islam by returning to primary sources and verified texts. He is known for widely shared lectures and debates in which he demonstrates composure, respect for the ethics of disagreement, and a commitment to clarifying concepts with objectivity.","fr":"Le cheikh Zaïn Khaïrallah est un chercheur et prédicateur libyen, né en Libye dans les années 1970, reconnu dans les domaines des religions comparées, du dialogue et du débat. Sa formation religieuse et intellectuelle lui a permis d’étudier les textes religieux de manière analytique, avec une attention particulière aux méthodes de discussion calmes et rigoureuses.\n\nSon activité consiste à présenter les arguments de façon rationnelle et méthodique et à répondre aux objections formulées contre l’islam en revenant aux sources originales et aux textes vérifiés. Il est connu pour ses conférences et débats largement diffusés, où il fait preuve de calme, de respect de l’éthique du désaccord et d’un souci constant de clarifier les concepts avec objectivité.","es":"El sheij Zain Khairallah es un investigador y predicador libio, nacido en Libia en la década de 1970, reconocido en los ámbitos de las religiones comparadas, el diálogo y el debate. Su formación religiosa e intelectual le permitió estudiar los textos religiosos de manera analítica, con especial atención a métodos de discusión serenos y disciplinados.\n\nSu labor se centra en presentar argumentos de forma racional y metódica y en responder a las objeciones planteadas sobre el islam recurriendo a las fuentes originales y a los textos verificados. Es conocido por conferencias y debates ampliamente difundidos en los que demuestra serenidad, respeto por la ética del desacuerdo y un compromiso con la clarificación objetiva de los conceptos."}},{"n":"03","name":{"ar":"الدكتور سامي عامري","en":"Dr. Sami Ameri","fr":"Dr Sami Ameri","es":"Dr. Sami Ameri"},"website":"https://samiameri.almobadarah.com/","tag":{"ar":"فلسفة ونقد الإلحاد","en":"philosophy and critique of atheism","fr":"philosophie et critique de l'athéisme","es":"filosofía y crítica del ateísmo"},"desc":{"ar":"الدكتور سامي عامري باحث ومفكر تونسي وُلد في سبعينيات القرن العشرين في تونس، يُعنى بالفلسفة المعاصرة ونقد الإلحاد ودراسة الأسس المعرفية والأخلاقية للفكر الحديث. يجمع في أعماله بين الطرح الأكاديمي والاهتمام بقضايا الإيمان التي تشغل الشباب في الفضاء الفكري المعاصر.\n\nيتناول في دراساته ومحاضراته موضوعات مثل حدود المنهج العلمي، وأسئلة المعنى والقيم، ونقد المادية والإلحاد، مقدّمًا حججًا فلسفية بأسلوب واضح ومنهجي. ويسهم من خلال مقالاته ومشاركاته الرقمية في إثراء النقاش العقلاني حول الدين والعلم والأخلاق في العالم العربي.","en":"Dr. Sami Ameri is a Tunisian researcher and thinker, born in Tunisia in the 1970s, concerned with contemporary philosophy, the critique of atheism, and the study of the epistemological and ethical foundations of modern thought. His work bridges academic inquiry with attention to questions of faith that engage young people in today's intellectual landscape.\n\nIn his studies and lectures he addresses topics such as the limits of the scientific method, questions of meaning and values, and critiques of materialism and atheism, offering philosophical arguments in a clear and systematic style. Through his articles and digital contributions he enriches rational discussion about religion, science, and ethics in the Arab world.","fr":"Le Dr Sami Ameri est un chercheur et penseur tunisien, né en Tunisie dans les années 1970, qui s’intéresse à la philosophie contemporaine, à la critique de l’athéisme et à l’étude des fondements épistémologiques et éthiques de la pensée moderne. Ses travaux articulent la réflexion académique et l’attention portée aux questions de foi qui préoccupent les jeunes dans le paysage intellectuel actuel.\n\nDans ses études et conférences, il aborde des thèmes tels que les limites de la méthode scientifique, les questions de sens et de valeurs, ainsi que la critique du matérialisme et de l’athéisme, en proposant des arguments philosophiques dans un style clair et méthodique. Par ses articles et ses contributions numériques, il enrichit le débat rationnel sur la religion, la science et l’éthique dans le monde arabe.","es":"El Dr. Sami Ameri es un investigador y pensador tunecino, nacido en Túnez en la década de 1970, dedicado a la filosofía contemporánea, la crítica del ateísmo y el estudio de los fundamentos epistemológicos y éticos del pensamiento moderno. Su trabajo combina la reflexión académica con la atención a las cuestiones de fe que preocupan a los jóvenes en el panorama intelectual actual.\n\nEn sus estudios y conferencias aborda temas como los límites del método científico, las cuestiones de sentido y valores, y la crítica del materialismo y el ateísmo, ofreciendo argumentos filosóficos con un estilo claro y sistemático. A través de sus artículos y aportaciones digitales enriquece el debate racional sobre religión, ciencia y ética en el mundo árabe."}},{"n":"04","name":{"ar":"الشيخ وليد إسماعيل","en":"Sheikh Walid Ismail","fr":"Cheikh Walid Ismaïl","es":"Sheij Walid Ismail"},"website":"https://www.waleedismail.com/","tag":{"ar":"مقارنة أديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الشيخ وليد إسماعيل داعية وباحث مصري وُلد في سبعينيات القرن العشرين في مصر، متخصص في مقارنة الأديان والدعوة والحوار. عُرف بجهوده في الرد على الشبهات المثارة حول الإسلام، وباهتمامه بتقديم الصورة الصحيحة للدين من خلال الاستناد إلى المصادر المعتمدة.\n\nيعتمد في أسلوبه على الجمع بين الطرح العلمي واللغة الواضحة، مع الحرص على أدب الحوار والمناظرة. وله دروس ومحاضرات ومشاركات مرئية تناقش قضايا العقيدة والنصوص، وتستهدف تثبيت المعرفة وتصحيح المفاهيم لدى المتلقي العربي وغير العربي.","en":"Sheikh Walid Ismail is an Egyptian preacher and researcher, born in Egypt in the 1970s, specializing in comparative religion, da'wah, and dialogue. He is known for his efforts to respond to objections raised about Islam and for his commitment to presenting an accurate understanding of the faith grounded in authoritative sources.\n\nHis approach combines scholarly presentation with clear language, while maintaining the ethics of dialogue and debate. Through lessons, lectures, and video contributions he addresses questions of creed and scripture, aiming to strengthen knowledge and correct misconceptions among Arabic and non-Arabic audiences.","fr":"Le cheikh Walid Ismaïl est un prédicateur et chercheur égyptien, né en Égypte dans les années 1970, spécialisé dans les religions comparées, la da'wa et le dialogue. Il est connu pour ses efforts visant à répondre aux objections formulées contre l’islam et pour son souci de présenter une compréhension juste de la foi en s’appuyant sur des sources faisant autorité.\n\nSon approche allie exposé savant et langage clair, tout en respectant l’éthique du dialogue et du débat. À travers des cours, des conférences et des interventions vidéo, il traite des questions de croyance et de textes sacrés, dans le but de consolider les connaissances et de corriger les idées reçues auprès des publics arabophones et non arabophones.","es":"El sheij Walid Ismail es un predicador e investigador egipcio, nacido en Egipto en la década de 1970, especializado en religiones comparadas, da'wa y diálogo. Es conocido por sus esfuerzos para responder a las objeciones planteadas sobre el islam y por su compromiso con presentar una comprensión fiel de la fe basada en fuentes autorizadas.\n\nSu enfoque combina la exposición rigurosa con un lenguaje claro, manteniendo la ética del diálogo y el debate. Mediante lecciones, conferencias y aportaciones en vídeo aborda cuestiones de creencia y escritura, con el objetivo de afianzar el conocimiento y corregir ideas erróneas entre públicos árabes y no árabes."}},{"n":"05","name":{"ar":"الشيخ رامي عيسى","en":"Sheikh Rami Issa","fr":"Cheikh Rami Issa","es":"Sheij Rami Issa"},"website":"https://www.ramy-essa.com/home.aspx","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ رامي عيسى داعية ومربي مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بقضايا العقيدة الإسلامية والرد على الشبهات المعاصرة. نشط في تقديم محتوى تعليمي مبسط يربط بين النص الشرعي والفهم العقلاني، مع التركيز على بناء اليقين لدى الشباب.\n\nيقدّم عبر دروسه ومحاضراته ومقاطعِه المرئية معالجة هادئة ومنهجية للمسائل الإيمانية والفكرية، ويسعى إلى ترسيخ القيم والأخلاق الإسلامية في سياق يتسم بتنوع الطروحات الفكرية. ويحرص في خطابه على الوضوح والرفق، مع توجيه المتلقي إلى مصادر العلم الموثوقة.","en":"Sheikh Rami Issa is an Egyptian preacher and educator, born in Egypt in the 1970s, concerned with Islamic creed and responses to contemporary doubts. He is active in producing accessible educational content that connects scriptural texts with rational understanding, with a focus on strengthening certainty among young people.\n\nThrough his lessons, lectures, and video materials he offers calm, methodical treatments of questions of faith and thought, seeking to ground Islamic values and ethics in a context marked by diverse intellectual currents. His discourse emphasizes clarity and compassion while guiding audiences toward reliable sources of knowledge.","fr":"Le cheikh Rami Issa est un prédicateur et éducateur égyptien, né en Égypte dans les années 1970, attaché aux questions de croyance islamique et aux réponses aux doutes contemporains. Il est actif dans la production de contenus pédagogiques accessibles reliant les textes scripturaires à la compréhension rationnelle, avec un accent particulier sur le renforcement de la certitude chez les jeunes.\n\nÀ travers ses cours, conférences et vidéos, il propose un traitement calme et méthodique des questions de foi et de pensée, cherchant à ancrer les valeurs et l’éthique islamiques dans un contexte marqué par la diversité des courants intellectuels. Son discours privilégie la clarté et la bienveillance, tout en orientant le public vers des sources de savoir fiables.","es":"El sheij Rami Issa es un predicador y educador egipcio, nacido en Egipto en la década de 1970, interesado en las cuestiones de la creencia islámica y en las respuestas a las dudas contemporáneas. Desarrolla contenidos educativos accesibles que conectan los textos sagrados con la comprensión racional, con especial atención al fortalecimiento de la certeza entre los jóvenes.\n\nA través de sus lecciones, conferencias y materiales en vídeo ofrece un tratamiento sereno y metódico de las cuestiones de fe y pensamiento, buscando afianzar los valores y la ética islámicos en un contexto marcado por diversas corrientes intelectuales. Su discurso destaca por la claridad y la benevolencia, orientando al público hacia fuentes de conocimiento fiables."}},{"n":"06","name":{"ar":"د. خالد الحايك","en":"Dr. Khaled al-Hayek","fr":"Dr. Khaled al-Hayek","es":"Dr. Khaled al-Hayek"},"website":"https://www.addyaiya.com/","tag":{"ar":"علوم الحديث","en":"Hadith Sciences","fr":"Sciences du hadith","es":"Ciencias del hadiz"},"desc":{"ar":"الدكتور خالد الحايك باحث سوري وُلد في ستينيات القرن العشرين في سوريا، تخصص في علوم الحديث الشريف وتاريخ السنة النبوية. عُرف بعنايته بالتحقيق العلمي للنصوص الحديثية ودراسة أسانيدها ومتونها، وباهتمامه بتقريب علوم الحديث إلى القراء والباحثين.\n\nيقدّم من خلال موقعه «الضيائية» وكتبه ومحاضراته مواد علمية في تخريج الأحاديث ودراسة الأسانيد والرد على الاشتباهات المثارة حول السنة. ويجمع في عمله بين المنهجية الأكاديمية والحرص على خدمة التراث النبوي ونشر الوعي العلمي بمنهج المحدثين.","en":"Dr. Khaled al-Hayek is a Syrian researcher, born in Syria in the 1960s, specializing in the sciences of Hadith and the history of the Prophetic Sunnah. He is known for his careful scholarly verification of hadith texts and for studying their chains of transmission and meanings, as well as for making hadith sciences accessible to readers and researchers.\n\nThrough his platform “al-Diya’iyya”, his books, and his lectures, he provides scholarly material on hadith evaluation, chains of narration, and responses to doubts raised about the Sunnah. His work combines academic rigor with a commitment to serving the Prophetic tradition and promoting awareness of the methodology of hadith scholars.","fr":"Le Dr Khaled al-Hayek est un chercheur syrien, né en Syrie dans les années 1960, spécialisé dans les sciences du hadith et l’histoire de la Sunna prophétique. Il est reconnu pour sa vérification scientifique rigoureuse des textes hadithiques et pour l’étude de leurs chaînes de transmission et de leurs significations, ainsi que pour ses efforts visant à rendre les sciences du hadith accessibles aux lecteurs et aux chercheurs.\n\nÀ travers sa plateforme « al-Diya’iyya », ses ouvrages et ses conférences, il propose des travaux sur l’évaluation des hadiths, l’étude des chaînes de transmission et les réponses aux doutes soulevés à propos de la Sunna. Son travail allie rigueur académique et engagement au service de la tradition prophétique et de la diffusion de la méthodologie des spécialistes du hadith.","es":"El Dr. Khaled al-Hayek es un investigador sirio, nacido en Siria en la década de 1960, especializado en las ciencias del hadiz y la historia de la Sunna profética. Es conocido por su cuidadosa verificación académica de los textos hadices y por el estudio de sus cadenas de transmisión y significados, así como por acercar las ciencias del hadiz a lectores e investigadores.\n\nA través de su plataforma «al-Diya’iyya», sus libros y sus conferencias, ofrece material académico sobre la evaluación de hadices, las cadenas de narración y las respuestas a las dudas planteadas sobre la Sunna. Su trabajo combina el rigor académico con el compromiso de servir a la tradición profética y difundir la metodología de los especialistas en hadiz."}},{"n":"07","name":{"ar":"خالد الوصابي","en":"Khaled al-Wasabi","fr":"Khaled al-Wasabi","es":"Khaled al-Wasabi"},"website":"","tag":{"ar":"الأديان المقارنة","en":"Comparative Religions","fr":"Religions comparées","es":"Religiones comparadas"},"desc":{"ar":"خالد الوصابي باحث وداعية يمني وُلد في سبعينيات القرن العشرين في اليمن، يهتم بمقارنة الأديان والرد على الشبهات الفكرية والعقدية. عُرف بنشاطه في الحوار مع أتباع الديانات والمذاهب المختلفة، وبحرصه على تتبع الطروحات المثارة ومناقشتها.\n\nيقدّم عبر محاضراته ومقاطعِه المرئية مواد تعتمد على عرض النصوص ومناقشة الحجج، مع التركيز على القضايا الخلافية في العقيدة والتاريخ الديني. ويسعى في خطابه إلى الجمع بين وضوح العرض والالتزام بالمنهج العلمي في البحث والاستدلال، موجّهًا رسالته إلى جمهور واسع في العالم العربي.","en":"Khaled al-Wasabi is a Yemeni researcher and preacher, born in Yemen in the 1970s, focused on comparative religion and responding to intellectual and doctrinal doubts. He is known for his engagement in dialogue with followers of different religions and schools of thought, and for carefully examining and discussing the claims raised in such debates.\n\nThrough his lectures and video materials he presents content grounded in textual evidence and reasoned argument, with particular attention to contested issues of creed and religious history. His discourse seeks to combine clarity of presentation with adherence to a scholarly method of research and argumentation, addressing a broad audience across the Arab world.","fr":"Khaled al-Wasabi est un chercheur et prédicateur yéménite, né au Yémen dans les années 1970, spécialisé dans les religions comparées et la réponse aux doutes intellectuels et doctrinaux. Il est connu pour son engagement dans le dialogue avec les adeptes de différentes religions et courants, ainsi que pour son attention à examiner et discuter les thèses soulevées dans ces débats.\n\nÀ travers ses conférences et ses vidéos, il propose des contenus fondés sur la présentation des textes et la discussion argumentée, avec un intérêt particulier pour les questions controversées de croyance et d’histoire religieuse. Son discours vise à associer clarté de l’exposé et fidélité à une méthode de recherche et d’argumentation rigoureuse, s’adressant à un large public dans le monde arabe.","es":"Khaled al-Wasabi es un investigador y predicador yemení, nacido en Yemen en la década de 1970, centrado en las religiones comparadas y en la respuesta a las dudas intelectuales y doctrinales. Es conocido por su participación en el diálogo con seguidores de distintas religiones y corrientes, y por examinar y debatir con atención las tesis planteadas en esos contextos.\n\nA través de sus conferencias y materiales en vídeo presenta contenidos basados en la exposición de textos y la argumentación razonada, con especial atención a cuestiones controvertidas de creencia e historia religiosa. Su discurso busca combinar la claridad expositiva con la adhesión a un método académico de investigación y argumentación, dirigiéndose a un amplio público en el mundo árabe."},"yt":"https://www.youtube.com/@khaledwesabi"},{"n":"08","name":{"ar":"الشيخ عدنان العرعور","en":"Sheikh Adnan Al-Arour","fr":"Cheikh Adnan Al-Arour","es":"Sheij Adnan Al-Arour"},"website":"https://www.islamwasat.com/","tag":{"ar":"عقيدة ومناظرة","en":"creed and debate","fr":"croyance et débat","es":"creencia y debate"},"desc":{"ar":"الشيخ عدنان العرعور داعية سوري وُلد عام 1948 في مدينة حماة بسوريا، ويُعد من أبرز الشخصيات السلفية المعاصرة في الخطاب العقدي والمناظرة. تلقى تكوينًا شرعيًا في سوريا والسعودية، واشتغل بالتدريس والخطابة والدعوة، مع اهتمام خاص بقضايا العقيدة والرد على المخالفات الفكرية.\n\nاشتهر بدروسه ومحاضراته ومشاركاته الإعلامية في شرح مسائل الاعتقاد والتعريف بالمنهج السلفي، كما عُرف بسلاسل في الرد على الشبهات وبمشاركاته في النقاشات الفكرية والدينية. ترك حضورًا واسعًا في الفضاء الدعوي والإعلامي العربي، ولا سيما عبر المواد المرئية المتداولة.","en":"Sheikh Adnan al-Arour is a Syrian preacher, born in 1948 in the city of Hama, Syria, and is regarded as one of the most prominent contemporary Salafi figures in doctrinal discourse and debate. He received religious training in Syria and Saudi Arabia and worked in teaching, preaching, and da'wah, with particular focus on matters of creed and responses to intellectual deviations.\n\nHe became widely known for his lessons, lectures, and media appearances explaining issues of belief and presenting the Salafi methodology, as well as for series responding to doubts and for participation in religious and intellectual discussions. He left a broad presence in the Arab da'wah and media spheres, especially through widely circulated video materials.","fr":"Le cheikh Adnan al-Arour est un prédicateur syrien, né en 1948 dans la ville de Hama en Syrie, considéré comme l’une des figures salafies contemporaines les plus marquantes dans le discours doctrinal et le débat. Il a reçu une formation religieuse en Syrie et en Arabie saoudite et a exercé dans l’enseignement, la prédication et la da'wa, avec un intérêt particulier pour les questions de croyance et les réponses aux déviations intellectuelles.\n\nIl s’est fait connaître par ses cours, ses conférences et ses interventions médiatiques expliquant les questions de croyance et présentant la méthodologie salafie, ainsi que par des séries répondant aux objections et par sa participation à des discussions religieuses et intellectuelles. Il a laissé une forte présence dans les milieux de la da'wa et des médias arabes, notamment grâce à des contenus vidéo largement diffusés.","es":"El sheij Adnan al-Arour es un predicador sirio, nacido en 1948 en la ciudad de Hama (Siria), considerado una de las figuras salafíes contemporáneas más destacadas en el discurso doctrinal y el debate. Recibió formación religiosa en Siria y Arabia Saudita y trabajó en la enseñanza, la predicación y la da'wa, con especial atención a las cuestiones de creencia y a las respuestas a las desviaciones intelectuales.\n\nSe hizo conocido por sus lecciones, conferencias y apariciones en medios explicando cuestiones de fe y presentando la metodología salafí, así como por series de respuestas a objeciones y por su participación en debates religiosos e intelectuales. Dejó una amplia presencia en los ámbitos de la da'wa y los medios árabes, especialmente a través de materiales en vídeo de gran difusión."}},{"n":"09","name":{"ar":"الشيخ شمائل ندوي","en":"Sheikh Shamail Nadwi","fr":"Cheikh Chamaïl Nadwi","es":"Sheij Shamail Nadwi"},"website":"https://muftishamail.com/","tag":{"ar":"دعوة وتربية","en":"da'wah and education","fr":"da'wa et éducation","es":"da'wa y educación"},"desc":{"ar":"الشيخ شمائل الندوي داعية وعالم هندي شاب وُلد عام 1998 في ولاية البنغال الغربية بالهند، وتخرّج من جامعة دار العلوم لندوة العلماء في لكنؤ. برز في الخطاب الدعوي المعاصر بجمعه بين التكوين الشرعي التقليدي والقدرة على مخاطبة جمهور واسع بالعربية والإنجليزية.\n\nيهتم في دروسه ومحاضراته بالتربية الإيمانية وبناء الشخصية المسلمة، وبعرض معاني القرآن والسنة بأسلوب معاصر قريب من هموم الشباب. وله حضور متنامٍ في المنصات الرقمية واللقاءات الدعوية، حيث يسعى إلى الربط بين العلم الشرعي والواقع المعاش بلغة واضحة ومؤثرة.","en":"Sheikh Shamail Nadwi is a young Indian preacher and scholar, born in 1998 in West Bengal, India, and a graduate of Darul Uloom Nadwatul Ulama in Lucknow. He has emerged in contemporary da'wah discourse by combining traditional religious training with an ability to address wide audiences in both Arabic and English.\n\nIn his lessons and lectures he focuses on faith-based education and the formation of the Muslim personality, presenting the meanings of the Qur’an and Sunnah in a contemporary style that resonates with young people. He has a growing presence on digital platforms and in da'wah gatherings, seeking to connect religious knowledge with lived reality in clear and engaging language.","fr":"Le cheikh Shamaïl Nadwi est un jeune prédicateur et savant indien, né en 1998 au Bengale-Occidental en Inde, diplômé de Darul Uloom Nadwatul Ulama à Lucknow. Il s’est distingué dans le discours contemporain de la da'wa en associant une formation religieuse traditionnelle à la capacité de s’adresser à un large public en arabe et en anglais.\n\nDans ses cours et conférences, il s’intéresse à l’éducation spirituelle et à la formation de la personnalité musulmane, en présentant les enseignements du Coran et de la Sunna dans un style contemporain proche des préoccupations des jeunes. Il bénéficie d’une présence croissante sur les plateformes numériques et dans les rencontres de prédication, cherchant à relier le savoir religieux au vécu quotidien dans un langage clair et accessible.","es":"El sheij Shamail Nadwi es un joven predicador y erudito indio, nacido en 1998 en Bengala Occidental (India) y graduado de Darul Uloom Nadwatul Ulama en Lucknow. Ha destacado en el discurso contemporáneo de la da'wa por combinar la formación religiosa tradicional con la capacidad de dirigirse a amplios públicos en árabe e inglés.\n\nEn sus lecciones y conferencias se centra en la educación espiritual y en la formación de la personalidad musulmana, presentando los significados del Corán y la Sunna en un estilo contemporáneo cercano a las inquietudes de los jóvenes. Tiene una presencia creciente en plataformas digitales y encuentros de da'wa, buscando conectar el conocimiento religioso con la realidad cotidiana en un lenguaje claro y cercano."}},{"n":"10","name":{"ar":"الدكتور إياد قنيبي","en":"Dr. Iyad Qunaibi","fr":"Dr Iyad Qounaïbi","es":"Dr. Iyad Qunaibi"},"website":"https://eyadqunaibi.com/","tag":{"ar":"فكر معاصر ونقد الإلحاد","en":"contemporary thought and critique of atheism","fr":"pensée contemporaine et critique de l'athéisme","es":"pensamiento contemporáneo y crítica del ateísmo"},"desc":{"ar":"الدكتور إياد قنيبي داعية ومفكر إسلامي فلسطيني وُلد عام 1975 في الكويت ونشأ في الأردن، ويحمل تكوينًا أكاديميًا في الصيدلة إضافة إلى اهتمامه الواسع بالفكر الإسلامي والقضايا المعاصرة. اشتهر بخطابه المؤثر في نقد الإلحاد والتيارات الفكرية الحديثة، وبحضوره البارز في الفضاء الرقمي.\n\nيركز في محاضراته وكتاباته على معالجة قضايا الهوية والإيمان والثوابت في مواجهة الشبهات، وعلى بناء وعي شبابي يجمع بين العمق الفكري والبعد التربوي. ويقدّم مواد متنوعة في العقيدة والفكر والتزكية، عُرف فيها بالأسلوب المباشر والمنهجية في عرض الأفكار.","en":"Dr. Iyad Qunaibi is a Palestinian Islamic preacher and thinker, born in 1975 in Kuwait and raised in Jordan, with an academic background in pharmacy alongside a broad engagement with Islamic thought and contemporary issues. He is widely known for his influential discourse critiquing atheism and modern intellectual currents, and for his prominent presence in the digital sphere.\n\nIn his lectures and writings he focuses on addressing questions of identity, faith, and core principles in the face of doubts, and on fostering youth awareness that combines intellectual depth with moral formation. He offers diverse materials on creed, thought, and spiritual development, recognized for a direct style and methodical presentation of ideas.","fr":"Le Dr Iyad Qounaïbi est un prédicateur et penseur islamique palestinien, né en 1975 au Koweït et ayant grandi en Jordanie, doté d’une formation académique en pharmacie et d’un large intérêt pour la pensée islamique et les questions contemporaines. Il est largement connu pour son discours influent critiquant l’athéisme et les courants intellectuels modernes, ainsi que pour sa forte présence dans l’espace numérique.\n\nDans ses conférences et ses écrits, il s’attache à traiter les questions d’identité, de foi et de principes face aux doutes, et à développer une conscience chez les jeunes qui allie profondeur intellectuelle et dimension éducative. Il propose des contenus variés sur la croyance, la pensée et la purification spirituelle, reconnus pour leur style direct et leur présentation méthodique des idées.","es":"El Dr. Iyad Qunaibi es un predicador y pensador islámico palestino, nacido en 1975 en Kuwait y criado en Jordania, con formación académica en farmacia además de un amplio interés por el pensamiento islámico y las cuestiones contemporáneas. Es ampliamente conocido por su influyente discurso crítico con el ateísmo y las corrientes intelectuales modernas, y por su destacada presencia en el ámbito digital.\n\nEn sus conferencias y escritos se centra en abordar cuestiones de identidad, fe y principios fundamentales frente a las dudas, y en fomentar una conciencia juvenil que combine profundidad intelectual y dimensión formativa. Ofrece materiales diversos sobre creencia, pensamiento y desarrollo espiritual, reconocidos por un estilo directo y una presentación metódica de las ideas."}},{"n":"11","name":{"ar":"الدكتور عبد الله العجيري","en":"Dr. Abdullah Al-Ajiri","fr":"Dr Abdallah Al-Ajiri","es":"Dr. Abdullah Al-Ajiri"},"website":"","tag":{"ar":"فكر معاصر","en":"contemporary thought","fr":"pensée contemporaine","es":"pensamiento contemporáneo"},"desc":{"ar":"الدكتور عبد الله العجيري باحث ومفكر كويتي وُلد في سبعينيات القرن العشرين في الكويت، يُعنى بالفكر الإسلامي المعاصر وقضايا الوعي والمنهج وبناء الشخصية. يجمع في أعماله بين الاهتمام بالتراث الفكري الإسلامي والاشتغال على إشكالات الواقع الثقافي والاجتماعي.\n\nيقدّم من خلال كتبه ومحاضراته مقاربات تربوية وفكرية تستهدف الشباب، مركّزًا على تنمية التفكير النقدي وتعزيز الانتماء القيمي. ويسعى في طرحه إلى تقديم خطاب متوازن يجمع بين العمق المعرفي والوضوح، مع اهتمام خاص بقضايا التعليم والنهضة والهوية.","en":"Dr. Abdullah al-Ajiri is a Kuwaiti researcher and thinker, born in Kuwait in the 1970s, concerned with contemporary Islamic thought, questions of awareness and methodology, and character development. His work combines engagement with the Islamic intellectual heritage and reflection on the challenges of contemporary cultural and social life.\n\nThrough his books and lectures he offers educational and intellectual approaches aimed at young people, focusing on developing critical thinking and strengthening value-based identity. His discourse seeks to provide a balanced perspective that brings together depth of knowledge and clarity, with particular attention to education, renewal, and identity.","fr":"Le Dr Abdallah al-Ajiri est un chercheur et penseur koweïtien, né au Koweït dans les années 1970, qui s’intéresse à la pensée islamique contemporaine, aux questions de conscience et de méthodologie, ainsi qu’à la formation de la personnalité. Ses travaux associent l’étude du patrimoine intellectuel islamique à la réflexion sur les défis de la réalité culturelle et sociale actuelle.\n\nÀ travers ses ouvrages et conférences, il propose des approches éducatives et intellectuelles destinées aux jeunes, en mettant l’accent sur le développement de la pensée critique et le renforcement de l’identité fondée sur les valeurs. Son discours vise à offrir une perspective équilibrée alliant profondeur du savoir et clarté, avec une attention particulière à l’éducation, au renouveau et à l’identité.","es":"El Dr. Abdullah al-Ajiri es un investigador y pensador kuwaití, nacido en Kuwait en la década de 1970, dedicado al pensamiento islámico contemporáneo, las cuestiones de conciencia y metodología, y la formación del carácter. Su obra combina el interés por el patrimonio intelectual islámico con la reflexión sobre los desafíos de la realidad cultural y social actual.\n\nA través de sus libros y conferencias ofrece enfoques educativos e intelectuales dirigidos a los jóvenes, centrados en el desarrollo del pensamiento crítico y el fortalecimiento de la identidad basada en valores. Su discurso busca ofrecer una perspectiva equilibrada que una profundidad de conocimiento y claridad, con especial atención a la educación, la renovación y la identidad."}},{"n":"12","name":{"ar":"أحمد بن يوسف السيد","en":"Ahmed bin Yusuf al-Sayyid","fr":"Ahmed bin Yusuf al-Sayyid","es":"Ahmed bin Yusuf al-Sayyid"},"website":"https://ahmadalsayed.net/books","tag":{"ar":"دعوة وبناء معرفي","en":"Da'wah and intellectual development","fr":"Prédication et formation intellectuelle","es":"Da'wa y desarrollo intelectual"},"desc":{"ar":"أحمد بن يوسف السيد داعية وباحث ومؤلف سعودي وُلد عام 1985 في مدينة ينبع بالمملكة العربية السعودية، ونشأ فيها ثم انتقل إلى المدينة المنورة. عُرف بجهوده في التربية الدعوية والبناء المعرفي، وباهتمامه بتحصين الشباب فكريًا وإيمانيًا وصناعة الدعاة والمصلحين، في إطار رسالة تقوم على إحياء منهاج النبوة.\n\nيشرف على عدد من المشاريع والبرامج العلمية والتربوية، من أبرزها برنامج «البناء المنهجي» وبرنامج «برد اليقين» و«أكاديمية الجيل الصاعد»، إلى جانب مبادرات معنية بالرد على الشبهات وبناء الوعي مثل «صناعة المحاور» وموقع «المحاورون». وله مؤلفات ومحاضرات وسلاسل تعليمية في العقيدة والحديث والفكر المعاصر، يسعى من خلالها إلى الجمع بين التأصيل الشرعي والمعالجة المنهجية لقضايا الواقع.","en":"Ahmed bin Yusuf al-Sayyid is a Saudi preacher, researcher, and author, born in 1985 in Yanbu, Saudi Arabia, where he was raised before moving to Madinah. He is known for his work in da'wah-oriented education and intellectual development, with a focus on strengthening young people intellectually and in faith and on cultivating committed reformers, guided by a mission centered on reviving the Prophetic method.\n\nHe oversees several educational and formative projects and programs, most notably “al-Bina’ al-Manhaji” (Methodological Development), “Bard al-Yaqin” (The Coolness of Certainty), and the “Rising Generation Academy,” alongside initiatives addressing doubts and fostering awareness such as “Sina‘at al-Muhawir” (Debater Training) and the “al-Muhawirun” platform. Through his books, lectures, and teaching series on creed, Hadith, and contemporary thought, he seeks to combine sound scholarly foundations with clear, methodical engagement with present-day issues.","fr":"Ahmed bin Yusuf al-Sayyid est un prédicateur, chercheur et auteur saoudien, né en 1985 à Yanbu en Arabie saoudite, où il a grandi avant de s’installer à Médine. Il est connu pour son travail dans l’éducation liée à la da'wa et le développement intellectuel, avec un accent particulier sur le renforcement intellectuel et spirituel des jeunes et sur la formation de réformateurs engagés, dans le cadre d’une mission axée sur la revivification de la voie prophétique.\n\nIl supervise plusieurs projets et programmes éducatifs et formatifs, notamment « al-Bina’ al-Manhaji » (Construction méthodique), « Bard al-Yaqin » (La fraîcheur de la certitude) et « l’Académie de la génération montante », ainsi que des initiatives consacrées à la réponse aux objections et au développement de la conscience, telles que « Sina‘at al-Muhawir » (Formation au débat) et la plateforme « al-Muhawirun ». À travers ses ouvrages, conférences et séries pédagogiques sur la croyance, le hadith et la pensée contemporaine, il s’efforce d’allier des fondements savants solides à un traitement clair et méthodique des questions actuelles.","es":"Ahmed bin Yusuf al-Sayyid es un predicador, investigador y autor saudí, nacido en 1985 en Yanbu (Arabia Saudita), donde se crió antes de trasladarse a Medina. Es conocido por su labor en la educación vinculada a la da'wa y el desarrollo intelectual, con especial atención al fortalecimiento intelectual y espiritual de los jóvenes y a la formación de reformadores comprometidos, guiado por una misión centrada en revivir el método profético.\n\nSupervisa diversos proyectos y programas educativos y formativos, entre los que destacan «al-Bina’ al-Manhaji» (Construcción metodológica), «Bard al-Yaqin» (La frescura de la certeza) y la «Academia de la Generación Joven», además de iniciativas orientadas a responder a las dudas y a fomentar la conciencia, como «Sina‘at al-Muhawir» (Formación en debate) y la plataforma «al-Muhawirun». A través de sus libros, conferencias y series didácticas sobre creencia, hadiz y pensamiento contemporáneo, busca combinar fundamentos académicos sólidos con un abordaje claro y metódico de las cuestiones actuales."}},{"n":"13","name":{"ar":"مهند السويدان (أبو عمر الباحث)","en":"Muhannad al-Suwaidan (Abu Umar al-Bahith)","fr":"Muhannad al-Suwaidan (Abu Umar al-Bahith)","es":"Muhannad al-Suwaidan (Abu Umar al-Bahith)"},"website":"","tag":{"ar":"مقارعة النصيرية","en":"Counter-Nasirism","fr":"Réfutation du nassirisme","es":"Refutación del nasirismo"},"desc":{"ar":"مهند السويدان، المعروف بلقب «أبو عمر الباحث»، باحث سوري وُلد في سبعينيات القرن العشرين في سوريا، اهتم بدراسة مقارنة الأديان والرد على الطروحات الفكرية والعقدية المخالفة. عُرف بنشاطه في تتبع النصوص والمصادر ومناقشتها في سياق الحوار الديني.\n\nيقدّم من خلال محاضراته ومقاطعِه المرئية مواد بحثية تركز على تحليل الأدلة والرد على الشبهات المثارة حول الإسلام، مع اهتمام خاص بقضايا الفرق والمذاهب. ويسعى في عمله إلى عرض مادته بأسلوب مباشر يعتمد على الاستدلال والنقل من المصادر.","en":"Muhannad al-Suwaidan, known as “Abu Umar al-Bahith”, is a Syrian researcher, born in Syria in the 1970s, interested in comparative religion and in responding to opposing intellectual and doctrinal claims. He is known for his work in examining texts and sources and discussing them in the context of religious dialogue.\n\nThrough his lectures and video materials he presents research-focused content centered on analyzing evidence and responding to doubts raised about Islam, with particular attention to issues related to sects and schools of thought. His work aims to present material in a direct style grounded in citation and argumentation from sources.","fr":"Muhannad al-Suwaidan, connu sous le nom d’« Abu Umar al-Bahith », est un chercheur syrien, né en Syrie dans les années 1970, qui s’intéresse aux religions comparées et à la réponse aux thèses intellectuelles et doctrinales opposées. Il est connu pour son travail d’examen des textes et des sources et pour leur discussion dans le cadre du dialogue religieux.\n\nÀ travers ses conférences et ses vidéos, il propose des contenus à vocation documentaire centrés sur l’analyse des preuves et la réponse aux objections soulevées contre l’islam, avec un intérêt particulier pour les questions liées aux sectes et aux courants. Son travail vise à présenter ses matériaux dans un style direct fondé sur la citation et l’argumentation à partir des sources.","es":"Muhannad al-Suwaidan, conocido como «Abu Umar al-Bahith», es un investigador sirio, nacido en Siria en la década de 1970, interesado en las religiones comparadas y en la respuesta a planteamientos intelectuales y doctrinales opuestos. Es conocido por su labor de examen de textos y fuentes y por su discusión en el contexto del diálogo religioso.\n\nA través de sus conferencias y materiales en vídeo presenta contenidos de carácter investigativo centrados en el análisis de pruebas y en la respuesta a las dudas planteadas sobre el islam, con especial atención a cuestiones relacionadas con sectas y corrientes. Su trabajo busca exponer el material de forma directa, basada en la cita y la argumentación a partir de las fuentes."}},{"n":"14","name":{"ar":"الشيخ محمد شاهين التاعب","en":"Sheikh Mohamed Shahin Al-Ta'ib","fr":"Cheikh Mohamed Chahine Al-Ta'ib","es":"Sheij Mohamed Shahin Al-Ta'ib"},"website":"","tag":{"ar":"دعوة ونقد فكري","en":"da'wah and intellectual critique","fr":"da'wa et critique intellectuelle","es":"da'wa y crítica intelectual"},"desc":{"ar":"الشيخ محمد شاهين التاعب داعية مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بقضايا العقيدة والفكر الإسلامي المعاصر والرد على الشبهات. عُرف بأسلوبه التعليمي القريب من الشباب وبحرصه على تبسيط المفاهيم العقدية والفكرية.\n\nيقدّم عبر دروسه وسلاسله المرئية محتوى يجمع بين التأسيس العلمي والمعالجة العملية لقضايا الإيمان والهوية. ويركز في خطابه على بناء الوعي والتحصين الفكري، مع توظيف لغة واضحة وأمثلة قريبة من الواقع المعاصر.","en":"Sheikh Mohamed Shahin al-Ta'ib is an Egyptian preacher, born in Egypt in the 1970s, concerned with matters of creed, contemporary Islamic thought, and responses to doubts. He is known for an educational style that resonates with young people and for his efforts to simplify doctrinal and intellectual concepts.\n\nThrough his lessons and video series he offers content that combines sound foundations with practical engagement with questions of faith and identity. His discourse focuses on building awareness and intellectual resilience, using clear language and examples drawn from contemporary life.","fr":"Le cheikh Mohamed Chahine al-Ta'ib est un prédicateur égyptien, né en Égypte dans les années 1970, qui s’intéresse aux questions de croyance, à la pensée islamique contemporaine et aux réponses aux objections. Il est connu pour un style pédagogique proche des jeunes et pour ses efforts visant à simplifier les concepts doctrinaux et intellectuels.\n\nÀ travers ses cours et séries vidéo, il propose un contenu qui associe fondements solides et traitement concret des questions de foi et d’identité. Son discours met l’accent sur le développement de la conscience et de la résilience intellectuelle, en utilisant un langage clair et des exemples tirés de la réalité contemporaine.","es":"El sheij Mohamed Shahin al-Ta'ib es un predicador egipcio, nacido en Egipto en la década de 1970, interesado en las cuestiones de creencia, el pensamiento islámico contemporáneo y las respuestas a las dudas. Es conocido por un estilo educativo cercano a los jóvenes y por su esfuerzo por simplificar conceptos doctrinales e intelectuales.\n\nA través de sus lecciones y series en vídeo ofrece contenidos que combinan fundamentos sólidos con un abordaje práctico de las cuestiones de fe e identidad. Su discurso se centra en desarrollar la conciencia y la resiliencia intelectual, empleando un lenguaje claro y ejemplos tomados de la realidad contemporánea."}},{"n":"15","name":{"ar":"أحمد سبيع","en":"Ahmed Subai'","fr":"Ahmed Subai'","es":"Ahmed Subai'"},"website":"","tag":{"ar":"أهل الكتاب","en":"People of the Book","fr":"Gens du Livre","es":"Gente del Libro"},"desc":{"ar":"أحمد سبيع باحث مصري وُلد في ثمانينيات القرن العشرين في مصر، متخصص في مقارنة الأديان والحوار مع أهل الكتاب. اهتم بدراسة النصوص الدينية في اليهودية والمسيحية، وبمتابعة الإشكالات الحوارية المطروحة في هذا المجال.\n\nيقدّم عبر محاضراته ومقاطعِه المرئية مواد تعتمد على المقارنة النصية والتحليل المنهجي، مع التركيز على عرض المفاهيم الإسلامية وتصحيح الصور النمطية. ويسعى في نشاطه إلى تعزيز الحوار المبني على المعرفة والاحترام المتبادل والالتزام بالمعايير العلمية في البحث.","en":"Ahmed Subai' is an Egyptian researcher, born in Egypt in the 1980s, specializing in comparative religion and dialogue with the People of the Book. He focuses on studying religious texts in Judaism and Christianity and on engaging with the key questions raised in interfaith dialogue.\n\nThrough his lectures and video materials he presents content based on textual comparison and methodical analysis, with emphasis on explaining Islamic concepts and correcting stereotypes. His work seeks to promote dialogue grounded in knowledge, mutual respect, and adherence to scholarly standards of research.","fr":"Ahmed Subai' est un chercheur égyptien, né en Égypte dans les années 1980, spécialisé dans les religions comparées et le dialogue avec les Gens du Livre. Il s’intéresse à l’étude des textes religieux du judaïsme et du christianisme ainsi qu’aux principales questions soulevées dans le dialogue interreligieux.\n\nÀ travers ses conférences et ses vidéos, il propose des contenus fondés sur la comparaison textuelle et l’analyse méthodique, en mettant l’accent sur la présentation des concepts islamiques et la correction des stéréotypes. Son activité vise à promouvoir un dialogue fondé sur la connaissance, le respect mutuel et le respect des normes scientifiques de la recherche.","es":"Ahmed Subai' es un investigador egipcio, nacido en Egipto en la década de 1980, especializado en religiones comparadas y en el diálogo con la Gente del Libro. Se centra en el estudio de los textos religiosos del judaísmo y el cristianismo y en el tratamiento de las principales cuestiones planteadas en el diálogo interreligioso.\n\nA través de sus conferencias y materiales en vídeo presenta contenidos basados en la comparación textual y el análisis metódico, con énfasis en la exposición de los conceptos islámicos y la corrección de estereotipos. Su labor busca promover un diálogo fundamentado en el conocimiento, el respeto mutuo y la adhesión a los estándares académicos de investigación."}},{"n":"16","name":{"ar":"عبدالله الشهري","en":"Abdullah al-Shahri","fr":"Abdullah al-Shahri","es":"Abdullah al-Shahri"},"website":"","tag":{"ar":"الرد على الإلحاد","en":"Countering Atheism","fr":"Réfutation de l'athéisme","es":"Refutación del ateísmo"},"desc":{"ar":"عبد الله الشهري باحث وداعية سعودي وُلد في ثمانينيات القرن العشرين في المملكة العربية السعودية، ويشغل منصب مدير مركز «بيّنة» المعني بنقد الإلحاد وتعزيز الإيمان. اهتم بدراسة الشبهات الإلحادية المعاصرة وتقديم ردود علمية وفكرية مبنية على الأدلة.\n\nيقدّم من خلال محاضراته ومواد المركز محتوى يركز على قضايا وجود الله، والغاية، والأخلاق، والعلاقة بين الإيمان والعقل. ويسعى في عمله إلى تمكين الشباب من أدوات الحوار والنقد، وبناء خطاب رشيد يجمع بين العمق المعرفي والوضوح في العرض.","en":"Abdullah al-Shahri is a Saudi researcher and preacher, born in Saudi Arabia in the 1980s, and serves as director of the Bayyinah Center, which focuses on critiquing atheism and strengthening faith. He is concerned with studying contemporary atheist doubts and offering scholarly and intellectual responses grounded in evidence.\n\nThrough his lectures and the center’s materials he presents content centered on questions of God’s existence, purpose, morality, and the relationship between faith and reason. His work seeks to equip young people with tools for dialogue and critique, and to build a thoughtful discourse that combines intellectual depth with clarity of presentation.","fr":"Abdullah al-Shahri est un chercheur et prédicateur saoudien, né en Arabie saoudite dans les années 1980, et directeur du centre « Bayyinah », consacré à la critique de l’athéisme et au renforcement de la foi. Il s’intéresse à l’étude des doutes athées contemporains et à la formulation de réponses savantes et intellectuelles fondées sur des preuves.\n\nÀ travers ses conférences et les contenus du centre, il propose des matériaux centrés sur les questions de l’existence de Dieu, du sens, de la morale et de la relation entre foi et raison. Son travail vise à doter les jeunes d’outils de dialogue et de réflexion critique, et à construire un discours réfléchi alliant profondeur intellectuelle et clarté.","es":"Abdullah al-Shahri es un investigador y predicador saudí, nacido en Arabia Saudita en la década de 1980, y director del Centro Bayyinah, dedicado a la crítica del ateísmo y al fortalecimiento de la fe. Se interesa por el estudio de las dudas ateas contemporáneas y por ofrecer respuestas académicas e intelectuales fundamentadas en evidencias.\n\nA través de sus conferencias y los materiales del centro presenta contenidos centrados en cuestiones como la existencia de Dios, el propósito, la moral y la relación entre fe y razón. Su labor busca dotar a los jóvenes de herramientas para el diálogo y la crítica, y construir un discurso reflexivo que combine profundidad intelectual y claridad expositiva."}},{"n":"17","name":{"ar":"حمزة تزورتزيس","en":"Hamza Tzortzis","fr":"Hamza Tzortzis","es":"Hamza Tzortzis"},"website":"https://www.hamzatzortzis.com/","tag":{"ar":"فلسفة ومناظرة","en":"philosophy and debate","fr":"philosophie et débat","es":"filosofía y debate"},"desc":{"ar":"حمزة أندرياس تزورتزيس باحث ومتحدث بريطاني وُلد عام 1980 لأبوين يونانيين في المملكة المتحدة، واعتنق الإسلام عام 2002. تخصص في الفلسفة والدراسات الإسلامية، واشتهر عالميًا بمشاركته في حوارات ومناظرات حول وجود الله والإلحاد والأخلاق والنبوة.\n\nأسهم في تأسير مبادرات دعوية وفكرية مثل «iERA»، وكتب وقدم محاضرات تهدف إلى عرض الحجج العقلية للإيمان الإسلامي بأسلوب منهجي معاصر. ويجمع في عمله بين العمق الفلسفي والاهتمام بقضايا الشباب في المجتمعات الغربية، مع حضور واسع في المنصات الإعلامية والجامعية.","en":"Hamza Andreas Tzortzis is a British researcher and speaker, born in 1980 in the United Kingdom to Greek parents, who embraced Islam in 2002. He specializes in philosophy and Islamic studies and is internationally known for his participation in dialogues and debates on the existence of God, atheism, ethics, and prophethood.\n\nHe contributed to founding da'wah and intellectual initiatives such as iERA, and has written and lectured to present rational arguments for the Islamic faith in a contemporary, methodical style. His work combines philosophical depth with attention to the concerns of young people in Western societies, and he maintains a wide presence across media and academic platforms.","fr":"Hamza Andreas Tzortzis est un chercheur et conférencier britannique, né en 1980 au Royaume-Uni de parents grecs, qui a embrassé l’islam en 2002. Spécialisé en philosophie et en études islamiques, il est connu internationalement pour sa participation à des dialogues et débats sur l’existence de Dieu, l’athéisme, l’éthique et la prophétie.\n\nIl a contribué à la création d’initiatives de da'wa et de réflexion telles qu’iERA, et a écrit et donné des conférences visant à présenter les arguments rationnels en faveur de la foi islamique dans un style contemporain et méthodique. Son travail allie profondeur philosophique et attention aux préoccupations des jeunes dans les sociétés occidentales, avec une large présence sur les plateformes médiatiques et universitaires.","es":"Hamza Andreas Tzortzis es un investigador y conferenciante británico, nacido en 1980 en el Reino Unido de padres griegos, que abrazó el islam en 2002. Se especializa en filosofía y estudios islámicos y es conocido internacionalmente por su participación en diálogos y debates sobre la existencia de Dios, el ateísmo, la ética y la profecía.\n\nContribuyó a la fundación de iniciativas de da'wa e intelectuales como iERA, y ha escrito e impartido conferencias para presentar argumentos racionales a favor de la fe islámica con un estilo contemporáneo y metódico. Su trabajo combina la profundidad filosófica con la atención a las inquietudes de los jóvenes en las sociedades occidentales, manteniendo una amplia presencia en plataformas mediáticas y académicas."}},{"n":"18","name":{"ar":"محمد حجاب","en":"Mohammed Hijab","fr":"Mohammed Hijab","es":"Mohammed Hijab"},"website":"https://www.mohammedhijab.com/","tag":{"ar":"مناظرات وفلسفة","en":"debate and philosophy","fr":"débat et philosophie","es":"debate y filosofía"},"desc":{"ar":"محمد حجاب داعية ومناظر بريطاني وُلد في 5 أكتوبر 1991 في لندن بإنجلترا لأبوين من أصول مصرية. تلقى تعليمًا أكاديميًا متعددًا في السياسة والتاريخ والدراسات الإسلامية واللاهوت، وبرز في الساحة الدعوية الناطقة بالإنجليزية من خلال المناظرات العامة والحضور الرقمي.\n\nيشارك في نقاشات تتناول الفلسفة والأخلاق والأديان وقضايا الفكر المعاصر، مع تركيز على الدفاع عن الإسلام بالحجة والمنطق. ويُعرف بأسلوبه الجدلي المباشر وبنشاطه في مخاطبة الشباب، كما يسهم في إنتاج محتوى مرئي واسع الانتشار يناقش أسئلة الإيمان والهوية في السياق الغربي.","en":"Mohammed Hijab is a British preacher and debater, born on 5 October 1991 in London, England, to parents of Egyptian origin. He received multidisciplinary academic education in politics, history, Islamic studies, and theology, and rose to prominence in English-speaking da'wah through public debates and a strong digital presence.\n\nHe engages in discussions on philosophy, ethics, religion, and contemporary intellectual issues, focusing on defending Islam through argument and reason. He is known for a direct debating style and active outreach to young people, and contributes to widely viewed video content addressing questions of faith and identity in Western contexts.","fr":"Mohammed Hijab est un prédicateur et débatteur britannique, né le 5 octobre 1991 à Londres en Angleterre de parents d’origine égyptienne. Il a reçu une formation universitaire pluridisciplinaire en politique, histoire, études islamiques et théologie, et s’est fait connaître dans la da'wa anglophone grâce à des débats publics et une forte présence numérique.\n\nIl participe à des discussions portant sur la philosophie, l’éthique, les religions et les questions intellectuelles contemporaines, en se concentrant sur la défense de l’islam par l’argumentation et la raison. Il est reconnu pour son style de débat direct et son engagement auprès des jeunes, et contribue à des contenus vidéo largement diffusés traitant des questions de foi et d’identité dans les contextes occidentaux.","es":"Mohammed Hijab es un predicador y polemista británico, nacido el 5 de octubre de 1991 en Londres (Inglaterra), de padres de origen egipcio. Recibió una formación académica multidisciplinar en política, historia, estudios islámicos y teología, y alcanzó relevancia en la da'wa angloparlante a través de debates públicos y una fuerte presencia digital.\n\nParticipa en discusiones sobre filosofía, ética, religiones y cuestiones intelectuales contemporáneas, centrado en la defensa del islam mediante la argumentación y la razón. Es conocido por su estilo de debate directo y su labor con los jóvenes, y contribuye a contenidos en vídeo ampliamente difundidos que abordan cuestiones de fe e identidad en contextos occidentales."}},{"n":"19","name":{"ar":"الدكتور منقذ السقار","en":"Dr. Munqidh Al-Saqqar","fr":"Dr Mounqidh Al-Saqqar","es":"Dr. Munqidh Al-Saqqar"},"website":"","tag":{"ar":"دراسات دينية","en":"religious studies","fr":"études religieuses","es":"estudios religiosos"},"desc":{"ar":"الدكتور منقذ السقار باحث سوري وُلد في سبعينيات القرن العشرين في سوريا، متخصص في الدراسات الدينية ومقارنة الأديان. اهتم بدراسة الكتب المقدسة والنصوص التراثية وتحليل الأطروحات الفكرية والعقدية المختلفة بمنهجية توثيقية.\n\nقدّم مؤلفات ومحاضرات في نقد بعض الادعاءات التبشيرية والاستشراقية، وفي بيان أوجه الاتفاق والاختلاف بين الأديان، مع الحرص على الاستشهاد بالمصادر الأصلية. ويتميّز عمله بالسعي إلى الدقة في النقل والتحليل، وتقديم مادة علمية تخدم الباحثين والمهتمين بالحوار الديني.","en":"Dr. Munqidh al-Saqqar is a Syrian researcher, born in Syria in the 1970s, specializing in religious studies and comparative religion. He focuses on the study of scriptures and traditional texts and on analyzing diverse intellectual and doctrinal claims through a documentary methodology.\n\nHe has produced books and lectures critiquing certain missionary and orientalist claims and clarifying points of agreement and difference among religions, with careful reference to primary sources. His work is characterized by attention to accuracy in citation and analysis, offering scholarly material for researchers and those interested in interfaith dialogue.","fr":"Le Dr Mounqidh al-Saqqar est un chercheur syrien, né en Syrie dans les années 1970, spécialisé dans les études religieuses et les religions comparées. Il se consacre à l’étude des Écritures et des textes traditionnels ainsi qu’à l’analyse de diverses thèses intellectuelles et doctrinales selon une méthodologie documentaire.\n\nIl a produit des ouvrages et des conférences critiquant certaines thèses missionnaires et orientalistes et clarifiant les points de convergence et de divergence entre les religions, en s’appuyant soigneusement sur les sources originales. Son travail se distingue par le souci de la précision dans la citation et l’analyse, offrant un matériau scientifique utile aux chercheurs et aux personnes intéressées par le dialogue interreligieux.","es":"El Dr. Munqidh al-Saqqar es un investigador sirio, nacido en Siria en la década de 1970, especializado en estudios religiosos y religiones comparadas. Se dedica al estudio de las escrituras y los textos tradicionales y al análisis de diversas tesis intelectuales y doctrinales mediante una metodología documental.\n\nHa producido libros y conferencias que critican ciertas tesis misioneras y orientalistas y que aclaran puntos de acuerdo y diferencia entre las religiones, con especial cuidado en la referencia a las fuentes originales. Su trabajo se caracteriza por la precisión en la cita y el análisis, ofreciendo material académico útil para investigadores y personas interesadas en el diálogo interreligioso."}},{"n":"20","name":{"ar":"معاذ عليان","en":"Moaz Aliian","fr":"Moaz Aliian","es":"Moaz Aliian"},"website":"","tag":{"ar":"مناظرات وحوار","en":"debate and dialogue","fr":"débat et dialogue","es":"debate y diálogo"},"desc":{"ar":"معاذ عليان باحث ومناظر مصري وُلد في ثمانينيات القرن العشرين في مصر، يهتم بمقارنة الأديان والحوار الفكري والرد على الشبهات. نشط في إنتاج محتوى رقمي يناقش القضايا العقدية والنصية بأسلوب يعتمد على عرض المصادر والاستدلال.\n\nيشارك في حوارات ومناظرات عبر المنصات المختلفة، مركّزًا على تحليل الادعاءات المطروحة وتقديم بدائل معرفية مبنية على الدليل. ويحرص في طرحه على الوضوح والمنهجية، مع توجه إلى مخاطبة جمهور واسع من المهتمين بقضايا الفكر والدين.","en":"Moaz Aliian is an Egyptian researcher and debater, born in Egypt in the 1980s, interested in comparative religion, intellectual dialogue, and responses to doubts. He is active in producing digital content that discusses doctrinal and textual issues in a style grounded in presenting sources and evidence.\n\nHe participates in dialogues and debates across various platforms, focusing on analyzing claims and offering knowledge-based alternatives supported by proof. His approach emphasizes clarity and methodology, addressing a broad audience interested in questions of thought and religion.","fr":"Moaz Aliian est un chercheur et débatteur égyptien, né en Égypte dans les années 1980, qui s’intéresse aux religions comparées, au dialogue intellectuel et aux réponses aux objections. Il est actif dans la production de contenus numériques traitant des questions doctrinales et textuelles dans un style fondé sur la présentation des sources et des preuves.\n\nIl participe à des dialogues et débats sur diverses plateformes, en se concentrant sur l’analyse des thèses avancées et la proposition d’alternatives fondées sur la connaissance et la preuve. Son approche privilégie la clarté et la méthode, s’adressant à un large public intéressé par les questions de pensée et de religion.","es":"Moaz Aliian es un investigador y polemista egipcio, nacido en Egipto en la década de 1980, interesado en las religiones comparadas, el diálogo intelectual y las respuestas a las dudas. Es activo en la producción de contenido digital que aborda cuestiones doctrinales y textuales con un estilo basado en la presentación de fuentes y pruebas.\n\nParticipa en diálogos y debates en diversas plataformas, centrándose en el análisis de las afirmaciones planteadas y en la oferta de alternativas fundamentadas en el conocimiento y la evidencia. Su enfoque destaca por la claridad y la metodología, dirigiéndose a un amplio público interesado en cuestiones de pensamiento y religión."}},{"n":"21","name":{"ar":"محمود داود","en":"Mahmoud Dawoud","fr":"Mahmoud Daoud","es":"Mahmoud Dawoud"},"website":"","tag":{"ar":"دعوة ومقارنة أديان","en":"da'wah and comparative religion","fr":"da'wa et religions comparées","es":"da'wa y religiones comparadas"},"desc":{"ar":"محمود داود داعية وباحث مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بمقارنة الأديان والدعوة والحوار حول القضايا العقدية والفكرية. عُرف بتقديم محتوى يجمع بين الخطاب المباشر والنقاش المبني على المصادر والنصوص.\n\nيشارك عبر محاضراته وبرامجه المرئية في تناول موضوعات تتعلق بالإيمان والنبوة والكتب المقدسة والرد على الشبهات، مع الحرص على تبسيط العرض دون الإخلال بأصول البحث. ويستهدف في نشاطه تعزيز الفهم الصحيح للدين وتمكين المتلقي من أدوات الحوار الواعي.","en":"Mahmoud Dawoud is an Egyptian preacher and researcher, born in Egypt in the 1970s, concerned with comparative religion, da'wah, and dialogue on doctrinal and intellectual issues. He is known for presenting content that combines direct communication with discussion grounded in sources and texts.\n\nThrough his lectures and video programs he addresses topics related to faith, prophethood, scriptures, and responses to doubts, while striving to simplify presentation without compromising scholarly principles. His work aims to promote a sound understanding of religion and to equip audiences with tools for thoughtful dialogue.","fr":"Mahmoud Daoud est un prédicateur et chercheur égyptien, né en Égypte dans les années 1970, qui s’intéresse aux religions comparées, à la da'wa et au dialogue sur les questions doctrinales et intellectuelles. Il est connu pour proposer des contenus associant un discours direct à une discussion fondée sur les sources et les textes.\n\nÀ travers ses conférences et ses émissions vidéo, il aborde des sujets liés à la foi, à la prophétie, aux Écritures et aux réponses aux objections, tout en s’efforçant de simplifier l’exposé sans compromettre les principes de la recherche. Son activité vise à promouvoir une compréhension juste de la religion et à fournir au public des outils pour un dialogue réfléchi.","es":"Mahmoud Dawoud es un predicador e investigador egipcio, nacido en Egipto en la década de 1970, interesado en las religiones comparadas, la da'wa y el diálogo sobre cuestiones doctrinales e intelectuales. Es conocido por presentar contenidos que combinan una comunicación directa con un debate basado en fuentes y textos.\n\nA través de sus conferencias y programas en vídeo aborda temas relacionados con la fe, la profecía, las escrituras y las respuestas a las dudas, procurando simplificar la exposición sin comprometer los principios del estudio riguroso. Su labor busca promover una comprensión correcta de la religión y dotar al público de herramientas para un diálogo consciente."}},{"n":"22","name":{"ar":"الشيخ يوسف إستس","en":"Sheikh Yusuf Estes","fr":"Cheikh Yusuf Estes","es":"Sheij Yusuf Estes"},"website":"https://www.yusufestes.com/","tag":{"ar":"مقارنة الأديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الشيخ يوسف إستس داعية أمريكي وُلد عام 1944 في مدينة ميدلوثيان بولاية تكساس في الولايات المتحدة، وكان قبل إسلامه قسيسًا ووزيرًا للموسيقى في كنيسة مسيحية. اعتنق الإسلام عام 1991 بعد رحلة بحث طويلة في الأديان، ليصبح من أشهر الدعاة الناطقين بالإنجليزية في العالم.\n\nكرّس جهوده للتعريف بالإسلام وشرح مبادئه لغير المسلمين وللمسلمين الجدد، مقدّمًا محاضرات ومواد مرئية بلغة مباشرة وبسيطة. عُرف بأسلوبه القصصي المؤثر وتركيزه على قضايا التوحيد والأخلاق ومقارنة الأديان، وكان له حضور واسع في المؤتمرات والبرامج الدعوية الدولية.","en":"Sheikh Yusuf Estes is an American preacher, born in 1944 in Midlothian, Texas, in the United States. Before embracing Islam he served as a Christian minister and music director, and he converted to Islam in 1991 after a long journey of exploring different faiths, becoming one of the most well-known English-speaking da'wah figures worldwide.\n\nHe has devoted his efforts to introducing Islam and explaining its principles to non-Muslims and new Muslims, delivering lectures and video materials in a direct and accessible style. He is known for his engaging storytelling and his focus on monotheism, ethics, and comparative religion, with a broad presence in international conferences and da'wah programs.","fr":"Le cheikh Yusuf Estes est un prédicateur américain, né en 1944 à Midlothian, au Texas (États-Unis). Avant d’embrasser l’islam, il était ministre chrétien et responsable de la musique dans une église ; il s’est converti à l’islam en 1991 après un long parcours de recherche entre différentes religions, devenant l’un des prédicateurs anglophones les plus connus au monde.\n\nIl a consacré ses efforts à faire connaître l’islam et à en expliquer les principes aux non-musulmans et aux nouveaux musulmans, en proposant des conférences et des contenus vidéo dans un style direct et accessible. Il est reconnu pour son art du récit et pour l’accent mis sur le monothéisme, l’éthique et les religions comparées, avec une large présence dans les conférences et programmes de da'wa internationaux.","es":"El sheij Yusuf Estes es un predicador estadounidense, nacido en 1944 en Midlothian, Texas (Estados Unidos). Antes de abrazar el islam fue ministro cristiano y director musical en una iglesia, y se convirtió al islam en 1991 tras un largo recorrido de búsqueda entre distintas religiones, llegando a ser una de las figuras de la da'wa en inglés más conocidas a nivel mundial.\n\nHa dedicado sus esfuerzos a dar a conocer el islam y explicar sus principios a no musulmanes y a nuevos musulmanes, ofreciendo conferencias y materiales en vídeo con un estilo directo y accesible. Es conocido por su capacidad narrativa y por su énfasis en el monoteísmo, la ética y las religiones comparadas, con una amplia presencia en conferencias y programas internacionales de da'wa."}},{"n":"23","name":{"ar":"الدكتور ذاكر نايك","en":"Dr. Zakir Naik","fr":"Dr Zakir Naik","es":"Dr. Zakir Naik"},"website":"https://zakirnaik.com/","tag":{"ar":"مقارنة أديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الدكتور ذاكر نايك طبيب وداعية هندي وُلد في 18 أكتوبر 1965 في مدينة بومباي (مومباي حاليًا) بالهند، وأسس مؤسسة البحث الإسلامي (IRF) وقناة «Peace TV». درس الطب وحصل على شهادة البكالوريوس في الجراحة والطب، ثم اتجه إلى مجال الدعوة ومقارنة الأديان.\n\nاشتهر بمحاضراته ومناظراته حول الإسلام والأديان الأخرى، وبأسلوبه في عرض النصوص والمقارنات من مصادر متعددة. ركز في خطاباته على الرد على الشبهات الشائعة حول الإسلام والتعريف بمبادئه، وحقق حضورًا عالميًا واسعًا عبر المحاضرات المتلفزة والمنصات الرقمية.","en":"Dr. Zakir Naik is an Indian physician and preacher, born on 18 October 1965 in Bombay (now Mumbai), India. He founded the Islamic Research Foundation (IRF) and Peace TV. Trained in medicine with a Bachelor of Medicine and Surgery degree, he later devoted himself to da'wah and comparative religion.\n\nHe became widely known for his lectures and debates on Islam and other religions, and for his style of presenting texts and comparisons from multiple sources. His talks have focused on responding to common misconceptions about Islam and introducing its principles, gaining a broad global audience through televised lectures and digital platforms.","fr":"Le Dr Zakir Naik est un médecin et prédicateur indien, né le 18 octobre 1965 à Bombay (aujourd’hui Mumbai) en Inde. Il a fondé l’Islamic Research Foundation (IRF) et Peace TV. Formé en médecine avec un diplôme de Bachelor of Medicine and Surgery, il s’est ensuite consacré à la da'wa et aux religions comparées.\n\nIl s’est fait connaître par ses conférences et débats sur l’islam et les autres religions, ainsi que par sa manière de présenter des textes et des comparaisons issus de sources multiples. Ses interventions se sont concentrées sur la réponse aux idées reçues sur l’islam et la présentation de ses principes, lui assurant une large audience mondiale grâce aux conférences télévisées et aux plateformes numériques.","es":"El Dr. Zakir Naik es un médico y predicador indio, nacido el 18 de octubre de 1965 en Bombay (actual Mumbai), India. Fundó la Islamic Research Foundation (IRF) y Peace TV. Formado en medicina con un título de Bachelor of Medicine and Surgery, más tarde se dedicó a la da'wa y a las religiones comparadas.\n\nSe hizo ampliamente conocido por sus conferencias y debates sobre el islam y otras religiones, y por su estilo de presentar textos y comparaciones de múltiples fuentes. Sus intervenciones se han centrado en responder a ideas erróneas comunes sobre el islam y en presentar sus principios, alcanzando una amplia audiencia global a través de conferencias televisadas y plataformas digitales."}},{"n":"24","name":{"ar":"الشيخ أحمد ديدات","en":"Sheikh Ahmed Deedat","fr":"Cheikh Ahmed Deedat","es":"Sheij Ahmed Deedat"},"website":"https://www.ahmed-deedat.net/","tag":{"ar":"مناظرات ومقارنة أديان","en":"debate and comparative religion","fr":"débat et religions comparées","es":"debate y religiones comparadas"},"desc":{"ar":"الشيخ أحمد ديدات داعية جنوب أفريقي وُلد في 1 يوليو 1918 في بلدة تادكيشوار بالهند البريطانية، ثم انتقل في طفولته إلى جنوب أفريقيا حيث نشأ ونشط في مجاله الدعوي. أسس المركز الدولي للدعوة الإسلامية (IPCI) في ديربان، وأصبح من أبرز الوجوه الدعوية في العالم الناطق بالإنجليزية.\n\nاشتهر بمناظراته الشهيرة حول الكتاب المقدس والإسلام وبأسلوبه الخطابي المباشر في مقارنة الأديان. ترك إرثًا دعويًا واسعًا من المحاضرات والكتب والمناظرات المسجلة، وظل تأثيره ممتدًا في أجيال لاحقة من الدعاة والباحثين حتى وفاته عام 2005.","en":"Sheikh Ahmed Deedat was a South African preacher, born on 1 July 1918 in the town of Tadkeshwar in British India, who moved to South Africa in childhood where he grew up and became active in da'wah. He founded the Islamic Propagation Centre International (IPCI) in Durban and became one of the most prominent da'wah figures in the English-speaking world.\n\nHe was renowned for his famous debates on the Bible and Islam and for his direct rhetorical style in comparative religion. He left a vast legacy of lectures, books, and recorded debates, and his influence continued to reach later generations of preachers and researchers until his passing in 2005.","fr":"Le cheikh Ahmed Deedat était un prédicateur sud-africain, né le 1er juillet 1918 dans la ville de Tadkeshwar en Inde britannique, qui s’installa en Afrique du Sud durant son enfance où il grandit et mena son activité de da'wa. Il fonda l’Islamic Propagation Centre International (IPCI) à Durban et devint l’une des figures majeures de la da'wa dans le monde anglophone.\n\nIl fut célèbre pour ses débats marquants sur la Bible et l’islam et pour son style oratoire direct dans le domaine des religions comparées. Il laissa un vaste héritage de conférences, d’ouvrages et de débats enregistrés, et son influence continua de toucher les générations suivantes de prédicateurs et de chercheurs jusqu’à son décès en 2005.","es":"El sheij Ahmed Deedat fue un predicador sudafricano, nacido el 1 de julio de 1918 en la localidad de Tadkeshwar en la India británica, que se trasladó a Sudáfrica en su infancia, donde creció y desarrolló su labor de da'wa. Fundó el Islamic Propagation Centre International (IPCI) en Durban y se convirtió en una de las figuras más destacadas de la da'wa en el mundo angloparlante.\n\nFue célebre por sus famosos debates sobre la Biblia y el islam y por su estilo oratorio directo en el ámbito de las religiones comparadas. Dejó un amplio legado de conferencias, libros y debates grabados, y su influencia siguió llegando a generaciones posteriores de predicadores e investigadores hasta su fallecimiento en 2005."}},{"n":"25","name":{"ar":"الشيخ عثمان الخميس","en":"Sheikh Othman Al-Khamis","fr":"Cheikh Othman Al-Khamis","es":"Sheij Othman Al-Khamis"},"website":"https://othmanalkhamees.com/","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ عثمان الخميس داعية وعالم كويتي وُلد في 26 مايو 1962 في الكويت، تخصص في علوم العقيدة والرد على الفرق والمذاهب المخالفة. تلقى تكوينًا شرعيًا في جامعة الإمام محمد بن سعود الإسلامية بالرياض، واشتغل بالتدريس والإفتاء والدعوة.\n\nاشتهر بدروسه المنهجية في شرح أصول الاعتقاد وبسلاسله في نقد الطروحات الفكرية والعقدية، مع الحرص على الاستدلال بالكتاب والسنة وفهم سلف الأمة. وله حضور إعلامي ودعوي واسع عبر المحاضرات والمناظرات والبرامج، حيث يركز على ترسيخ المنهج العلمي الوسطي في تلقي العقيدة.","en":"Sheikh Othman al-Khamis is a Kuwaiti preacher and scholar, born on 26 May 1962 in Kuwait, specializing in creed and in responding to sects and divergent schools of thought. He received religious training at Imam Muhammad ibn Saud Islamic University in Riyadh and has worked in teaching, issuing religious guidance, and da'wah.\n\nHe is known for his methodical lessons explaining the foundations of belief and for series critiquing intellectual and doctrinal positions, with careful reliance on the Qur’an, the Sunnah, and the understanding of the early generations. He has a broad media and da'wah presence through lectures, debates, and programs, focusing on grounding a balanced scholarly approach to creed.","fr":"Le cheikh Othman al-Khamis est un prédicateur et savant koweïtien, né le 26 mai 1962 au Koweït, spécialisé dans la croyance et dans les réponses aux sectes et courants divergents. Il a reçu une formation religieuse à l’Université islamique Imam Muhammad ibn Saoud de Riyad et a exercé dans l’enseignement, le conseil religieux et la da'wa.\n\nIl est connu pour ses cours méthodiques expliquant les fondements de la croyance et pour ses séries critiquant diverses positions intellectuelles et doctrinales, en s’appuyant avec rigueur sur le Coran, la Sunna et la compréhension des premières générations. Il bénéficie d’une large présence médiatique et de da'wa à travers des conférences, débats et émissions, mettant l’accent sur un ancrage méthodique et équilibré de la croyance.","es":"El sheij Othman al-Khamis es un predicador y erudito kuwaití, nacido el 26 de mayo de 1962 en Kuwait, especializado en la creencia y en la respuesta a sectas y corrientes divergentes. Recibió formación religiosa en la Universidad Islámica Imam Muhammad ibn Saud de Riad y ha trabajado en la enseñanza, la orientación religiosa y la da'wa.\n\nEs conocido por sus lecciones metódicas que explican los fundamentos de la creencia y por series que critican diversas posturas intelectuales y doctrinales, con una cuidadosa apoyatura en el Corán, la Sunna y la comprensión de las primeras generaciones. Tiene una amplia presencia mediática y de
