<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="sepia">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>أعلام الدعوة والمناظرة في العصر الرقمي</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">


    <style>

        /* =========================================
           إصلاح نهائي ومطلق للقائمة الجانبية (Drawer Final Fix)
           ========================================= */


        /* طبقة التعتيم الخلفية */
        .overlay {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            background-color: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: blur(4px) !important;
            z-index: 99998 !important;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease !important;
        }


        .overlay.active {
            opacity: 1 !important;
            visibility: visible !important;
        }


        /* القائمة الجانبية المحدثة */
        .drawer {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important; /* تثبيت مطلق على يمين الشاشة في وضع العربية */
            left: auto !important;
            width: 80vw !important;
            max-width: 300px !important;
            height: 100dvh !important;
            background-color: var(--bg-ivoire, #fcf8f0) !important;
            color: var(--text-main, #2c2c2c) !important;
            z-index: 99999 !important;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.4) !important;
            
            /* إخفاء القائمة بالكامل إلى اليمين خارج الشاشة */
            transform: translateX(100%) !important;
            transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1) !important;
            
            display: flex !important;
            flex-direction: column !important;
            overflow-y: auto !important;
            visibility: hidden; /* مخفية تماماً لمنع أي تفاعل وهي مغلقة */
        }


        /* عند فتح القائمة */
        .drawer.open {
            transform: translateX(0) !important;
            visibility: visible !important;
        }


        /* دعم اللغة الإنجليزية أو اللغات اليسارية (LTR) */
        [dir="ltr"] .drawer {
            right: auto !important;
            left: 0 !important;
            transform: translateX(-100%) !important;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.4) !important;
        }


        [dir="ltr"] .drawer.open {
            transform: translateX(0) !important;
        }


        /* رأس القائمة الجانبية */
        .drawer-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 16px !important;
            border-bottom: 1px solid var(--border-color, #d1c7b3) !important;
            background: var(--bg-parchemin, #f4ecd8) !important;
        }


        /* العنوان داخل القائمة */
        .drawer-title {
            font-size: 1.25rem !important;
            font-weight: bold !important;
            color: var(--primary-emerald, #15472a) !important;
            margin: 0 !important;
            text-align: right !important;
        }


        [dir="ltr"] .drawer-title {
            text-align: left !important;
        }


        /* زر الإغلاق المنظم */
        .close-btn {
            background: rgba(220, 53, 69, 0.1) !important;
            color: #dc3545 !important;
            border: none !important;
            width: 32px !important;
            height: 32px !important;
            border-radius: 50% !important;
            font-size: 16px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            padding: 0 !important;
            line-height: 1 !important;
        }


        /* محتوى القائمة وروابطها */
        .drawer-content {
            padding: 16px !important;
            flex-grow: 1 !important;
        }


        .drawer-list {
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }


        .drawer-list li {
            margin-bottom: 10px !important;
        }


        .drawer-list a {
            display: block !important;
            padding: 10px 12px !important;
            border-radius: 6px !important;
            color: var(--text-main, #2c2c2c) !important;
            font-size: 0.95rem !important;
            text-decoration: none !important;
            text-align: right !important;
            background: rgba(0, 0, 0, 0.02) !important;
            transition: background 0.2s, color 0.2s !important;
        }


        [dir="ltr"] .drawer-list a {
            text-align: left !important;
        }


        .drawer-list a:hover {
            background: var(--primary-emerald, #15472a) !important;
            color: #ffffff !important;
        }
</style>
