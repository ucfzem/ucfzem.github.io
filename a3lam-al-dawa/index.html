body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:15px;transition:background .3s,color .3s;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;margin-bottom:20px}

.pill{display:flex;gap:4px;background:var(--card);padding:4px 8px;border-radius:20px;border:1px solid var(--border)}

main{flex:1}
.grid{display:flex;flex-direction:column;gap:14px;max-width:800px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px}
.card-top{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:10px;align-items:start}
.avatar{position:relative;width:65px;height:65px;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:#2a2a2a;border:2px solid var(--accent);flex-shrink:0}
.avatar .mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:1.55rem;line-height:1}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}

.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.name{font-size:1.1rem;font-weight:700;color:var(--accent);margin:0}
.tag{background:rgba(212,175,55,.15);color:var(--accent);font-size:.75rem;padding:3px 8px;border-radius:6px;border:1px solid var(--accent)}
.desc-wrap{grid-column:1 / -1;width:100%}
.desc{font-size:.85rem;color:var(--muted);line-height:1.7;margin:0 0 8px;text-align:justify}
.desc:last-child{margin-bottom:0}
.actions{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:9px;font-size:.85rem;font-weight:600;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;text-align:center;display:inline-block;cursor:pointer}
.btn:hover{background:var(--border)}
.btn{transition:opacity .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.7}
.empty{text-align:center;color:var(--muted);padding:20px}
footer{text-align:center;margin-top:30px;padding:15px 0;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
</style>

// Optional per-person overrides: img, yt (full URLs). Leave out to use defaults.
var scholars = [{"n":"01","name":{"ar":"الدكتور هيثم طلعت","en":"Dr. Haitham Talaat","fr":"Dr Haïtham Talaat","es":"Dr. Haitham Talaat"},"website":"https://haithamt.com/","tag":{"ar":"نقد الإلحاد","en":"critique of atheism","fr":"critique de l'athéisme","es":"crítica del ateísmo"},"desc":{"ar":"الدكتور هيثم طلعت طبيب وباحث مصري وُلد في ستينيات القرن العشرين في مصر، وأصبح من أبرز الأصوات العربية المعاصرة في نقد الإلحاد والرد على الشبهات الفكرية. جمع في مسيرته بين التكوين الطبي والاهتمام بالفلسفة والمنطق والعلاقة بين العلم والإيمان، مما منحه قدرة على مخاطبة الجمهور المتخصص والعام معًا.\n\nيركز في محاضراته وكتاباته على تفكيك دعاوى الإلحاد الجديد ومناقشة قضايا الوعي والسببية والأخلاق من منظور علمي وعقلي، مع عرض الحجج الإيمانية بلغة منهجية واضحة. وله حضور رقمي واسع عبر محاضرات مرئية ومقالات ومواد تعليمية تسعى إلى بناء وعي نقدي رصين لدى الشباب المسلم.","en":"Dr. Haitham Talaat is an Egyptian physician and researcher, born in Egypt in the 1960s, who has become one of the most prominent contemporary Arabic voices in critiquing atheism and addressing intellectual doubts. His path combines medical training with a sustained interest in philosophy, logic, and the relationship between science and faith, enabling him to speak to both specialist and general audiences.\n\nIn his lectures and writings he focuses on dismantling the claims of New Atheism and discussing questions of consciousness, causality, and morality from scientific and rational perspectives, while presenting the case for faith in a clear, methodical language. He maintains a wide digital presence through video lectures, articles, and educational materials aimed at fostering critical and grounded awareness among Muslim youth.","fr":"Le Dr Haïtham Talaat est un médecin et chercheur égyptien, né en Égypte dans les années 1960, devenu l’une des voix arabes contemporaines les plus en vue dans la critique de l’athéisme et la réponse aux doutes intellectuels. Son parcours associe une formation médicale à un intérêt approfondi pour la philosophie, la logique et la relation entre science et foi, ce qui lui permet de s’adresser aussi bien au public spécialisé qu’au grand public.\n\nDans ses conférences et ses écrits, il s’attache à déconstruire les thèses du nouvel athéisme et à examiner les questions de la conscience, de la causalité et de la morale dans une perspective scientifique et rationnelle, tout en exposant les arguments de la foi dans un langage méthodique et clair. Il bénéficie d’une large présence numérique grâce à des conférences vidéo, des articles et des supports pédagogiques destinés à renforcer l’esprit critique des jeunes musulmans.","es":"El Dr. Haitham Talaat es un médico e investigador egipcio, nacido en Egipto en la década de 1960, que se ha convertido en una de las voces árabes contemporáneas más destacadas en la crítica del ateísmo y la respuesta a las dudas intelectuales. Su trayectoria combina la formación médica con un interés constante por la filosofía, la lógica y la relación entre ciencia y fe, lo que le permite dirigirse tanto a públicos especializados como generales.\n\nEn sus conferencias y escritos se centra en desmontar las tesis del nuevo ateísmo y en abordar cuestiones de conciencia, causalidad y moral desde perspectivas científicas y racionales, presentando los argumentos de la fe con un lenguaje claro y metódico. Mantiene una amplia presencia digital mediante conferencias en vídeo, artículos y materiales educativos orientados a fomentar una conciencia crítica y sólida entre los jóvenes musulmanes."}},{"n":"02","name":{"ar":"الشيخ زين خير الله","en":"Sheikh Zain Khairallah","fr":"Cheikh Zaïn Khaïrallah","es":"Sheij Zain Khairallah"},"website":"https://www.facebook.com/profile.php?id=100070009880112","tag":{"ar":"مناظرات ومقارنة أديان","en":"debate and comparative religion","fr":"débat et religions comparées","es":"debate y religiones comparadas"},"desc":{"ar":"الشيخ زين خير الله باحث وداعية ليبي وُلد في سبعينيات القرن العشرين في ليبيا، اشتهر في مجال مقارنة الأديان والحوار والمناظرة. تلقى تكوينًا شرعيًا ومعرفيًا مكّنه من دراسة النصوص الدينية دراسة تحليلية، مع اهتمام خاص بالأساليب الحوارية الهادئة والمنضبطة.\n\nيركز في نشاطه على عرض الحجج بطريقة عقلية منهجية، والرد على الشبهات المثارة حول الإسلام من خلال الرجوع إلى المصادر الأصلية والنصوص المحققة. وله مشاركات ومحاضرات ومناظرات متداولة رقميًا، عُرف فيها بالهدوء والالتزام بأدب الاختلاف والسعي إلى توضيح المفاهيم بموضوعية.","en":"Sheikh Zain Khairallah is a Libyan researcher and preacher, born in Libya in the 1970s, well known in the fields of comparative religion, dialogue, and debate. His religious and intellectual formation enabled him to study religious texts analytically, with particular attention to calm and disciplined methods of discussion.\n\nHis work focuses on presenting arguments in a rational, methodical manner and responding to objections raised about Islam by returning to primary sources and verified texts. He is known for widely shared lectures and debates in which he demonstrates composure, respect for the ethics of disagreement, and a commitment to clarifying concepts with objectivity.","fr":"Le cheikh Zaïn Khaïrallah est un chercheur et prédicateur libyen, né en Libye dans les années 1970, reconnu dans les domaines des religions comparées, du dialogue et du débat. Sa formation religieuse et intellectuelle lui a permis d’étudier les textes religieux de manière analytique, avec une attention particulière aux méthodes de discussion calmes et rigoureuses.\n\nSon activité consiste à présenter les arguments de façon rationnelle et méthodique et à répondre aux objections formulées contre l’islam en revenant aux sources originales et aux textes vérifiés. Il est connu pour ses conférences et débats largement diffusés, où il fait preuve de calme, de respect de l’éthique du désaccord et d’un souci constant de clarifier les concepts avec objectivité.","es":"El sheij Zain Khairallah es un investigador y predicador libio, nacido en Libia en la década de 1970, reconocido en los ámbitos de las religiones comparadas, el diálogo y el debate. Su formación religiosa e intelectual le permitió estudiar los textos religiosos de manera analítica, con especial atención a métodos de discusión serenos y disciplinados.\n\nSu labor se centra en presentar argumentos de forma racional y metódica y en responder a las objeciones planteadas sobre el islam recurriendo a las fuentes originales y a los textos verificados. Es conocido por conferencias y debates ampliamente difundidos en los que demuestra serenidad, respeto por la ética del desacuerdo y un compromiso con la clarificación objetiva de los conceptos."}},{"n":"03","name":{"ar":"الدكتور سامي عامري","en":"Dr. Sami Ameri","fr":"Dr Sami Ameri","es":"Dr. Sami Ameri"},"website":"https://almobadarah.com/profile/sami-ameri","tag":{"ar":"مقارنة الأديان ونقد الإلحاد","en":"comparative religion and critique of atheism","fr":"religions comparées et critique de l'athéisme","es":"religiones comparadas y crítica del ateísmo"},"desc":{"ar":"الدكتور سامي عامري باحث تونسي وُلد عام 1975 في تونس، متخصص في مقارنة الأديان والمذاهب المعاصرة ونقد الإلحاد. يُعد من مؤسسي «مبادرة البحث العلمي لمقارنة الأديان» والمشرف العلمي عليها، وتركز اهتماماته على الإلحاد الجديد والنقد الكتابي والاستشراق وقضايا الفكر المعاصر، وهو حاصل على دكتوراه في الدراسات الدينية من كلية الاتحاد اللاهوتي للدراسات العليا (GTU) في بيركلي بكاليفورنيا.\n\nيجمع في أعماله بين البحث الأكاديمي والتأصيل الشرعي، ويقدّم كتبًا ومحاضرات ودروسًا في الرد على الشبهات الفكرية والعقدية ومناقشة الطروحات الإلحادية والاستشراقية. ويسعى من خلال إنتاجه العلمي والدعوي إلى تقديم خطاب معرفي رصين يخاطب الأسئلة المعاصرة حول الإيمان والدين والوجود بلغة منهجية واضحة.","en":"Dr. Sami Ameri is a Tunisian researcher, born in 1975 in Tunisia, specializing in comparative religion, contemporary ideologies, and the critique of atheism. He is a co-founder and the scientific supervisor of the Scientific Research Initiative for Comparative Religion. His research interests include New Atheism, biblical criticism, Orientalism, and contemporary intellectual issues, and he holds a PhD in religious studies from the Graduate Theological Union (GTU) in Berkeley, California.\n\nHis work combines academic research with sound scholarly foundations, and he offers books, lectures, and lessons responding to intellectual and doctrinal doubts and engaging atheistic and Orientalist claims. Through his scholarly and outreach efforts, he seeks to provide a rigorous, methodical discourse that addresses contemporary questions about faith, religion, and existence.","fr":"Le Dr Sami Ameri est un chercheur tunisien, né en 1975 en Tunisie, spécialisé dans les religions comparées, les courants contemporains et la critique de l’athéisme. Il est cofondateur et superviseur scientifique de l’Initiative de recherche scientifique pour les religions comparées. Ses travaux portent notamment sur le nouvel athéisme, la critique biblique, l’orientalisme et les questions intellectuelles contemporaines, et il est titulaire d’un doctorat en études religieuses de la Graduate Theological Union (GTU) à Berkeley, en Californie.\n\nSon travail allie recherche académique et fondements savants solides. Il propose des ouvrages, des conférences et des cours répondant aux doutes intellectuels et doctrinaux et examinant les thèses athées et orientalistes. À travers son activité scientifique et pédagogique, il s’efforce d’offrir un discours rigoureux et méthodique face aux questions contemporaines sur la foi, la religion et l’existence.","es":"El Dr. Sami Ameri es un investigador tunecino, nacido en 1975 en Túnez, especializado en religiones comparadas, corrientes contemporáneas y crítica del ateísmo. Es cofundador y supervisor científico de la Iniciativa de Investigación Científica para las Religiones Comparadas. Sus intereses de investigación incluyen el nuevo ateísmo, la crítica bíblica, el orientalismo y las cuestiones intelectuales contemporáneas, y posee un doctorado en estudios religiosos por la Graduate Theological Union (GTU) en Berkeley, California.\n\nSu labor combina la investigación académica con fundamentos académicos sólidos, y ofrece libros, conferencias y clases que responden a dudas intelectuales y doctrinales y analizan planteamientos ateos y orientalistas. A través de su labor académica y divulgativa, busca ofrecer un discurso riguroso y metódico ante las preguntas contemporáneas sobre la fe, la religión y la existencia."}},{"n":"04","name":{"ar":"الشيخ وليد إسماعيل","en":"Sheikh Walid Ismail","fr":"Cheikh Walid Ismaïl","es":"Sheij Walid Ismail"},"website":"https://www.waleedismail.com/","tag":{"ar":"مقارنة أديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الشيخ وليد إسماعيل داعية وباحث مصري وُلد في سبعينيات القرن العشرين في مصر، متخصص في مقارنة الأديان والدعوة والحوار. عُرف بجهوده في الرد على الشبهات المثارة حول الإسلام، وباهتمامه بتقديم الصورة الصحيحة للدين من خلال الاستناد إلى المصادر المعتمدة.\n\nيعتمد في أسلوبه على الجمع بين الطرح العلمي واللغة الواضحة، مع الحرص على أدب الحوار والمناظرة. وله دروس ومحاضرات ومشاركات مرئية تناقش قضايا العقيدة والنصوص، وتستهدف تثبيت المعرفة وتصحيح المفاهيم لدى المتلقي العربي وغير العربي.","en":"Sheikh Walid Ismail is an Egyptian preacher and researcher, born in Egypt in the 1970s, specializing in comparative religion, da'wah, and dialogue. He is known for his efforts to respond to objections raised about Islam and for his commitment to presenting an accurate understanding of the faith grounded in authoritative sources.\n\nHis approach combines scholarly presentation with clear language, while maintaining the ethics of dialogue and debate. Through lessons, lectures, and video contributions he addresses questions of creed and scripture, aiming to strengthen knowledge and correct misconceptions among Arabic and non-Arabic audiences.","fr":"Le cheikh Walid Ismaïl est un prédicateur et chercheur égyptien, né en Égypte dans les années 1970, spécialisé dans les religions comparées, la da'wa et le dialogue. Il est connu pour ses efforts visant à répondre aux objections formulées contre l’islam et pour son souci de présenter une compréhension juste de la foi en s’appuyant sur des sources faisant autorité.\n\nSon approche allie exposé savant et langage clair, tout en respectant l’éthique du dialogue et du débat. À travers des cours, des conférences et des interventions vidéo, il traite des questions de croyance et de textes sacrés, dans le but de consolider les connaissances et de corriger les idées reçues auprès des publics arabophones et non arabophones.","es":"El sheij Walid Ismail es un predicador e investigador egipcio, nacido en Egipto en la década de 1970, especializado en religiones comparadas, da'wa y diálogo. Es conocido por sus esfuerzos para responder a las objeciones planteadas sobre el islam y por su compromiso con presentar una comprensión fiel de la fe basada en fuentes autorizadas.\n\nSu enfoque combina la exposición rigurosa con un lenguaje claro, manteniendo la ética del diálogo y el debate. Mediante lecciones, conferencias y aportaciones en vídeo aborda cuestiones de creencia y escritura, con el objetivo de afianzar el conocimiento y corregir ideas erróneas entre públicos árabes y no árabes."}},{"n":"05","name":{"ar":"الشيخ رامي عيسى","en":"Sheikh Rami Issa","fr":"Cheikh Rami Issa","es":"Sheij Rami Issa"},"website":"https://www.ramy-essa.com/home.aspx","tag":{"ar":"عقيدة وردود","en":"creed and responses","fr":"croyance et réponses","es":"creencia y respuestas"},"desc":{"ar":"الشيخ رامي عيسى داعية ومربي مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بقضايا العقيدة الإسلامية والرد على الشبهات المعاصرة. نشط في تقديم محتوى تعليمي مبسط يربط بين النص الشرعي والفهم العقلاني، مع التركيز على بناء اليقين لدى الشباب.\n\nيقدّم عبر دروسه ومحاضراته ومقاطعِه المرئية معالجة هادئة ومنهجية للمسائل الإيمانية والفكرية، ويسعى إلى ترسيخ القيم والأخلاق الإسلامية في سياق يتسم بتنوع الطروحات الفكرية. ويحرص في خطابه على الوضوح والرفق، مع توجيه المتلقي إلى مصادر العلم الموثوقة.","en":"Sheikh Rami Issa is an Egyptian preacher and educator, born in Egypt in the 1970s, concerned with Islamic creed and responses to contemporary doubts. He is active in producing accessible educational content that connects scriptural texts with rational understanding, with a focus on strengthening certainty among young people.\n\nThrough his lessons, lectures, and video materials he offers calm, methodical treatments of questions of faith and thought, seeking to ground Islamic values and ethics in a context marked by diverse intellectual currents. His discourse emphasizes clarity and compassion while guiding audiences toward reliable sources of knowledge.","fr":"Le cheikh Rami Issa est un prédicateur et éducateur égyptien, né en Égypte dans les années 1970, attaché aux questions de croyance islamique et aux réponses aux doutes contemporains. Il est actif dans la production de contenus pédagogiques accessibles reliant les textes scripturaires à la compréhension rationnelle, avec un accent particulier sur le renforcement de la certitude chez les jeunes.\n\nÀ travers ses cours, conférences et vidéos, il propose un traitement calme et méthodique des questions de foi et de pensée, cherchant à ancrer les valeurs et l’éthique islamiques dans un contexte marqué par la diversité des courants intellectuels. Son discours privilégie la clarté et la bienveillance, tout en orientant le public vers des sources de savoir fiables.","es":"El sheij Rami Issa es un predicador y educador egipcio, nacido en Egipto en la década de 1970, interesado en las cuestiones de la creencia islámica y en las respuestas a las dudas contemporáneas. Desarrolla contenidos educativos accesibles que conectan los textos sagrados con la comprensión racional, con especial atención al fortalecimiento de la certeza entre los jóvenes.\n\nA través de sus lecciones, conferencias y materiales en vídeo ofrece un tratamiento sereno y metódico de las cuestiones de fe y pensamiento, buscando afianzar los valores y la ética islámicos en un contexto marcado por diversas corrientes intelectuales. Su discurso destaca por la claridad y la benevolencia, orientando al público hacia fuentes de conocimiento fiables."}},{"n":"06","name":{"ar":"د. خالد الحايك","en":"Dr. Khaled al-Hayek","fr":"Dr. Khaled al-Hayek","es":"Dr. Khaled al-Hayek"},"website":"https://www.addyaiya.com/","tag":{"ar":"علوم الحديث","en":"Hadith Sciences","fr":"Sciences du hadith","es":"Ciencias del hadiz"},"desc":{"ar":"الدكتور خالد الحايك باحث سوري وُلد في ستينيات القرن العشرين في سوريا، تخصص في علوم الحديث الشريف وتاريخ السنة النبوية. عُرف بعنايته بالتحقيق العلمي للنصوص الحديثية ودراسة أسانيدها ومتونها، وباهتمامه بتقريب علوم الحديث إلى القراء والباحثين.\n\nيقدّم من خلال موقعه «الضيائية» وكتبه ومحاضراته مواد علمية في تخريج الأحاديث ودراسة الأسانيد والرد على الاشتباهات المثارة حول السنة. ويجمع في عمله بين المنهجية الأكاديمية والحرص على خدمة التراث النبوي ونشر الوعي العلمي بمنهج المحدثين.","en":"Dr. Khaled al-Hayek is a Syrian researcher, born in Syria in the 1960s, specializing in the sciences of Hadith and the history of the Prophetic Sunnah. He is known for his careful scholarly verification of hadith texts and for studying their chains of transmission and meanings, as well as for making hadith sciences accessible to readers and researchers.\n\nThrough his platform “al-Diya’iyya”, his books, and his lectures, he provides scholarly material on hadith evaluation, chains of narration, and responses to doubts raised about the Sunnah. His work combines academic rigor with a commitment to serving the Prophetic tradition and promoting awareness of the methodology of hadith scholars.","fr":"Le Dr Khaled al-Hayek est un chercheur syrien, né en Syrie dans les années 1960, spécialisé dans les sciences du hadith et l’histoire de la Sunna prophétique. Il est reconnu pour sa vérification scientifique rigoureuse des textes hadithiques et pour l’étude de leurs chaînes de transmission et de leurs significations, ainsi que pour ses efforts visant à rendre les sciences du hadith accessibles aux lecteurs et aux chercheurs.\n\nÀ travers sa plateforme « al-Diya’iyya », ses ouvrages et ses conférences, il propose des travaux sur l’évaluation des hadiths, l’étude des chaînes de transmission et les réponses aux doutes soulevés à propos de la Sunna. Son travail allie rigueur académique et engagement au service de la tradition prophétique et de la diffusion de la méthodologie des spécialistes du hadith.","es":"El Dr. Khaled al-Hayek es un investigador sirio, nacido en Siria en la década de 1960, especializado en las ciencias del hadiz y la historia de la Sunna profética. Es conocido por su cuidadosa verificación académica de los textos hadices y por el estudio de sus cadenas de transmisión y significados, así como por acercar las ciencias del hadiz a lectores e investigadores.\n\nA través de su plataforma «al-Diya’iyya», sus libros y sus conferencias, ofrece material académico sobre la evaluación de hadices, las cadenas de narración y las respuestas a las dudas planteadas sobre la Sunna. Su trabajo combina el rigor académico con el compromiso de servir a la tradición profética y difundir la metodología de los especialistas en hadiz."}},{"n":"07","name":{"ar":"خالد الوصابي","en":"Khaled al-Wasabi","fr":"Khaled al-Wasabi","es":"Khaled al-Wasabi"},"website":"","tag":{"ar":"الأديان المقارنة","en":"Comparative Religions","fr":"Religions comparées","es":"Religiones comparadas"},"desc":{"ar":"خالد الوصابي باحث وداعية يمني وُلد في سبعينيات القرن العشرين في اليمن، يهتم بمقارنة الأديان والرد على الشبهات الفكرية والعقدية. عُرف بنشاطه في الحوار مع أتباع الديانات والمذاهب المختلفة، وبحرصه على تتبع الطروحات المثارة ومناقشتها.\n\nيقدّم عبر محاضراته ومقاطعِه المرئية مواد تعتمد على عرض النصوص ومناقشة الحجج، مع التركيز على القضايا الخلافية في العقيدة والتاريخ الديني. ويسعى في خطابه إلى الجمع بين وضوح العرض والالتزام بالمنهج العلمي في البحث والاستدلال، موجّهًا رسالته إلى جمهور واسع في العالم العربي.","en":"Khaled al-Wasabi is a Yemeni researcher and preacher, born in Yemen in the 1970s, focused on comparative religion and responding to intellectual and doctrinal doubts. He is known for his engagement in dialogue with followers of different religions and schools of thought, and for carefully examining and discussing the claims raised in such debates.\n\nThrough his lectures and video materials he presents content grounded in textual evidence and reasoned argument, with particular attention to contested issues of creed and religious history. His discourse seeks to combine clarity of presentation with adherence to a scholarly method of research and argumentation, addressing a broad audience across the Arab world.","fr":"Khaled al-Wasabi est un chercheur et prédicateur yéménite, né au Yémen dans les années 1970, spécialisé dans les religions comparées et la réponse aux doutes intellectuels et doctrinaux. Il est connu pour son engagement dans le dialogue avec les adeptes de différentes religions et courants, ainsi que pour son attention à examiner et discuter les thèses soulevées dans ces débats.\n\nÀ travers ses conférences et ses vidéos, il propose des contenus fondés sur la présentation des textes et la discussion argumentée, avec un intérêt particulier pour les questions controversées de croyance et d’histoire religieuse. Son discours vise à associer clarté de l’exposé et fidélité à une méthode de recherche et d’argumentation rigoureuse, s’adressant à un large public dans le monde arabe.","es":"Khaled al-Wasabi es un investigador y predicador yemení, nacido en Yemen en la década de 1970, centrado en las religiones comparadas y en la respuesta a las dudas intelectuales y doctrinales. Es conocido por su participación en el diálogo con seguidores de distintas religiones y corrientes, y por examinar y debatir con atención las tesis planteadas en esos contextos.\n\nA través de sus conferencias y materiales en vídeo presenta contenidos basados en la exposición de textos y la argumentación razonada, con especial atención a cuestiones controvertidas de creencia e historia religiosa. Su discurso busca combinar la claridad expositiva con la adhesión a un método académico de investigación y argumentación, dirigiéndose a un amplio público en el mundo árabe."},"yt":"https://www.youtube.com/@khaledwesabi"},{"n":"08","name":{"ar":"الشيخ عدنان العرعور","en":"Sheikh Adnan Al-Arour","fr":"Cheikh Adnan Al-Arour","es":"Sheij Adnan Al-Arour"},"website":"https://www.islamwasat.com/","tag":{"ar":"عقيدة ومناظرة","en":"creed and debate","fr":"croyance et débat","es":"creencia y debate"},"desc":{"ar":"الشيخ عدنان العرعور داعية سوري وُلد عام 1948 في مدينة حماة بسوريا، ويُعد من أبرز الشخصيات السلفية المعاصرة في الخطاب العقدي والمناظرة. تلقى تكوينًا شرعيًا في سوريا والسعودية، واشتغل بالتدريس والخطابة والدعوة، مع اهتمام خاص بقضايا العقيدة والرد على المخالفات الفكرية.\n\nاشتهر بدروسه ومحاضراته ومشاركاته الإعلامية في شرح مسائل الاعتقاد والتعريف بالمنهج السلفي، كما عُرف بسلاسل في الرد على الشبهات وبمشاركاته في النقاشات الفكرية والدينية. ترك حضورًا واسعًا في الفضاء الدعوي والإعلامي العربي، ولا سيما عبر المواد المرئية المتداولة.","en":"Sheikh Adnan al-Arour is a Syrian preacher, born in 1948 in the city of Hama, Syria, and is regarded as one of the most prominent contemporary Salafi figures in doctrinal discourse and debate. He received religious training in Syria and Saudi Arabia and worked in teaching, preaching, and da'wah, with particular focus on matters of creed and responses to intellectual deviations.\n\nHe became widely known for his lessons, lectures, and media appearances explaining issues of belief and presenting the Salafi methodology, as well as for series responding to doubts and for participation in religious and intellectual discussions. He left a broad presence in the Arab da'wah and media spheres, especially through widely circulated video materials.","fr":"Le cheikh Adnan al-Arour est un prédicateur syrien, né en 1948 dans la ville de Hama en Syrie, considéré comme l’une des figures salafies contemporaines les plus marquantes dans le discours doctrinal et le débat. Il a reçu une formation religieuse en Syrie et en Arabie saoudite et a exercé dans l’enseignement, la prédication et la da'wa, avec un intérêt particulier pour les questions de croyance et les réponses aux déviations intellectuelles.\n\nIl s’est fait connaître par ses cours, ses conférences et ses interventions médiatiques expliquant les questions de croyance et présentant la méthodologie salafie, ainsi que par des séries répondant aux objections et par sa participation à des discussions religieuses et intellectuelles. Il a laissé une forte présence dans les milieux de la da'wa et des médias arabes, notamment grâce à des contenus vidéo largement diffusés.","es":"El sheij Adnan al-Arour es un predicador sirio, nacido en 1948 en la ciudad de Hama (Siria), considerado una de las figuras salafíes contemporáneas más destacadas en el discurso doctrinal y el debate. Recibió formación religiosa en Siria y Arabia Saudita y trabajó en la enseñanza, la predicación y la da'wa, con especial atención a las cuestiones de creencia y a las respuestas a las desviaciones intelectuales.\n\nSe hizo conocido por sus lecciones, conferencias y apariciones en medios explicando cuestiones de fe y presentando la metodología salafí, así como por series de respuestas a objeciones y por su participación en debates religiosos e intelectuales. Dejó una amplia presencia en los ámbitos de la da'wa y los medios árabes, especialmente a través de materiales en vídeo de gran difusión."}},{"n":"09","name":{"ar":"الشيخ شمائل ندوي","en":"Sheikh Shamail Nadwi","fr":"Cheikh Chamaïl Nadwi","es":"Sheij Shamail Nadwi"},"website":"https://muftishamail.com/","tag":{"ar":"دعوة وتربية","en":"da'wah and education","fr":"da'wa et éducation","es":"da'wa y educación"},"desc":{"ar":"الشيخ شمائل الندوي داعية وعالم هندي شاب وُلد عام 1998 في ولاية البنغال الغربية بالهند، وتخرّج من جامعة دار العلوم لندوة العلماء في لكنؤ. برز في الخطاب الدعوي المعاصر بجمعه بين التكوين الشرعي التقليدي والقدرة على مخاطبة جمهور واسع بالعربية والإنجليزية.\n\nيهتم في دروسه ومحاضراته بالتربية الإيمانية وبناء الشخصية المسلمة، وبعرض معاني القرآن والسنة بأسلوب معاصر قريب من هموم الشباب. وله حضور متنامٍ في المنصات الرقمية واللقاءات الدعوية، حيث يسعى إلى الربط بين العلم الشرعي والواقع المعاش بلغة واضحة ومؤثرة.","en":"Sheikh Shamail Nadwi is a young Indian preacher and scholar, born in 1998 in West Bengal, India, and a graduate of Darul Uloom Nadwatul Ulama in Lucknow. He has emerged in contemporary da'wah discourse by combining traditional religious training with an ability to address wide audiences in both Arabic and English.\n\nIn his lessons and lectures he focuses on faith-based education and the formation of the Muslim personality, presenting the meanings of the Qur’an and Sunnah in a contemporary style that resonates with young people. He has a growing presence on digital platforms and in da'wah gatherings, seeking to connect religious knowledge with lived reality in clear and engaging language.","fr":"Le cheikh Shamaïl Nadwi est un jeune prédicateur et savant indien, né en 1998 au Bengale-Occidental en Inde, diplômé de Darul Uloom Nadwatul Ulama à Lucknow. Il s’est distingué dans le discours contemporain de la da'wa en associant une formation religieuse traditionnelle à la capacité de s’adresser à un large public en arabe et en anglais.\n\nDans ses cours et conférences, il s’intéresse à l’éducation spirituelle et à la formation de la personnalité musulmane, en présentant les enseignements du Coran et de la Sunna dans un style contemporain proche des préoccupations des jeunes. Il bénéficie d’une présence croissante sur les plateformes numériques et dans les rencontres de prédication, cherchant à relier le savoir religieux au vécu quotidien dans un langage clair et accessible.","es":"El sheij Shamail Nadwi es un joven predicador y erudito indio, nacido en 1998 en Bengala Occidental (India) y graduado de Darul Uloom Nadwatul Ulama en Lucknow. Ha destacado en el discurso contemporáneo de la da'wa por combinar la formación religiosa tradicional con la capacidad de dirigirse a amplios públicos en árabe e inglés.\n\nEn sus lecciones y conferencias se centra en la educación espiritual y en la formación de la personalidad musulmana, presentando los significados del Corán y la Sunna en un estilo contemporáneo cercano a las inquietudes de los jóvenes. Tiene una presencia creciente en plataformas digitales y encuentros de da'wa, buscando conectar el conocimiento religioso con la realidad cotidiana en un lenguaje claro y cercano."}},{"n":"10","name":{"ar":"الدكتور إياد قنيبي","en":"Dr. Iyad Qunaibi","fr":"Dr Iyad Qounaïbi","es":"Dr. Iyad Qunaibi"},"website":"https://eyadqunaibi.com/","tag":{"ar":"فكر معاصر ونقد الإلحاد","en":"contemporary thought and critique of atheism","fr":"pensée contemporaine et critique de l'athéisme","es":"pensamiento contemporáneo y crítica del ateísmo"},"desc":{"ar":"الدكتور إياد قنيبي داعية ومفكر إسلامي فلسطيني وُلد عام 1975 في الكويت ونشأ في الأردن، ويحمل تكوينًا أكاديميًا في الصيدلة إضافة إلى اهتمامه الواسع بالفكر الإسلامي والقضايا المعاصرة. اشتهر بخطابه المؤثر في نقد الإلحاد والتيارات الفكرية الحديثة، وبحضوره البارز في الفضاء الرقمي.\n\nيركز في محاضراته وكتاباته على معالجة قضايا الهوية والإيمان والثوابت في مواجهة الشبهات، وعلى بناء وعي شبابي يجمع بين العمق الفكري والبعد التربوي. ويقدّم مواد متنوعة في العقيدة والفكر والتزكية، عُرف فيها بالأسلوب المباشر والمنهجية في عرض الأفكار.","en":"Dr. Iyad Qunaibi is a Palestinian Islamic preacher and thinker, born in 1975 in Kuwait and raised in Jordan, with an academic background in pharmacy alongside a broad engagement with Islamic thought and contemporary issues. He is widely known for his influential discourse critiquing atheism and modern intellectual currents, and for his prominent presence in the digital sphere.\n\nIn his lectures and writings he focuses on addressing questions of identity, faith, and core principles in the face of doubts, and on fostering youth awareness that combines intellectual depth with moral formation. He offers diverse materials on creed, thought, and spiritual development, recognized for a direct style and methodical presentation of ideas.","fr":"Le Dr Iyad Qounaïbi est un prédicateur et penseur islamique palestinien, né en 1975 au Koweït et ayant grandi en Jordanie, doté d’une formation académique en pharmacie et d’un large intérêt pour la pensée islamique et les questions contemporaines. Il est largement connu pour son discours influent critiquant l’athéisme et les courants intellectuels modernes, ainsi que pour sa forte présence dans l’espace numérique.\n\nDans ses conférences et ses écrits, il s’attache à traiter les questions d’identité, de foi et de principes face aux doutes, et à développer une conscience chez les jeunes qui allie profondeur intellectuelle et dimension éducative. Il propose des contenus variés sur la croyance, la pensée et la purification spirituelle, reconnus pour leur style direct et leur présentation méthodique des idées.","es":"El Dr. Iyad Qunaibi es un predicador y pensador islámico palestino, nacido en 1975 en Kuwait y criado en Jordania, con formación académica en farmacia además de un amplio interés por el pensamiento islámico y las cuestiones contemporáneas. Es ampliamente conocido por su influyente discurso crítico con el ateísmo y las corrientes intelectuales modernas, y por su destacada presencia en el ámbito digital.\n\nEn sus conferencias y escritos se centra en abordar cuestiones de identidad, fe y principios fundamentales frente a las dudas, y en fomentar una conciencia juvenil que combine profundidad intelectual y dimensión formativa. Ofrece materiales diversos sobre creencia, pensamiento y desarrollo espiritual, reconocidos por un estilo directo y una presentación metódica de las ideas."}},{"n":"11","name":{"ar":"الدكتور عبد الله العجيري","en":"Dr. Abdullah Al-Ajiri","fr":"Dr Abdallah Al-Ajiri","es":"Dr. Abdullah Al-Ajiri"},"website":"","tag":{"ar":"فكر معاصر","en":"contemporary thought","fr":"pensée contemporaine","es":"pensamiento contemporáneo"},"desc":{"ar":"الدكتور عبد الله العجيري باحث ومفكر كويتي وُلد في سبعينيات القرن العشرين في الكويت، يُعنى بالفكر الإسلامي المعاصر وقضايا الوعي والمنهج وبناء الشخصية. يجمع في أعماله بين الاهتمام بالتراث الفكري الإسلامي والاشتغال على إشكالات الواقع الثقافي والاجتماعي.\n\nيقدّم من خلال كتبه ومحاضراته مقاربات تربوية وفكرية تستهدف الشباب، مركّزًا على تنمية التفكير النقدي وتعزيز الانتماء القيمي. ويسعى في طرحه إلى تقديم خطاب متوازن يجمع بين العمق المعرفي والوضوح، مع اهتمام خاص بقضايا التعليم والنهضة والهوية.","en":"Dr. Abdullah al-Ajiri is a Kuwaiti researcher and thinker, born in Kuwait in the 1970s, concerned with contemporary Islamic thought, questions of awareness and methodology, and character development. His work combines engagement with the Islamic intellectual heritage and reflection on the challenges of contemporary cultural and social life.\n\nThrough his books and lectures he offers educational and intellectual approaches aimed at young people, focusing on developing critical thinking and strengthening value-based identity. His discourse seeks to provide a balanced perspective that brings together depth of knowledge and clarity, with particular attention to education, renewal, and identity.","fr":"Le Dr Abdallah al-Ajiri est un chercheur et penseur koweïtien, né au Koweït dans les années 1970, qui s’intéresse à la pensée islamique contemporaine, aux questions de conscience et de méthodologie, ainsi qu’à la formation de la personnalité. Ses travaux associent l’étude du patrimoine intellectuel islamique à la réflexion sur les défis de la réalité culturelle et sociale actuelle.\n\nÀ travers ses ouvrages et conférences, il propose des approches éducatives et intellectuelles destinées aux jeunes, en mettant l’accent sur le développement de la pensée critique et le renforcement de l’identité fondée sur les valeurs. Son discours vise à offrir une perspective équilibrée alliant profondeur du savoir et clarté, avec une attention particulière à l’éducation, au renouveau et à l’identité.","es":"El Dr. Abdullah al-Ajiri es un investigador y pensador kuwaití, nacido en Kuwait en la década de 1970, dedicado al pensamiento islámico contemporáneo, las cuestiones de conciencia y metodología, y la formación del carácter. Su obra combina el interés por el patrimonio intelectual islámico con la reflexión sobre los desafíos de la realidad cultural y social actual.\n\nA través de sus libros y conferencias ofrece enfoques educativos e intelectuales dirigidos a los jóvenes, centrados en el desarrollo del pensamiento crítico y el fortalecimiento de la identidad basada en valores. Su discurso busca ofrecer una perspectiva equilibrada que una profundidad de conocimiento y claridad, con especial atención a la educación, la renovación y la identidad."}},{"n":"12","name":{"ar":"أحمد بن يوسف السيد","en":"Ahmed bin Yusuf al-Sayyid","fr":"Ahmed bin Yusuf al-Sayyid","es":"Ahmed bin Yusuf al-Sayyid"},"website":"https://ahmadalsayed.net/books","tag":{"ar":"دعوة وبناء معرفي","en":"Da'wah and intellectual development","fr":"Prédication et formation intellectuelle","es":"Da'wa y desarrollo intelectual"},"desc":{"ar":"أحمد بن يوسف السيد داعية وباحث ومؤلف سعودي وُلد عام 1985 في مدينة ينبع بالمملكة العربية السعودية، ونشأ فيها ثم انتقل إلى المدينة المنورة. عُرف بجهوده في التربية الدعوية والبناء المعرفي، وباهتمامه بتحصين الشباب فكريًا وإيمانيًا وصناعة الدعاة والمصلحين، في إطار رسالة تقوم على إحياء منهاج النبوة.\n\nيشرف على عدد من المشاريع والبرامج العلمية والتربوية، من أبرزها برنامج «البناء المنهجي» وبرنامج «برد اليقين» و«أكاديمية الجيل الصاعد»، إلى جانب مبادرات معنية بالرد على الشبهات وبناء الوعي مثل «صناعة المحاور» وموقع «المحاورون». وله مؤلفات ومحاضرات وسلاسل تعليمية في العقيدة والحديث والفكر المعاصر، يسعى من خلالها إلى الجمع بين التأصيل الشرعي والمعالجة المنهجية لقضايا الواقع.","en":"Ahmed bin Yusuf al-Sayyid is a Saudi preacher, researcher, and author, born in 1985 in Yanbu, Saudi Arabia, where he was raised before moving to Madinah. He is known for his work in da'wah-oriented education and intellectual development, with a focus on strengthening young people intellectually and in faith and on cultivating committed reformers, guided by a mission centered on reviving the Prophetic method.\n\nHe oversees several educational and formative projects and programs, most notably “al-Bina’ al-Manhaji” (Methodological Development), “Bard al-Yaqin” (The Coolness of Certainty), and the “Rising Generation Academy,” alongside initiatives addressing doubts and fostering awareness such as “Sina‘at al-Muhawir” (Debater Training) and the “al-Muhawirun” platform. Through his books, lectures, and teaching series on creed, Hadith, and contemporary thought, he seeks to combine sound scholarly foundations with clear, methodical engagement with present-day issues.","fr":"Ahmed bin Yusuf al-Sayyid est un prédicateur, chercheur et auteur saoudien, né en 1985 à Yanbu en Arabie saoudite, où il a grandi avant de s’installer à Médine. Il est connu pour son travail dans l’éducation liée à la da'wa et le développement intellectuel, avec un accent particulier sur le renforcement intellectuel et spirituel des jeunes et sur la formation de réformateurs engagés, dans le cadre d’une mission axée sur la revivification de la voie prophétique.\n\nIl supervise plusieurs projets et programmes éducatifs et formatifs, notamment « al-Bina’ al-Manhaji » (Construction méthodique), « Bard al-Yaqin » (La fraîcheur de la certitude) et « l’Académie de la génération montante », ainsi que des initiatives consacrées à la réponse aux objections et au développement de la conscience, telles que « Sina‘at al-Muhawir » (Formation au débat) et la plateforme « al-Muhawirun ». À travers ses ouvrages, conférences et séries pédagogiques sur la croyance, le hadith et la pensée contemporaine, il s’efforce d’allier des fondements savants solides à un traitement clair et méthodique des questions actuelles.","es":"Ahmed bin Yusuf al-Sayyid es un predicador, investigador y autor saudí, nacido en 1985 en Yanbu (Arabia Saudita), donde se crió antes de trasladarse a Medina. Es conocido por su labor en la educación vinculada a la da'wa y el desarrollo intelectual, con especial atención al fortalecimiento intelectual y espiritual de los jóvenes y a la formación de reformadores comprometidos, guiado por una misión centrada en revivir el método profético.\n\nSupervisa diversos proyectos y programas educativos y formativos, entre los que destacan «al-Bina’ al-Manhaji» (Construcción metodológica), «Bard al-Yaqin» (La frescura de la certeza) y la «Academia de la Generación Joven», además de iniciativas orientadas a responder a las dudas y a fomentar la conciencia, como «Sina‘at al-Muhawir» (Formación en debate) y la plataforma «al-Muhawirun». A través de sus libros, conferencias y series didácticas sobre creencia, hadiz y pensamiento contemporáneo, busca combinar fundamentos académicos sólidos con un abordaje claro y metódico de las cuestiones actuales."}},{"n":"13","name":{"ar":"أبو عمر الباحث (طارق السيد)","en":"Abu Omar al-Bahith (Tarek al-Sayed)","fr":"Abu Omar al-Bahith (Tarek al-Sayed)","es":"Abu Omar al-Bahith (Tarek al-Sayed)"},"website":"https://antishubohat.wordpress.com/","tag":{"ar":"مكافح الشبهات والردود","en":"Refuting doubts and misconceptions","fr":"Réfutation des doutes et des idées fausses","es":"Refutación de dudas e ideas erróneas"},"desc":{"ar":"أبو عمر الباحث (واسمه الحقيقي طارق السيد) داعية وباحث مصري، وُلد في القاهرة عام 1980. يُعنى بمقارنة الأديان والرد على الشبهات المثارة حول الإسلام والسنة النبوية، ويعرّف نفسه بأنه مسلم سني يتبع منهج السلف الصالح في الاعتقاد والاستدلال. بدأ طلبه للعلم الشرعي في معهد ابن الجزري للقرآن والقراءات، وارتبطت دراسته بكلية دار العلوم بجامعة القاهرة، كما حصل على إجازة في قراءة حفص عن عاصم.\n\nيُعد من أوائل صانعي المحتوى الدعوي على يوتيوب في مجال الرد على الشبهات منذ نحو عامي 2008 و2009، واشتهر في بداياته بردوده التفصيلية على شبهات المنصرين، ثم توسع نشاطه ليشمل الرد على الإلحاد ومنكري السنة والعلمانية والشيعة وغيرها من الطروحات، مع اعتماد أسلوب التوثيق المباشر لنصوص المصادر وإحالاتها. ينشر إنتاجه عبر منصات «مكافح الشبهات»، ولا سيما قناته على يوتيوب ومدونته، إلى جانب حضوره على منصات التواصل الاجتماعي.","en":"Abu Omar al-Bahith (real name Tarek al-Sayed) is an Egyptian preacher and researcher, born in Cairo in 1980. He focuses on comparative religion and on responding to doubts raised about Islam and the Prophetic Sunnah, and describes himself as a Sunni Muslim who follows the methodology of the early generations (Salaf) in creed and reasoning. He began his Islamic studies at the Ibn al-Jazari Institute for Qur’an and Qur’anic readings, studied at Dar al-Ulum College of Cairo University, and obtained an ijazah in the recitation of Hafs ‘an ‘Asim.\n\nHe is regarded as one of the early da'wah content creators on YouTube in the field of refuting misconceptions, active since around 2008–2009. He first became known for detailed responses to the claims of Christian missionaries and later broadened his work to address atheism, Qur’anists, secularism, Shi’ism, and other currents, using a style marked by on-screen documentation of sources and references. He publishes his work through the “Mukafih al-Shubuhat” (Fighter of Doubts) platforms, notably his YouTube channel and blog, alongside his presence on social media.","fr":"Abu Omar al-Bahith (de son vrai nom Tarek al-Sayed) est un prédicateur et chercheur égyptien, né au Caire en 1980. Il se consacre aux religions comparées et à la réponse aux doutes soulevés à propos de l’islam et de la Sunna prophétique, et se définit comme un musulman sunnite suivant la méthodologie des pieux prédécesseurs (salaf) en matière de croyance et d’argumentation. Il a commencé ses études religieuses à l’Institut Ibn al-Jazari pour le Coran et les lectures coraniques, a étudié à la faculté Dar al-Ulum de l’Université du Caire et a obtenu une ijaza dans la lecture de Hafs ‘an ‘Asim.\n\nIl est considéré comme l’un des premiers créateurs de contenu de da'wa sur YouTube dans le domaine de la réfutation des objections, actif depuis environ 2008–2009. Il s’est d’abord fait connaître par des réponses détaillées aux allégations de missionnaires chrétiens, puis a élargi son activité à la réfutation de l’athéisme, du coranisme, du sécularisme, du chiisme et d’autres courants, en adoptant un style caractérisé par la présentation directe des sources et des références à l’écran. Il diffuse ses travaux via les plateformes « Mukafih al-Shubuhat » (Combattant des doutes), notamment sa chaîne YouTube et son blog, ainsi que sur les réseaux sociaux.","es":"Abu Omar al-Bahith (nombre real Tarek al-Sayed) es un predicador e investigador egipcio, nacido en El Cairo en 1980. Se dedica al estudio comparado de las religiones y a responder a las dudas planteadas sobre el islam y la sunna profética, y se define como un musulmán suní que sigue la metodología de los predecesores piadosos (salaf) en la creencia y la argumentación. Comenzó sus estudios islámicos en el Instituto Ibn al-Jazari del Corán y las lecturas coránicas, estudió en la Facultad Dar al-Ulum de la Universidad de El Cairo y obtuvo una iyaza en la recitación de Hafs ‘an ‘Asim.\n\nEs considerado uno de los primeros creadores de contenido de da'wa en YouTube en el ámbito de la refutación de objeciones, activo desde aproximadamente 2008–2009. Al principio se dio a conocer por sus respuestas detalladas a las alegaciones de misioneros cristianos, y posteriormente amplió su labor para abordar el ateísmo, el coranismo, el secularismo, el chiismo y otras corrientes, con un estilo caracterizado por la documentación directa de fuentes y referencias en pantalla. Difunde su trabajo a través de las plataformas «Mukafih al-Shubuhat» (Combatiente de las dudas), especialmente su canal de YouTube y su blog, además de su presencia en redes sociales."},"yt":"https://www.youtube.com/@antishubohat"},{"n":"14","name":{"ar":"الشيخ محمد شاهين التاعب","en":"Sheikh Mohamed Shahin Al-Ta'ib","fr":"Cheikh Mohamed Chahine Al-Ta'ib","es":"Sheij Mohamed Shahin Al-Ta'ib"},"website":"","tag":{"ar":"دعوة ونقد فكري","en":"da'wah and intellectual critique","fr":"da'wa et critique intellectuelle","es":"da'wa y crítica intelectual"},"desc":{"ar":"الشيخ محمد شاهين التاعب داعية مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بقضايا العقيدة والفكر الإسلامي المعاصر والرد على الشبهات. عُرف بأسلوبه التعليمي القريب من الشباب وبحرصه على تبسيط المفاهيم العقدية والفكرية.\n\nيقدّم عبر دروسه وسلاسله المرئية محتوى يجمع بين التأسيس العلمي والمعالجة العملية لقضايا الإيمان والهوية. ويركز في خطابه على بناء الوعي والتحصين الفكري، مع توظيف لغة واضحة وأمثلة قريبة من الواقع المعاصر.","en":"Sheikh Mohamed Shahin al-Ta'ib is an Egyptian preacher, born in Egypt in the 1970s, concerned with matters of creed, contemporary Islamic thought, and responses to doubts. He is known for an educational style that resonates with young people and for his efforts to simplify doctrinal and intellectual concepts.\n\nThrough his lessons and video series he offers content that combines sound foundations with practical engagement with questions of faith and identity. His discourse focuses on building awareness and intellectual resilience, using clear language and examples drawn from contemporary life.","fr":"Le cheikh Mohamed Chahine al-Ta'ib est un prédicateur égyptien, né en Égypte dans les années 1970, qui s’intéresse aux questions de croyance, à la pensée islamique contemporaine et aux réponses aux objections. Il est connu pour un style pédagogique proche des jeunes et pour ses efforts visant à simplifier les concepts doctrinaux et intellectuels.\n\nÀ travers ses cours et séries vidéo, il propose un contenu qui associe fondements solides et traitement concret des questions de foi et d’identité. Son discours met l’accent sur le développement de la conscience et de la résilience intellectuelle, en utilisant un langage clair et des exemples tirés de la réalité contemporaine.","es":"El sheij Mohamed Shahin al-Ta'ib es un predicador egipcio, nacido en Egipto en la década de 1970, interesado en las cuestiones de creencia, el pensamiento islámico contemporáneo y las respuestas a las dudas. Es conocido por un estilo educativo cercano a los jóvenes y por su esfuerzo por simplificar conceptos doctrinales e intelectuales.\n\nA través de sus lecciones y series en vídeo ofrece contenidos que combinan fundamentos sólidos con un abordaje práctico de las cuestiones de fe e identidad. Su discurso se centra en desarrollar la conciencia y la resiliencia intelectual, empleando un lenguaje claro y ejemplos tomados de la realidad contemporánea."}},{"n":"15","name":{"ar":"أحمد سبيع","en":"Ahmed Subai'","fr":"Ahmed Subai'","es":"Ahmed Subai'"},"website":"","tag":{"ar":"أهل الكتاب","en":"People of the Book","fr":"Gens du Livre","es":"Gente del Libro"},"desc":{"ar":"أحمد سبيع باحث مصري وُلد في ثمانينيات القرن العشرين في مصر، متخصص في مقارنة الأديان والحوار مع أهل الكتاب. اهتم بدراسة النصوص الدينية في اليهودية والمسيحية، وبمتابعة الإشكالات الحوارية المطروحة في هذا المجال.\n\nيقدّم عبر محاضراته ومقاطعِه المرئية مواد تعتمد على المقارنة النصية والتحليل المنهجي، مع التركيز على عرض المفاهيم الإسلامية وتصحيح الصور النمطية. ويسعى في نشاطه إلى تعزيز الحوار المبني على المعرفة والاحترام المتبادل والالتزام بالمعايير العلمية في البحث.","en":"Ahmed Subai' is an Egyptian researcher, born in Egypt in the 1980s, specializing in comparative religion and dialogue with the People of the Book. He focuses on studying religious texts in Judaism and Christianity and on engaging with the key questions raised in interfaith dialogue.\n\nThrough his lectures and video materials he presents content based on textual comparison and methodical analysis, with emphasis on explaining Islamic concepts and correcting stereotypes. His work seeks to promote dialogue grounded in knowledge, mutual respect, and adherence to scholarly standards of research.","fr":"Ahmed Subai' est un chercheur égyptien, né en Égypte dans les années 1980, spécialisé dans les religions comparées et le dialogue avec les Gens du Livre. Il s’intéresse à l’étude des textes religieux du judaïsme et du christianisme ainsi qu’aux principales questions soulevées dans le dialogue interreligieux.\n\nÀ travers ses conférences et ses vidéos, il propose des contenus fondés sur la comparaison textuelle et l’analyse méthodique, en mettant l’accent sur la présentation des concepts islamiques et la correction des stéréotypes. Son activité vise à promouvoir un dialogue fondé sur la connaissance, le respect mutuel et le respect des normes scientifiques de la recherche.","es":"Ahmed Subai' es un investigador egipcio, nacido en Egipto en la década de 1980, especializado en religiones comparadas y en el diálogo con la Gente del Libro. Se centra en el estudio de los textos religiosos del judaísmo y el cristianismo y en el tratamiento de las principales cuestiones planteadas en el diálogo interreligioso.\n\nA través de sus conferencias y materiales en vídeo presenta contenidos basados en la comparación textual y el análisis metódico, con énfasis en la exposición de los conceptos islámicos y la corrección de estereotipos. Su labor busca promover un diálogo fundamentado en el conocimiento, el respeto mutuo y la adhesión a los estándares académicos de investigación."}},{"n":"16","name":{"ar":"عبدالله الشهري","en":"Abdullah al-Shahri","fr":"Abdullah al-Shahri","es":"Abdullah al-Shahri"},"website":"","tag":{"ar":"الرد على الإلحاد والشبهات","en":"responding to atheism and doubts","fr":"réponse à l’athéisme et aux doutes","es":"respuesta al ateísmo y a las dudas"},"desc":{"ar":"عبد الله الشهري باحث وكاتب سعودي وُلد في ثمانينيات القرن العشرين في المملكة العربية السعودية، يهتم بنقد الإلحاد والرد على الشبهات الفكرية المعاصرة وتعزيز اليقين الإيماني. يركز في اهتماماته على دراسة الطروحات الإلحادية واللادينية ومناقشتها من زوايا فكرية وعلمية ومنهجية، مع العناية بقضايا الشك والإيمان لدى الشباب.\n\nله مشاركات وكتابات ومحاضرات في هذا المجال، يسعى من خلالها إلى تقديم معالجة واعية للشبهات المثارة حول الدين، وربط النقاش المعرفي بالأصول الإسلامية الراسخة. ويحرص في طرحه على الجمع بين وضوح الحجّة والأسلوب التعليمي الذي يساعد المتلقي على فهم الإشكالات والتعامل معها بثقة ووعي.","en":"Abdullah al-Shahri is a Saudi researcher and writer, born in Saudi Arabia in the 1980s, interested in critiquing atheism, responding to contemporary intellectual doubts, and strengthening faith. His work focuses on studying atheistic and irreligious arguments and engaging them from intellectual, scientific, and methodological perspectives, with particular attention to questions of doubt and belief among young people.\n\nHe has contributed writings, lectures, and discussions in this field, seeking to offer thoughtful responses to doubts raised about religion while grounding the discussion in established Islamic principles. His approach combines clear argumentation with an educational style that helps audiences understand these issues and address them with confidence and awareness.","fr":"Abdullah al-Shahri est un chercheur et auteur saoudien, né en Arabie saoudite dans les années 1980, qui s’intéresse à la critique de l’athéisme, à la réponse aux doutes intellectuels contemporains et au renforcement de la foi. Son travail porte sur l’étude des thèses athées et irréligieuses et sur leur examen selon des perspectives intellectuelles, scientifiques et méthodologiques, avec une attention particulière aux questions de doute et de croyance chez les jeunes.\n\nIl a contribué à ce domaine par des écrits, des conférences et des interventions, cherchant à proposer des réponses réfléchies aux objections soulevées à propos de la religion, tout en ancrant la réflexion dans les principes islamiques établis. Son approche allie clarté argumentative et pédagogie, afin d’aider le public à comprendre ces questions et à les aborder avec assurance et discernement.","es":"Abdullah al-Shahri es un investigador y escritor saudí, nacido en Arabia Saudita en la década de 1980, interesado en la crítica del ateísmo, la respuesta a las dudas intelectuales contemporáneas y el fortalecimiento de la fe. Su labor se centra en el estudio de los planteamientos ateos e irreligiosos y en su análisis desde perspectivas intelectuales, científicas y metodológicas, con especial atención a las cuestiones de duda y creencia entre los jóvenes.\n\nHa realizado aportes en este ámbito mediante escritos, conferencias y participaciones, con el propósito de ofrecer respuestas reflexivas a las objeciones planteadas sobre la religión, fundamentando el debate en principios islámicos establecidos. Su enfoque combina la claridad argumentativa con un estilo educativo que ayuda a comprender estas cuestiones y abordarlas con confianza y conciencia."}},{"n":"17","name":{"ar":"حمزة تزورتزيس","en":"Hamza Tzortzis","fr":"Hamza Tzortzis","es":"Hamza Tzortzis"},"website":"https://www.hamzatzortzis.com/","tag":{"ar":"فلسفة ومناظرة","en":"philosophy and debate","fr":"philosophie et débat","es":"filosofía y debate"},"desc":{"ar":"حمزة أندرياس تزورتزيس باحث ومتحدث بريطاني وُلد عام 1980 لأبوين يونانيين في المملكة المتحدة، واعتنق الإسلام عام 2002. تخصص في الفلسفة والدراسات الإسلامية، واشتهر عالميًا بمشاركته في حوارات ومناظرات حول وجود الله والإلحاد والأخلاق والنبوة.\n\nأسهم في تأسير مبادرات دعوية وفكرية مثل «iERA»، وكتب وقدم محاضرات تهدف إلى عرض الحجج العقلية للإيمان الإسلامي بأسلوب منهجي معاصر. ويجمع في عمله بين العمق الفلسفي والاهتمام بقضايا الشباب في المجتمعات الغربية، مع حضور واسع في المنصات الإعلامية والجامعية.","en":"Hamza Andreas Tzortzis is a British researcher and speaker, born in 1980 in the United Kingdom to Greek parents, who embraced Islam in 2002. He specializes in philosophy and Islamic studies and is internationally known for his participation in dialogues and debates on the existence of God, atheism, ethics, and prophethood.\n\nHe contributed to founding da'wah and intellectual initiatives such as iERA, and has written and lectured to present rational arguments for the Islamic faith in a contemporary, methodical style. His work combines philosophical depth with attention to the concerns of young people in Western societies, and he maintains a wide presence across media and academic platforms.","fr":"Hamza Andreas Tzortzis est un chercheur et conférencier britannique, né en 1980 au Royaume-Uni de parents grecs, qui a embrassé l’islam en 2002. Spécialisé en philosophie et en études islamiques, il est connu internationalement pour sa participation à des dialogues et débats sur l’existence de Dieu, l’athéisme, l’éthique et la prophétie.\n\nIl a contribué à la création d’initiatives de da'wa et de réflexion telles qu’iERA, et a écrit et donné des conférences visant à présenter les arguments rationnels en faveur de la foi islamique dans un style contemporain et méthodique. Son travail allie profondeur philosophique et attention aux préoccupations des jeunes dans les sociétés occidentales, avec une large présence sur les plateformes médiatiques et universitaires.","es":"Hamza Andreas Tzortzis es un investigador y conferenciante británico, nacido en 1980 en el Reino Unido de padres griegos, que abrazó el islam en 2002. Se especializa en filosofía y estudios islámicos y es conocido internacionalmente por su participación en diálogos y debates sobre la existencia de Dios, el ateísmo, la ética y la profecía.\n\nContribuyó a la fundación de iniciativas de da'wa e intelectuales como iERA, y ha escrito e impartido conferencias para presentar argumentos racionales a favor de la fe islámica con un estilo contemporáneo y metódico. Su trabajo combina la profundidad filosófica con la atención a las inquietudes de los jóvenes en las sociedades occidentales, manteniendo una amplia presencia en plataformas mediáticas y académicas."}},{"n":"18","name":{"ar":"محمد حجاب","en":"Mohammed Hijab","fr":"Mohammed Hijab","es":"Mohammed Hijab"},"website":"https://www.mohammedhijab.com/","tag":{"ar":"مناظرات وفلسفة","en":"debate and philosophy","fr":"débat et philosophie","es":"debate y filosofía"},"desc":{"ar":"محمد حجاب داعية ومناظر بريطاني وُلد في 19 أكتوبر 1991 في لندن بإنجلترا لأبوين من أصول مصرية. تلقى تعليمًا أكاديميًا متعددًا في السياسة والتاريخ والدراسات الإسلامية واللاهوت، وبرز في الساحة الدعوية الناطقة بالإنجليزية من خلال المناظرات العامة والحضور الرقمي.\n\nيُعرف بمشاركته في حوارات ومناظرات حول الإسلام والإلحاد والفلسفة والقضايا المعاصرة، وباهتمامه بتقديم الحجج الفكرية والدفاع عن المعتقدات الإسلامية في الفضاء العام. ويسعى في نشاطه إلى الجمع بين الطرح الجدلي والتفاعل مع الأسئلة الفكرية التي تطرحها المجتمعات الغربية المعاصرة.","en":"Mohammed Hijab is a British preacher and debater, born on 19 October 1991 in London, England, to parents of Egyptian origin. He received multidisciplinary academic education in politics, history, Islamic studies, and theology, and rose to prominence in English-speaking da'wah through public debates and a strong digital presence.\n\nHe is known for taking part in dialogues and debates on Islam, atheism, philosophy, and contemporary issues, and for presenting intellectual arguments in defense of Islamic beliefs in the public sphere. In his work, he seeks to combine debate with engagement on the intellectual questions raised in contemporary Western societies.","fr":"Mohammed Hijab est un prédicateur et débatteur britannique, né le 19 octobre 1991 à Londres, en Angleterre, de parents d’origine égyptienne. Il a reçu une formation universitaire pluridisciplinaire en politique, histoire, études islamiques et théologie, et s’est fait connaître dans le domaine de la da'wa anglophone grâce à des débats publics et à une forte présence numérique.\n\nIl est connu pour sa participation à des dialogues et débats sur l’islam, l’athéisme, la philosophie et les questions contemporaines, ainsi que pour sa volonté de présenter des arguments intellectuels en défense des convictions islamiques dans l’espace public. Dans son activité, il cherche à allier débat et réflexion sur les questions intellectuelles soulevées dans les sociétés occidentales contemporaines.","es":"Mohammed Hijab es un predicador y polemista británico, nacido el 19 de octubre de 1991 en Londres, Inglaterra, de padres de origen egipcio. Recibió una formación académica multidisciplinar en política, historia, estudios islámicos y teología, y alcanzó notoriedad en la da'wa de habla inglesa mediante debates públicos y una destacada presencia digital.\n\nEs conocido por su participación en diálogos y debates sobre el islam, el ateísmo, la filosofía y cuestiones contemporáneas, así como por presentar argumentos intelectuales en defensa de las creencias islámicas en el espacio público. En su labor, busca combinar el debate con el abordaje de las cuestiones intelectuales planteadas en las sociedades occidentales contemporáneas."}},{"n":"19","name":{"ar":"الدكتور منقذ السقار","en":"Dr. Munqidh Al-Saqqar","fr":"Dr Mounqidh Al-Saqqar","es":"Dr. Munqidh Al-Saqqar"},"website":"","tag":{"ar":"دراسات دينية","en":"religious studies","fr":"études religieuses","es":"estudios religiosos"},"desc":{"ar":"الدكتور منقذ بن محمود السقار داعية وباحث سوري وُلد عام 1967 في مدينة حماة بسوريا، متخصص في مقارنة الأديان والكتب والعقائد النصرانية. تخرّج في كلية أصول الدين بجامعة أم القرى بمكة المكرمة، حيث أتم مراحل البكالوريوس والماجستير والدكتوراه، ويمارس الخطابة في مكة منذ عام 1990.\n\nعُرف بعنايته بدراسة الكتب المقدسة والنصوص التراثية وتحليل الأطروحات الفكرية والعقدية بمنهجية توثيقية، وبمشاركته في حوارات ومناظرات وملتقيات متخصصة في محاورة أتباع الأديان. وله مؤلفات وبرامج في بيان دلائل النبوة والرد على الشبهات المثارة حول الإسلام والنصوص الدينية، مع حرص على الجمع بين التأصيل العلمي والعرض الواضح.","en":"Dr. Munqidh bin Mahmoud al-Saqqar is a Syrian preacher and researcher, born in 1967 in Hama, Syria, specializing in comparative religion and in Christian scriptures and doctrines. He studied at the College of Fundamentals of Religion at Umm al-Qura University in Makkah, where he completed his bachelor's, master's, and doctoral degrees, and has served as a preacher in Makkah since 1990.\n\nHe is known for his study of scriptures and traditional texts and for analyzing diverse intellectual and doctrinal claims through a documentary approach. He has participated in dialogues, debates, and specialized forums engaging followers of other religions. His writings and programs address the evidences of prophethood and respond to doubts raised about Islam and religious texts, combining scholarly rigor with clear presentation.","fr":"Le Dr Munqidh bin Mahmoud al-Saqqar est un prédicateur et chercheur syrien, né en 1967 à Hama en Syrie, spécialisé dans les religions comparées ainsi que dans les écritures et les doctrines chrétiennes. Il a étudié à la faculté des fondements de la religion de l’Université Umm al-Qura à La Mecque, où il a obtenu ses diplômes de licence, de master et de doctorat, et il exerce la fonction de prédicateur à La Mecque depuis 1990.\n\nIl est connu pour son étude des écritures et des textes traditionnels, ainsi que pour son analyse méthodique et documentée de diverses thèses intellectuelles et doctrinales. Il a participé à des dialogues, des débats et des rencontres spécialisés avec des adeptes d’autres religions. Ses ouvrages et ses programmes portent sur les preuves de la prophétie et la réponse aux doutes soulevés à propos de l’islam et des textes religieux, en alliant rigueur scientifique et clarté d’exposition.","es":"El Dr. Munqidh bin Mahmoud al-Saqqar es un predicador e investigador sirio, nacido en 1967 en Hama (Siria), especializado en religiones comparadas y en las escrituras y doctrinas cristianas. Estudió en la Facultad de Fundamentos de la Religión de la Universidad Umm al-Qura en La Meca, donde completó sus estudios de licenciatura, maestría y doctorado, y ejerce como predicador en La Meca desde 1990.\n\nEs conocido por su estudio de las escrituras y los textos tradicionales y por su análisis de diversas tesis intelectuales y doctrinales mediante un enfoque documental. Ha participado en diálogos, debates y encuentros especializados con seguidores de otras religiones. Sus obras y programas abordan las pruebas de la profecía y responden a las dudas planteadas sobre el islam y los textos religiosos, combinando rigor académico y claridad expositiva."}},{"n":"20","name":{"ar":"معاذ عليان","en":"Moaz Aliian","fr":"Moaz Aliian","es":"Moaz Aliian"},"website":"","tag":{"ar":"مناظرات وحوار","en":"debate and dialogue","fr":"débat et dialogue","es":"debate y diálogo"},"desc":{"ar":"معاذ عليان باحث ومناظر مصري وُلد عام 1982 في القاهرة بمصر، اهتم منذ عام 2004 بمجال مقارنة الأديان والحوار الإسلامي المسيحي والرد على الشبهات. أسس عام 2009 قناة «المخلّص» لمناقشة القضايا المتعلقة بمقارنة الأديان، وله عدد من المؤلفات المشتركة والفردية في هذا المجال.\n\nينشط في إنتاج محتوى مكتوب ومرئي يناقش القضايا العقدية والنصية، مع اعتماد ملحوظ على عرض المصادر والمراجع والاستدلال. ويسعى في عمله إلى تقديم خطاب مبني على التتبع والتوثيق في معالجة الإشكالات المطروحة في ساحات الحوار والمناظرة.","en":"Moaz Aliian is an Egyptian researcher and debater, born in 1982 in Cairo, Egypt. Since 2004 he has focused on comparative religion, Muslim–Christian dialogue, and responding to doubts. In 2009 he founded the “Al-Mukhalis” channel to address issues in comparative religion, and he has authored and co-authored several works in this field.\n\nHe is active in producing written and visual content that discusses doctrinal and textual issues, with notable emphasis on presenting sources, references, and evidence. In his work, he aims to offer a discourse grounded in careful examination and documentation when addressing questions raised in dialogue and debate.","fr":"Moaz Aliian est un chercheur et débatteur égyptien, né en 1982 au Caire, en Égypte. Depuis 2004, il se consacre aux religions comparées, au dialogue islamo-chrétien et à la réponse aux objections. En 2009, il a fondé la chaîne « Al-Mukhalis » pour traiter des questions liées aux religions comparées, et il est l’auteur ou le coauteur de plusieurs ouvrages dans ce domaine.\n\nIl produit activement des contenus écrits et audiovisuels portant sur des questions doctrinales et textuelles, en accordant une grande importance à la présentation des sources, des références et des preuves. Dans son travail, il cherche à proposer un discours fondé sur l’examen minutieux et la documentation des questions soulevées dans le dialogue et le débat.","es":"Moaz Aliian es un investigador y polemista egipcio, nacido en 1982 en El Cairo (Egipto). Desde 2004 se ha centrado en las religiones comparadas, el diálogo islámico-cristiano y la respuesta a las dudas. En 2009 fundó el canal «Al-Mukhalis» para abordar cuestiones relacionadas con las religiones comparadas, y es autor y coautor de varias obras en este campo.\n\nDesarrolla una labor activa en la producción de contenidos escritos y audiovisuales que tratan cuestiones doctrinales y textuales, con especial énfasis en la presentación de fuentes, referencias y pruebas. En su trabajo busca ofrecer un discurso basado en el examen cuidadoso y la documentación de las cuestiones planteadas en el diálogo y el debate."}},{"n":"21","name":{"ar":"محمود داود","en":"Mahmoud Dawoud","fr":"Mahmoud Daoud","es":"Mahmoud Dawoud"},"website":"","tag":{"ar":"دعوة ومقارنة أديان","en":"da'wah and comparative religion","fr":"da'wa et religions comparées","es":"da'wa y religiones comparadas"},"desc":{"ar":"محمود داود داعية وباحث مصري وُلد في سبعينيات القرن العشرين في مصر، يهتم بمقارنة الأديان والدعوة والحوار حول القضايا العقدية والفكرية. عُرف بتقديم محتوى يجمع بين الخطاب المباشر والنقاش المبني على المصادر والنصوص.\n\nيشارك عبر محاضراته وبرامجه المرئية في تناول موضوعات تتعلق بالإيمان والنبوة والكتب المقدسة والرد على الشبهات، مع الحرص على تبسيط العرض دون الإخلال بأصول البحث. ويستهدف في نشاطه تعزيز الفهم الصحيح للدين وتمكين المتلقي من أدوات الحوار الواعي.","en":"Mahmoud Dawoud is an Egyptian preacher and researcher, born in Egypt in the 1970s, concerned with comparative religion, da'wah, and dialogue on doctrinal and intellectual issues. He is known for presenting content that combines direct communication with discussion grounded in sources and texts.\n\nThrough his lectures and video programs he addresses topics related to faith, prophethood, scriptures, and responses to doubts, while striving to simplify presentation without compromising scholarly principles. His work aims to promote a sound understanding of religion and to equip audiences with tools for thoughtful dialogue.","fr":"Mahmoud Daoud est un prédicateur et chercheur égyptien, né en Égypte dans les années 1970, qui s’intéresse aux religions comparées, à la da'wa et au dialogue sur les questions doctrinales et intellectuelles. Il est connu pour proposer des contenus associant un discours direct à une discussion fondée sur les sources et les textes.\n\nÀ travers ses conférences et ses émissions vidéo, il aborde des sujets liés à la foi, à la prophétie, aux Écritures et aux réponses aux objections, tout en s’efforçant de simplifier l’exposé sans compromettre les principes de la recherche. Son activité vise à promouvoir une compréhension juste de la religion et à fournir au public des outils pour un dialogue réfléchi.","es":"Mahmoud Dawoud es un predicador e investigador egipcio, nacido en Egipto en la década de 1970, interesado en las religiones comparadas, la da'wa y el diálogo sobre cuestiones doctrinales e intelectuales. Es conocido por presentar contenidos que combinan una comunicación directa con un debate basado en fuentes y textos.\n\nA través de sus conferencias y programas en vídeo aborda temas relacionados con la fe, la profecía, las escrituras y las respuestas a las dudas, procurando simplificar la exposición sin comprometer los principios del estudio riguroso. Su labor busca promover una comprensión correcta de la religión y dotar al público de herramientas para un diálogo consciente."}},{"n":"22","name":{"ar":"الشيخ يوسف إستس","en":"Sheikh Yusuf Estes","fr":"Cheikh Yusuf Estes","es":"Sheij Yusuf Estes"},"website":"https://www.yusufestes.com/","tag":{"ar":"مقارنة الأديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الشيخ يوسف إستس داعية أمريكي وُلد في 1 يناير 1944 في ولاية أوهايو بالولايات المتحدة ونشأ في ولاية تكساس، وكان قبل إسلامه واعظًا وقسًا في كنيسة مسيحية. اعتنق الإسلام عام 1991 بعد رحلة بحث طويلة في الأديان، ليصبح من أشهر الدعاة الناطقين بالإنجليزية في العالم.\n\nيُعرف بأسلوبه المبسّط والقريب من الجمهور في عرض مفاهيم الإسلام، وبنشاطه الواسع في المحاضرات والحوارات والبرامج الدعوية. ركز في جهوده على تعريف غير المسلمين بالإسلام وتصحيح الصور المغلوطة عنه، وعلى مرافقة المهتدين الجدد وتعليمهم أساسيات الدين بلغة واضحة وميسّرة.","en":"Sheikh Yusuf Estes is an American preacher, born on 1 January 1944 in Ohio, United States, and raised in Texas. Before embracing Islam he served as a Christian minister and preacher, and he converted to Islam in 1991 after a long journey of exploring different faiths, becoming one of the most well-known English-speaking da'wah figures worldwide.\n\nHe is known for a simple, approachable style in presenting the teachings of Islam and for his extensive activity in lectures, dialogues, and outreach programs. His efforts focus on introducing Islam to non-Muslims, correcting misconceptions about the faith, and supporting new Muslims by teaching them the fundamentals of the religion in clear and accessible language.","fr":"Le cheikh Yusuf Estes est un prédicateur américain, né le 1er janvier 1944 dans l’Ohio, aux États-Unis, et élevé au Texas. Avant d’embrasser l’islam, il fut ministre et prédicateur chrétien ; il s’est converti à l’islam en 1991 après un long parcours de recherche sur différentes religions, devenant l’une des figures de la da'wa anglophone les plus connues au monde.\n\nIl est reconnu pour son style simple et accessible dans la présentation des enseignements de l’islam, ainsi que pour son intense activité à travers conférences, dialogues et programmes de prédication. Ses efforts se concentrent sur la présentation de l’islam aux non-musulmans, la correction des idées fausses à son sujet et l’accompagnement des nouveaux musulmans dans l’apprentissage des fondements de la religion avec clarté.","es":"El sheij Yusuf Estes es un predicador estadounidense, nacido el 1 de enero de 1944 en Ohio, Estados Unidos, y criado en Texas. Antes de abrazar el islam fue ministro y predicador cristiano, y se convirtió al islam en 1991 tras un largo proceso de búsqueda en distintas religiones, llegando a ser una de las figuras de la da'wa de habla inglesa más conocidas en el mundo.\n\nEs conocido por su estilo sencillo y cercano al presentar las enseñanzas del islam, así como por su amplia actividad en conferencias, diálogos y programas de divulgación. Sus esfuerzos se centran en dar a conocer el islam a los no musulmanes, corregir ideas erróneas sobre la fe y acompañar a los nuevos musulmanes en el aprendizaje de los fundamentos de la religión de manera clara y accesible."}},{"n":"23","name":{"ar":"الدكتور ذاكر نايك","en":"Dr. Zakir Naik","fr":"Dr Zakir Naik","es":"Dr. Zakir Naik"},"website":"https://zakirnaik.com/","tag":{"ar":"مقارنة أديان","en":"comparative religion","fr":"religions comparées","es":"religiones comparadas"},"desc":{"ar":"الدكتور ذاكر نايك طبيب وداعية هندي وُلد في 18 أكتوبر 1965 في مدينة بومباي (مومباي حاليًا) بالهند، وأسس مؤسسة البحث الإسلامي (IRF) وقناة «Peace TV». درس الطب وحصل على شهادة البكالوريوس في الجراحة والطب، ثم اتجه إلى مجال الدعوة ومقارنة الأديان.\n\nاشتهر بمحاضراته ومناظراته حول الإسلام والأديان الأخرى، وبأسلوبه في عرض النصوص والمقارنات من مصادر متعددة. ركز في خطاباته على الرد على الشبهات الشائعة حول الإسلام والتعريف بمبادئه، وحقق حضورًا عالميًا واسعًا عبر المحاضرات المتلفزة والمنصات الرقمية.","en":"Dr. Zakir Naik is an Indian physician and preacher, born on 18 October 1965 in Bombay (now Mumbai), India. He founded the Islamic Research Foundation (IRF) and Peace TV. Trained in medicine with a Bachelor of Medicine and Surgery degree, he later devoted himself to da'wah and comparative religion.\n\nHe became widely known for his lectures and debates on Islam and other religions, and for his style of presenting texts and comparisons from multiple sources. His talks have focused on responding to common misconceptions about Islam and introducing its principles, gaining a broad global audience through televised lectures and digital platforms.","fr":"Le Dr Zakir Naik est un médecin et prédicateur indien, né le 18 octobre 1965 à Bombay (aujourd’hui Mumbai) en Inde. Il a fondé l’Islamic Research Foundation (IRF) et Peace TV. Formé en médecine avec un diplôme de Bachelor of Medicine and Surgery, il s’est ensuite consacré à la da'wa et aux religions comparées.\n\nIl s’est fait connaître par ses conférences et débats sur l’islam et les autres religions, ainsi que par sa manière de présenter des textes et des comparaisons issus de sources multiples. Ses interventions se sont concentrées sur la réponse aux idées reçues sur l’islam et la présentation de ses principes, lui assurant une large audience mondiale grâce aux conférences télévisées et aux plateformes numériques.","es":"El Dr. Zakir Naik es un médico y predicador indio, nacido el 18 de octubre de 1965 en Bombay (actual Mumbai), India. Fundó la Islamic Research Foundation (IRF) y Peace TV. Formado en medicina con un título de Bachelor of Medicine and Surgery, más tarde se dedicó a la da'wa y a las religiones comparadas.\n\nSe hizo ampliamente conocido por sus conferencias y debates sobre el islam y otras religiones, y por su estilo de presentar textos y comparaciones de múltiples fuentes. Sus intervenciones se han centrado en responder a ideas erróneas comunes sobre el islam y en presentar sus principios, alcanzando una amplia audiencia global a través de conferencias televisadas y plataformas digitales."}},{"n":"24","name":{"ar":"الشيخ أحمد ديدات","en":"Sheikh Ahmed Deedat","fr":"Cheikh Ahmed Deedat","es":"Sheij Ahmed Deedat"},"website":"https://www.ahmed-deedat.net/","tag":{"ar":"مناظرات ومقارنة أديان","en":"debate and comparative religion","fr":"débat et religions comparées","es":"debate y religiones comparadas"},"desc":{"ar":"الشيخ أحمد ديدات داعية جنوب أفريقي وُلد في 1 يوليو 1918 في بلدة تادكيشوار بالهند البريطانية، ثم انتقل في طفولته إلى جنوب أفريقيا حيث نشأ ونشط في مجاله الدعوي. أسس المركز الدولي للدعوة الإسلامية (IPCI) في ديربان، وأصبح من أبرز الوجوه الدعوية في العالم الناطق بالإنجليزية.\n\nاشتهر بمناظراته الشهيرة حول الكتاب المقدس والإسلام وبأسلوبه الخطابي المباشر في مقارنة الأديان. ترك إرثًا دعويًا واسعًا من المحاضرات والكتب والمناظرات المسجلة، وظل تأثيره ممتدًا في أجيال لاحقة من الدعاة والباحثين حتى وفاته عام 2005.","en":"Sheikh Ahmed Deedat was a South African preacher, born on 1 July 1918 in the town of Tadkeshwar in British India, who moved to South Africa in childhood where he grew up and became active in da'wah. He founded the Islamic Propagation Centre International (IPCI) in Durban and became one of the most prominent da'wah figures in the English-speaking world.\n\nHe was renowned for his famous debates on the Bible and Islam and for his direct rhetorical style in comparative religion. He left a vast legacy of lectures, books, and recorded debates, and his influence continued to reach later generations of preachers and researchers until his passing in 2005.","fr":"Le cheikh Ahmed Deedat était un prédicateur sud-africain, né le 1er juillet 1918 dans la ville de Tadkeshwar en Inde britannique, qui s’installa en Afrique du Sud durant son enfance où il grandit et mena son activité de da'wa. Il fonda l’Islamic Propagation Centre International (IPCI) à Durban et devint l’une des figures majeures de la da'wa dans le monde angl
