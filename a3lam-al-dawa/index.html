    <style>
        :root {

        }


        [data-theme="light"] {
            --bg-parchemin: #ffffff;
            --bg-ivoire: #f8f9fa;
            --text-main: #111111;
            --text-muted: #444444;
            --border-color: #dddddd;
        }


        [data-theme="dark"] {
            --bg-parchemin: #1a1a1a;
            --bg-ivoire: #2a2a2a;
            --primary-emerald: #4ade80;
            --accent-bronze: #d4af37;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --border-color: #444444;
        }


        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-parchemin);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }


        header {
            background-color: var(--bg-ivoire);
            position: sticky; top: 0; z-index: 100;

            padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
            border-bottom: 2px solid var(--accent-bronze);
        }


        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }


        .app-title {
            font-family: var(--font-title);
            font-size: 1.3rem;
            color: var(--primary-emerald);
            font-weight: 700;
        }


        .menu-toggle-btn {
            background: var(--primary-emerald);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: var(--font-title);
            cursor: pointer;
            border: none;
        }


        .search-container { width: 100%; }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-family: var(--font-body);
            font-size: 1.05rem;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-parchemin);
            color: var(--text-main);
        }
        .search-input:focus { outline: none; border-color: var(--primary-emerald); }


        .header-controls {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
        }


        .control-group {
            display: flex; background: var(--bg-parchemin);
            border: 1px solid var(--border-color); border-radius: 15px; overflow: hidden;
        }


        .control-btn {
            padding: 6px 10px; font-size: 0.85rem; color: var(--text-main);
            border-inline-end: 1px solid var(--border-color);
            background: transparent;
            cursor: pointer;
            border-top: none; border-bottom: none; border-inline-start: none;
        }
        .control-btn:last-child { border-inline-end: none; }
        .control-btn.active, .control-btn:hover {
            background: var(--accent-bronze);
            color: white;
        }


        main { padding: 16px; max-width: 1100px; margin: 0 auto; }
        .intro-text { text-align: center; margin-bottom: 20px; color: var(--text-muted); font-size: 1.1rem; }


        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 600px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }


        .card {
            background: var(--bg-ivoire);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }


        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
        .card-title { font-family: var(--font-title); font-size: 1.25rem; color: var(--primary-emerald); font-weight: 700; }
        .card-badge { background: var(--accent-bronze); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .card-body { font-size: 1.05rem; color: var(--text-main); margin-bottom: 12px; flex-grow: 1; }
        .card-actions { display: flex; gap: 8px; }
        
        .btn-action {
            flex: 1; padding: 6px; border-radius: 6px; font-size: 0.9rem;
            background: var(--bg-parchemin); border: 1px solid var(--border-color); color: var(--text-main);
            text-align: center;
            cursor: pointer;
        }
        .btn-action:hover { background: var(--primary-emerald); color: white; }


        /* القائمة الجانبية (Drawer) */
        .overlay {
            position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important;
            background: rgba(0,0,0,0.6) !important; z-index: 9998 !important; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .overlay.active { opacity: 1 !important; visibility: visible !important; }


        .drawer {
            position: fixed !important; top: 0 !important; right: 0 !important; left: auto !important;
            width: 82vw !important; max-width: 310px !important; height: 100vh !important;
            background: var(--bg-ivoire) !important; z-index: 9999 !important; box-shadow: -5px 0 20px rgba(0,0,0,0.3) !important;
            transform: translateX(100%) !important; transition: transform 0.3s ease !important; display: flex !important; flex-direction: column !important;
        }
        .drawer.open { transform: translateX(0) !important; }
        [dir="ltr"] .drawer {
            right: auto !important; left: 0 !important;
            transform: translateX(-100%) !important;
            box-shadow: 5px 0 20px rgba(0,0,0,0.3) !important;
        }
        [dir="ltr"] .drawer.open { transform: translateX(0) !important; }
        
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: var(--bg-parchemin); border-bottom: 1px solid var(--border-color); }
        .close-btn { background: #fee2e2; color: #dc2626; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
        .drawer-content { padding: 14px; overflow-y: auto; }
        .drawer-list { list-style: none; }
        .drawer-list li { margin-bottom: 8px; }
        .drawer-list button { 
            display: block; width: 100%; text-align: start; padding: 10px; color: var(--text-main);

        let currentLang = localStorage.getItem('a3lam-lang') || 'ar';

        const container = document.getElementById('cardsContainer');

        const htmlEl = document.documentElement;


        function normalizeArabic(text) {
            return text.replace(/[\u064B-\u065F\u0670]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase().trim();
        }


        function renderDrawerMenu() {
            const t = uiText[currentLang] || uiText['ar'];
            const listEl = document.getElementById('drawerList');
            listEl.innerHTML = '';
            t.categories.forEach(cat => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = cat.label;
                if (currentCategory === cat.id) btn.classList.add('active-cat');
                btn.addEventListener('click', () => {
                    currentCategory = cat.id;
                    toggleDrawer(false);
                    renderDrawerMenu();
                    renderCards();
                });
                li.appendChild(btn);
                listEl.appendChild(li);
            });
        }


        function renderCards() {
            const t = uiText[currentLang] || uiText['ar'];
            container.innerHTML = ''


            const filtered = scholarsData.filter(item => {
                const d = item[currentLang] || item['ar'];
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                if (!matchesCategory) return false;
                if (!currentQuery) return true;


                if (currentLang === 'ar') {
                    const q = normalizeArabic(currentQuery);
                    return normalizeArabic(d.name).includes(q) || normalizeArabic(d.bio).includes(q) || normalizeArabic(d.badge).includes(q);
                } else {
                    const q = currentQuery.toLowerCase();
                    return d.name.toLowerCase().includes(q) || d.bio.toLowerCase().includes(q) || d.badge.toLowerCase().includes(q);
                }
            });


            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">${t.noResults}</p>`;
                return;
            }


            filtered.forEach(item => {
                const d = item[currentLang] || item['ar'];
                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${d.name}</h3>
                        <span class="card-badge">${d.badge}</span>
                    </div>
                    <p class="card-body">${d.bio}</p>
                    <div class="card-actions">
                        <button class="btn-action btn-bio" type="button">${t.btnBio}</button>
                        <button class="btn-action btn-youtube" type="button">${t.btnYoutube}</button>
                    </div>
                `;


                card.querySelector('.btn-bio').addEventListener('click', () => {
                    alert(`${d.name}\n[${d.badge}]\n\n${d.bio}`);
                });


                card.querySelector('.btn-youtube').addEventListener('click', () => {
                    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(d.name)}`, '_blank');
                });


                container.appendChild(card);
            });
        }


        function updateInterfaceLanguage() {
            const t = uiText[currentLang] || uiText['ar'];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('openDrawerBtn').textContent = t.menuBtn;
            document.getElementById('ui-intro').textContent = t.intro;
            document.getElementById('ui-drawer-title').textContent = t.drawerTitle;
            searchInput.placeholder = t.searchPlaceholder;
            htmlEl.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            htmlEl.setAttribute('lang', currentLang);
            renderDrawerMenu();
            renderCards();
        }


        document.addEventListener('DOMContentLoaded', () => {
            searchInput.addEventListener('input', (e) => {
                currentQuery = e.target.value.trim();
                renderCards();
            });


            document.querySelectorAll('#langGroup .control-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#langGroup .control-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    currentLang = e.currentTarget.getAttribute('data-lang');
                    localStorage.setItem('a3lam-lang', currentLang);
                    updateInterfaceLanguage();
                });
            });


            const themeBtns = document.querySelectorAll('#themeGroup .control-btn');
            const savedTheme = localStorage.getItem('a3lam-theme') || 'sepia';
            htmlEl.setAttribute('data-theme', savedTheme);
            themeBtns.forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-theme') === savedTheme);
            });


            themeBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    themeBtns.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    const theme = e.currentTarget.getAttribute('data-theme');
                    htmlEl.setAttribute('data-theme', theme);
                    localStorage.setItem('a3lam-theme', theme);
                });
            });


            const drawer = document.getElementById('sidebarDrawer');
            const overlay = document.getElementById('drawerOverlay');
            
            window.toggleDrawer = function(open) {
                drawer.classList.toggle('open', open);
                overlay.classList.toggle('active', open);
            };


            document.getElementById('openDrawerBtn').addEventListener('click', () => toggleDrawer(true));
            document.getElementById('closeDrawerBtn').addEventListener('click', () => toggleDrawer(false));
            overlay.addEventListener('click', () => toggleDrawer(false));


            document.querySelectorAll('#langGroup .control-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
            });
            updateInterfaceLanguage();
