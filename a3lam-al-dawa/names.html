<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>أسماء الأعلام — قائمة النسخ</title>
<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#e2e8f0;--muted:#94a3b8;--accent:#d4af37;--on-accent:#111;--border:#2a2a2a}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;min-height:100vh;line-height:1.6}
header{text-align:center;margin:6px 0 18px}
h1{font-size:1.4rem;margin:0 0 6px;color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.back{display:inline-block;color:var(--accent);text-decoration:none;font-size:.85rem;border:1px solid var(--border);border-radius:8px;padding:6px 12px}
.back:hover{background:var(--card)}
.toolbar{position:sticky;top:0;z-index:5;max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border)}
#count{color:var(--muted);font-size:.8rem}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.82rem;padding:8px 12px;min-height:40px}
button:hover{opacity:.9}
button.ghost{background:var(--card);color:var(--text);border-color:var(--border)}
.list{list-style:none;margin:0 auto;padding:0;max-width:640px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.num{flex-shrink:0;min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);background:rgba(212,175,55,.12);border:1px solid var(--accent);border-radius:8px;padding:4px 6px;font-size:.8rem}
.nm{flex:1;min-width:0;font-size:.95rem;overflow-wrap:anywhere}
.copy{flex-shrink:0;background:transparent;color:var(--accent);border-color:var(--accent);min-height:36px;padding:6px 12px}
.copy:hover{background:rgba(212,175,55,.12)}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:90%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.85rem;padding:9px 16px;border-radius:999px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<header>
  <h1>أسماء الأعلام</h1>
  <p class="sub">قائمة مرتّبة من 01 إلى 34 — اضغط «نسخ» بجانب أي اسم</p>
  <a class="back" href="./">العودة إلى الدليل</a>
</header>

<div class="toolbar">
  <span id="count"></span>
  <div class="bulk">
    <button id="copyAll" type="button">نسخ الكل</button>
    <button id="copyNum" class="ghost" type="button">نسخ مع الأرقام</button>
  </div>
</div>

<main><ol id="list" class="list"></ol></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var DATA = [
    { n: "01", name: "الدكتور هيثم طلعت" },
    { n: "02", name: "الشيخ زين خير الله" },
    { n: "03", name: "الدكتور سامي عامري" },
    { n: "04", name: "الشيخ وليد إسماعيل" },
    { n: "05", name: "الشيخ رامي عيسى" },
    { n: "06", name: "د. خالد الحايك" },
    { n: "07", name: "خالد الوصابي" },
    { n: "08", name: "الشيخ عدنان العرعور" },
    { n: "09", name: "الشيخ شمائل ندوي" },
    { n: "10", name: "الدكتور إياد قنيبي" },
    { n: "11", name: "الدكتور عبد الله العجيري" },
    { n: "12", name: "أحمد السيد" },
    { n: "13", name: "مهند السويدان (أبو عمر الباحث)" },
    { n: "14", name: "الشيخ محمد شاهين التاعب" },
    { n: "15", name: "أحمد سبيع" },
    { n: "16", name: "عبدالله الشهري" },
    { n: "17", name: "حمزة تزورتزيس" },
    { n: "18", name: "محمد حجاب" },
    { n: "19", name: "الدكتور منقذ السقار" },
    { n: "20", name: "معاذ عليان" },
    { n: "21", name: "محمود داود" },
    { n: "22", name: "الشيخ يوسف إستس" },
    { n: "23", name: "الدكتور ذاكر نايك" },
    { n: "24", name: "الشيخ أحمد ديدات" },
    { n: "25", name: "الشيخ عثمان الخميس" },
    { n: "26", name: "الشيخ أبو المنتصر البلوشي" },
    { n: "27", name: "الشيخ أشرف غريب" },
    { n: "28", name: "الشيخ فراج الصهيبي" },
    { n: "29", name: "الشيخ د. عمرو نور الدين" },
    { n: "30", name: "د. حاتم العوني" },
    { n: "31", name: "د. عمرو بسيوني" },
    { n: "32", name: "شمس الدين الجزائري" },
    { n: "33", name: "أبو عمر البديع" },
    { n: "34", name: "محمود شعبان" }
  ];

  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function copy(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast(msg);
      }).catch(function () {
        fallbackCopy(text);
        toast(msg);
      });
    } else {
      fallbackCopy(text);
      toast(msg);
    }
  }

  DATA.forEach(function (d) {
    var li = document.createElement("li");
    li.className = "item";

    var num = document.createElement("span");
    num.className = "num";
    num.textContent = d.n;

    var nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = d.name;

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy";
    btn.textContent = "نسخ";
    btn.setAttribute("aria-label", "نسخ اسم " + d.name);
    btn.addEventListener("click", function () {
      copy(d.name, "تم نسخ الاسم");
    });

    li.appendChild(num);
    li.appendChild(nm);
    li.appendChild(btn);
    list.appendChild(li);
  });

  count.textContent = DATA.length + " اسمًا";

  document.getElementById("copyAll").addEventListener("click", function () {
    copy(DATA.map(function (d) { return d.name; }).join("\n"), "تم نسخ جميع الأسماء");
  });

  document.getElementById("copyNum").addEventListener("click", function () {
    copy(DATA.map(function (d) { return d.n + ". " + d.name; }).join("\n"), "تم نسخ الأسماء مع الأرقام");
  });
})();
</script>
</body>
</html>
