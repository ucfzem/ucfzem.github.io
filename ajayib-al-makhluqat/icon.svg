<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="عجائب المخلوقات وغرائب الموجودات">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4332"/>
      <stop offset="1" stop-color="#2A5A44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C873"/>
      <stop offset="0.5" stop-color="#C5A059"/>
      <stop offset="1" stop-color="#A9863F"/>
    </linearGradient>
    <radialGradient id="night" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#1d4a37"/>
      <stop offset="1" stop-color="#0d231a"/>
    </radialGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#gold)" stroke-width="12"/>

  <!-- compass star -->
  <g transform="translate(256 96)" fill="url(#gold)">
    <path d="M0 -38 L9 -11 L38 -8 L15 9 L22 38 L0 22 L-22 38 L-15 9 L-38 -8 L-9 -11 Z"/>
  </g>

  <!-- celestial sphere -->
  <g transform="translate(256 300)">
    <circle r="140" fill="url(#night)" stroke="url(#gold)" stroke-width="10"/>
    <ellipse rx="140" ry="140" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity="0.55"/>
    <ellipse rx="140" ry="50" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <ellipse rx="50" ry="140" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <ellipse rx="140" ry="104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.5"/>
    <circle r="9" fill="url(#gold)"/>
  </g>

  <!-- stars -->
  <g fill="url(#gold)">
    <circle cx="150" cy="256" r="7"/>
    <circle cx="372" cy="238" r="6"/>
    <circle cx="300" cy="150" r="6"/>
    <circle cx="188" cy="392" r="6"/>
    <circle cx="356" cy="392" r="7"/>
    <circle cx="256" cy="430" r="5"/>
  </g>

  <!-- crescent -->
  <g transform="translate(398 150)">
    <path d="M0 -34 A34 34 0 1 0 0 34 A26 26 0 1 1 0 -34 Z" fill="url(#gold)"/>
  </g>
</svg>
