<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عجائب المخلوقات وغرائب الموجودات — القزويني</title>
<meta name="description" content="قراءة كتاب عجائب المخلوقات وغرائب الموجودات لزكريا القزويني (ت 682 هـ) مع بحث فوري وعدّاد للنتائج وتظليل، وفهرس الأبواب، وتكبير الخط، وعمل كامل بدون إنترنت.">
<meta name="theme-color" content="#4e9a73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="عجائب المخلوقات">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ece4d3; --paper:#16130e; --panel:#241f16; --green:#4e9a73; --gold:#d3a34a;
    --accent-text:#d9b977; --muted:#9a8a6c; --line:#3a3225; --card:#1e1912; --modern-card:#131b17;
    --header-text:#f5eeda;
    --bg:var(--paper); --text:var(--ink); --text-soft:var(--muted);
    --primary:var(--green); --primary-2:var(--green); --accent:var(--gold); --accent-2:var(--accent-text);
    --border:var(--line); --shadow:0 8px 24px rgba(0,0,0,.5);
    --mark-bg:#5a4a12; --mark-text:#f0e0b0; --chip-bg:#241f16;
    --content-font-size:1.15rem; --content-font:'Amiri',serif;
  }
  html[data-theme="light"]{
    --ink:#2b2118; --paper:#faf5e9; --panel:#f2e9d6; --green:#1f5c46; --gold:#a9792f;
    --accent-text:#7c5620; --muted:#7a6a50; --line:#d8c9a8; --card:#fffdf6; --modern-card:#f1f6f2;
    --header-text:#f5eeda; --shadow:0 10px 30px rgba(27,67,50,.09);
    --mark-bg:#f7e0a8; --mark-text:#5a3d00; --chip-bg:#fffdf6;
  }
  html[data-theme="dark"]{
    --ink:#ece4d3; --paper:#16130e; --panel:#241f16; --green:#4e9a73; --gold:#d3a34a;
    --accent-text:#d9b977; --muted:#9a8a6c; --line:#3a3225; --card:#1e1912; --modern-card:#131b17;
    --header-text:#f5eeda; --shadow:0 8px 24px rgba(0,0,0,.55);
    --mark-bg:#5a4a12; --mark-text:#f0e0b0; --chip-bg:#241f16;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Cairo',system-ui,sans-serif;
    line-height:1.9; min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    transition:background .35s ease,color .35s ease;
  }
  a{color:var(--primary-2)}
  mark{background:var(--mark-bg); color:var(--mark-text); border-radius:4px; padding:0 3px}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(160deg,var(--primary),var(--primary-2));
    color:#fff; border-bottom:3px solid var(--accent);
    box-shadow:var(--shadow);
  }
  .bar{max-width:1060px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px; margin-inline-end:auto; min-width:0}
  .logo{width:46px; height:46px; border-radius:12px; flex:none; display:grid; place-items:center; background:rgba(255,255,255,.1); border:1px solid rgba(212,175,55,.5)}
  .logo svg{width:30px; height:30px}
  .titles h1{margin:0; font-family:'Cairo',sans-serif; font-weight:700; font-size:clamp(1.15rem,3.4vw,1.7rem); line-height:1.2; color:var(--header-text); text-shadow:0 2px 8px rgba(0,0,0,.35)}
  .titles p.book-author{margin:3px 0 0; font-size:.92rem; font-weight:600; color:var(--header-text); opacity:.92}
  .tools{display:flex; align-items:center; gap:8px}
  .icon-btn{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(212,175,55,.45); width:42px; height:42px; border-radius:12px; cursor:pointer; font-size:1.15rem; display:grid; place-items:center; transition:.2s; font-family:'Cairo',sans-serif}
  .icon-btn:hover{background:rgba(255,255,255,.24)}
  .icon-btn.hidden{display:none}
  .icon-btn.on{background:rgba(212,175,55,.85); color:#16130e; border-color:var(--accent)}

  /* ---------- Controls ---------- */
  .controls{position:sticky; z-index:30; background:color-mix(in srgb,var(--bg) 90%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
  .controls-inner{max-width:1060px; margin:0 auto; padding:10px 16px}
  .search-wrap{position:relative}
  .search-wrap .mag{position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%); color:var(--text-soft); pointer-events:none; font-size:1.05rem}
  #q{width:100%; padding:12px 46px 12px 44px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:'Cairo',sans-serif; font-size:1rem; outline:none; transition:.2s}
  #q:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
  .clear-btn{position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--text-soft); cursor:pointer; font-size:1.2rem; padding:6px; border-radius:8px; display:none}
  .clear-btn.show{display:block}

  /* ---------- Reader toolbar ---------- */
  .toolbar{max-width:1060px; margin:0 auto; padding:10px 16px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--text-soft); font-size:.85rem}
  .toolbar .grow{margin-inline-end:auto}
  .tbtn{border:1px solid var(--border); background:var(--card); color:var(--text); padding:8px 13px; border-radius:11px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:600; font-size:.85rem; display:inline-flex; align-items:center; gap:6px; transition:.2s}
  .tbtn:hover{border-color:var(--accent); color:var(--accent-2)}
  .tbtn.big{font-weight:800}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; background:var(--card)}
  .seg button{border:none; background:transparent; color:var(--text); padding:8px 12px; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700}
  .seg button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .fsize-val{min-width:56px; text-align:center; font-size:.8rem; color:var(--text-soft); align-self:center; font-family:'Cairo',sans-serif}
  select.fontsel{border:1px solid var(--border); background:var(--card); color:var(--text); padding:8px 10px; border-radius:11px; font-family:'Cairo',sans-serif; font-weight:600; font-size:.85rem; cursor:pointer}
  .counter{font-weight:700; color:var(--accent-2); font-size:.85rem; align-self:center}
  html[data-theme="dark"] .counter{color:var(--accent)}

  /* ---------- Meta row ---------- */
  .meta{max-width:1060px; margin:0 auto; padding:12px 16px 0; display:flex; align-items:center; gap:12px; flex-wrap:wrap; color:var(--text-soft); font-size:.83rem}
  .offline{margin-inline-start:auto; display:inline-flex; align-items:center; gap:6px; background:color-mix(in srgb,var(--accent) 16%,transparent); border:1px solid color-mix(in srgb,var(--accent) 45%,transparent); color:var(--accent-2); padding:5px 12px; border-radius:99px; font-weight:600}
  html[data-theme="dark"] .offline{color:var(--accent)}
  .offline.off{background:color-mix(in srgb,#2e7d32 18%,transparent); border-color:#2e7d32; color:#3fae54}

  /* ---------- Sections ---------- */
  main{max-width:820px; margin:0 auto; padding:20px 16px 9rem}
  .sec{margin:0 0 34px; scroll-margin-top:160px}
  .sec-title{
    font-family:'Cairo',sans-serif; font-weight:800; color:var(--accent);
    font-size:clamp(1.15rem,2.8vw,1.45rem); line-height:1.5;
    margin:26px 0 12px; padding-inline-start:14px; border-inline-start:5px solid var(--primary);
  }
  html[data-theme="dark"] .sec-title{color:var(--accent)}
  .sec-title .pg{display:inline-block; font-size:.7rem; font-weight:700; color:var(--text-soft); background:var(--panel); border:1px solid var(--line); padding:2px 8px; border-radius:99px; margin-inline-start:10px; vertical-align:middle}
  .sec .body{font-family:var(--content-font); font-size:var(--content-font-size); line-height:2.05; text-align:justify; text-justify:inter-word; color:var(--text)}
  .sec .body p{margin:0 0 14px}
  .sec .body p:first-of-type::first-letter{color:var(--accent)}
  .sec-actions{display:flex; gap:8px; margin-top:10px}
  .mini{border:1px solid var(--border); background:transparent; color:var(--text-soft); border-radius:9px; padding:5px 11px; cursor:pointer; font-family:'Cairo',sans-serif; font-size:.76rem; font-weight:600}
  .mini:hover{border-color:var(--accent); color:var(--accent-2)}
  .sechead-wrap{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

  .empty{text-align:center; padding:56px 20px; color:var(--text-soft)}
  .empty .big{font-size:3rem; margin-bottom:10px}

  footer{text-align:center; padding:24px 16px 40px; color:var(--text-soft); font-size:.8rem; border-top:1px solid var(--border); font-family:'Cairo',sans-serif}
  footer .orn{font-family:'Aref Ruqaa',serif; color:var(--accent); font-size:1.1rem}

  /* ---------- Floating nav ---------- */
  .fnav{position:fixed; inset-inline-end:16px; bottom:18px; z-index:35; display:flex; flex-direction:column; gap:9px}
  .fbtn{width:46px; height:46px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--accent-2); cursor:pointer; font-size:1.2rem; box-shadow:var(--shadow); display:grid; place-items:center; transition:.2s}
  html[data-theme="dark"] .fbtn{color:var(--accent)}
  .fbtn:hover{border-color:var(--accent); background:var(--panel)}
  .fbtn.hidden{display:none}

  /* ---------- TOC drawer ---------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; opacity:0; pointer-events:none; transition:.25s}
  .overlay.show{opacity:1; pointer-events:auto}
  .toc{position:fixed; top:0; right:0; height:100%; width:min(88vw,380px); max-width:100vw; background:var(--card); border-inline-start:3px solid var(--accent); z-index:61; transform:translateX(105%); transition:transform .28s ease, visibility 0s linear .28s; visibility:hidden; display:flex; flex-direction:column; box-shadow:-14px 0 40px rgba(0,0,0,.4)}
  .toc.show{transform:translateX(0); visibility:visible; transition:transform .28s ease, visibility 0s}
  .toc-head{display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--border)}
  .toc-head h2{margin:0; font-family:'Cairo',sans-serif; font-size:1.1rem; color:var(--accent); margin-inline-end:auto}
  .toc-core{overflow-y:auto; padding:10px 8px 40px}
  .toc a{display:block; padding:9px 12px; border-radius:9px; color:var(--text); text-decoration:none; font-size:.9rem; font-weight:600; border-inline-start:3px solid transparent}
  .toc a:hover{background:var(--panel); border-inline-start-color:var(--accent)}
  .toc a.sub{padding-inline-start:24px; font-weight:500; font-size:.84rem; color:var(--text-soft)}
  .toc a.active{background:color-mix(in srgb,var(--primary) 16%,transparent); border-inline-start-color:var(--primary); color:var(--accent-2)}

  @media(max-width:560px){
    .book-author{font-size:.86rem}
    .fsize-val{display:none}
  }
</style>
<script id="themeBoot">
(function(){try{var t=localStorage.getItem("ajayib-theme")||"dark";document.documentElement.setAttribute("data-theme",t);var f=localStorage.getItem("ajayib-font");if(f)document.documentElement.style.setProperty("--content-font",f);var z=localStorage.getItem("ajayib-size");if(z)document.documentElement.style.setProperty("--content-font-size",z);}catch(e){}})();
</script>
</head>
<body>

<header class="site">
  <div class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="9" ry="3.6"/>
          <ellipse cx="12" cy="12" rx="3.6" ry="9"/>
          <circle cx="12" cy="12" r="1.1" fill="#d4af37" stroke="none"/>
        </svg>
      </span>
      <div class="titles">
        <h1>عجائب المخلوقات وغرائب الموجودات</h1>
        <p class="book-author">لـ زكريا القزويني — توفي سنة 682 هـ</p>
      </div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="tocBtn" title="فهرس الكتاب" aria-label="فهرس الكتاب">☰</button>
      <button class="icon-btn hidden" id="installBtn" title="تثبيت التطبيق" aria-label="تثبيت التطبيق">⬇️</button>
      <button class="icon-btn" id="themeBtn" title="تبديل المظهر" aria-label="تبديل المظهر">🌙</button>
    </div>
  </div>
</header>

<div class="controls" id="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <span class="mag" aria-hidden="true">🔎</span>
      <input id="q" type="search" inputmode="search" placeholder="ابحث في الكتاب كله… (مثال: السماء، الجن، النار)" aria-label="بحث في الكتاب">
      <button class="clear-btn" id="clearBtn" aria-label="مسح البحث">✕</button>
    </div>
    <div class="toolbar">
      <button class="tbtn" id="prevBtn" title="القسم السابق">↑ السابق</button>
      <button class="tbtn" id="nextBtn" title="القسم التالي">التالي ↓</button>
      <span class="grow"></span>
      <span class="counter" id="counter" aria-live="polite"></span>
      <div class="seg" role="group" aria-label="حجم الخط">
        <button id="dec" title="تصغير الخط">A−</button>
        <button id="reset" title="الحجم الافتراضي">A</button>
        <button id="inc" title="تكبير الخط">A+</button>
      </div>
      <span class="fsize-val" id="fsizeVal"></span>
      <select class="fontsel" id="fontSel" aria-label="نوع الخط">
        <option value="'Amiri',serif">خط أميري</option>
        <option value="'Scheherazade New',serif">نسخ شهرزاد</option>
        <option value="'Cairo',sans-serif">خط القاهرة</option>
      </select>
    </div>
  </div>
</div>

<div class="meta">
  <span id="bookmeta"></span>
  <span class="offline" id="offline">⚡ يعمل بدون إنترنت</span>
</div>

<main id="list" aria-live="polite"></main>

<footer>
  <div class="orn">﷽</div>
  <p>عجائب المخلوقات وغرائب الموجودات — لزكريا القزويني (ت 682 هـ) · قراءة بدون إنترنت (PWA)<br>
  النصوص من المكتبة الشاملة (كتاب رقم 30006) — عبر ملف بيانات محلي داخل التطبيق.</p>
</footer>

<div class="fnav">
  <button class="fbtn" id="fabTop" title="أعلى الصفحة" aria-label="أعلى الصفحة">⬆</button>
  <button class="fbtn" id="fabToc" title="الفهرس" aria-label="الفهرس">☰</button>
</div>

<div class="overlay" id="overlay"></div>
<aside class="toc" id="toc" aria-label="فهرس الكتاب" aria-hidden="true">
  <div class="toc-head">
    <h2>فهرس الأبواب والفصول</h2>
    <button class="icon-btn" id="tocClose" style="background:var(--panel); color:var(--text); border-color:var(--border)" aria-label="إغلاق">✕</button>
  </div>
  <div class="toc-core" id="tocList"></div>
</aside>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var DATA = { sections: [] };
  var LASTKEY = "ajayib-last";
  var SIZES = ["0.95rem","1.05rem","1.15rem","1.25rem","1.4rem","1.55rem","1.7rem"];
  var state = { q: "", sizeIdx: 2, base: null };

  // ---------- Theme ----------
  var root = document.documentElement, themeBtn = $("#themeBtn");
  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#4e9a73" : "#1f5c46");
    themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("ajayib-theme", t); } catch(e){}
  }
  (function initTheme(){
    var saved = null; try { saved = localStorage.getItem("ajayib-theme"); } catch(e){}
    if(!saved){ saved = "dark"; }
    applyTheme(saved);
  })();
  themeBtn.addEventListener("click", function(){ applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  // ---------- Font size ----------
  var sizeVal = $("#fsizeVal");
  function applySize(i, save){
    i = Math.max(0, Math.min(SIZES.length - 1, i));
    state.sizeIdx = i;
    root.style.setProperty("--content-font-size", SIZES[i]);
    sizeVal.textContent = SIZES[i];
    if(save) try { localStorage.setItem("ajayib-size", SIZES[i]); } catch(e){}
  }
  (function initSize(){
    var s = null; try { s = localStorage.getItem("ajayib-size"); } catch(e){}
    var i = s ? SIZES.indexOf(s) : 2;
    applySize(i < 0 ? 2 : i, false);
  })();
  $("#inc").addEventListener("click", function(){ applySize(state.sizeIdx + 1, true); });
  $("#dec").addEventListener("click", function(){ applySize(state.sizeIdx - 1, true); });
  $("#reset").addEventListener("click", function(){ applySize(2, true); });

  // ---------- Font family ----------
  var fontSel = $("#fontSel");
  (function initFont(){
    var f = null; try { f = localStorage.getItem("ajayib-font"); } catch(e){}
    if(f){ fontSel.value = f; root.style.setProperty("--content-font", f); }
  })();
  fontSel.addEventListener("change", function(){
    root.style.setProperty("--content-font", fontSel.value);
    try { localStorage.setItem("ajayib-font", fontSel.value); } catch(e){}
  });

  // ---------- Search helpers ----------
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function norm(s){ return String(s || "")
    .replace(/[\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه")
    .toLowerCase(); }
  function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
  function hiRegex(q){
    var diac = "[\\u064B-\\u0652\\u0670\\u06D6-\\u06ED\\u0640]*";
    var parts = [];
    for(var i=0;i<q.length;i++) parts.push(escReg(q[i]));
    try { return new RegExp("(" + parts.join(diac) + ")", "gi"); } catch(e){ return null; }
  }
  function highlight(escaped, re){ return re ? escaped.replace(re, "<mark>$1</mark>") : escaped; }
  function countMatches(text, qn){ if(!qn) return 0; var t = norm(text), c = 0, i = 0; while((i = t.indexOf(qn, i)) !== -1){ c++; i += qn.length; } return c; }

  // ---------- Render ----------
  var list = $("#list"), counter = $("#counter");
  function render(){
    var q = state.q.trim();
    var qn = norm(q);
    var re = q ? hiRegex(q) : null;
    var secs = DATA.sections;
    var total = 0;
    var shown = [];

    if(qn){
      secs.forEach(function(s){
        var joined = s.x.join(" ");
        var c = countMatches(joined, qn);
        var inTitle = norm(s.t).indexOf(qn) !== -1;
        if(c > 0 || inTitle){ total += c; shown.push({ s: s, c: c + (inTitle ? 0 : 0) }); }
      });
      counter.textContent = "تم العثور على " + total + " نتيجة";
    } else {
      shown = secs.map(function(s, i){ return { s: s, i: i }; });
      counter.textContent = "";
    }

    if(!shown.length){
      list.innerHTML = '<div class="empty"><div class="big">🕮</div><p>لا توجد نتائج مطابقة لبحثك.</p></div>';
      return;
    }

    list.innerHTML = shown.map(function(item){
      var s = item.s;
      var idx = state.q.trim() ? secs.indexOf(s) : item.i;
      var title = q ? highlight(esc(s.t), re) : esc(s.t);
      var body = s.x.map(function(p){
        var t = q ? highlight(esc(p), re) : esc(p);
        return "<p>" + t + "</p>";
      }).join("");
      return '<section class="sec" id="sec-' + idx + '" data-idx="' + idx + '">' +
        '<div class="sechead-wrap"><h2 class="sec-title">' + title +
          '<span class="pg">ص ' + esc(s.p) + '</span></h2></div>' +
        '<div class="body">' + body + '</div>' +
        '<div class="sec-actions">' +
          '<button class="mini" data-act="copy" data-idx="' + idx + '">📋 نسخ الفصل</button>' +
          '<button class="mini" data-act="share" data-idx="' + idx + '">🔗 مشاركة</button>' +
        '</div>' +
      '</section>';
    }).join("");

    if(qn){ var first = list.querySelector("mark"); if(first) first.scrollIntoView({block:"center"}); }
  }

  // ---------- Copy / share ----------
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function(res,rej){ try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); res(); }catch(e){ rej(e); } });
  }
  function sectionText(s){ return "« " + s.t + " »\n\n" + s.x.join("\n\n") + "\n\n📖 عجائب المخلوقات وغرائب الموجودات — زكريا القزويني (ت 682 هـ)"; }
  function toast(btn, msg){ var p = btn.dataset.label || btn.textContent; btn.dataset.label = p; btn.textContent = msg; setTimeout(function(){ btn.textContent = p; }, 1500); }
  function shareSection(s){
    var text = sectionText(s);
    if(navigator.share){ navigator.share({ title: s.t, text: text, url: location.href }).catch(function(){}); return; }
    var enc = encodeURIComponent(text + "\n🔗 " + location.href);
    var wa = "https://api.whatsapp.com/send?text=" + enc;
    var tg = "https://t.me/share/url?url=" + encodeURIComponent(location.href) + "&text=" + encodeURIComponent(text);
    window.open(window.confirm("مشاركة عبر WhatsApp؟\n(اضغط Cancel للمشاركة عبر Telegram)") ? wa : tg, "_blank");
  }

  list.addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-act]");
    if(!btn) return;
    var s = DATA.sections[+btn.getAttribute("data-idx")];
    if(!s) return;
    if(btn.getAttribute("data-act") === "copy"){
      copyText(sectionText(s)).then(function(){ toast(btn, "✅ تم النسخ"); }).catch(function(){ toast(btn, "⚠️ تعذّر"); });
    } else shareSection(s);
  });

  // ---------- Search events ----------
  var qInput = $("#q"), clearBtn = $("#clearBtn"), tmr = null;
  qInput.addEventListener("input", function(){
    state.q = qInput.value;
    clearBtn.classList.toggle("show", !!state.q);
    if(tmr) clearTimeout(tmr);
    tmr = setTimeout(render, 130);
  });
  clearBtn.addEventListener("click", function(){
    qInput.value = ""; state.q = ""; clearBtn.classList.remove("show"); qInput.focus(); render();
  });

  // ---------- Prev / Next / Top ----------
  function currentSecIdx(){
    var secs = list.querySelectorAll(".sec"); var best = 0, bestTop = -1e9;
    var y = window.scrollY + 170;
    for(var i=0;i<secs.length;i++){ var top = secs[i].getBoundingClientRect().top + window.scrollY; if(top <= y && top > bestTop){ bestTop = top; best = +secs[i].getAttribute("data-idx"); } }
    return best;
  }
  function goSec(idx){
    var el = document.getElementById("sec-" + idx);
    if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("#nextBtn").addEventListener("click", function(){ goSec(currentSecIdx() + 1); });
  $("#prevBtn").addEventListener("click", function(){ goSec(Math.max(0, currentSecIdx() - 1)); });
  $("#fabTop").addEventListener("click", function(){ window.scrollTo({ top: 0, behavior: "smooth" }); });

  // ---------- TOC ----------
  var toc = $("#toc"), overlay = $("#overlay"), fabToc = $("#fabToc"), tocBtn = $("#tocBtn");
  function buildToc(){
    var html = DATA.sections.map(function(s, i){
      return '<a href="#sec-' + i + '" data-idx="' + i + '">' + esc(s.t) + "</a>";
    }).join("");
    $("#tocList").innerHTML = html;
  }
  function openToc(){ toc.classList.add("show"); overlay.classList.add("show"); toc.setAttribute("aria-hidden","false"); }
  function closeToc(){ toc.classList.remove("show"); overlay.classList.remove("show"); toc.setAttribute("aria-hidden","true"); }
  tocBtn.addEventListener("click", openToc); fabToc.addEventListener("click", openToc);
  $("#tocClose").addEventListener("click", closeToc); overlay.addEventListener("click", closeToc);
  $("#tocList").addEventListener("click", function(ev){
    var a = ev.target.closest("a[data-idx]"); if(!a) return;
    ev.preventDefault(); closeToc();
    setTimeout(function(){ goSec(+a.getAttribute("data-idx")); }, 120);
  });

  // ---------- Restore / save reading position ----------
  var saveTmr = null;
  function savePos(){
    try { localStorage.setItem(LASTKEY, JSON.stringify({ idx: currentSecIdx(), y: Math.round(window.scrollY) })); } catch(e){}
  }
  window.addEventListener("scroll", function(){
    if(saveTmr) clearTimeout(saveTmr);
    saveTmr = setTimeout(savePos, 350);
  }, { passive: true });
  function restorePos(){
    var raw = null; try { raw = localStorage.getItem(LASTKEY); } catch(e){}
    if(!raw) return;
    try {
      var o = JSON.parse(raw);
      var el = document.getElementById("sec-" + (o.idx || 0));
      if(el){ window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 150 }); return; }
    } catch(e){}
  }

  // ---------- Offline indicator ----------
  function setOnline(){
    var el = $("#offline");
    if(navigator.onLine){ el.classList.remove("off"); el.textContent = "⚡ يعمل بدون إنترنت"; }
    else { el.classList.add("off"); el.textContent = "🟢 متصل — ويعمل بدون إنترنت كذلك"; }
  }
  window.addEventListener("online", setOnline);
  window.addEventListener("offline", setOnline);

  // ---------- PWA install ----------
  var deferred = null, installBtn = $("#installBtn");
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; installBtn.classList.remove("hidden"); });
  installBtn.addEventListener("click", function(){ if(!deferred) return; deferred.prompt(); deferred.userChoice.finally(function(){ deferred = null; installBtn.classList.add("hidden"); }); });
  window.addEventListener("appinstalled", function(){ installBtn.classList.add("hidden"); });

  // ---------- Service worker ----------
  if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }

  // ---------- Boot ----------
  function boot(){
    fetch("data.json", { cache: "no-cache" })
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })

      .then(function(json){
        DATA.sections = (json && json.sections) || [];
        var m = json.meta || {};
        $("#bookmeta").textContent = (DATA.sections.length) + " بابًا وفصلًا · " + (m.pages || "") + " صفحة · المصدر: " + (m.source || "");
        buildToc(); setOnline(); render();
        requestAnimationFrame(restorePos);
      })
      .catch(function(err){
        list.innerHTML = '<div class="empty"><div class="big">⚠️</div><p>تعذّر تحميل بيانات الكتاب.</p></div>';
        console.error(err);
      });
  }
  boot();
})();
</script>
</body>
</html>
