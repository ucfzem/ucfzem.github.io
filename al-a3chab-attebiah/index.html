        title: "ملاحظات الناشر الإلكتروني",
        content: [
          "هذا التطبيق صُمم خصيصاً للقراءة السلسة والبحث السريع داخل الكتاب، مستلهماً روح الكتب المخطوطة المغربية بأناقتها ودفئها.",
          "يمكنك البحث عن أي اسم نبات، أو عرض، أو مصطلح دارج، وسيتم تظليل النتائج مباشرةً والتنقل بينها بسهولة.",
          "يدعم التطبيق الوضع الليلي لقراءة مريحة في مختلف الأوقات، ويعمل بشكل كامل على الهاتف والكمبيوتر دون الحاجة لتنصيب.",
          "<strong>تنبيه هام:</strong> المعلومات الواردة هنا لغرض التوثيق الثقافي والتعريف بالموروث فقط، ولا تُغني عن التشخيص أو العلاج الطبي المتخصص."
        ]
      }
    ];

    const bookContent = document.getElementById('bookContent');
    const tocList = document.getElementById('tocList');
    const tocToggle = document.getElementById('tocToggle');
    const tocIcon = document.getElementById('tocIcon');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const matchCountEl = document.getElementById('matchCount');
    const prevMatch = document.getElementById('prevMatch');
    const nextMatch = document.getElementById('nextMatch');
    const matchPosition = document.getElementById('matchPosition');
    const themeToggle = document.getElementById('themeToggle');

    let currentHighlights = [];
    let activeIndex = -1;
    let tocCollapsed = false;

    function renderBook() {
      bookContent.innerHTML = '';
      tocList.innerHTML = '';

      bookData.forEach((chapter, index) => {
        const chapterEl = document.createElement('article');
        chapterEl.className = 'chapter';
        chapterEl.id = `chapter-${chapter.id}`;

        const header = document.createElement('header');
        header.className = 'chapter-header';

        const number = document.createElement('span');
        number.className = 'chapter-number';
        number.textContent = `الفصل ${String(index + 1).padStart(2, '0')}`;

        const title = document.createElement('h2');
        title.className = 'chapter-title';
        title.textContent = chapter.title;

        header.appendChild(number);
        header.appendChild(title);
        chapterEl.appendChild(header);

        const content = document.createElement('div');
        content.className = 'chapter-content';

        chapter.content.forEach(paragraph => {
          const p = document.createElement('p');
          p.innerHTML = paragraph;
          content.appendChild(p);
        });

        chapterEl.appendChild(content);
        bookContent.appendChild(chapterEl);

        const tocItem = document.createElement('button');
        tocItem.className = 'toc-item';
        tocItem.innerHTML = `<span>${chapter.title}</span><span style="color: var(--text-secondary);">${String(index + 1).padStart(2, '0')}</span>`;
        tocItem.addEventListener('click', () => {
          chapterEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          updateActiveToc(chapter.id);
        });
        tocList.appendChild(tocItem);
      });

      updateActiveToc(bookData[0].id);
    }

    function updateActiveToc(id) {
      document.querySelectorAll('.toc-item').forEach((item, idx) => {
        item.classList.toggle('active', bookData[idx].id === id);
      });
    }

    tocToggle.addEventListener('click', () => {
      tocCollapsed = !tocCollapsed;
      if (tocCollapsed) {
        tocList.style.display = 'none';
        tocIcon.style.transform = 'rotate(-90deg)';
      } else {
        tocList.style.display = 'grid';
        tocIcon.style.transform = 'rotate(0deg)';
      }
    });

    function clearHighlights() {
      document.querySelectorAll('.highlight').forEach(el => {
        const text = document.createTextNode(el.textContent);
        el.replaceWith(text);
      });
      currentHighlights = [];
      activeIndex = -1;
      updateMatchUI();
    }

    function performSearch() {
      clearHighlights();
      const query = searchInput.value.trim();
      if (query.length < 2) {
        clearSearch.classList.add('hidden');
        matchCountEl.textContent = '0 نتيجة';
        matchPosition.textContent = '— / —';
        prevMatch.disabled = true;
        nextMatch.disabled = true;
        return;
      }

      clearSearch.classList.remove('hidden');
      const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const paragraphs = document.querySelectorAll('.chapter-content p');

      paragraphs.forEach(p => {
        const original = p.innerHTML.replace(/<[^>]+>/g, '');
        if (regex.test(original)) {
          regex.lastIndex = 0;
          const highlighted = original.replace(regex, match => `<mark class="highlight">${match}</mark>`);
          p.innerHTML = highlighted;
        }
        regex.lastIndex = 0;
      });

      currentHighlights = Array.from(document.querySelectorAll('.highlight'));
      if (currentHighlights.length > 0) {
        activeIndex = 0;
        focusMatch(activeIndex);
      }
      updateMatchUI();
    }

    function focusMatch(index) {
      currentHighlights.forEach((el, i) => {
        el.classList.toggle('active-match', i === index);
      });
      if (currentHighlights[index]) {
        currentHighlights[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateMatchUI();
    }

    function updateMatchUI() {
      const count = currentHighlights.length;
      matchCountEl.textContent = count === 0 ? '0 نتيجة' : `تم العثور على ${count} ${count === 1 ? 'نتيجة' : 'نتائج'}`;
      if (count === 0) {
        matchPosition.textContent = '— / —';
        prevMatch.disabled = true;
        nextMatch.disabled = true;
        return;
      }
      matchPosition.textContent = `${activeIndex + 1} / ${count}`;
      prevMatch.disabled = activeIndex <= 0;
      nextMatch.disabled = activeIndex >= count - 1;
    }

    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(performSearch, 150);
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.classList.add('hidden');
      clearHighlights();
      searchInput.focus();
    });

    prevMatch.addEventListener('click', () => {
      if (activeIndex > 0) {
        activeIndex--;
        focusMatch(activeIndex);
      }
    });

    nextMatch.addEventListener('click', () => {
      if (activeIndex < currentHighlights.length - 1) {
        activeIndex++;
        focusMatch(activeIndex);
      }
    });

    const themeKey = 'sijelmassi-a3chab-theme';
    const applyTheme = theme => {
      document.documentElement.setAttribute('data-theme', theme);
      const icon = themeToggle.querySelector('i');
      const label = themeToggle.querySelector('span');
      if (theme === 'dark') {
        icon.className = 'bi bi-sun';
        label.textContent = 'الوضع الفاتح';
      } else {
        icon.className = 'bi bi-moon-stars';
        label.textContent = 'الوضع الليلي';
      }
      localStorage.setItem(themeKey, theme);
    };

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    const savedTheme = localStorage.getItem(themeKey) || 'light';
    applyTheme(savedTheme);

    renderBook();
  </script>
</body>

</html>
