<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="البشارة بنبي الإسلام في كتب اليهود والنصارى">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fdf8ec"/>
      <stop offset="100%" stop-color="#efe0c0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f0e3c6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#f0e3c6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="104" fill="#0f5c5a"/>
  <circle cx="256" cy="256" r="172" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#c9962e" stroke-width="12"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#e0b24e" stroke-width="2" opacity=".7"/>

  <!-- light rays (glad tidings) -->
  <g stroke="#e0b24e" stroke-width="6" stroke-linecap="round" opacity=".55">
    <path d="M256 104 v-26"/>
    <path d="M196 120 l-14 -22"/>
    <path d="M316 120 l14 -22"/>
    <path d="M150 158 l-24 -14"/>
    <path d="M362 158 l24 -14"/>
  </g>

  <!-- open book -->
  <g>
    <path d="M256 214 C222 188 176 182 138 190 L138 320 C176 312 222 318 256 342 Z"
          fill="url(#pageL)" stroke="#9a6b1f" stroke-width="6" stroke-linejoin="round"/>
    <path d="M256 214 C290 188 336 182 374 190 L374 320 C336 312 290 318 256 342 Z"
          fill="url(#pageR)" stroke="#9a6b1f" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#b98a33" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M162 214 h74"/>
      <path d="M162 236 h74"/>
      <path d="M162 258 h74"/>
      <path d="M162 280 h60"/>
      <path d="M276 214 h74"/>
      <path d="M276 236 h74"/>
      <path d="M276 258 h74"/>
      <path d="M276 280 h60"/>
    </g>
    <path d="M256 214 V342" stroke="#8a5a24" stroke-width="7" stroke-linecap="round"/>
    <path d="M132 322 C176 336 222 342 256 342 C290 342 336 336 380 322"
          fill="none" stroke="#8a5a24" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- bookmark ribbon -->
  <path d="M300 190 l0 44 l14 -12 l14 12 l0 -44 z" fill="#c9962e" stroke="#9a6b1f" stroke-width="3" stroke-linejoin="round"/>

  <!-- star of glad tidings -->
  <g transform="translate(256,150)">
    <polygon points="0,-20 6,-6 20,0 6,6 0,20 -6,6 -20,0 -6,-6" fill="#e0b24e"/>
  </g>
</svg>
