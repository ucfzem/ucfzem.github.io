<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المسالك والممالك — ابن خرداذبه</title>
<meta name="description" content="قراءة كتاب المسالك والممالك لأبي القاسم بن خرداذبه (ت نحو 300 هـ) مع بحث فوري وعدّاد للنتائج وتظليل، وفهرس الأبواب، وتكبير الخط، والعمل الكامل بدون إنترنت.">
<meta name="theme-color" content="#8b0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المسالك والممالك">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f1e3; --card:#fffdf9; --ink:#2c2416; --primary:#8b0000; --accent:#d4af37;
    --border:#e0d5c1; --sidebar:#efe6d5; --muted:#7a6a50;
    --mark-bg:#ffeaa7; --mark-text:#2c2416;
    --shadow:0 4px 15px rgba(0,0,0,.08);
    --header-text:#fff;
    --content-font-size:1.35rem; --content-font:'Amiri',serif;
  }
  html[data-theme="dark"]{
    --bg:#1a1815; --card:#24211d; --ink:#e6dfd3; --primary:#e58e26; --accent:#f6b93b;
    --border:#3a352e; --sidebar:#1f1c18; --muted:#9a8a6c;
    --mark-bg:#d35400; --mark-text:#fff;
    --shadow:0 4px 15px rgba(0,0,0,.45);
    --header-text:#1a1815;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Amiri',serif; background:var(--bg); color:var(--ink);
    line-height:2.1; min-height:100vh;
    transition:background .3s, color .3s;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:var(--primary)}
  mark{background:var(--mark-bg); color:var(--mark-text); padding:1px 3px; border-radius:3px}

  /* ---------- Header control bar ---------- */
  header.ctrl{
    position:sticky; top:0; z-index:40;
    background:var(--card); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .ctrl-inner{
    max-width:900px; margin:0 auto; padding:12px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .menu-btn{
    background:var(--bg); border:1px solid var(--border); color:var(--ink);
    width:44px; height:44px; border-radius:10px; cursor:pointer; font-size:1.2rem;
    display:inline-flex; align-items:center; justify-content:center; flex:none;
  }
  .search-box{flex:1; min-width:200px; position:relative; display:flex; align-items:center}
  .search-box .mag{position:absolute; inset-inline-start:12px; color:var(--muted); pointer-events:none}
  #q{
    width:100%; padding:11px 40px 11px 40px; border:1px solid var(--border); border-radius:10px;
    background:var(--bg); color:var(--ink); font-family:'Amiri',serif; font-size:1.1rem; outline:none;
  }
  #q:focus{border-color:var(--primary)}
  .clear-btn{position:absolute; inset-inline-end:10px; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:1.15rem; display:none}
  .clear-btn.show{display:block}
  .match-count{position:absolute; inset-inline-end:36px; font-size:.85rem; color:var(--primary); font-weight:700; pointer-events:none}
  .ctrl-btns{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .btn{
    background:var(--bg); border:1px solid var(--border); color:var(--ink);
    padding:8px 13px; border-radius:10px; cursor:pointer; font-family:'Amiri',serif;
    font-size:1rem; display:inline-flex; align-items:center; gap:5px; transition:.2s;
  }
  .btn:hover{border-color:var(--primary); color:var(--primary)}
  .seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--bg)}
  .seg button{border:none; background:transparent; color:var(--ink); padding:8px 12px; cursor:pointer; font-family:'Amiri',serif; font-weight:700}
  .seg button:hover{background:var(--sidebar)}
  select.fontsel{border:1px solid var(--border); background:var(--bg); color:var(--ink); padding:8px 10px; border-radius:10px; font-family:'Amiri',serif; font-size:1rem; cursor:pointer}

  /* ---------- Sidebar (index) ---------- */
  aside#index{
    position:fixed; top:0; right:0; bottom:0; width:min(86vw,360px); z-index:60;
    background:var(--sidebar); border-inline-start:2px solid var(--border);
    display:flex; flex-direction:column; box-shadow:var(--shadow);
    transform:translateX(105%); visibility:hidden;
    transition:transform .28s ease, visibility 0s linear .28s;
  }
  aside#index.show{transform:translateX(0); visibility:visible; transition:transform .28s ease, visibility 0s}
  .side-head{padding:18px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
  .side-head h2{font-family:'Aref Ruqaa',serif; color:var(--primary); font-size:1.5rem; margin-inline-end:auto}
  .side-close{display:inline-flex; align-items:center; justify-content:center; background:var(--card); border:1px solid var(--border); color:var(--ink); width:38px; height:38px; border-radius:10px; cursor:pointer; font-size:1.1rem}
  .index-list{list-style:none; overflow-y:auto; padding:10px; flex:1}
  .index-item{padding:9px 14px; margin-bottom:4px; border-radius:8px; cursor:pointer; font-size:1.05rem; line-height:1.6; border-inline-start:4px solid transparent}
  .index-item:hover{background:var(--card)}
  .index-item.active{background:var(--card); color:var(--primary); font-weight:700; border-inline-start-color:var(--primary)}
  .index-item .pg{font-size:.72rem; color:var(--muted); font-weight:400}

  /* ---------- Main ---------- */
  main{padding:28px 26px 9rem; min-height:100vh}
  .wrap{max-width:820px; margin:0 auto}
  .book-title-card{
    text-align:center; padding:38px 20px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); margin-bottom:28px;
  }
  .book-title-card .ornament{font-family:'Aref Ruqaa',serif; color:var(--accent); font-size:1.6rem; margin-bottom:8px}
  .book-title-card h1{font-family:'Aref Ruqaa',serif; font-size:clamp(2rem,6vw,3rem); color:var(--primary); margin-bottom:10px; line-height:1.3}
  .book-title-card .author{font-size:1.25rem; color:var(--accent); font-weight:700}
  html[data-theme="dark"] .book-title-card .author{color:var(--accent)}
  .book-title-card .src{font-size:.85rem; color:var(--muted); margin-top:10px}

  .chapter-card{
    background:var(--card); padding:30px; border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow); margin-bottom:26px; scroll-margin-top:96px;
  }
  .chapter-card h3{
    font-family:'Aref Ruqaa',serif; font-size:clamp(1.4rem,4vw,2rem); color:var(--primary);
    margin-bottom:16px; border-bottom:1px dashed var(--border); padding-bottom:10px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .chapter-card h3 .pg{font-family:'Amiri',serif; font-size:.72rem; font-weight:700; color:var(--muted); background:var(--sidebar); border:1px solid var(--border); padding:2px 9px; border-radius:99px}
    .chapter-card{content-visibility:auto; contain-intrinsic-size:auto 900px}
  .chapter-text{font-family:var(--content-font); font-size:var(--content-font-size); text-align:justify; text-justify:inter-word; line-height:2.15}
  .chapter-text p{margin-bottom:14px}
  .sec-actions{display:flex; gap:8px; margin-top:16px}
  .mini{border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:9px; padding:5px 12px; cursor:pointer; font-family:'Amiri',serif; font-size:.82rem}
  .mini:hover{border-color:var(--primary); color:var(--primary)}

  .empty{text-align:center; padding:56px 20px; color:var(--muted)}
  .empty .big{font-size:3rem; margin-bottom:10px}
  footer{max-width:820px; margin:0 auto; text-align:center; padding:24px 16px 40px; color:var(--muted); font-size:.82rem; border-top:1px solid var(--border); font-family:'Amiri',serif}
  footer .orn{font-family:'Aref Ruqaa',serif; color:var(--accent); font-size:1.2rem}

  /* ---------- floating nav ---------- */
  .fnav{position:fixed; inset-inline-start:18px; bottom:18px; z-index:35; display:flex; flex-direction:column; gap:9px}
  .fbtn{width:48px; height:48px; border-radius:14px; border:1px solid var(--border); background:var(--card); color:var(--primary); cursor:pointer; font-size:1.2rem; box-shadow:var(--shadow); display:grid; place-items:center}
  .fbtn:hover{border-color:var(--primary)}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:58; opacity:0; pointer-events:none; transition:.25s}
  .overlay.show{opacity:1; pointer-events:auto}

  @media (max-width:1024px){
    main{padding:18px 14px 8rem}
    .chapter-card{padding:20px 16px}
  }
  @media (max-width:560px){
    .match-count{display:none}
    .ctrl-btns{gap:6px}
    .btn{padding:7px 10px; font-size:.92rem}
  }
  @media (min-width:1025px){
    /* PC / Desktop: widen the reading column so it uses more of the screen */
    .ctrl-inner, .wrap, footer{max-width:1180px}
  }
</style>
<script id="themeBoot">
(function(){try{var t=localStorage.getItem("masalik-theme")||"light";document.documentElement.setAttribute("data-theme",t);var f=localStorage.getItem("masalik-font");if(f)document.documentElement.style.setProperty("--content-font",f);var z=localStorage.getItem("masalik-size");if(z)document.documentElement.style.setProperty("--content-font-size",z);}catch(e){}})();
</script>
</head>
<body>

<header class="ctrl">
  <div class="ctrl-inner">
    <button class="menu-btn" id="menuBtn" title="فهرس الكتاب" aria-label="فهرس الكتاب">☰</button>
    <div class="search-box">
      <span class="mag" aria-hidden="true">🔎</span>
      <input id="q" type="search" inputmode="search" placeholder="ابحث في الكتاب كله…" aria-label="بحث في الكتاب">
      <span class="match-count" id="matchCount"></span>
      <button class="clear-btn" id="clearBtn" aria-label="مسح البحث">✕</button>
    </div>
    <div class="ctrl-btns">
      <div class="seg" role="group" aria-label="حجم الخط">
        <button id="dec" title="تصغير الخط">أ−</button>
        <button id="reset" title="الحجم الافتراضي">أ</button>
        <button id="inc" title="تكبير الخط">أ+</button>
      </div>
      <select class="fontsel" id="fontSel" aria-label="نوع الخط">
        <option value="'Amiri',serif">أميري</option>
        <option value="'Scheherazade New',serif">شهرزاد</option>
        <option value="'Cairo',sans-serif">القاهرة</option>
      </select>
      <button class="btn" id="themeBtn" title="تبديل المظهر">🌙 المظهر</button>
    </div>
  </div>
</header>

<aside id="index" aria-label="فهرس الأبواب" aria-hidden="true">
  <div class="side-head">
    <h2>فهرس الأبواب</h2>
    <button class="side-close" id="tocClose" aria-label="إغلاق">✕</button>
  </div>
  <ul class="index-list" id="indexList"></ul>
</aside>
<div class="overlay" id="overlay"></div>

<main>
  <div class="wrap">
    <div class="book-title-card">
      <div class="ornament">﷽</div>
      <h1>المسالك والممالك</h1>
      <div class="author">أبو القاسم عبيد الله بن عبد الله بن خرداذبه — توفي نحو سنة ٣٠٠ هـ</div>
      <div class="src" id="bookmeta"></div>
    </div>
    <div id="bookContainer" aria-live="polite"></div>
    <footer>
      <div class="orn">﷽</div>
      <p>المسالك والممالك — لابن خرداذبه (ت نحو 300 هـ) · قراءة بدون إنترنت (PWA)<br>
      النصوص من المكتبة الشاملة (كتاب رقم 11800) — عبر ملف بيانات محلي داخل التطبيق.</p>
    </footer>
  </div>
</main>

<div class="fnav">
  <button class="fbtn" id="fabTop" title="أعلى الصفحة" aria-label="أعلى الصفحة">⬆</button>
  <button class="fbtn" id="fabPrev" title="الباب السابق" aria-label="الباب السابق">↑</button>
  <button class="fbtn" id="fabNext" title="الباب التالي" aria-label="الباب التالي">↓</button>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var DATA = { sections: [] };
  var LASTKEY = "masalik-last";
  var SIZES = ["1.05rem","1.2rem","1.35rem","1.5rem","1.7rem","1.9rem"];
  var state = { q: "", sizeIdx: 2 };

  var root = document.documentElement;

  // ---------- Theme ----------
  var themeBtn = $("#themeBtn");
  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#1a1815" : "#8b0000");
    themeBtn.textContent = t === "dark" ? "☀️ المظهر" : "🌙 المظهر";
    try { localStorage.setItem("masalik-theme", t); } catch(e){}
  }
  (function(){ var s = null; try { s = localStorage.getItem("masalik-theme"); } catch(e){}; applyTheme(s === "dark" ? "dark" : "light"); })();
  themeBtn.addEventListener("click", function(){ applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"); });

  // ---------- Font size ----------
  function applySize(i, save){
    i = Math.max(0, Math.min(SIZES.length - 1, i));
    state.sizeIdx = i;
    root.style.setProperty("--content-font-size", SIZES[i]);
    if(save) try { localStorage.setItem("masalik-size", SIZES[i]); } catch(e){}
  }
  (function(){ var s = null; try { s = localStorage.getItem("masalik-size"); } catch(e){}; var i = s ? SIZES.indexOf(s) : 2; applySize(i < 0 ? 2 : i, false); })();
  $("#inc").addEventListener("click", function(){ applySize(state.sizeIdx + 1, true); });
  $("#dec").addEventListener("click", function(){ applySize(state.sizeIdx - 1, true); });
  $("#reset").addEventListener("click", function(){ applySize(2, true); });

  // ---------- Font family ----------
  var fontSel = $("#fontSel");
  (function(){ var f = null; try { f = localStorage.getItem("masalik-font"); } catch(e){}; if(f){ fontSel.value = f; root.style.setProperty("--content-font", f); } })();
  fontSel.addEventListener("change", function(){ root.style.setProperty("--content-font", fontSel.value); try { localStorage.setItem("masalik-font", fontSel.value); } catch(e){} });

  // ---------- Search helpers ----------
  function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function norm(s){ return String(s || "")
    .replace(/[\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه")
    .toLowerCase(); }
  function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
  function hiRegex(q){
    var diac = "[\\u064B-\\u0652\\u0670\\u06D6-\\u06ED\\u0640]*";
    var parts = [];
    for(var i=0;i<q.length;i++) parts.push(escReg(q[i]));
    try { return new RegExp("(" + parts.join(diac) + ")", "gi"); } catch(e){ return null; }
  }
  function highlight(escaped, re){ return re ? escaped.replace(re, "<mark>$1</mark>") : escaped; }
  function countMatches(text, qn){ if(!qn) return 0; var t = norm(text), c = 0, i = 0; while((i = t.indexOf(qn, i)) !== -1){ c++; i += qn.length; } return c; }

  // ---------- Render ----------
  var container = $("#bookContainer"), counter = $("#matchCount");
  function buildBody(sec){
    if(!sec || sec.getAttribute("data-built") === "1") return;
    var idx = +sec.getAttribute("data-idx");
    var s = DATA.sections[idx]; if(!s) return;
    var el = sec.querySelector(".chapter-text"); if(!el) return;
    var q = state.q.trim();
    var re = q ? hiRegex(q) : null;
    var out = [];
    var arr = s.x;
    for(var i=0;i<arr.length;i++){
      out.push("<p>" + (q ? highlight(esc(arr[i]), re) : esc(arr[i])) + "</p>");
    }
    el.innerHTML = out.join("");
    sec.setAttribute("data-built", "1");
  }

  function render(){
    var q = state.q.trim();
    var qn = norm(q);
    var re = q ? hiRegex(q) : null;
    var secs = DATA.sections;
    var total = 0, shown = [];

    if(qn){
      secs.forEach(function(s){
        var joined = s.x.join(" ");
        var c = countMatches(joined, qn);
        var inTitle = norm(s.t).indexOf(qn) !== -1;
        if(c > 0 || inTitle){ total += c; shown.push({ s: s, c: c }); }
      });
      counter.textContent = total + " نتيجة";
    } else {
      shown = secs.map(function(s, i){ return { s: s, i: i }; });
      counter.textContent = "";
    }

    if(!shown.length){
      container.innerHTML = '<div class="empty"><div class="big">🕮</div><p>لا توجد نتائج مطابقة لبحثك.</p></div>';
      return;
    }

    var html = [];
    for(var si=0; si<shown.length; si++){
      var item = shown[si];
      var s = item.s;
      var idx = qn ? secs.indexOf(s) : item.i;
      var title = q ? highlight(esc(s.t), re) : esc(s.t);
      html.push('<section class="chapter-card" id="sec-' + idx + '" data-idx="' + idx + '" data-built="0">' +
        '<h3>' + title + '<span class="pg">ص ' + esc(s.p) + '</span></h3>' +
        '<div class="chapter-text"></div>' +
        '<div class="sec-actions">' +
          '<button class="mini" data-act="copy" data-idx="' + idx + '">📋 نسخ الباب</button>' +
          '<button class="mini" data-act="share" data-idx="' + idx + '">🔗 مشاركة</button>' +
        '</div></section>');
    }
    container.innerHTML = html.join("");

    var cards = container.querySelectorAll(".chapter-card");
    var warm = Math.min(cards.length, 12);
    for(var ci = 0; ci < cards.length; ci++){
      if(ci < warm) buildBody(cards[ci]);
    }

    if(qn){
      var target = null;
      for(var tsi=0; tsi<shown.length; tsi++){ if(shown[tsi].c > 0){ target = shown[tsi].s; break; } }
      if(target){
        var tcard = document.getElementById("sec-" + secs.indexOf(target));
        if(tcard){
          buildBody(tcard);
          var firstMark = container.querySelector("mark");
          if(firstMark) firstMark.scrollIntoView({block:"center"});
        }
      }
    }
  }

  // ---------- Copy / share ----------
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function(res,rej){ try{ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); res(); }catch(e){ rej(e); } });
  }
  function sectionText(s){ return "« " + s.t + " »\n\n" + s.x.join("\n\n") + "\n\n📖 المسالك والممالك — ابن خرداذبه (ت نحو 300 هـ)"; }
  function toast(btn, msg){ var p = btn.dataset.label || btn.textContent; btn.dataset.label = p; btn.textContent = msg; setTimeout(function(){ btn.textContent = p; }, 1500); }
  function shareSection(s){
    var text = sectionText(s);
    if(navigator.share){ navigator.share({ title: s.t, text: text, url: location.href }).catch(function(){}); return; }
    var enc = encodeURIComponent(text + "\n🔗 " + location.href);
    window.open("https://api.whatsapp.com/send?text=" + enc, "_blank");
  }
  container.addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-act]"); if(!btn) return;
    var s = DATA.sections[+btn.getAttribute("data-idx")]; if(!s) return;
    if(btn.getAttribute("data-act") === "copy"){ copyText(sectionText(s)).then(function(){ toast(btn, "✅ تم النسخ"); }).catch(function(){ toast(btn, "⚠️ تعذّر"); }); }
    else shareSection(s);
  });

  // ---------- Search events ----------
  var qInput = $("#q"), clearBtn = $("#clearBtn"), tmr = null;
  qInput.addEventListener("input", function(){
    state.q = qInput.value;
    clearBtn.classList.toggle("show", !!state.q);
    if(tmr) clearTimeout(tmr);
    tmr = setTimeout(render, 130);
  });
  clearBtn.addEventListener("click", function(){ qInput.value = ""; state.q = ""; clearBtn.classList.remove("show"); qInput.focus(); render(); });

  // ---------- Index (TOC) ----------
  var index = $("#index"), overlay = $("#overlay"), menuBtn = $("#menuBtn");
  function buildIndex(){
    $("#indexList").innerHTML = DATA.sections.map(function(s, i){
      return '<li class="index-item" data-idx="' + i + '">' + esc(s.t) + ' <span class="pg">ص' + esc(s.p) + '</span></li>';
    }).join("");
  }
  function openToc(){ index.classList.add("show"); overlay.classList.add("show"); index.setAttribute("aria-hidden","false"); }
  function closeToc(){ index.classList.remove("show"); overlay.classList.remove("show"); index.setAttribute("aria-hidden","true"); }
  menuBtn.addEventListener("click", openToc);
  $("#tocClose").addEventListener("click", closeToc);
  overlay.addEventListener("click", closeToc);
  $("#indexList").addEventListener("click", function(ev){
    var li = ev.target.closest(".index-item"); if(!li) return;
    closeToc();
    var i = +li.getAttribute("data-idx");
    setTimeout(function(){ goSec(i); }, 120);
  });
  // The index is a dismissible off-canvas overlay at every width (tablet AND desktop),
  // so keep aria-hidden in sync with the open state.
  function syncLayout(){
    index.setAttribute("aria-hidden", index.classList.contains("show") ? "false" : "true");
  }
  window.addEventListener("resize", syncLayout);
  syncLayout();

  // ---------- prev / next / top + active index ----------
  function visibleSecs(){ return [].slice.call(container.querySelectorAll(".chapter-card")); }
  function currentIdx(){
    var secs = visibleSecs(), best = 0, bestTop = -1e9, y = window.scrollY + 120;
    for(var i=0;i<secs.length;i++){ var top = secs[i].getBoundingClientRect().top + window.scrollY; if(top <= y && top > bestTop){ bestTop = top; best = +secs[i].getAttribute("data-idx"); } }
    return best;
  }
  function goSec(idx){ var el = document.getElementById("sec-" + idx); if(el){ buildBody(el); el.scrollIntoView({ behavior:"smooth", block:"start" }); } }
  $("#fabNext").addEventListener("click", function(){ goSec(currentIdx() + 1); });
  $("#fabPrev").addEventListener("click", function(){ goSec(Math.max(0, currentIdx() - 1)); });
  $("#fabTop").addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });

  function markActive(){
    var idx = currentIdx();
    var items = document.querySelectorAll(".index-item");
    for(var i=0;i<items.length;i++) items[i].classList.toggle("active", +items[i].getAttribute("data-idx") === idx);
  }

  // ---------- Restore / save position ----------
  var saveTmr = null;
  window.addEventListener("scroll", function(){
    if(saveTmr) clearTimeout(saveTmr);
    saveTmr = setTimeout(function(){
      try { localStorage.setItem(LASTKEY, JSON.stringify({ idx: currentIdx(), y: Math.round(window.scrollY) })); } catch(e){}
      markActive();
    }, 300);
  }, { passive:true });
  function restorePos(){
    var raw = null; try { raw = localStorage.getItem(LASTKEY); } catch(e){}
    if(!raw) return;
    try { var o = JSON.parse(raw); var el = document.getElementById("sec-" + (o.idx || 0)); if(el){ buildBody(el); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 110 }); } } catch(e){}
  }

  // ---------- Offline indicator (in title card src line) ----------
  function setOnline(){
    var extra = navigator.onLine ? "" : " · 🟢 متصل";
    // no dedicated badge; keeps UI clean
    void extra;
  }
  window.addEventListener("online", setOnline);
  window.addEventListener("offline", setOnline);

  // ---------- PWA ----------
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }

  // ---------- Boot ----------
  fetch("data.json", { cache:"no-cache" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(json){
      DATA.sections = (json && json.sections) || [];
      var m = json.meta || {};
      $("#bookmeta").textContent = DATA.sections.length + " بابًا وفصلًا · " + (m.pages || "") + " صفحة · المصدر: " + (m.source || "");
      buildIndex(); render(); setOnline(); markActive();
      requestAnimationFrame(restorePos);
    })
    .catch(function(err){
      container.innerHTML = '<div class="empty"><div class="big">⚠️</div><p>تعذّر تحميل بيانات الكتاب.</p></div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
