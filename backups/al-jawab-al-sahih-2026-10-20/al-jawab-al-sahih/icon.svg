<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="الجواب الصحيح">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.55" stop-color="#0f3f3c"/>
      <stop offset="1" stop-color="#0b2b2a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e5d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c46b"/>
      <stop offset="1" stop-color="#c9a94c"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="96" ry="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55"/>

  <!-- left page -->
  <path d="M92 352 C146 316 206 316 248 348 L248 190 C206 158 146 158 92 194 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M420 352 C366 316 306 316 264 348 L264 190 C306 158 366 158 420 194 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- spine -->
  <line x1="256" y1="176" x2="256" y2="356" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- text lines on pages -->
  <g stroke="#7c8b86" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="126" y1="232" x2="224" y2="222"/>
    <line x1="126" y1="272" x2="224" y2="262"/>
    <line x1="126" y1="312" x2="206" y2="303"/>
    <line x1="288" y1="222" x2="386" y2="232"/>
    <line x1="288" y1="262" x2="386" y2="272"/>
    <line x1="306" y1="303" x2="386" y2="312"/>
  </g>

  <!-- gold marker ribbon -->
  <path d="M352 190 L352 402 L332 374 L312 402 L312 190 Z" fill="url(#gold)"/>
</svg>
