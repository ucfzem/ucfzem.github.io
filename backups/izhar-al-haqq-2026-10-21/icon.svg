<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="إظهار الحق">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6b45"/>
      <stop offset="0.55" stop-color="#175238"/>
      <stop offset="1" stop-color="#0e3527"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e5d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c46b"/>
      <stop offset="1" stop-color="#c9a94c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="96" ry="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55"/>

  <!-- starburst of manifestation -->
  <circle cx="256" cy="120" r="54" fill="url(#glow)"/>
  <g fill="url(#gold)">
    <path d="M256 78 L263 111 L296 120 L263 129 L256 162 L249 129 L216 120 L249 111 Z"/>
  </g>
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="316" y1="120" x2="332" y2="120"/>
    <line x1="180" y1="120" x2="196" y2="120"/>
    <line x1="299" y1="70" x2="310" y2="60"/>
    <line x1="213" y1="70" x2="202" y2="60"/>
    <line x1="299" y1="170" x2="310" y2="180"/>
    <line x1="213" y1="170" x2="202" y2="180"/>
  </g>

  <!-- left page -->
  <path d="M92 372 C146 336 206 336 248 368 L248 210 C206 178 146 178 92 214 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- right page -->
  <path d="M420 372 C366 336 306 336 264 368 L264 210 C306 178 366 178 420 214 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- spine -->
  <line x1="256" y1="196" x2="256" y2="376" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- text lines on pages -->
  <g stroke="#7c8b86" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="126" y1="252" x2="224" y2="242"/>
    <line x1="126" y1="292" x2="224" y2="282"/>
    <line x1="126" y1="332" x2="206" y2="323"/>
    <line x1="288" y1="242" x2="386" y2="252"/>
    <line x1="288" y1="282" x2="386" y2="292"/>
    <line x1="306" y1="323" x2="386" y2="332"/>
  </g>

  <!-- gold marker ribbon -->
  <path d="M352 210 L352 422 L332 394 L312 422 L312 210 Z" fill="url(#gold)"/>
</svg>
