<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="تفسير شيخ الإسلام ابن تيمية">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3b7a"/>
      <stop offset="0.55" stop-color="#1d2a5c"/>
      <stop offset="1" stop-color="#121a3d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8cf7e"/>
      <stop offset="1" stop-color="#c9a94c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="96" ry="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55"/>

  <!-- radiant eight-point star (light of guidance) above the Mushaf -->
  <circle cx="256" cy="118" r="56" fill="url(#glow)"/>
  <g fill="url(#gold)">
    <path d="M256 74 L266 108 L300 118 L266 128 L256 162 L246 128 L212 118 L246 108 Z"/>
    <path d="M256 84 L263 111 L290 118 L263 125 L256 152 L249 125 L222 118 L249 111 Z" fill="#fff" opacity="0.85"/>
  </g>
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="318" y1="118" x2="336" y2="118"/>
    <line x1="176" y1="118" x2="194" y2="118"/>
    <line x1="298" y1="66" x2="310" y2="54"/>
    <line x1="214" y1="66" x2="202" y2="54"/>
    <line x1="298" y1="170" x2="310" y2="182"/>
    <line x1="214" y1="170" x2="202" y2="182"/>
  </g>

  <!-- open Mushaf: two pages -->
  <path d="M92 388 C146 350 206 350 248 384 L248 208 C206 174 146 174 92 212 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <path d="M420 388 C366 350 306 350 264 384 L264 208 C306 174 366 174 420 212 Z"
        fill="url(#page)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
  <line x1="256" y1="194" x2="256" y2="392" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- gilded border line on each page -->
  <path d="M104 220 C148 190 200 190 238 218" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  <path d="M408 220 C364 190 312 190 274 218" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>

  <!-- text lines -->
  <g stroke="#6f7ba0" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="126" y1="258" x2="222" y2="248"/>
    <line x1="126" y1="298" x2="222" y2="288"/>
    <line x1="126" y1="338" x2="204" y2="329"/>
    <line x1="126" y1="374" x2="210" y2="366"/>
    <line x1="290" y1="248" x2="386" y2="258"/>
    <line x1="290" y1="288" x2="386" y2="298"/>
    <line x1="308" y1="329" x2="386" y2="338"/>
    <line x1="302" y1="366" x2="386" y2="374"/>
  </g>
</svg>
