<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنجيل برنابا — الترجمة العربية للدكتور خليل سعادة (1908)</title>
  <meta name="description" content="إنجيل برنابا بالترجمة العربية للدكتور خليل سعادة (طبعة دار المنار 1908) — النص الكامل في ٢٢٢ فصلاً، مع فهرس و بحث فوري وتلوين وتنقّل بين الفصول، ويعمل دون اتصال.">
  <meta name="theme-color" content="#0f5c5a">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إنجيل برنابا">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="./style.css">
  <script id="themeBoot">
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('barnabas_theme') ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      try {
        var fs = localStorage.getItem('barnabas_font');
        if (fs) document.documentElement.style.setProperty('--content-font-size', fs + 'rem');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="progressBar" aria-hidden="true"></div>

  <header>
    <button id="tocToggle" aria-label="فتح الفهرس" title="الفهرس">☰</button>
    <div class="brand">
      <h1>📖 إنجيل برنابا</h1>
      <p>الترجمة العربية للدكتور خليل سعادة — ١٩٠٨</p>
    </div>
    <button id="themeToggle" aria-label="تبديل الوضع النهاري/الليلي" title="تبديل الوضع النهاري/الليلي">🌙</button>
  </header>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <strong>الفهرس</strong>
        <button id="drawerClose" aria-label="إغلاق">✕</button>
      </div>
      <input id="drawerFilter" type="search" placeholder="ابحث عن فصل…" autocomplete="off">
      <div id="drawerList" class="drawer-list"></div>
    </div>
  </div>

  <main id="app" aria-live="polite"></main>

  <footer>
    <p>📖 <b>إنجيل برنابا</b> — الترجمة العربية للدكتور خليل سعادة، طبعة دار المنار ١٩٠٨م. النص الكامل في ٢٢٢ فصلاً.</p>
    <p>يُعرض النص كما هو في المصدر دون زيادة؛ المصدر: موقع «المعرفة» (sources.marefa.org).</p>
  </footer>

  <button id="toTop" aria-label="العودة إلى الأعلى" title="إلى الأعلى" hidden>↑</button>

  <script src="./app.js"></script>
  <script data-app-sw="1">if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}</script>
  <script data-root-sw="1">if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}</script>
</body>
</html>
