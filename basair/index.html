    :root {
      color-scheme: dark;
      --reading-size: 1.35rem;
      --bg: #121110;
      --surface: #1c1917;
      --surface-2: #231f1c;
      --surface-3: #2c2621;
      --text: #f3e9dc;
      --muted: #b8a88f;
      --border: rgba(194, 155, 83, .22);
      --accent: #c29b53;
      --accent-2: #d4af37;
      --accent-soft: rgba(194, 155, 83, .12);
      --emerald: #2d5d46;
      --emerald-deep: #1b4332;
      --header-text: #f5eeda;
      --header-muted: rgba(245, 238, 218, .72);
      --mark-bg: #d97706;
      --mark-text: #1a1a1a;
      --mark-active: #fef08a;
      --header-bg: #2d5d46;
      --shadow: 0 18px 40px rgba(0, 0, 0, .45);
      --font-ui: "Cairo", "Segoe UI", system-ui, -apple-system, Tahoma, Arial, sans-serif;
      --font-book: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", "Scheherazade New", "Times New Roman", serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fbf8f2;
      --surface: #fffdf6;
      --surface-2: #f5f0eb;
      --surface-3: #ece4d8;
      --text: #2c221e;
      --muted: #7a6a50;
      --border: #d8c9a8;
      --accent: #a9792f;
      --accent-2: #c29b53;
      --accent-soft: rgba(169, 121, 47, .10);
      --emerald: #1f5c46;
      --emerald-deep: #143d2e;
      --header-text: #f5eeda;
      --header-muted: rgba(245, 238, 218, .78);
      --mark-bg: #fef08a;
      --mark-text: #2c221e;
      --mark-active: #fbbf24;
      --header-bg: #1f5c46;
      --shadow: 0 18px 40px rgba(44, 34, 30, .12);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1100px 560px at 100% -10%, var(--accent-soft), transparent 62%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    ::selection { background: var(--accent); color: #04110c; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 17px; height: 17px; }
    .icon-lg { width: 25px; height: 25px; }

    .progress-track {
      position: fixed;
      inset: 0 0 auto 0;
      height: 3px;
      background: transparent;
      z-index: 100;
      pointer-events: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(16, 185, 129, .45);
      transition: width .15s linear;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 22px 18px 18px;
      background: var(--surface);
      border-inline-end: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 80;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-3) transparent;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      flex: none;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #04110c;
      background: linear-gradient(145deg, #34d399, #059669 62%, #b45309);
      box-shadow: 0 8px 20px rgba(16, 185, 129, .22);
    }
    .brand-text { min-width: 0; }
    .brand-title {
      margin: 0;
      font-size: 1.14rem;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drawer-close { display: none; margin-inline-start: auto; }

    .toc-label {
      margin: 4px 2px -8px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .toc {
      display: flex;
      flex-direction: column;
      gap: 2px;
      direction: rtl;
      text-align: right;
      padding-bottom: 8px;
    }
    .toc a {
      display: block;
      padding: 8px 10px;
      border-radius: 9px;
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.55;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .toc a:hover { background: var(--surface-2); color: var(--text); }
    .toc-chapter {
      margin-top: 6px;
      color: var(--text) !important;
      font-weight: 700;
      font-size: .9rem !important;
    }
    .toc-section {
      padding-inline-start: 20px !important;
      font-size: .8rem !important;
      border-inline-start: 2px solid var(--border) !important;
      border-start-start-radius: 0;
      border-end-start-radius: 0;
      margin-inline-start: 10px;
    }
    .toc a.active {
      color: var(--accent) !important;
      background: var(--accent-soft);
      border-color: rgba(16, 185, 129, .28);
    }
    .toc-section.active { border-inline-start-color: var(--accent) !important; }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.7;
    }
    .demo-mini {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--accent-2);
      font-weight: 700;
    }
    .demo-mini::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, .12);
    }

    .main { min-width: 0; }

    .header {
      position: sticky;
      top: 0;
      z-index: 60;
      padding: 13px clamp(14px, 3.4vw, 34px) 12px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 980px;
      margin: 0 auto;
    }
    .title-wrap { flex: 1; min-width: 0; }
    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.02rem, 2.2vw, 1.3rem);
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: right;
    }
    html[dir="ltr"] .title-wrap h1,
    html[dir="ltr"] .title-wrap p { direction: ltr; text-align: left; }
    .title-wrap p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: .72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: right;
    }
    .header-actions { display: flex; align-items: center; gap: 7px; flex: none; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn.small {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }
    .icon-btn.small:hover { background: var(--surface-2); color: var(--accent); }
    #searchInput::-webkit-search-cancel-button { display: none; }
    .icon-btn:disabled { opacity: .35; cursor: default; }
    .icon-btn:disabled:hover { background: transparent; color: var(--muted); border-color: transparent; }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 980px;
      margin: 11px auto 0;
      padding: 5px 8px 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .02) inset;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .searchbar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-icon { flex: none; color: var(--muted); }
    #searchInput {
      flex: 1 1 150px;
      min-width: 0;
      padding: 7px 2px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: .92rem;
    }
    #searchInput::placeholder { color: var(--muted); opacity: .8; }
    .search-count {
      flex: none;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .result-info {
      flex: none;
      color: var(--muted);
      font-size: .69rem;
      white-space: nowrap;
    }
    .result-nav { display: flex; align-items: center; gap: 0; flex: none; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 12px;
      max-width: 980px;
      margin: 8px auto 0;
    }
    .font-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
    }
    .font-btn {
      min-width: 28px;
      height: 26px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      font-size: .74rem;
      font-weight: 800;
      cursor: pointer;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }
    .font-btn:hover { border-color: var(--accent); color: var(--accent); }
    .font-size-label {
      min-width: 22px;
      text-align: center;
      color: var(--text);
      font-size: .72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .lang-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
    }
    .lang-select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      font-size: .74rem;
      font-weight: 700;
      cursor: pointer;
      direction: ltr;
      text-align: left;
    }
    .lang-select option {
      font-family: "Cairo", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      font-weight: 700;
    }
    .lang-menu { position: relative; }
    .lang-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      font-size: .74rem;
      font-weight: 700;
      cursor: pointer;
      direction: ltr;
    }
    .lang-trigger:hover,
    .lang-trigger[aria-expanded="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }
    .flag {
      display: block;
      width: 22px;
      height: 15px;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .22);
      flex: none;
    }
    .lang-code {
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }
    .lang-chevron {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .7;
    }
    .lang-options {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: auto;
      z-index: 90;
      min-width: 180px;
      padding: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    html[dir="ltr"] .lang-options { left: auto; right: 0; }
    .lang-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .76rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      direction: ltr;
    }
    .lang-option:hover,
    .lang-option:focus-visible,
    .lang-option[aria-selected="true"] {
      background: var(--accent-soft);
      color: var(--accent-2);
    }
    .lang-option .lang-name {
      margin-inline-start: auto;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 600;
    }
    .lang-option[aria-selected="true"] .lang-name { color: var(--accent); }
    .active-label {
      max-width: 46%;
      margin-inline-start: auto;
      color: var(--muted);
      font-size: .7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 40px) 40px;
    }
    .book-content {
      direction: rtl;
      text-align: right;
      font-family: var(--font-book);
      font-size: var(--reading-size);
      line-height: 2.1;
      color: var(--text);
      overflow-wrap: break-word;
    }
    .chapter {
      margin: 0 0 56px;
      scroll-margin-top: 178px;
    }
    .chapter-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .chapter-num {
      flex: none;
      padding: 4px 9px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .06em;
      font-variant-numeric: tabular-nums;
    }
    .chapter h2 {
      margin: 0;
      font-family: var(--font-ui);
      font-size: clamp(1.3rem, 2.7vw, 1.72rem);
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: -.01em;
    }
    .chapter-intro {
      margin: 0 0 18px;
      padding-inline-start: 14px;
      border-inline-start: 3px solid var(--accent);
      color: var(--muted);
      font-size: 1.02em;
      line-height: 2;
    }

    function localized(value) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        return value[state.lang] || value.ar || "";
      }
      return value == null ? "" : String(value);
    }

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const store = {
      get(key, fallback = null) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch (error) {
          return fallback;
        }
      },
      set(key, value) {
        try { localStorage.setItem(key, String(value)); } catch (error) {}
      }
    };

    const state = {
      lang: "ar",
      theme: "dark",
      fontSize: 19,
      query: "",
      currentMatch: -1
    };

    const isMobile = () => window.matchMedia("(max-width: 900px)").matches;
    const prefersReducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function normalizeChar(ch) {
      if (/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/.test(ch)) return [];
      if (/[\u0622\u0623\u0625\u0671]/.test(ch)) return ["\u0627"];
      if (ch === "\u0649") return ["\u064A"];
      if (ch === "\u0624") return ["\u0648"];
      if (ch === "\u0626") return ["\u064A"];
      if (ch === "\u0629") return ["\u0647"];
      return Array.from(ch.toLowerCase());
    }

    function buildNormalized(text) {
      let normalized = "";
      const starts = [];
      const ends = [];
      for (let i = 0; i < text.length; i++) {
        const chars = normalizeChar(text[i]);
        for (const ch of chars) {
          normalized += ch;
          starts.push(i);
          ends.push(i + 1);
        }
      }
      return { text: normalized, starts, ends };
    }

    function normalizeString(text) {
      let normalized = "";
      for (const ch of text) {
        normalized += normalizeChar(ch).join("");
      }
      return normalized;
    }

    function renderBook() {
      bookEl.textContent = "";
      tocEl.textContent = "";
      originalText.clear();

      bookData.forEach((item, index) => {
        const chapterEl = document.createElement("section");
        chapterEl.className = "chapter";
        chapterEl.id = item.id;
        chapterEl.dataset.chapter = item.id;

        const head = document.createElement("div");
        head.className = "chapter-head";
        const num = document.createElement("span");
        num.className = "chapter-num";
        num.textContent = String(index + 1).padStart(2, "0");
        const heading = document.createElement("h2");
        heading.textContent = localized(item.title);
        head.append(num, heading);
        chapterEl.appendChild(head);

        const body = document.createElement("div");
        body.className = "section";
        const content = localized(item.content);
        if (content) body.innerHTML = content;
        if (!body.children.length && content.trim()) {
          const p = document.createElement("p");
          p.textContent = content;
          body.appendChild(p);
        }

        $$("h2, p, h3, h4, h5, li, blockquote", chapterEl).forEach((el) => {
          const text = el.textContent;
          if (!text.trim()) return;
          el.dataset.searchable = "1";
          originalText.set(el, { html: el.innerHTML, text });
        });

        chapterEl.appendChild(body);
        bookEl.appendChild(chapterEl);

        const chapterLink = document.createElement("a");
        chapterLink.className = "toc-chapter";
        chapterLink.href = "#" + item.id;
        chapterLink.dataset.target = item.id;
        chapterLink.textContent = localized(item.title);
        tocEl.appendChild(chapterLink);
      });
    }

    function updateSearchStatus() {
      const t = I18N[state.lang];
      const query = state.query.trim();
      const hasQuery = query.length > 0;
      clearBtn.hidden = !hasQuery;
      prevBtn.disabled = matches.length === 0;
      nextBtn.disabled = matches.length === 0;

      if (!hasQuery) {
        searchCount.textContent = "";
        resultInfo.textContent = "";
        return;
      }
      if (!matches.length) {
        searchCount.textContent = t.noResults;
        resultInfo.textContent = "";
        return;
      }
      searchCount.textContent = t.results.replace("{n}", String(matches.length));
      resultInfo.textContent = t.resultOf
        .replace("{i}", String(state.currentMatch + 1))
        .replace("{n}", String(matches.length));
    }

    function clearHighlights() {
      originalText.forEach((record, el) => {
        if (!record) return;
        if (record.html != null) el.innerHTML = record.html;
        else if (record.text != null) el.textContent = record.text;
      });
      matches = [];
      state.currentMatch = -1;
    }

    function highlightRanges(el, ranges) {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      let offset = 0;
      while (walker.nextNode()) {
        const node = walker.currentNode;
        const length = node.nodeValue.length;
        if (length) nodes.push({ node, start: offset, end: offset + length });
        offset += length;
      }

      nodes.forEach(({ node, start, end }) => {
        const local = [];
        ranges.forEach(([rangeStart, rangeEnd]) => {
          const from = Math.max(rangeStart, start);
          const to = Math.min(rangeEnd, end);
          if (to > from) local.push([from - start, to - start]);
        });
        if (!local.length) return;

        const text = node.nodeValue;
        const fragment = document.createDocumentFragment();
        let position = 0;
        local.forEach(([from, to]) => {
          if (from > position) fragment.appendChild(document.createTextNode(text.slice(position, from)));
          const mark = document.createElement("mark");
          mark.className = "search-hit";
          mark.dataset.matchIndex = String(matches.length);
          mark.textContent = text.slice(from, to);
          fragment.appendChild(mark);
          matches.push(mark);
          position = to;
        });
        if (position < text.length) fragment.appendChild(document.createTextNode(text.slice(position)));
        node.replaceWith(fragment);
      });
    }

    function runSearch(rawQuery) {
      clearHighlights();
      state.query = rawQuery;
      const query = normalizeString(rawQuery.trim());
      if (!query) {
        updateSearchStatus();
        return;
      }

      originalText.forEach((record, el) => {
        const text = record.text || "";
        const normalized = buildNormalized(text);
        const ranges = [];
        let from = 0;
        let found = normalized.text.indexOf(query, from);
        while (found !== -1) {
          const start = normalized.starts[found];
          const end = normalized.ends[found + query.length - 1];
          if (end > start) ranges.push([start, end]);
          from = found + query.length;
          found = normalized.text.indexOf(query, from);
        }
        if (ranges.length) highlightRanges(el, ranges);
      });

      if (matches.length) {
        state.currentMatch = 0;
        setActiveMatch(0, false);
      } else {
        state.currentMatch = -1;
        updateSearchStatus();
      }
    }

    function setActiveMatch(index, shouldScroll) {
      if (!matches.length) return;
      state.currentMatch = ((index % matches.length) + matches.length) % matches.length;
      matches.forEach((mark, i) => mark.classList.toggle("active", i === state.currentMatch));
      if (shouldScroll) {
        matches[state.currentMatch].scrollIntoView({
          behavior: prefersReducedMotion() ? "auto" : "smooth",
          block: "center",
          inline: "nearest"
        });
      }
      updateSearchStatus();
    }

    function nextMatch() {
      if (matches.length) setActiveMatch(state.currentMatch + 1, true);
    }

    function prevMatch() {
      if (matches.length) setActiveMatch(state.currentMatch - 1, true);
    }

    function clearSearch() {
      searchInput.value = "";
      state.query = "";
      window.clearTimeout(searchTimer);
      clearHighlights();
      updateSearchStatus();
      searchInput.focus();
    }

    function updateLangMenu() {
      const meta = LANG_META[state.lang] || LANG_META.ar;
      langCode.textContent = meta.code;
      const use = langFlag.querySelector("use");
      if (use) use.setAttribute("href", "#flag-" + meta.flag);
      langOptions.querySelectorAll(".lang-option").forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.lang === state.lang ? "true" : "false");
      });
    }

    function closeLangMenu() {
      langOptions.hidden = true;
      langTrigger.setAttribute("aria-expanded", "false");
    }

    function openLangMenu() {
      langOptions.hidden = false;
      langTrigger.setAttribute("aria-expanded", "true");
      const current = langOptions.querySelector('.lang-option[data-lang="' + state.lang + '"]');
      if (current) current.focus();
    }

    function applyLanguage(lang, persist) {
      state.lang = I18N[lang] ? lang : "ar";
      const t = I18N[state.lang];
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
      bookEl.dir = state.lang === "ar" ? "rtl" : "ltr";

      $$("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n;
        if (t[key] != null) el.textContent = t[key];
      });
      $$("[data-i18n-placeholder]").forEach((el) => {
        const key = el.dataset.i18nPlaceholder;
        if (t[key] != null) el.placeholder = t[key];
      });
      $$("[data-i18n-aria]").forEach((el) => {
        const key = el.dataset.i18nAria;
        if (t[key] != null) el.setAttribute("aria-label", t[key]);
      });

      updateLangMenu();
      document.title = t.appTitle + " — " + t.readerLabel;

      const hasLocalizedContent = bookData.some((item) => item && (typeof item.title === "object" || typeof item.content === "object"));
      if (hasLocalizedContent) {
        const scrollY = window.scrollY;
        renderBook();
        if (state.query.trim()) runSearch(state.query);
        window.scrollTo(0, scrollY);
      }

      if (!navigator.onLine) netStatus.textContent = t.offline;
      updateSearchStatus();
      updateActive();
      syncDrawerA11y();
      if (persist) store.set("basair_lang", state.lang);
    }

    function applyTheme(theme, persist) {
      state.theme = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = state.theme;
      document.documentElement.style.colorScheme = state.theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", state.theme === "dark" ? "#121110" : "#fbf8f2");
      const sun = $(".icon-sun", themeBtn);
      const moon = $(".icon-moon", themeBtn);
      if (sun) sun.style.display = state.theme === "light" ? "block" : "none";
      if (moon) moon.style.display = state.theme === "dark" ? "block" : "none";
      if (persist) store.set("basair_theme", state.theme);
    }

    function applyFontSize(size, persist) {
      state.fontSize = Math.max(15, Math.min(30, size));
      document.documentElement.style.setProperty("--reading-size", state.fontSize + "px");
      fontSizeLabel.textContent = String(state.fontSize);
      if (persist) store.set("basair_font", String(state.fontSize));
    }

    function updateActive() {
      const sections = $$(".section", bookEl);
      if (!sections.length) return;

      const headerHeight = $("#header") ? $("#header").getBoundingClientRect().height : 160;
      const chapterThreshold = headerHeight + 42;
      const sectionThreshold = headerHeight + 122;

      let current = sections[0];
      for (const section of sections) {
        if (section.getBoundingClientRect().top <= sectionThreshold) current = section;
        else break;
      }

      let activeChapter = null;
      for (const chapterEl of $$(".chapter", bookEl)) {
        if (chapterEl.getBoundingClientRect().top <= chapterThreshold) activeChapter = chapterEl;
        else break;
      }

      if (activeChapter && current.closest(".chapter") !== activeChapter) {
        const firstSection = activeChapter.querySelector(".section");
        if (firstSection) current = firstSection;
      }

      const chapter = current.closest(".chapter");
      $$(".toc a", tocEl).forEach((link) => {
        link.classList.toggle("active", link.dataset.target === current.id);
      });
      $$(".toc-chapter", tocEl).forEach((link) => {
        link.classList.toggle("active", Boolean(chapter) && link.dataset.target === chapter.id);
      });
      const chapterData = chapter ? bookData.find((item) => item.id === chapter.id) : null;
      const t = I18N[state.lang];
      activeLabel.textContent = chapterData ? t.active + ": " + localized(chapterData.title) : "";
    }

    function updateProgress() {
      const doc = document.documentElement;
      const max = doc.scrollHeight - window.innerHeight;
      const percent = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
      progressBar.style.width = percent.toFixed(2) + "%";
      progressTrack.setAttribute("aria-valuenow", String(Math.round(percent)));
      topBtn.classList.toggle("show", window.scrollY > 700);
    }

    function saveScrollNow() {
      store.set("basair_scroll", String(Math.round(window.scrollY)));
    }

    function scheduleSave() {
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(saveScrollNow, 260);
    }

    function scrollToTarget(id, updateHash) {
      const target = document.getElementById(id);
      if (!target) return;
      target.scrollIntoView({
        behavior: prefersReducedMotion() ? "auto" : "smooth",
        block: "start"
      });
      if (updateHash !== false) {
        try { history.replaceState(null, "", "#" + id); } catch (error) {}
      }
      window.setTimeout(updateActive, 380);
    }

    function restoreScroll() {
      if (location.hash) {
        const id = decodeURIComponent(location.hash.slice(1));
        window.setTimeout(() => scrollToTarget(id, false), 90);
        return;
      }
      const saved = Number.parseInt(store.get("basair_scroll", "0"), 10);
      if (Number.isFinite(saved) && saved > 0) {
        window.setTimeout(() => window.scrollTo(0, saved), 90);
      }
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    function updateNetwork(showMessage) {
      const t = I18N[state.lang];
      if (navigator.onLine) {
        netStatus.hidden = true;
        if (showMessage) showToast(t.online);
      } else {
        netStatus.hidden = false;
        netStatus.textContent = t.offline;
        if (showMessage) showToast(t.offline);
      }
    }

    function syncDrawerA11y() {
      if (isMobile()) {
        const open = document.body.classList.contains("drawer-open");
        sidebar.setAttribute("aria-hidden", open ? "false" : "true");
      } else {
        sidebar.setAttribute("aria-hidden", "false");
      }
    }

    function openDrawer() {
      if (!isMobile()) return;
      document.body.classList.add("drawer-open");
      menuBtn.setAttribute("aria-expanded", "true");
      sidebar.setAttribute("aria-hidden", "false");
      closeDrawerBtn.focus();
    }

    function closeDrawer(restoreFocus = true) {
      document.body.classList.remove("drawer-open");
      menuBtn.setAttribute("aria-expanded", "false");
      syncDrawerA11y();
      if (restoreFocus && isMobile()) menuBtn.focus();
    }

    function onScroll() {
      if (!scrollTicking) {
        scrollTicking = true;
        requestAnimationFrame(() => {
          updateActive();
          updateProgress();
          scrollTicking = false;
        });
      }
      scheduleSave();
    }

    function setup() {
      menuBtn.addEventListener("click", openDrawer);
      closeDrawerBtn.addEventListener("click", () => closeDrawer());
      overlay.addEventListener("click", () => closeDrawer());
      themeBtn.addEventListener("click", () => {
        applyTheme(state.theme === "dark" ? "light" : "dark", true);
      });
      fontMinus.addEventListener("click", () => applyFontSize(state.fontSize - 1, true));
      fontPlus.addEventListener("click", () => applyFontSize(state.fontSize + 1, true));
      langTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        if (langOptions.hidden) openLangMenu(); else closeLangMenu();
      });
      langOptions.addEventListener("click", (event) => {
        const btn = event.target.closest(".lang-option");
        if (!btn) return;
        applyLanguage(btn.dataset.lang, true);
        closeLangMenu();
        langTrigger.focus();
      });
      langOptions.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
        event.preventDefault();
        const items = Array.from(langOptions.querySelectorAll(".lang-option"));
        const index = items.indexOf(document.activeElement);
        const next = event.key === "ArrowDown"
          ? items[(index + 1) % items.length]
          : items[(index - 1 + items.length) % items.length];
        if (next) next.focus();
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".lang-menu")) closeLangMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLangMenu();
      });

      searchInput.addEventListener("input", () => {
        state.query = searchInput.value;
        window.clearTimeout(searchTimer);
        if (!state.query.trim()) {
          clearHighlights();
          updateSearchStatus();
          return;
        }
        searchTimer = window.setTimeout(() => runSearch(searchInput.value), 150);
      });
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          if (matches.length) {
            if (event.shiftKey) prevMatch();
            else nextMatch();
          } else {
            runSearch(searchInput.value);
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          clearSearch();
        }
      });
      clearBtn.addEventListener("click", clearSearch);
      prevBtn.addEventListener("click", prevMatch);
      nextBtn.addEventListener("click", nextMatch);

      tocEl.addEventListener("click", (event) => {
        const link = event.target.closest("a[data-target]");
        if (!link) return;
        event.preventDefault();
        scrollToTarget(link.dataset.target);
        closeDrawer(false);
      });

      topBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: prefersReducedMotion() ? "auto" : "smooth" });
      });

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", () => {
        if (!isMobile()) document.body.classList.remove("drawer-open");
        syncDrawerA11y();
        updateActive();
        updateProgress();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (document.body.classList.contains("drawer-open")) {
          closeDrawer();
        } else if (state.query) {
          clearSearch();
        }
      });
      window.addEventListener("online", () => updateNetwork(true));
      window.addEventListener("offline", () => updateNetwork(true));
      window.addEventListener("pagehide", saveScrollNow);
      window.addEventListener("hashchange", () => {
        if (location.hash) {
          const id = decodeURIComponent(location.hash.slice(1));
          scrollToTarget(id, false);
        }
      });

      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    }

    function init() {
      const savedTheme = store.get("basair_theme", "dark");
      const savedLang = store.get("basair_lang", "ar");
      const savedFont = Number.parseInt(store.get("basair_font", "22"), 10);

      state.theme = savedTheme === "light" ? "light" : "dark";
      state.lang = I18N[savedLang] ? savedLang : "ar";
      state.fontSize = Number.isFinite(savedFont) ? Math.max(15, Math.min(30, savedFont)) : 22;

      renderBook();
      applyTheme(state.theme, false);
      applyFontSize(state.fontSize, false);
      applyLanguage(state.lang, false);
      setup();
      updateNetwork(false);
      updateProgress();
      updateActive();
      restoreScroll();
    }

    init();
  </script>
</body>
</html>
