<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة بصائر - Basair</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .ui-font { font-family: 'Tajawal', sans-serif; }
        .highlight { background-color: rgba(217, 119, 6, 0.35); color: inherit; padding: 0 4px; border-radius: 4px; font-weight: bold; }
        body.dark { background-color: #0c1512; color: #e2e8f0; }
        body.light { background-color: #f4f6f4; color: #1e293b; }
        .nuzhat-header { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); border-bottom: 2px solid #b45309; }
        .theme-card { background-color: var(--card-bg); border-color: var(--card-border); }
        body.dark { --card-bg: rgba(13, 27, 22, 0.85); --card-border: #134e4a; --input-bg: #061a14; --input-border: #115e59; }
        body.light { --card-bg: #ffffff; --card-border: #cbd5e1; --input-bg: #f8fafc; --input-border: #94a3b8; }
    </style>
</head>
<body class="dark ui-font transition-all duration-300 min-h-screen flex flex-col" style="--card-bg: rgba(13, 27, 22, 0.85); --card-border: #134e4a;">
    <header class="nuzhat-header text-white px-4 py-3 sticky top-0 z-50 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📖</span>
            <div>
                <h1 id="app-title" class="font-bold text-base text-amber-300">موسوعة بصائر</h1>
                <p id="app-subtitle" class="text-[10px] text-emerald-200 opacity-80">المنصة الرقمية المتقدمة</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-emerald-950/80 text-amber-200 border border-emerald-700 rounded-lg px-2 py-1 text-xs focus:outline-none cursor-pointer">
                <option value="ar">🇲🇦 العربية</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
            </select>
            <button onclick="toggleTheme()" class="p-2 rounded-lg bg-emerald-900 hover:bg-emerald-800 text-xs transition-colors border border-emerald-700 shadow" title="تبديل المظهر">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-4 space-y-4">
        <div class="theme-card border rounded-xl p-4 shadow-md backdrop-blur">
            <div class="flex justify-between items-center cursor-pointer mb-2" onclick="toggleIndexPanel()">
                <div class="flex items-center gap-2">
                    <span class="text-amber-500 text-base">🚪</span>
                    <h2 id="label-doors" class="text-xs text-amber-400 font-bold">فهرس الأبواب والمحاور (11 باباً)</h2>
                </div>
                <span id="index-arrow" class="text-xs text-amber-500 font-bold transition-transform duration-300">▼</span>
            </div>
            <div id="doors-grid" class="hidden grid grid-cols-1 gap-2 mt-3 pt-3 border-t border-emerald-900/30 max-h-64 overflow-y-auto">
                <button onclick="jumpToDoor(0)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الأول: مدخل دراسة الإلحاد الجديد</span><span class="text-amber-400 font-mono text-[10px]">01</span></button>
                <button onclick="jumpToDoor(2)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الثاني: نقد أصول المادية العلمية</span><span class="text-amber-400 font-mono text-[10px]">02</span></button>
                <button onclick="jumpToDoor(4)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الثالث: شبهات أصل الحياة والكون</span><span class="text-amber-400 font-mono text-[10px]">03</span></button>
                <button onclick="jumpToDoor(6)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الرابع: معضلة الوعي والخلق</span><span class="text-amber-400 font-mono text-[10px]">04</span></button>
                <button onclick="jumpToDoor(8)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الخامس: الأخلاق وقانون الإلزام</span><span class="text-amber-400 font-mono text-[10px]">05</span></button>
                <button onclick="jumpToDoor(10)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب السادس: قضايا النبوات والرسالات</span><span class="text-amber-400 font-mono text-[10px]">06</span></button>
                <button onclick="jumpToDoor(12)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب السابع: الرد على الشبهات التاريخية</span><span class="text-amber-400 font-mono text-[10px]">07</span></button>
                <button onclick="jumpToDoor(14)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الثامن: حجية القرآن الكريم</span><span class="text-amber-400 font-mono text-[10px]">08</span></button>
                <button onclick="jumpToDoor(16)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب التاسع: براهين النبوة المحمدية</span><span class="text-amber-400 font-mono text-[10px]">09</span></button>
                <button onclick="jumpToDoor(18)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب العاشر: خلاصات ومنهجية الرد</span><span class="text-amber-400 font-mono text-[10px]">10</span></button>
                <button onclick="jumpToDoor(20)" class="text-right text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center"><span>الباب الحادي عشر: الخاتمة والآفاق</span><span class="text-amber-400 font-mono text-[10px]">11</span></button>
            </div>
        </div>

        <div class="theme-card border rounded-xl p-3 shadow-md">
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="ابحث في الموسوعة (كلمة أو رقم)..." oninput="handleSearch(this.value)" class="flex-1 bg-[var(--input-bg)] border border-[var(--input-border)] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                <button id="btn-clear" onclick="clearSearch()" class="bg-emerald-900 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs transition-colors">مسح</button>
            </div>
            <div id="search-stats" class="text-xs text-amber-400 mt-2 px-1 font-mono"></div>
        </div>

        <div class="theme-card border rounded-xl p-3 shadow-md flex justify-between items-center gap-3">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button id="btn-prev" onclick="changePage(currentPage - 1)" class="bg-emerald-900 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs transition-colors">السابق ←</button>
                <select id="page-select" onchange="changePage(parseInt(this.value))" class="flex-1 sm:flex-none bg-[var(--input-bg)] border border-[var(--input-border)] rounded-lg px-3 py-1.5 text-xs text-center focus:outline-none"></select>
                <button id="btn-next" onclick="changePage(currentPage + 1)" class="bg-emerald-900 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs transition-colors">→ التالي</button>
            </div>
            <div id="total-info" class="text-xs text-amber-500 font-mono"></div>
        </div>

        <div id="reader-card" class="theme-card border rounded-2xl p-6 space-y-6 shadow-xl">
            <p class="text-center text-zinc-400">جاري تحميل بيانات الموسوعة...</p>
        </div>
    </main>

    <footer class="border-t border-emerald-900/50 py-4 text-center text-xs text-emerald-600 dark:text-emerald-400/70">
        <p id="footer-text">موسوعة بصائر الرقمية — قراءة مريحة بدون انترنت</p>
    </footer>

    <script>
        const allParagraphs = [
            "بسم الله الرحمن الرحيم. الحمد لله رب العالمين، والصلاة والسلام على أشرف الأنبياء والمرسلين.",
            "أما بعد، فهذه بصائر ومعالم في طريق المعرفة، أضعها بين يدي القارئ الكريم لتكون دليلاً ومُرشداً.",
            "الباب الأول: مدخل دراسة الإلحاد الجديد وتفكيك مقولاته المركزية في الفكر المعاصر.",
            "يشهد العصر الحديث موجات متكررة من التشكيك المنظم الذي يستهدف الثوابت العقدية والأخلاقية.",
            "إن الإلحاد الجديد لم يعد مجرد قناعة شخصية بالفراغ الوجودي، بل تحول إلى خطاب ايديولوجي حجاجي.",
            "تتغذى هذه الموجات على سوء فهم للفلسفة الطبيعية وتوظيف مغلوط لاكتشافات العلوم التجريبية.",
            "من أهم قواعد التناول النقدي لهذه الشبهات التفريق الدقيق بين العلم التجريبي والإيديولوجيا المادية.",
            "فالعلم يبحث في كيف تعمل الاشياء، بينما تحاول المادية الإجابة عن لماذا و من أين جاءت.",
            "إن العقل البشري مفطور على البحث عن العلنية والغاية، وغياب المعنى يورث اضطراباً نفسياً عميقاً.",
            "لذا فإن تفكيك هذه الخطابات يبدأ بتعرية التناقضات المنطقية الكامنة في أصل الطرح المادي.",
            "الباب الثاني: نقد أصول المادية العلمية وإبطال دعوى الاكتفاء الذاتي للكون.",
            "تدعي المادية أن الكون لا يحتاج إلى علة مفارقة لأنه وُجد صدفة أو نتيجة قوانين فيزيائية أزلية.",
            "غير أن الفيزياء المعاصرة نفسها أثبتت أن الكون له بداية زمنية ومكانية محددة فيما يعرف بالانفجار العظيم.",
            "وما دام الكون حادثاً ومخلوقاً في الزمان، فهو محتاج بلا ريب إلى موجد حكيم عليم خارج نطاقه.",
            "إن القوانين الطبيعية ليست سوى وصف لانتظام الأفعال وليست هي الفاعلة بذاتها أو الخالقة لغيرها.",
            "فالجاذبية أو الديناميكا الحرارية لا تفكر ولا تريد، بل هي نواميس مسخرة ومنتظمة بإحكام.",
            "القول بأن الصدفة وحدها أنشأت هذا التعقيد المذهل في الخلايا الحية يطرد العقل ويصطدم بقوانين الاحتمالات.",
            "إن تعقيد الحمض النووي (DNA) يشبه كتابة موسوعة ضخمة بلغة دقيقة جداً عن طريق رمي حروف عشوائية.",
            "وهذا محال عقلاً ورياضياً، فالحروف لا ترتب نفسها بنفسها لتشكل دلالات ومعاني محكمة.",
            "من هنا يظهر بطلان الاختزال المادي السطحي لتفسير الظواهر الواعية والنفسية المعقدة.",
            "الباب الثالث: شبهات أصل الحياة والكون والرد عليها بالبراهين العقلية.",
            "تطرح المادية الحيوية فرضية نشوء الحياة تلقائياً من مواد غير حيّة عبر تفاعلات كيميائية عشوائية.",
            "وقد أثبتت تجارب التخلق المتساقطة استحالة حدوث ذلك في ظروف طبيعية دون إرادة وتوجيه.",
            "إن الخلية الحية أبسطها مكونة من آليات معقدة متكاملة لا يمكنها العمل جزئياً أو تدريجياً.",
            "فنظريات التطور الموجه وغير الموجه عجزت عن تفسير أصل الوعي والظهور المفاجئ للشفرة الوراثية.",
            "الكون يتميز بضبط دقيق (Fine-Tuning) مذهل للثوابت الفيزيائية؛ كقوة الجاذبية والنووية.",
            "لو تغيرت هذه الثوابت بنسبة أجزاء من ترليون ترليون لما استقرت النجوم ولا قامت حياة.",
            "هذا التوافق الكوني المحكم يشهد بحدة على أن وراء هذا الخلق تصميماً هادفاً وحكمة بالغة.",
            "ولا يمكن تفسير هذا التوافق بالكون المتعدد (Multiverse) لكونه مجرد هروب نظري بلا دليل تجريبي.",
            "الباب الرابع: معضلة الوعي والخلق وإثبات مباينة الروح للمادة.",
            "يعجز التفسير المادي تماماً عن تفسير حقيقة الوعي والإدراك والتجربة الذاتية للشعور (Qualia).",
            "كيف تتحول تجمعات الذرات الصماء والجسيمات المادية إلى كائن يدرك ويفرح ويحزن ويتأمل؟",
            "المادة بطبيعتها خالية من الإدراك والمعنى، وما تفاعلات الخلايا العصبية إلا مظاهر وظائفية.",
            "الإنسان يمتلك جوهراً روحياً مفارقاً يتجاوز حدود الجسد المادي والخلايا المتجددة.",
            "هذا الوعي المستمر وثبات الهوية الشخصية رغم تغير خلايا البدن عبر السنين دليل قاطع على جوهر الروح.",
            "الباب الخامس: الأخلاق وقانون الإلزام ومأزق النسبية الأخلاقية.",
            "في العالم المادي الصرف لا توجد قيم مطلقة، بل هي مجرد انعكاس لتطور بيولوجي أو رغبة للبقاء.",
            "لكن الضمير الإنساني يشعر بإلزام حقيقي وموضوعي للخير والعدل بغض النظر عن المنفعة الشخصية.",
            "من أين جاءت هذه الإلزامات الأخلاقية في كون مادي أصم لا يعرف خيراً ولا شراً؟",
            "إن الإقرار بوجود قيم أخلاقية موضوعية ومطلقة يستلزم بالضرورة مصدراً إلهاً عليماً آمراً وناهياً.",
            "الباب السادس: قضايا النبوات والرسالات وحاجة البشرية الملحة إليها.",
            "العقل البشري مع أهميته وقدراته محدود، ولا يمكنه إدراك تفاصيل الغيب والتشريعات وحدها.",
            "من هنا جاءت الحكمة الإلهية بإرسال الأنبياء والرسل لهداية البشر وإخراجهم من الظلمات إلى النور.",
            "الرسالات السماوية تلبي أشواق الروح البشرية وتقدم الأجوبة الشافية عن الأسئلة الكبرى.",
            "الباب السابع: الرد على الشبهات التاريخية والاستشراقية حول النصوص.",
            "حاول بعض المستشرقين التشكيك في سلامة النصوص المقدسة وسيرة الأنبياء عبر التاريخ.",
            "وقد سقطت هذه الشبهات أمام المناهج العلمية الدقيقة في التوثيق والحفظ والاستفاضة.",
            "حفظ القرآن الكريم بنصه وحروفه على مدى الأجيال عبر التواتر القاطع معجزة خالصة.",
            "الباب الثامن: حجية القرآن الكريم وإعجازه العلمي والتشريعي والبياني.",
            "تحدى القرآن الكريم الإنس والجن أن يأتوا بمثل سورة منه فعجزوا ولن يزالوا عاجزين.",
            "إعجازه البياني والتشريعي والعلمي يشهد بأنه كلام رب العالمين المنزل على نبيه الأمين.",
            "الباب التاسع: براهين النبوة المحمدية ودلائل الصدق في سيرته العطرة.",
            "سيرة النبي صلى الله عليه وسلم وأخلاقه العالية وبشائر الأنبياء السابقين به أدلة ساطعة على نبوته.",
            "الباب العاشر: خلاصات ومنهجية الرد السليم على الشبهات المعاصرة.",
            "التعامل مع الشبهات يحتاج إلى علم وحلم وأناة وتفكيك هادئ لمفاصل الإشكال لا الانفعال.",
            "الباب الحادي عشر: الخاتمة والآفاق المستقبلية لليقين الإيماني الراسخ.",
            "يبقى الإيمان الحق هو الحصن الحصين والمنارة المضيئة التي تهدى النفوس في دياجير الفتن."
        ];

        let filteredParagraphs = allParagraphs;
        let currentPage = 0;
        const pageSize = 5;
        let currentQuery = "";

        function init() {
            try {
                filteredParagraphs = allParagraphs;
                buildPageSelect();
                renderPage();
            } catch (err) {
                document.getElementById('reader-card').innerHTML = '<p class="text-red-500 text-center">خطأ في تحميل ملف البيانات.</p>';
            }
        }

        function buildPageSelect() {
            const select = document.getElementById('page-select');
            select.innerHTML = '';
            const totalPages = Math.ceil(filteredParagraphs.length / pageSize);
            const lang = document.getElementById('lang-select').value;
            for (let i = 0; i < totalPages; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                if (lang === 'es') opt.textContent = `Página ${i + 1} de ${totalPages}`;
                else if (lang === 'en') opt.textContent = `Page ${i + 1} of ${totalPages}`;
                else if (lang === 'fr') opt.textContent = `Page ${i + 1} sur ${totalPages}`;
                else opt.textContent = `الصفحة ${i + 1} من ${totalPages}`;
                select.appendChild(opt);
            }
            const totalText = (lang === 'es') ? `Total párrafos: ${filteredParagraphs.length}` :
                              (lang === 'en') ? `Total paragraphs: ${filteredParagraphs.length}` :
                              (lang === 'fr') ? `Total paragraphes: ${filteredParagraphs.length}` :
                              `إجمالي الفقرات: ${filteredParagraphs.length}`;
            document.getElementById('total-info').textContent = totalText;
        }

        async function translateText(text, targetLang) {
            if (targetLang === 'ar') return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=${targetLang}&dt=t&q=` + encodeURIComponent(text));
                const json = await res.json();
                return json[0].map(item => item[0]).join('');
            } catch (e) {
                return text;
            }
        }

        async function renderPage() {
            const card = document.getElementById('reader-card');
            card.innerHTML = '<p class="text-center text-amber-500 animate-pulse">جاري تحميل وتجهيز الصفحة...</p>';
            const start = currentPage * pageSize;
            const end = Math.min(start + pageSize, filteredParagraphs.length);
            const slice = filteredParagraphs.slice(start, end);
            const lang = document.getElementById('lang-select').value;

            if (slice.length === 0) {
                card.innerHTML = '<p class="text-center text-zinc-500 py-8">لا توجد resultados مطابقة للبحث.</p>';
                return;
            }
            card.innerHTML = '';
            for (let idx = 0; idx < slice.length; idx++) {
                let text = slice[idx];
                const absoluteIndex = start + idx + 1;
                if (lang !== 'ar') {
                    text = await translateText(text, lang);
                }
                const p = document.createElement('p');
                p.className = "leading-relaxed text-sm md:text-base border-b border-emerald-900/20 dark:border-emerald-800/40 pb-4 last:border-b-0";
                if (currentQuery) {
                    const regex = new RegExp('(' + currentQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                    p.innerHTML = `<span class="text-xs text-amber-500 font-mono ml-2">[${absoluteIndex}]</span> ` + text.replace(regex, '<span class="highlight">$1</span>');
                } else {
                    p.innerHTML = `<span class="text-xs text-amber-500/70 font-mono ml-2">[${absoluteIndex}]</span> ` + text;
                }
                card.appendChild(p);
            }
            document.getElementById('page-select').value = currentPage;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(pageIndex) {
            const totalPages = Math.ceil(filteredParagraphs.length / pageSize);
            if (pageIndex < 0 || pageIndex >= totalPages) return;
            currentPage = pageIndex;
            renderPage();
        }

        function toggleIndexPanel() {
            const grid = document.getElementById('doors-grid');
            const arrow = document.getElementById('index-arrow');
            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                grid.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function jumpToDoor(paragraphIndex) {
            const targetPage = Math.floor(parseInt(paragraphIndex) / pageSize);
            changePage(targetPage);
            document.getElementById('doors-grid').classList.add('hidden');
            document.getElementById('index-arrow').style.transform = 'rotate(0deg)';
        }

        function handleSearch(query) {
            currentQuery = query.trim();
            const lang = document.getElementById('lang-select').value;
            if (!currentQuery) {
                filteredParagraphs = allParagraphs;
                document.getElementById('search-stats').textContent = '';
            } else {
                filteredParagraphs = allParagraphs.filter(p => p.includes(currentQuery));
                if (lang === 'es') document.getElementById('search-stats').textContent = `Se encontraron ${filteredParagraphs.length} resultados para "${currentQuery}"`;
                else if (lang === 'en') document.getElementById('search-stats').textContent = `Found ${filteredParagraphs.length} results for "${currentQuery}"`;
                else if (lang === 'fr') document.getElementById('search-stats').textContent = `${filteredParagraphs.length} résultats trouvés pour "${currentQuery}"`;
                else document.getElementById('search-stats').textContent = `تم العثور على ${filteredParagraphs.length} نتيجة مطابقة لـ "${currentQuery}"`;
            }
            currentPage = 0;
            buildPageSelect();
            renderPage();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch('');
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.textContent = '🌙';
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.textContent = '☀️';
            }
        }

        function changeLanguage(lang) {
            const html = document.getElementById('html-root');
            html.lang = lang;
            html.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            if (lang === 'es') {
                document.getElementById('app-title').textContent = "Enciclopedia Basair";
                document.getElementById('app-subtitle').textContent = "Plataforma digital avanzada";
                document.getElementById('label-doors').textContent = "Índice de puertas y ejes (11 puertas):";
                document.getElementById('search-input').placeholder = "Buscar en la enciclopedia...";
                document.getElementById('btn-clear').textContent = "Limpiar";
                document.getElementById('btn-prev').textContent = "← Anterior";
                document.getElementById('btn-next').textContent = "Siguiente →";
                document.getElementById('footer-text').textContent = "Enciclopedia digital Basair — Lectura fluida sin conexión";
            } else if (lang === 'en') {
                document.getElementById('app-title').textContent = "Basair Encyclopedia";
                document.getElementById('app-subtitle').textContent = "Advanced Digital Platform";
                document.getElementById('label-doors').textContent = "Index of Doors & Chapters (11 doors):";
                document.getElementById('search-input').placeholder = "Search in encyclopedia...";
                document.getElementById('btn-clear').textContent = "Clear";
                document.getElementById('btn-prev').textContent = "← Prev";
                document.getElementById('btn-next').textContent = "Next →";
                document.getElementById('footer-text').textContent = "Basair Digital Encyclopedia — Offline comfortable reading";
            } else if (lang === 'fr') {
                document.getElementById('app-title').textContent = "Encyclopédie Basair";
                document.getElementById('app-subtitle').textContent = "Plateforme numérique avancée";
                document.getElementById('label-doors').textContent = "Index des portes et chapitres (11 portes) :";
                document.getElementById('search-input').placeholder = "Rechercher dans l'encyclopédie...";
                document.getElementById('btn-clear').textContent = "Effacer";
                document.getElementById('btn-prev').textContent = "← Précédent";
                document.getElementById('btn-next').textContent = "Suivant →";
                document.getElementById('footer-text').textContent = "Encyclopédie numérique Basair — Lecture hors-ligne confortable";
            } else {
                document.getElementById('app-title').textContent = "موسوعة بصائر";
                document.getElementById('app-subtitle').textContent = "المنصة الرقمية المتقدمة";
                document.getElementById('label-doors').textContent = "فهرس الأبواب والمحاور (11 باباً)";
                document.getElementById('search-input').placeholder = "ابحث في الموسوعة (كلمة أو رقم)...";
                document.getElementById('btn-clear').textContent = "مسح";
                document.getElementById('btn-prev').textContent = "السابق ←";
                document.getElementById('btn-next').textContent = "→ التالي";
                document.getElementById('footer-text').textContent = "موسوعة بصائر الرقمية — قراءة مريحة بدون انترنت";
            }
            buildPageSelect();
            renderPage();
        }

        init();
    </script>
</body>
</html>
