<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بصائر | موسوعة نقد الإلحاد</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .arabic-serif { font-family: 'Amiri', serif; }
        .chapter-card { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        .chapter-card:active { transform: scale(0.98); }
        .chapter-card:focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
        .chapter-modal-overlay { animation: fadeIn .15s ease-out; }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-black">
    <!-- Header -->
    <header class="border-b border-zinc-800 bg-zinc-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-lg arabic-serif">ب</div>
                <div>
                    <h1 id="brand-title" class="text-base font-bold text-amber-400 tracking-wide">بصائر</h1>
                    <p id="brand-subtitle" class="text-[11px] text-zinc-400">موسوعة نقد الإلحاد وبناء اليقين</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <!-- Language Selector with Flags/Icons -->
                <div class="relative flex items-center bg-zinc-800/90 border border-zinc-700/80 rounded-xl px-2.5 py-1.5 focus-within:border-amber-500">
                    <span class="text-xs text-amber-400 mr-1.5 font-bold">🌐</span>
                    <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-transparent text-zinc-200 text-xs focus:outline-none cursor-pointer">
                        <option value="ar" class="bg-zinc-900">العربية (Arabic)</option>
                        <option value="en" class="bg-zinc-900">English</option>
                        <option value="fr" class="bg-zinc-900">Français</option>
                        <option value="es" class="bg-zinc-900">Español</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Hero Section / Search Bar -->
        <div class="mb-8 text-center space-y-3">
            <h2 id="hero-heading" class="text-2xl sm:text-3xl font-extrabold text-zinc-100 tracking-tight">استكشف الأقسام العلمية والأبواب التوثيقية</h2>
            <p id="hero-desc" class="text-sm text-zinc-400 max-w-xl mx-auto">فهارس معيارية دقيقة تدمج البراهين العقلية والنقلية للرد على الشبهات وبناء اليقين.</p>
            <div class="pt-2 max-w-2xl mx-auto">
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-zinc-500">🔍</span>
                    <input type="text" id="search-input" oninput="filterSections(this.value)" placeholder="ابحث في الأقسام، الأبواب، والمواضيع..." class="w-full bg-zinc-900/80 border border-zinc-800 rounded-2xl pr-11 pl-4 py-3.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all shadow-inner">
                </div>
            </div>
        </div>

        <!-- Sections Dynamic Container -->
        <div id="sections-container" class="space-y-8"></div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800/80 bg-zinc-900/40 py-6 mt-12 text-center text-xs text-zinc-500">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <p>© 2026 بصائر - المنصة الرقمية الهيكلية المعيارية.</p>
            <div class="flex items-center gap-4 text-zinc-400">
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> PWA Ready</span>
                <span>Unicode UTF-8</span>
            </div>
        </div>
    </footer>

    <!-- App Engine Script -->
    <script src="content-i18n.js"></script>
    <script>
        let currentLang = localStorage.getItem('basair_lang') || 'ar';
        document.getElementById('lang-select').value = currentLang;

        function escapeHtmlAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function openChapter(sectionIdx, chapterIdx) {
          const lang = (typeof currentLang === 'string' && currentLang) || 'ar';
          const data = siteData[lang] || siteData['ar'];
          const section = data && data.sections && data.sections[sectionIdx];
          if (!section) return;
          const chapter = section.chapters && section.chapters[chapterIdx];
          if (!chapter) return;

          const overlay = document.createElement('div');
          overlay.className = 'chapter-modal-overlay fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4';
          overlay.setAttribute('role', 'dialog');
          overlay.setAttribute('aria-modal', 'true');
          overlay.setAttribute('aria-labelledby', 'chapter-modal-title');

          const panel = document.createElement('div');
          panel.className = 'bg-zinc-900 border border-zinc-700 rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6 space-y-4 shadow-2xl';

          const header = document.createElement('div');
          header.className = 'flex items-center justify-between gap-3';

          const titleEl = document.createElement('h2');
          titleEl.id = 'chapter-modal-title';
          titleEl.className = 'text-amber-400 text-xl font-bold arabic-serif';
          titleEl.textContent = chapter.title || '';

          const closeBtn = document.createElement('button');
          closeBtn.className = 'text-zinc-400 hover:text-zinc-100 text-2xl leading-none px-2';
          closeBtn.setAttribute('aria-label', 'إغلاق');
          closeBtn.textContent = '×';

          header.appendChild(titleEl);
          header.appendChild(closeBtn);
          panel.appendChild(header);

          if (section.title) {
            const s = document.createElement('p');
            s.className = 'text-xs text-zinc-500';
            s.textContent = section.title;
            panel.appendChild(s);
          }
          if (chapter.desc) {
            const d = document.createElement('p');
            d.className = 'text-sm text-zinc-300 leading-relaxed';
            d.textContent = chapter.desc;
            panel.appendChild(d);
          }

          function renderFallback() {
            const wrap = document.createElement('div');
            wrap.className = 'text-center py-8 space-y-3';
            const m = document.createElement('p');
            m.className = 'text-zinc-200 text-base';
            m.textContent = 'المحتوى الكامل لهذا الفصل قيد الإعداد. تابعنا قريبًا.';
            wrap.appendChild(m);
            if (chapter.count) {
              const cnt = document.createElement('p');
              cnt.className = 'text-xs text-zinc-500';
              cnt.textContent = 'عدد الفقرات: ' + chapter.count;
              wrap.appendChild(cnt);
            }
            panel.appendChild(wrap);
          }

          if (typeof chapter.content === 'string' && chapter.content.trim()) {
            const body = document.createElement('div');
            body.className = 'space-y-3 text-zinc-200 leading-relaxed text-base';
            chapter.content.split(/\n{2,}/).map(x => x.trim()).filter(Boolean).forEach(par => {
              const p = document.createElement('p');
              p.className = 'text-justify';
              p.textContent = par;
              body.appendChild(p);
            });
            panel.appendChild(body);
          } else if (Array.isArray(chapter.content) && chapter.content.length) {
            const body = document.createElement('div');
            body.className = 'space-y-3 text-zinc-200 leading-relaxed text-base';
            chapter.content.forEach(par => {
              if (typeof par !== 'string') return;
              const p = document.createElement('p');
              p.className = 'text-justify';
              p.textContent = par.trim();
              if (p.textContent) body.appendChild(p);
            });
            if (body.childNodes.length) panel.appendChild(body);
            else renderFallback();
          } else if (typeof chapter.url === 'string' && chapter.url.trim()) {
            const wrap = document.createElement('div');
            wrap.className = 'text-center py-6';
            const a = document.createElement('a');
            a.href = chapter.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'inline-block px-6 py-3 rounded-xl bg-amber-500 text-zinc-900 font-bold hover:bg-amber-400 transition';
            a.textContent = 'فتح الفصل';
            wrap.appendChild(a);
            panel.appendChild(wrap);
          } else {
            renderFallback();
          }

          overlay.appendChild(panel);
          document.body.appendChild(overlay);
          document.body.style.overflow = 'hidden';

          function onKey(e) { if (e.key === 'Escape') closeModal(); }
          function closeModal() {
            document.body.style.overflow = '';
            document.removeEventListener('keydown', onKey);
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
          }
          closeBtn.addEventListener('click', closeModal);
          overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
          document.addEventListener('keydown', onKey);
          setTimeout(() => closeBtn.focus(), 0);
        }

        function renderApp(searchQuery = '') {
            const lang = currentLang;
            const data = siteData[lang] || siteData['ar'];
            
            // Set direction & language tags
            const root = document.getElementById('html-root');
            root.lang = lang;
            root.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            // Header & Hero Texts
            document.getElementById('brand-title').innerText = lang === 'ar' ? 'بصائر' : (lang === 'fr' ? 'Al-Basa\'ir' : 'Al-Basa\'ir');
            document.getElementById('brand-subtitle').innerText = data.subtitle;
            document.getElementById('hero-heading').innerText = lang === 'ar' ? 'استكشف الأقسام العلمية والأبواب التوثيقية' : (lang === 'en' ? 'Explore Scientific Sections & Chapters' : (lang === 'fr' ? 'Explorez les Sections et Chapitres' : 'Explore Secciones y Capítulos'));
            document.getElementById('hero-desc').innerText = data.subtitle;
            document.getElementById('search-input').placeholder = data.searchPlaceholder;

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            let hasResults = false;

            data.sections.forEach((sec, secIdx) => {
                const filteredChapters = sec.chapters.filter(ch => 
                    ch.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    ch.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    sec.sectionTitle.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (filteredChapters.length > 0) {
                    hasResults = true;
                    const secDiv = document.createElement('div');
                    secDiv.className = "bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm transition-all";
                    
                    let chaptersHtml = '';
                    filteredChapters.forEach((ch) => {
                        const originalIdx = sec.chapters.indexOf(ch);
                        if (originalIdx < 0) return;

                        chaptersHtml += `
                            <div class="chapter-card bg-zinc-900/90 border border-zinc-800/80 rounded-xl p-5 hover:border-amber-500/50 hover:bg-zinc-900 transition-all cursor-pointer group shadow-sm flex flex-col justify-between"
                                 data-section="${secIdx}"
                                 data-chapter="${originalIdx}"
                                 role="button"
                                 tabindex="0"
                                 aria-label="${escapeHtmlAttr(ch.title || '')}">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20">${escapeHtmlAttr(ch.num || '')}</span>
                                        <span class="text-[11px] bg-zinc-800 text-zinc-300 px-2.5 py-0.5 rounded-md font-medium">${escapeHtmlAttr(ch.count || '')}</span>
                                    </div>
                                    <h3 class="text-base font-bold text-zinc-100 group-hover:text-amber-400 transition-colors">${escapeHtmlAttr(ch.title || '')}</h3>
                                    <p class="text-xs text-zinc-400 mt-1.5 leading-relaxed">${escapeHtmlAttr(ch.desc || '')}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t border-zinc-800/50 flex items-center justify-between text-[11px] text-amber-500/80 font-medium">
                                    <span>${lang === 'ar' ? 'استعراض المحتوى' : (lang === 'fr' ? 'Explorer' : (lang === 'es' ? 'Explorar' : 'Explore'))}</span>
                                    <span class="transform group-hover:translate-x-1 transition-transform">${lang === 'ar' ? '←' : '→'}</span>
                                </div>
                            </div>`;
                    });

                    secDiv.innerHTML = `
                        <div class="mb-5 border-b border-zinc-800 pb-3">
                            <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                                ${sec.sectionTitle}
                            </h2>
                            <p class="text-xs text-zinc-400 mt-1">${sec.description}</p>
                        </div>
                        <div class="grid gap-4 sm:grid-cols-2">
                            ${chaptersHtml}
                        </div>
                    `;
                    container.appendChild(secDiv);
                }
            });

            if (!container.dataset.basairListener) {
                container.dataset.basairListener = '1';
                container.addEventListener('click', function (e) {
                    const card = e.target.closest('.chapter-card');
                    if (!card) return;
                    const s = parseInt(card.dataset.section, 10);
                    const c = parseInt(card.dataset.chapter, 10);
                    if (Number.isNaN(s) || Number.isNaN(c)) return;
                    openChapter(s, c);
                });
                container.addEventListener('keydown', function (e) {
                    if (e.key !== 'Enter' && e.key !== ' ') return;
                    const card = e.target.closest('.chapter-card');
                    if (!card) return;
                    e.preventDefault();
                    const s = parseInt(card.dataset.section, 10);
                    const c = parseInt(card.dataset.chapter, 10);
                    if (Number.isNaN(s) || Number.isNaN(c)) return;
                    openChapter(s, c);
                });
            }

            if (!hasResults) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-zinc-900/30 border border-zinc-800 rounded-2xl">
                        <p class="text-zinc-400 text-sm">لم يتم العثور على نتائج مطابقة لبحثك.</p>
                        <button onclick="document.getElementById('search-input').value=''; filterSections('');" class="mt-3 px-4 py-2 bg-amber-500 text-black text-xs font-bold rounded-xl hover:bg-amber-400 transition-colors">إعادة ضبط البحث</button>
                    </div>
                `;
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('basair_lang', lang);
            const query = document.getElementById('search-input').value;
            renderApp(query);
        }

        function filterSections(query) {
            renderApp(query);
        }

        // Initial render — guard so a failed data script never blanks the page
        if (typeof siteData !== 'undefined') {
            renderApp();
        } else {
            var _c = document.getElementById('sections-container');
            if (_c) _c.innerHTML = '<div class="text-center py-16 bg-zinc-900/30 border border-zinc-800 rounded-2xl"><p class="text-zinc-400 text-sm">تعذّر تحميل المحتوى. يرجى إعادة المحاولة.</p></div>';
        }
    </script>
    <script>
        // Retry the data script once if it failed (offline / transient error)
        if (typeof siteData === 'undefined') {
            var _s = document.createElement('script');
            _s.src = 'content-i18n.js';
            _s.onload = function () { if (typeof renderApp === 'function') renderApp(); };
            document.head.appendChild(_s);
        }
        // Register the offline worker so content-i18n.js is cached for offline use
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
            });
        }
    </script>
</body>
</html>
