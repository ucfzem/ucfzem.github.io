                total: function (n) { return 'Total paragraphes : ' + n; },
                page: function (i, n) { return 'Page ' + i + ' sur ' + n; },
                result: function (n, q) { return n + ' résultats trouvés pour "' + q + '"'; },
                jump: function (n) { return 'Aller au paragraphe [' + n + ']'; },
                noTranslation: '⚠️ La traduction est indisponible (hors ligne ?). Texte arabe affiché.',
                prev: '← Précédent',
                next: 'Suivant →'
            },
            es: {
                noResults: 'No hay resultados coincidentes.',
                total: function (n) { return 'Total párrafos: ' + n; },
                page: function (i, n) { return 'Página ' + i + ' de ' + n; },
                result: function (n, q) { return 'Se encontraron ' + n + ' resultados para "' + q + '"'; },
                jump: function (n) { return 'Ir al párrafo [' + n + ']'; },
                noTranslation: '⚠️ La traducción no está disponible (¿sin conexión?). Se muestra el texto árabe.',
                prev: '← Anterior',
                next: 'Siguiente →'
            }
        };

        function storeGet(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return (v === null || v === undefined) ? fallback : v;
            } catch (e) {
                return fallback;
            }
        }

        function storeSet(key, value) {
            try { localStorage.setItem(key, String(value)); } catch (e) {}
        }

        function currentLang() {
            const sel = document.getElementById('lang-select');
            const v = sel ? sel.value : 'ar';
            return (v === 'en' || v === 'fr' || v === 'es') ? v : 'ar';
        }

        function text(key) {
            return TEXT[currentLang()][key];
        }

        function normalizeArabic(str) {
            return String(str)
                .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ئ/g, 'ي')
                .replace(/ؤ/g, 'و')
                .replace(/ة/g, 'ه')
                .toLowerCase();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        const DOOR_STARTS = [];
        (function () {
            allParagraphs.forEach(function (t, i) {
                if (/^الباب\s/.test(String(t).trim())) DOOR_STARTS.push(i);
            });
        })();

        let doorEntries = [];
        let filteredIndices = allParagraphs.map(function (_, i) { return i; });
        let currentPage = 0;
        let currentQuery = '';
        let renderToken = 0;
        let pendingFocus = null;
        let searchTimer = null;
        const translationCache = new Map();

        function totalPages() {
            return Math.max(1, Math.ceil(filteredIndices.length / PAGE_SIZE));
        }

        function buildDoorEntries() {
            doorEntries = DOOR_STARTS.map(function (p, i) {
                return {
                    p: p,
                    ar: DOOR_TITLES.ar[i] || allParagraphs[p],
                    en: DOOR_TITLES.en[i] || allParagraphs[p],
                    fr: DOOR_TITLES.fr[i] || allParagraphs[p],
                    es: DOOR_TITLES.es[i] || allParagraphs[p]
                };
            });
        }

        function renderDoors(lang) {
            const grid = document.getElementById('doors-grid');
            if (!grid) return;
            const key = (lang === 'en' || lang === 'fr' || lang === 'es') ? lang : 'ar';
            grid.innerHTML = '';
            doorEntries.forEach(function (door, i) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = (key === 'ar' ? 'text-right' : 'text-left') + ' w-full text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center gap-2';
                btn.setAttribute('data-door', String(i));
                const label = document.createElement('span');
                label.textContent = door[key] || door.ar;
                const num = document.createElement('span');
                num.className = 'text-amber-400 font-mono text-[10px]';
                num.textContent = String(i + 1).padStart(2, '0');
                btn.appendChild(label);
                btn.appendChild(num);
                btn.addEventListener('click', function () { jumpToDoor(i); });
                grid.appendChild(btn);
            });
        }

        function toggleIndexPanel() {
            const grid = document.getElementById('doors-grid');
            const arrow = document.getElementById('index-arrow');
            if (!grid) return;
            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                if (arrow) arrow.style.transform = 'rotate(180deg)';
            } else {
                grid.classList.add('hidden');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            }
        }

        function closeDoors() {
            const grid = document.getElementById('doors-grid');
            const arrow = document.getElementById('index-arrow');
            if (grid) grid.classList.add('hidden');
            if (arrow) arrow.style.transform = 'rotate(0deg)';
        }

        function fillParagraph(el, rawText, number) {
            let safe = escapeHtml(rawText);
            const q = currentQuery;
            if (q && !/^\d+$/.test(q) && String(rawText).toLowerCase().indexOf(q.toLowerCase()) !== -1) {
                const pattern = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                try {
                    safe = safe.replace(new RegExp('(' + escapeHtml(pattern) + ')', 'gi'), '<span class="highlight">$1</span>');
                } catch (e) {}
            }
            el.innerHTML = '<span class="text-xs text-amber-500/70 font-mono ml-2">[' + number + ']</span> ' + safe;
        }

        async function translateText(text, lang) {
            const cacheKey = lang + '|' + text;
            if (translationCache.has(cacheKey)) return translationCache.get(cacheKey);
            const controller = new AbortController();
            const timer = setTimeout(function () { controller.abort(); }, 6000);
            try {
                const res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=' + lang + '&dt=t&q=' + encodeURIComponent(text), { signal: controller.signal });
                if (!res || !res.ok) throw new Error('bad response');
                const json = await res.json();
                const out = json[0].map(function (item) { return item[0]; }).join('');
                translationCache.set(cacheKey, out);
                return out;
            } catch (e) {
                return null;
            } finally {
                clearTimeout(timer);
            }
        }

        function updatePageSelector() {
            const lang = currentLang();
            const select = document.getElementById('page-select');
            const total = totalPages();
            if (select) {
                select.innerHTML = '';
                for (let i = 0; i < total; i++) {
                    const opt = document.createElement('option');
                    opt.value = String(i);
                    opt.textContent = TEXT[lang].page(i + 1, total);
                    select.appendChild(opt);
                }
                select.value = String(Math.min(currentPage, total - 1));
            }
            const totalInfo = document.getElementById('total-info');
            if (totalInfo) totalInfo.textContent = TEXT[lang].total(filteredIndices.length);
            const prev = document.getElementById('btn-prev');
            const next = document.getElementById('btn-next');
            if (prev) prev.disabled = currentPage <= 0;
            if (next) next.disabled = currentPage >= total - 1;
        }

        function focusParagraph(realIndex) {
            const card = document.getElementById('reader-card');
            if (!card) return;
            const el = card.querySelector('[data-p="' + realIndex + '"]');
            if (!el) { window.scrollTo(0, 0); return; }
            setTimeout(function () {
                try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
                el.classList.remove('flash');
                void el.offsetWidth;
                el.classList.add('flash');
                setTimeout(function () { el.classList.remove('flash'); }, 1400);
            }, 30);
        }

        async function renderPage() {
            const token = ++renderToken;
            const card = document.getElementById('reader-card');
            if (!card) return;
            const lang = currentLang();
            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filteredIndices.length);
            const indices = filteredIndices.slice(start, end);

            if (indices.length === 0) {
                card.innerHTML = '<p class="text-center text-zinc-500 py-8">' + escapeHtml(TEXT[lang].noResults) + '</p>';
                updatePageSelector();
                return;
            }

            const localTable = (lang !== 'ar' && window.BASAIR_TRANSLATIONS && window.BASAIR_TRANSLATIONS[lang]) ? window.BASAIR_TRANSLATIONS[lang] : null;
            const jobs = [];

            card.innerHTML = '';
            indices.forEach(function (realIndex) {
                const original = allParagraphs[realIndex];
                const el = document.createElement('p');
                el.className = 'leading-relaxed border-b border-emerald-900/20 dark:border-emerald-800/40 pb-4 last:border-b-0';
                el.setAttribute('data-p', String(realIndex));
                let shown = original;
                let hasLocal = false;
                if (lang !== 'ar' && localTable && localTable[realIndex]) {
                    shown = localTable[realIndex];
                    hasLocal = true;
                }
                fillParagraph(el, shown, realIndex + 1);
                card.appendChild(el);
                if (lang !== 'ar' && !hasLocal) {
                    jobs.push({ el: el, original: original, number: realIndex + 1 });
                }
            });

            updatePageSelector();

            if (pendingFocus !== null) {
                const target = pendingFocus;
                pendingFocus = null;
                focusParagraph(target);
            } else {
                window.scrollTo(0, 0);
            }

            if (jobs.length) {
                const results = await Promise.all(jobs.map(function (job) {
                    return translateText(job.original, lang).then(function (translated) {
                        return { job: job, translated: translated };
                    });
                }));
                if (token !== renderToken) return;
                let failed = false;
                results.forEach(function (r) {
                    if (r.translated && document.body.contains(r.job.el)) {
                        fillParagraph(r.job.el, r.translated, r.job.number);
                    } else if (!r.translated) {
                        failed = true;
                    }
                });
                if (failed && token === renderToken) {
                    const notice = document.createElement('p');
                    notice.className = 'text-xs text-amber-400 bg-amber-500/10 border border-amber-600/30 rounded-lg p-2 mb-2';
                    notice.textContent = TEXT[lang].noTranslation;
                    card.insertBefore(notice, card.firstChild);
                }
            }
        }

        function changePage(pageIndex) {
            if (pageIndex < 0 || pageIndex >= totalPages()) return;
            currentPage = pageIndex;
            storeSet(STORE.page, currentPage);
            renderPage();
        }

        function jumpToDoor(doorIdx) {
            const door = doorEntries[doorIdx];
            if (!door) return;
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            currentQuery = '';
            document.getElementById('search-stats').textContent = '';
            filteredIndices = allParagraphs.map(function (_, i) { return i; });
            currentPage = Math.floor(door.p / PAGE_SIZE);
            pendingFocus = door.p;
            storeSet(STORE.page, currentPage);
            closeDoors();
            renderPage();
        }

        function buildSearchStats(count, query) {
            const lang = currentLang();
            const stats = document.getElementById('search-stats');
            if (stats) stats.textContent = TEXT[lang].result(count, query);
        }

        function applySearch(rawQuery) {
            const lang = currentLang();
            currentQuery = String(rawQuery).trim();
            const stats = document.getElementById('search-stats');

            if (!currentQuery) {
                filteredIndices = allParagraphs.map(function (_, i) { return i; });
                if (stats) stats.textContent = '';
                currentPage = 0;
                updatePageSelector();
                renderPage();
                return;
            }

            if (/^\d+$/.test(currentQuery)) {
                const n = parseInt(currentQuery, 10);
                if (n >= 1 && n <= allParagraphs.length) {
                    filteredIndices = allParagraphs.map(function (_, i) { return i; });
                    currentPage = Math.floor((n - 1) / PAGE_SIZE);
                    pendingFocus = n - 1;
                    if (stats) stats.textContent = TEXT[lang].jump(n);
                    storeSet(STORE.page, currentPage);
                    updatePageSelector();
                    renderPage();
                    return;
                }
                filteredIndices = [];
                if (stats) stats.textContent = TEXT[lang].noResults;
                currentPage = 0;
                updatePageSelector();
                renderPage();
                return;
            }

            const needle = normalizeArabic(currentQuery);
            const localTable = (lang !== 'ar' && window.BASAIR_TRANSLATIONS && window.BASAIR_TRANSLATIONS[lang]) ? window.BASAIR_TRANSLATIONS[lang] : null;
            filteredIndices = allParagraphs.map(function (_, i) { return i; }).filter(function (i) {
                if (normalizeArabic(allParagraphs[i]).indexOf(needle) !== -1) return true;
                if (localTable && localTable[i] && normalizeArabic(localTable[i]).indexOf(needle) !== -1) return true;
                return false;
            });

            buildSearchStats(filteredIndices.length, currentQuery);
            currentPage = 0;
            storeSet(STORE.page, 0);
            updatePageSelector();
            renderPage();
        }

        function onSearchInput(value) {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(function () { applySearch(value); }, 250);
        }

        function handleSearch(value) {
            if (searchTimer) clearTimeout(searchTimer);
            applySearch(value);
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            applySearch('');
        }

        function applyTheme(theme) {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (theme === 'light') {
                body.classList.remove('dark');
                body.classList.add('light');
                if (icon) icon.textContent = '🌙';
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                if (icon) icon.textContent = '☀️';
            }
        }

        function toggleTheme() {
            const next = document.body.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(next);
            storeSet(STORE.theme, next);
        }

        function applyFontSize(px) {
            px = Math.max(12, Math.min(32, parseInt(px, 10) || 16));
            document.documentElement.style.setProperty('--reader-font-size', px + 'px');
            storeSet(STORE.font, px);
            const label = document.getElementById('font-size-label');
            if (label) label.textContent = px;
        }

        function changeFontSize(step) {
            let px = 16;
            try { px = parseInt(storeGet(STORE.font, '16'), 10) || 16; } catch (e) { px = 16; }
            applyFontSize(px + step);
        }

        function resetFontSize() {
            applyFontSize(16);
        }

        function changeLanguage(lang) {
            const key = (lang === 'en' || lang === 'fr' || lang === 'es') ? lang : 'ar';
            storeSet(STORE.lang, key);
            const langSelect = document.getElementById('lang-select');
            if (langSelect) langSelect.value = key;
            const html = document.getElementById('html-root');
            html.lang = key;
            html.dir = (key === 'ar') ? 'rtl' : 'ltr';

            if (key === 'es') {
                document.getElementById('app-title').textContent = "Enciclopedia Basair";
                document.getElementById('app-subtitle').textContent = "Plataforma digital avanzada";
                document.getElementById('label-doors').textContent = "Índice de puertas y ejes (11 puertas):";
                document.getElementById('search-input').placeholder = "Buscar en la enciclopedia...";
                document.getElementById('btn-clear').textContent = "Limpiar";
                document.getElementById('footer-text').textContent = "Enciclopedia digital Basair — Lectura fluida sin conexión";
            } else if (key === 'en') {
                document.getElementById('app-title').textContent = "Basair Encyclopedia";
                document.getElementById('app-subtitle').textContent = "Advanced Digital Platform";
                document.getElementById('label-doors').textContent = "Index of Doors & Chapters (11 doors):";
                document.getElementById('search-input').placeholder = "Search in encyclopedia...";
                document.getElementById('btn-clear').textContent = "Clear";
                document.getElementById('footer-text').textContent = "Basair Digital Encyclopedia — Offline comfortable reading";
            } else if (key === 'fr') {
                document.getElementById('app-title').textContent = "Encyclopédie Basair";
                document.getElementById('app-subtitle').textContent = "Plateforme numérique avancée";
                document.getElementById('label-doors').textContent = "Index des portes et chapitres (11 portes) :";
                document.getElementById('search-input').placeholder = "Rechercher dans l'encyclopédie...";
                document.getElementById('btn-clear').textContent = "Effacer";
                document.getElementById('footer-text').textContent = "Encyclopédie numérique Basair — Lecture hors-ligne confortable";
            } else {
                document.getElementById('app-title').textContent = "موسوعة بصائر";
                document.getElementById('app-subtitle').textContent = "المنصة الرقمية المتقدمة";
                document.getElementById('label-doors').textContent = "فهرس الأبواب والمحاور (11 باباً)";
                document.getElementById('search-input').placeholder = "ابحث في الموسوعة (كلمة أو رقم)...";
                document.getElementById('btn-clear').textContent = "مسح";
                document.getElementById('footer-text').textContent = "موسوعة بصائر الرقمية — قراءة مريحة بدون انترنت";
            }

            const prev = document.getElementById('btn-prev');
            const next = document.getElementById('btn-next');
            if (prev) prev.textContent = TEXT[key].prev;
            if (next) next.textContent = TEXT[key].next;

            renderDoors(key);
            updatePageSelector();
            renderPage();
        }

        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
            const rtl = document.documentElement.dir === 'rtl';
            const key = e.key;
            if (key === 'ArrowRight') { changePage(currentPage + (rtl ? -1 : 1)); e.preventDefault(); }
            else if (key === 'ArrowLeft') { changePage(currentPage + (rtl ? 1 : -1)); e.preventDefault(); }
            else if (key === '+' || key === '=') { changeFontSize(1); e.preventDefault(); }
            else if (key === '-' || key === '_') { changeFontSize(-1); e.preventDefault(); }
            else if (key === '0') { resetFontSize(); e.preventDefault(); }
            else if (key === '/') { const s = document.getElementById('search-input'); if (s) { s.focus(); e.preventDefault(); } }
            else if (key.toLowerCase() === 't') { toggleTheme(); }
            else if (key.toLowerCase() === 'd') { toggleIndexPanel(); }
        });

        function init() {
            try {
                buildDoorEntries();
                filteredIndices = allParagraphs.map(function (_, i) { return i; });
                currentQuery = '';
                applyTheme(storeGet(STORE.theme, 'dark'));
                applyFontSize(storeGet(STORE.font, '16'));
                const savedLang = storeGet(STORE.lang, 'ar');
                const langSelect = document.getElementById('lang-select');
                if (langSelect) langSelect.value = savedLang;
                const savedPage = parseInt(storeGet(STORE.page, '0'), 10) || 0;
                currentPage = Math.min(Math.max(0, savedPage), totalPages() - 1);
                changeLanguage(savedLang);
            } catch (err) {
                const card = document.getElementById('reader-card');
                if (card) card.innerHTML = '<p class="text-red-500 text-center">خطأ في تحميل ملف البيانات.</p>';
            }
        }

        init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js?v=10', { updateViaCache: 'none' }).then(function (reg) {
                    if (reg && reg.update) reg.update().catch(function () {});
                }).catch(function () {});
                var swReloaded = false;
                navigator.serviceWorker.addEventListener('controllerchange', function () {
                    if (swReloaded) return;
                    swReloaded = true;
                    try {
                        if (!sessionStorage.getItem('basair-sw-reloaded-v10')) {
                            sessionStorage.setItem('basair-sw-reloaded-v10', '1');
                            location.reload();
                        }
                    } catch (e) {}
                });
            });
        }

    </script>
</body>
