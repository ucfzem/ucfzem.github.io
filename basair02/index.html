    <style>
        .ui-font { font-family: 'Tajawal', sans-serif; }
        .highlight { background-color: rgba(217, 119, 6, 0.35); color: inherit; padding: 0 4px; border-radius: 4px; font-weight: bold; }
        body.dark { background-color: #0c1512; color: #e2e8f0; }
        body.light { background-color: #f4f6f4; color: #1e293b; }
        .nuzhat-header { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); border-bottom: 2px solid #b45309; }
        .theme-card { background-color: var(--card-bg); border-color: var(--card-border); }
        body.dark { --card-bg: rgba(13, 27, 22, 0.85); --card-border: #134e4a; --input-bg: #061a14; --input-border: #115e59; }
        body.light { --card-bg: #ffffff; --card-border: #cbd5e1; --input-bg: #f8fafc; --input-border: #94a3b8; }
        :root { --reader-font-size: 16px; }
        #reader-card { font-size: var(--reader-font-size); transition: font-size .2s ease; }
        #reader-card p { font-size: inherit; }
        .fs-btn {
            background: #064e3b; border: 1px solid #065f46; border-radius: .5rem;
            padding: .15rem .4rem; font-size: .72rem; line-height: 1.2;
            color: #fcd34d; cursor: pointer; font-family: inherit;
        }
        .fs-btn:hover { background: #065f46; }
        :focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; border-radius: 8px; }
    </style>
</head>
<body class="dark ui-font transition-all duration-300 min-h-screen flex flex-col" style="--card-bg: rgba(13, 27, 22, 0.85); --card-border: #134e4a;">
    <header class="nuzhat-header text-white px-2 sm:px-4 py-2 sticky top-0 z-50 shadow-lg flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
        <div class="flex items-center gap-2 min-w-0">
            <span class="text-xl leading-none">📖</span>
            <div class="min-w-0">
                <h1 id="app-title" class="font-bold text-sm sm:text-base text-amber-300 truncate leading-tight">موسوعة بصائر</h1>
                <p id="app-subtitle" class="text-[9px] sm:text-[10px] text-emerald-200 opacity-80 truncate leading-tight">المنصة الرقمية المتقدمة</p>
            </div>
        </div>
        <div class="flex items-center gap-1 flex-wrap justify-end">
            <select id="lang-select" autocomplete="off" onchange="changeLanguage(this.value)" class="bg-emerald-950/80 text-amber-200 border border-emerald-700 rounded-lg px-1.5 py-1 text-[11px] focus:outline-none cursor-pointer">
                <option value="ar">🇲🇦 العربية</option>
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="es">🇪🇸 Español</option>
            </select>
            <div class="flex items-center gap-0.5" role="group" aria-label="حجم الخط">
                <button type="button" onclick="changeFontSize(-1)" class="fs-btn" title="تصغير الخط (A-)" aria-label="تصغير الخط">A−</button>
                <button type="button" onclick="resetFontSize()" class="fs-btn" title="حجم افتراضي (A)" aria-label="حجم الخط الافتراضي">A</button>
                <button type="button" onclick="changeFontSize(1)" class="fs-btn" title="تكبير الخط (A+)" aria-label="تكبير الخط">A+</button>
                <span id="font-size-label" class="text-[9px] text-emerald-200 font-mono w-6 text-center">16</span>
            </div>
            <button onclick="toggleTheme()" class="p-1.5 rounded-lg bg-emerald-900 hover:bg-emerald-800 text-xs transition-colors border border-emerald-700 shadow" title="تبديل المظهر">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-2 sm:p-4 space-y-2 sm:space-y-4">
        <div class="theme-card border rounded-xl p-4 shadow-md backdrop-blur">
            <div class="flex justify-between items-center cursor-pointer mb-2" onclick="toggleIndexPanel()">
                <div class="flex items-center gap-2">
                    <span class="text-amber-500 text-base">🚪</span>
                    <h2 id="label-doors" class="text-xs text-amber-400 font-bold">فهرس الأبواب والمحاور (11 باباً)</h2>
                </div>
                <span id="index-arrow" class="text-xs text-amber-500 font-bold transition-transform duration-300">▼</span>
            </div>
            <div id="doors-grid" class="hidden grid grid-cols-1 gap-2 mt-3 pt-3 border-t border-emerald-900/30 max-h-64 overflow-y-auto">
            </div>
        </div>

        <div class="theme-card border rounded-xl p-3 shadow-md">
            <div class="flex gap-2">
                <input type="text" id="search-input" autocomplete="off" placeholder="ابحث في الموسوعة (كلمة أو رقم)..." oninput="handleSearch(this.value)" class="flex-1 bg-[var(--input-bg)] border border-[var(--input-border)] rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                <button id="btn-clear" onclick="clearSearch()" class="bg-emerald-900 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs transition-colors">مسح</button>
            </div>
            <div id="search-stats" class="text-xs text-amber-400 mt-2 px-1 font-mono"></div>
        </div>

        <div class="theme-card border rounded-xl p-3 shadow-md flex justify-between items-center gap-3">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button id="btn-prev" onclick="changePage(currentPage - 1)" class="bg-emerald-900 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs transition-colors">السابق ←</button>
                <select id="page-select" autocomplete="off" onchange="changePage(parseInt(this.value))" class="flex-1 sm:flex-none bg-[var(--input-bg)] border border-[var(--input-border)] rounded-lg px-3 py-1.5 text-xs text-center focus:outline-none"></select>
                <button id="btn-next" onclick="changePage(currentPage + 1)" class="bg-emerald-900 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs transition-colors">→ التالي</button>
            </div>
            <div id="total-info" class="text-xs text-amber-500 font-mono"></div>
        </div>

        <div id="reader-card" class="theme-card border rounded-2xl p-4 sm:p-6 space-y-4 sm:space-y-6 shadow-xl">
            <p class="text-center text-zinc-400">جاري تحميل بيانات الموسوعة...</p>
        </div>
    </main>

    <footer class="border-t border-emerald-900/50 py-4 text-center text-xs text-emerald-600 dark:text-emerald-400/70">
        <p id="footer-text">موسوعة بصائر الرقمية — قراءة مريحة بدون انترنت</p>
        <p class="mt-1 opacity-40 font-mono text-[10px]">build v9</p>
    </footer>

    <script>
        const allParagraphs = [
            "بسم الله الرحمن الرحيم. الحمد لله رب العالمين، والصلاة والسلام على أشرف الأنبياء والمرسلين.",
            "أما بعد، فهذه بصائر ومعالم في طريق المعرفة، أضعها بين يدي القارئ الكريم لتكون دليلاً ومُرشداً.",
            "الباب الأول: مدخل دراسة الإلحاد الجديد وتفكيك مقولاته المركزية في الفكر المعاصر.",

            "تتغذى هذه الموجات على سوء فهم للفلسفة الطبيعية وتوظيف مغلوط لاكتشافات العلوم التجريبية.",
            "من أهم قواعد التناول النقدي لهذه الشبهات التفريق الدقيق بين العلم التجريبي والإيديولوجيا المادية.",
            "فالعلم يبحث في كيف تعمل الاشياء، بينما تحاول المادية الإجابة عن لماذا و من أين جاءت.",
            "إن العقل البشري مفطور على البحث عن العلنية والغاية، وغياب المعنى يورث اضطراباً نفسياً عميقاً.",
            "لذا فإن تفكيك هذه الخطابات يبدأ بتعرية التناقضات المنطقية الكامنة في أصل الطرح المادي.",
            "الباب الثاني: نقد أصول المادية العلمية وإبطال دعوى الاكتفاء الذاتي للكون.",
            "تدعي المادية أن الكون لا يحتاج إلى علة مفارقة لأنه وُجد صدفة أو نتيجة قوانين فيزيائية أزلية.",
            "غير أن الفيزياء المعاصرة نفسها أثبتت أن الكون له بداية زمنية ومكانية محددة فيما يعرف بالانفجار العظيم.",
            "وما دام الكون حادثاً ومخلوقاً في الزمان، فهو محتاج بلا ريب إلى موجد حكيم عليم خارج نطاقه.",
            "إن القوانين الطبيعية ليست سوى وصف لانتظام الأفعال وليست هي الفاعلة بذاتها أو الخالقة لغيرها.",
            "فالجاذبية أو الديناميكا الحرارية لا تفكر ولا تريد، بل هي نواميس مسخرة ومنتظمة بإحكام.",
            "القول بأن الصدفة وحدها أنشأت هذا التعقيد المذهل في الخلايا الحية يطرد العقل ويصطدم بقوانين الاحتمالات.",
            "إن تعقيد الحمض النووي (DNA) يشبه كتابة موسوعة ضخمة بلغة دقيقة جداً عن طريق رمي حروف عشوائية.",
            "وهذا محال عقلاً ورياضياً، فالحروف لا ترتب نفسها بنفسها لتشكل دلالات ومعاني محكمة.",
            "من هنا يظهر بطلان الاختزال المادي السطحي لتفسير الظواهر الواعية والنفسية المعقدة.",
            "الباب الثالث: شبهات أصل الحياة والكون والرد عليها بالبراهين العقلية.",
            "تطرح المادية الحيوية فرضية نشوء الحياة تلقائياً من مواد غير حيّة عبر تفاعلات كيميائية عشوائية.",
            "وقد أثبتت تجارب التخلق المتساقطة استحالة حدوث ذلك في ظروف طبيعية دون إرادة وتوجيه.",
            "إن الخلية الحية أبسطها مكونة من آليات معقدة متكاملة لا يمكنها العمل جزئياً أو تدريجياً.",
            "فنظريات التطور الموجه وغير الموجه عجزت عن تفسير أصل الوعي والظهور المفاجئ للشفرة الوراثية.",
            "الكون يتميز بضبط دقيق (Fine-Tuning) مذهل للثوابت الفيزيائية؛ كقوة الجاذبية والنووية.",
            "لو تغيرت هذه الثوابت بنسبة أجزاء من ترليون ترليون لما استقرت النجوم ولا قامت حياة.",
            "هذا التوافق الكوني المحكم يشهد بحدة على أن وراء هذا الخلق تصميماً هادفاً وحكمة بالغة.",
            "ولا يمكن تفسير هذا التوافق بالكون المتعدد (Multiverse) لكونه مجرد هروب نظري بلا دليل تجريبي.",
            "الباب الرابع: معضلة الوعي والخلق وإثبات مباينة الروح للمادة.",
            "يعجز التفسير المادي تماماً عن تفسير حقيقة الوعي والإدراك والتجربة الذاتية للشعور (Qualia).",
            "كيف تتحول تجمعات الذرات الصماء والجسيمات المادية إلى كائن يدرك ويفرح ويحزن ويتأمل؟",
            "المادة بطبيعتها خالية من الإدراك والمعنى، وما تفاعلات الخلايا العصبية إلا مظاهر وظائفية.",
            "الإنسان يمتلك جوهراً روحياً مفارقاً يتجاوز حدود الجسد المادي والخلايا المتجددة.",
            "هذا الوعي المستمر وثبات الهوية الشخصية رغم تغير خلايا البدن عبر السنين دليل قاطع على جوهر الروح.",
            "الباب الخامس: الأخلاق وقانون الإلزام ومأزق النسبية الأخلاقية.",
            "في العالم المادي الصرف لا توجد قيم مطلقة، بل هي مجرد انعكاس لتطور بيولوجي أو رغبة للبقاء.",
            "لكن الضمير الإنساني يشعر بإلزام حقيقي وموضوعي للخير والعدل بغض النظر عن المنفعة الشخصية.",
            "من أين جاءت هذه الإلزامات الأخلاقية في كون مادي أصم لا يعرف خيراً ولا شراً؟",
            "إن الإقرار بوجود قيم أخلاقية موضوعية ومطلقة يستلزم بالضرورة مصدراً إلهاً عليماً آمراً وناهياً.",
            "الباب السادس: قضايا النبوات والرسالات وحاجة البشرية الملحة إليها.",
            "العقل البشري مع أهميته وقدراته محدود، ولا يمكنه إدراك تفاصيل الغيب والتشريعات وحدها.",
            "من هنا جاءت الحكمة الإلهية بإرسال الأنبياء والرسل لهداية البشر وإخراجهم من الظلمات إلى النور.",
            "الرسالات السماوية تلبي أشواق الروح البشرية وتقدم الأجوبة الشافية عن الأسئلة الكبرى.",
            "الباب السابع: الرد على الشبهات التاريخية والاستشراقية حول النصوص.",
            "حاول بعض المستشرقين التشكيك في سلامة النصوص المقدسة وسيرة الأنبياء عبر التاريخ.",
            "وقد سقطت هذه الشبهات أمام المناهج العلمية الدقيقة في التوثيق والحفظ والاستفاضة.",
            "حفظ القرآن الكريم بنصه وحروفه على مدى الأجيال عبر التواتر القاطع معجزة خالصة.",
            "الباب الثامن: حجية القرآن الكريم وإعجازه العلمي والتشريعي والبياني.",
            "تحدى القرآن الكريم الإنس والجن أن يأتوا بمثل سورة منه فعجزوا ولن يزالوا عاجزين.",
            "إعجازه البياني والتشريعي والعلمي يشهد بأنه كلام رب العالمين المنزل على نبيه الأمين.",
            "الباب التاسع: براهين النبوة المحمدية ودلائل الصدق في سيرته العطرة.",
            "سيرة النبي صلى الله عليه وسلم وأخلاقه العالية وبشائر الأنبياء السابقين به أدلة ساطعة على نبوته.",
            "الباب العاشر: خلاصات ومنهجية الرد السليم على الشبهات المعاصرة.",
            "التعامل مع الشبهات يحتاج إلى علم وحلم وأناة وتفكيك هادئ لمفاصل الإشكال لا الانفعال.",
            "الباب الحادي عشر: الخاتمة والآفاق المستقبلية لليقين الإيماني الراسخ.",
            "يبقى الإيمان الحق هو الحصن الحصين والمنارة المضيئة التي تهدى النفوس في دياجير الفتن."
        ];

        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        const DOORS = [
            { p: 0,  ar: "الباب الأول: مدخل دراسة الإلحاد الجديد", en: "Part 1: Introduction to the Study of New Atheism", fr: "Partie 1 : Introduction à l'étude du nouvel athéisme", es: "Parte 1: Introducción al estudio del nuevo ateísmo" },
            { p: 2,  ar: "الباب الثاني: نقد أصول المادية العلمية", en: "Part 2: Critique of Scientific Materialism", fr: "Partie 2 : Critique du matérialisme scientifique", es: "Parte 2: Crítica del materialismo científico" },
            { p: 4,  ar: "الباب الثالث: شبهات أصل الحياة والكون", en: "Part 3: Questions on the Origin of Life and the Universe", fr: "Partie 3 : Questions sur l'origine de la vie et de l'univers", es: "Parte 3: Cuestiones sobre el origen de la vida y el universo" },
            { p: 6,  ar: "الباب الرابع: معضلة الوعي والخلق", en: "Part 4: The Problem of Consciousness and Creation", fr: "Partie 4 : Le problème de la conscience et de la création", es: "Parte 4: El problema de la conciencia y la creación" },
            { p: 8,  ar: "الباب الخامس: الأخلاق وقانون الإلزام", en: "Part 5: Morality and the Law of Obligation", fr: "Partie 5 : La morale et la loi de l'obligation", es: "Parte 5: La moral y la ley de la obligación" },
            { p: 10, ar: "الباب السادس: قضايا النبوات والرسالات", en: "Part 6: Prophethood and Divine Messages", fr: "Partie 6 : Prophétie et messages divins", es: "Parte 6: Profecía y mensajes divinos" },
            { p: 12, ar: "الباب السابع: الرد على الشبهات التاريخية", en: "Part 7: Answering Historical Objections", fr: "Partie 7 : Réponse aux objections historiques", es: "Parte 7: Respuesta a las objeciones históricas" },
            { p: 14, ar: "الباب الثامن: حجية القرآن الكريم", en: "Part 8: The Authority of the Holy Quran", fr: "Partie 8 : L'autorité du Saint Coran", es: "Parte 8: La autoridad del Sagrado Corán" },
            { p: 16, ar: "الباب التاسع: براهين النبوة المحمدية", en: "Part 9: Proofs of Muhammad's Prophethood", fr: "Partie 9 : Preuves de la prophétie de Muhammad", es: "Parte 9: Pruebas de la profecía de Muhammad" },
            { p: 18, ar: "الباب العاشر: خلاصات ومنهجية الرد", en: "Part 10: Conclusions and Methodology of Response", fr: "Partie 10 : Conclusions et méthodologie de la réponse", es: "Parte 10: Conclusiones y metodología de la respuesta" },
            { p: 20, ar: "الباب الحادي عشر: الخاتمة والآفاق", en: "Part 11: Conclusion and Outlook", fr: "Partie 11 : Conclusion et perspectives", es: "Parte 11: Conclusión y perspectivas" }
        ];

        function renderDoors(lang) {
            const grid = document.getElementById('doors-grid');
            if (!grid) return;
            const key = (lang === 'en' || lang === 'fr' || lang === 'es') ? lang : 'ar';
            const align = (key === 'ar') ? 'text-right' : 'text-left';
            grid.innerHTML = '';
            DOORS.forEach(function (door, i) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = align + ' text-xs bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-800/60 p-2.5 rounded-lg text-zinc-200 transition-colors flex justify-between items-center gap-2';
                btn.setAttribute('data-door', String(door.p));
                const label = document.createElement('span');
                label.textContent = door[key] || door.ar;
                const num = document.createElement('span');
                num.className = 'text-amber-400 font-mono text-[10px]';
                num.textContent = String(i + 1).padStart(2, '0');
                btn.appendChild(label);
                btn.appendChild(num);
                btn.addEventListener('click', function () { jumpToDoor(door.p); });
                grid.appendChild(btn);
            });
        }

        let filteredParagraphs = allParagraphs;
        let currentPage = 0;
        const pageSize = 5;
        let currentQuery = "";
        let userNavigated = false;

        function init() {
            try {
                filteredParagraphs = allParagraphs;
                currentPage = 0;
                currentQuery = "";
                try { applyFontSize(localStorage.getItem('basair-font-px') || 16); } catch (e) { applyFontSize(16); }
                const searchInput = document.getElementById('search-input');
                if (searchInput) searchInput.value = '';
                let savedLang = 'ar';
                try { savedLang = localStorage.getItem('basair-lang') || 'ar'; } catch (e) { savedLang = 'ar'; }
                const langSelect = document.getElementById('lang-select');
                if (langSelect) langSelect.value = savedLang;
                changeLanguage(savedLang);
            } catch (err) {
                document.getElementById('reader-card').innerHTML = '<p class="text-red-500 text-center">خطأ في تحميل ملف البيانات.</p>';
            }
        }

        function forceTop() {
            try {
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
                window.scrollTo(0, 0);
            } catch (e) {}
        }

        function forceFirstDoor() {
            try {
                if (userNavigated) { forceTop(); return; }
                currentPage = 0;
                buildPageSelect();
                const pageSelect = document.getElementById('page-select');
                if (pageSelect) pageSelect.value = '0';
                renderPage();
                forceTop();
            } catch (e) {}
        }

        window.addEventListener('load', function () {
            forceTop();
            setTimeout(forceTop, 50);
            setTimeout(forceTop, 200);
        });

        window.addEventListener('pageshow', function (e) {
            if (!userNavigated) {
                currentPage = 0;
                forceFirstDoor();
                setTimeout(forceTop, 50);
                setTimeout(forceTop, 200);
            }
        });

        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') forceTop();
        });

        function buildPageSelect() {
            const select = document.getElementById('page-select');
            select.innerHTML = '';
            const totalPages = Math.ceil(filteredParagraphs.length / pageSize);
            const lang = document.getElementById('lang-select').value;
            for (let i = 0; i < totalPages; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                if (lang === 'es') opt.textContent = `Página ${i + 1} de ${totalPages}`;
                else if (lang === 'en') opt.textContent = `Page ${i + 1} of ${totalPages}`;
                else if (lang === 'fr') opt.textContent = `Page ${i + 1} sur ${totalPages}`;
                else opt.textContent = `الصفحة ${i + 1} من ${totalPages}`;
                select.appendChild(opt);
            }
            const totalText = (lang === 'es') ? `Total párrafos: ${filteredParagraphs.length}` :
                              (lang === 'en') ? `Total paragraphs: ${filteredParagraphs.length}` :
                              (lang === 'fr') ? `Total paragraphes: ${filteredParagraphs.length}` :
                              `إجمالي الفقرات: ${filteredParagraphs.length}`;
            document.getElementById('total-info').textContent = totalText;
        }

        const translationCache = new Map();

        async function translateText(text, targetLang) {
            if (targetLang === 'ar') return text;
            const cacheKey = targetLang + '|' + text;
            if (translationCache.has(cacheKey)) return translationCache.get(cacheKey);
            const controller = new AbortController();
            const timer = setTimeout(function () { controller.abort(); }, 4000);
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=${targetLang}&dt=t&q=` + encodeURIComponent(text), { signal: controller.signal });
                if (!res || !res.ok) throw new Error('bad response');
                const json = await res.json();
                const out = json[0].map(function (item) { return item[0]; }).join('');
                translationCache.set(cacheKey, out);
                return out;
            } catch (e) {
                return text;
            } finally {
                clearTimeout(timer);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function fillParagraph(p, text, absoluteIndex) {
            let safe = escapeHtml(text);
            if (currentQuery) {
                const pattern = currentQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                try {
                    safe = safe.replace(new RegExp('(' + pattern + ')', 'gi'), '<span class="highlight">$1</span>');
                } catch (e) {}
            }
            p.innerHTML = '<span class="text-xs text-amber-500/70 font-mono ml-2">[' + absoluteIndex + ']</span> ' + safe;
        }

        async function renderPage() {
            const card = document.getElementById('reader-card');
            const start = currentPage * pageSize;
            const end = Math.min(start + pageSize, filteredParagraphs.length);
            const slice = filteredParagraphs.slice(start, end);
            const lang = document.getElementById('lang-select').value;

            if (slice.length === 0) {
                card.innerHTML = '<p class="text-center text-zinc-500 py-8">لا توجد نتائج مطابقة للبحث.</p>';
                document.getElementById('page-select').value = String(currentPage);
                return;
            }

            const localTable = (lang !== 'ar' && window.BASAIR_TRANSLATIONS && window.BASAIR_TRANSLATIONS[lang]) ? window.BASAIR_TRANSLATIONS[lang] : null;

            card.innerHTML = '';
            const items = [];
            for (let idx = 0; idx < slice.length; idx++) {
                const p = document.createElement('p');
                p.className = "leading-relaxed border-b border-emerald-900/20 dark:border-emerald-800/40 pb-4 last:border-b-0";
                const absoluteIndex = start + idx + 1;
                const originalIndex = allParagraphs.indexOf(slice[idx]);
                const localText = localTable && originalIndex >= 0 ? localTable[originalIndex] : null;
                const shown = (localText && localText !== slice[idx]) ? localText : slice[idx];
                fillParagraph(p, shown, absoluteIndex);
                card.appendChild(p);
                items.push({ el: p, text: slice[idx], index: absoluteIndex, done: shown !== slice[idx] });
            }

            document.getElementById('page-select').value = String(currentPage);
            forceTop();

            if (lang !== 'ar') {
                const jobs = items.filter(function (it) { return !it.done; }).map(function (it) {
                    return translateText(it.text, lang).then(function (translated) {
                        if (translated && translated !== it.text && document.body.contains(it.el)) {
                            fillParagraph(it.el, translated, it.index);
                        }
                    }).catch(function () {});
                });
                Promise.all(jobs).catch(function () {});
            }
        }

        function changePage(pageIndex) {
            userNavigated = true;
            const totalPages = Math.ceil(filteredParagraphs.length / pageSize);
            if (pageIndex < 0 || pageIndex >= totalPages) return;
            currentPage = pageIndex;
            renderPage();
        }

        function toggleIndexPanel() {
            const grid = document.getElementById('doors-grid');
            const arrow = document.getElementById('index-arrow');
            if (grid.classList.contains('hidden')) {
                grid.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                grid.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function jumpToDoor(paragraphIndex) {
            userNavigated = true;
            const targetPage = Math.floor(parseInt(paragraphIndex) / pageSize);
            changePage(targetPage);
            document.getElementById('doors-grid').classList.add('hidden');
            document.getElementById('index-arrow').style.transform = 'rotate(0deg)';
        }

        function handleSearch(query) {
            userNavigated = true;
            currentQuery = query.trim();
            const lang = document.getElementById('lang-select').value;
            if (!currentQuery) {
                filteredParagraphs = allParagraphs;
                document.getElementById('search-stats').textContent = '';
            } else {
                const searchTable = (lang !== 'ar' && window.BASAIR_TRANSLATIONS && window.BASAIR_TRANSLATIONS[lang]) ? window.BASAIR_TRANSLATIONS[lang] : null;
                const needle = currentQuery.toLowerCase();
                filteredParagraphs = allParagraphs.filter(function (p, i) {
                    if (p.includes(currentQuery)) return true;
                    if (searchTable && searchTable[i] && String(searchTable[i]).toLowerCase().indexOf(needle) !== -1) return true;
                    return false;
                });
                if (lang === 'es') document.getElementById('search-stats').textContent = `Se encontraron ${filteredParagraphs.length} resultados para "${currentQuery}"`;
                else if (lang === 'en') document.getElementById('search-stats').textContent = `Found ${filteredParagraphs.length} results for "${currentQuery}"`;
                else if (lang === 'fr') document.getElementById('search-stats').textContent = `${filteredParagraphs.length} résultats trouvés pour "${currentQuery}"`;
                else document.getElementById('search-stats').textContent = `تم العثور على ${filteredParagraphs.length} نتيجة مطابقة لـ "${currentQuery}"`;
            }
            currentPage = 0;
            buildPageSelect();
            renderPage();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch('');
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.textContent = '🌙';
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.textContent = '☀️';
            }
        }

        function applyFontSize(px) {
            px = Math.max(12, Math.min(32, parseInt(px, 10) || 16));
            document.documentElement.style.setProperty('--reader-font-size', px + 'px');
            try { localStorage.setItem('basair-font-px', String(px)); } catch (e) {}
            const label = document.getElementById('font-size-label');
            if (label) label.textContent = px;
        }

        function changeFontSize(step) {
            let px = 16;
            try { px = parseInt(localStorage.getItem('basair-font-px') || '16', 10); } catch (e) {}
            applyFontSize(px + step);
        }

        function resetFontSize() {
            applyFontSize(16);
        }

        document.addEventListener('keydown', function (e) {
            const tag = (e.target && e.target.tagName ? e.target.tagName : '').toLowerCase();
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
            const rtl = document.documentElement.dir === 'rtl';
            const key = e.key;
            if (key === 'ArrowRight') { changePage(currentPage + (rtl ? -1 : 1)); e.preventDefault(); }
            else if (key === 'ArrowLeft') { changePage(currentPage + (rtl ? 1 : -1)); e.preventDefault(); }
            else if (key === '+' || key === '=') { changeFontSize(1); e.preventDefault(); }
            else if (key === '-' || key === '_') { changeFontSize(-1); e.preventDefault(); }
            else if (key === '0') { resetFontSize(); e.preventDefault(); }
            else if (key === '/' ) { const s = document.getElementById('search-input'); if (s) { s.focus(); e.preventDefault(); } }
            else if (key.toLowerCase() === 't') { toggleTheme(); }
            else if (key.toLowerCase() === 'd') { toggleIndexPanel(); }
        });

        function changeLanguage(lang) {
            try { localStorage.setItem('basair-lang', lang); } catch (e) {}
            const langSelect = document.getElementById('lang-select');
            if (langSelect) langSelect.value = lang;
            const html = document.getElementById('html-root');
            html.lang = lang;
            html.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            if (lang === 'es') {
                document.getElementById('app-title').textContent = "Enciclopedia Basair";
                document.getElementById('app-subtitle').textContent = "Plataforma digital avanzada";
                document.getElementById('label-doors').textContent = "Índice de puertas y ejes (11 puertas):";
                document.getElementById('search-input').placeholder = "Buscar en la enciclopedia...";
                document.getElementById('btn-clear').textContent = "Limpiar";
                document.getElementById('btn-prev').textContent = "← Anterior";
                document.getElementById('btn-next').textContent = "Siguiente →";
                document.getElementById('footer-text').textContent = "Enciclopedia digital Basair — Lectura fluida sin conexión";
            } else if (lang === 'en') {
                document.getElementById('app-title').textContent = "Basair Encyclopedia";
                document.getElementById('app-subtitle').textContent = "Advanced Digital Platform";
                document.getElementById('label-doors').textContent = "Index of Doors & Chapters (11 doors):";
                document.getElementById('search-input').placeholder = "Search in encyclopedia...";
                document.getElementById('btn-clear').textContent = "Clear";
                document.getElementById('btn-prev').textContent = "← Prev";
                document.getElementById('btn-next').textContent = "Next →";
                document.getElementById('footer-text').textContent = "Basair Digital Encyclopedia — Offline comfortable reading";
            } else if (lang === 'fr') {
                document.getElementById('app-title').textContent = "Encyclopédie Basair";
                document.getElementById('app-subtitle').textContent = "Plateforme numérique avancée";
                document.getElementById('label-doors').textContent = "Index des portes et chapitres (11 portes) :";
                document.getElementById('search-input').placeholder = "Rechercher dans l'encyclopédie...";
                document.getElementById('btn-clear').textContent = "Effacer";
                document.getElementById('btn-prev').textContent = "← Précédent";
                document.getElementById('btn-next').textContent = "Suivant →";
                document.getElementById('footer-text').textContent = "Encyclopédie numérique Basair — Lecture hors-ligne confortable";
            } else {
                document.getElementById('app-title').textContent = "موسوعة بصائر";
                document.getElementById('app-subtitle').textContent = "المنصة الرقمية المتقدمة";
                document.getElementById('label-doors').textContent = "فهرس الأبواب والمحاور (11 باباً)";
                document.getElementById('search-input').placeholder = "ابحث في الموسوعة (كلمة أو رقم)...";
                document.getElementById('btn-clear').textContent = "مسح";
                document.getElementById('btn-prev').textContent = "السابق ←";
                document.getElementById('btn-next').textContent = "→ التالي";
                document.getElementById('footer-text').textContent = "موسوعة بصائر الرقمية — قراءة مريحة بدون انترنت";
            }
            renderDoors(lang);
            buildPageSelect();
            renderPage();
        }

        init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js?v=9', { updateViaCache: 'none' }).then(function (reg) {
                    if (reg && reg.update) reg.update().catch(function () {});
                }).catch(function () {});
                var swReloaded = false;
                navigator.serviceWorker.addEventListener('controllerchange', function () {
                    if (swReloaded) return;
                    swReloaded = true;
                    try {
                        if (!sessionStorage.getItem('basair-sw-reloaded')) {
                            sessionStorage.setItem('basair-sw-reloaded', '1');
                            location.reload();
                        }
                    } catch (e) {}
                });
            });
        }
    </script>
</body>
</html>
