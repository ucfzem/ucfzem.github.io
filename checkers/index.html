<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b1d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Jeu de dames (américaines et espagnoles) complet et jouable hors-ligne">
  <title>Checkers Master</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- ÉCRAN DU MENU PRINCIPAL -->
    <div id="mainMenu" class="menu-screen">
      <div class="menu-hero">
        <div class="hero-pieces">
          <span class="hp hp-cream"></span>
          <span class="hp hp-copper"></span>
          <span class="hp hp-cream small"></span>
        </div>
        <h1 class="app-title gold-text">Checkers Master</h1>
        <p class="app-sub">Jeu de dames · UCF ZEM</p>
      </div>

      <div class="menu-card">
        <div class="control-group">
          <label for="menuGameMode">Mode de jeu</label>
          <select id="menuGameMode" class="select-input">
            <option value="ai">Joueur vs IA</option>
            <option value="pvp">Joueur vs Joueur (Local)</option>
            <option value="online">En ligne</option>
          </select>
        </div>

        <div class="control-group">
          <label for="menuVariant">Règles</label>
          <select id="menuVariant" class="select-input">
            <option value="american">Dames américaines (Checkers)</option>
            <option value="spanish">Dames espagnoles (plateau inversé)</option>
          </select>
        </div>

        <div class="control-group" id="menuDifficultyGroup">
          <label for="menuAiDifficulty">Difficulté de l'IA</label>
          <select id="menuAiDifficulty" class="select-input">
            <option value="1">Niveau 1 - Débutant</option>
            <option value="2">Niveau 2 - Facile</option>
            <option value="3" selected>Niveau 3 - Moyen</option>
            <option value="4">Niveau 4 - Difficile</option>
            <option value="5">Niveau 5 - Expert</option>
          </select>
        </div>

        <div class="control-group" id="menuOnlineGroup" style="display:none;">
          <label for="menuRoomCode">Code de salon</label>
          <input type="text" id="menuRoomCode" class="select-input" placeholder="ABCD" maxlength="4">
          <div style="display:flex;gap:8px;margin-top:8px;">
            <button id="btnCreateRoom" class="btn btn-primary">Créer une partie</button>
            <button id="btnJoinRoom" class="btn btn-secondary">Rejoindre</button>
          </div>
          <div id="menuRoomCodeDisplay" class="room-code"></div>
        </div>

        <div class="control-group">
          <label>Thème de couleurs</label>
          <div class="theme-picker" data-theme-picker></div>
        </div>

        <button id="btnStartGame" class="btn btn-play">Jouer</button>
      </div>
    </div>


    <!-- ÉCRAN DU JEU (masqué par défaut) -->
    <main class="game-screen" id="gameScreen" style="display: none;">

      <div class="topbar">
        <div class="player-card" id="playerWhite">
          <div class="avatar" id="avatarWhite"></div>
          <div class="pname" id="nameWhite">Vous</div>
          <div class="pscore">🏆 <span id="scoreWhite">0</span></div>
        </div>
        <div class="vs gold-text">VS</div>
        <div class="player-card" id="playerBlack">
          <div class="avatar" id="avatarBlack"></div>
          <div class="pname" id="nameBlack">IA</div>
          <div class="pscore">🏆 <span id="scoreBlack">0</span></div>
        </div>
      </div>

      <section class="chalkboard">
        <div class="chalk-title gold-text" id="bannerTitle">Moyen</div>
        <div class="chalk-msg" id="gameMessage">Prêt à jouer ! Sélectionnez un pion.</div>
        <div class="chalk-variant" id="variantBadge"></div>
      </section>

      <div class="board-wrap">
        <div class="board-inner">
          <canvas id="board" width="600" height="600"></canvas>
        </div>
      </div>

      <footer class="bottombar">
        <button id="btnMenu" class="icon-btn" aria-label="Menu">☰</button>
        <div class="coin-counter" aria-label="Pièces">
          <span class="coin">👑</span>
          <span id="coinCount">0</span>
        </div>
        <button id="btnUndo" class="icon-btn" aria-label="Annuler le dernier coup">↶</button>
      </footer>
    </main>
  </div>


  <!-- MENU EN JEU -->
  <div id="menuSheet" class="sheet" aria-hidden="true">
    <div class="sheet-panel">
      <h3 class="sheet-title gold-text">Menu</h3>
      <div class="theme-picker" data-theme-picker></div>
      <button id="btnResume" class="btn btn-secondary">▶ Reprendre</button>
      <button id="btnNewGame" class="btn btn-primary">↻ Recommencer</button>
      <button id="btnMute" class="btn btn-secondary">🔊 Sons : Activés</button>
      <button id="btnBackToMenu" class="btn btn-secondary">🏠 Menu principal</button>
    </div>
  </div>

  <!-- PRÉSENTATION « VS » ET RÉSULTAT -->
  <div id="introOverlay" class="overlay" style="display:none;"></div>
  <div id="resultModal" class="overlay dim" style="display:none;"></div>


  <script src="ai.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(registration => {
            console.log('ServiceWorker OK:', registration.scope);
            registration.update();
          })
          .catch(err => console.log('Erreur ServiceWorker:', err));
      });
    }
  </script>
</body>
</html>
