<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="description" content="Deep-zoom viewer for Urbano Monte's 1587 planisphere — interactive, multilingual (EN/FR/ES/AR), powered by OpenSeadragon.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://iiif.archive.org" crossorigin>
<link rel="dns-prefetch" href="https://iiif.archive.org">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>Mapamundi Viewer</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-deep: #141210;
    --panel: linear-gradient(#20201d, #161412);
    --gold: #d8b56a;
    --gold-dim: rgba(216, 181, 106, 0.35);
    --gold-soft: rgba(216, 181, 106, 0.12);
    --gold-hover: rgba(216, 181, 106, 0.24);
    --ink: #f0e6cf;
    --ink-dim: rgba(240, 230, 207, 0.62);
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- Viewer fills the whole viewport ---- */
  #viewer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 40%, #232120 0%, var(--bg) 55%, var(--bg-deep) 100%);
  }

  /* ---- Overlay toolbar ---- */
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    background: linear-gradient(to bottom, rgba(16, 14, 11, 0.85), rgba(16, 14, 11, 0));
    pointer-events: none;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark { font-size: 1.4rem; color: var(--gold); text-shadow: 0 0 14px rgba(216, 181, 106, 0.5); line-height: 1; }
  .brand-text h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem; font-weight: 600; letter-spacing: 0.06em; color: var(--ink); white-space: nowrap;
  }
  .brand-text p { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dim); margin-top: 2px; }

  .controls { display: flex; align-items: center; gap: 6px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }

  .controls button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; min-width: 40px; padding: 0 12px;
    font-size: 0.85rem; color: var(--ink);
    background: var(--gold-soft); border: 1px solid var(--gold-dim); border-radius: var(--radius);
    cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.18s ease, transform 0.08s ease, border-color 0.18s ease;
  }
  .controls button:hover { background: var(--gold-hover); border-color: var(--gold); }
  .controls button:active { transform: scale(0.94); }
  .controls button svg { width: 18px; height: 18px; display: block; }
  .controls .label { display: inline; }
  .compass-needle { display: inline-flex; transition: transform 0.2s ease-out; }

  /* ---- Language switcher ---- */
  .lang-switcher {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px;
    border: 1px solid var(--gold-dim); border-radius: var(--radius);
    background: var(--gold-soft); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-dim);
    background: transparent; border: 1px solid transparent; border-radius: 7px; cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  }
  .lang-btn .flag { font-size: 0.95rem; line-height: 1; }
  .lang-btn:hover { color: var(--ink); background: var(--gold-soft); }
  .lang-btn.active { color: #14110c; background: linear-gradient(#f2d98c, #d8b56a); border-color: var(--gold); }

  /* ---- Bottom hint ---- */
  .hint {
    position: fixed; left: 50%; bottom: max(34px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 10; max-width: 92vw; padding: 7px 16px; font-size: 0.72rem; letter-spacing: 0.03em;
    color: var(--ink-dim); background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(216, 181, 106, 0.18); border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }

  /* ---- Persistent credit watermark ---- */
  .credit {
    position: fixed; z-index: 11; left: 50%; bottom: max(7px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 3px 12px; font-size: 0.68rem; letter-spacing: 0.09em; white-space: nowrap;
    color: var(--gold-dim); background: rgba(0, 0, 0, 0.34); border: 1px solid rgba(216, 181, 106, 0.16);
    border-radius: 999px; pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }

  /* ---- Quick-navigation hotspots ---- */
  .hotspots {
    position: fixed; z-index: 12; left: max(16px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 32px);
  }
  .hotspot {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px;
    font-size: 0.76rem; color: var(--ink); background: var(--gold-soft);
    border: 1px solid var(--gold-dim); border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.08s ease;
  }
  .hotspot:hover { background: var(--gold-hover); border-color: var(--gold); }
  .hotspot:active { transform: scale(0.95); }
  .hotspot .hs-ico { font-size: 0.95rem; line-height: 1; }

  /* ---- Navigator ---- */
  .navigator { border: 1px solid var(--gold-dim) !important; border-radius: 8px !important; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55) !important; overflow: hidden; }
  body.nav-hidden .navigator { display: none !important; }

  /* ---- Map pins (OpenSeadragon overlays) ---- */
  .map-pin {
    width: 26px; height: 26px; padding: 0; border: none; background: transparent; cursor: pointer;
    transform: translate(-50%, -50%);
  }
  .map-pin .pin-dot {
    display: block; width: 15px; height: 15px; margin: 5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f7e6b4, #e2b560 60%, #c8922f);
    border: 2px solid #6f5518;
    box-shadow: 0 0 0 5px rgba(226, 181, 96, 0.22), 0 2px 8px rgba(0, 0, 0, 0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .map-pin:hover .pin-dot, .map-pin:focus-visible .pin-dot {
    transform: scale(1.18);
    box-shadow: 0 0 0 8px rgba(226, 181, 96, 0.3), 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  .map-pin.active .pin-dot { background: radial-gradient(circle at 35% 30%, #fff4cf, #f2d98c 60%, #d8b56a); box-shadow: 0 0 0 9px rgba(226, 181, 96, 0.35), 0 2px 10px rgba(0, 0, 0, 0.6); }

  /* ---- Pin card (bottom sheet) ---- */
  .pin-card {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 25; width: min(92vw, 560px); padding: 16px 44px 16px 18px;
    background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 12px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.6);
  }
  .pin-card.hidden { display: none; }
  .pin-card h3 { font-family: Georgia, "Times New Roman", serif; font-size: 0.98rem; color: var(--gold); margin-bottom: 7px; }
  .pin-card p { font-size: 0.87rem; line-height: 1.62; color: var(--ink); }

  /* ---- Always-visible info panel (About + map notes) ---- */
  .info-panel {
    position: fixed; z-index: 15;
    top: 74px; left: max(16px, env(safe-area-inset-left));
    width: min(370px, calc(100vw - 32px)); max-height: calc(100dvh - 190px);
    display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(rgba(30, 28, 24, 0.93), rgba(20, 18, 15, 0.95));
    border: 1px solid var(--gold-dim); border-radius: 14px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .info-toggle {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 13px 16px; cursor: pointer; text-align: start;
    font-family: Georgia, "Times New Roman", serif; font-size: 0.92rem; letter-spacing: 0.03em; color: var(--gold);
    background: transparent; border: none; border-bottom: 1px solid var(--gold-dim);
  }
  .info-toggle .chev { flex: 0 0 auto; transition: transform 0.22s ease; }
  .info-panel.collapsed .info-toggle { border-bottom-color: transparent; }
  .info-panel.collapsed .info-toggle .chev { transform: rotate(-90deg); }
  .info-panel.collapsed .info-body { display: none; }
  .info-body { flex: 1 1 auto; overflow: auto; padding: 16px 18px 18px; overscroll-behavior: contain; }
  .info-body h2 { font-family: Georgia, "Times New Roman", serif; color: var(--gold); font-size: 1.06rem; line-height: 1.3; margin-bottom: 4px; }
  .info-body h3 { font-family: Georgia, "Times New Roman", serif; color: var(--gold); font-size: 0.92rem; line-height: 1.3; margin: 2px 0 9px; }
  .info-body .credit-badge { display: inline-block; margin-bottom: 14px; padding: 4px 11px; font-size: 0.72rem; letter-spacing: 0.05em; color: #14110c; background: linear-gradient(#f2d98c, #d8b56a); border-radius: 999px; }
  .info-body p.summary { font-size: 0.86rem; line-height: 1.62; color: var(--ink); margin-bottom: 16px; }
  .info-body .subhead { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold-dim); margin-bottom: 8px; }
  .info-body ul { list-style: none; margin-bottom: 16px; }
  .info-body ul:last-child { margin-bottom: 0; }
  .info-body li { position: relative; padding-inline-start: 18px; font-size: 0.83rem; line-height: 1.58; color: var(--ink-dim); margin-bottom: 9px; }
  .info-body li::before { content: "\25C6"; position: absolute; inset-inline-start: 0; color: var(--gold); font-size: 0.62rem; top: 0.3em; }
  .info-body li b { color: var(--ink); font-weight: 600; }
  #note-list li { margin-bottom: 12px; }

  .icon-close {
    position: absolute; top: 12px; inset-inline-end: 12px;
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink); background: var(--gold-soft); border: 1px solid var(--gold-dim); border-radius: 9px;
    cursor: pointer; transition: background 0.16s ease, transform 0.08s ease;
  }
  .icon-close:hover { background: var(--gold-hover); }
  .icon-close:active { transform: scale(0.92); }
  .pin-card .icon-close { top: 10px; inset-inline-end: 10px; width: 30px; height: 30px; }

  /* ---- Loading / error overlays ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
    background: var(--bg); color: var(--ink);
  }
  .overlay.hidden { display: none; }
  .spinner { width: 42px; height: 42px; border: 3px solid rgba(216, 181, 106, 0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error .err-mark { font-size: 2.2rem; color: var(--gold); }
  #error h2 { font-family: Georgia, serif; font-weight: 600; font-size: 1.15rem; }
  #error p { max-width: 620px; font-size: 0.85rem; line-height: 1.6; color: var(--ink-dim); }
  #error code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 0.78rem; color: var(--gold); background: rgba(216, 181, 106, 0.1); padding: 2px 6px; border-radius: 4px; }

  /* ---- RTL (Arabic) ---- */
  html[dir="rtl"] .brand-text h1 { font-family: "Amiri", "Segoe UI", system-ui, sans-serif; letter-spacing: 0; }
  html[dir="rtl"] .info-body h2 { font-family: "Amiri", Georgia, serif; }
  html[dir="rtl"] .pin-card h3 { font-family: "Amiri", Georgia, serif; }
  html[dir="rtl"] .pin-card { padding: 16px 18px 16px 44px; }

  /* ---- Responsive ---- */
  @media (max-width: 760px) {
    .toolbar { flex-direction: column; align-items: stretch; gap: 8px; background: linear-gradient(to bottom, rgba(16, 14, 11, 0.92), rgba(16, 14, 11, 0)); }
    .brand { justify-content: center; }
    .brand-text p { display: none; }
    .brand-text h1 { font-size: 0.95rem; }
    .controls { justify-content: center; }
    .controls button { height: 38px; min-width: 38px; padding: 0 10px; }
    .controls .label { display: none; }
    .lang-btn .lang-code { display: none; }
    .lang-btn { padding: 0 7px; }
    .hint { font-size: 0.66rem; padding: 6px 12px; }
    .info-panel { top: 96px; left: 12px; width: calc(100vw - 24px); max-height: calc(100dvh - 230px); }
    .info-body { padding: 14px 15px 16px; }
    .pin-card { bottom: 92px; }
    .hotspot { padding: 0 10px; }
    .hotspot .hs-label { display: none; }
    .hotspots { bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  @media (max-height: 460px) { .hint { display: none; } }
</style>
</head>
<body>

  <div id="viewer" role="application" aria-label="Deep-zoom historical map viewer"></div>

  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div class="brand-text">
        <h1 data-i18n="title">Mapamundi Viewer</h1>
        <p data-i18n="subtitle">Deep-zoom &middot; Historical cartography</p>
      </div>
    </div>

    <nav class="controls" aria-label="Viewer controls">
      <button id="about-btn" data-i18n-title="about" title="About the map" aria-label="About the map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r="0.6" fill="currentColor" stroke="none"/></svg>
      </button>

      <div class="lang-switcher" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="en" title="English" aria-label="English"><span class="flag">🇬🇧</span><span class="lang-code">EN</span></button>
        <button class="lang-btn" data-lang="fr" title="Français" aria-label="Français"><span class="flag">🇫🇷</span><span class="lang-code">FR</span></button>
        <button class="lang-btn" data-lang="es" title="Español" aria-label="Español"><span class="flag">🇪🇸</span><span class="lang-code">SP</span></button>
        <button class="lang-btn" data-lang="ar" title="العربية" aria-label="العربية"><span class="flag">🇲🇦</span><span class="lang-code">AR</span></button>
      </div>

      <button id="compass-btn" data-i18n-title="compass" title="Reset North &amp; center the view" aria-label="Reset North and center the view">
        <span class="compass-needle" id="compass-needle" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 4.4 14 12h-4Z" fill="currentColor" stroke="none"/>
            <path d="M12 19.6 10 12h4Z" fill="currentColor" stroke="none" opacity="0.45"/>
          </svg>
        </span>
      </button>
      <button id="zoom-in" data-i18n-title="zoomIn" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
      </button>
      <button id="zoom-out" data-i18n-title="zoomOut" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>
      </button>
      <button id="home" data-i18n-title="home" title="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span class="label" data-i18n="home">Home</span>
      </button>
      <button id="nav-toggle" data-i18n-title="nav" title="Toggle overview map" aria-label="Toggle overview map" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="13" y="13" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="fullscreen" data-i18n-title="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </nav>
  </header>

  <div class="hint" id="hint" data-i18n="hint">Scroll or pinch to zoom &middot; drag to pan &middot; double-click to zoom in</div>

  <!-- Quick-navigation hotspots (jump to landmarks) -->
  <nav class="hotspots" id="hotspots" aria-label="Quick navigation">
    <button class="hotspot" data-hs="pole"><span class="hs-ico" aria-hidden="true">🧭</span><span class="hs-label" data-i18n="hsPole">North Pole</span></button>
    <button class="hotspot" data-hs="japan"><span class="hs-ico" aria-hidden="true">🗾</span><span class="hs-label" data-i18n="hsJapan">Japan</span></button>
    <button class="hotspot" data-hs="ocean"><span class="hs-ico" aria-hidden="true">⛵</span><span class="hs-label" data-i18n="hsOcean">Southern Ocean</span></button>
    <button class="hotspot" data-hs="sheet58"><span class="hs-ico" aria-hidden="true">🖼️</span><span class="hs-label" data-i18n="hsSheet58">Sheet 58</span></button>
  </nav>

  <!-- Persistent credit -->
  <div class="credit" id="credit">Made by UcfZem in 2026</div>

  <!-- Pin detail card -->
  <div class="pin-card hidden" id="pin-card" role="dialog" aria-live="polite">
    <button class="icon-close" id="pin-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h3 id="pin-title"></h3>
    <p id="pin-body"></p>
  </div>

  <!-- Always-visible map information panel -->
  <aside class="info-panel" id="info-panel" aria-label="Map information">
    <button class="info-toggle" id="info-toggle" aria-expanded="true" aria-controls="info-body">
      <span class="info-title" data-i18n="about">About the map</span>
      <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="info-body" id="info-body">
      <h2 id="about-title"></h2>
      <div class="credit-badge" id="about-credit"></div>
      <p class="summary" id="about-summary"></p>
      <div class="subhead" data-i18n="aboutMods">Revisions &amp; modifications</div>
      <ul id="about-mods"></ul>
      <h3 id="prov-heading"></h3>
      <p class="summary" id="prov-text"></p>
      <div class="subhead" data-i18n="mapNotes">Map notes</div>
      <ul id="note-list"></ul>
    </div>
  </aside>

  <!-- Loading -->
  <div class="overlay" id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <p style="font-size:.82rem;color:var(--ink-dim);letter-spacing:.08em" data-i18n="loading">Loading map&hellip;</p>
  </div>

  <!-- Error -->
  <div class="overlay hidden" id="error">
    <div class="err-mark" aria-hidden="true">⚠</div>
    <h2 data-i18n="errTitle">Could not load the map tiles</h2>
    <p id="error-detail"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"></script>
  <script>
  /* =====================================================================
     CONFIG — choose ONE tile source.
     ---------------------------------------------------------------------
     Default: Urbano Monte's 1587 planisphere (main 60-sheet composite,
     ~61,000 x 62,000 px) from the David Rumsey Map Collection, served via
     the Internet Archive's public IIIF image API (CORS enabled).

     Swap CONFIG.sources for your own:
       (A) IIIF:        sources: ['https://example.org/iiif/<id>/info.json']
       (B) Deep Zoom:   sources: ['assets/map.dzi']
       (C) Still image: sources: [{ type: 'image', url: 'assets/map.jpg' }]
       (D) Several:     sources: ['assets/vol1.dzi', 'assets/vol2.dzi']

     Generate a DZI:  vips dzsave map.tif assets/map --tile-size 256 --overlap 1 --suffix .jpg
     ===================================================================== */
  const MONTE_1587_IIIF =

  function renderPinCard() {
    if (!activePinId) return;
    const pin = PINS.find((p) => p.id === activePinId);
    if (!pin) return;
    pinTitle.textContent = pin.t[currentLang] || pin.t.en;
    pinBody.textContent = pin.d[currentLang] || pin.d.en;
  }

  function renderNotes() {
    const ul = $('note-list');
    ul.innerHTML = '';
    PINS.forEach((pin) => {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = (pin.t[currentLang] || pin.t.en) + ' \u2014 ';
      li.appendChild(b);
      li.appendChild(document.createTextNode(pin.d[currentLang] || pin.d.en));
      ul.appendChild(li);
    });
  }

  function renderAbout() {
    const a = INFO[currentLang] || INFO.en;
    $('about-title').textContent = a.title;
    $('about-credit').textContent = a.credit;
    $('about-summary').textContent = a.bio;
    const ul = $('about-mods');
    ul.innerHTML = '';
    a.revisions.forEach((m) => { const li = document.createElement('li'); li.textContent = m; ul.appendChild(li); });
    $('prov-heading').textContent = a.provHeading || '';
    $('prov-text').textContent = a.provText || '';
    renderNotes();
  }

  function setInfoOpen(open) {
    infoPanel.classList.toggle('collapsed', !open);
    infoToggle.setAttribute('aria-expanded', String(open));
  }
  function toggleInfo() { setInfoOpen(infoPanel.classList.contains('collapsed')); }
  infoToggle.addEventListener('click', toggleInfo);


  function setLanguage(lang) {
    if (!I18N[lang]) lang = 'en';
    currentLang = lang;
    const t = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    try { localStorage.setItem('mapamundi_lang', lang); } catch (e) {}
    document.querySelectorAll('.lang-btn').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
    document.querySelectorAll('[data-i18n]').forEach((el) => { const k = el.getAttribute('data-i18n'); if (t[k]) el.textContent = t[k]; });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { const k = el.getAttribute('data-i18n-title'); if (t[k]) { el.title = t[k]; el.setAttribute('aria-label', t[k]); } });
    document.title = t.title + ' \u2014 Urbano Monte (1587)';
    const creditEl = $('credit');
    if (creditEl) creditEl.textContent = (INFO[lang] || INFO.en).credit;
    renderPinCard();
    renderAbout();
  }

  document.querySelectorAll('.lang-btn').forEach((b) => b.addEventListener('click', () => setLanguage(b.dataset.lang)));
  let savedLang = 'en';
  try { savedLang = localStorage.getItem('mapamundi_lang') || 'en'; } catch (e) {}
  setLanguage(savedLang);

  /* ---- Viewer ---- */
  const loader = $('loader');
  const errorBox = $('error');
  const errorDetail = $('error-detail');
  const hint = $('hint');

  const viewer = OpenSeadragon({
    id: 'viewer',
    prefixUrl: PREFIX,
    tileSources: CONFIG.sources.length === 1 ? CONFIG.sources[0] : CONFIG.sources,
    backgroundColor: '#1e1e1e',
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_RIGHT',
    navigatorSizeRatio: 0.16,
    navigatorBorderColor: '#d8b56a',
    navigatorDisplayRegionColor: '#d8b56a',
    animationTime: 1.2,
    springStiffness: 9,
    blendTime: 0.1,
    immediateRender: true,
    imageLoaderLimit: 10,
    timeout: 60000,
    visibilityRatio: 1.0,
    constrainDuringPan: true,
    minZoomImageRatio: 0.85,
    maxZoomPixelRatio: 2.0,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true, scrollToZoom: true, flickEnabled: true, pinchToZoom: true },
    gestureSettingsTouch: { pinchToZoom: true, pinchRotate: true, flickEnabled: true, flickMomentum: 0.2, dragToPan: true },
    showRotationControl: false,
    degrees: 0,
    crossOriginPolicy: CONFIG.crossOriginPolicy
  });

  /* ---- Pin overlays ---- */
  function showPin(id) {
    activePinId = id;
    renderPinCard();
    pinCard.classList.remove('hidden');
    document.querySelectorAll('.map-pin').forEach((el) => el.classList.toggle('active', el.dataset.pin === id));
  }
  function hidePin() {
    activePinId = null;
    pinCard.classList.add('hidden');
    document.querySelectorAll('.map-pin').forEach((el) => el.classList.remove('active'));
  }
  let pinsAdded = false;
  let mapRevealed = false;
  function revealMap() {
    if (mapRevealed) return;
    mapRevealed = true;
    loader.classList.add('hidden');
    setTimeout(() => hint.classList.add('gone'), 4200);
  }
  viewer.addHandler('tile-loaded', revealMap);
  // Global fallback: never leave the app stuck on the loader (e.g. offline or a
  // very slow IIIF server) even if the 'open' event never fires.
  setTimeout(revealMap, 18000);
  viewer.addHandler('open', () => {
    if (pinsAdded) return;
    pinsAdded = true;
    PINS.forEach((pin) => {
      const el = document.createElement('button');
      el.className = 'map-pin';
      el.dataset.pin = pin.id;
      el.type = 'button';
      el.setAttribute('aria-label', pin.t.en);
      el.innerHTML = '<span class="pin-dot"></span>';
      el.addEventListener('click', (ev) => { ev.stopPropagation(); showPin(pin.id); });
      el.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      viewer.addOverlay({ element: el, location: new OpenSeadragon.Point(pin.x, pin.y) });
    });
  });

  viewer.addHandler('open-failed', (e) => {
    loader.classList.add('hidden');
    errorDetail.innerHTML = 'Could not load: <code>' + String(e.message || 'unknown source') + '</code><br><br>' +
      'Edit the <code>CONFIG.sources</code> block in <code>index.html</code> to point at your own IIIF <code>info.json</code>, a <code>.dzi</code> tile set, or a single image.';
    errorBox.classList.remove('hidden');
  });

  /* ---- Toolbar wiring ---- */
  $('zoom-in').addEventListener('click', () => viewer.viewport.zoomBy(1.5));
  $('zoom-out').addEventListener('click', () => viewer.viewport.zoomBy(1 / 1.5));
  $('home').addEventListener('click', () => { viewer.viewport.goHome(); hidePin(); });

  $('nav-toggle').addEventListener('click', (ev) => {
    const hidden = document.body.classList.toggle('nav-hidden');
    ev.currentTarget.setAttribute('aria-pressed', String(!hidden));
  });

  const fsBtn = $('fullscreen');
  const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!isFullscreen()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) req.call(el).catch(() => viewer.setFullScreen(true)); else viewer.setFullScreen(true);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document); else viewer.setFullScreen(false);
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);

  /* ---- Quick-navigation hotspots ---- */
  function zoomToRegion(x, y, zoom) {
    hidePin();
    const target = new OpenSeadragon.Point(x, y);
    viewer.viewport.panTo(target);
    viewer.viewport.zoomTo(zoom, target, false);
  }
  document.querySelectorAll('.hotspot').forEach((btn) => {
    btn.addEventListener('click', () => {
      const h = HOTSPOTS[btn.dataset.hs];
      if (h) zoomToRegion(h.x, h.y, h.zoom);
    });
  });

  /* ---- Compass: needle tracks rotation, click resets North + home ---- */
  const compassNeedle = $('compass-needle');
  viewer.addHandler('rotate', (e) => {
    const deg = (e && typeof e.degrees === 'number') ? e.degrees : 0;
    if (compassNeedle) compassNeedle.style.transform = 'rotate(' + (-deg) + 'deg)';
  });
  $('compass-btn').addEventListener('click', () => {
    hidePin();
    viewer.viewport.setRotation(0);
    viewer.viewport.goHome();
  });

  $('pin-close').addEventListener('click', hidePin);
  $('about-btn').addEventListener('click', toggleInfo);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { hidePin(); }
  });
  viewer.addHandler('canvas-press', hidePin);

  // Hide the hint once the user interacts.
  const viewerEl = $('viewer');
  ['pointerdown', 'wheel', 'touchstart'].forEach((ev) => viewerEl.addEventListener(ev, () => hint.classList.add('gone'), { passive: true }));

  // Offline support (app shell + runtime caching)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
  </script>
</body>
</html>
