<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="description" content="Deep-zoom viewer for high-resolution historical maps, powered by OpenSeadragon.">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<title>Mapamundi Viewer</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-deep: #141210;
    --gold: #d8b56a;
    --gold-dim: rgba(216, 181, 106, 0.35);
    --gold-soft: rgba(216, 181, 106, 0.12);
    --gold-hover: rgba(216, 181, 106, 0.24);
    --ink: #f0e6cf;
    --ink-dim: rgba(240, 230, 207, 0.62);
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- Viewer fills the whole viewport ---- */
  #viewer {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 40%, #232120 0%, var(--bg) 55%, var(--bg-deep) 100%);
  }

  /* ---- Overlay toolbar ---- */
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    background: linear-gradient(to bottom, rgba(16, 14, 11, 0.85), rgba(16, 14, 11, 0));
    pointer-events: none;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    font-size: 1.4rem;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(216, 181, 106, 0.5);
    line-height: 1;
  }
  .brand-text h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink);
    white-space: nowrap;
  }
  .brand-text p {
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-top: 2px;
  }

  .controls { display: flex; align-items: center; gap: 6px; pointer-events: auto; }

  .controls button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    min-width: 40px;
    padding: 0 12px;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--gold-soft);
    border: 1px solid var(--gold-dim);
    border-radius: var(--radius);
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 0.18s ease, transform 0.08s ease, border-color 0.18s ease;
  }
  .controls button:hover { background: var(--gold-hover); border-color: var(--gold); }
  .controls button:active { transform: scale(0.94); }
  .controls button svg { width: 18px; height: 18px; display: block; }
  .controls .label { display: inline; }

  /* ---- Bottom hint ---- */
  .hint {
    position: fixed;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    padding: 7px 16px;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--ink-dim);
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(216, 181, 106, 0.18);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .hint.gone { opacity: 0; }

  /* ---- Navigator (mini overview, bottom-right) ---- */
  .navigator {
    border: 1px solid var(--gold-dim) !important;
    border-radius: 8px !important;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55) !important;
    overflow: hidden;
  }
  body.nav-hidden .navigator { display: none !important; }

  /* ---- Loading / error overlays ---- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    color: var(--ink);
  }
  .overlay.hidden { display: none; }

  .spinner {
    width: 42px; height: 42px;
    border: 3px solid rgba(216, 181, 106, 0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error .err-mark { font-size: 2.2rem; color: var(--gold); }
  #error h2 { font-family: Georgia, serif; font-weight: 600; font-size: 1.15rem; }
  #error p { max-width: 620px; font-size: 0.85rem; line-height: 1.6; color: var(--ink-dim); }
  #error code {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 0.78rem;
    color: var(--gold);
    background: rgba(216, 181, 106, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---- Responsive ---- */
  @media (max-width: 640px) {
    .toolbar { padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
    .brand-text p { display: none; }
    .brand-text h1 { font-size: 0.92rem; }
    .controls { gap: 4px; }
    .controls button { height: 38px; min-width: 38px; padding: 0 9px; }
    .controls .label { display: none; }
    .hint { font-size: 0.66rem; padding: 6px 12px; max-width: 92vw; }
  }
  @media (max-height: 460px) {
    .hint { display: none; }
  }
</style>
</head>
<body>

  <!-- OpenSeadragon mounts here and fills the screen -->
  <div id="viewer" role="application" aria-label="Deep-zoom historical map viewer"></div>

  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div class="brand-text">
        <h1>Mapamundi Viewer</h1>
        <p>Deep-zoom &middot; Historical cartography</p>
      </div>
    </div>
    <nav class="controls" aria-label="Viewer controls">
      <button id="zoom-in" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
      </button>
      <button id="zoom-out" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>
      </button>
      <button id="home" title="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span class="label">Home</span>
      </button>
      <button id="nav-toggle" title="Toggle overview map" aria-label="Toggle overview map" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="13" y="13" width="5" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="fullscreen" title="Toggle fullscreen" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </button>
    </nav>
  </header>

  <div class="hint" id="hint">Scroll or pinch to zoom &middot; drag to pan &middot; double-click to zoom in</div>

  <!-- Loading state -->
  <div class="overlay" id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <p style="font-size:.82rem;color:var(--ink-dim);letter-spacing:.08em">Loading map&hellip;</p>
  </div>

  <!-- Error / not-configured state -->
  <div class="overlay hidden" id="error">
    <div class="err-mark" aria-hidden="true">⚠</div>
    <h2>Could not load the map tiles</h2>
    <p id="error-detail">Check that your tile source is correct and reachable (CORS must be allowed for remote sources).</p>
  </div>

  <!-- OpenSeadragon viewer (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/openseadragon.min.js"></script>
  <script>
  /* =====================================================================
     CONFIG — choose ONE tile source.
     ---------------------------------------------------------------------
     Deep-zoom needs an image pyramid, not a single flat file, so the
     browser only downloads the tiles you are actually looking at.
     Swap the demo below for your own source:

       (A) Deep Zoom Image (.dzi) generated from your high-res map:
             sources: ['assets/map.dzi']

       (B) A single still image (simplest; OSD builds tiles on the fly):
             sources: [{ type: 'image', url: 'assets/map.jpg' }]

       (C) IIIF image API (used by museums & the David Rumsey viewer):
             sources: ['https://example.org/iiif/<id>/info.json']

       (D) Multiple pages / images in one session:
             sources: ['assets/vol1.dzi', 'assets/vol2.dzi']

     Generate a DZI from a huge image (no server needed):
       CLI (libvips):  vips dzsave map.tif assets/map --tile-size 256 --overlap 1 --suffix .jpg
       Python:         pip install pyvips  →  pyvips.Image.new_from_file("map.tif").dzsave("assets/map")
     ===================================================================== */
  const CONFIG = {
    // Default is a public CORS-enabled demo so the page works out of the box.
    // ➜ Replace this with your own tiles (see examples above).
    sources: ['https://openseadragon.github.io/example-images/duomo/duomo.dzi'],

    // Set true if your tiles live on another origin and need credentialed requests.
    crossOriginPolicy: false,

    // Mirror the toolbar/navigator accent by styling OSD's own controls (optional).
    showNavigationControl: false
  };

  const PREFIX = 'https://cdn.jsdelivr.net/npm/openseadragon@5.0.1/build/openseadragon/images/';

  const loader = document.getElementById('loader');
  const errorBox = document.getElementById('error');
  const errorDetail = document.getElementById('error-detail');
  const hint = document.getElementById('hint');

  const viewer = OpenSeadragon({
    id: 'viewer',
    prefixUrl: PREFIX,
    tileSources: CONFIG.sources.length === 1 ? CONFIG.sources[0] : CONFIG.sources,

    // Dark antique theme
    backgroundColor: '#1e1e1e',
    showNavigationControl: CONFIG.showNavigationControl,

    // Mini overview map, bottom-right
    showNavigator: true,
    navigatorPosition: 'BOTTOM_RIGHT',
    navigatorSizeRatio: 0.16,
    navigatorBorderColor: '#d8b56a',
    navigatorDisplayRegionColor: '#d8b56a',

    // Feel
    animationTime: 1.2,
    springStiffness: 9,
    blendTime: 0.1,
    immediateRender: false,
    visibilityRatio: 1.0,
    constrainDuringPan: true,
    minZoomImageRatio: 0.8,
    maxZoomPixelRatio: 3.0,

    // Input — mouse + touch/pinch
    gestureSettingsMouse: {
      clickToZoom: false,
      dblClickToZoom: true,
      scrollToZoom: true,
      flickEnabled: true,
      pinchToZoom: true
    },
    gestureSettingsTouch: {
      pinchToZoom: true,
      pinchRotate: true,
      flickEnabled: true,
      flickMomentum: 0.2,
      dragToPan: true
    },

    // Allow remote tiles to be drawn (display only; no pixel reads)
    crossOriginPolicy: CONFIG.crossOriginPolicy
  });

  // ---- Overlay control wiring -----------------------------------------
  const $ = (id) => document.getElementById(id);

  $('zoom-in').addEventListener('click', () => viewer.viewport.zoomBy(1.5));
  $('zoom-out').addEventListener('click', () => viewer.viewport.zoomBy(1 / 1.5));
  $('home').addEventListener('click', () => viewer.viewport.goHome());

  const navButton = $('nav-toggle');
  navButton.addEventListener('click', () => {
    const hidden = document.body.classList.toggle('nav-hidden');
    navButton.setAttribute('aria-pressed', String(!hidden));
  });

  const fsBtn = $('fullscreen');
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    if (!isFullscreen()) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) { req.call(el).catch(() => viewer.setFullScreen(true)); }
      else { viewer.setFullScreen(true); }
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) { exit.call(document); }
      else { viewer.setFullScreen(false); }
    }
  }
  fsBtn.addEventListener('click', toggleFullscreen);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((ev) =>
    document.addEventListener(ev, () => {
      const on = isFullscreen();
      fsBtn.title = on ? 'Exit fullscreen' : 'Toggle fullscreen';
      fsBtn.setAttribute('aria-label', fsBtn.title);
    })
  );

  // ---- Lifecycle: loading, success, failure ---------------------------
  viewer.addHandler('open', () => {
    loader.classList.add('hidden');
    setTimeout(() => hint.classList.add('gone'), 4200);
  });

  viewer.addHandler('open-failed', (e) => {
    loader.classList.add('hidden');
    errorDetail.innerHTML =
      'Could not load: <code>' + String(e.message || 'unknown source') + '</code><br><br>' +
      'Edit the <code>CONFIG.sources</code> block in <code>index.html</code> to point at ' +
      'your own <code>.dzi</code> tile set, a single image, or a IIIF <code>info.json</code>.';
    errorBox.classList.remove('hidden');
  });

  // Hide the hint as soon as the user starts interacting.
  const viewerEl = document.getElementById('viewer');
  ['pointerdown', 'wheel', 'touchstart'].forEach((ev) =>
    viewerEl.addEventListener(ev, () => hint.classList.add('gone'), { passive: true })
  );

  // ---- Offline support (app shell + runtime caching) ------------------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
  </script>
</body>
</html>
