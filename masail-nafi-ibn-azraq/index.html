<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f2">
<meta name="description" content="مسائل نافع بن الأزرق = غريب القرآن في شعر العرب. أسئلة نافع بن الأزرق لعبد الله بن عباس مع الشواهد الشعرية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>مسائل نافع بن الأزرق — غريب القرآن في شعر العرب</title>
<style>
:root{
  --paper:#faf8f2; --card:#fffdf6; --ink:#2c2420; --muted:#7a6a50; --gold:#b08d57; --gold-light:#d4b483; --mark:#fff3b0; --line:#e7dcc8; --shadow:0 10px 30px rgba(44,36,32,.08);
}
[data-theme="dark"]{--paper:#16130e;--card:#1e1912;--ink:#ece4d3;--muted:#9a8a6c;--gold:#d3a34a;--gold-light:#d4b483;--mark:#5a4a12;--line:#3a3225;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.75}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{cursor:pointer;background:none;border:0;color:inherit;text-align:right}
.brand h1{margin:0;font-family:Amiri,serif;font-size:1.35rem;line-height:1.25}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.controls{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit}
.lang, .theme, .navbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.lang{font-size:.85rem}
.searchbar{position:sticky;top:var(--head-h,73px);z-index:20;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search-inner{display:flex;gap:10px;align-items:center;padding:12px 0}
.search-inner input{flex:1;width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:Amiri,serif;font-size:1rem}
.count{white-space:nowrap;color:var(--muted);font-size:.85rem}
.hero{padding:42px 0 12px;text-align:center}
.hero h2{font-family:Amiri,serif;font-size:clamp(2rem,6vw,3.4rem);line-height:1.25;margin:.2em 0}
.hero .sub{color:var(--gold);font-family:Amiri,serif;font-size:1.25rem}
.hero p{max-width:720px;margin:14px auto;color:var(--muted)}
.hero .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.index-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.index-tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.index-tools button.on{background:var(--gold);border-color:var(--gold);color:#fff}
main{padding:18px 0 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.index-item{text-align:right;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.index-item:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.index-item .word{font-family:Amiri,serif;font-size:1.25rem;font-weight:700;display:block}
.index-item .meta{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:var(--shadow);scroll-margin-top:calc(var(--head-h,73px) + 76px)}
.card h3{font-family:Amiri,serif;font-size:1.6rem;margin:.2em 0}
.kicker{color:var(--muted);font-size:.82rem}
.root{color:var(--muted);font-family:Amiri,serif}
.verse{font-family:Amiri,serif;font-size:1.25rem;color:var(--gold);margin:12px 0}
.body{font-family:Amiri,serif;font-size:1.08rem;line-height:2.15;white-space:pre-wrap}
.poetry{border-inline-start:3px solid var(--gold-light);padding:6px 14px;margin:14px 0}
.poetry .poet{color:var(--muted);font-size:.88rem}
.notes{border-top:1px dashed var(--line);padding-top:10px;color:var(--muted);font-size:.9rem;white-space:pre-wrap}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}
.pager button:disabled{opacity:.35}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.offline i{width:8px;height:8px;border-radius:99px;background:#3fae54;display:inline-block}
.offline.off i{background:#d97706}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:22px;border-top:1px solid var(--line)}
@media (max-width:640px){.bar{align-items:flex-start}.brand p{display:none}.hero{padding-top:28px}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <button class="brand" id="homeBtn" aria-label="الرئيسية">
      <h1>مسائل نافع بن الأزرق</h1>
      <p>غريب القرآن في شعر العرب</p>
    </button>
    <div class="controls">
      <span class="offline" id="offline"><i></i><span>متصل</span></span>
      <button class="theme" id="themeBtn" aria-label="تبديل المظهر">🌙</button>
    </div>
  </div>
</header>

<div class="searchbar">
  <div class="wrap search-inner">
    <input id="q" type="search" aria-label="بحث" placeholder="ابحث في الكلمات، الآيات، الشعر…">
    <span class="count" id="count"></span>
  </div>
</div>

<main class="wrap">
  <section class="hero" id="home">
    <div class="kicker">250 مسألة</div>
    <h2>مسائل نافع بن الأزرق</h2>
    <div class="sub">غريب القرآن في شعر العرب</div>
    <p>أسئلة نافع بن الأزرق لعبد الله بن عباس في تفسير غريب القرآن، مع شاهد من شعر العرب.</p>
    <div class="actions">
      <button class="primary navbtn" id="startBtn">ابدأ القراءة</button>
      <button class="navbtn" id="indexBtn">الفهرس</button>
    </div>
  </section>

  <div class="index-tools" id="indexTools">
    <button data-mode="word" class="on">حسب الكلمة</button>
    <button data-mode="root">حسب الجذر</button>
    <button data-mode="number">حسب الرقم</button>
  </div>

  <div id="index" class="grid"></div>
  <div id="reader"></div>
</main>

<footer>
  <span>مسائل نافع بن الأزرق — غريب القرآن في شعر العرب — نص في الملك العام</span>
</footer>

<script>
const STRINGS = {appTitle:'مسائل نافع بن الأزرق',appSubtitle:'غريب القرآن في شعر العرب',homeIntro:'أسئلة نافع بن الأزرق لعبد الله بن عباس في تفسير غريب القرآن، مع شاهد من شعر العرب. كتاب مجاني في الملك العام.',startReading:'ابدأ القراءة',searchPlaceholder:'ابحث في الكلمات، الآيات، الشعر…',resultsCount:'نتيجة',index:'الفهرس',indexByWord:'حسب الكلمة',indexByRoot:'حسب الجذر',indexByNumber:'حسب الرقم',previous:'السابق',next:'التالي',backHome:'العودة إلى الرئيسية',offline:'غير متصل — يمكنك المتابعة',online:'متصل',masala:'المسألة',verse:'الآية',poetry:'الشاهد الشعري',answer:'الجواب',notes:'ملاحظات',noResults:'لا نتائج',footer:'مسائل نافع بن الأزرق — غريب القرآن في شعر العرب — نص في الملك العام',root:'الجذر'};
const $ = s => document.querySelector(s);
const DATA = { items: [] };
let mode = 'word';

function applyLang(){
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return String(s||'').replace(/[\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').toLowerCase().trim(); }
function highlight(text, q){
  if(!q) return esc(text);
  const qn = norm(q);
  const chars = [...qn].map(ch => {
    const map = {'ا':'[اأإآٱ]','ي':'[يىئ]','و':'[وؤ]','ه':'[هة]'};
    return map[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  }).join('[\\u064B-\\u0652\\u0670\\u06D6-\\u06ED\\u0640]*');
  try { return esc(text).replace(new RegExp('('+chars+')','gi'), '<mark>$1</mark>'); } catch(e){ return esc(text); }
}
function searchable(m){ return [m.title,m.mot,m.racine,m.verset,m.reponse,(m.poesie||[]).map(p=>p.vers+' '+p.poete).join(' ')].join(' '); }
function filtered(){
  const q = $('#q').value.trim();
  if(!q) return DATA.items;
  const qn = norm(q);
  return DATA.items.filter(m => norm(searchable(m)).includes(qn));
}
function renderIndex(items){
  const sorted = [...items];
  if(mode === 'word') sorted.sort((a,b)=>norm(a.mot).localeCompare(norm(b.mot),'ar'));
  if(mode === 'root') sorted.sort((a,b)=>norm(a.racine).localeCompare(norm(b.racine),'ar'));
  if(mode === 'number') sorted.sort((a,b)=>a.id-b.id);
  $('#index').innerHTML = sorted.map(m=>`<button class="index-item" data-id="${m.id}"><span class="word">${highlight(m.mot, $('#q').value)}</span><span class="meta">${mode==='root' ? esc(m.racine) : '#'+m.numero}</span></button>`).join('');
  $('#count').textContent = items.length ? `${items.length} ${STRINGS.resultsCount}` : '';
}
function card(m, q){
  const prev = DATA.items.find(x=>x.id===m.id-1), next = DATA.items.find(x=>x.id===m.id+1);
  return `<article class="card" id="masala-${m.id}">
    <div class="kicker">${STRINGS.masala || 'المسألة'} ${m.numero} · #${m.id}</div>
    <h3>${highlight(m.mot, q)}</h3>
    ${m.racine ? `<div class="root">الجذر: ${esc(m.racine)}</div>` : ''}
    <div class="verse">${highlight(m.verset, q)}</div>
    <div class="body">${highlight(m.reponse, q)}</div>
    ${(m.poesie||[]).map(p=>`<div class="poetry"><div>${highlight(p.vers, q)}</div><div class="poet">${esc(p.poete||'')}</div></div>`).join('')}
    ${m.notes ? `<div class="notes">${highlight(m.notes, q)}</div>` : ''}
    <div class="pager"><button data-goto="${m.id-1}" ${prev?'':'disabled'}>← ${STRINGS.previous}</button><button data-goto="${m.id+1}" ${next?'':'disabled'}>${STRINGS.next} →</button></div>
  </article>`;
}
function render(){
  const items = filtered();
  renderIndex(items);
  $('#reader').innerHTML = items.map(m=>card(m, $('#q').value)).join('');
}
function open(id){
  const m = DATA.items.find(x=>x.id===id);
  if(!m) return;
  $('#q').value = '';
  render();
  $('#reader').innerHTML = card(m, '');
  document.getElementById('masala-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});
}
$('#index').addEventListener('click', e=>{ const b=e.target.closest('.index-item'); if(b) open(+b.dataset.id); });
$('#reader').addEventListener('click', e=>{ const b=e.target.closest('[data-goto]'); if(b && !b.disabled) open(+b.dataset.goto); });
$('#q').addEventListener('input', render);
$('#indexTools').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; mode=b.dataset.mode; document.querySelectorAll('#indexTools button').forEach(x=>x.classList.toggle('on',x===b)); renderIndex(filtered()); });
$('#homeBtn').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
$('#startBtn').addEventListener('click', ()=>{ if(DATA.items.length) open(1); });
$('#indexBtn').addEventListener('click', ()=>$('#index').scrollIntoView({behavior:'smooth'}));
$('#themeBtn').addEventListener('click', ()=>{ const d=document.documentElement; d.dataset.theme = d.dataset.theme==='dark' ? 'light' : 'dark'; $('#themeBtn').textContent = d.dataset.theme==='dark' ? '☀️' : '🌙'; });
function setOnline(){ const on=navigator.onLine; const el=$('#offline'); el.classList.toggle('off',!on); el.querySelector('span').textContent = on ? STRINGS.online : STRINGS.offline; }
window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline);
fetch('masail.json', {cache:'no-cache'}).then(r=>r.json()).then(json=>{ DATA.items=json; setOnline(); render(); }).catch(()=>{ $('#reader').innerHTML='<p style="text-align:center;color:var(--muted)">تعذّر تحميل البيانات.</p>'; });
(function(){ const h=document.querySelector('header'); const set=()=>document.documentElement.style.setProperty('--head-h', h.offsetHeight+'px'); set(); window.addEventListener('resize', set); })();
if('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
