          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما         "text": "لمن يشاء @QE@ سورة النساء : 48 ، 116 . | وقال الخليل عليه السلام : @QB@\nواجنبني وبني أن نعبد الأصنام @QE@ سورة إبراهيم : 35 . | وفي الحديث : '\nأخوف ما أخاف عليكم : الشرك الأصغر ، فسئل عنه . فقال : الرياء ' ( رواه\nأحمد والطبراني والبيهقي ) . | وعن ابن مسعود رضي الله عنه ، أن رسول الله\nصلى الله عليه وسلم قال : ' من مات وهو يدعو من دون الله ندا دخل النار ' (\nرواه البخاري ) . | ولمسلم عن جابر رضي الله عنه : أن ms05 رسول الله صلى الله\nعليه وسلم قال : ' من لقي الله لا يشرك به شيئا دخل الجنة ، ومن لقيه يشرك\nبه شيئا دخل النار ' . PageV01P018 | فيه مسائل : | الأولى : الخوف من\nالشرك . | الثانية : أن الرياء من الشرك . | الثالثة : أنه من الشرك الأصغر\n. | الرابعة : أنه أخوف ما يخاف منه على الصالحين . | الخامسة : قرب الجنة\nوالنار . | السادسة : الجمع بين قربهما في حديث واحد . | السابعة : أنه من\nلقيه لا يشرك به شيئا دخل الجنة . ومن لقيه يشرك به شيئا دخل النار ، ولو\nكان من أعبد الناس . | الثامنة : المسألة العظيمة : سؤال الخليل له ولبنيه\nوقاية عبادة الأصنام . | التاسعة : اعتباره بحال الأكثر لقوله : @QB@ رب\nإنهن أضللن كثيرا من الناس @QE@ . | العاشرة : فيه تفسير ' لا إله إلا الله\n' ، كما ذكره البخاري . | الحادية عشرة : فضيلة من سلم من الشرك .",

        "text": "اتبعني وسبحان الله وما أنا من المشركين @QE@ سورة يوسف : 108 . | عن ابن\nعباس رضي الله عنهما : ' أن رسول الله صلى الله عليه وسلم لما بعث معاذا\nإلى اليمن قال له : إنك تأتي قوما من أهل الكتاب . فليكن أول ما تدعوهم\nإليه شهادة أن لا إله إلا الله . | - وفي رواية : إلى أن يوحدوا الله - فإن\nهم أطاعوك لذلك فأعلمهم أن الله افترض عليهم خمس صلوات في كل يوم وليلة ،\nفإن هم أطاعوك لذلك فأعلمهم أن الله افترض عليهم صدقة تؤخذ من أغنيائهم\nفترد على فقرائهم . فإن هم أطاعوك لذلك فإياك وكرائم أموالهم ، واتق دعوة\nالمظلوم ، فإنه ليس بينها وبين الله حجاب ' . أخرجاه . | ولهما عن سهل بن\nسعد رضي الله عنه : أن رسول الله صلى الله عليه وسلم قال يوم خيبر : '\nلأعطين الراية غدا رجلا يحب الله PageV01P020 ورسوله ، ويحبه الله ورسوله\nيفتح الله على يديه ، فبات الناس يدوكون ليلتهم : أيهم يعطاها ؟ فلما\nأصبحوا غدوا على رسول الله صلى الله عليه وسلم ، كلهم يرجو أن يعطاها .\nفقال : أين علي بن أبي طالب ms06 ؟ فقيل : هو يشتكي عينيه ، فأرسلوا إليه ، فأتي\nبه . فبصق في عينيه ؛ ودعا له . فبرأ كأن لم يكن به وجع ، فأعطاه الراية\nفقال : انفذ على رسلك . حتى تنزل بساحتهم ، ثم ادعهم إلى الإسلام . وأخبرهم\nبما يجب عليهم من حق الله تعالى فيه ، فوالله لأن يهدي الله بك رجلا واحدا\n، خير لك من حمر النعم ' ' يدوكون ' أي يخوضون . | فيه مسائل : | الأولى :\nأن الدعوة إلى الله طريق من اتبع رسول الله صلى الله عليه وسلم . | الثانية\n: التنبيه على الإخلاص : لأن كثيرا لو دعا إلى الحق ، فهو يدعو إلى نفسه .\n| الثالثة : أن البصيرة من الفرائض . | الرابعة : من دلائل حسن التوحيد :\nأنه تنزيه الله تعالى عن المسبة . | الخامسة : أن من قبح الشرك كونه مسبة\nلله . | السادسة : وهي من أهمها - إبعاد المسلم عن المشركين لئلا يصير منهم\n، ولو لم يشرك . | السابعة : كون التوحيد أول واجب . PageV01P021 | الثامنة\n: أنه يبدأ به قبل كل شيء ، حتى الصلاة . | التاسعة : أن معنى ' أن يوحدوا\nالله ' معنى شهادة : أن لا إله إلا الله . | العاشرة : أن الإنسان قد يكون\nمن أهل الكتاب وهو لا يعرفها ، أو يعرفها ولا يعمل بها . | الحادية عشرة :\nالتنبيه على التعليم بالتدريج . | الثانية عشرة : البداءة بالأهم فالأهم .\n| الثالثة عشرة : مصرف الزكاة . | الرابعة عشرة : كشف العالم الشبهة عن\nالمتعلم . | الخامسة عشرة : النهي عن كرائم الأموال . | السادسة عشرة :\nاتقاء دعوة المظلوم . | السابعة عشرة : الإخبار بأنها لا تحجب . | الثامنة\nعشرة : من أدلة التوحيد ما جرى على سيد المرسلين وسادات الأولياء من المشقة\nوالجوع والوباء . | التاسعة عشرة : قوله ' لأعطين الراية - الخ ' علم من\nأعلام النبوة . | العشرون : تفله في عينيه علم من أعلامها أيضا . | الحادية\nوالعشرون : فضيلة علي رضي الله عنه . | الثانية والعشرون : فضل الصحابة في\nدوكهم تلك الليلة وشغلهم عن بشارة الفتح . PageV01P022 | الثالثة والعشرون\n: الإيمان بالقدر ، لحصولها لمن لم يسع لها ومنعها عمن سعى . | الرابعة\nوالعشرون : الأدب في قوله ' على رسلك ' . | الخامسة والعشرون : الدعوة إلى\nالله إلى الإسلام قبل القتال . | السادسة والعشرون : أنه مشروع لمن دعوا\nقبل ذلك وقوتلوا . | السابعة والعشرون : الدعوة بالحكمة ms07 لقولهم : ' أخبرهم\nبما يجب ' . | الثامنة والعشرون : المعرفة بحق الله في الإسلام . | التاسعة\nوالعشرون : ثواب من اهتدى على يديه رجل واحد . | الثلاثون : الحلف على\nالفتيا . PageV01P023",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما         "text": "أيهم أقرب ويرجون رحمته ويخافون عذابه إن عذاب ربك كان محذورا @QE@ الإسراء\n: 57 . | وقوله : @QB@ وإذ قال إبراهيم لأبيه وقومه إنني براء مما تعبدون\nإلا الذي فطرني فإنه سيهدين وجعلها كلمة باقية في عقبه لعلهم يرجعون @QE@\nسورة الزخرف : 26 - 28 . | وقوله : @QB@ اتخذوا أحبارهم ورهبانهم أربابا من\nدون الله والمسيح ابن مريم @QE@ سورة التوبة : 31 . | وقوله : @QB@ ومن\nالناس من يتخذ من دون الله أندادا يحبونهم كحب الله والذين آمنوا أشد حبا\nلله @QE@ سورة البقرة : 165 . | وفي الصحيح عن النبي صلى الله عليه وسلم\nأنه قال : ' من قال لا إله إلا الله وكفر بما يعبد من دون الله ، حرم ماله\nودمه . وحسابه على الله عز وجل ' . PageV01P024 | وشرح هذه الترجمة : ما\nبعدها من الأبواب . | فيه أكبر المسائل وأهمها : وهي تفسير التوحيد ،\nوتفسير الشهادة : وبينها بأمور واضحة . | منها : آية الإسراء بين فيها الرد\nعلى المشركين الذين يدعون الصالحين ففيها : بيان أن هذا هو الشرك الأكبر .\n| ومنها : آية براءة ، بين فيها أن أهل الكتاب اتخذوا أحبارهم ورهبانهم\nأربابا من دون الله ، وبين أنهم لم يؤمروا إلا بأن يعبدوا إلها واحدا ، مع\nأن تفسيرها الذي لا إشكال فيه : طاعة العلماء والعباد في المعصية ، لا\nدعاؤهم إياهم . | ومنها : قول الخليل عليه السلام للكفار : @QB@ إنني براء\nمما تعبدون إلا الذي فطرني @QE@ سورة الزخرف : 26 فاستثنى من المعبودين ربه\n، وذكر سبحانه أن هذه البراءة وهذه الموالاة : هي تفسير شهادة أن لا إله\nإلا الله : فقال : @QB@ وجعلها كلمة باقية في عقبه لعلهم يرجعون @QE@ سورة\nالزخرف : 28 . | ومنها : آية البقرة في الكفار الذين قال الله فيهم : @QB@\nوما هم بخارجين من النار @QE@ . ذكر أنهم يحبون أندادهم كحب الله . فدل على\nأنهم يحبون الله حبا عظيما ولم يدخلهم في ms08 الإسلام . فكيف بمن أحب الند أكبر\nمن حب الله ؟ فكيف بمن لم يحب إلا الند وحده ؟ ولم يحب الله ؟ PageV01P025\n| ومنها قوله صلى الله عليه وسلم : ' من قال : لا إله إلا الله وكفر بما\nيعبد من دون الله ، حرم ماله ودمه ، وحسابه على الله ' وهذا من أعظم ما\nيبين معنى ' لا إله إلا الله ' فإنه لم يجعل التلفظ بها عاصما للدم والمال\n، بل ولا معرفة معناها مع لفظها ، بل ولا الإقرار بذلك ، بل ولا كونه لا\nيدعو إلا الله وحده لا شريك له ،           "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

 ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما         "text": "بالجبت والطاغوت ويقولون للذين كفروا هؤلاء أهدى من الذين آمنوا سبيلا @QE@\nسورة النساء : 51 . | وقوله تعالى : @QB@ قل هل أنبئكم بشر من ذلك مثوبة\nعند الله من لعنه الله وغضب عليه وجعل منهم القردة والخنازير وعبد الطاغوت\n@QE@ سورة المائدة : 61 . | وقوله تعالى : @QB@ قال الذين غلبوا على أمرهم\nلنتخذن عليهم مسجدا @QE@ سورة الكهف : 21 . | عن أبي سعيد رضي الله عنه :\nأن رسول الله صلى الله عليه وسلم قال : ' لتتبعن سنن من كان قبلكم حذو\nالقذة بالقذة ، حتى لو دخلوا جحر ضب لدخلتموه . قالوا : يا رسول الله ،\nاليهود والنصارى ؟ قال : فمن ؟ ' أخرجاه . PageV01P068 | ولمسلم ، عن ثوبان\nرضي الله عنه : أن رسول ms25 الله صلى الله عليه وسلم قال : ' إن الله زوى لي\nالأرض ، فرأيت مشارقها ومغاربها . وإن أمتي سيبلغ ملكها ما زوى لي منها\nوأعطيت الكنزين : الأحمر والأبيض . وإني سألت ربي لأمتي أن لا يهلكها بسنة\nبعامة ، وأن لا يسلط عليهم عدوا من سوى أنفسهم ، فيستبيح بيضتهم . وإن ربي\nقال : يا محمد ، إذا قضيت قضاء فإنه لا يرد . وإني أعطيتك لأمتك أن لا\nأهلكهم بسنة عامة . وأن لا أسلط عليهم عدوا من سوى أنفسهم فيستبيح بيضتهم .\nولو اجتمع عليهم من بأقطارها ، حتى يكون بعضهم يهلك بعضا ، ويسبي بعضهم\nبعضا ' ورواه البرقاني في صحيحه . | وزاد : ' وإنما أخاف على أمتي الأئمة\nالمضلين . وإذا وقع عليهم السيف لم يرفع إلى يوم القيامة . ولا تقوم الساعة\nحتى يلحق حي من أمتي بالمشركين ، وحتى تعبد فئام من أمتي الأوثان . وإنه\nسيكون في أمتي كذابون ثلاثون ، كلهم يزعم أنه نبي . وأنا خاتم النبيين . لا\nنبي بعدي . ولا تزال طائفة من أمتي على الحق منصورة ، لا يضرهم من خذلهم\nحتى يأتي أمر الله ، تبارك وتعالى ' . | فيه مسائل : الأولى : تفسير آية\nالنساء . | الثانية : تفسير آية المائدة . | الثالثة : تفسير آية الكهف .\n| الرابعة : - وهي أهمها - ما معنى الإيمان بالجبت والطاغوت :\nهل هو اعتقاد قلب ، أو هو موافقة أصحابها مع بغضها ومعرفة بطلانها ؟ . |\nالخامسة : قولهم : إن الكفار الذين يعرفون كفرهم أهدى سبيلا من المؤمنين .\n| السادسة : - وهي المقصودة بالترجمة - أن هذا لا بد أن يوجد في هذه الأمة\n، كما تقرر في حديث أبي سعيد . | السابعة : التصريح بوقوعها ، أعني عبادة\nالأوثان في هذه الأمة في جموع كثيرة . | الثامنة : العجب العجاب : خروج من\nيدعي النبوة ، مثل المختار ، مع تكلمه بالشهادتين ، وتصريحه بأنه من هذه\nالأمة ، وأن الرسول حق ، وأن القرآن حق ، وفيه : أن محمدا خاتم النبيين ،\nومع هذا يصدق في هذا كله مع التضاد الواضح ، وقد خرج المختار في آخر عصر\nالصحابة ، وتبعه فئام كثيرة . | التاسعة : البشارة بأن الحق لا يزول\nبالكلية ، كما زال فيما مضى ، بل لا تزال عليه طائفة . | العاشرة : الآية\nالعظمى : أنهم مع ms26 قلتهم لا يضرهم من خذلهم ولا من خالفهم . | الحادية عشرة\n: أن ذلك الشرط إلى قيام الساعة . | الثانية عشرة : ما فيهن من الآيات\nالعظيمة . PageV01P070 | منها : إخباره بأن الله زوى له المشارق والمغارب ،\nوأخبر بمعنى ذلك ، فوقع كما أخبر ، بخلاف الجنوب والشمال . | وإخباره بأنه\nأعطي الكنزين . | وإخباره بإجابة دعوته لأمته في الاثنتين . | وإخباره بأنه\nمنع الثالثة . | وإخباره بوقوع السيف ، وأنه لا يرفع إذا وقع . | وإخباره\nبظهور المتنبئين في هذه الأمة . | وإخباره ببقاء الطائفة المنصورة . | وكل\nهذا وقع كما أخبر ، مع أن كل واحدة منها من أبعد ما يكون في العقول . |\nالثالثة عشرة : حصر الخوف على أمته من الأئمة المضلين . | الرابعة عشرة :\nالتنبيه على معنى عبادة الأوثان . PageV01P071 |",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما           "quote": "من الدين ضرورة ‏ أو بإنكار الأحكام المتواترة والمجمع عليها » ونحو ذلك .\nواختلاف الناس فيا يشرع من الدعاء وما لا يشرع » كاختلافهم هل تشرع\nالصلاة عليه عند الذبم , وليس هو من مسائل السب عند أحد من المسلبين .\nوأمامن قال : إن من نق التوسل الذى سماه استغاءة بغيره كفر ,\nوتكفير من قال بقول الشيخ عز الدين وأمثاله » فأظهر من أن يحتاج\nإلى جواب ؛ بل المكفر بمثل هذه الأمور » يستحق من غليظ العقوبة والتعزير\nماستحقه أمثاله من المفترين على الدين :لاسي مع قول النى صلى الله عليه وس!:\n« من قال لأخخه : كافر فقد باء مأ أحدهما » .\nوأما من قال: ما لابقدر عليه إلا اللّه لا يستغاث فيه إلا به . فقد قالالحق »\nبل لو قال قال أبو ,زيد : استغانة الخلوق بالخلوق كاستغانة الغريق بالغريق »\nوكا قال الشيخ أبو عبد الله القرشى استغاية الحلوق بالححلوق كاستغانة\nالمسجون بالمسجون لكان قد أحسن . فإن مطلق هذا الكلام يفهم الاستغاءة\n٠١١\nالطلقة » م قال اللبى صلى الله عليه وسلم لابن عباس « إذا سألت فا سأل\nالله » وإذا استعنت فاستعن بالله» .\nوإذا نف الرسول كَِكِ عن نفسه أمرا كان هو الصادق المصدوق فى ذلك » م\nهو الصادق المصدوق فى كل مايخبر به من ننى > وإثبات » وعلينا أن نصدقه\nفى كل ما أخبر به » من نى * وإثبات ؛ ومن رد خبره تعظما له > أشبه\nالتصارى ' الذي نكذبوا المسيح فى إخباره عن نفسه بالعبودية » تعظما له ؛\nويحوذ لا أن تتئى ما نفاه » وليس لاحد أن يقابل نفيه بنقيض ذلك ألية .\nالله أعل.\nوسئل سيم اير سمرم :\n) تقى الدبن ان نميهي رذي الل عنه (\nما تقول السادة العلماء أمة الدين وفقهم اله لطاعته فيمن يقول : لا يستغاث\nبرسول الله صلى الله عليه وسلم , هل يحرم عليه هذا القول؛ وهل هو كفر\nأم لا؟ وإن استدل بآبات من كتاب الله وأحاديث رسوله صلى الله عليه وسلم\nهل ينفعه دليله أم لا ؟ وإذا قام الدليل من الكتاب والسنة فا جب على من\nيخالف ذلك ؟ أفتونا مأجورين .\nفأجاب :-\nالجمدلته : قد ثيت ,السنة المستفيضة . بل المتواترة » واتفاق الأمة :\nأن نبينا صلى الله عليه وسل الشافع المشفع » وأنه يشفع فى الخلائق يوم القامة\nثم اتفق أهل السنة واجماعة أنه يشفع فى أهل الكبائر . وأنه لاخف لد\nفى النار من أهل التوحيد أحد .\nوأما الخوارج والمعتزلة فأنكروا شفاعته لأهل الكبائر » ولم يشكروا\n٠١4\nوأما من أنكر مائيت           "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",
          "source": "مجموع الفتاوى — mfsiaitm02_djvu.txt"

        "text": "إليك وما أنزل من قبلك يريدون أن يتحاكموا إلى الطاغوت ، وقد أمروا أن\nيكفروا به ويريد الشيطان أن يضلهم ضلالا بعيدا . وإذا قيل لهم : تعالوا إلى\nما أنزل الله وإلى الرسول رأيت المنافقين يصدون عنك صدودا . فكيف إذا\nأصابتهم مصيبة بما قدمت أيديهم ثم جاءوك يحلفون بالله إن أردنا إلا إحسانا\nوتوفيقا ) ^ النساء من 60 إلى 62 . | وقوله : @QB@ وإذا قيل لهم لا تفسدوا\nفي الأرض قالوا إنما نحن مصلحون @QE@ سورة البقرة : 11 . | وقوله : @QB@\nولا تفسدوا في الأرض بعد إصلاحها وادعوه خوفا وطمعا إن رحمة الله قريب من\nالمحسنين @QE@ سورة الأعراف : 56 . | وقوله : @QB@ أفحكم الجاهلية يبغون\nومن أحسن من الله حكما لقوم يوقنون @QE@ سورة المائدة : 50 . | عن عبد الله\nبن عمرو رضي الله عنهما : أن رسول الله صلى الله عليه وسلم قال : ' لا يؤمن\nأحدكم حتى يكون هواه تبعا لما جئت به ' قال النووي : حديث صحيح ، رويناه في\nكتاب الحجة بإسناد صحيح . PageV01P104 | وقال الشعبي : ' كان بين رجل من\nالمنافقين ورجل من اليهود خصومة فقال اليهودي : نتحاكم إلى محمد - لأنه عرف\nأنه لا يأخذ الرشوة - : وقال المنافق نتحاكم إلى اليهود ؛ - لعلمه أنهم\nيأخذون الرشوة - فاتفقا أن يأتيا كاهنا في جهينة فيتحاكما إليه ، فنزلت\n@QB@ ألم تر إلى الذين يزعمون @QE@ الآية ' . | وقيل : نزلت في رجلين\nاختصما فقال ms37 أحدهما : نترافع إلى النبي صلى الله عليه وسلم ، وقال الآخر :\nإلى كعب بن الأشرف . ثم ترافعا إلى عمر ، فذكر له أحدهما القصة . فقال للذي\nلم يرض برسول الله صلى الله عليه وسلم : أكذلك : قال نعم : فضربه بالسيف\nفقتله ' . | فيه مسائل : | الأولى : تفسير آية النساء وما فيها من الإعانة\nعلى معرفة فهم الطاغوت . | الثانية : تفسير آية البقرة @QB@ وإذا قيل لهم\nلا تفسدوا في الأرض @QE@ الآية . | الثالثة : تفسير آية الأعراف @QB@ ولا\nتفسدوا في الأرض بعد إصلاحها @QE@ . | الرابعة : تفسير @QB@ أفحكم الجاهلية\nيبغون @QE@ . | الخامسة : ما قال الشعبي في سبب نزول الآية الأولى . |\nالسادسة : تفسير الإيمان الصادق والكاذب . | السابعة : قصة عمر مع المنافق\n. | الثامنة : كون الإيمان لا يحصل لأحد حتى يكون هواه تبعا لما جاء به\nالرسول صلى الله عليه وسلم . PageV01P105",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما           "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

        "text": "هذا لي وما أظن الساعة قائمة ولئن رجعت إلى ربي إن لي عنده للحسنى فلننبئن\nالذين كفروا بما عملوا ولنذيقنهم من عذاب غليظ ms42 @QE@ سورة فصلت : 50 . | قال\nمجاهد : ' هذا بعملي وأنا محقوق به ' . | وقال ابن عباس : ' يريد من عندي '\n. | وقوله : ' قال : إنما أوتيته على علم عندي ' قال قتادة : ' على علم مني\nبوجوه المكاسب ' . | وقال آخرون : ' على علم من الله أني له أهل ' وهذا\nمعنى قول مجاهد : ' أوتيته على شرف ' . | وعن أبي هريرة أنه سمع رسول الله\nصلى الله عليه وسلم يقول : ' إن ثلاثة من بني إسرائيل : أبرص ، وأقرع ،\nوأعمى . فأراد الله أن يبتليهم فبعث إليهم ملكا . فأتى الأبرص ، فقال : أي\nشيء أحب إليك ؟ قال : قال : لون حسن ، وجلد حسن ، ويذهب عني الذي قد قذرني\nالناس به . قال : فمسحه فذهب عنه قذره ، فأعطي لونا حسنا وجلدا حسنا . قال\n: PageV01P119 فأي المال أحب إليك : قال : الإبل أو البقر - شك إسحاق -\nفأعطى ناقة عشراء ، وقال : بارك الله لك فيها . قال : فأتى الأقرع فقال :\nأي شيء أحب إليك ؟ قال : شعر حسن . ويذهب عني الذي قد قذرني الناس به .\nفمسحه ، فذهب عنه ، وأعطي شعرا حسنا ، فقال : أي المال أحب إليك ؟ قال :\nالبقر أو الإبل . فأعطى بقرة حاملا ، قال : بارك الله لك فيها . فأتى\nالأعمى ، فقال : أي شيء أحب إليك ؟ قال : أن يرد الله إلي بصري فأبصر به\nالناس . فمسحه فرد الله إليه بصره . قال : فأي المال أحب إليك ؟ قال :\nالغنم . فأعطي شاة والدا . فأنتج هذان ، وولد هذا . فكان لهذا واد من الإبل\n، ولهذا واد من البقر ، ولهذا واد من الغنم . قال : ثم إنه أتى الأبرص في\nصورته وهيئته . فقال : رجل مسكين قد انقطعت بي الحبال في سفري ، فلا بلوغ\nلي اليوم إلا بالله ثم بك ، أسألك بالذي أعطاك اللون الحسن والجلد الحسن\nوالمال - بعيرا أتبلغ به في سفري ، فقال : الحقوق كثيرة . فقال : كأني\nأعرفك ، ألم تكن أبرص يقذرك الناس فقيرا ، فأعطاك الله عز وجل المال ؟ فقال\n: إنما ورثت هذا المال كابرا عن كابر . فقال : إن كنت كاذبا فصيرك الله إلى\nما كنت . وأتى الأقرع في صورته ، فقال له مثل ما قال لهذا ، ورد عليه مثل\nما رد عليه هذا ms43 . فقال : إن كنت كاذبا فصيرك الله إلى ما كنت ، قال : وأتى\nالأعمى في صورته ، فقال : رجل مسكين وابن سبيل . قد انقطعت بي الحبال في\nسفري فلا بلاغ لي اليوم إلا بالله  ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

 ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

          "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما           "quote": "فيه شىء .\nفيقال له : إذا ارتفعت العلويات والسفليات : فا تعنى بانساطه ؟ أتعنى\nتفرقه وعدمه كا يتفرق نور العين عند عدم الأجفان ؟ أم تعنى أنه ينبسط شىء\nأ قن تفط ؟ وها الذى رظي نقد أو للا يعار ؟ :\nفإنعنيت الأول وهو مقتضى أو لكلامك , لأنك قات : وإنما قلنا\nإن العلريات والسفليات أجفان عين الله لأنهما حافظان على ظهور النور » فلو\nقطعت أجفان عين الإنسان ؛ لتفرق نور عينه وانتشر » بحيث لا يرى شيا\nأصلا » فكذاك العلويات والسفليات لو ارتفعت : لانبسط نور الله » تحسث\nلا .يظهر فيه شثىء أصلا . ٠‏\nوقد قلت : إرن الله هو نور العين ؛ والروح الأعظم ساضباأ ١‏ والنفس\nومعلوم أن نور العين على ما ذكرته بشرط وجوده هو الأجفان ظ فاذأ\nارتفع الشرط ارتفع المشروط , فيكون العالى عندك شرطاً فى وجود الله ؛\nفإذا ارتفع العالم ارتفعت حقيقة الله لانتفاء شرطه ٠‏ وإن أثبت له ذاتا غير العالم\nفهذا أحد قولى الاتحادية .\nفإنهم تأرة بجعلون وجود المق : هو عيبن وجود الخلوقات ليس غيرها '\n١ 17/\nوعلى هذا فلا يتصور وجوده مع عدم اتخلوقات ؛ وهذا نعل محض للصانع\nوهو قول القونوى والتلسان » وهو قول صاحب الفصوص فى كثير من\nكلامه , وتارة يجعاون له وجوداً قائمأ بنفسه » م يحعلون نفس ذلك الوجود\nهو أيضأ وجود الخلوقات » معنى أنه فاض علها ؛ وهذا أقل كفراً من الأول .\nوإن كان كلاهما من أغلظ الكفر وأقحه .\nوفى كلام صاحب الفصوص وغيره - فى بعض المواضع -- ما يوافق هذا\nالقول ‏ و كذلككلام هذا . فإنه قد يشير إلى هذا المعنى .\n“م مع ذلك : هل يجحعلون وجوده مشروطأ بوجود العالم , فيكون محتاجا\nالى العالى » أولا يبحعلون ؟ قد يقولون هذا , وقد يقولون هذا .\n( السابع ) إنهم يمدحون الضلال والحيرة , والظل والخطأ, والعذات الذى\nعذ ب الله به العم ؛ ويقلبونكلاءالته وكلام رسو لدقلبا يعلإفساده بضروراتالعقول\nمثل قول صاحب الفصوص : أو أن نوحا ما جمع لقومه بين الدعوتين لأجابوه\nفدعاه جباراً , ثم دعام إسراراً ‏ إلى أن قال : وذكر عن قومه أنهم تصاموا\nعن دعوته » لعلمهم بما يحب عايهم من إجابة دعوته , فعلم العلماء ببالله ما أشار\nإليه نوح فى حق قومه ؛ من الثناء عليهم بلسارنل الذم, وعل أنهم إنمال يحيبوا\nدعوته لما يها من الفرقان . والأم قرآن لا فرقان . ومن أقيم فى القرآن ١‏\nلا يصغى إلى الفرقان ؛ وإن كان فيه .\nفيمدحون وتحمدون ما ذمه الله ولعنه » ونبى عنه ٠‏ وبأتون من الإفك\n١54\nوالفرية على اله والإلحاد فى أسماء الله وآياته ؛ بما:( تَحكادالسَّموتٌ يلفطرن\nنه وتََنَالارصُوَجعِرْكبَالْهَدَا ) كقول صاحب الفصوص ففص نوح .\n( مَنَاحَِد روأ ) فهى الى خطت بهم فغرقوا فى بحار العم بالله\nوهو الخيرة .\n( كَأْمِلْائو ) فى عين الماء فى المحمدتين * ( وَإِدَاالِسَارْسْييَرَتَ )\nبحرت التنور إذا أوقدته ( لَرَححدُوطم من ذو نس أنصارًا ) : فكان الله عبن\nأنصارم ؛ فهلكوا فيه إلى الأ بد , فلو أخرجتهم إلى السيف سيف الطبيعة :\nلأزلوا عن هذه الدرجة الرفيعة » وإن كان الكل ننه » وبالله » بل هو الله .\n( وَ",

                "text": "ن لقيه يشرك به شيئا دخل النار\" 5. PageV01P018\n\nفيه مسائل:\n\nالأولى: الخوف من الشرك.\n\nالثانية: الرياء من ms05 الشرك.\n\nالثالثة: أنه من الشرك الأصغر.\n\nالرابعة: أنه أخوف ما يخاف منه على الصالحين.\n\nالخامسة: قرب الجنة والنار.\n\nالسادسة: الجمع بين قربهما 1 في حديث واحد.\n\nالسابعة: أنه من لقيه لا يشرك به شيئا دخل الجنة، ومن لقيه يشرك به شيئا\n\nدخل النار، ولو كان من أعبد الناس.\n\nالثامنة: المسألة العظيمة: سؤال الخليل له ولبنيه وقاية عبادة الأصنام.\n\nالتاسعة: اعتباره بحال الأكثر لقوله: {رب إنهن أضللن كثيرا من الناس} 2.\n\nالعاشرة: فيه تفسير \" لا إله إلا الله \"، كما ذكره البخاري.\n\nالحادية عشرة: فضيلة من سلم من الشرك. PageV01P019\n\n### | باب (4) الدعاء إلى شهادة أن لا إله إلا الله\n\nوقوله تعالى: {قل هذه سبيلي أدعو إلى الله على بصيرة أنا ومن اتبعني\n\nوسبحان الله وما أنا من المشركين} 1.\n\nعن ابن عباس رضي الله عنهما: أن رسول الله صلى الله عليه وسلم لما بعث\n\nمعاذا إلى اليمن قال له:?\"إنك تأتي قوما من أهل الكتاب، فليكن أول ما\n\nتدعوهم إليه شهادة أن لا إله إلا الله\" 2.\n\n- وفي رواية: \"إلى أن يوحدوا الله. فإن هم أطاعوك لذلك فأعلمهم أن الله\n\nافترض عليهم خمس صلوات في كل يوم وليلة. فإن هم أطاعوك لذلك فأعلمهم أن\n\nالله افترض عليهم صدقة تؤخذ من أغنيائهم فترد على فقرائهم. فإن هم أطاعوك\n\nلذلك فإياك وكرائم أموالهم. واتق دعوة المظلوم فإنه ليس بينها وبين الله\n\nحجاب\" 3 أخرجاه.\n\nولهما عن سهل بن سعد رضي الله عنه أن رسول الله صلى الله عليه وسلم قال\n\nيوم خيبر: \"لأعطين الراية غدا رجلا يحب الله PageV01P020\n\nورسوله ويحبه الله ورسوله، يفتح الله على يديه. فبات الناس يدوكون ليلتهم\n\nأيهم يعطاها فلما أصبحوا غدوا على رسول الله صلى الله عليه وسلم كلهم يرجو\n\nأن يعطاها: فقال: أين علي بن أبي طالب؟ فقيل: هو يشتكي عينيه. فأرسلوا إليه\n\nفأتي به، فبصق في عينيه ; ودعا له فبرأ كأن لم يكن به وجع. فأعطاه الراية\n\nفقال: انفذ على رسلك حتى تنزل بساحتهم، ثم ادعهم إلى الإسلام وأخبرهم بما\n\nيجب عليهم من ms06 حق الله تعالى فيه.\n\nفوالله لأن يهدي الله بك رجلا واحدا خير لك من حمر النعم\" 1يدوكون أي:\n\nيخوضون.\n\nفيه مسائل:\n\nالأولى: أن الدعوة إلى ال                 "text": "سوله. فيقول: يا رب ما هذه البطاقة مع هذه السجلات، فيقال إنك\n\nلا تظلم، فتوضع السجلات في كفة، والبطاقة في كفة فطاشت السجلات وثقلت\n\nالبطاقة \" رواه الترمذي وحسنه. والنسائي وابن حبان والحاكم. وقال: صحيح على\n\nشرط مسلم، وقال الذهبي في تلخيصه: صحيح 2.\n\nقال ابن القيم - رحمه الله -: \"فالأعمال لا تتفاضل بصورها وعددها، وإنما\n\nتتفاضل بتفاضل ما في القلوب، فتكون ms040 صورة العملين واحدة وبينهما من التفاضل\n\nكما بين السماء والأرض. قال: وتأمل حديث البطاقة التي توضع في كفة ويقابلها\n\nتسعة وتسعون سجلا كل سجل منها مد البصر، فتثقل البطاقة وتطيش السجلات، فلا\n\nيعذب. ومعلوم أن كل موحد له هذه البطاقة وكثير منهم يدخل النار بذنوبه\".\n\nقوله: \"رواه ابن حبان والحاكم\" ابن حبان اسمه محمد بن حبان - بكسر\n\nالمهملة وتشديد الموحدة - ابن أحمد بن حبان بن معاذ، أبو حاتم التميمي\n\nالبستي الحافظ صاحب التصانيف: كالصحيح، والتاريخ، والضعفاء، والثقات وغير\n\nذلك. قال الحاكم: كان من أوعية العلم في الفقه واللغة والحديث والوعظ، ومن\n\nعقلاء الرجال. مات سنة أربع وخمسين وثلاثمائة بمدينة بست - بضم الموحدة\n\nوسكون المهملة -.\n\nرواه ابن حبان والحاكم وصححه.\n\nوللترمذي - وحسنه - عن أنس: سمعت رسول الله صلي الله عليه وسلم يقول: \"\n\nقال الله تعالى: يا ابن آدم لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك\n\nبي شيئا لأتيتك بقرابها مغفرة \" 3.\n\nوأما الحاكم فاسمه محمد بن عبد الله بن محمد النيسابوري أبو عبد الله\n\nالحافظ، ويعرف بابن البيع، ولد سنة إحدى وعشرين وثلاثمائة، وصنف التصانيف،\n\nكالمستدرك وتاريخ نيسابور وغيرهما، ومات سنة خمس وأربعمائة. PageV01P052\n\nقال المصنف - رحمه الله -: \"وللترمذي; وحسنه، عن أنس: سمعت رسول الله صلي\n\nالله عليه وسلم يقول: \" قال الله تعالى: يا ابن آدم; إنك لو أتيتني بقراب\n\nالأرض خطايا ثم لقيتني لا تشرك بي شيئا لأتيتك بقرابها مغفرة1 \" ذكر المصنف\n\n- رحمه الله - الجملة الأخيرة من الحديث، وقد رواه الترمذي بتمامه فقال: عن\n\nأنس قال: سمعت رسول الله صلي الله عليه وسلم يقول: \" قال الله تبارك\n\nوتعالى: يا ابن آدم; إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا\n\nأبالي; يا ابن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك ولا\n\nأبالي يا ابن آدم إنك لو أتيتني \" الحديث.\n\nفيه مسائل:\n\nالأولى: سعة فضل الله.\n\nالثانية: كثرة ثواب التوحيد عند الله.\n\nالثالثة: تكفيره مع ذلك للذنوب.\n\nالرابعة: تفسير الآية التي في سورة الأنعام.\n\nالخامسة: تأمل ms041 الخمس اللواتي في حديث عبادة.\n\nالترمذي: اسمه محمد بن عيسى بن سورة - بفتح المهملة - ابن موسى بن الضحاك\n\nالسلمي أبو عيسى، صاحب الجامع وأحد الحفاظ، كان ضرير البصر، روى عن قتيبة\n\nوهناد والبخاري وخلق. مات سنة تسع وسبعين ومائتين.\n\nوأنس: هو ابن مالك بن النضر الأنصاري الخزرجي، خادم رسول الله صلي الله\n\nعليه وسلم خدمه عشر سنين، وقال له: \" اللهم أكثر ماله وولده، وأدخله الجنة\n\n\" 2 مات سنة اثنتين وقيل: ثلاث وتسعين، وقد جاوز المائة.\n\nوالحديث قد رواه الإمام أحمد من حديث أبي ذر بمعناه، وهذا لفظه: \" ومن\n\nعمل قراب الأرض خطيئة ثم لقيني لا يشرك بي جعلت له مثلها مغفرة 3\" ورواه\n\nمسلم، وأخرجه الطبراني من حديث ابن عباس عن النبي صلي الله عليه وسلم قوله:\n\n\"لو أتيتني بقراب الأرض\" بضم القاف: وقيل بكسرها والضم أشهر وهو\n\nPageV01P053\n\nملؤها أو ما يقارب ملئها.\n\nقوله: \"ثم لقيتني لاتشرك بي شيئا\" شرط ثقيل في الوعد بحصول المغفرة، وهو\n\nالسلامة من الشرك: كثيره وقليله، صغيره وكبيره. ولا يسلم من ذلك إلا من سلم\n\nالله تعالى، وذلك هو القلب السليم كما قال تعالى: {يوم لا ينفع مال ولا\n\nبنون إلا من أتى الله بقلب سليم} 1.\n\nالسادسة: أنك إذا جمعت بينه وبين حديث عتبان وما بعده تبين لك معنى قول:\n\n\" لا إله إلا الله\"، وتبين لك خطأ المغرورين 2.\n\nقال ابن رجب: من جاء مع التوحيد بقراب الأرض خطايا لقيه الله بقرابها\n\nمغفرة - إلى أن قال - فإن كمل توحيد العبد وإخلاصه لله تعالى فيه، وقام\n\nبشروطه بقلبه ولسانه وبجوارحه، أو بقلبه ولسانه عند الموت، أوجب ذلك مغفرة\n\nما قد سلف من الذنوب كلها، ومنعه من دخول النار بالكلية. فمن تحقق بكلمة\n\nالتوحيد قلبه أخرجت منه كل ما سوى الله: محبة وتعظيما، وإجلالا ومهابة\n\nوخشية وتوكلا، وحينئذ تحرق ذنوبه وخطاياه كلها، وإن كانت مثل زبد البحر. اه\n\nملخصا.\n\nقال العلامة ابن القيم - رحمه الله تعالى - في معنى الحديث: \"ويعفى لأهل\n\nالتوحيد المحض الذي لم يشوبوه بالشرك ما لا ms042 يعفى لمن ليس كذلك. فلو لقي\n\nالموحد الذي لم يشرك بالله شيئا ألبته ربه بقراب الأرض خطايا أتاه بقرابها\n\nمغفرة; ولا يحصل هذا لمن نقص توحيده؛ فإن التوحيد الخالص الذي لا يشوبه شرك\n\nلا يبقى معه ذنب؛ لأنه يتضمن من محبة الله وإجلاله وتعظي",

                "text": "واط. فمررنا بسدرة ; فقلنا: يا رسول الله، اجعل لنا\n\nذات أنواط كما لهم ذات أنواط ; فقال رسول الله صلى الله عليه وسلم: الله\n\nأكبر، إنها السنن. قلتم والذي نفسي بيده كما قالت بنو إسرائيل لموسى: {اجعل\n\nلنا إلها كما لهم آلهة قال إنكم قوم تجهلون} 2 لتركبن سنن من كان قبلكم\"\n\nرواه الترمذي وصححه.\n\nفيه مسائل:\n\nالأولي: تفسير آية النجم. PageV01P032\n\nالثانية: معرفة صورة الأمر الذي طلبوا.\n\nالثالثة: كونهم لم يفعلوا.\n\nالرابعة: كونهم قصدوا التقرب إلى الله بذلك، لظنهم أنه يحبه.\n\nالخامسة: أنهم إذا جهلوا هذا فغيرهم أولى بالجهل.\n\nالسادسة. أن لهم من الحسنات والوعد بالمغفرة ما ليس لغيرهم.\n\nالسابعة. أن النبي صلى الله عليه وسلم لم يعذرهم الأمر، بل رد عليهم\n\nبقوله: \"الله أكبر، إنها السنن. لتتبعن سنن من كان قبلكم\" فغلظ الأمر بهذه\n\nالثلاث.\n\nالثامنة: الأمر الكبير، وهو المقصود: أنه أخبر أن طلبهم كطلب بني إسرائيل\n\nلما قالوا لموسى: {اجعل لنا إلها}\n\nالتاسعة: أن نفى هذا من معنى \" لا إله إلا الله \" مع دقته وخفائه على\n\nأولئك.\n\nالعاشرة: أنه حلف على الفتيا، وهو لا يحلف إلا لمصلحة.\n\nالحادية عشرة: أن الشرك فيه أكبر وأصغر، لأنهم لم يرتدوا بهذا.\n\nالثانية عشرة: قولهم: \"ونحن حدثاء عهد بكفر\" فيه أن غيرهم لا يجهل ذلك.\n\nالثالثة عشرة: التكبير عند التعجب، خلافا لمن كرهه.\n\nالرابعة عشرة: سد الذرائع.\n\nالخامسة عشرة: النهي عن التشبه بأهل الجاهلية.\n\nالسادسة عشرة: الغضب ms11 عند التعليم.\n\nالسابعة عشرة: القاعدة الكلية لقوله: \"إنها السنن\".\n\nالثامنة عشرة: أن هذا علم من أعلام النبوة، لكونه وقع كما أخبر.\n\nالتاسعة عشرة: أن 1 ما ذم الله به اليهود والنصارى في القرآن أنه لنا.\n\nالعشرون: أنه متقرر عندهم أن العبادات مبناها على الأمر، فصار فيه\n\nالتنبيه على مسائل القبر. أما \"من ربك؟ \" فواضح، وأما \" من نبيك؟ \" فمن\n\nإخباره بأنباء الغيب. وأما \" ما دينك؟ \" فمن قولهم: \" اجعل لنا \" إلى آخره.\n\nالحادية والعشرون: أن سنة أهل الكتاب مذمومة كسنة المشركين.\n\nالثانية والعشرون: أن المنتقل من الباطل الذي اعتاده قلبه لا يؤمن أن\n\nيكون في قلبه بقية من تلك العادة، لقولهم: \"ونحن حدثاء عهد بكفر\".\n\nPageV01P034\n\n### | باب (9) ما جاء في الذبح لغير الله\n\nوقول الله تعالى: {قل إن صلاتي ونسكي ومحياي ومماتي لله رب العالمين لا\n\nشريك له وبذلك أمرت وأنا أول المسلمين} 1 وقوله: {فصل لربك وانحر} 2.\n\nعن علي بن أبي طالب رضي الله عنه قال: \"حدثني رسول الله صلى الله عليه\n\nوسلم بأربع كلمات: لعن الله من ذبح لغير الله. لعن الله من لعن والديه. لعن\n\nالله من آوى محدثا ; لعن الله من غير منار الأرض\" 3 رواه مسلم.\n\nوعن طارق بن شهاب: أن رسول الله صلى الله عليه وسلم قال: \"دخل الجنة رجل\n\nفي ذباب، ودخل النار رجل في ذباب. قالوا: وكيف ذلك يا رسول الله؟ قال: مر\n\nرجلان على قوم لهم صنم لا يجوزه أحد حتى يقرب له شيئا، فقالوا لأحدهما:\n\nقرب. قال ليس عندي شيء أقرب. PageV01P035\n\nقالوا له: قرب ولو ذبابا. فقرب ذبابا، فخلوا سبيله. فدخل النار. وقالوا\n\nللآخر: قرب. فقال: ما كنت لأقرب لأحد شيئا دون الله (، فضربوا عنقه؛ فدخل\n\nالجنة\" رواه أحمد.\n\nفيه مسائل:\n\nالأولي: تفسير {إن صلاتي ونسكي} 1.\n\nالثانية: تفسير {فصل لربك وانحر} 2.\n\nالثالثة: البداءة بلعنة من ذبح لغير الله.\n\nالرابعة: لعن من لعن والديه، ومنه أن تلعن والدي الرجل فيلعن والديك.\n\nالخامسة: لعن من آوى محدثا، وهو الرجل يحدث شيئا يجب فيه حق الله، ms12 فيلتجئ\n\nإلى من يجيره من ذلك.\n\nالسادسة: لعن من غير منار الأرض، وهي المراسيم التي تفرق بين ح",

            "fath": {
                "text": "فإن الطائفة الممتنعة تقاتل عليها وإن كانت مقرة بها، وهذا مما لا\n\nأعلم فيه خلافا بين العلماء. قال: وهؤلاء عند المحققين ليسوا بمنزلة\n\nالبغاة، بل هم خارجون عن الإسلام\". انتهى.\n\nقوله: \"وحسابه على الله\" أي الله تبارك وتعالى هو الذي يتولى حساب الذي\n\nيشهد بلسانه بهذه الشهادة، فإن كان صادقا جازاه بجنات النعيم، وإن كان\n\nمنافقا عذبه العذاب الأليم. وأما في الدنيا فالحكم على الظاهر، فمن أتى\n\nبالتوحيد ولم يأت بما ينافيه ظاهرا والتزم شرائع الإسلام وجب الكف عنه.\n\nقلت: وأفاد الحديث أن الإنسان قد يقول: \"لا إله إلا الله\" ولا يكفر بما\n\nيعبدون\n\nومنها: قوله صلي الله عليه وسلم: \" من قال لا إله إلا الله وكفر بما يعبد\n\nمن دون الله، حرم ماله ودمه، وحسابه على الله \" 6 وهذا من أعظم ما يبين\n\nمعنى: \" لا إله إلا الله\" فإنه لم يجعل التلفظ بها عاصما للذم والمال، بل\n\nولا معرفة معناها مع لفظها، بل ولا الإقرار بذلك، بل ولا كونه لا يدعو إلا\n\nالله وحده لا شريك له، بل لا يحرم ماله ودمه حتى يضيف إلى ذلك الكفر بما\n\nيعبد من دون الله. فإن شك أو توقف لم يحرم ماله ودمه.\n\nفيا لها من مسألة ما أعظمها وأجلها! ويا له من بيان ما أوضحه، وحجة ما\n\nأقطعها للمنازع!.\n\nمن دون الله فلم يأت بما يعصم دمه وماله كما دل على ذلك الآيات المحكمات\n\nوالأحاديث.\n\nقوله: \"وشرح هذه الترجمة ما بعدها من الأبواب\"7 قلت: وذلك أن ما بعدها\n\nPageV01P113\n\nمن الأبواب فيه ما يبين التوحيد ويوضح معنى \"لا إله إلا الله\". وفيه\n\nأيضا: بيان أشياء كثيرة من الشرك الأصغر والأكبر ما يوصل إلى ذلك من الغلو\n\nوالبدع، مما تركه من مضمون \"لا إله إلا الله\"، فمن عرف ذلك وتحققه، تبين ms081 له\n\nمعنى \"لا إله إلا الله\" وما دلت عليه من الإخلاص ونفي الشرك، وبضدها تتبين\n\nالأشياء، فبمعرفة الأصغر من الشرك يعرف ما هو أعظم منه من الشرك الأكبر\n\nالمنافي للتوحيد، وأما الأصغر فإنما ينافي كماله، فمن اجتنبه فهو الموحد\n\nحقا، وبمعرفة وسائل الشرك والنهي عنها لتجتنب تعرف الغايات التي نهى عن\n\nالوسائل لأجلها، فإن اجتناب ذلك كله يستلزم التوحيد والإخلاص بل يقتضيه.\n\nوفيه أيضا من أدلة التوحيد إثبات الصفات وتنزيه الرب تعالى عما لا يليق\n\nبجلاله، وكل ما يعرف بالله من صفات كماله وأدلة ربوبيته يدل على أنه هو\n\nالمعبود وحده، وأن العبادة لا تصلح إلا له، وهذا هو التوحيد، ومعنى شهادة\n\nأن لا إله إلا الله\n\n### | باب: \"من الشرك لبس الحلقة والخيط ونحوهما لرفع البلاء أو دفعه\"\n\nوقوله تعالى: {قل أفرأيتم ما تدعون من دون الله إن أرادني الله بضر هل هن\n\nكاشفات ضره أو أرادني برحمة هل هن ممسكات رحمته قل حسبي الله عليه يتوكل\n\nالمتوكلون} 1. PageV01P116\n\nعن عمران بن حصين رضي الله عنه \" أن النبي صلي الله عليه وسلم رأى رجلا\n\nفي يده حلقة من صفر، فقال: ما هذا؟ قال من الواهنة. فقال: انزعها فإنها لا\n\nتزيدك إلا وهنا؛ فإنك لو مت وهي عليك ما أفلحت أبدا \" 1 رواه أحمد بسند لا\n\nبأس به.\n\nوإنما كانوا يدعونها على معنى أنها وسائط وشفعاء عند الله، لا على أنهم\n\nيكشفون الضر، ويجيبون دعاء المضطر، فهم يعلمون أن ذلك لله وحده. كما قال\n\nتعالى: {إذا مسكم الضر فإليه تجأرون ثم إذا كشف الضر عنكم إذا فريق منكم\n\nبربهم يشركون} 2.\n\nقلت: فهذه الآية وأمثالها تبطل تعلق القلب بغير الله في جلب نفع أو دفع\n\nضر، وأن ذلك شرك بالله. وفي الآية بيان أن الله تعالى وسم أهل الشرك بدعوة\n\nغير الله والرغبة إليه من دون الله. والتوحيد ضد ذلك. وهو أن لا يدعو إلا\n\nالله، ولا يرغب إلا إليه، ولا يتوكل إلا عليه، وكذا جميع أنواع العبادة لا\n\nيصلح منها شيء لغير ms082 الله. كما دل على ذلك الكتاب والسنة وإجماع سلف الأمة\n\nوأئمتها كما تقدم. PageV01P117\n\nقال: \"وعن عمران بن حصين \"أن النبي صلي الله عليه وسلم رأى رجلا في يده\n\nحلقة من صفر فقال ما هذه؟ قال: من الواهنة. قال: انزعها فإنها لا تزيدك إلا\n\nوهنا; فإنك لو مت وهي عليك ما أفلحت أبدا \" رواه أحمد بسند لا بأس به\".\n\nقال الإمام أحمد: حدثنا خلف بن الوليد حدثنا المبارك عن الحسن قال:\n\nأخبرني عمران بن حصين \"أن النبي صلي الله عليه وسلم أبصر على عضد رجل حلقة\n\n– قال: أراها من صفر - فقال: ويحك ما هذه؟ قال: من الواهنة. قال: أما إنها\n\nلا تزيدك إلا وهنا. انبذها عنك؛ فإنك لو مت وهي عليك ما أفلحت أبدا \" 1\n\nرواه ابن حبان في صحيحه فقال: \" فإنك إن مت وكلت إليها \". والحاكم، وقال:\n\nصحيح الإسناد. وأقره الذهبي.\n\nوقال الحاكم: أكثر مشايخنا على أن الحسن سمع من عمران. وقوله في الإسناد:\n\n\"أخبرني عمران\" يدل على ذلك2.\n\nقوله: \"عن عمران بن حصين\" أي ابن عبيد بن خلف الخزاعي، أبو نجيد - بنون\n\nوجيم – مصغر، صحابي ابن صحابي، أسلم عام خيبر، ومات سنة اثنتين وخمسين\n\nبالبصرة.\n\nقوله: \"رأى رجلا\" في رواية الحاكم: \" دخلت على رسول الله صلي ا",

            "kitab": {
                "text": "يد المرسلين، وخلفه سادات الأولياء يؤمنون في الصلاة.\n\nالرابعة: أن المدعو عليهم كفار.\n\nالخامسة: أنهم فعلوا أشياء ما فعلها غالب الكفار، منها: شجهم نبيهم،\n\nوحرصهم على قتله. ومنها: التمثيل بالقتلى، مع أنهم بنو عمهم.\n\nالسادسة: أنزل الله عليه في ذلك: {ليس لك من الأمر شيء} 2.\n\nالسابعة: قوله: {أو يتوب عليهم أو يعذبهم} 3، فتاب عليهم فآمنوا.\n\nالثامنة: القنوت في النوازل.\n\nالتاسعة: تسمية المدعو عليهم في الصلاة بأسمائهم وأسماء آبائهم.\n\nPageV01P046\n\nالعاشرة: لعن المعين في القنوت.\n\nالحادية عشرة: قصته صلى الله عليه وسلم لما أنزل عليه: {وأنذر عشيرتك\n\nالأقربين} 1.\n\nالثانية عشرة: جده صلى الله عليه وسلم 2، بحيث فعل ما نسب بسببه إلى\n\nالجنون، وكذلك لو يفعله مسلم الآن.\n\nالثالثة عشرة: قوله 3 للأبعد والأقرب: ms16 \"لا أغني عنك من الله شيئا\" حتى\n\nقال: \"يا فاطمة بنت محمد، لا أغني عنك من الله شيئا\" 4. فإذا صرح وهو سيد\n\nالمرسلين بأنه لا يغني شيئا عن سيدة نساء العالمين، وآمن الإنسان أنه صلى\n\nالله عليه وسلم لا يقول إلا الحق، ثم نظر فيما وقع في قلوب خواص الناس\n\nاليوم، تبين له التوحيد وغربة الدين. PageV01P047\n\n### | باب (15) قول الله تعالى: {حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم\n\nقالوا الحق وهو العلي الكبير} 1.\n\nفي الصحيح عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال:\n\n\"إذا قضى الله الأمر في السماء ضربت الملائكة بأجنحتها خضعانا لقوله، كأنه\n\nسلسلة على صفوان ينفذهم ذلك {حتى إذا فزع عن قلوبهم قالوا ماذا قال ربكم\n\nقالوا الحق وهو العلي الكبير} 2 فيسمعها مسترق السمع - ومسترق السمع هكذا\n\nبعضه فوق بعض - وصفه سفيان بكفه فحرفها وبدد بين أصابعه - فيسمع الكلمة\n\nفيلقيها إلى من تحته، ثم يلقيها الآخر إلى من تحته، حتى يلقيها على لسان\n\nالساحر أو الكاهن. فربما أدركه الشهاب قبل أن يلقيها، وربما ألقاها قبل أن\n\nيدركه، فيكذب معها مائة كذبة. فيقال: أليس قد قال لنا يوم كذا وكذا كذا\n\nوكذا؟ فيصدق بتلك الكلمة التي سمعت من السماء\".\n\nوعن النواس بن سمعان رضي الله عنه قال: قال رسول الله صلى الله عليه\n\nوسلم: \"إذا أراد الله تعالى أن يوحي بالأمر تكلم بالوحي أخذت السموات منه\n\nرجفة - أو قال رعدة - شديدة خوفا من الله (؛ فإذا سمع ذلك أهل السموات\n\nصعقوا، وخروا لله سجدا. فيكون PageV01P048\n\nأول من يرفع رأسه جبريل، فيكلمه الله من وحيه بما أراد. ثم يمر جبريل على\n\nالملائكة، كلما مر بسماء سأله ملائكتها: ماذا قال ربنا يا جبريل؟ فيقول\n\nجبريل قال الحق وهو العلي الكبير فيقولون كلهم مثل ما قال جبريل فينتهي\n\nجبريل بالوحي إلى حيث أمره الله)\n\nفيه مسائل:\n\nالأولي: تفسير الآية.\n\nالثانية: ما فيها من الحجة على إبطال الشرك، خصوصا ما تعلق على الصالحين،\n\nوهي الآية التي ms17 قيل: إنها تقطع عروق شجرة الشرك من القلب.\n\nالثالثة. تفسير قوله: {قالوا الحق وهو العلي الكبير} 1.\n\nالرابعة: سبب سؤالهم عن ذلك.\n\nالخامسة: أن جبرائيل يجيبهم بعد ذلك بقوله: \" قال كذا وكذا \".\n\nالسادسة: ذكر أن أول من يرفع رأسه جبرائيل.\n\nالسابعة: أنه يقول لأهل السموات كلهم، لأنهم يسألونه.\n\nالثامنة: أن الغشي يعم أهل السموات كلهم.\n\nالتاسعة: ارتجاف السموات بكلام الله.\n\nالعاشرة: أن جبرائيل هو الذي ينتهي بالوحي إلى حيث أمره الله.\n\nالحادية عشرة: ذكر استراق الشياطين. PageV01P049\n\nالثانية عشرة: صفة ركوب بعضهم بعضا.\n\nالثالثة عشرة: إرسال الشهاب 1.\n\nالرابعة عشرة: أنه تارة يدركه الشهاب قبل أن يلقيها، وتارة يلقيها في أذن\n\nوليه من الإنس قبل أن يدركه.\n\nالخامسة عشرة: كون الكاهن",

                "text": "الأمر\n\nوالمخاطبة للنبي صلي الله عليه وسلم. إذا كانت هكذا فأحرى أن يحذر من ذلك\n\nغيره. والخطاب خرج مخرج الخصوص وهو عام للأمة.\n\nقال أبو جعفر ابن جرير في هذه الآية: يقول - تعالى ذكره -: ولا تدع يا\n\nمحمد من دون معبودك وخالقك شيئا لا ينفعك في الدنيا ولا في الآخرة، ولا\n\nيضرك في دين ولا دنيا، يعني بذلك الآلهة والأصنام، يقول: لا تعبدها راجيا\n\nنفعها أو خائفا ضرها فإنها لا تنفع ولا تضر. فإن فعلت ذلك فدعوتها من دون\n\nالله {فإنك إذا من الظالمين} 3 يقول من المشركين بالله الظالم لنفسه4.\n\nقلت: وهذه الآية لها نظائر كقوله: {فلا تدع مع ms121 الله إلها آخر فتكون من\n\nالمعذبين} 5. وقوله: {ولا تدع مع الله إلها آخر لا إله إلا هو} 6. ففي هذه\n\nالآيات بيان أن كل مدعو يكون إلها، والإلهية حق لله لا يصلح منها شيء\n\nلغيره. ولهذا قال: {لا إله إلا هو} 7 كما قال تعالى: {ذلك بأن الله هو الحق\n\nوأن ما يدعون من دونه هو الباطل وأن الله هو العلي الكبير} 8 وهذا هو\n\nالتوحيد الذي بعث الله به رسله، وأنزل به كتبه; كما قال تعالى: {وما أمروا\n\nإلا ليعبدوا الله مخلصين له الدين} 9. والدين: كل ما يدان الله به من\n\nالعبادات الظاهرة والباطنة. وفسره ابن جرير في تفسيره بالدعاء، وهو فرد من\n\nأفراد العبادة، على عادة السلف في التفسير، يفسرون الآية ببعض أفراد\n\nمعناها، فمن صرف منها شيئا لقبر أو صنم أو وثن أو غير ذلك، فقد اتخذه\n\nمعبودا وجعله شريكا لله في PageV01P171\n\nالإلهية التي لا يستحقها إلا هو، كما قال تعالى: {ومن يدع مع الله إلها\n\nآخر لا برهان له به فإنما حسابه عند ربه إنه لا يفلح الكافرون} 1. فتبين\n\nبهذه الآية ونحوها أن دعوة غير الله كفر وشرك وضلال.\n\nوقوله: {وإن يمسسك الله بضر فلا كاشف له إلا هو وإن يردك بخير فلا راد\n\nلفضله} 23 فإنه المنفرد بالملك والقهر، والعطاء والمنع، والضر والنفع، دون\n\nكل ما سواه. فيلزم من ذلك أن يكون هو المدعو وحده، المعبود وحده; فإن\n\nالعبادة لا تصلح إلا لمالك الضر والنفع. ولا يملك ذلك ولا شيئا منه غيره\n\nتعالى، فهو المستحق للعبادة وحده، دون من لا يضر ولا ينفع. وقوله تعالى:\n\n{قل أفرأيتم ما تدعون من دون الله إن أرادني الله بضر هل هن كاشفات ضره أو\n\nأرادني برحمة هل هن ممسكات رحمته قل حسبي الله عليه يتوكل المتوكلون} 5.\n\nوقال {ما يفتح الله للناس من رحمة فلا ممسك لها وما يمسك فلا مرسل له من\n\nبعده وهو العزيز الحكيم} 6. فهذا ما أخبر به الله تعالى في كتابه من تفرده\n\nبالإلهية والربوبية، ونصب ms122 الأدلة على ذلك. فاعتقد عباد القبور والمشاهد\n\nنقيض ما أخبر به الله تعالى، واتخذوهم PageV01P172\n\nشركاء لله في استجلاب المنافع ودفع المكاره، بسؤالهم والالتجاء إليهم\n\nبالرغبة والرهبة والتضرع، وغير ذلك من العبادات التي لا يستحقها إلا الله\n\nتعالى، واتخذوهم شركاء لله في ربوبيته وإلهيته. وهذا فوق شرك كفار العرب\n\nالقائلين: {ما نعبدهم إلا ليقربونا إلى الله زلفى} 1، {هؤلاء شفعاؤنا عند\n\nالله} 2 فإن أولئك يدعونهم ليشفعوا لهم ويقربوهم إلى الله، وكانوا يقولون\n\nفي تلبيتهم: لبيك، لا شريك لك إلا شريكا هو لك تملكه وما ملك.\n\nوأما هؤلاء المشركون فاعتقدوا في أهل القبور والمشاهد ما هو أعصم من ذلك،\n\nفجعلوا لهم نصيبا من التصرف والتدبير، وجعلوهم معاذا لهم وملاذا في الرغبات\n\nوالرهبات {سبحان الله عما يشركون} 3.\n\nوقوله: {وهو الغفور الرحيم} 4 أي لمن تاب إليه.\n\nقال: \"وقوله تعالى: {فابتغوا عند الله الرزق واعبدوه واشكروا له إليه\n\nترجعون} 5\".\n\nوقوله: {ومن أضل ممن يدعو من دون الله من لا يستجيب له إلى يوم القيامة\n\nوهم عن دعائهم غافلون} 6.\n\nيأمر تعالى عباده بابتغاء الرزق منه وحده دون ما سواه ممن لا يملك لهم\n\nرزقا من السماوات والأرض شيئا، فتقديم الظرف يفيد الاختصاص. وقوله:\n\n{واعبدوه} من عطف العام على الخاص؛ فإن ابتغاء الرزق عنده من العبادة التي\n\nأمر الله بها.\n\nقال العماد ابن كثير - رحمه الله تعالى -: {فابتغوا} أي فاطلبوا {عند\n\nالله الرزق} أي لا عند غيره. لأنه المالك له، وغيره لا يملك شيئا من ذلك:\n\n{واعبدوه} أي أخلصوا له العبادة وحده لا شريك له {واشكروا له} أي على ما\n\nأنعم عليكم {إليه ترجعون} أي يوم القيامة فيجازي كل عامل بعمله.\n\nقال: \"وقوله: {ومن أضل ممن يدعو من دون الله من لا يستجيب له إلى يوم\n\nالقيامة وهم عن دعائهم غافلون وإذا حشر الناس كانوا لهم أعداء وكانوا\n\nبعبادتهم كافرين} 7\".\n\nنفى سبحانه أن يكون أحد أضل ممن يدعو غيره. وأخبر أنه لا يستجيب\n\nPageV01P173\n\nله ما طلب منه إلى يوم القيامة. والآية تعم كل ما يدعى من ms123 دون الله، كما\n\nقال تعالى: {قل ادعوا الذين زعمتم من دونه فلا يملكون كشف الضر عنكم ولا\n\nتحويلا} 1. وفي هذه الآية أخبر أنه لا يستجيب وأنه غافل عن داعيه {وإذا حشر\n\nالناس كانوا لهم أعداء وكانوا بعبادتهم كاف",

                "text": ".\n\nالخامسة عشرة: التصريح بأنهم لم يريدوا إلا الشفاعة.\n\nالسادسة عشرة: ظنهم أن العلماء الذين صوروا الصور أرادوا ذلك.\n\nPageV01P058\n\nالسابعة عشرة: البيان العظيم في قوله: \"لا تطروني كما أطرت النصارى ابن\n\nمريم\" 1. فصلوات الله ms21 وسلامه على من بلغ البلاغ المبين.\n\nالثامنة عشرة: نصيحته إيانا بهلاك المتنطعين.\n\nالتاسعة عشرة: التصريح بأنها لم تعبد حتى نسي العلم، ففيها بيان معرفة\n\nقدر وجوده، ومضرة فقده.\n\nالعشرون: أن سبب فقد العلم موت العلماء. PageV01P059\n\n### | باب (19) ما جاء من التغليظ فيمن عبد الله عند قبر رجل صالح، فكيف إذا عبده؟\n\nفي الصحيح عن عائشة: \"أن أم سلمة ذكرت لرسول الله صلى الله عليه وسلم\n\nكنيسة رأتها بأرض الحبشة وما فيها من الصور، فقال: أولئك إذا مات فيهم\n\nالرجل الصالح أو العبد الصالح بنوا على قبره مسجدا، وصوروا فيه تلك الصور؛\n\nأولئك شرار الخلق عند الله\" 1. فهؤلاء جمعوا بين فتنتين: فتنة القبور،\n\nوفتنة التماثيل.\n\nولهما، عنها، قالت: \"لما نزل برسول الله صلى الله عليه وسلم، طفق يطرح\n\nخميصة له على وجهه، فإذا اغتم بها كشفها فقال -: وهو كذلك- لعنة الله على\n\nاليهود والنصارى، اتخذوا قبور أنبيائهم مساجد. يحذر ما صنعوا، ولولا ذلك\n\nأبرز قبره، غير أنه خشي أن يتخذ مسجدا\" 2 أخرجاه.\n\nولمسلم عن جندب بن عبد الله قال: سمعت النبي صلى الله عليه وسلم\n\nPageV01P060\n\nقبل أن يموت بخمس، وهو يقول: \"إني أبرأ إلى الله أن يكون لي منكم خليل،\n\nفإن الله قد اتخذني خليلا كما اتخذ إبراهيم خليلا. ولو كنت متخذا من أمتي\n\nخليلا لاتخذت أبا بكر خليلا. ألا وإن من كان قبلكم كانوا يتخذون قبور\n\nأنبيائهم مساجد؛ ألا فلا تتخذوا القبور مساجد، فإني أنهاكم عن ذلك\" 1. فقد\n\nنهى عنه في آخر حياته. ثم إنه لعن - وهو في السياق - من فعله. والصلاة\n\nعندها من ذلك وإن لم يبن مسجد، وهو معنى قولها: \"خشي أن يتخذ مسجدا\" 2، فإن\n\nالصحابة لم يكونوا ليبنوا حول قبره مسجدا، وكل موضع قصدت الصلاة فيه فقد\n\nاتخذ مسجدا، بل كل موضع يصلى فيه يسمى مسجدا، كما قال صلى الله عليه وسلم:\n\n\"جعلت لي الأرض مسجدا وطهورا\" 3.\n\nولأحمد بسند جيد عن ابن مسعود رضي الله عنه مرفوعا: \"إن من شرار الناس من\n\nتدركهم الساعة وهم أحياء، والذين يتخذون ms22 القبور مساجد\" 4 ورواه أبو حاتم في\n\nصحيحه.\n\nفيه مسائل:\n\nالأولى: ما ذكر الرسول فيمن بنى مسجدا يعبد الله فيه عند قبر رجل صالح،\n\nولو صحت نية الفاعل.\n\nالثانية: النهي عن التماثيل، وغلظ الأمر في ذلك 5. PageV01P061\n\nالثالثة: العبرة في مبالغته صلى الله عليه وسلم في ذلك. كيف بين لهم هذا\n\nأولا، ثم قبل موته بخمس، قال ما قال، ثم لما كان في السياق لم يكتف بما\n\nتقدم.\n\nالرابعة: نهيه عن فعله عند قبره قبل أن يوجد القبر.\n\nالخامسة: أنه من سنن اليهود والنصارى في قبور أنبيائهم.\n\nالسادسة: لعنه إياهم على ذلك.\n\nالسابعة: أن مراده تحذيره إيانا عن قبره 1.\n\nالثامنة: العلة في عدم إبراز قبره.\n\nالتاسعة: في معنى اتخاذها مسجدا.\n\nالعاشرة: أنه قرن بين من اتخذها 2 وبين من تقوم عليه الساعة، فذكر\n\nالذريعة إلى الشرك قبل وقوعه مع خاتمته.\n\nالحادية عشرة: ذكره في خطبته قبل موته بخمس: الرد على الطائفتين اللتين\n\nهما شرار أهل البدع، بل أخرجهم بعض أهل العلم من الثنتين والسبعين فرقة،\n\nوهم الرافضة والجهمية. وبسبب الرافضة حدث الشرك وعبادة القبور ; وهم أول من\n\nبنى عليها المساجد. PageV01P062\n\nالثانية عشرة: ما بلي به صلى الله عليه وسلم من شدة النزع.\n\nالثالثة عشرة: ما أكرم به من الخلة.\n\nالرابعة عشرة: التصريح بأنها أعلى من المحبة.\n\nالخامسة عشرة: التصريح بأ",

            "fath": {
                "text": "ن بعده تبين له غربة الإسلام، ورأى من\n\nقدرة الله وتقليبه للقلوب العجب.\n\nالثانية: معرفة أول شرك حدث في الأرض أنه بشبهة الصالحين.\n\nالثالثة: أول شيء غير به دين الأنبياء، وما سبب ذلك مع معرفة أن الله\n\nأرسلهم.\n\nالرابعة: قبول البدع مع كون الشرائع والفطر تردها.\n\nالخامسة: أن سبب ms161 ذلك كله مزج الحق بالباطل، فالأول: محبة الصالحين.\n\nوالثاني: فعل أناس من أهل العلم شيئا أرادوا به خيرا، فظن من بعدهم أنهم\n\nأرادوا به غيره.\n\nالسادسة: تفسير الآية التي في سورة نوح. PageV01P227\n\nالكلام الداخلين فيما لا يعنيهم، الخائضين فيما لا تبلغه عقولهم\".\n\nومن التنطع: الامتناع من المباح مطلقا، كالذي يمتنع من أكل اللحم والخبز،\n\nالسابعة: جبلة الآدمي1 في كون الحق ينقص في قلبه والباطل يزيد.\n\nالثامنة: فيه شاهد لما نقل عن السلف أن البدع سبب الكفر.\n\nالتاسعة: معرفة الشيطان بما تئول إليه البدعة، ولو حسن قصد الفاعل.\n\nالعاشرة: معرفة القاعدة الكلية، وهي النهي عن الغلو ومعرفة ما تئول إليه.\n\nالحادية عشرة: مضرة العكوف على القبر لأجل عمل صالح.\n\nالثانية عشرة: معرفة النهي عن التماثيل والحكمة في إزالتها.\n\nالثالثة عشرة: معرفة شأن هذه القصة وشدة الحاجة إليها مع الغفلة عنها.\n\nالرابعة عشرة: وهي أعجب، وأعجب قراءتهم إياها في كتب التفسير والحديث\n\nومعرفتهم بمعنى الكلام، وكون الله حال بينهم وبين قلوبهم، حتى اعتقدوا أن\n\nفعل قوم نوح أفضل العبادات، فاعتقدوا أن ما نهى الله ورسوله عنه فهو الكفر\n\nالمبيح للدم والمال.\n\nالخامسة عشرة: التصريح بأنهم لم يريدوا إلا الشفاعة.\n\nومن لبس الكتان والقطن، ولا يلبس إلا الصوف، ويمتنع من نكاح النساء، ويظن\n\nأن هذا من الزهد المستحب. قال الشيخ تقي الدين: \" فهذا جاهل ضال\". انتهى.\n\nوقال ابن القيم -رحمه الله-: قال الغزالي: \" والمتنطعون في البحث\n\nوالاستقصاء\".\n\nوقال أبو السعادات: \" هم المتعمقون الغالون في الكلام، المتكلمون بأقصى\n\nحلوقهم. مأخوذ من النطع، وهو الغار الأعلى من الفم، ثم استعمل في كل متعمق\n\nقولا وفعلا\". PageV01P228\n\nوقال النووي: \" فيه كراهة التقعر في الكلام بالتشدق وتكلف الفصاحة،\n\nواستعمال وحشي اللغة ودقائق الإعراب في مخاطبة العوام ونحوهم\".\n\nقوله: \"قالها ثلاثا\" أي قال هذه الكلمة ثلاث مرات، مبالغة في التعليم\n\nوالإبلاغ، فقد بلغ البلاغ المبين. صلوات الله وسلامه عليه وعلى آله وصحبه\n\nأجمعين.\n\nالسادسة عشرة: ظنهم أن العلماء الذين صوروا الصور أرادوا ذلك.\n\nالسابعة عشرة: البيان العظيم في قوله: ms162 \" لا تطروني كما أطرت النصارى ابن\n\nمريم \" 1 فصلوات الله وسلامه على من بلغ البلاغ المبين.\n\nالثامنة عشرة: نصيحته إيانا بهلاك المتنطعين.\n\nالتاسعة عشرة: التصريح بأنها لم تعبد حتى نسي العلم، ففيها بيان معرفة\n\nقدر وجوده ومضرة فقده.\n\nالعشرون: أن سبب فقد العلم موت العلماء. PageV01P229\n\n### | باب: \" ما جاء من التغليظ فيمن عبد الله عند قبر رجل صالح فكيف إذا عبده؟ \"\n\nفي الصحيح \" عن عائشة أن أم سلمة ذكرت لرسول الله صلي الله عليه وسلم\n\nكنيسة رأتها بأرض PageV01P229\n\nعبادته، ووسائل الشرك محرمة; لأنها تؤدي إلى الشرك الأكبر وهو أعظم\n\nالذنوب.\n\nقوله: \"في الصحيح: \"عن عائشة -رضي الله عنها- أن أم سلمة ذكرت لرسول الله\n\nصلي الله عليه وسلم كنيسة رأتها بأرض الحبشة 1 وما فيها من الصور. فقال: \"\n\nأولئك إذا مات فيهم الرجل الصالح -أو العبد الصالح-، بنوا على قبره مسجدا،\n\nوصوروا فيه تلك الصور، أولئك شرار الخلق عند الله \" 2. فهؤلاء جمعوا بين\n\nالفتنتين: فتنة القبور وفتنة التماثيل\".\n\nقوله: \"في الصحيح\" أي الصحيحين.\n\nقوله: \"أن أم سلمة\" هي هند بنت أبي أمية بن المغيرة بن عبد الله بن عمرو\n\nبن مخزوم القرشية المخزومية، تزوجها رسول الله صلي الله عليه وسلم بعد أبي\n\nسلمة سنة أربع. وقيل: الحبشة وما فيها من الصور، فقال: أولئك إذا مات فيهم\n\nالرجل الصالح -أو العبد الصالح-، بنوا على قبره مسجدا وصوروا فيه تلك\n\nالصور، أولئك شرار الخلق عند الله \"3.\n\nثلاث; وكانت قد هاجرت مع أبي سلمة إلى الحبشة4 ماتت سنة اثنتين وستين.\n\nقوله: \"ذكرت لرسول الله\" وفي الصحيحين: \" أن أم حبيبة وأم سلمة ذكرتا ذلك\n\nلرسول الله صلي الله عليه وسلم\". و\"الكنسية\" بفتح الكاف وكسر النون: معبد\n\nالنصارى.\n\nقوله: \"أولئك\" بكسر الكاف، خطاب للمرأة.\n\nقوله: \"إذا مات فيهم الرجل الصالح أو العبد الصالح\" هذا- والله أعلم- شك\n\nمن بعض رواة الحديث: هل قال النبي صلي الله عليه وسلم هذا أو هذا؟ ففيه\n\nالتحري في الرواية. وجواز الرواية بالمعنى. PageV01P230\n\nقوله: \"وصوروا فيه تلك الصور\" الإشارة إلى ما ذكرت أم سلمة ms163 وأم حبيبة من\n\nالتصاوير التي في الكنيسة.\n\nقوله: \"أولئك شرار الخلق عند الله\" وهذا يقتضي تحريم بناء المساجد على\n\nالقبور، وقد لعن صلي الله عليه وسلم من فعل ذلك كما سيأتي",

            "kitab": {
                "text": "\".\n\nوصح \"عن حفصة رضي الله عنها أنها أمرت بقتل جارية لها سحرتها فقتلت\"\n\nوكذلك صح عن جندب قال أحمد: عن ثلاثة من أصحاب النبي صلى الله عليه وسلم.\n\nفيه مسائل:\n\nالأولى: تفسير آية البقرة.\n\nالثانية: تفسير آية النساء.\n\nالثالثة: تفسير الجبت والطاغوت، والفرق بينهما.\n\nالرابعة: أن الطاغوت قد يكون من الجن، وقد يكون من الإنس.\n\nالخامسة: معرفة السبع الموبقات المخصوصات بالنهي.\n\nالسادسة: أن الساحر يكفر.\n\nالسابعة: أنه يقتل ولا يستتاب.\n\nالثامنة: وجود هذا في المسلمين على عهد عمر، فكيف بعده؟\n\n### | باب (24) بيان شيء من أنواع السحر\n\nقال أحمد: حدثنا محمد بن جعفر، حدثنا عوف، عن حيان بن العلاء، حدثنا قطن\n\nبن قبيصة عن أبيه أنه سمع النبي صلى الله عليه وسلم قال: \"إن العيافة\n\nوالطرق والطيرة من الجبت\" 1.\n\nقال عوف: العيافة: زجر الطير. والطرق: الخط يخط بالأرض.\n\nوالجبت: قال الحسن: \"رنة الشيطان\" إسناده جيد. ولأبي داود والنسائي وابن\n\nحبان في صحيحه المسند منه.\n\nوعن ابن عباس رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: \"من\n\nاقتبس شعبة من النجوم فقد اقتبس شعبة من السحر، زاد ما زاد\" 2. رواه أبو\n\nداود، وإسناده صحيح.\n\nوللنسائي من حديث أبي هريرة رضي الله عنه: \"من عقد عقدة ثم نفث فيها فقد\n\nسحر، ومن سحر فقد أشرك. ومن تعلق شيئا وكل إليه\" 3. PageV01P074\n\nوعن ابن مسعود أن رسول الله صلى الله عليه وسلم قال: \"ألا هل أنبئكم ما\n\nالعضة؟ هي النميمة القالة بين الناس\" 1 رواه مسلم. ولهما عن ابن عمر رضي\n\nالله عنهما: أن رسول الله صلى الله عليه وسلم قال: \"إن من البيان لسحرا\" 2.\n\nفيه مسائل:\n\nالأولي: أن العيافة والطرق والطيرة من الجبت.\n\nالثانية: تفسير العيافة والطرق.\n\nالثالثة: أن علم ms27 النجوم من نوع السحر.\n\nالرابعة: العقد مع النفث من ذلك.\n\nالخامسة: أن النميمة من ذلك.\n\nالسادسة: أن من ذلك بعض الفصاحة. PageV01P075\n\n### | باب (25) ما جاء في الكهان ونحوهم\n\nروى مسلم في صحيحه عن بعض أزواج النبي صلى الله عليه وسلم عن النبي صلى\n\nالله عليه وسلم قال: \"من أتى عرافا فسأله عن شيء فصدقه لم تقبل له صلاة\n\nأربعين يوما\" 1.\n\nوعن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"من أتى\n\nكاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم\" 2.\n\nرواه أبو داود. وللأربعة والحاكم وقال: صحيح على شرطهما عن أبي هريرة 3\n\n\":من أتى عرافا أو كاهنا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى\n\nالله عليه وسلم\" 4. ولأبي يعلى بسند جيد عن ابن مسعود مثله موقوفا.\n\nPageV01P076\n\nوعن عمران بن حصين رضي الله عنه مرفوعا: \"ليس منا من تطير أو تطير له أو\n\nتكهن أو تكهن له، أو سحر أو سحر له؛ ومن أتى كاهنا فصدقه بما يقول فقد كفر\n\nبما أنزل على محمد صلى الله عليه وسلم\" رواه البزار بإسناد جيد. ورواه\n\nالطبراني في الأوسط بإسناد حسن من حديث ابن عباس دون قوله: \"ومن أتى\" إلى\n\nآخره.\n\nقال البغوي: العراف: الذي يدعي معرفة الأمور بمقدمات يستدل بها على\n\nالمسروق ومكان الضالة، ونحو ذلك. وقيل: هو الكاهن. والكاهن: هو الذي يخبر\n\nعن المغيبات في المستقبل. وقيل: الذي يخبر عما في الضمير.\n\nوقال أبو العباس بن تيمية: العراف: اسم الكاهن والمنجم والرمال ونحوهم،\n\nممن يتكلم في معرفة الأمور بهذه الطرق. وقال ابن عباس - في قوم يكتبون أبا\n\nجاد وينظرون في النجوم: \"ما أرى من فعل ذلك له عند الله من خلاق\".\n\nفيه مسائل:\n\nالأولى: لا يجتمع تصديق الكاهن مع الإيمان بالقرآن.\n\nالثانية: التصريح بأنه كفر.\n\nالثالثة: كر من تكهن له.\n\nالرابعة: كر من تطير له.\n\nالخامسة: كر من سحر ل",

            "fath": {
                "text": "ها.\n\nقال النووي: يجوز أن تكون الطائفة جماعة متعددة من أنواع المؤمنين ما بين\n\nشجاع وبصير بالحرب، وفقيه ومحدث ومفسر، وقائم بالأمر بالمعروف والنهي عن\n\nالمنكر، وزاهد وعابد، ولا يلزم أن يكونوا مجتمعين في بلد واحد، بل يجوز\n\nاجتماعهم في قطر واحد، وافتراقهم في أقطار الأرض، ويجوز أن يجتمعوا في\n\nالبلد الواحد، وأن يكونوا في بعض دون بعض منه. ويجوز إخلاء الأرض من بعضهم\n\nأولا فأولا إلى أن لا يبقى إلا فرقة واحدة ببلد واحد، فإذا ms201 انقرضوا جاء أمر\n\nالله. اه ملخصا مع زيادة فيه. قاله الحافظ. PageV01P276\n\nقال القرطبي: \" وفيه دليل على أن الإجماع حجة؛ لأن الأمة إذا اجتمعت فقد\n\nدخل فيهم الطائفة المنصورة\" 1.\n\nفيه مسائل:\n\nالأولى: تفسير آية النساء.\n\nالثانية: تفسير آية المائدة.\n\nالثالثة: تفسير آية الكهف.\n\nالرابعة: - وهي أهمها- ما معنى الإيمان بالجبت والطاغوت، هل هو اعتقاد\n\nقلب، أو هو موافقة أصحابها مع بغضها ومعرفة بطلانها؟\n\nالخامسة: قولهم: إن الكفار الذين يعرفون كفرهم أهدى سبيلا من المؤمنين.\n\nالسادسة: - وهي المقصود بالترجمة- أن هذا لا بد أن يوجد في هذه الأمة،\n\nكما تقرر في حديث أبي سعد.\n\nالسابعة: التصريح بوقوعها، أعني عبادة الأوثان في هذه الأمة في جموع\n\nكثيرة.\n\nقال المصنف -رحمه الله-: \" وفيه الآية العظيمة: أنهم مع قلتهم لا يضرهم\n\nمن خذلهم ولا من خالفهم، وفيه البشارة بأن الحق لا يزول بالكلية\". قلت:\n\nواحتج به الإمام أحمد على أن الاجتهاد لا ينقطع ما دامت هذه الطائفة\n\nموجودة.\n\nقوله: \" حتى يأتي أمر الله\" الظاهر أن المراد به ما روي من قبض من بقي من\n\nالمؤمنين بالريح الطيبة; ووقوع الآيات العظام، ثم لا يبقى إلا شرار الناس،\n\nكما روى الحاكم أن عبد الله بن عمر قال: \" لا تقوم الساعة إلا على شرار\n\nالخلق، هم شر أهل الجاهلية \"2. فقال PageV01P277\n\nعقبة بن عامر لعبد الله: اعلم ما تقول، وأما أنا فسمعت النبي صلي الله\n\nعليه وسلم يقول: \" لا تزال عصابة من أمتي يقاتلون على أمر الله ظاهرين لا\n\nيضرهم من خالفهم حتى تأتيهم الساعة وهم على ذلك \"1. قال عبد الله: \" ويبعث\n\nالله ريحا ريحها المسك، ومسها مس الحرير، فلا تترك أحدا في قلبه مثقال ذرة\n\nمن إيمان إلا قبضته; ثم يبقى شرار الناس فعليهم تقوم الساعة \".\n\nوفي صحيح مسلم: \" لا تقوم الساعة حتى لا يقال في الأرض الله الله \" 2.\n\nوعلى هذا فالمراد بقوله في حديث عقبة وما أشبهه: \"حتى تأتيهم الساعة\"\n\nساعتهم. وهي وقت موتهم بهبوب الريح. ذكره الحافظ.\n\nوقد اختلف في محل هذه الطائفة، فقال ابن بطال: إنها تكون ms202 في بيت المقدس،\n\nكما رواه الطبراني من حديث أبي أمامة: \" قيل: يا رسول الله، أين هم؟ قال:\n\nببيت المقدس \"3. وقال معاذ بن جبل رضي الله عنه:\n\n\"هم بالشام\". وفي كلام الطبري ما يدل على أنه لا يجب أن تكون في الشام أو\n\nفي بيت المقدس دائما، بل قد تكون في موضع آخر في بعض الأزمنة. الثامنة:\n\nالعجب العجاب: خروج من يدعي النبوة، مثل المختار مع تكلمه بالشهادتين\n\nوتصريحه بأنه من هذه الأمة. وأن الرسول حق وأن القرآن حق. وفيه أن محمدا\n\nخاتم النبيين، ومع هذا يصدق في هذا كله مع التضاد الواضح. وقد خرج المختار\n\nفي آخر عصر الصحابة وتبعه فئام كثيرة.\n\nالتاسعة: البشارة بأن الحق لا يزول بالكلية، كما زال فيما مضى، بل لا\n\nتزال عليه طائفة.\n\nالعاشرة: الآية العظمى أنهم مع قلتهم لا يضرهم من خذلهم ولا من خالفهم.\n\nالحادية عشرة: أن ذلك الشرط إلى قيام الساعة.\n\nالثانية عشرة: ما فيهن من الآيات العظيمة. منها: إخباره بأن الله زوى له\n\nالمشارق والمغارب، وأخبر بمعنى ذلك فوقع كما أخبر، بخلاف الجنوب والشمال.\n\nوإخباره بأنه أعطي الكنزين.\n\nوإخباره بإجابة دعوته لأمته في الاثنتين.\n\nوإخباره بأنه منع الثالثة.\n\nوإخباره بوقوع السيف وأنه لا يرفع إذا وقع.\n\nوإخباره بظهور المتنبئين في هذه الأمة.\n\nوإخباره ببقاء الطائفة المنصورة.\n\nقلت: ويشهد له الواقع وحال أهل الشام وأهل بيت المقدس، فإنهم من أزمنة\n\nطويلة لا يعرف فيهم من قام بهذا الأمر بعد شيخ الإسلام ابن تيمية رضي الله\n\nعنه وأصحابه في القرن السابع وأول الثامن؛ فإنهم كانوا في زمانهم على الحق\n\nيدعون إليه، ويناظرون عليه، ويجاهدون فيه. وقد يجيء من أمثالهم بعد بالشام\n\nمن يقوم مقامهم بالدعوة إلى الحق والتمسك بالسنة. والله على كل شيء قدير4.\n\nPageV01P278\n\nومما يؤيد هذا أن أهل الحق والسنة في زمن الأئمة الأربعة وتوافر العلماء\n\nفي ذلك الزمان وقبله وبعده لم يكونوا في محل واحد، بل هم في غالب الأمصار\n\nفي الشام منهم الأئمة، وفي الحجاز وفي مصر، وفي العراق واليمن، ms203 وكلهم على\n\nالحق يناضلون، ويجاهدون أهل البدع، ولهم المصنفات التي صارت أعلاما لأهل\n\nالسنة; وحجة على كل مبتدع.\n\nفعلى هذا، فهذه الطائفة قد تجتمع وقد تتفرق، وقد تكون في الشام، وقد تكون\n\nفي غيره، فإن حديث أبي أ",
