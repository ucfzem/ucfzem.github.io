            "kitab": {
                "text": "إلا بها.\n\nالسابعة: فهم الصحابي للواقع: أن عامة المؤاخاة على أمر الدنيا.\n\nالثامنة: تفسير {وتقطعت بهم الأسباب} 3. PageV01P089\n\nالتاسعة: أن من المشركين من يحب الله حبا شديدا.\n\nالعاشرة: الوعيد على من كان الثمانية أحب إليه منه دينه.\n\nالحادية عشرة: أن من اتخذ ندا تساوي محبته محبة الله فهو الشرك الأكبر.\n\n### | باب (31) قول الله تعالى: {إنما ذلكم الشيطان يخوف أولياءه فلا تخافوهم وخافون إن كنتم مؤمنين}\n\n1 وقوله: {إنما يعمر مساجد الله من آمن بالله واليوم الآخر وأقام الصلاة\n\nوآتى الزكاة ولم يخش إلا الله فعسى أولئك أن يكونوا من المهتدين} 2.\n\nوقوله: {ومن الناس من يقول آمنا بالله فإذا أوذي في الله جعل فتنة الناس\n\nكعذاب الله} 3 -.\n\nعن أبي سعيد رضي الله عنه مرفوعا: \"إن من ضعف اليقين أن ترضي الناس بسخط\n\nالله، وأن تحمدهم على رزق الله، وأن تذمهم على ما لم يؤتك الله. إن رزق\n\nالله لا يجره حرص حريص، ولا يرده كراهية كاره\".\n\nوعن عائشة رضي الله عنها: أن رسول الله صلى الله عليه وسلم قال: ms32\n\n\"من التمس رضى الله بسخط الناس رضي الله عنه وأرضى عنه الناس؛ ومن التمس\n\nرضى الناس بسخط الله سخط الله عليه وأسخط عليه الناس\" رواه ابن حبان في\n\nصحيحه. PageV01P091\n\nفيه مسائل:\n\nالأولي: تفسير آية آل عمران.\n\nالثانية: تفسير آية براءة.\n\nالثالثة: تفسير آية العنكبوت.\n\nالرابعة: أن اليقين يضعف ويقوى.\n\nالخامسة: علامة ضغفه. ومن ذلك هذه الثلاث.\n\nالسادسة: أن إخلاص الخوف لله من الفرائض.\n\nالسابعة: ذكر ثواب من فعله.\n\nالثامنة: ذكر عقاب من تركه.\n\n### | باب (32) قول الله تعالى: {وعلى الله فتوكلوا إن كنتم مؤمن}\n\n1.\n\nوقوله: {إنما المؤمنون الذين إذا ذكر الله وجلت قلوبهم وإذا تليت عليهم\n\nآياته زادتهم إيمانا وعلى ربهم يتوكلون} 2.\n\nوقوله: {يا أيها النبي حسبك الله ومن اتبعك من المؤمنين} 3.\n\nوقوله: {ومن يتوكل على الله فهو حسبه} 4.\n\nوعن ابن عباس رضي الله عنهما قال: \"حسبنا الله ونعم الوكيل قالها إبراهيم\n\nصلى الله عليه وسلم حين ألقي في النار، وقالها محمد صلى الله عليه وسلم حين\n\nقالوا له: {إن الناس قد جمعوا لكم فاخشوهم فزادهم إيمانا وقالوا حسبنا الله\n\nونعم الوكيل} 5\" رواه البخاري والنسائي.\n\nفيه مسائل:\n\nالأولى: أن التوكل من الفرائض.\n\nالثانية: أنه من شروط الإيمان. PageV01P093\n\nالثالثة: تفسير آية الأنفال.\n\nالرابعة: تفسير الآية في آخرها.\n\nالخامسة: تفسير آية الطلاق.\n\nالسادسة: عظم شأن هذه الكلمة أنها قول إبراهيم ومحمد صلى الله عليه وسلم\n\nفي الشدائد.\n\n### | باب (33) قول الله تعالى: {أفأمنوا مكر الله فلا يأمن مكر الله إلا القوم الخاسرون}\n\n1.\n\nوقوله: {ومن يقنط من رحمة ربه إلا الضالون} 2.\n\nوعن ابن عباس رضي الله عنهما أن رسول الله صلى الله عليه وسلم سئل عن\n\nالكبائر؟ فقال: \"الشرك بالله، واليأس من روح الله، والأمن من مكر الله\".\n\nوعن ابن مسعود رضي الله عنه قال: \"أكبر الكبائر: الإشراك بالله، والأمن\n\nمن مكر الله، والقنوط من رحمة الله، واليأس من روح الله\" رواه عبد الرازق.\n\nفيه مسائل:\n\nالأولى: تفسير آية الأعراف.\n\nالثانية: تفسير آية الحجر.\n\nالثالثة: شدة الوعيد فيمن أمن مكر الله.\n\nالرابعة: شدة الوعيد في ms33 القنوط. PageV01P095\n\n### | باب (34) من الإيمان بالله: الصبر على أقدار الله\n\nوقوله تعالى: {ومن يؤمن بالله يهد قلبه والله بكل شيء عليم} 1 قال علقمة:\n\nهو الرجل تصيبه المصيبة، فيعلم أنها من عند الله، فيرضى ويسلم.\n\nوفي صحيح مسلم عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه\n\nوسلم قال: \"اثنتان في الناس هما بهم كفر: الطعن في النسب،",

                "text": "ظهر على هذا تحريم\n\nهذه اللفظة مطلقا لفساد المعنى. 3 وقد تقدم القطع بتحريمه في كلام صاحب\n\nالفروع والإنصاف.\n\nقال المصنف -رحمه الله-: \"وفيه التفطن للإيمان في هذا الموضع\" يشير إلى\n\nأنه الإخلاص.\n\nقال: مطرنا بنوء كذا وكذا فذلك كافر بي مؤمن بالكوكب \"4.\n\nقوله: \"فأما من قال: مطرنا بفضل الله ورحمته\" فالفضل والرحمة صفتان لله،\n\nومذهب أهل السنة والجماعة: أن ما وصف الله به نفسه ووصفه به رسوله من صفات\n\nالذات: كالحياة PageV01P326\n\nوالعلم، وصفات الأفعال; كالرحمة التي يرحم بها عباده، كلها صفات لله\n\nقائمة بذاته ليست قائمة بغيره، فتفطن لهذا فقد غلط فيه طوائف.\n\nوفي هذا الحديث: إن نعم الله لا يجوز أن تضاف إلا إليه وحده، وهو الذي\n\nيحمد ms241 عليها، وهذه حال أهل التوحيد.\n\nقوله: \"وأما من قال: مطرنا بنوء كذا وكذا\" إلى آخره، تقدم ما يتعلق بذلك.\n\nقال المصنف -رحمه الله-: \"وفيه التفطن للكفر في هذا الموضع\".\n\nيشير إلى أن نسبة النعمة إلى غير الله كفر، ولهذا قطع بعض العلماء\n\nبتحريمه، وإن لم يعتقد تأثير النوء بإنزال المطر; فيكون من كفر النعم، لعدم\n\nنسبتها إلى الذي أنعم بها، ونسبتها إلى غيره، كما سيأتي في قوله تعالى:\n\n{يعرفون نعمت الله ثم ينكرونه} 1.\n\nقال القرطبي في شرح حديث زيد بن خالد: \" وكانت العرب إذا طلع نجم من\n\nالشرق، وسقط آخر من المغرب فحدث عند ذلك مطر أو ريح، فمنهم من ينسبه إلى\n\nالطالع، ومنهم من ينسبه إلى الغارب نسبة إيجاد واختراع، ويطلقون ذلك القول\n\nالمذكور في الحديث. فنهى الشارع عن إطلاق ذلك؛ لئلا يعتقد أحد اعتقادهم ولا\n\nيتشبه بهم في نطقهم\". انتهى.\n\nقوله: \" فمنهم من ينسبه نسبة إيجاد\" يدل على أن بعضهم كان لا يعتقد ذلك،\n\nكما قال تعالى: {ولئن سألتهم من نزل من السماء ماء فأحيا به الأرض من بعد\n\nموتها ليقولن الله قل الحمد لله بل أكثرهم لا يعقلون} 2. فدل على أن منهم\n\nمن يعرف ويقر بأن الله هو الذي أوجد المطر، وقد يعتقد هؤلاء أن للنوء فيه\n\nشيئا من التأثير، والقرطبي في شرحه لم يصرح أن العرب كلهم يعتقدون ذلك\n\nالمعتقد الذي ذكره. فلا اعتراض عليه بالآية للاحتمال المذكور.\n\nولهما من حديث ابن عباس معناه، وفيه: \" قال بعضهم: لقد صدق نوء كذا وكذا.\n\nفأنزل الله هذه الآيات: {فلا أقسم بمواقع النجوم وإنه لقسم لو تعلمون عظيم\n\nقوله: \"ولهما من حديث ابن عباس بمعناه، وفيه: قال بعضهم: \"لقد صدق نوء\n\nكذا وكذا. فأنزل الله هذه الآيات {فلا أقسم بمواقع النجوم وإنه لقسم لو\n\nتعلمون عظيم إنه لقرآن كريم في كتاب مكنون لا يمسه إلا المطهرون تنزيل من\n\nرب العالمين أفبهذا الحديث أنتم مدهنون وتجعلون رزقكم أنكم تكذبون} 1.\n\nوبلفظه عن ابن عباس قال: \"مطر الناس على عهد النبي صلي ms242 الله عليه وسلم،\n\nفقال النبي صلي الله عليه وسلم: أصبح من الناس شاكر، ومنهم كافر. قالوا:\n\nهذه رحمة الله. وقال بعضهم: لقد صدق نوء كذا وكذا \". فقال: فنزلت هذه\n\nالآية: {فلا أقسم بمواقع النجوم} \".\n\nهذا قسم من الله عز وجل يقسم بما يشاء من خلقه على ما شاء. وجواب القسم\n\n{إنه لقرآن كريم} . فتكون \"لا\" صلة لتأكيد النفي; فتقدير الكلام: ليس الأمر\n\nكما زعمتم في القرآن أنه سحر، أو كهانة، بل هو قرآن كريم. قال ابن جرير:\n\nقال بعض أهل العربية: معنى قوله: \" {فلا أقسم} فليس الأمر كما تقولون، ثم\n\nاستؤنف القسم بعد فقيل: أقسم بمواقع النجوم. قال ابن عباس: يعني نجوم\n\nالقرآن، فإنه نزل جملة ليلة القدر من السماء العليا إلى السماء الدنيا، ثم\n\nنزل مفرقا في السنين بعد2، ثم قرأ ابن عباس هذه الآية. ومواقعها: نزولها\n\nشيئا بعد شيء. وقال مجاهد: مواقع النجوم: مطالعها ومشارقها. واختاره ابن\n\nجرير. وعلى هذا فتكون المناسبة بين المقسم به والمقسم عليه- وهو القرآن- من\n\nوجوه:\n\nأحدها: أن النجوم جعلها الله يهتدى بها في ظلمات البر والبحر، وآيات\n\nالقرآن يهتدى بها في ظلمات الغي والجهل، فتلك هداية في الظلمات الحسية،\n\nوالقرآن هداية في الظلمات المعنوية، فجمع بين الهدايتين مع ما في النجوم من\n\nالزينة الظاهرة، وفي القرآن من الزينة الباطنة، ومع ما في النجوم من الرجوم\n\nللشياطين، وفي القرآن من رجوم شياطين الجن والإنس. والنجوم آياته المشهودة\n\nالعيانية، والقرآن آياته المتلوة السمعية، مع ما في مواقعها عند الغروب من\n\nالعبرة والدلالة على آياته القرآنية ومواقعها عند النزول. ذكره ابن القيم\n\nرحمه الله.\n\nوقوله: {وإنه لقسم لو تعلمون عظيم} 3 قال ابن كثير: أي وإن هذا القسم\n\nالذي أقسمت به لقسم عظيم لو تعلمون عظمته لعظمتم المقسم به عليه.\n\nPageV01P328\n\nوقوله: {إنه لقرآن كريم} 1 هذا هو المقسم عليه، وهو القرآن، أي إنه وحي\n\nالله وتنزيله وكلامه، لا كما يقول الكفار: إنه سحر أو كهانة، أو شعر. بل هو\n\nقرآن كريم أي عظيم كثير الخير؛ لأنه كلام ms243 الله.\n\nقال ابن القيم -رحمه الله تعالى-: \" فوصفه بما يقتضي حس",

                "text": "- استنكارا\n\nلذلك – فقال: ما فرق هؤلاء؟ يجدون رقة عند محكمه، ويهلكون عند متشابهه\"\n\nانتهى.\n\nولما سمعت قريش رسول الله صلى الله عليه وسلم يذكر \" الرحمن \" أنكروا\n\nذلك، فأنزل الله فيهم: {وهم يكفرون بالرحمن} 3.\n\nفيه مسائل:\n\nالأولى: عدم الإيمان بجحد شيء من الأسماء والصفات.\n\nالثانية: تفسير آية الرعد. PageV01P106\n\nالثالثة: ترك التحديث بما لا يفهم السامع.\n\nالرابعة: ذكر العلة: أنه يفضي إلى تكذيب الله ورسوله، ولو لم يتعمد\n\nالمنكر.\n\nالخامسة: كلام ابن عباس لمن استنكر شيئا من ذلك، وأنه أهلكه.\n\n### | باب (40) قول الله تعالى: {يعرفون نعمت الله ثم ينكرونها وأكثرهم الكافرون}\n\n1.\n\nقال مجاهد ما معناه: ms37 \"هو قول الرجل: هذا مالي ورثته عن آبائي\".\n\nوقال عون بن عبد الله: \"يقولون: لولا فلان لم يكن كذا\". وقال قتيبة: \"\n\n\"يقولون: هذا بشفاعة آلهتنا\".\n\nوقال أبو العباس - بعد حديث زيد بن خالد الذي فيه: \"أن الله تعالى قال:\n\nأصبح من عبادي مؤمن بي وكافر\" 2 - الحديث وقد تقدم -: وهذا كثير في الكتاب\n\nوالسنة، يذم سبحانه من يضيف إنعامه إلى غيره ويشرك به.\n\nقال بعض السلف: هو كقولهم: كانت الريح طيبة، والملاح حاذقا، ونحو ذلك مما\n\nهو جار على ألسنة كثير.\n\nفيه مسائل:\n\nالأولى: تفسير معرفة النعمة وإنكارها.\n\nالثانية: معرفة أن هذا جار على ألسنة كثير.\n\nالثالثة: تسمية هذا الكلام إنكارا للنعمة.\n\nالرابعة: اجتماع الضدين في القلب. PageV01P108\n\n### | باب (41) قول الله تعالى: {فلا تجعلوا لله أندادا وأنتم تعلمون}\n\n1.\n\nقال ابن عباس في الآية: \"الأنداد: هو الشرك، أخفى من دببيب النمل على\n\nصفاة سوداء في ظلمة الليل\". وهو أن تقول: والله وحياتك يا فلان، وحياتي،\n\nوتقول: لولا كليبة هذا لأتانا اللصوص. ولولا البط في الدار لأتانا اللصوص.\n\nوقول الرجل لصاحبه: ما شاء الله وشئت. وقول الرجل: لولا الله وفلان. لا\n\nتجعل فيها فلانا ; هذا كله به شرك \" رواه ابن أبي حاتم.\n\nوعن عمر بن الخطاب رضي الله عنه أن رسول الله صلى الله عليه وسلم قال:\n\n\"من حلف بغير الله قد كفر أو أشرك\" 2 رواه الترمذي، وحسنه وصححه الحاكم.\n\nوقال ابن مسعود: \"لأن أحلف بالله كاذبا أحب إلي من أن أحلف بغيره صادقا\".\n\nوعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \"لا تقولوا: ما\n\nشاء الله وشاء فلان، ولكن قولوا: ما شاء الله ثم شاء فلان\" 3 رواه أبو داود\n\nبسند صحيح. PageV01P109\n\nوجاء عن إبراهيم النخعي: \"أنه يكره أن يقول أعوذ بالله وبك. ويجوز أن\n\nيقول: بالله ثم بك. قال: ويقول: لولا الله ثم فلان؛ ولا تقولوا ولولا الله\n\nوفلان\".\n\nفيه مسائل:\n\nالأولى: تفسير آية البقرة في الأنداد.\n\nالثانية: أن الصحابة رضي الله عنهم يفسرون الآية النازلة ms38 في الشرك الأكبر\n\nأنها 1 تعم الأصغر.\n\nالثالثة: أن الحلف بغير الله شرك.\n\nالرابعة: أنه إذا حلف بغير الله صادقا فهو أكبر من اليمين الغموس.\n\nالخامسة: الفرق بين الواو وثم في اللفظ. PageV01P110\n\n### | باب (42) ما جاء فيمن لم يقنع بالحلف بالله\n\nعن عمر رضي الله عنهما: أن رسول الله صلى الله عليه وسلم قال: \"لا تحلفوا\n\nبآبائكم; من حلف له بالله فليصدق ; ومن حلف له بالله فليرض ; ومن لم يرض\n\nفليس من الله\" 1 رواه ابن ماجه بسند حسن.\n\nفيه مسائل:\n\nالأولى: النهي عن الحلف بالآباء.\n\nالثانية: الأمر للمحلوف له بالله أن يرضى.\n\nالثالثة: وعيد من لم يرض. PageV01P111\n\n### | باب (43) قول: ما شاء الله وشئت\n\nعن قتيلة: \"أن يهوديا أتى النبي صلى الله عليه وسلم فقال: إنكم تشركون،\n\nتقولون: ما شاء الله وشئت، وتقولون: والكعبة. فأمرهم النبي صلى الله عليه\n\nوسلم إذا أرادوا",

            "fath": {
                "text": "ن محمود بن لبيد قال: \" خرج علينا رسول الله\n\nصلى الله عليه وسلم فقال: يا أيها الناس، إياكم وشرك السرائر، قالوا: يا\n\nرسول الله، وما شرك السرائر؟ قال: يقوم الرجل فيصلي فيزين صلاته لما يرى من\n\nنظر الرجل إليه، فذلك شرك السرائر \" 3.\n\nقوله: \"عن أبي سعيد الخدري\" وتقدم.\n\nقوله: \"الشرك الخفي\" سماه خفيا؛ لأن صاحبه يظهر أن عمله لله وقد قصد به\n\nغيره، أو شركه فيه بتزيين صلاته لأجله. وعن شداد بن أوس قال: \" كنا نعد\n\nالرياء على عهد رسول الله صلى الله عليه وسلم\n\nفيه مسائل:\n\nالأولى: تفسير آية الكهف.\n\nالثانية: الأمر العظيم في رد العمل الصالح إذا دخله شيء لغير الله.\n\nالثالثة: ذكر السبب الموجب لذلك وهو كمال الغنى.\n\nالرابعة: أن من الأسباب: أنه تعالى خير الشركاء.\n\nالخامسة: خوف النبي صلى الله عليه وسلم على أصحابه من الرياء.\n\nالسادسة: أنه فسر ذلك بأن يصلي المرء لله لكن يزينها لما ms281 يرى من نظر رجل\n\nإليه.\n\nالشرك الأصغر \" 4. رواه ابن أبي الدنيا في كتاب الإخلاص، وابن جرير في\n\nالتهذيب، والطبراني والحاكم وصححه.\n\nقال ابن القيم: \" وأما الشرك الأصغر فكيسير الرياء والتصنع للخلق والحلف\n\nبغير الله، وقول الرجل للرجل: ما شاء الله وشئت، وهذا من الله ومنك، وأنا\n\nبالله وبك، وما لي PageV01P371\n\nإلا الله وأنت، وأنا متوكل على الله وعليك، ولولا الله وأنت لم يكن كذا\n\nوكذا. وقد يكون هذا شركا أكبر بحسب حال قائله ومقصده\". انتهى.\n\nولا خلاف أن الإخلاص شرط لصحة العمل وقبوله، وكذلك المتابعة، كما قال\n\nالفضيل بن عياض -رحمه الله- في قوله تعالى: {ليبلوكم أيكم أحسن عملا} 1.\n\nقال: \"أخلصه وأصوبه، قيل: يا أبا علي، ما أخلصه وأصوبه؟ قال: إن العمل إذا\n\nكان خالصا ولم يكن صوابا لم يقبل، وإذا كان صوابا ولم يكن خالصا لم يقبل\n\nحتى يكون خالصا صوابا، فالخالص ما كان لله، والصواب ما كان على السنة\".\n\nوفي الحديث عن الفوائد: شفقة النبي صلى الله عليه وسلم على أمته ونصحه\n\nلهم، وأن الرياء أخوف على الصالحين من فتنة الدجال. فإذا كان النبي صلى\n\nالله عليه وسلم يخافه على سادات الأولياء مع قوة إيمانهم وعلمهم، فغيرهم\n\nممن هو دونهم بأضعاف أولى بالخوف من الشرك أصغره وأكبره. PageV01P372\n\n### | باب: \" من الشرك إرادة الإنسان بعمله الدنيا\"\n\nوقوله تعالى: {من كان يريد الحياة الدنيا وزينتها نوف إليهم أعمالهم فيها\n\nوهم فيها لا يبخسون أولئك الذين ليس لهم في الآخرة إلا النار وحبط ما صنعوا\n\nفيها وباطل ما كانوا يعملون} 1. PageV01P372\n\nالتوحيد الواجب، ويحبط الأعمال، وهو أعظم من الرياء، لأن مريد الدنيا قد\n\nتغلب إرادته تلك على كثير من عمله، وأما الرياء فقد يعرض له في عمل دون\n\nعمل، ولا يسترسل معه، والمؤمن يكون حذرا من هذا وهذا.\n\nقال: \"وقوله تعالى: {من كان يريد الحياة الدنيا وزينتها نوف إليهم\n\nأعمالهم فيها وهم فيها لا يبخسون أولئك الذين ليس لهم في الآخرة إلا النار\n\nوحبط ما صنعوا فيها وباطل ما كانوا يعملون} \".\n\nقال ابن عباس ms282 رضي الله عنه: \"من كان يريد الحياة الدنيا\" أي ثوابها.\n\nوزينتها: أي مالها. نوف أي نوفر لهم ثواب أعمالهم بالصحة والسرور في المال\n\nوالأهل والولد. \"وهم فيها لا يبخسون\" لا ينقصون، ثم نسختها {من كان يريد\n\nالعاجلة عجلنا له فيها ما نشاء لمن نريد} 1 الآيتين. رواه النحاس في ناسخه.\n\nقوله: \"ثم نسختها\" أي قيدتها. فلم تبق الآية على إطلاقها2. وقال قتادة: \"\n\nمن كانت الدنيا همه وطلبته ونيته جازاه الله بحسناته في الدنيا، ثم يفضي\n\nإلى الآخرة وليس له حسنة يعطى بها جزاء. وأما المؤمن فيجازى بحسناته في\n\nالدنيا ويثاب عليها في الآخرة \" ذكره ابن جرير بسنده، ثم ساق حديث أبي\n\nهريرة 3 عن ابن المبارك عن حيوة بن شريح قال: حدثني الوليد ابن أبي الوليد\n\nأبو عثمان أن عقبة بن مسلم حدثه أن شفي بن ماتع الأصبحي حدثه \"أنه دخل\n\nالمدينة فإذا هو برجل قد اجتمع عليه الناس، فقال: من هذا؟ فقالوا: أبو\n\nهريرة. قال: فدنوت منه حتى قعدت بين يديه، وهو يحدث الناس. فلما سكت وخلا\n\nقلت: أنشدك بحق وبحق لما حدثتني حديثا سمعته من رسول الله صلى الله عليه\n\nوسلم عقلته وعلمته. قال: فقال أبو هريرة: أفعل، لأحدثنك حديثا حدثنيه رسول\n\nالله PageV01P373\n\nصلى الله عليه وسلم في هذا البيت ما فيه أحد غيري وغيره، ثم نشغ أبو\n\nهريرة نشغة1 ثم أفاق فقال: لأحدثنك حديثا حدثنيه رسول الله صلى الله عليه\n\nوسلم في هذا البيت ما فيه غيري أحد وغيره. ثم نشغ أبو هريرة نشغة أخرى، ثم\n\nمال خارا على وجهه; واشتد به طويلا. ثم أفاق فقال: حدثني رسول الله صلى\n\nالله عليه وسلم: \" إن الله -تبارك وتعالى- إذا كان يوم القيامة نزل إلى\n\nالقيامة ليقضي بينهم، وكل أمة جاثية. فأول من يدعو به رجل جمع القرآن، ورجل\n\nقتل في سبيل الله، ورجل كثير المال. فيقول الله تبارك وتعالى للقارئ: ألم\n\nأعلمك ما أنزلت على رسولي؟ قال: ب",

            "kitab": {
                "text": "وأتى الأعمى في صورته،\n\nفقال: رجل مسكين وابن سبيل قد انقطعت بي الحبال في سفري، فلا بلاغ لي اليوم\n\nإلا بالله ثم بك. أسألك بالذي رد عليك بصرك شاة أتبلغ بها في سفري. فقال:\n\nقد كنت أعمى فرد الله إلي بصري، فخذ ما شئت ودع ما شئت، فوالله لا أجهدك\n\nاليوم بشيء أخذته لله. فقال: أمسك\n\nمالك فإنما ابتليتم، فقد رض ي الله عنك وسخط على صاحبيك\".\n\nفيه مسائل:\n\nالأولى: تفسير الآية.\n\nالثانية: ما معنى: {ليقولن هذا لي} 1.\n\nالثالثة: ما معنى قوله: { (إنما أوتيته على علم عندي (} 2.\n\nالرابعة: ما في هذه القصة العجيبة من العبر العظيمة. PageV01P121\n\n### | باب (49) قول الله تعالى: {فلما آتاهما صالحا جعلا له شركاء فيما آتاهما فتعالى الله عما يشركون}\n\n1\n\nقال ابن حزم: اتفقوا على تحريم كل اسم معبد لغير الله كعبد عمرو، وعبد\n\nالكعبة، وما أشبه ذلك حاشى عبد المطلب. وعن ابن عباس في الآية: \"قال لما\n\nتغشاها آدم حملت فأتاهما إبليس فقال: إني صاحبكما الذي أخرجتكما من الجنة\n\nلتطيعاني 2 أو لأجعلن له قرني أيل، فيخرج من بطنك فيشقه، ولأفعلن ولأفعلن\n\nيخوفهما، سمياه عبد الحارث. فأبيا أن يطيعاه فخرج ميتا، ثم حملت فأتاهما\n\nفقال مثل قوله، فأبيا أن يطيعاه، فخرج ميتا. ثم حملت فأتاهما فذكر لهما\n\nفأدركهما حب الولد فسمياه عبد الحارث، فذلك قوله {جعلا له شركاء فيما\n\nآتاهما} \" رواه ابن أبي حاتم.\n\nوله بسند صحيح عن قتادة قال: \"شركاء في طاعته ولم يكن في عبادته\".\n\nPageV01P122\n\nوله بسند صحيح عن مجاهد في قوله: {لئن آتيتنا صالحا} قال: \"أشفقا أن لا\n\nيكون إنسانا\" وذكر معناه عن الحسن وسعيد وغيرهما.\n\nفيه مسائل:\n\nالأولى: تحريم كل اسم معبد لغير الله.\n\nالثانية: تفسير الآية.\n\nالثالثة: أن هذا الشرك في مجرد تسمية لم تقصد حقيقتها.\n\nالرابعة: أن هبة الله للرجل البنت السوية من النعم.\n\nالخامسة: ذكر السلف ms43 الفرق بين الشرك في الطاعة والشرك في العبادة.\n\n### | باب (50) قول الله تعالى: {ولله الأسماء الحسنى فادعوه بها وذروا الذين يلحدون في أسمائه}\n\n1\n\nذكر ابن أبي حاتم عن ابن عباس: ?\" {يلحدون في أسمائه} : يشركون\". وعنه:\n\n\"سموا اللات من الإله، والعزى من العزيز\".\n\nوعن الأعمش: \"يدخلون فيها ما ليس منها\".\n\nفيه مسائل:\n\nالأولى: إثبات الأسماء.\n\nالثانية: كونها حسنى.\n\nالثالثة: الأمر بدعائه بها.\n\nالرابعة: ترك من عارض من الجاهلين الملحدين.\n\nالخامسة: تفسير الإلحاد فيها.\n\nالسادسة: وعيد من ألحد. PageV01P124\n\n### | باب (51) لا يقال: السلام على الله\n\nفي الصحيح عن ابن مسعود رضي الله عنه قال: \"كنا إذا كنا مع النبي صلى\n\nالله عليه وسلم في الصلاة قلنا: السلام على الله من عباده، السلام على فلان\n\nوفلان فقال النبي صلى الله عليه وسلم: لا تقولوا السلام على الله، فإن الله\n\nهو السلام\" 1.\n\nفيه مسائل:\n\nالأولى: تفسير السلام.\n\nالثانية: أنه تحية.\n\nالثالثة: أنها لا تصلح لله.\n\nالرابعة: العلة في ذلك.\n\nالخامسة: تعليمهم التحية التي تصلح لله. PageV01P125\n\n### | باب (51) قول: اللهم اغفر لي إن شئت\n\nفي الصحيح عن أبي هريرة: أن رسول الله صلى الله عليه وسلم قال: \"لا يقل\n\nأحدكم: اللهم اغفر لي إن شئت، اللهم ارحمني إن شئت، ليعزم المسألة ; فإن\n\nالله لا مكره له\" 1.\n\nولمسلم: \"وليعظم الرغبة، فإن الله لا يتعاظمه شيء أعطاه\" 2.\n\nفيه مسائل:\n\nالأولى: النهي عن الاستثناء في الدعاء.\n\nالثانية: بيان العلة في ذلك.\n\nالثالثة: قوله: \"ليعزم المسألة\".\n\nالرابعة: إعظام الرغبة.\n\nالخامسة: التعليل لهذا الأمر. PageV01P126\n\n### | باب (53) لا يقول: عبدي وأمتي\n\nفي الصحيح عن أبي هريرة رضي الله عنه أن رسول الله",

                "text": "فخالفوا ما بلغ به الأمة\n\nوأخبر به عن نفسه صلى الله عليه وسلم، فعاملوه بما نهاهم عنه من الشرك\n\nبالله والتعلق على غير الله حتى قال قائلهم:\n\nيا أكرم الخلق ما لي من ألوذ به ... سواك عند حلول الحادث العمم\n\nإن لم تكن في معادي آخذا بيدي ... فضلا وإلا فقل يا زلة القدم\n\nPageV01P414\n\nفإن من جودك الدنيا وضرتها ... ومن علومك علم اللوح والقلم\n\nفانظر إلى هذا الجهل العظيم حيث اعتقد أنه لا نجاة له إلا بعياذه ولياذه\n\nبغير الله، وانظر إلى هذا الإطراء العظيم الذي تجاوز الحد في الإطراء الذي\n\nنهى عنه صلى الله عليه وسلم بقوله: \" لا تطروني كما أطرت النصارى ابن مريم،\n\nإنما أنا عبد فقولوا: عبد الله ورسوله \". رواه مالك وغيره1 2. وقد قال\n\nتعالى: {قل لا أقول لكم عندي خزائن الله ولا أعلم الغيب ولا أقول لكم إني\n\nملك} 3.\n\nوعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \" لا تقولوا:\n\nما شاء الله وشاء فلان، ولكن قولوا: ما شاء الله ثم شاء فلان \" 4 رواه أبو\n\nداود بسند صحيح.\n\nوجاء عن إبراهيم النخعي \" أنه يكره أعوذ بالله وبك. ويجوز أن يقول: بالله\n\nثم بك. قال ويقول: لولا الله ثم فلان، ولا تقولوا: لولا الله وفلان\".\n\nفانظر إلى هذه المعارضة العظيمة للكتاب والسنة والمحادة لله ورسوله. وهذا\n\nالذي يقوله هذا الشاعر5 هو الذي في نفوس كثير خصوصا ممن يدعون العلم\n\nوالمعرفة. ورأوا قراءة هذه المنظومة ونحوها لذلك وتعظيمها من القربات فإنا\n\nلله وإنا إليه راجعون.\n\nقوله: \"وعن حذيفة رضي الله عنه عن النبي صلى الله عليه وسلم قال: \" لا\n\nتقولوا: ما شاء الله وشاء فلان، ولكن قولوا: ما شاء الله، ثم شاء فلان \".\n\nرواه أبو داود بسند صحيح\".\n\nوذلك لأن المعطوف بالواو يكون مساويا للمعطوف عليه، لكونها إنما وضعت\n\nلمطلق الجمع، ms322 فلا تقتضي ترتيبا ولا تعقيبا. وتسوية المخلوق بالخالق شرك إن\n\nكان في الأصغر- مثل هذا- فهو أصغر، وإن كان في الأكبر فهو أكبر، كما قال\n\nالله تعالى عنهم في الدار الآخرة: {تالله إن كنا لفي ضلال مبين إذ نسويكم\n\nبرب العالمين} 6 بخلاف المعطوف بثم؛ فإن المعطوف بها يكون متراخيا عن\n\nالمعطوف عليه بمهملة، فلا محذور لكونه صار تابعا. PageV01P415\n\nقوله: \"وعن إبراهيم النخعي \"أنه يكره أن يقول الرجل: أعوذ بالله وبك.\n\nويجوز أن  اليمين فأحلفه، فلا ريب أنه يجب عليه الرضا.\n\nوأما إذا كان فيما يجري بين الناس مما قد يقع في الاعتذارات من بعضهم لبعض\n\nونحو ذلك، فهذا من حق المسلم على المسلم أن يقبل منه إذا حلف له مع",

;

    // Storage
    let storage = JSON.parse(localStorage.getItem('mirqat_tawhid_v1') || '{}');
    if (!storage.fontScale) storage.fontScale = 22;
    if (!storage.lineHeight) storage.lineHeight = 'مريح';
    if (!storage.tashkeel) storage.tashkeel = false;
    if (!storage.expandedNodes) storage.expandedNodes = [];
    if (!storage.bookmarks) storage.bookmarks = [];
    if (!storage.notes) storage.notes = {};
    if (!storage.pinned) storage.pinned = [];

    // Arabic normalization
    function normalizeArabic(text) {
      return text
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/\u0640/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي');
    }

    // Save storage
    function saveStorage() {
      localStorage.setItem('mirqat_tawhid_v1', JSON.stringify(storage));
    }

    // Build sidebar tree
    function buildSidebar() {
      const tree = document.getElementById('sidebarTree');
      const mobileTree = document.getElementById('mobileSidebarTree');
      tree.innerHTML = '';
      mobileTree.innerHTML = '';

      const rububiyya = DB.topics.filter(t => t.categories.includes('الربوبية'));
      const aluhiyya = DB.topics.filter(t => t.categories.includes('الألوهية'));

      // الربوبية
      const rubDiv = document.createElement('div');
      rubDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('rub')">▼ الربوبية</button>
        <div id="rub" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(rubDiv);
      mobileTree.appendChild(rubDiv.cloneNode(true));

      rububiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#rub').appendChild(node);
      });

      // الألوهية
      const uluDiv = document.createElement('div');
      uluDiv.innerHTML = `
        <button class="w-full text-right p-2 font-bold text-accent focus-ring" onclick="toggleGroup('ulu')">▼ الألوهية</button>
        <div id="ulu" class="mr-4 space-y-1"></div>
      `;
      tree.appendChild(uluDiv);
      mobileTree.appendChild(uluDiv.cloneNode(true));

      aluhiyya.forEach(t => {
        const node = document.createElement('button');
        node.className = 'tree-node w-full text-right p-2 text-sm focus-ring rounded hover:bg-accent-soft';
        node.textContent = t.title;
        node.onclick = () => loadTopic(t.id);
        document.querySelector('#ulu').appendChild(node);
      });
    }

    function toggleGroup(id) {
      const el = document.getElementById(id);
      if (el.style.display === 'none') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    // Load topic
    function loadTopic(topicId) {
      const topic = DB.topics.find(t => t.id === topicId);
      if (!topic) return;

      document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
      // Highlight active (simplified)
      const activeNodes = document.querySelectorAll('.tree-node');
      for (let n of activeNodes) {
        if (n.textContent === topic.title) {
          n.classList.add('active');
        }
      }

      // Update title
      document.getElementById('topicTitle').textContent = topic.title;
      document.getElementById('topicTitlePin').textContent = topic.title;

      // Categories
      const catDiv = document.getElementById('topicCategories');
      catDiv.innerHTML = topic.categories.map(c => `<span class="px-2 py-1 bg-accent-soft text-accent rounded text-sm">${c}</span>`).join('');

      // Matn
      const matnDiv = document.getElementById('matnContent');
      const matnDivPin = document.getElementById('matnContentPin');
      matnDiv.innerHTML = renderText(topic.kitab);
      matnDivPin.innerHTML = renderText(topic.kitab);

      // Sharh
      const sharhDiv = document.getElementById('sharhContent');
      const sharhDivPin = document.getElementById('sharhContentPin');
      sharhDiv.innerHTML = renderText(topic.fath, true);
      sharhDivPin.innerHTML = renderText(topic.fath, true);

      // Fatawa
      const fatawaDiv = document.getElementById('fatawaContent');
      const fatawaDivPin = document.getElementById('fatawaContentPin');
      fatawaDiv.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-4 bg-surface rounded-lg border border-divider">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-warn/10 text-warn px-2 py-1 rounded text-xs">مجموع الفتاوى</span>
            ${f.verificationStatus === 'placeholder' ? '<span class="badge-unverified">غير مُدقّق</span>' : ''}
          </div>
          <div class="fatawa-text">${renderPlaceholder(f.quote)}</div>
          <div class="text-xs text-muted mt-2">${f.source.book} ${f.source.volume} ص ${f.source.page} - ${f.concept}</div>
        </div>
      `).join('');
      fatawaDivPin.innerHTML = topic.fatawa.map(f => `
        <div class="fatawa-card p-2 bg-surface rounded border border-divider mb-2">
          <div class="text-xs mb-1">${renderPlaceholder(f.quote).substring(0, 100)}...</div>
        </div>
      `).join('');

      // Notes
      document.getElementById('notesTextarea').value = storage.notes[topicId] || '';

      storage.lastTopicId = topicId;
      saveStorage();
    }

    function renderText(field, isSharh = false) {
      let text = renderPlaceholder(field.text);
      if (isSharh) {
        return `<div class="p-4">${text}</div>`;
      }
      return text;
    }

    function renderPlaceholder(text) {
      if (text.includes('[نص توضيحي')) {
        return text.replace('[نص توضيحي — يُراجع الأصل المطبوع] ', '') + ' <span class="badge-unverified">غير مُدقّق</span>';
      }
      return text;
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      buildSidebar();
      
      // Banner
      document.getElementById('dismissBanner').onclick = () => {
        document.getElementById('verificationBanner').style.display = 'none';
      };

      // Font slider
      document.getElementById('fontSlider').oninput = (e) => {
        document.documentElement.style.setProperty('--font-scale', e.target.value + 'px');
        document.getElementById('fontSizeLabel').textContent = e.target.value + 'px';
        storage.fontScale = e.target.value;
        saveStorage();
      };

      // Line height
      document.getElementById('lineHeightBtn').onclick = () => {
        if (document.body.classList.contains('line-compressed')) {
          document.body.classList.remove('line-compressed');
          document.body.classList.add('line-relaxed');
          document.getElementById('lineHeightBtn').textContent = 'مريح';
          storage.lineHeight = 'مريح';
        } else {
          document.body.classList.remove('line-relaxed');
          document.body.classList.add('line-compressed');
          document.getElementById('lineHeightBtn').textContent = 'مضغوط';
          storage.lineHeight = 'مضغوط';
        }
        saveStorage();
      };

      // Notes
      document.getElementById('notesTextarea').oninput = (e) => {
        if (storage.lastTopicId) {
          storage.notes[storage.lastTopicId] = e.target.value;
          saveStorage();
          const saved = document.getElementById('notesSaved');
          saved.classList.remove('hidden');
          setTimeout(() => saved.classList.add('hidden'), 1000);
        }
      };

      // Mobile menu
      document.getElementById('mobileMenuBtn').onclick = () => {
        document.getElementById('mobileDrawer').classList.add('open');
        document.getElementById('mobileDrawerOverlay').classList.remove('hidden');
      };
      document.getElementById('closeDrawer').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };
      document.getElementById('mobileDrawerOverlay').onclick = () => {
        document.getElementById('mobileDrawer').classList.remove('open');
        document.getElementById('mobileDrawerOverlay').classList.add('hidden');
      };

      // Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          // Simplified tab switching
        };
      });

      // Pin
      document.getElementById('pinBtn').onclick = () => {
        document.getElementById('normalLayout').classList.toggle('hidden');
        document.getElementById('pinLayout').classList.toggle('hidden');
      };

      // Load first topic
      if (DB.topics.length > 0) {
        loadTopic(DB.topics[0].id);
      }

      // Apply saved settings
      document.documentElement.style.setProperty('--font-scale', storage.fontScale + 'px');
      document.getElementById('fontSlider').value = storage.fontScale;
      document.getElementById('fontSizeLabel').textContent = storage.fontScale + 'px';
      if (storage.lineHeight === 'مضغوط') {
        document.body.classList.add('line-compressed');
        document.getElementById('lineHeightBtn').textContent = 'مضغوط';
      } else {
        document.body.classList.add('line-relaxed');
        document.getElementById('lineHeightBtn').textContent = 'مريح';
      }
    });
  </script>
