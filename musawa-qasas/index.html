<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">
<title>الموسوعة الشاملة للقصص والحديث النبوي الصحيح</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #FAF6EE; --bg-alt: #F3EDE1; --card: #FFFDF9;
    --ink: #1C1A17; --ink-soft: #4A453D;
    --emerald: #1B4332; --emerald-light: #2D6A4F;
    --gold: #C5A059; --gold-light: #E9D8A6;
    --border: #D9CDB8; --shadow: rgba(27, 67, 50, 0.12);
    --mark: #F4D35E; --mark-text: #1C1A17;
    --font-body: 'Amiri', 'Scheherazade New', serif;
    --font-display: 'Cairo', 'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Naskh Arabic', sans-serif;
    --font-size: 1.15rem;
    --status-green: #2D6A4F; --status-green-bg: rgba(45,106,79,.14);
    --status-yellow: #8B6914; --status-yellow-bg: rgba(197,160,89,.18);
    --status-orange: #B85C38; --status-orange-bg: rgba(184,92,56,.16);
}
[data-theme="dark"] {
    --bg: #12161A; --bg-alt: #181E24; --card: #1E242B;
    --ink: #E6E1D8; --ink-soft: #A8A296;
    --emerald: #4A7A63; --emerald-light: #6A9C82;
    --gold: #D4AF37; --gold-light: #8A7440;
    --border: #3A424B; --shadow: rgba(0, 0, 0, 0.4);
    --mark: #D4AF37; --mark-text: #12161A;
    --status-green: #7AB896; --status-green-bg: rgba(122,184,150,.14);
    --status-yellow: #E9D8A6; --status-yellow-bg: rgba(233,216,166,.12);
    --status-orange: #E89B7A; --status-orange-bg: rgba(232,155,122,.14);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-body); background: var(--bg); color: var(--ink);
    line-height: 1.9; font-size: var(--font-size);
    transition: background .35s, color .35s; min-height: 100vh;
    background-image:
        radial-gradient(circle at 15% 20%, rgba(197,160,89,.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(27,67,50,.05) 0%, transparent 45%);
}
body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.012) 2px, rgba(0,0,0,.012) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,.008) 3px, rgba(0,0,0,.008) 6px);
    z-index: 0;
}
[data-theme="dark"] body::before { opacity: .2; }
.geom-border { border: 2px solid var(--gold); position: relative; }
.geom-border::before {
    content: ""; position: absolute; inset: 4px; border: 1px solid var(--emerald);
    opacity: .45; pointer-events: none; border-radius: inherit;
}
header {
    position: relative; z-index: 2; text-align: center; padding: 2.2rem 1rem 1.4rem;
    background: linear-gradient(180deg, var(--bg-alt), transparent);
    border-bottom: 1px solid var(--border);
}
.header-ornament { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-bottom: .6rem; }
.header-ornament span { display: inline-block; width: 40px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.header-ornament svg { width: 28px; height: 28px; fill: var(--gold); }
h1 {
    font-family: var(--font-display); font-size: clamp(1.35rem, 3.6vw, 2.3rem);
    font-weight: 700; color: var(--emerald); letter-spacing: .5px; line-height: 1.5;
}
[data-theme="dark"] h1 { color: var(--gold); }
.subtitle { font-size: .95rem; color: var(--ink-soft); margin-top: .4rem; font-style: italic; }
.controls {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: .8rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center;
}
.search-wrap { flex: 1 1 340px; max-width: 680px; position: relative; }
.search-wrap svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; fill: var(--ink-soft); pointer-events: none;
}
#searchInput {
    width: 100%; padding: .7rem 2.7rem .7rem 1rem;
    font-family: var(--font-body); font-size: 1rem;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--border); border-radius: 50px; outline: none;
    transition: border .2s, box-shadow .2s;
}
#searchInput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    padding: .55rem .9rem; border-radius: 50px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
    font-family: var(--font-display); font-size: .85rem;
    cursor: pointer; transition: all .2s; white-space: nowrap; user-select: none;
}
.btn:hover { border-color: var(--gold); background: var(--bg-alt); }
.btn.active { background: var(--emerald); color: #fff; border-color: var(--emerald); }
[data-theme="dark"] .btn.active { background: var(--gold); color: #12161A; border-color: var(--gold); }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.filters {
    display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center;
    padding: .7rem 1rem; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2;
}
.filter-badge {
    padding: .35rem .9rem; border-radius: 50px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink-soft);
    font-family: var(--font-display); font-size: .78rem; cursor: pointer; transition: all .2s;
}
.filter-badge.active { background: var(--gold); color: #12161A; border-color: var(--gold); font-weight: 600; }
.stats-bar { text-align: center; font-size: .82rem; color: var(--ink-soft); padding: .2rem 1rem .8rem; position: relative; z-index: 2; }
.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.3rem; padding: 1rem 1.2rem 3rem; max-width: 1320px; margin: 0 auto; position: relative; z-index: 2;
}
.card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 1.3rem 1.2rem 1.1rem; position: relative;
    box-shadow: 0 6px 22px -10px var(--shadow);
    transition: transform .25s, box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column; overflow: hidden;
}
.card::before {
    content: ""; position: absolute; top: 0; right: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--emerald), var(--gold), var(--emerald)); opacity: .55;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 36px -14px var(--shadow); border-color: var(--gold); }
.card-badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
.card-category {
    font-family: var(--font-display); font-size: .68rem;
    padding: .18rem .7rem; border-radius: 50px;
    background: color-mix(in srgb, var(--emerald) 12%, transparent);
    color: var(--emerald); border: 1px solid color-mix(in srgb, var(--emerald) 30%, transparent);
}
[data-theme="dark"] .card-category {
    background: color-mix(in srgb, var(--gold) 15%, transparent);
    color: var(--gold); border-color: color-mix(in srgb, var(--gold) 35%, transparent);
}
.status-badge {
    font-family: var(--font-display); font-size: .65rem; font-weight: 600;
    padding: .18rem .65rem; border-radius: 50px; white-space: nowrap;
}
.status-badge.verbatim { background: var(--status-green-bg); color: var(--status-green); border: 1px solid var(--status-green); }
.status-badge.near { background: var(--status-yellow-bg); color: var(--status-yellow); border: 1px solid var(--status-yellow); }
.status-badge.summary { background: var(--status-orange-bg); color: var(--status-orange); border: 1px solid var(--status-orange); }
.card h3 {
    font-family: var(--font-display); font-size: 1.08rem; font-weight: 700;
    color: var(--emerald); line-height: 1.5; margin-bottom: .4rem;
}
[data-theme="dark"] .card h3 { color: var(--gold-light); }
.card-excerpt {
    font-size: .9rem; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: .8rem; flex: 1;
}
.card-source { font-size: .72rem; color: var(--gold); margin-bottom: .7rem; font-weight: 600; }
.card-actions {
    display: flex; gap: .5rem; flex-wrap: wrap;
    border-top: 1px dashed var(--border); padding-top: .7rem;
}
.card-actions .btn { padding: .38rem .75rem; font-size: .74rem; }
.btn-fav.active { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 15%, transparent); }
.btn-fav.active svg { fill: var(--gold); }
.modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10, 12, 14, .72);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
    padding: 1rem; opacity: 0; transition: opacity .25s;
}
.modal-overlay.open { display: flex; opacity: 1; }
.modal {
    background: var(--bg); border: 2px solid var(--gold); border-radius: 22px;
    width: 100%; max-width: 880px; max-height: 92vh;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); position: relative;
    animation: modalIn .3s ease; overflow: hidden;
}
@keyframes modalIn { from { transform: translateY(24px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header {
    padding: 1.2rem 1.4rem .8rem; border-bottom: 1px solid var(--border);
    position: relative; background: linear-gradient(180deg, var(--bg-alt), transparent);
}
.modal-header h2 {
    font-family: var(--font-display); font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    color: var(--emerald); line-height: 1.5; padding-left: 2.5rem;
}
[data-theme="dark"] .modal-header h2 { color: var(--gold); }
.modal-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; }
.modal-category {
    font-size: .72rem; font-family: var(--font-display);
    color: var(--gold); border: 1px solid var(--gold);
    padding: .1rem .65rem; border-radius: 50px;
}
.modal-close {
    position: absolute; top: 1rem; left: 1rem;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
    font-size: 1.2rem; cursor: pointer; display: grid; place-items: center; transition: all .2s;
}
.modal-close:hover { background: var(--emerald); color: #fff; border-color: var(--emerald); }
.modal-body {
    overflow-y: auto; padding: 1.3rem 1.5rem 2rem;
    font-size: var(--font-size); line-height: 2.1; text-align: justify;
    scrollbar-width: thin; scrollbar-color: var(--gold) transparent;
}
.modal-body::-webkit-scrollbar { width: 8px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
.modal-body p { margin-bottom: 1rem; }
.modal-body .hadith-text { text-indent: 1.5em; }
.status-banner {
    padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1.2rem;
    font-size: .88rem; border-right: 4px solid; line-height: 1.75;
    display: flex; gap: .6rem; align-items: flex-start;
}
.status-banner .icon { font-size: 1.1rem; flex-shrink: 0; }
.status-banner.verbatim { background: var(--status-green-bg); border-color: var(--status-green); color: var(--status-green); }
.status-banner.near { background: var(--status-yellow-bg); border-color: var(--status-yellow); color: var(--status-yellow); }
.status-banner.summary { background: var(--status-orange-bg); border-color: var(--status-orange); color: var(--status-orange); }
[data-theme="dark"] .status-banner { color: var(--ink); }
[data-theme="dark"] .status-banner.verbatim { color: #C8E6D5; border-color: var(--status-green); }
[data-theme="dark"] .status-banner.near { color: #F3E9C5; border-color: var(--status-yellow); }
[data-theme="dark"] .status-banner.summary { color: #F5CBB8; border-color: var(--status-orange); }
.modal-source {
    margin-top: 1.3rem; padding: .9rem 1rem;
    background: color-mix(in srgb, var(--gold) 10%, transparent);
    border-right: 4px solid var(--gold); border-radius: 8px;
    font-size: .85rem; color: var(--ink-soft);
}
.modal-source strong { color: var(--emerald); font-family: var(--font-display); }
[data-theme="dark"] .modal-source strong { color: var(--gold); }
.benefits-title {
    font-family: var(--font-display); color: var(--emerald);
    margin: 1.2rem 0 .6rem; font-size: 1rem;
}
[data-theme="dark"] .benefits-title { color: var(--gold); }
.benefits-list { list-style: none; }
.benefits-list li { position: relative; padding-right: 1.5rem; margin-bottom: .5rem; font-size: .92rem; }
.benefits-list li::before { content: "◆"; position: absolute; right: 0; top: 0; color: var(--gold); font-size: .7rem; }
.modal-toolbar {
    display: flex; gap: .6rem; flex-wrap: wrap;
    padding: .8rem 1.4rem 1rem; border-top: 1px solid var(--border); background: var(--bg-alt);
}
.modal-toolbar .btn { flex: 1 1 auto; }
.btn-verify { background: var(--emerald); color: #fff; border-color: var(--emerald); }
.btn-verify:hover { background: var(--emerald-light); color: #fff; }
[data-theme="dark"] .btn-verify { background: var(--gold); color: #12161A; border-color: var(--gold); }
mark { background: var(--mark); color: var(--mark-text); padding: 0 .12em; border-radius: 3px; font-weight: 700; }
.empty {
    grid-column: 1 / -1; text-align: center; padding: 3rem 1rem;
    color: var(--ink-soft); font-size: 1.1rem;
}
.empty svg { width: 60px; height: 60px; fill: var(--border); margin-bottom: 1rem; }
.toast {
    position: fixed; bottom: 1.5rem; right: 50%; transform: translateX(50%) translateY(120%);
    background: var(--emerald); color: #fff; padding: .7rem 1.4rem; border-radius: 50px;
    font-family: var(--font-display); font-size: .85rem; z-index: 200;
    transition: transform .35s; box-shadow: 0 8px 30px rgba(0,0,0,.3); white-space: nowrap;
}
[data-theme="dark"] .toast { background: var(--gold); color: #12161A; }
.toast.show { transform: translateX(50%) translateY(0); }
.font-panel {
    display: none; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .5rem .8rem; background: var(--bg-alt); border-radius: 12px;
    border: 1px solid var(--border); font-size: .8rem;
}
.font-panel.show { display: flex; }
.font-panel select {
    font-family: var(--font-display); font-size: .8rem; padding: .35rem .6rem;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink);
}
.font-panel button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 1rem; cursor: pointer;
}
@media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; padding: .8rem .8rem 2.5rem; gap: 1rem; }
    .controls { padding: .6rem .7rem; gap: .45rem; }
    .btn { font-size: .76rem; padding: .45rem .7rem; }
    .modal-body { padding: 1rem 1.1rem 1.5rem; }
    .modal-header { padding: 1rem 1.1rem .7rem; }
}
#scrollTop {
    position: fixed; bottom: 1.4rem; left: 1.4rem; z-index: 50;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--emerald); color: #fff;
    border: 2px solid var(--gold); cursor: pointer;
    display: grid; place-items: center; opacity: 0; pointer-events: none;
    transition: all .3s; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
[data-theme="dark"] #scrollTop { background: var(--gold); color: #12161A; }
#scrollTop.show { opacity: 1; pointer-events: auto; }
#scrollTop svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>

<header>
    <div class="header-ornament">
        <span></span>
        <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z"/></svg>
        <span></span>
    </div>
    <h1>الموسوعة الشاملة للقصص والحديث النبوي الصحيح</h1>
</header>

<div class="controls" role="search">
    <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="searchInput" placeholder="ابحث في العناوين والنصوص والمصادر…" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="favFilterBtn" title="المفضلة">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        المفضلة
    </button>
    <button class="btn" id="fontBtn" title="إعدادات الخط">
        <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        الخط
    </button>
    <button class="btn" id="themeBtn" title="تبديل الوضع">
        <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 14.5 5.5 5.5 0 016.5 9c0-2.12 1.2-3.96 2.96-4.88C10.92 3.04 11.46 3 12 3z"/></svg>
    </button>
</div>

<div style="text-align:center; position:relative; z-index:5;">
    <div class="font-panel" id="fontPanel">
        <span style="font-family:var(--font-display);color:var(--ink-soft)">حجم الخط:</span>
        <button id="fontMinus" title="تصغير">−</button>
        <span id="fontSizeLabel" style="min-width:2.4rem;text-align:center;font-weight:700">1.15</span>
        <button id="fontPlus" title="تكبير">+</button>
        <span style="width:1px;height:22px;background:var(--border)"></span>
        <label for="fontSelect" style="font-family:var(--font-display);color:var(--ink-soft)">نوع الخط:</label>
        <select id="fontSelect">
            <option value="Amiri">أميري</option>
            <option value="Scheherazade New">شهرزاد</option>
            <option value="Reem Kufi">ريم كوفي</option>
        </select>
    </div>
</div>

<div class="filters" id="filters">
    <button class="filter-badge active" data-cat="all">الكل</button>
    <button class="filter-badge" data-cat="قصص الأنبياء والأمم السابقة">قصص الأنبياء والأمم السابقة</button>
    <button class="filter-badge" data-cat="قصص السيرة والمغازي والشمائل">السيرة والمغازي</button>
    <button class="filter-badge" data-cat="الغيبيات والمشاهدات والأمثال">الغيبيات والأمثال</button>
</div>

<div class="filters" id="statusFilters">
    <button class="filter-badge active" data-status="all">كل النصوص</button>
    <button class="filter-badge" data-status="verbatim">🟢 حرفي موثق</button>
    <button class="filter-badge" data-status="near_verbatim">🟡 قريب بالمعنى</button>
    <button class="filter-badge" data-status="summary_with_reference">🟠 ملخّص + إحالة</button>
</div>

<div class="stats-bar" id="statsBar"></div>
<main class="grid" id="grid"></main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal geom-border">
        <div class="modal-header">
            <button class="modal-close" id="modalClose" aria-label="إغلاق">✕</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta">
                <span class="modal-category" id="modalCategory"></span>
                <span class="status-badge" id="modalStatusBadge"></span>
            </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-toolbar">
            <button class="btn" id="modalFavBtn">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>حفظ في المفضلة</span>

    full_text: `ملخّصٌ وافٍ لرحلة الإسراء والمعراج (النص الحرفي الكامل في صحيح البخاري 349 وصحيح مسلم 162):

{

    title: "قصة تميم الداري والمسيح الدجال والجساسة",

    source_url: "https://sunnah.com/muslim:2942",
    full_text: `عن فاطمة بنت قيس رضي الله عنها قالت: سمعت نداء منادي رسول الله ﷺ ينادي: الصلاة جامعة. فخرجت إلى المسجد، فصليت مع رسول الله ﷺ، فكنت في صف النساء التي تلي ظهور القوم.

فلما قضى رسول الله ﷺ صلاته جلس على المنبر وهو يضحك، فقال: «ليلزم كل إنسان مصلاه، ثم قال: أتدرون لم جمعتكم؟» قالوا: الله ورسوله أعلم. قال: «إني والله ما جمعتكم لرغبة ولا لرهبة، ولكن جمعتكم لأن تميمًا الداري كان رجلًا نصرانيًا فجاء فبايع وأسلم، وحدثني حديثًا وافق الذي كنت أحدثكم عن مسيح الدجال.

حدثني أنه ركب في سفينة بحرية مع ثلاثين رجلًا من لخم وجذام، فلعب بهم الموج شهرًا في البحر، ثم أرفئوا إلى جزيرة في البحر حتى مغرب الشمس. فجلسوا في أقرب السفينة فدخلوا الجزيرة، فلقيتهم دابة أهلب كثير الشعر، لا يدرون ما قبله من دبره من كثرة الشعر. فقالوا: ويلك ما أنت؟ فقالت: أنا الجساسة. قالوا: وما الجساسة؟ قالت: أيها القوم انطلقوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق.

قال: لما سمت لنا رجلًا فرقنا منها أن تكون شيطانة، قال: فانطلقنا سراعًا حتى دخلنا الدير، فإذا فيه أعظم إنسان رأيناه قط خلقًا، وأشده وثاقًا، مجموعة يداه إلى عنقه، ما بين ركبتيه إلى كعبيه بالحديد.

قلنا: ويلك ما أنت؟ قال: قد قدرتم على خبري، فأخبروني ما أنتم؟ قالوا: نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين اغتلم، فلعب بنا الموج شهرًا، ثم أرفأنا إلى جزيرتك هذه، فجلسنا في أقربها، فدخلنا الجزيرة، فلقيتنا دابة أهلب كثير الشعر، لا يُدرى ما قبله من دبره من كثرة الشعر، فقلنا: ويلك ما أنت؟ فقالت: أنا الجساسة. قلنا: وما الجساسة؟ قالت: اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق. فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة.

قال: أخبروني عن نخل بيسان. قلنا: عن أي شأنها تستخبر؟ قال: أسألكم عن نخلها هل يثمر؟ قلنا له: نعم. قال: أما إنه يوشك أن لا تثمر.

قال: أخبروني عن بحيرة الطبرية. قلنا: عن أي شأنها تستخبر؟ قال: هل فيها ماء؟ قالوا: هي كثيرة الماء. قال: أما إن ماءها يوشك أن يذهب.

قال: أخبروني عن عين زغر. قالوا: عن أي شأنها تستخبر؟ قال: هل في العين ماء، وهل يزرع أهلها بماء العين؟ قلنا له: نعم، هي كثيرة الماء، وأهلها يزرعون من مائها.

قال: أخبروني عن نبي الأميين ما فعل؟ قالوا: قد خرج من مكة ونزل يثرب. قال: أقاتله العرب؟ قلنا: نعم. قال: كيف صنع بهم؟ فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه. قال لهم: قد كان ذلك؟ قلنا: نعم. قال: أما إن ذاك خير لهم أن يطيعوه، وإني مخبركم عني: إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة، فهما محرمتان علي كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها.

قالت: قال رسول الله ﷺ وطعن بمخصرته في المنبر: «هذه طيبة، هذه طيبة، هذه طيبة» يعني المدينة. «ألا هل كنت حدثتكم ذلك؟» فقال الناس: نعم. «فإنه أعجبني حديث تميم أنه وافق الذي كنت أحدثكم عنه وعن المدينة ومكة، ألا إنه في بحر الشام أو بحر اليمن، لا بل من قبل المشرق، ما هو من قبل المشرق، ما هو من قبل المشرق» وأومأ بيده إلى المشرق.`,

{
    id: 6,
    title: "قصة أصحاب الأخدود والساحر والراهب والغلام",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/muslim:3005",
    full_text: `عن صهيب أن رسول الله ﷺ قال: «كان ملك فيمن كان قبلكم، وكان له ساحر، فلما كبر قال للملك: إني قد كبرت، فابعث إلي غلامًا أعلمه السحر. فبعث إليه غلامًا يعلمه.

فكان في طريقه إذا سلك راهب، فقعد إليه وسمع كلامه فأعجبه، فكان إذا أتى الساحر مر بالراهب وقعد إليه، فإذا أتى الساحر ضربه، فشكى ذلك إلى الراهب، فقال: إذا خشيت الساحر فقل: حبسني أهلي، وإذا خشيت أهلك فقل: حبسني الساحر.

فبينما هو كذلك إذ أتى على دابة عظيمة قد حبست الناس، فقال: اليوم أعلم الساحر أفضل أم الراهب أفضل. فأخذ حجرًا فقال: اللهم إن كان أمر الراهب أحب إليك من أمر الساحر، فاقتل هذه الدابة حتى يمضي الناس. فرماهما فقتلها، ومضى الناس.

فأتى الراهب فأخبره، فقال له الراهب: أي بني، أنت اليوم أفضل مني، قد بلغ من أمرك ما أرى، وإنك ستبتلى، فإن ابتليت فلا تدل علي.

وكان الغلام يبرئ الأكمه والأبرص، ويداوي الناس من سائر الأدواء. فسمع جليس للملك كان قد عمي، فأتاه بهدايا كثيرة، فقال: ما هاهنا لك أجمع إن أنت شفيتني. فقال: إني لا أشفي أحدًا، إنما يشفي الله، فإن أنت آمنت بالله دعوت الله فشفاك. فآمن بالله فشفاه الله.

فأتى الملك فجلس إليه كما كان يجلس، فقال له الملك: من رد عليك بصرك؟ قال: ربي. قال: ولك رب غيري؟ قال: ربي وربك الله. فأخذه فلم يزل يعذبه حتى دل على الغلام. فجيء بالغلام، فقال له الملك: أي بني، قد بلغ من سحرك ما تبرئ الأكمه والأبرص وتفعل وتفعل؟ فقال: إني لا أشفي أحدًا، إنما يشفي الله. فأخذه فلم يزل يعذبه حتى دل على الراهب.

فجيء بالراهب، فقيل له: ارجع عن دينك. فأبى، فدعا بالمئشار فوضع المئشار في مفرق رأسه فشقه حتى وقع شقاه. ثم جيء بجليس الملك فقيل له: ارجع عن دينك. فأبى، فوضع المئشار في مفرق رأسه فشقه به حتى وقع شقاه.

ثم جيء بالغلام فقيل له: ارجع عن دينك. فأبى، فدفعه إلى نفر من أصحابه فقال: اذهبوا به إلى جبل كذا وكذا، فاصعدوا به الجبل، فإذا بلغتم ذروته فإن رجع عن دينه وإلا فاطرحوه. فذهبوا به فصعدوا به الجبل، فقال: اللهم اكفنيهم بما شئت. فرجف بهم الجبل فسقطوا، وجاء يمشي إلى الملك.

فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فدفعه إلى نفر من أصحابه فقال: اذهبوا به فاحملوه في قرقور، فتوسطوا به البحر، فإن رجع عن دينه وإلا فاقذفوه. فذهبوا به، فقال: اللهم اكفنيهم بما شئت. فانكفأت بهم السفينة فغرقوا، وجاء يمشي إلى الملك.

فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فقال للملك: إنك لست بقاتلي حتى تفعل ما آمرك به. قال: وما هو؟ قال: تجمع الناس في صعيد واحد، وتصلبني على جذع، ثم خذ سهمًا من كنانتي، ثم ضع السهم في كبد القوس، ثم قل: بسم الله رب الغلام، ثم ارمي، فإنك إذا فعلت ذلك قتلتني.

فجمع الناس في صعيد واحد، وصلبه على جذع، ثم أخذ سهمًا من كنانته، ثم وضع السهم في كبد القوس، ثم قال: بسم الله رب الغلام، ثم رماه، فوقع السهم في صدغه، فوضع يده في صدغه في موضع السهم فمات.

فقال الناس: آمنا برب الغلام، آمنا برب الغلام، آمنا برب الغلام. فأتي الملك فقيل له: أرأيت ما كنت تحذر، قد والله نزل بك حذرك، قد آمن الناس. فأمر بالأخدود في أفواه السكك فخدت، وأضرم النيران، وقال: من لم يرجع عن دينه فأحموه فيها، أو قيل له اقتحم. ففعلوا، حتى جاءت امرأة ومعها صبي يرضع، فتقاعست أن تقع في النار، فقال لها الغلام: يا أمه اصبري فإنك على الحق».`,
    source: "صحيح مسلم (3005) — كتاب الزهد والرقائق",

    source_url: "https://sunnah.com/bukhari:3436",
    full_text: `عن أبي هريرة عن النبي ﷺ قال: «كان في بني إسرائيل رجل عابد يقال له جريج، يتعبد في صومعة له. فأنته أمه فقالت: يا جريج إني أنا أمك، أشرف علي أكلمك. فأقبل على الصلاة، فقال: أي رب، صلاتي وأمي. فأقبل على الصلاة، فمضى في صلاته.

فقالت: اللهم لا تمته حتى تربه المؤسسة. وكانت راعية ترعى وتؤي غنمها إلى ظل صومعته، فأصابت فاحشة فحملت، فقالوا: ممن هذا الحمل؟ فقالت: من جريج صاحب الصومعة. وكان زنا بها رجل راعي ضأن.

فجاؤوا بالفؤوس، فقالوا: يا جريج يا جريج يا مرائي، انزل. فجعل يصلي، فلما رأوه لا يلتفت إليهم أخذوا في هدم صومعته، فنزل إليهم، فجعلوا في عنقه وعنقها حبلًا، فقرنوهما، فطافوا بهما في الناس.

فوضع إصبعه على بطنها، فقال: يا غلام من أبوك؟ فقال: أي فلان راعي الضأن. فتركوه، وقالوا له: إن شئت بنينا لك صومعتك من ذهب، وإن شئت من فضة. فقال: لا، ولكن أعيدوها كما كانت».`,

    id: 8,
    title: "قصة الأبرص والأقرع والأعمى",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:3464",
    full_text: `عن أبي هريرة أنه سمع رسول الله ﷺ يقول: «إن ثلاثة في بني إسرائيل: أبرص وأقرع وأعمى، بدا لله عز وجل أن يبتليهم، فبعث إليهم ملكًا.

فأتى الأبرص، فقال: أي شيء أحب إليك؟ قال: لون حسن، وجلد حسن، قد قذرني الناس. قال: فمسحه فذهب عنه، فأعطي لونًا حسنًا وجلدًا حسنًا. فقال: أي المال أحب إليك؟ قال: الإبل (أو البقر). فأعطي ناقة عشراء، فقال: يبارك لك فيها.

وأتى الأقرع، فقال: أي شيء أحب إليك؟ قال: شعر حسن، ويذهب عني هذا، قد قذرني الناس. قال: فمسحه فذهب، وأعطي شعرًا حسنًا. قال: فأي المال أحب إليك؟ قال: البقر. فأعطاه بقرة حاملًا، وقال: يبارك لك فيها.

وأتى الأعمى، فقال: أي شيء أحب إليك؟ قال: يرد الله إلي بصري، فأبصر به الناس. قال: فمسحه فرد الله إليه بصره. قال: فأي المال أحب إليك؟ قال: الغنم. فأعطاه شاة والدًا.

فأنتج هذان وولد هذا، فكان لهذا واد من إبل، ولهذا واد من بقر، ولهذا واد من غنم.

ثم إنه أتى الأبرص في صورته وهيئته، فقال: رجل مسكين تقطعت بي الحبال في سفري، فلا بلاغ اليوم إلا بالله ثم بك، أسألك بالذي أعطاك اللون الحسن والجلد الحسن والمال، بعيرًا أتبلغ عليه في سفري.

فقال له: إن الحقوق كثيرة. فقال له: كأني أعرفك، ألم تكن أبرص يقذرك الناس فقيرًا، فأعطاك الله؟ فقال: لقد ورثت لكابر عن كابر. فقال: إن كنت كاذبًا فصيرك الله إلى ما كنت.

وأتى الأقرع في صورته وهيئته، فقال له مثل ما قال لهذا، فرد عليه مثل ما رد عليه هذا، فقال: إن كنت كاذبًا فصيرك الله إلى ما كنت.

وأتى الأعمى في صورته، فقال: رجل مسكين وابن سبيل، وتقطعت بي الحبال في سفري، فلا بلاغ اليوم إلا بالله ثم بك، أسألك بالذي رد عليك بصرك شاة أتبلغ بها في سفري.

فقال: قد كنت أعمى فرد الله إلي بصري، وفقيرًا فقد أغناني، فخذ ما شئت، فوالله لا أجهضك اليوم بشيء أخذته لله. فقال: أمسك مالك، فإنما ابتليتم، فقد رضي الله عنك، وسخط على صاحبيك».`,
    source: "صحيح البخاري (3464)، صحيح مسلم (2964)",
    benefits: [

        "الجزاء من جنس العمل، فالأعمى الذي شكر نجا، والآخران كذبا فسخط الله عليهما.",
        "فيه إثبات كرامات الأولياء، وأن الله يرد البصر والشفاء بيده.",

    source_url: "https://sunnah.com/bukhari:2272",
    full_text: `عن عبد الله بن عمر رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «انطلق ثلاثة رهط ممن كان قبلكم حتى أووا المبيت إلى غار فدخلوه، فانحدرت صخرة من الجبل فسدت عليهم الغار.

فقالوا: إنه لا ينجيكم من هذه الصخرة إلا أن تدعوا الله بصالح أعمالكم.

فقال رجل منهم: اللهم كان لي أبوان شيخان كبيران، وكنت لا أغبق قبلهما أهلًا ولا مالًا، فنأى بي في طلب شيء يومًا، فلم أرح عليهما حتى ناما، فحلبت لهما غبوقهما فوجدتهما نائمين، وكرهت أن أغبق قبلهما أهلًا أو مالًا، فلبثت والقدح على يدي أنتظر استيقاظهما حتى برق الفجر، فاستيقظا فشربا غبوقهما. اللهم إن كنت فعلت ذلك ابتغاء وجهك ففرج عنا ما نحن فيه من هذه الصخرة. فانفرجت شيئًا لا يستطيعون الخروج.

وقال الآخر: اللهم كانت لي بنت عم كانت أحب الناس إلي، فأردتها عن نفسها فامتنعت مني، حتى ألمت بها سنة من السنين، فجاءتني فأعطيتها عشرين ومائة دينار على أن تخلي بيني وبين نفسها، ففعلت. حتى إذا قدرت عليها قالت: لا أحل لك أن تفض الخاتم إلا بحقه. فتحرجت من الوقوع عليها، فانصرفت عنها وهي أحب الناس إلي، وتركت الذهب الذي أعطيتها. اللهم إن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه. فانفرجت الصخرة غير أنهم لا يستطيعون الخروج منها.

    source_url: "https://sunnah.com/muslim:2766",
    full_text: `عن أبي سعيد الخدري أن نبي الله ﷺ قال: «كان فيمن كان قبلكم رجل قتل تسعة وتسعين نفسًا، فسأل عن أعلم أهل الأرض، فدل على راهب، فأتاه فقال: إنه قتل تسعة وتسعين نفسًا، فهل له من توبة؟ فقال: لا. فقتله فكمل به مائة.

{
    id: 11,
    title: "قصة الذي أقرض ألف دينار في خشبة",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:2291",
    full_text: `عن أبي هريرة رضي الله عنه عن رسول الله ﷺ أنه ذكر رجلًا من بني إسرائيل سأل بعض بني إسرائيل أن يسلفه ألف دينار، فقال: ائتني بالشهداء أشهدهم. فقال: كفى بالله شهيدًا. قال: فأتني بالكفيل. قال: كفى بالله كفيلًا. قال: صدقت. فدفعها إليه إلى أجل مسمى.

فخرج في البحر فقضى حاجته، ثم التمس مركبًا يركبها يقدم عليه للأجل الذي أجله، فلم يجد مركبًا. فأخذ خشبة فنقرها، فأدخل فيها ألف دينار وصحيفة منه إلى صاحبه، ثم زجج موضعها، ثم أتى بها إلى البحر.

فقال: اللهم إنك تعلم أني كنت تسلفت فلانًا ألف دينار، فسألني كفيلًا فقلت: كفى بالله كفيلًا، فرضي بك. وسألني شهيدًا فقلت: كفى بالله شهيدًا، فرضي بك. وأنا جهدت أن أجد مركبًا أبعث إليه الذي له فلم أجد، وإني أستودعكها. فرمى بها في البحر حتى ولجت فيه، ثم انصرف.

فخرج صاحب المال ينظر إلى مركبه الذي خرج فيه، فوجد الخشبة التي ألقى بها، فأخذها لينتفع بها، فلما نشرها وجد المال والصحيفة.

ثم قدم الرجل الذي كان تسلف منه، فأتاه بالمال، فقال: والله ما زلت جاهدًا في طلب مركب إليك لآتيك بمالك، فما وجدت مركبًا قبل الذي أتيت فيه. فقال: هل كنت بعثت إلي شيئًا؟ قال: أخبرك أني لم أجد مركبًا قبل الذي جئت فيه. قال: فإن الله قد أدى عنك الذي بعثت في الخشبة، فانصرف بالألف الدينار راشدًا».`,

{
    id: 13,
    title: "قصة كعب بن مالك وتخلفه عن تبوك",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "summary_with_reference",
    source_url: "https://sunnah.com/bukhari:4418",
    full_text: `ملخّصٌ وافٍ لقصة كعب بن مالك (النص الحرفي الكامل في صحيح البخاري 4418 وصحيح مسلم 2769):

تخلّف كعب بن مالك رضي الله عنه عن غزوة تبوك من غير عذر، وليس له عذر، وكان قادرًا موسرًا. فلما رجع النبي ﷺ من تبوك بدأ بالمسجد فصلّى ركعتين ثم جلس للناس، فجاءه المتخلفون يعتذرون ويحلفون، وكانوا بضعة وثمانين رجلًا، فقبل منهم علانيتهم واستغفر لهم، ووكّل سرائرهم إلى الله.

فلما جاء كعب قال له النبي ﷺ: «ما خلّفك؟» فصدقه القول ولم يعتذر بكذب، فقال: «أما هذا فقد صدق، فقم حتى يقضي الله فيك». فأمر النبي ﷺ المسلمين باجتناب كلامه وكلام صاحبيه (مرارة بن الربيع وهلال بن أمية)، فلبثوا خمسين ليلةً في ضيق شديد، حتى إن الأرض لتضيق بهم.

ثم جاء كعبًا كتاب من ملك غسّان يدعوه إلى اللحاق به، فتيقّن أنه من البلاء، فأحرقه في التنور. فلما تمّت خمسون ليلة صلّى النبي ﷺ صلاة الفجر، وأعلن الله توبته على الثلاثة، فجاء البشرى إلى كعب وهو على سطح داره، فخرّ ساجدًا.

فلما جاء إلى النبي ﷺ قال له: «أبشر بخير يومٍ مرّ عليك من يوم ولدتك أمك». فقال كعب: من عندك يا رسول الله أم من عند الله؟ قال: «بل من عند الله». ثم تلا النبي ﷺ: {لَقَد تَّابَ اللَّهُ عَلَى النَّبِيِّ وَالْمُهَاجِرِينَ وَالْأَنصَارِ} إلى قوله: {إِنَّ اللَّهَ هُوَ التَّوَّابُ الرَّحِيمُ}.`,
    source: "صحيح البخاري (4418)، صحيح مسلم (2769)",
    benefits: [
        "الصدق منجاة، والكذب مهلكة، كما قال ﷺ: «أما هذا فقد صدق».",
        "التوبة النصوح تفتح أبواب الفرج بعد الشدة.",
        "فضل كعب بن مالك وصاحبيه، وأنهم من الثلاثة الذين خُلّفوا وتيب عليهم.",
        "أهمية الصحبة الصالحة، وموقف أبي قتادة من كعب.",
        "فيه دروس في الصبر على البلاء، والثبات على الصدق.",
        "الوفاء بالعهد وعدم التخلف عن الجهاد بغير عذر."
    ]

{
    id: 14,
    title: "حادثة الإفك",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "summary_with_reference",
    source_url: "https://sunnah.com/bukhari:4141",
    full_text: `ملخّصٌ وافٍ لحادثة الإفك (النص الحرفي الكامل في صحيح البخاري 4141 وصحيح مسلم 2770):

في غزوةٍ أقرع النبي ﷺ بين أزواجه فخرج سهم عائشة رضي الله عنها فخرجت معه. وفي طريق العودة نزل الجيش منزلًا، فذهبت عائشة لقضاء حاجتها، فلمست صدرها فوجدت عقدًا لها قد انقطع، فرجعت تلتمسه فحبسها، فحمل الرهط هودجها وهم يحسبونها فيه، وساروا. فلما رجعت لم تجد أحدًا، فجلست في منزلها تنتظر أن يفتقدوها.

فأصبح صفوان بن المعطل السلمي من وراء الجيش، فرأى سواد إنسان نائم فعرفها (وكان قد رآها قبل الحجاب)، فاسترجع، فاستيقظت فخمّرت وجهها بجلبابها، ولم يكلّمها بكلمة واحدة، بل أناخ راحلته فركبتها وقادها حتى أتى الجيش.

فتولّى كِبْر الإفك عبد الله بن أُبيّ ابن سلول، وأشاعه، وتناقله الناس. فلما قدمت المدينة اشتكت عائشة شهرًا، والنبي ﷺ يستشير أصحابه في فراقها، فأشار أسامة بن زيد بخير، وأشار عليّ بن أبي طالب بأن يسأل الجارية بريرة، فقالت بريرة: ما رأيت عليها أمرًا أغمصه.

فصعد النبي ﷺ المنبر واستعذر من عبد الله بن أُبيّ، فقام سعد بن معاذ وسعد بن عبادة فتنازعا حتى كاد الحيان (الأوس والخزرج) يقتتلان، فخفّضهم النبي ﷺ حتى سكتوا.

ثم أنزل الله براءتها في عشر آيات من سورة النور: {إِنَّ الَّذِينَ جَاءُوا بِالْإِفْكِ عُصْبَةٌ مِّنكُمْ ۚ لَا تَحْسَبُوهُ شَرًّا لَّكُم ۖ بَلْ هُوَ خَيْرٌ لَّكُمْ...} إلى قوله: {وَاللَّهُ سَمِيعٌ عَلِيمٌ}.`,
    source: "صحيح البخاري (4141)، صحيح مسلم (2770)",
    benefits: [

        "التحذير من نشر الشائعات والأخبار الكاذبة، وأنها من كبائر الذنوب.",
        "فضل الصبر والاحتساب عند البلاء، وأن الفرج يأتي بعد الشدة.",
        "أهمية التثبت في الأخبار، وعدم تصديق كل ما يُقال.",
        "مكانة عائشة رضي الله عنها في قلب النبي ﷺ."

{
    id: 15,
    title: "صلح الحديبية",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:2731",
    full_text: `عن المسور بن مخرمة ومروان، يصدّق كل واحد منهما حديث صاحبه، قالا: خرج رسول الله ﷺ زمن الحديبية، حتى إذا كانوا ببعض الطريق قال النبي ﷺ: «إن خالد بن الوليد بالغميم في خيل لقريش طليعة، فخذوا ذات اليمين». فوالله ما شعر بهم خالد حتى إذا هم بقترة الجيش، فانطلق يركض نذيرًا لقريش.

وسار النبي ﷺ حتى إذا كان بالثنية التي يهبط عليهم منها بركت به راحلته، فقال الناس: حل حل. فألحت، فقالوا: خلأت القصواء، خلأت القصواء. فقال النبي ﷺ: «ما خلأت القصواء، وما ذاك لها بخلق، ولكن حبسها حابس الفيل».

ثم قال: «والذي نفسي بيده، لا يسألوني خطة يعظمون فيها حرمات الله إلا أعطيتهم إياها». ثم زجرها فوثبت.

قال: فعدل عنهم حتى نزل بأقصى الحديبية على ثمد قليل الماء، يتبرضه الناس تبرضًا، فلم يلبثه الناس حتى نزحوه. وشكي إلى رسول الله ﷺ العطش، فانتزع سهمًا من كنانته، ثم أمرهم أن يجعلوه فيه، فوالله ما زال يجيش لهم بالري حتى صدروا عنه.

فبينما هم كذلك إذ جاء بديل بن ورقاء الخزاعي في نفر من قومه من خزاعة، وكانوا عيبة نصح رسول الله ﷺ من أهل تهامة، فقال: إني تركت كعب بن لؤي وعامر بن لؤي نزلوا أعداد مياه الحديبية، ومعهم العوذ المطافيل، وهم مقاتلوك وصادوك عن البيت.

فقال رسول الله ﷺ: «إنا لم نجئ لقتال أحد، ولكنا جئنا معتمرين، وإن قريشًا قد نهكتهم الحرب، وأضرت بهم، فإن شاؤوا ماددتهم مدة، ويخلوا بيني وبين الناس، فإن أظهر فإن شاؤوا أن يدخلوا فيما دخل فيه الناس فعلوا، وإلا فقد جموا. وإن هم أبوا، فوالذي نفسي بيده لأقاتلنهم على أمري هذا حتى تنفرد سالفتي، ولينفذن الله أمره».

قال: فانطلق بديل حتى أتى قريشًا، فأخبرهم. فقام عروة بن مسعود الثقفي فقال: أي قوم، ألستم بالوالد؟ قالوا: بلى. قال: أولست بالولد؟ قالوا: بلى. قال: فهل تتهموني؟ قالوا: لا. قال: فإن هذا قد عرض لكم خطة رشد، اقبلوها ودعوني آتيه. قالوا: ائته.

فأتى النبي ﷺ فجعل يكلمه، فقال النبي ﷺ نحوا من قوله لبديل. فقال عروة عند ذلك: أي محمد، أرأيت إن استأصلت أمر قومك، هل سمعت بأحد من العرب اجتاح أهله قبلك؟ وإن تكن الأخرى، فإني والله لأرى وجوهًا، وإني لأرى أشوابًا من الناس خليقًا أن يفروا ويدعوك.

فقال له أبو بكر: امصص ببظر اللات، أنحن نفر عنه وندعه؟ فقال: من ذا؟ قالوا: أبو بكر. قال: أما والذي نفسي بيده، لولا يد كانت لك عندي لم أجزك بها لأجبتك.

قال: وجعل يكلم النبي ﷺ، فكلما تكلم أخذ بلحيته، والمغيرة بن شعبة قائم على رأس النبي ﷺ ومعه السيف وعليه المغفر، فكلما أهوى عروة بيده إلى لحية النبي ﷺ ضرب يده بنعل السيف، وقال له: أخر يدك عن لحية رسول الله ﷺ.

فرفع عروة رأسه فقال: من هذا؟ قالوا: المغيرة بن شعبة. فقال: أي غدر، ألست أسعى في غدرتك؟

ثم إن عروة جعل يرمق أصحاب النبي ﷺ بعينيه، قال: فوالله ما تنخم رسول الله ﷺ نخامة إلا وقعت في كف رجل منهم، فدلك بها وجهه وجلده. وإذا أمرهم ابتدروا أمره، وإذا توضأ كادوا يقتتلون على وضوئه، وإذا تكلم خفضوا أصواتهم عنده، وما يحدون إليه النظر تعظيمًا له.

فرجع عروة إلى أصحابه فقال: أي قوم، والله لقد وفدت على الملوك، ووفدت على قيصر وكسرى والنجاشي، والله إن رأيت ملكًا قط يعظمه أصحابه ما يعظم أصحاب محمد ﷺ محمدًا.

ثم جاء سهيل بن عمرو فقال: هات اكتب بيننا وبينك كتابًا. فدعا النبي ﷺ الكاتب، فقال النبي ﷺ: «بسم الله الرحمن الرحيم». فقال سهيل: أما الرحمن فوالله ما أدري ما هو، ولكن اكتب باسمك اللهم كما كنت تكتب.

فقال المسلمون: والله لا نكتبها إلا بسم الله الرحمن الرحيم. فقال النبي ﷺ: «اكتب باسمك اللهم». ثم قال: «هذا ما قاضى عليه محمد رسول الله». فقال سهيل: والله لو كنا نعلم أنك رسول الله ما صددناك عن البيت ولا قاتلناك، ولكن اكتب: محمد بن عبد الله.`,
    source: "صحيح البخاري (2731، 2732)، صحيح مسلم (1783)",
    benefits: [
        "الصلح خير من الحرب، وفيه تقديم المصلحة العليا على الرغبات الشخصية.",

    title: "فتح مكة",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:4280",
    full_text: `عن هشام عن أبيه قال: لما سار رسول الله ﷺ عام الفتح فبلغ ذلك قريشًا، خرج أبو سفيان بن حرب وحكيم بن حزام وبديل بن ورقاء يلتمسون الخبر عن رسول الله ﷺ.

فأقبلوا يسيرون حتى أتوا مر الظهران، فإذا هم بنيران كأنها نيران عرفة. فقال أبو سفيان: ما هذه؟ لكأنها نيران عرفة. فقال بديل بن ورقاء: نيران بني عمرو. فقال أبو سفيان: عمرو أقل من ذلك.

فرآهم ناس من حرس رسول الله ﷺ فأدركوهم فأخذوهم، فأتوا بهم رسول الله ﷺ، فأسلم أبو سفيان.

فلما سار قال للعباس: «احبس أبا سفيان عند حطم الخيل حتى ينظر إلى المسلمين». فحبسه العباس، فجعلت القبائل تمر مع النبي ﷺ تمر كتيبة كتيبة على أبي سفيان.

فمرت كتيبة، قال: يا عباس من هذه؟ قال: هذه غفار. قال: ما لي ولغفار. ثم مرت جهينة، قال: مثل ذلك. ثم مرت سعد بن هذيم، فقال مثل ذلك. ومرت سليم، فقال مثل ذلك.

حتى أقبلت كتيبة لم ير مثلها، قال: من هذه؟ قال: هؤلاء الأنصار، عليهم سعد بن عبادة، معه الراية. فقال سعد بن عبادة: يا أبا سفيان، اليوم يوم الملحمة، اليوم تستحل الكعبة. فقال أبو سفيان: يا عباس، حبذا يوم الذمار.

ثم جاءت كتيبة وهي أقل الكتائب، فيهم رسول الله ﷺ وأصحابه، وراية النبي ﷺ مع الزبير بن العوام. فلما مر رسول الله ﷺ بأبي سفيان قال: «ألم تعلم ما قال سعد بن عبادة؟» قال: ما قال؟ قال: كذا وكذا. فقال: «كذب سعد، ولكن هذا يوم يعظم الله فيه الكعبة، ويوم تكسى فيه الكعبة».

قال: وأمر رسول الله ﷺ أن تركز رايته بالحجون. قال عروة: وأخبرني نافع بن جبير بن مطعم قال: سمعت العباس يقول للزبير بن العوام: يا أبا عبد الله، ها هنا أمرك رسول الله ﷺ أن تركز الراية. قال: وأمر رسول الله ﷺ يومئذ خالد بن الوليد أن يدخل من أعلى مكة من كداء، ودخل النبي ﷺ من كدا.`,
    source: "صحيح البخاري (4280)، صحيح مسلم (1780)",

/* ============ STATE ============ */
const state = {
    search: '', category: 'all', status: 'all', showFavsOnly: false,
    favorites: new Set(JSON.parse(localStorage.getItem('encyclopedia_favs') || '[]')),
    theme: localStorage.getItem('encyclopedia_theme') || 'light',
    fontSize: parseFloat(localStorage.getItem('encyclopedia_fontsize') || '1.15'),
    fontFamily: localStorage.getItem('encyclopedia_fontfamily') || 'Amiri',
    activeStory: null
};

/* ============ HELPERS ============ */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlightText(html, query) {
    if (!query) return html;
    const q = query.trim();
    if (!q) return html;
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return html.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}
function excerpt(text, len = 220) {
    const plain = text.replace(/\s+/g, ' ').trim();
    return plain.length > len ? plain.slice(0, len) + '…' : plain;
}
function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function saveFavs() {
    localStorage.setItem('encyclopedia_favs', JSON.stringify([...state.favorites]));
}

/* ============ THEME & FONTS ============ */

    document.documentElement.setAttribute('data-theme', state.theme);
    const icon = $('#themeIcon');
    if (state.theme === 'dark') {
        icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
    } else {
        icon.innerHTML = '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 14.5 5.5 5.5 0 016.5 9c0-2.12 1.2-3.96 2.96-4.88C10.92 3.04 11.46 3 12 3z"/>';
    }
}
function applyFont() {
    document.documentElement.style.setProperty('--font-size', state.fontSize + 'rem');
    document.documentElement.style.setProperty('--font-body', `'${state.fontFamily}', 'Scheherazade New', serif`);
    $('#fontSizeLabel').textContent = state.fontSize.toFixed(2);
    $('#fontSelect').value = state.fontFamily;
    localStorage.setItem('encyclopedia_fontsize', state.fontSize);
    localStorage.setItem('encyclopedia_fontfamily', state.fontFamily);
}

/* ============ RENDER ============ */
function getFilteredStories() {
    return STORIES.filter(s => {
        if (state.category !== 'all' && s.category !== state.category) return false;
        if (state.status !== 'all' && s.text_status !== state.status) return false;
        if (state.showFavsOnly && !state.favorites.has(s.id)) return false;
        if (state.search.trim()) {
            const q = state.search.trim().toLowerCase();
            const hay = (s.title + ' ' + s.full_text + ' ' + s.source + ' ' + s.category).toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });
}

function render() {
    const grid = $('#grid');
    const stories = getFilteredStories();
    const total = STORIES.length;
    const favCount = state.favorites.size;
    const verbatimCount = STORIES.filter(s => s.text_status === 'verbatim').length;


    $('#statsBar').textContent = `إجمالي القصص: ${total} • المعروضة: ${stories.length} • المفضلة: ${favCount} • نصوص حرفية موثقة: ${verbatimCount}${state.status !== 'all' ? ' (فلتر نشط)' : ''}`;
    if (!stories.length) {
        grid.innerHTML = `<div class="empty">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <p>لا توجد نتائج مطابقة. جرّب كلمة بحث أخرى أو غيّر التصنيف.</p>
        </div>`;
        return;
    }

    grid.innerHTML = stories.map(s => {
        const isFav = state.favorites.has(s.id);
        const titleHtml = highlightText(escapeHtml(s.title), state.search);
        const excerptHtml = highlightText(escapeHtml(excerpt(s.full_text)), state.search);
        const sourceHtml = highlightText(escapeHtml(s.source), state.search);
        const st = STATUS_LABELS[s.text_status];
        const cls = statusClass(s.text_status);
        return `
        <article class="card" data-id="${s.id}">
            <div class="card-badges">
                <span class="card-category">${escapeHtml(s.category)}</span>
                <span class="status-badge ${cls}" title="${st.long}">${st.icon} ${st.short}</span>
            </div>
            <h3>${titleHtml}</h3>
            <p class="card-excerpt">${excerptHtml}</p>
            <div class="card-source">${sourceHtml}</div>
            <div class="card-actions">
                <button class="btn btn-read" data-id="${s.id}">
                    <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    اقرأ
                </button>
                <button class="btn btn-fav ${isFav ? 'active' : ''}" data-id="${s.id}">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    ${isFav ? 'محفوظة' : 'حفظ'}
                </button>
            </div>
        </article>`;
    }).join('');
}

/* ============ MODAL ============ */
function openStory(id) {
    const s = STORIES.find(x => x.id === id);
    if (!s) return;
    state.activeStory = s;

    $('#modalTitle').textContent = s.title;
    $('#modalCategory').textContent = s.category;

    const st = STATUS_LABELS[s.text_status];
    const cls = statusClass(s.text_status);
    const badge = $('#modalStatusBadge');
    badge.className = 'status-badge ' + cls;
    badge.textContent = `${st.icon} ${st.short}`;

    const paragraphs = s.full_text.split(/\n\s*\n/).filter(p => p.trim());
    const bodyHtml = paragraphs.map(p => {
        const safe = highlightText(escapeHtml(p.trim()), state.search);
        return `<p class="hadith-text">${safe}</p>`;
    }).join('');

    const bannerHtml = `
        <div class="status-banner ${cls}">
            <span class="icon">${st.icon}</span>
            <span>${st.long}</span>
        </div>`;

    const benefitsHtml = s.benefits && s.benefits.length ? `
        <h4 class="benefits-title">الفوائد والعبر المستفادة</h4>
        <ul class="benefits-list">
            ${s.benefits.map(b => `<li>${escapeHtml(b)}</li>`).join('')}
        </ul>` : '';

    $('#modalBody').innerHTML = `
        ${bannerHtml}
        ${bodyHtml}
        <div class="modal-source"><strong>المصدر:</strong> ${highlightText(escapeHtml(s.source), state.search)}</div>
        ${benefitsHtml}
    `;

    const favBtn = $('#modalFavBtn');
    const isFav = state.favorites.has(s.id);
    favBtn.classList.toggle('active', isFav);
    favBtn.querySelector('span').textContent = isFav ? 'محفوظة في المفضلة' : 'حفظ في المفضلة';

    // Verify button: enabled only when source_url exists
    const verifyBtn = $('#modalVerifyBtn');
    if (s.source_url) {
        verifyBtn.style.display = '';
        verifyBtn.onclick = () => window.open(s.source_url, '_blank', 'noopener');
    } else {
        verifyBtn.style.display = 'none';
    }

    $('#modalOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('#modalBody').scrollTop = 0;
}

function closeModal() {
    $('#modalOverlay').classList.remove('open');
    document.body.style.overflow = '';
    state.activeStory = null;
}

/* ============ EVENTS ============ */
function bindEvents() {
    let searchTimer;
    $('#searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.search = e.target.value;
            render();
        }, 120);
    });
    $('#filters').addEventListener('click', (e) => {
        const badge = e.target.closest('.filter-badge');
        if (!badge) return;
        $$('.filter-badge').forEach(b => b.classList.remove('active'));
        badge.classList.add('active');
        state.category = badge.dataset.cat;
        render();
    });
    $('#statusFilters').addEventListener('click', (e) => {
        const badge = e.target.closest('.filter-badge');
        if (!badge) return;
        $$('#statusFilters .filter-badge').forEach(b => b.classList.remove('active'));
        badge.classList.add('active');
        state.status = badge.dataset.status;
        render();
    });
    $('#favFilterBtn').addEventListener('click', () => {
        state.showFavsOnly = !state.showFavsOnly;
        $('#favFilterBtn').classList.toggle('active', state.showFavsOnly);
        render();
    });
    $('#themeBtn').addEventListener('click', () => {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        localStorage.setItem('encyclopedia_theme', state.theme);
        applyTheme();
    });
    $('#fontBtn').addEventListener('click', () => {
        $('#fontPanel').classList.toggle('show');
        $('#fontBtn').classList.toggle('active');
    });
    $('#fontPlus').addEventListener('click', () => {
        state.fontSize = Math.min(1.8, +(state.fontSize + 0.05).toFixed(2));
        applyFont();
    });
    $('#fontMinus').addEventListener('click', () => {
        state.fontSize = Math.max(0.85, +(state.fontSize - 0.05).toFixed(2));
        applyFont();
    });
    $('#fontSelect').addEventListener('change', (e) => {
        state.fontFamily = e.target.value;
        applyFont();
    });
    $('#grid').addEventListener('click', (e) => {
        const readBtn = e.target.closest('.btn-read');
        if (readBtn) { openStory(Number(readBtn.dataset.id)); return; }
        const favBtn = e.target.closest('.btn-fav');
        if (favBtn) {
            const id = Number(favBtn.dataset.id);
            if (state.favorites.has(id)) { state.favorites.delete(id); showToast('أُزيلت من المفضلة'); }
            else { state.favorites.add(id); showToast('أُضيفت إلى المفضلة'); }
            saveFavs(); render(); return;
        }
        const card = e.target.closest('.card');
        if (card && !e.target.closest('button')) openStory(Number(card.dataset.id));
    });
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalOverlay').addEventListener('click', (e) => {
        if (e.target === $('#modalOverlay')) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('#modalOverlay').classList.contains('open')) closeModal();
    });
    $('#modalFavBtn').addEventListener('click', () => {
        if (!state.activeStory) return;
        const id = state.activeStory.id;
        if (state.favorites.has(id)) { state.favorites.delete(id); showToast('أُزيلت من المفضلة'); }
        else { state.favorites.add(id); showToast('أُضيفت إلى المفضلة'); }
        saveFavs();
        const isFav = state.favorites.has(id);
        $('#modalFavBtn').classList.toggle('active', isFav);
        $('#modalFavBtn').querySelector('span').textContent = isFav ? 'محفوظة في المفضلة' : 'حفظ في المفضلة';
        render();
    });
    $('#modalCopyBtn').addEventListener('click', async () => {
        if (!state.activeStory) return;
        const s = state.activeStory;
        const text = `${s.title}\n\n[${STATUS_LABELS[s.text_status].short}]\n\n${s.full_text}\n\n${s.source}\n${s.source_url ? 'رابط التحقق: ' + s.source_url : ''}\n\nالفوائد:\n${s.benefits.map(b => '• ' + b).join('\n')}`;
        try {
            await navigator.clipboard.writeText(text);
            showToast('تم نسخ النص');
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('تم النسخ'); }
            catch { showToast('تعذّر النسخ'); }
            document.body.removeChild(ta);
        }
    });
    const scrollBtn = $('#scrollTop');
    window.addEventListener('scroll', () => {
        scrollBtn.classList.toggle('show', window.scrollY > 500);
    });
    scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

/* ============ PWA ============ */
function initPWA() {
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
}

/* ============ INIT ============ */
function init() {
    applyTheme();
    applyFont();
    bindEvents();
    render();
    initPWA();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
