<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B4332">
<title>الموسوعة الشاملة للقصص والحديث النبوي الصحيح</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;700&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #FAF6EE; --bg-alt: #F3EDE1; --card: #FFFDF9;
    --ink: #1C1A17; --ink-soft: #4A453D;
    --emerald: #1B4332; --emerald-light: #2D6A4F;
    --gold: #C5A059; --gold-light: #E9D8A6;
    --border: #D9CDB8; --shadow: rgba(27, 67, 50, 0.12);
    --mark: #F4D35E; --mark-text: #1C1A17;
    --font-body: 'Amiri', 'Scheherazade New', serif;
    --font-display: 'Cairo', 'Segoe UI', Tahoma, 'Geeza Pro', 'Noto Naskh Arabic', sans-serif;
    --font-size: 1.15rem;
    --status-green: #2D6A4F; --status-green-bg: rgba(45,106,79,.14);
    --status-yellow: #8B6914; --status-yellow-bg: rgba(197,160,89,.18);
    --status-orange: #B85C38; --status-orange-bg: rgba(184,92,56,.16);
}
[data-theme="dark"] {
    --bg: #12161A; --bg-alt: #181E24; --card: #1E242B;
    --ink: #E6E1D8; --ink-soft: #A8A296;
    --emerald: #4A7A63; --emerald-light: #6A9C82;
    --gold: #D4AF37; --gold-light: #8A7440;
    --border: #3A424B; --shadow: rgba(0, 0, 0, 0.4);
    --mark: #D4AF37; --mark-text: #12161A;
    --status-green: #7AB896; --status-green-bg: rgba(122,184,150,.14);
    --status-yellow: #E9D8A6; --status-yellow-bg: rgba(233,216,166,.12);
    --status-orange: #E89B7A; --status-orange-bg: rgba(232,155,122,.14);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-body); background: var(--bg); color: var(--ink);
    line-height: 1.9; font-size: var(--font-size);
    transition: background .35s, color .35s; min-height: 100vh;
    background-image:
        radial-gradient(circle at 15% 20%, rgba(197,160,89,.06) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(27,67,50,.05) 0%, transparent 45%);
}
body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.012) 2px, rgba(0,0,0,.012) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,.008) 3px, rgba(0,0,0,.008) 6px);
    z-index: 0;
}
[data-theme="dark"] body::before { opacity: .2; }
.geom-border { border: 2px solid var(--gold); position: relative; }
.geom-border::before {
    content: ""; position: absolute; inset: 4px; border: 1px solid var(--emerald);
    opacity: .45; pointer-events: none; border-radius: inherit;
}
header {
    position: relative; z-index: 2; text-align: center; padding: 2.2rem 1rem 1.4rem;
    background: linear-gradient(180deg, var(--bg-alt), transparent);
    border-bottom: 1px solid var(--border);
}
.header-ornament { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-bottom: .6rem; }
.header-ornament span { display: inline-block; width: 40px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.header-ornament svg { width: 28px; height: 28px; fill: var(--gold); }
h1 {
    font-family: var(--font-display); font-size: clamp(1.35rem, 3.6vw, 2.3rem);
    font-weight: 700; color: var(--emerald); letter-spacing: .5px; line-height: 1.5;
}
[data-theme="dark"] h1 { color: var(--gold); }
.subtitle { font-size: .95rem; color: var(--ink-soft); margin-top: .4rem; font-style: italic; }
.controls {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: .8rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center;
}
.search-wrap { flex: 1 1 340px; max-width: 680px; position: relative; }
.search-wrap svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; fill: var(--ink-soft); pointer-events: none;
}
#searchInput {
    width: 100%; padding: .7rem 2.7rem .7rem 1rem;
    font-family: var(--font-body); font-size: 1rem;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--border); border-radius: 50px; outline: none;
    transition: border .2s, box-shadow .2s;
}
#searchInput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    padding: .55rem .9rem; border-radius: 50px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
    font-family: var(--font-display); font-size: .85rem;
    cursor: pointer; transition: all .2s; white-space: nowrap; user-select: none;
}
.btn:hover { border-color: var(--gold); background: var(--bg-alt); }
.btn.active { background: var(--emerald); color: #fff; border-color: var(--emerald); }
[data-theme="dark"] .btn.active { background: var(--gold); color: #12161A; border-color: var(--gold); }
.btn svg { width: 16px; height: 16px; fill: currentColor; }
.filters {
    display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center;
    padding: .7rem 1rem; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2;
}
.filter-badge {
    padding: .35rem .9rem; border-radius: 50px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink-soft);
    font-family: var(--font-display); font-size: .78rem; cursor: pointer; transition: all .2s;
}
.filter-badge.active { background: var(--gold); color: #12161A; border-color: var(--gold); font-weight: 600; }
.stats-bar { text-align: center; font-size: .82rem; color: var(--ink-soft); padding: .2rem 1rem .8rem; position: relative; z-index: 2; }
.grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.3rem; padding: 1rem 1.2rem 3rem; max-width: 1320px; margin: 0 auto; position: relative; z-index: 2;
}
.card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 1.3rem 1.2rem 1.1rem; position: relative;
    box-shadow: 0 6px 22px -10px var(--shadow);
    transition: transform .25s, box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column; overflow: hidden;
}
.card::before {
    content: ""; position: absolute; top: 0; right: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, var(--emerald), var(--gold), var(--emerald)); opacity: .55;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 36px -14px var(--shadow); border-color: var(--gold); }
.card-badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
.card-category {
    font-family: var(--font-display); font-size: .68rem;
    padding: .18rem .7rem; border-radius: 50px;
    background: color-mix(in srgb, var(--emerald) 12%, transparent);
    color: var(--emerald); border: 1px solid color-mix(in srgb, var(--emerald) 30%, transparent);
}
[data-theme="dark"] .card-category {
    background: color-mix(in srgb, var(--gold) 15%, transparent);
    color: var(--gold); border-color: color-mix(in srgb, var(--gold) 35%, transparent);
}
.status-badge {
    font-family: var(--font-display); font-size: .65rem; font-weight: 600;
    padding: .18rem .65rem; border-radius: 50px; white-space: nowrap;
}
.status-badge.verbatim { background: var(--status-green-bg); color: var(--status-green); border: 1px solid var(--status-green); }
.status-badge.near { background: var(--status-yellow-bg); color: var(--status-yellow); border: 1px solid var(--status-yellow); }
.status-badge.summary { background: var(--status-orange-bg); color: var(--status-orange); border: 1px solid var(--status-orange); }
.card h3 {
    font-family: var(--font-display); font-size: 1.08rem; font-weight: 700;
    color: var(--emerald); line-height: 1.5; margin-bottom: .4rem;
}
[data-theme="dark"] .card h3 { color: var(--gold-light); }
.card-excerpt {
    font-size: .9rem; color: var(--ink-soft);
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: .8rem; flex: 1;
}
.card-source { font-size: .72rem; color: var(--gold); margin-bottom: .7rem; font-weight: 600; }
.card-actions {
    display: flex; gap: .5rem; flex-wrap: wrap;
    border-top: 1px dashed var(--border); padding-top: .7rem;
}
.card-actions .btn { padding: .38rem .75rem; font-size: .74rem; }
.btn-fav.active { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 15%, transparent); }
.btn-fav.active svg { fill: var(--gold); }
.modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10, 12, 14, .72);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
    padding: 1rem; opacity: 0; transition: opacity .25s;
}
.modal-overlay.open { display: flex; opacity: 1; }
.modal {
    background: var(--bg); border: 2px solid var(--gold); border-radius: 22px;
    width: 100%; max-width: 880px; max-height: 92vh;
    display: flex; flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); position: relative;
    animation: modalIn .3s ease; overflow: hidden;
}
@keyframes modalIn { from { transform: translateY(24px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header {
    padding: 1.2rem 1.4rem .8rem; border-bottom: 1px solid var(--border);
    position: relative; background: linear-gradient(180deg, var(--bg-alt), transparent);
}
.modal-header h2 {
    font-family: var(--font-display); font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    color: var(--emerald); line-height: 1.5; padding-left: 2.5rem;
}
[data-theme="dark"] .modal-header h2 { color: var(--gold); }
.modal-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; }
.modal-category {
    font-size: .72rem; font-family: var(--font-display);
    color: var(--gold); border: 1px solid var(--gold);
    padding: .1rem .65rem; border-radius: 50px;
}
.modal-close {
    position: absolute; top: 1rem; left: 1rem;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
    font-size: 1.2rem; cursor: pointer; display: grid; place-items: center; transition: all .2s;
}
.modal-close:hover { background: var(--emerald); color: #fff; border-color: var(--emerald); }
.modal-body {
    overflow-y: auto; padding: 1.3rem 1.5rem 2rem;
    font-size: var(--font-size); line-height: 2.1; text-align: justify;
    scrollbar-width: thin; scrollbar-color: var(--gold) transparent;
}
.modal-body::-webkit-scrollbar { width: 8px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
.modal-body p { margin-bottom: 1rem; }
.modal-body .hadith-text { text-indent: 1.5em; }
.status-banner {
    padding: .8rem 1rem; border-radius: 10px; margin-bottom: 1.2rem;
    font-size: .88rem; border-right: 4px solid; line-height: 1.75;
    display: flex; gap: .6rem; align-items: flex-start;
}
.status-banner .icon { font-size: 1.1rem; flex-shrink: 0; }
.status-banner.verbatim { background: var(--status-green-bg); border-color: var(--status-green); color: var(--status-green); }
.status-banner.near { background: var(--status-yellow-bg); border-color: var(--status-yellow); color: var(--status-yellow); }
.status-banner.summary { background: var(--status-orange-bg); border-color: var(--status-orange); color: var(--status-orange); }
[data-theme="dark"] .status-banner { color: var(--ink); }
[data-theme="dark"] .status-banner.verbatim { color: #C8E6D5; border-color: var(--status-green); }
[data-theme="dark"] .status-banner.near { color: #F3E9C5; border-color: var(--status-yellow); }
[data-theme="dark"] .status-banner.summary { color: #F5CBB8; border-color: var(--status-orange); }
.modal-source {
    margin-top: 1.3rem; padding: .9rem 1rem;
    background: color-mix(in srgb, var(--gold) 10%, transparent);
    border-right: 4px solid var(--gold); border-radius: 8px;
    font-size: .85rem; color: var(--ink-soft);
}
.modal-source strong { color: var(--emerald); font-family: var(--font-display); }
[data-theme="dark"] .modal-source strong { color: var(--gold); }
.benefits-title {
    font-family: var(--font-display); color: var(--emerald);
    margin: 1.2rem 0 .6rem; font-size: 1rem;
}
[data-theme="dark"] .benefits-title { color: var(--gold); }
.benefits-list { list-style: none; }
.benefits-list li { position: relative; padding-right: 1.5rem; margin-bottom: .5rem; font-size: .92rem; }
.benefits-list li::before { content: "◆"; position: absolute; right: 0; top: 0; color: var(--gold); font-size: .7rem; }
.modal-toolbar {
    display: flex; gap: .6rem; flex-wrap: wrap;
    padding: .8rem 1.4rem 1rem; border-top: 1px solid var(--border); background: var(--bg-alt);
}
.modal-toolbar .btn { flex: 1 1 auto; }
.btn-verify { background: var(--emerald); color: #fff; border-color: var(--emerald); }
.btn-verify:hover { background: var(--emerald-light); color: #fff; }
[data-theme="dark"] .btn-verify { background: var(--gold); color: #12161A; border-color: var(--gold); }
mark { background: var(--mark); color: var(--mark-text); padding: 0 .12em; border-radius: 3px; font-weight: 700; }
.empty {
    grid-column: 1 / -1; text-align: center; padding: 3rem 1rem;
    color: var(--ink-soft); font-size: 1.1rem;
}
.empty svg { width: 60px; height: 60px; fill: var(--border); margin-bottom: 1rem; }
.toast {
    position: fixed; bottom: 1.5rem; right: 50%; transform: translateX(50%) translateY(120%);
    background: var(--emerald); color: #fff; padding: .7rem 1.4rem; border-radius: 50px;
    font-family: var(--font-display); font-size: .85rem; z-index: 200;
    transition: transform .35s; box-shadow: 0 8px 30px rgba(0,0,0,.3); white-space: nowrap;
}
[data-theme="dark"] .toast { background: var(--gold); color: #12161A; }
.toast.show { transform: translateX(50%) translateY(0); }
.font-panel {
    display: none; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .5rem .8rem; background: var(--bg-alt); border-radius: 12px;
    border: 1px solid var(--border); font-size: .8rem;
}
.font-panel.show { display: flex; }
.font-panel select {
    font-family: var(--font-display); font-size: .8rem; padding: .35rem .6rem;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink);
}
.font-panel button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 1rem; cursor: pointer;
}
@media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; padding: .8rem .8rem 2.5rem; gap: 1rem; }
    .controls { padding: .6rem .7rem; gap: .45rem; }
    .btn { font-size: .76rem; padding: .45rem .7rem; }
    .modal-body { padding: 1rem 1.1rem 1.5rem; }
    .modal-header { padding: 1rem 1.1rem .7rem; }
}
#scrollTop {
    position: fixed; bottom: 1.4rem; left: 1.4rem; z-index: 50;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--emerald); color: #fff;
    border: 2px solid var(--gold); cursor: pointer;
    display: grid; place-items: center; opacity: 0; pointer-events: none;
    transition: all .3s; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
[data-theme="dark"] #scrollTop { background: var(--gold); color: #12161A; }
#scrollTop.show { opacity: 1; pointer-events: auto; }
#scrollTop svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>

<header>
    <div class="header-ornament">
        <span></span>
        <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9H22L16 13.5L18.5 21L12 16.5L5.5 21L8 13.5L2 9H9.5L12 2Z"/></svg>
        <span></span>
    </div>
    <h1>الموسوعة الشاملة للقصص والحديث النبوي الصحيح</h1>
</header>

<div class="controls" role="search">
    <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" id="searchInput" placeholder="ابحث في العناوين والنصوص والمصادر…" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="favFilterBtn" title="المفضلة">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        المفضلة
    </button>
    <button class="btn" id="fontBtn" title="إعدادات الخط">
        <svg viewBox="0 0 24 24"><path d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        الخط
    </button>
    <button class="btn" id="themeBtn" title="تبديل الوضع">
        <svg viewBox="0 0 24 24" id="themeIcon"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 14.5 5.5 5.5 0 016.5 9c0-2.12 1.2-3.96 2.96-4.88C10.92 3.04 11.46 3 12 3z"/></svg>
    </button>
</div>

<div style="text-align:center; position:relative; z-index:5;">
    <div class="font-panel" id="fontPanel">
        <span style="font-family:var(--font-display);color:var(--ink-soft)">حجم الخط:</span>
        <button id="fontMinus" title="تصغير">−</button>
        <span id="fontSizeLabel" style="min-width:2.4rem;text-align:center;font-weight:700">1.15</span>
        <button id="fontPlus" title="تكبير">+</button>
        <span style="width:1px;height:22px;background:var(--border)"></span>
        <label for="fontSelect" style="font-family:var(--font-display);color:var(--ink-soft)">نوع الخط:</label>
        <select id="fontSelect">
            <option value="Amiri">أميري</option>
            <option value="Scheherazade New">شهرزاد</option>
            <option value="Reem Kufi">ريم كوفي</option>
        </select>
    </div>
</div>

<div class="filters" id="filters">
    <button class="filter-badge active" data-cat="all">الكل</button>
    <button class="filter-badge" data-cat="قصص الأنبياء والأمم السابقة">قصص الأنبياء والأمم السابقة</button>
    <button class="filter-badge" data-cat="قصص السيرة والمغازي والشمائل">السيرة والمغازي</button>
    <button class="filter-badge" data-cat="الغيبيات والمشاهدات والأمثال">الغيبيات والأمثال</button>
</div>

<div class="filters" id="statusFilters">
    <button class="filter-badge active" data-status="all">كل النصوص</button>
    <button class="filter-badge" data-status="verbatim">🟢 حرفي موثق</button>
    <button class="filter-badge" data-status="near_verbatim">🟡 قريب بالمعنى</button>
    <button class="filter-badge" data-status="summary_with_reference">🟠 ملخّص + إحالة</button>
</div>

<div class="stats-bar" id="statsBar"></div>
<main class="grid" id="grid"></main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal geom-border">
        <div class="modal-header">
            <button class="modal-close" id="modalClose" aria-label="إغلاق">✕</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta">
                <span class="modal-category" id="modalCategory"></span>
                <span class="status-badge" id="modalStatusBadge"></span>
            </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-toolbar">
            <button class="btn" id="modalFavBtn">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span>حفظ في المفضلة</span>

قالت الثالثة: زوجي العشنق، إن أنطق أطلق، وإن أسكت أعلق.


قالت الرابعة: زوجي كليل تهامة، لا حر ولا قر، ولا مخافة ولا سآمة.


قالت الخامسة: زوجي إن دخل فهد، وإن خرج أسد، ولا يسأل عما عهد.


قالت السادسة: زوجي إن أكل لف، وإن شرب اشتف، وإن اضطجع التف، ولا يولج الكف ليعلم البث.

قالت الثامنة: زوجي المس مس أرنب، والريح ريح زرنب.


قالت التاسعة: زوجي رفيع العماد، طويل النجاد، عظيم الرماد، قريب البيت من الناد.


قالت العاشرة: زوجي مالك وما مالك؟ مالك خير من ذلك، له إبل كثيرات المبارك، قليلات المسارح، وإذا سمعن صوت المزهر أيقن أنهن هوالك.

    source_url: "https://sunnah.com/muslim:2942",
    full_text: `عن فاطمة بنت قيس رضي الله عنها قالت: سمعت نداء منادي رسول الله ﷺ ينادي: الصلاة جامعة. فخرجت إلى المسجد، فصليت مع رسول الله ﷺ، فكنت في صف النساء التي تلي ظهور القوم.


فلما قضى رسول الله ﷺ صلاته جلس على المنبر وهو يضحك، فقال: «ليلزم كل إنسان مصلاه، ثم قال: أتدرون لم جمعتكم؟» قالوا: الله ورسوله أعلم. قال: «إني والله ما جمعتكم لرغبة ولا لرهبة، ولكن جمعتكم لأن تميمًا الداري كان رجلًا نصرانيًا فجاء فبايع وأسلم، وحدثني حديثًا وافق الذي كنت أحدثكم عن مسيح الدجال.

قلنا: ويلك ما أنت؟ قال: قد قدرتم على خبري، فأخبروني ما أنتم؟ قالوا: نحن أناس من العرب، ركبنا في سفينة بحرية، فصادفنا البحر حين اغتلم، فلعب بنا الموج شهرًا، ثم أرفأنا إلى جزيرتك هذه، فجلسنا في أقربها، فدخلنا الجزيرة، فلقيتنا دابة أهلب كثير الشعر، لا يُدرى ما قبله من دبره من كثرة الشعر، فقلنا: ويلك ما أنت؟ فقالت: أنا الجساسة. قلنا: وما الجساسة؟ قالت: اعمدوا إلى هذا الرجل في الدير، فإنه إلى خبركم بالأشواق. فأقبلنا إليك سراعًا، وفزعنا منها، ولم نأمن أن تكون شيطانة.


قال: أخبروني عن نخل بيسان. قلنا: عن أي شأنها تستخبر؟ قال: أسألكم عن نخلها هل يثمر؟ قلنا له: نعم. قال: أما إنه يوشك أن لا تثمر.


قال: أخبروني عن بحيرة الطبرية. قلنا: عن أي شأنها تستخبر؟ قال: هل فيها ماء؟ قالوا: هي كثيرة الماء. قال: أما إن ماءها يوشك أن يذهب.


قال: أخبروني عن عين زغر. قالوا: عن أي شأنها تستخبر؟ قال: هل في العين ماء، وهل يزرع أهلها بماء العين؟ قلنا له: نعم، هي كثيرة الماء، وأهلها يزرعون من مائها.


قال: أخبروني عن نبي الأميين ما فعل؟ قالوا: قد خرج من مكة ونزل يثرب. قال: أقاتله العرب؟ قلنا: نعم. قال: كيف صنع بهم؟ فأخبرناه أنه قد ظهر على من يليه من العرب وأطاعوه. قال لهم: قد كان ذلك؟ قلنا: نعم. قال: أما إن ذاك خير لهم أن يطيعوه، وإني مخبركم عني: إني أنا المسيح، وإني أوشك أن يؤذن لي في الخروج، فأخرج فأسير في الأرض، فلا أدع قرية إلا هبطتها في أربعين ليلة، غير مكة وطيبة، فهما محرمتان علي كلتاهما، كلما أردت أن أدخل واحدة أو واحدًا منهما استقبلني ملك بيده السيف صلتًا يصدني عنها، وإن على كل نقب منها ملائكة يحرسونها.


قالت: قال رسول الله ﷺ وطعن بمخصرته في المنبر: «هذه طيبة، هذه طيبة، هذه طيبة» يعني المدينة. «ألا هل كنت حدثتكم ذلك؟» فقال الناس: نعم. «فإنه أعجبني حديث تميم أنه وافق الذي كنت أحدثكم عنه وعن المدينة ومكة، ألا إنه في بحر الشام أو بحر اليمن، لا بل من قبل المشرق، ما هو من قبل المشرق، ما هو من قبل المشرق» وأومأ بيده إلى المشرق.`,

    title: "قصة أصحاب الأخدود والساحر والراهب والغلام",

    text_status: "near_verbatim",
    source_url: "https://sunnah.com/muslim:3005",
    full_text: `عن صهيب أن رسول الله ﷺ قال: «كان ملك فيمن كان قبلكم، وكان له ساحر، فلما كبر قال للملك: إني قد كبرت، فابعث إلي غلامًا أعلمه السحر. فبعث إليه غلامًا يعلمه.


فكان في طريقه إذا سلك راهب، فقعد إليه وسمع كلامه فأعجبه، فكان إذا أتى الساحر مر بالراهب وقعد إليه، فإذا أتى الساحر ضربه، فشكى ذلك إلى الراهب، فقال: إذا خشيت الساحر فقل: حبسني أهلي، وإذا خشيت أهلك فقل: حبسني الساحر.


فبينما هو كذلك إذ أتى على دابة عظيمة قد حبست الناس، فقال: اليوم أعلم الساحر أفضل أم الراهب أفضل. فأخذ حجرًا فقال: اللهم إن كان أمر الراهب أحب إليك من أمر الساحر، فاقتل هذه الدابة حتى يمضي الناس. فرماهما فقتلها، ومضى الناس.


فأتى الراهب فأخبره، فقال له الراهب: أي بني، أنت اليوم أفضل مني، قد بلغ من أمرك ما أرى، وإنك ستبتلى، فإن ابتليت فلا تدل علي.


وكان الغلام يبرئ الأكمه والأبرص، ويداوي الناس من سائر الأدواء. فسمع جليس للملك كان قد عمي، فأتاه بهدايا كثيرة، فقال: ما هاهنا لك أجمع إن أنت شفيتني. فقال: إني لا أشفي أحدًا، إنما يشفي الله، فإن أنت آمنت بالله دعوت الله فشفاك. فآمن بالله فشفاه الله.


فأتى الملك فجلس إليه كما كان يجلس، فقال له الملك: من رد عليك بصرك؟ قال: ربي. قال: ولك رب غيري؟ قال: ربي وربك الله. فأخذه فلم يزل يعذبه حتى دل على الغلام. فجيء بالغلام، فقال له الملك: أي بني، قد بلغ من سحرك ما تبرئ الأكمه والأبرص وتفعل وتفعل؟ فقال: إني لا أشفي أحدًا، إنما يشفي الله. فأخذه فلم يزل يعذبه حتى دل على الراهب.


فجيء بالراهب، فقيل له: ارجع عن دينك. فأبى، فدعا بالمئشار فوضع المئشار في مفرق رأسه فشقه حتى وقع شقاه. ثم جيء بجليس الملك فقيل له: ارجع عن دينك. فأبى، فوضع المئشار في مفرق رأسه فشقه به حتى وقع شقاه.


ثم جيء بالغلام فقيل له: ارجع عن دينك. فأبى، فدفعه إلى نفر من أصحابه فقال: اذهبوا به إلى جبل كذا وكذا، فاصعدوا به الجبل، فإذا بلغتم ذروته فإن رجع عن دينه وإلا فاطرحوه. فذهبوا به فصعدوا به الجبل، فقال: اللهم اكفنيهم بما شئت. فرجف بهم الجبل فسقطوا، وجاء يمشي إلى الملك.


فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فدفعه إلى نفر من أصحابه فقال: اذهبوا به فاحملوه في قرقور، فتوسطوا به البحر، فإن رجع عن دينه وإلا فاقذفوه. فذهبوا به، فقال: اللهم اكفنيهم بما شئت. فانكفأت بهم السفينة فغرقوا، وجاء يمشي إلى الملك.


فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فقال للملك: إنك لست بقاتلي حتى تفعل ما آمرك به. قال: وما هو؟ قال: تجمع الناس في صعيد واحد، وتصلبني على جذع، ثم خذ سهمًا من كنانتي، ثم ضع السهم في كبد القوس، ثم قل: بسم الله رب الغلام، ثم ارمي، فإنك إذا فعلت ذلك قتلتني.


فجمع الناس في صعيد واحد، وصلبه على جذع، ثم أخذ سهمًا من كنانته، ثم وضع السهم في كبد القوس، ثم قال: بسم الله رب الغلام، ثم رماه، فوقع السهم في صدغه، فوضع يده في صدغه في موضع السهم فمات.


فقال الناس: آمنا برب الغلام، آمنا برب الغلام، آمنا برب الغلام. فأتي الملك فقيل له: أرأيت ما كنت تحذر، قد والله نزل بك حذرك، قد آمن الناس. فأمر بالأخدود في أفواه السكك فخدت، وأضرم النيران، وقال: من لم يرجع عن دينه فأحموه فيها، أو قيل له اقتحم. ففعلوا، حتى جاءت امرأة ومعها صبي يرضع، فتقاعست أن تقع في النار، فقال لها الغلام: يا أمه اصبري فإنك على الحق».`,

    title: "قصة جريج العابد",

    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:3436",
    full_text: `عن أبي هريرة عن النبي ﷺ قال: «كان في بني إسرائيل رجل عابد يقال له جريج، يتعبد في صومعة له. فأنته أمه فقالت: يا جريج إني أنا أمك، أشرف علي أكلمك. فأقبل على الصلاة، فقال: أي رب، صلاتي وأمي. فأقبل على الصلاة، فمضى في صلاته.


فقالت: اللهم لا تمته حتى تربه المؤسسة. وكانت راعية ترعى وتؤي غنمها إلى ظل صومعته، فأصابت فاحشة فحملت، فقالوا: ممن هذا الحمل؟ فقالت: من جريج صاحب الصومعة. وكان زنا بها رجل راعي ضأن.


فجاؤوا بالفؤوس، فقالوا: يا جريج يا جريج يا مرائي، انزل. فجعل يصلي، فلما رأوه لا يلتفت إليهم أخذوا في هدم صومعته، فنزل إليهم، فجعلوا في عنقه وعنقها حبلًا، فقرنوهما، فطافوا بهما في الناس.


فوضع إصبعه على بطنها، فقال: يا غلام من أبوك؟ فقال: أي فلان راعي الضأن. فتركوه، وقالوا له: إن شئت بنينا لك صومعتك من ذهب، وإن شئت من فضة. فقال: لا، ولكن أعيدوها كما كانت».`,

{

    title: "قصة الأبرص والأقرع والأعمى",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:3464",
    full_text: `عن أبي هريرة أنه سمع رسول الله ﷺ يقول: «إن ثلاثة في بني إسرائيل: أبرص وأقرع وأعمى، بدا لله عز وجل أن يبتليهم، فبعث إليهم ملكًا.


فأتى الأبرص، فقال: أي شيء أحب إليك؟ قال: لون حسن، وجلد حسن، قد قذرني الناس. قال: فمسحه فذهب عنه، فأعطي لونًا حسنًا وجلدًا حسنًا. فقال: أي المال أحب إليك؟ قال: الإبل. فأعطي ناقة عشراء، فقال: يبارك لك فيها.


وأتى الأقرع، فقال: أي شيء أحب إليك؟ قال: شعر حسن، ويذهب عني هذا، قد قذرني الناس. قال: فمسحه فذهب، وأعطي شعرًا حسنًا. قال: فأي المال أحب إليك؟ قال: البقر. فأعطاه بقرة حاملًا، وقال: يبارك لك فيها.


وأتى الأعمى، فقال: أي شيء أحب إليك؟ قال: يرد الله إلي بصري، فأبصر به الناس. قال: فمسحه فرد الله إليه بصره. قال: فأي المال أحب إليك؟ قال: الغنم. فأعطاه شاة والدًا.


فأنتج هذان وولد هذا، فكان لهذا واد من إبل، ولهذا واد من بقر، ولهذا واد من غنم.


ثم إنه أتى الأبرص في صورته وهيئته، فقال: رجل مسكين تقطعت بي الحبال في سفري، فلا بلاغ اليوم إلا بالله ثم بك، أسألك بالذي أعطاك اللون الحسن والجلد الحسن والمال، بعيرًا أتبلغ عليه في سفري.


فقال له: إن الحقوق كثيرة. فقال له: كأني أعرفك، ألم تكن أبرص يقذرك الناس فقيرًا، فأعطاك الله؟ فقال: لقد ورثت لكابر عن كابر. فقال: إن كنت كاذبًا فصيرك الله إلى ما كنت.


وأتى الأقرع في صورته وهيئته، فقال له مثل ما قال لهذا، فرد عليه مثل ما رد عليه هذا، فقال: إن كنت كاذبًا فصيرك الله إلى ما كنت.


وأتى الأعمى في صورته، فقال: رجل مسكين وابن سبيل، وتقطعت بي الحبال في سفري، فلا بلاغ اليوم إلا بالله ثم بك، أسألك بالذي رد عليك بصرك شاة أتبلغ بها في سفري.


فقال: قد كنت أعمى فرد الله إلي بصري، وفقيرًا فقد أغناني، فخذ ما شئت، فوالله لا أجهضك اليوم بشيء أخذته لله. فقال: أمسك مالك، فإنما ابتليتم، فقد رضي الله عنك، وسخط على صاحبيك».`,

    source_url: "https://sunnah.com/bukhari:2272",
    full_text: `عن عبد الله بن عمر رضي الله عنهما قال: سمعت رسول الله ﷺ يقول: «انطلق ثلاثة رهط ممن كان قبلكم حتى أووا المبيت إلى غار فدخلوه، فانحدرت صخرة من الجبل فسدت عليهم الغار.


فقالوا: إنه لا ينجيكم من هذه الصخرة إلا أن تدعوا الله بصالح أعمالكم.


فقال رجل منهم: اللهم كان لي أبوان شيخان كبيران، وكنت لا أغبق قبلهما أهلًا ولا مالًا، فنأى بي في طلب شيء يومًا، فلم أرح عليهما حتى ناما، فحلبت لهما غبوقهما فوجدتهما نائمين، وكرهت أن أغبق قبلهما أهلًا أو مالًا، فلبثت والقدح على يدي أنتظر استيقاظهما حتى برق الفجر، فاستيقظا فشربا غبوقهما. اللهم إن كنت فعلت ذلك ابتغاء وجهك ففرج عنا ما نحن فيه من هذه الصخرة. فانفرجت شيئًا لا يستطيعون الخروج.


وقال الآخر: اللهم كانت لي بنت عم كانت أحب الناس إلي، فأردتها عن نفسها فامتنعت مني، حتى ألمت بها سنة من السنين، فجاءتني فأعطيتها عشرين ومائة دينار على أن تخلي بيني وبين نفسها، ففعلت. حتى إذا قدرت عليها قالت: لا أحل لك أن تفض الخاتم إلا بحقه. فتحرجت من الوقوع عليها، فانصرفت عنها وهي أحب الناس إلي، وتركت الذهب الذي أعطيتها. اللهم إن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه. فانفرجت الصخرة غير أنهم لا يستطيعون الخروج منها.


وقال الثالث: اللهم إني استأجرت أجراء فأعطيتهم أجرهم، غير رجل واحد ترك الذي له وذهب، فثمرت أجره حتى كثرت منه الأموال، فجاءني بعد حين فقال: يا عبد الله أد إلي أجري. فقلت له: كل ما ترى من أجرك من الإبل والبقر والغنم والرقيق. فقال: يا عبد الله لا تستهزئ بي. فقلت: إني لا أستهزئ بك. فأخذه كله فاستاقه فلم يترك منه شيئًا. اللهم إن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه. فانفرجت الصخرة فخرجوا يمشون».`,

{

    title: "قصة قاتل المائة نفس",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "verbatim",
    source_url: "https://sunnah.com/muslim:2766",
    full_text: `عن أبي سعيد الخدري أن نبي الله ﷺ قال: «كان فيمن كان قبلكم رجل قتل تسعة وتسعين نفسًا، فسأل عن أعلم أهل الأرض، فدل على راهب، فأتاه فقال: إنه قتل تسعة وتسعين نفسًا، فهل له من توبة؟ فقال: لا. فقتله فكمل به مائة.


ثم سأل عن أعلم أهل الأرض، فدل على رجل عالم، فقال: إنه قتل مائة نفس، فهل له من توبة؟ فقال: نعم، ومن يحول بينه وبين التوبة؟ انطلق إلى أرض كذا وكذا، فإن بها أناسًا يعبدون الله، فاعبد الله معهم، ولا ترجع إلى أرضك فإنها أرض سوء.

    source_url: "https://sunnah.com/bukhari:2291",
    full_text: `عن أبي هريرة رضي الله عنه عن رسول الله ﷺ أنه ذكر رجلًا من بني إسرائيل سأل بعض بني إسرائيل أن يسلفه ألف دينار، فقال: ائتني بالشهداء أشهدهم. فقال: كفى بالله شهيدًا. قال: فأتني بالكفيل. قال: كفى بالله كفيلًا. قال: صدقت. فدفعها إليه إلى أجل مسمى.


فخرج في البحر فقضى حاجته، ثم التمس مركبًا يركبها يقدم عليه للأجل الذي أجله، فلم يجد مركبًا. فأخذ خشبة فنقرها، فأدخل فيها ألف دينار وصحيفة منه إلى صاحبه، ثم زجج موضعها، ثم أتى بها إلى البحر.


فقال: اللهم إنك تعلم أني كنت تسلفت فلانًا ألف دينار، فسألني كفيلًا فقلت: كفى بالله كفيلًا، فرضي بك. وسألني شهيدًا فقلت: كفى بالله شهيدًا، فرضي بك. وأنا جهدت أن أجد مركبًا أبعث إليه الذي له فلم أجد، وإني أستودعكها. فرمى بها في البحر حتى ولجت فيه، ثم انصرف.


فخرج صاحب المال ينظر إلى مركبه الذي خرج فيه، فوجد الخشبة التي ألقى بها، فأخذها لينتفع بها، فلما نشرها وجد المال والصحيفة.


ثم قدم الرجل الذي كان تسلف منه، فأتاه بالمال، فقال: والله ما زلت جاهدًا في طلب مركب إليك لآتيك بمالك، فما وجدت مركبًا قبل الذي أتيت فيه. فقال: هل كنت بعثت إلي شيئًا؟ قال: أخبرك أني لم أجد مركبًا قبل الذي جئت فيه. قال: فإن الله قد أدى عنك الذي بعثت في الخشبة، فانصرف بالألف الدينار راشدًا».`,

    full_text: `عن أبي هريرة قال: أرسل ملك الموت إلى موسى عليهما السلام، فلما جاءه صكه، فرجع إلى ربه فقال: أرسلتني إلى عبد لا يريد الموت.


قال: ارجع إليه فقل له: يضع يده على متن ثور، فله بكل ما غطت به يده بكل شعرة سنة. قال: أي رب، ثم ماذا؟ قال: ثم الموت. قال: فالآن.


فقال: رب أدنني من الأرض المقدسة رمية بحجر. قال رسول الله ﷺ: «والذي نفسي بيده لو أني عنده لأريتكم قبره إلى جانب الطريق عند الكثيب الأحمر».`,

{
    id: 13,
    title: "قصة كعب بن مالك وتخلفه عن تبوك (كاملة)",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "verbatim",
    source_url: "https://sunnah.com/bukhari:4418",
    full_text: `عن عبد الله بن كعب بن مالك — وكان قائد كعب من بنيه حين عمي — قال: سمعت كعب بن مالك يحدث حين تخلف عن قصة تبوك.


قال كعب: لم أتخلف عن رسول الله ﷺ في غزوة غزاها إلا في غزوة تبوك، غير أني كنت تخلفت في غزوة بدر، ولم يعاتب أحدًا تخلف عنها، إنما خرج رسول الله ﷺ يريد عير قريش حتى جمع الله بينهم وبين عدوهم على غير ميعاد.


ولقد شهدت مع رسول الله ﷺ ليلة العقبة حين تواثقنا على الإسلام، وما أحب أن لي بها مشهد بدر، وإن كانت بدر أذكر في الناس منها.


كان من خبري أني لم أكن قط أقوى ولا أيسر حين تخلفت عنه في تلك الغزاة، والله ما اجتمعت عندي قبله راحلتان قط حتى جمعتهما في تلك الغزوة. ولم يكن رسول الله ﷺ يريد غزوة إلا ورى بغيرها، حتى كانت تلك الغزوة غزاها رسول الله ﷺ في حر شديد، واستقبل سفرًا بعيدًا، ومفازًا، وعدوًا كثيرًا.


فجلى للمسلمين أمرهم ليتأهبوا أهبة غزوهم، فأخبرهم بوجهه الذي يريد، والمسلمون مع رسول الله ﷺ كثير، ولا يجمعهم كتاب حافظ. قال كعب: فما رجل يريد أن يتغيب إلا ظن أن سيخفى له ما لم ينزل فيه وحي الله.


وغزا رسول الله ﷺ تلك الغزوة حين طابت الثمار والظلال، وتجهز رسول الله ﷺ والمسلمون معه. فطفقت أغدو لكي أتجهز معهم، فأرجع ولم أقض شيئًا، فأقول في نفسي: أنا قادر عليه. فلم يزل يتمادى بي حتى اشتد بالناس الجد، فأصبح رسول الله ﷺ والمسلمون معه ولم أقض من جهازي شيئًا.


فقلت: أتجهز بعده بيوم أو يومين ثم ألحقهم. فغدوت بعد أن فصلوا لأتجهز، فرجعت ولم أقض شيئًا، ثم غدوت ثم رجعت ولم أقض شيئًا. فلم يزل بي حتى أسرعوا وتفارط الغزو، وهممت أن أرتحل فأدركهم، وليتني فعلت، فلم يقدر لي ذلك.


فكنت إذا خرجت في الناس بعد خروج رسول الله ﷺ فطفت فيهم أحزنني أني لا أرى إلا رجلًا مغموصًا عليه النفاق، أو رجلًا ممن عذر الله من الضعفاء. ولم يذكرني رسول الله ﷺ حتى بلغ تبوك، فقال وهو جالس في القوم بتبوك: «ما فعل كعب؟» فقال رجل من بني سلمة: يا رسول الله، حبسه برداه ونظره في عطفه. فقال معاذ بن جبل: بئس ما قلت، والله يا رسول الله ما علمنا عليه إلا خيرًا. فسكت رسول الله ﷺ.


قال كعب بن مالك: فلما بلغني أنه توجه قافلًا حضرني همي، وطفقت أتذكر الكذب وأقول: بماذا أخرج من سخطه غدًا، واستعنت على ذلك بكل ذي رأي من أهلي.


فلما قيل إن رسول الله ﷺ قد أظل قادمًا زاح عني الباطل، وعرفت أني لن أخرج منه أبدًا بشيء فيه كذب، فأجمعت صدقه.


وأصبح رسول الله ﷺ قادمًا، وكان إذا قدم من سفر بدأ بالمسجد فيركع فيه ركعتين، ثم جلس للناس. فلما فعل ذلك جاءه المخلفون فطفقوا يعتذرون إليه ويحلفون له، وكانوا بضعة وثمانين رجلًا، فقبل منهم رسول الله ﷺ علانيتهم وبايعهم واستغفر لهم، ووكل سرائرهم إلى الله.


فجئته، فلما سلمت عليه تبسم تبسم المغضب، ثم قال: «تعال». فجئت أمشي حتى جلست بين يديه، فقال لي: «ما خلفك، ألم تكن قد ابتعت ظهرك؟» فقلت: بلى، إني والله لو جلست عند غيرك من أهل الدنيا لرأيت أن سأخرج من سخطه بعذر، ولقد أعطيت جدلًا، ولكني والله لقد علمت لئن حدثتك اليوم حديث كذب ترضى به عني، ليوشكن الله أن يسخطك علي، ولئن حدثتك حديث صدق تجد علي فيه، إني لأرجو فيه عفو الله، لا والله ما كان لي من عذر، والله ما كنت قط أقوى ولا أيسر مني حين تخلفت عنك.


فقال رسول الله ﷺ: «أما هذا فقد صدق، فقم حتى يقضي الله فيك». فقمت، وثار رجال من بني سلمة فاتبعوني، فقالوا لي: والله ما علمناك كنت أذنبت ذنبًا قبل هذا، ولقد عجزت أن لا تكون اعتذرت إلى رسول الله ﷺ بما اعتذر إليه المتخلفون، قد كان كافيك ذنبك استغفار رسول الله ﷺ لك.


فوالله ما زالوا يؤنبونني حتى أردت أن أرجع فأكذب نفسي، ثم قلت لهم: هل لقي هذا معي أحد؟ قالوا: نعم، رجلان قالا مثل ما قلت، فقيل لهما مثل ما قيل لك. فقلت: من هما؟ قالوا: مرارة بن الربيع العمري، وهلال بن أمية الواقفي. فذكروا لي رجلين صالحين قد شهدا بدرًا، فيهما أسوة. فمضيت حين ذكروهما لي.


ونهى رسول الله ﷺ المسلمين عن كلامنا أيها الثلاثة من بين من تخلف عنه، فاجتنبنا الناس وتغيروا لنا، حتى تنكرت في نفسي الأرض، فما هي التي أعرف.


فلبثنا على ذلك خمسين ليلة، فأما صاحباي فاستكانا وقعدا في بيوتهما يبكيان، وأما أنا فكنت أشب القوم وأجلدهم، فكنت أخرج فأشهد الصلاة مع المسلمين، وأطوف في الأسواق ولا يكلمني أحد.


وآتي رسول الله ﷺ فأ سلم عليه وهو في مجلسه بعد الصلاة، فأقول في نفسي: هل حرك شفتيه برد السلام علي أم لا؟ ثم أصلي قريبًا منه، فأ سارقه النظر، فإذا أقبلت على صلاتي أقبل إلي، وإذا التفت نحوه أعرض عني.


حتى إذا طال علي ذلك من جفوة الناس، مشيت حتى تسورت جدار حائط أبي قتادة، وهو ابن عمي وأحب الناس إلي، فسلمت عليه، فوالله ما رد علي السلام. فقلت: يا أبا قتادة، أنشدك بالله هل تعلمني أحب الله ورسوله؟ فسكت، فعدت له فنشدته، فسكت، فعدت له فنشدته، فقال: الله ورسوله أعلم. ففاضت عيناي وتوليت حتى تسورت الجدار.


فبينا أنا أمشي بسوق المدينة إذا نبطي من أنباط أهل الشام ممن قدم بالطعام يبيعه بالمدينة يقول: من يدل على كعب بن مالك؟ فطفق الناس يشيرون له، حتى إذا جاءني دفع إلي كتابًا من ملك غسان، فإذا فيه: أما بعد، فإنه قد بلغني أن صاحبك قد جفاك، ولم يجعلك الله بدار هوان ولا مضيعة، فالحق بنا نواسك.


فقلت لما قرأتها: وهذا أيضًا من البلاء. فتيممت بها التنور فسجرته بها.


حتى إذا مضت أربعون ليلة من الخمسين إذا رسول رسول الله ﷺ يأتيني، فقال: إن رسول الله ﷺ يأمرك أن تعتزل امرأتك. فقلت: أطلقها أم ماذا أفعل؟ قال: لا، بل اعتزلها ولا تقربها. وأرسل إلى صاحبي مثل ذلك.


فقلت لامرأتي: الحقي بأهلك ف تكوني عندهم حتى يقضي الله في هذا الأمر.


قال كعب: فجاءت امرأة هلال بن أمية رسول الله ﷺ فقالت: يا رسول الله، إن هلال بن أمية شيخ ضائع ليس له خادم، فهل تكره أن أخدمه؟ قال: «لا، ولكن لا يقربك». قالت: إنه والله ما به حركة إلى شيء، والله ما زال يبكي منذ كان من أمره ما كان إلى يومه هذا.


فقال لي بعض أهلي: لو استأذنت رسول الله ﷺ في امرأتك كما أذن لامرأة هلال بن أمية أن تخدمه. فقلت: والله لا أستأذن فيها رسول الله ﷺ، وما يدريك ما يقول رسول الله ﷺ إذا استأذنته فيها وأنا رجل شاب.


فلبثت بعد ذلك عشر ليال حتى كملت لنا خمسون ليلة من حين نهى رسول الله ﷺ عن كلامنا.


فلما صليت صلاة الفجر صبح خمسين ليلة، وأنا على ظهر بيت من بيوتنا، فبينا أنا جالس على الحال التي ذكر الله قد ضاقت علي نفسي وضاقت علي الأرض بما رحبت، سمعت صوت صارخ أوفى على جبل سلع بأعلى صوته: يا كعب بن مالك، أبشر. قال: فخررت ساجدًا، وعرفت أن قد جاء فرج.


وآذن رسول الله ﷺ بتوبة الله علينا حين صلى صلاة الفجر، فذهب الناس يبشروننا، وذهب قبل صاحبي مبشرون، وركض إلي رجل فرسًا، وسعى ساع من أسلم فأوفى على الجبل، وكان الصوت أسرع من الفرس.


فلما جاءني الذي سمعت صوته يبشرني نزعت له ثوبي فكسوته إياهما ببشراه، والله ما أملك غيرهما يومئذ، واستعرت ثوبين فلبستهما، وانطلقت إلى رسول الله ﷺ.`,

{
    id: 14,
    title: "حادثة الإفك (كاملة)",
    category: "قصص السيرة والمغازي والشمائل",
    text_status: "verbatim",
    source_url: "https://sunnah.com/bukhari:4141",
    full_text: `عن عائشة رضي الله عنها زوج النبي ﷺ حين قال لها أهل الإفك ما قالوا، وكلهم حدثني طائفة من حديثها، وبعضهم كان أوعى لحديثها من بعض، وأثبت له اقتصاصًا.


قالت عائشة: كان رسول الله ﷺ إذا أراد سفرًا أقرع بين أزواجه، فأيتهن خرج سهمها خرج بها رسول الله ﷺ معه. قالت عائشة: فأقرع بيننا في غزوة غزاها، فخرج فيها سهمي، فخرجت مع رسول الله ﷺ بعد ما أنزل الحجاب، فكنت أحمل في هودجي وأنزل فيه.


فسرنا حتى إذا فرغ رسول الله ﷺ من غزوته تلك وقفل، ددنونا من المدينة قافلين، آذن ليلة بالرحيل. فقمت حين آذنوا بالرحيل، فمشيت حتى جاوزت الجيش، فلما قضيت شأني أقبلت إلى رحلي، فلمست صدري فإذا عقد لي من جزع ظفار قد انقطع، فرجعت فالتمست عقدي فحبسني ابتغاؤه.


وأقبل الرهط الذين كانوا يرحلوني فاحتملوا هودجي، فرحلوه على بعيري الذي كنت أركب عليه، وهم يحسبون أني فيه. وكان النساء إذ ذاك خفافًا لم يهبلن، ولم يغشهن اللحم، إنما يأكلن العلفة من الطعام، فلم يستنكر القوم خفة الهودج حين رفعوه وحملوه.


وكنت جارية حديثة السن، فبعثوا الجمل فساروا، ووجدت عقدي بعد ما استمر الجيش، فجئت منازلهم وليس بها منهم داع ولا مجيب، فتيممت منزلي الذي كنت به، وظننت أنهم سيفقدونني فيرجعون إلي.


فبينا أنا جالسة في منزلي غلبتني عيني فنمت. وكان صفوان بن المعطل السلمي ثم الذكواني من وراء الجيش، فأصبح عند منزلي، فرأى سواد إنسان نائم، فعرفني حين رآني، وكان رآني قبل الحجاب. فاستيقظت باسترجاعه حين عرفني، فخمرت وجهي بجلبابي، والله ما تكلمنا بكلمة، ولا سمعت منه كلمة غير استرجاعه.


وهوى حتى أناخ راحلته، فوطئ على يدها، فقمت إليها فركبتها، فانطلق يقود بي الراحلة حتى أتينا الجيش موغرين في نحر الظهيرة وهم نزول.


قالت: فهلك من هلك، وكان الذي تولى كبر الإفك عبد الله بن أبي ابن سلول. قال عروة: أخبرت أنه كان يشاع ويتحدث به عنده، فيقره ويستمعه ويستوشيه.


قالت عائشة: فقدمنا المدينة، فاشتكيت حين قدمت شهرًا، والناس يفيضون في قول أصحاب الإفك، لا أشعر بشيء من ذلك. وهو يريبني في وجعي أني لا أعرف من رسول الله ﷺ اللطف الذي كنت أرى منه حين أشتكي، إنما يدخل علي رسول الله ﷺ فيسلم، ثم يقول: «كيف تيكم» ثم ينصرف، فذلك يريبني ولا أشعر بالشر.


حتى خرجت حين نقمت، فخرجت مع أم مسطح قبل المناصع، وكان متبرزنا، وكنا لا نخرج إلا ليلًا إلى ليل. وذلك قبل أن نتخذ الكنف قريبًا من بيوتنا. قالت: فأقبلت أنا وأم مسطح قبل بيتي حين فرغنا من شأننا، فعثرت أم مسطح في مرطها فقالت: تعس مسطح. فقلت لها: بئس ما قلت، أتسبين رجلًا شهد بدرًا؟ فقالت: أي هنتاه، ولم تسمعي ما قال؟ قالت: وقلت: ما قال؟ فأخبرتني بقول أهل الإفك.


قالت: فازددت مرضًا على مرضي. فلما رجعت إلى بيتي دخل علي رسول الله ﷺ فسلم، ثم قال: «كيف تيكم؟» فقلت له: أتأذن لي أن آتي أبوي؟ قالت: وأريد أن أستيقن الخبر من قبلهما. قالت: فأذن لي رسول الله ﷺ.


فقلت لأمي: يا أمتاه، ماذا يتحدث الناس؟ قالت: يا بنية، هوني عليك، فوالله لقلما كانت امرأة قط وضيئة عند رجل يحبها، لها ضرائر، إلا كثرن عليها. قالت: فقلت: سبحان الله، أولقد تحدث الناس بهذا؟ قالت: فبكيت تلك الليلة حتى أصبحت لا يرقأ لي دمع ولا أكتحل بنوم.


ثم أصبحت أبكي. قالت: ودعا رسول الله ﷺ علي بن أبي طالب وأسامة بن زيد حين استلبث الوحي، يسألهما ويستشيرهما في فراق أهله.


قالت: فأما أسامة فأشار على رسول الله ﷺ بالذي يعلم من براءة أهله، وبالذي يعلم لهم في نفسه، فقال أسامة: أهلك، ولا نعلم إلا خيرًا. وأما علي فقال: يا رسول الله، لم يضيق الله عليك، والنساء سواها كثير، وسل الجارية تصدقك.


قالت: فدعا رسول الله ﷺ بريرة، فقال: «أي بريرة، هل رأيت من شيء يريبك؟» قالت له بريرة: والذي بعثك بالحق، ما رأيت عليها أمرًا قط أغمصه، غير أنها جارية حديثة السن، تنام عن عجين أهلها، فتأتي الداجن فتأكله.


قالت: فقام رسول الله ﷺ من يومه فاستعذر من عبد الله بن أبي، وهو على المنبر، فقال: «يا معشر المسلمين، من يعذرني من رجل قد بلغني عنه أذاه في أهلي، والله ما علمت على أهلي إلا خيرًا، ولقد ذكروا رجلًا ما علمت عليه إلا خيرًا، وما يدخل على أهلي إلا معي».


قالت: فقام سعد بن معاذ أخو بني عبد الأشهل فقال: أنا يا رسول الله، أعذرك، فإن كان من الأوس ضربت عنقه، وإن كان من إخواننا من الخزرج أمرتنا ففعلنا أمرك.


قالت: فقام رجل من الخزرج، وكانت أم حسان بنت عمه من فخذه، وهو سعد بن عبادة، وهو سيد الخزرج. قالت: وكان قبل ذلك رجلًا صالحًا، ولكن احتملته الحمية، فقال لسعد: كذبت لعمرو الله لا تقتله، ولا تقدر على قتله، ولو كان من رهطك ما أحببت أن يقتل.


فقام أسيد بن حضير، وهو ابن عم سعد، فقال لسعد بن عبادة: كذبت لعمرو الله لنقتلنه، فإنك منافق تجادل عن المنافقين.


قالت: فثار الحيان الأوس والخزرج حتى هموا أن يقتتلوا، ورسول الله ﷺ قائم على المنبر. قالت: فلم يزل رسول الله ﷺ يخفضهم حتى سكتوا وسكت.


قالت: فبكيت يومي ذلك كله لا يرقأ لي دمع ولا أكتحل بنوم. قالت: وأصبح أبواي عندي، وقد بكيت ليلتين ويومًا لا يرقأ لي دمع ولا أكتحل بنوم، حتى إني لأظن أن البكاء فالق كبدي.


فبينا أبواي جالسان عندي وأنا أبكي، فاستأذنت علي امرأة من الأنصار فأذنت لها، فجلست تبكي معي.`,

    title: "صلح الحديبية",

    source_url: "https://sunnah.com/bukhari:2731",
    full_text: `عن المسور بن مخرمة ومروان، يصدّق كل واحد منهما حديث صاحبه، قالا: خرج رسول الله ﷺ زمن الحديبية، حتى إذا كانوا ببعض الطريق قال النبي ﷺ: «إن خالد بن الوليد بالغميم في خيل لقريش طليعة، فخذوا ذات اليمين». فوالله ما شعر بهم خالد حتى إذا هم بقترة الجيش، فانطلق يركض نذيرًا لقريش.


وسار النبي ﷺ حتى إذا كان بالثنية التي يهبط عليهم منها بركت به راحلته، فقال الناس: حل حل. فألحت، فقالوا: خلأت القصواء، خلأت القصواء. فقال النبي ﷺ: «ما خلأت القصواء، وما ذاك لها بخلق، ولكن حبسها حابس الفيل».


ثم قال: «والذي نفسي بيده، لا يسألوني خطة يعظمون فيها حرمات الله إلا أعطيتهم إياها». ثم زجرها فوثبت.


قال: فعدل عنهم حتى نزل بأقصى الحديبية على ثمد قليل الماء، يتبرضه الناس تبرضًا، فلم يلبثه الناس حتى نزحوه. وشكي إلى رسول الله ﷺ العطش، فانتزع سهمًا من كنانته، ثم أمرهم أن يجعلوه فيه، فوالله ما زال يجيش لهم بالري حتى صدروا عنه.


فبينما هم كذلك إذ جاء بديل بن ورقاء الخزاعي في نفر من قومه من خزاعة، وكانوا عيبة نصح رسول الله ﷺ من أهل تهامة، فقال: إني تركت كعب بن لؤي وعامر بن لؤي نزلوا أعداد مياه الحديبية، ومعهم العوذ المطافيل، وهم مقاتلوك وصادوك عن البيت.


فقال رسول الله ﷺ: «إنا لم نجئ لقتال أحد، ولكنا جئنا معتمرين، وإن قريشًا قد نهكتهم الحرب، وأضرت بهم، فإن شاؤوا ماددتهم مدة، ويخلوا بيني وبين الناس، فإن أظهر فإن شاؤوا أن يدخلوا فيما دخل فيه الناس فعلوا، وإلا فقد جموا. وإن هم أبوا، فوالذي نفسي بيده لأقاتلنهم على أمري هذا حتى تنفرد سالفتي، ولينفذن الله أمره».


قال: فانطلق بديل حتى أتى قريشًا، فأخبرهم. فقام عروة بن مسعود الثقفي فقال: أي قوم، ألستم بالوالد؟ قالوا: بلى. قال: أولست بالولد؟ قالوا: بلى. قال: فهل تتهموني؟ قالوا: لا. قال: فإن هذا قد عرض لكم خطة رشد، اقبلوها ودعوني آتيه. قالوا: ائته.


فأتى النبي ﷺ فجعل يكلمه، فقال النبي ﷺ نحوا من قوله لبديل. فقال عروة عند ذلك: أي محمد، أرأيت إن استأصلت أمر قومك، هل سمعت بأحد من العرب اجتاح أهله قبلك؟ وإن تكن الأخرى، فإني والله لأرى وجوهًا، وإني لأرى أشوابًا من الناس خليقًا أن يفروا ويدعوك.


فقال له أبو بكر: امصص ببظر اللات، أنحن نفر عنه وندعه؟ فقال: من ذا؟ قالوا: أبو بكر. قال: أما والذي نفسي بيده، لولا يد كانت لك عندي لم أجزك بها لأجبتك.


قال: وجعل يكلم النبي ﷺ، فكلما تكلم أخذ بلحيته، والمغيرة بن شعبة قائم على رأس النبي ﷺ ومعه السيف وعليه المغفر، فكلما أهوى عروة بيده إلى لحية النبي ﷺ ضرب يده بنعل السيف، وقال له: أخر يدك عن لحية رسول الله ﷺ.


فرفع عروة رأسه فقال: من هذا؟ قالوا: المغيرة بن شعبة. فقال: أي غدر، ألست أسعى في غدرتك؟


ثم إن عروة جعل يرمق أصحاب النبي ﷺ بعينيه، قال: فوالله ما تنخم رسول الله ﷺ نخامة إلا وقعت في كف رجل منهم، فدلك بها وجهه وجلده. وإذا أمرهم ابتدروا أمره، وإذا توضأ كادوا يقتتلون على وضوئه، وإذا تكلم خفضوا أصواتهم عنده، وما يحدون إليه النظر تعظيمًا له.


فرجع عروة إلى أصحابه فقال: أي قوم، والله لقد وفدت على الملوك، ووفدت على قيصر وكسرى والنجاشي، والله إن رأيت ملكًا قط يعظمه أصحابه ما يعظم أصحاب محمد ﷺ محمدًا.


ثم جاء سهيل بن عمرو فقال: هات اكتب بيننا وبينك كتابًا. فدعا النبي ﷺ الكاتب، فقال النبي ﷺ: «بسم الله الرحمن الرحيم». فقال سهيل: أما الرحمن فوالله ما أدري ما هو، ولكن اكتب باسمك اللهم كما كنت تكتب.


فقال المسلمون: والله لا نكتبها إلا بسم الله الرحمن الرحيم. فقال النبي ﷺ: «اكتب باسمك اللهم». ثم قال: «هذا ما قاضى عليه محمد رسول الله». فقال سهيل: والله لو كنا نعلم أنك رسول الله ما صددناك عن البيت ولا قاتلناك، ولكن اكتب: محمد بن عبد الله.`,

    full_text: `عن هشام عن أبيه قال: لما سار رسول الله ﷺ عام الفتح فبلغ ذلك قريشًا، خرج أبو سفيان بن حرب وحكيم بن حزام وبديل بن ورقاء يلتمسون الخبر عن رسول الله ﷺ.


فأقبلوا يسيرون حتى أتوا مر الظهران، فإذا هم بنيران كأنها نيران عرفة. فقال أبو سفيان: ما هذه؟ لكأنها نيران عرفة. فقال بديل بن ورقاء: نيران بني عمرو. فقال أبو سفيان: عمرو أقل من ذلك.


فرآهم ناس من حرس رسول الله ﷺ فأدركوهم فأخذوهم، فأتوا بهم رسول الله ﷺ، فأسلم أبو سفيان.


فلما سار قال للعباس: «احبس أبا سفيان عند حطم الخيل حتى ينظر إلى المسلمين». فحبسه العباس، فجعلت القبائل تمر مع النبي ﷺ تمر كتيبة كتيبة على أبي سفيان.


فمرت كتيبة، قال: يا عباس من هذه؟ قال: هذه غفار. قال: ما لي ولغفار. ثم مرت جهينة، قال: مثل ذلك. ثم مرت سعد بن هذيم، فقال مثل ذلك. ومرت سليم، فقال مثل ذلك.


حتى أقبلت كتيبة لم ير مثلها، قال: من هذه؟ قال: هؤلاء الأنصار، عليهم سعد بن عبادة، معه الراية. فقال سعد بن عبادة: يا أبا سفيان، اليوم يوم الملحمة، اليوم تستحل الكعبة. فقال أبو سفيان: يا عباس، حبذا يوم الذمار.


ثم جاءت كتيبة وهي أقل الكتائب، فيهم رسول الله ﷺ وأصحابه، وراية النبي ﷺ مع الزبير بن العوام. فلما مر رسول الله ﷺ بأبي سفيان قال: «ألم تعلم ما قال سعد بن عبادة؟» قال: ما قال؟ قال: كذا وكذا. فقال: «كذب سعد، ولكن هذا يوم يعظم الله فيه الكعبة، ويوم تكسى فيه الكعبة».

    source_url: "https://sunnah.com/bukhari:4712",
    full_text: `عن أبي هريرة رضي الله عنه قال: أُتي رسول الله ﷺ بلحم، فرفع إليه الذراع، وكانت تعجبه، فنهس منها نهسة ثم قال: «أنا سيد الناس يوم القيامة، وهل تدرون مم ذلك؟»


«يجمع الناس الأولين والآخرين في صعيد واحد، يسمعهم الداعي، وينفذهم البصر، وتدنو الشمس، فيبلغ الناس من الغم والكرب ما لا يطيقون ولا يحتملون. فيقول الناس: ألا ترون ما قد بلغكم؟ ألا تنظرون من يشفع لكم إلى ربكم؟»


«فيقول بعض الناس لبعض: عليكم بآدم. فيأتون آدم عليه السلام فيقولون له: أنت أبو البشر، خلقك الله بيده، ونفخ فيك من روحه، وأمر الملائكة فسجدوا لك، اشفع لنا إلى ربك، ألا ترى إلى ما نحن فيه؟»


«فيقول آدم: إن ربي قد غضب اليوم غضبًا لم يغضب قبله مثله، ولن يغضب بعده مثله، وإنه قد نهاني عن الشجرة فعصيته. نفسي نفسي نفسي، اذهبوا إلى غيري، اذهبوا إلى نوح.»


«فيأتون نوحًا فيقولون: يا نوح، إنك أنت أول الرسل إلى أهل الأرض، وقد سماك الله عبدًا شكورًا، اشفع لنا إلى ربك، ألا ترى إلى ما نحن فيه؟»


«فيقول: إن ربي قد غضب اليوم غضبًا لم يغضب قبله مثله، ولن يغضب بعده مثله، وإنه قد كانت لي دعوة دعوتها على قومي. نفسي نفسي نفسي، اذهبوا إلى غيري، اذهبوا إلى إبراهيم.»


«فيأتون إبراهيم فيقولون: يا إبراهيم، أنت نبي الله وخليله من أهل الأرض، اشفع لنا إلى ربك، ألا ترى إلى ما نحن فيه؟»


«فيقول لهم: إن ربي قد غضب اليوم غضبًا لم يغضب قبله مثله، ولن يغضب بعده مثله، وإني قد كنت كذبت ثلاث كذبات. نفسي نفسي نفسي، اذهبوا إلى غيري، اذهبوا إلى موسى.»


«فيأتون موسى فيقولون: يا موسى، أنت رسول الله، فضلك الله برسالته وبكلامه على الناس، اشفع لنا إلى ربك، ألا ترى إلى ما نحن فيه؟»


«فيقول: إن ربي قد غضب اليوم غضبًا لم يغضب قبله مثله، ولن يغضب بعده مثله، وإني قد قتلت نفسًا لم أومر بقتلها. نفسي نفسي نفسي، اذهبوا إلى غيري، اذهبوا إلى عيسى.»


«فيأتون عيسى فيقولون: يا عيسى، أنت رسول الله وكلمته ألقاها إلى مريم وروح منه، وكلمت الناس في المهد صبيًا، اشفع لنا، ألا ترى إلى ما نحن فيه؟»


«فيقول عيسى: إن ربي قد غضب اليوم غضبًا لم يغضب قبله مثله، ولن يغضب بعده مثله، ولم يذكر ذنبًا. نفسي نفسي نفسي، اذهبوا إلى غيري، اذهبوا إلى محمد ﷺ.»


«فيأتون محمدًا ﷺ فيقولون: يا محمد، أنت رسول الله، وخاتم الأنبياء، وقد غفر الله لك ما تقدم من ذنبك وما تأخر، اشفع لنا إلى ربك، ألا ترى إلى ما نحن فيه؟»


«فأنطلق فآتي تحت العرش، فأقع ساجدًا لربي عز وجل، ثم يفتح الله علي من محامده وحسن الثناء عليه شيئًا لم يفتحه على أحد قبلي. ثم يقال: يا محمد، ارفع رأسك، سل تعطه، واشفع تشفع.»


«فأرفع رأسي فأقول: أمتي يا رب، أمتي يا رب. فيقال: يا محمد، أدخل من أمتك من لا حساب عليهم من الباب الأيمن من أبواب الجنة، وهم شركاء الناس فيما سوى ذلك من الأبواب.»


«ثم قال: والذي نفسي بيده، إن ما بين المصراعين من مصاريع الجنة كما بين مكة وحمير، أو كما بين مكة وبصرى.»`,

    full_text: `عن ابن مسعود أن رسول الله ﷺ قال: «آخر من يدخل الجنة رجل، فهو يمشي مرة، ويكبو مرة، وتسفعه النار مرة.


فإذا ما جاوزها التفت إليها، فقال: تبارك الذي نجاني منك، لقد أعطاني الله شيئًا ما أعطاه أحدًا من الأولين والآخرين.


فترفع له شجرة، فيقول: أي رب، أدنني من هذه الشجرة فأستظل بظلها وأشرب من مائها. فيقول الله عز وجل: يا ابن آدم، لعلي إن أعطيتكها سألتني غيرها. فيقول: لا يا رب، ويعاهده أن لا يسأله غيرها. وربه يعذره لأنه يرى ما لا صبر له عليه.


فيدنيه منها، فيستظل بظلها ويشرب من مائها. ثم ترفع له شجرة هي أحسن من الأولى، فيقول: أي رب، أدنني من هذه لأشرب من مائها وأستظل بظلها، لا أسألك غيرها. فيقول: يا ابن آدم، ألم تعاهدني أن لا تسألني غيرها؟ فيقول: لعلي إن أدنيتك منها تسألني غيرها. فيعاهده أن لا يسأله غيرها، وربه يعذره لأنه يرى ما لا صبر له عليه.


فيدنيه منها فيستظل بظلها ويشرب من مائها. ثم ترفع له شجرة عند باب الجنة هي أحسن من الأوليين، فيقول: أي رب، أدنني من هذه لأستظل بظلها وأشرب من مائها، لا أسألك غيرها. فيقول: يا ابن آدم، ألم تعاهدني أن لا تسألني غيرها؟ فيقول: بلى يا رب، ولكن هذه أحسن. فيقول: إني أدنيك منها، ولا أسألك غيرها.


فيدنيه منها، فإذا دنا منها سمع أصوات أهل الجنة، فيقول: أي رب، أدخلني الجنة. فيقول: يا ابن آدم، ما أعظم ما تسأل! فيقول: يا رب، أنت أهل أن تجود. فيقول: فإن لك ما سألت، ولك مثل الدنيا وعشرة أمثالها.


فيقول: يا رب، أتسخر بي وأنت رب العالمين؟ فضحك الله من قوله، وقال: إني لا أسخر منك، ولكني على ما أشاء قادر».`,
    source: "صحيح مسلم (183)، صحيح البخاري (6571)",
    benefits: [
        "سعة رحمة الله وعفوه.",
        "بيان أن الجنة درجات.",
        "إثبات صفات الله التي تليق بجلاله.",
        "الحث على سؤال الله والرجاء في رحمته.",
        "التذكير بأن الدنيا فانية."
    ]
},

    source_url: "https://sunnah.com/bukhari:173",
    full_text: `عن أبي هريرة رضي الله عنه عن النبي ﷺ قال: «بينما رجل يمشي بطريق، فاشتد عليه العطش، فوجد بئرًا فنزل فيها فشرب، ثم خرج. فإذا كلب يلهث يأكل الثرى من العطش.

فشكر الله له، فغفر له». قالوا: يا رسول الله، وإن لنا في البهائم لأجرًا؟ فقال: «في كل كبد رطبة أجر».`,

    source_url: "https://sunnah.com/bukhari:1421",
    full_text: `عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «قال رجل: لأتصدقن بصدقة. فخرج بصدقته فوضعها في يد سارق. فأصبحوا يتحدثون: تصدق على سارق.

    full_text: `ملخّصٌ وافٍ لقصة أصحاب الكهف كما وردت في سورة الكهف (الآيات 9-26):


كان فتية آمنوا بربهم وزدهم الله هدى، وربط الله على قلوبهم حين قاموا فقالوا: {رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ لَن نَّدْعُوَ مِن دُونِهِ إِلَٰهًا}. وضرب الله على آذانهم في الكهف سنين عددًا، ثم بعثهم ليتساءلوا بينهم كم لبثوا.

    full_text: `ملخّصٌ وافٍ لقصة سليمان والهدهد وملكة سبأ كما وردت في سورة النمل (الآيات 15-44):


أوتي سليمان منطق الطير، وتفقد الطير فلم يجد الهدهد، فقال: {مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ}. فجاء الهدهد بخبر ملكة سبأ وقومها يسجدون للشمس.


فأرسل سليمان كتابًا مع الهدهد إلى الملكة، فأرسلت هدية، فردها سليمان، ثم أمر أن يؤتى بعرشها قبل أن يأتوه مسلمين. ثم سأل: أيكم يأتيني بعرشها؟ قال عفريت من الجن: أنا آتيك به. وقال الذي عنده علم من الكتاب: أنا آتيك به قبل أن يرتد إليك طرفك. فلما رآه مستقرًا عنده قال: هذا من فضل ربي.

    source_url: "https://sunnah.com/bukhari:3220",
    full_text: `عن ابن عباس رضي الله عنهما عن النبي ﷺ قال: «إن موسى قام خطيبًا في بني إسرائيل، فسئل: أي الناس أعلم؟ فقال: أنا. فعتب الله عليه، إذ لم يرد العلم إليه، فقال له: بلى، لي عبد بمجمع البحرين هو أعلم منك.


قال: أي رب ومن لي به؟ قال: تأخذ حوتًا، فتجعله في مكتل، حيثما فقدت الحوت فهو ثم. فأخذ حوتًا فجعله في مكتل، ثم انطلق هو وفتاه يوشع بن نون، حتى أتيا الصخرة، وضعا رؤوسهما، فرقد موسى، واضطرب الحوت فخرج، فسقط في البحر، فاتخذ سبيله في البحر سربًا.


فانطلقا يمشيان بقية ليلتهما ويومهما، حتى إذا كان من الغد قال لفتاه: آتنا غداءنا، لقد لقينا من سفرنا هذا نصبًا. قال له فتاه: أرأيت إذ أوينا إلى الصخرة، فإني نسيت الحوت، وما أنسانيه إلا الشيطان أن أذكره، واتخذ سبيله في البحر عجبًا. قال له موسى: ذلك ما كنا نبغي، فارتدا على آثارهما قصصًا.


حتى انتهيا إلى الصخرة، فإذا رجل مسجى بثوب، فسلم موسى، فرد عليه، فقال: وأنى بأرضك السلام؟ قال: أنا موسى. قال: موسى بني إسرائيل؟ قال: نعم، أتيتك لتعلمني مما علمت رشدًا.


قال: يا موسى، إني على علم من علم الله علمنيه الله لا تعلمه، وأنت على علم من علم الله علمكه الله لا أعلمه. قال: هل أتبعك؟ قال: {إنك لن تستطيع معي صبرًا. وكيف تصبر على ما لم تحط به خبرًا}. قال: ستجدني إن شاء الله صابرًا ولا أعصي لك أمرًا.


فانطلقا يمشيان على ساحل البحر، فمرت بهما سفينة، كلموهم أن يحملوهم، فعرفوا الخضر فحملوه بغير نول. فلما ركبا في السفينة جاء عصفور، فوقع على حرف السفينة فنقر في البحر نقرة أو نقرتين، قال له الخضر: يا موسى، ما نقص علمي وعلمك من علم الله إلا مثل ما نقص هذا العصفور بمنقاره من البحر.


ثم أخذ الخضر القدوم فقلع لوحًا من ألواح السفينة، فقال له موسى: قوم حملونا بغير نول عمدت إلى سفينتهم فخرقتها لتغرق أهلها؟ لقد جئت شيئًا إمرًا. قال: ألم أقل إنك لن تستطيع معي صبرًا؟ قال: لا تؤاخذني بما نسيت ولا ترهقني من أمري عسرًا.


فانطلقا، فإذا هما بغلام يلعب مع الغلمان، فأخذ الخضر برأسه فقتله، فقال له موسى: أقتلت نفسًا زكية بغير نفس؟ لقد جئت شيئًا نكرًا. قال: ألم أقل لك إنك لن تستطيع معي صبرًا؟


فانطلقا حتى أتيا أهل قرية، استطعما أهلها فأبوا أن يضيفوهما، فوجدا فيها جدارًا يريد أن ينقض فأقامه. قال له موسى: لو شئت لاتخذت عليه أجرًا. قال: هذا فراق بيني وبينك، سأنبئك بتأويل ما لم تستطع عليه صبرًا.


أما السفينة فكانت لمساكين يعملون في البحر، فأردت أن أعيبها، وكان وراءهم ملك يأخذ كل سفينة صالحة غصبًا. وأما الغلام فكان أبواه مؤمنين، فخشينا أن يرهقهما طغيانًا وكفرًا، فأردنا أن يبدلهما ربهما خيرًا منه زكاة وأقرب رحمة. وأما الجدار فكان لغلامين يتيمين في المدينة، وكان تحته كنز لهما، وكان أبوهما صالحًا، فأراد ربك أن يبلغا أشدهما ويستخرجا كنزهما رحمة من ربك، وما فعلته عن أمري، ذلك تأويل ما لم تسطع عليه صبرًا».`,
    source: "صحيح البخاري (3220)، صحيح مسلم (2380)",
    benefits: [

        "الصبر على معلمك.",
        "الحكمة في أفعال الله.",
        "القضاء والقدر.",
        "فضل الخضر عليه السلام."
    ]
},
{
    id: 33,
    title: "قصة زكريا ويحيى عليهما السلام",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/bukhari:3276",
    full_text: `عن ابن عباس رضي الله عنهما عن النبي ﷺ قال: «إن زكريا دعا الله أن يرزقه ولدًا، فقيل له: يا زكريا، إنا نبشرك بغلام اسمه يحيى، لم نجعل له من قبل سميًا. قال: أنى يكون لي غلام وقد بلغني الكبر وامرأتي عاقر؟ قال: كذلك الله يفعل ما يشاء.


قال: رب اجعل لي آية. قال: آيتك ألا تكلم الناس ثلاث ليال سويًا. فخرج على قومه من المحراب فأوحى إليهم أن سبحوا بكرة وعشيًا.


فلما ولد يحيى، قال الله له: {يا يحيى خذ الكتاب بقوة}، وآتيناه الحكم صبيًا».`,
    source: "صحيح البخاري (3276)، صحيح مسلم (2482)",
    benefits: [

        "الإيمان بالمعجزات."
    ]
},

    source_url: "https://sunnah.com/bukhari:3435",
    full_text: `عن أبي هريرة رضي الله عنه عن النبي ﷺ قال: «ما من مولود يولد إلا والشيطان يطعن في خاصرته حين يولد فيستهل صارخًا، إلا مريم وابنها.

{
    id: 35,
    title: "قصة طالوت وجالوت (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/2",
    full_text: `ملخّصٌ وافٍ لقصة طالوت وجالوت كما وردت في سورة البقرة (الآيات 246-251):


قال الملأ من بني إسرائيل لنبيهم: ابعث لنا ملكًا نقاتل في سبيل الله. فقال لهم: هل عسيتم إن كتب عليكم القتال ألا تقاتلوا؟ قالوا: وما لنا لا نقاتل في سبيل الله وقد أخرجنا من ديارنا وأبنائنا؟


فبعث الله لهم طالوت ملكًا، فقالوا: أنى يكون له الملك علينا ونحن أحق بالملك منه ولم يؤت سعة من المال؟ قال: إن الله اصطفاه عليكم وزاده بسطة في العلم والجسم.


وقال لهم نبيهم: إن آية ملكه أن يأتيكم التابوت فيه سكينة من ربكم وبقية مما ترك آل موسى وآل هارون تحمله الملائكة.


فلما فصل طالوت بالجنود قال: إن الله مبتليكم بنهر، فمن شرب منه فليس مني، ومن لم يطعمه فإنه مني إلا من اغترف غرفة بيده. فشربوا منه إلا قليلًا منهم.


فلما جاوزوه هو والذين آمنوا معه قالوا: لا طاقة لنا اليوم بجالوت وجنوده. قال الذين يظنون أنهم ملاقو الله: كم من فئة قليلة غلبت فئة كثيرة بإذن الله. فهزموهم بإذن الله، وقتل داود جالوت، وآتاه الله الملك والحكمة.`,
    source: "القرآن الكريم — سورة البقرة (246-251)",
    benefits: [
        "النصر بالإيمان لا بالكثرة.",
        "الابتلاء بالمال والجيش.",
        "القيادة الإلهية.",
        "الشجاعة.",
        "الصبر على البلاء."
    ]
},
{
    id: 36,
    title: "قصة ذي القرنين (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/18",
    full_text: `ملخّصٌ وافٍ لقصة ذي القرنين كما وردت في سورة الكهف (الآيات 83-98):


مكّن الله لذي القرنين في الأرض وآتاه من كل شيء سببًا، فسلك طريقًا حتى بلغ مغرب الشمس، ثم بلغ مطلعها، ثم سلك طريقًا حتى بلغ بين السدين، فوجد قومًا لا يكادون يفقهون قولًا.


قالوا: يا ذا القرنين، إن يأجوج ومأجوج مفسدون في الأرض، فهل نجعل لك خرجا على أن تجعل بيننا وبينهم سدًا؟ قال: ما مكني فيه ربي خير فأعينوني بقوة أجعل بينكم وبينهم ردما.


آتوني زبر الحديد حتى إذا ساوى بين الصدفين قال: انفخوا. حتى إذا جعله نارًا قال: آتوني أفرغ عليه قطرًا. فما استطاعوا أن يظهروه وما استطاعوا له نقبًا.


قال: هذا رحمة من ربي، فإذا جاء وعد ربي جعله دكاء وكان وعد ربي حقًا.`,
    source: "القرآن الكريم — سورة الكهف (83-98)",
    benefits: [
        "العدل في الحكم.",
        "استخدام القوة في الخير.",
        "الرد على المفسدين.",
        "التواضع لله.",
        "اليوم الآخر."
    ]
},
{
    id: 37,
    title: "قصة لقمان (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/31",
    full_text: `ملخّصٌ وافٍ لوصايا لقمان لابنه كما وردت في سورة لقمان (الآيات 12-19):


وإذ قال لقمان لابنه وهو يعظه: يا بني لا تشرك بالله إن الشرك لظلم عظيم. يا بني إنها إن تك مثقال حبة من خردل فتكن في صخرة أو في السماوات أو في الأرض يأت بها الله، إن الله لطيف خبير.


يا بني أقم الصلاة وأمر بالمعروف وانه عن المنكر واصبر على ما أصابك، إن ذلك من عزم الأمور. ولا تصعر خدك للناس ولا تمش في الأرض مرحًا، إن الله لا يحب كل مختال فخور.


واقصد في مشيك واغضض من صوتك، إن أنكر الأصوات لصوت الحمير.`,
    source: "القرآن الكريم — سورة لقمان (12-19)",
    benefits: [

    ]
},
{
    id: 38,
    title: "قصة أصحاب السبت (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/7",
    full_text: `ملخّصٌ وافٍ لقصة أصحاب السبت كما وردت في سورة الأعراف (الآيات 163-166):


واسألهم عن القرية التي كانت حاضرة البحر، إذ يعدون في السبت، إذ تأتيهم حيتانهم يوم سبتهم شرعًا ويوم لا يسبتون لا تأتيهم.


وإذ قالت أمة منهم: لم تعظون قومًا الله مهلكهم أو معذبهم عذابًا شديدًا؟ قالوا: معذرة إلى ربكم ولعلهم يتقون.


فلما نسوا ما ذكروا به أنجينا الذين ينهون عن السوء وأخذنا الذين ظلموا بعذاب بئيس بما كانوا يفسقون.


فلما عتوا عما نهوا عنه قلنا لهم: كونوا قردة خاسئين.`,
    source: "القرآن الكريم — سورة الأعراف (163-166)",
    benefits: [

        "عذاب الدنيا والآخرة."
    ]
},
{
    id: 39,
    title: "قصة المؤمن والكافر (صاحب الجنة)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/18",
    full_text: `ملخّصٌ وافٍ لقصة الرجلين المؤمن والكافر كما وردت في سورة الكهف (الآيات 32-44):


واضرب لهم مثلًا رجلين جعلنا لأحدهما جنتين من أعناب وحففناهما بنخل وجعلنا بينهما زرعًا. كلتا الجنتين آتت أكلها ولم تظلم منه شيئًا وفجرنا خلالهما نهرًا.


وكان له ثمر فقال لصاحبه وهو يحاوره: أنا أكثر منك مالًا وأعز نفرًا. ودخل جنته وهو ظالم لنفسه قال: ما أظن أن تبيد هذه أبدًا، وما أظن الساعة قائمة.


قال له صاحبه: أكفرت بالذي خلقك من تراب ثم من نطفة ثم سواك رجلًا؟ لكن هو الله ربي ولا أشرك بربي أحدًا.


ولولا إذ دخلت جنتك قلت ما شاء الله لا قوة إلا بالله. وإن ترن أنا أقل منك مالًا وولدًا فعسى ربي أن يؤتيني خيرًا من جنتك ويرسل عليها حسبانًا من السماء فتصبح صعيدًا زلقًا.


وأحيط بثمره فأصبح يقلب كفيه على ما أنفق فيها وهي خاوية على عروشها.`,
    source: "القرآن الكريم — سورة الكهف (32-44)",

{
    id: 40,
    title: "قصة نوح عليه السلام (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/11",
    full_text: `ملخّصٌ وافٍ لقصة نوح عليه السلام كما وردت في سورة هود (الآيات 25-48):


أرسلنا نوحًا إلى قومه: إني لكم نذير مبين أن لا تعبدوا إلا الله، إني أخاف عليكم عذاب يوم أليم.


فقال الملأ الذين كفروا من قومه: ما نراك إلا بشرًا مثلنا وما نراك اتبعك إلا الذين هم أراذلنا بادي الرأي.


قال يا قوم أرأيتم إن كنت على بينة من ربي وآتاني رحمة من عنده فعميت عليكم أنلزمكموها وأنتم لها كارهون.


واصنع الفلك بأعيننا ووحينا ولا تخاطبني في الذين ظلموا إنهم مغرقون. وحملنا معه في الفلك أزواجًا من كل زوجين اثنين وأهله إلا من سبق عليه القول.


وقيل يا أرض ابلعي ماءك ويا سماء أقلعي وغيض الماء وقضي الأمر واستوت على الجودي وقيل بعدًا للقوم الظالمين.`,
    source: "القرآن الكريم — سورة هود (25-48)",
    benefits: [

        "طاعة الله.",
        "عاقبة التكذيب.",
        "نجاة المؤمنين."

},
{
    id: 41,
    title: "قصة عاد وثمود (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/11",
    full_text: `ملخّصٌ وافٍ لقصة عاد وثمود كما وردت في سورة هود (الآيات 50-68):


وأرسلنا إلى عاد أخاهم هودًا: يا قوم اعبدوا الله ما لكم من إله غيره. قالوا: يا هود ما جئتنا ببينة وما نحن بتاركي آلهتنا عن قولك.


قال: إني توكلت على الله ربي وربكم. فأما عاد فاستكبروا في الأرض بغير الحق وقالوا: من أشد منا قوة؟ أولم يروا أن الله الذي خلقهم هو أشد منهم قوة.


فأنجينا هودًا والذين آمنوا معه برحمة منا، وقطعنا دابر الذين كذبوا بآياتنا.


وأما ثمود فهديناهم فاستحبوا العمى على الهدى، فأخذتهم صاعقة العذاب الهون بما كانوا يكسبون.`,
    source: "القرآن الكريم — سورة هود (50-68)",
    benefits: [

        "القوة الحقيقية لله.",
        "عاقبة التكذيب.",

    ]
},
{
    id: 42,
    title: "قصة لوط عليه السلام (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/11",
    full_text: `ملخّصٌ وافٍ لقصة لوط عليه السلام كما وردت في سورة هود (الآيات 77-83):


وجاءت رسلنا لوطًا فسيء بهم وضاق بهم ذرعًا وقال: هذا يوم عصيب. وجاء قومه يهرعون إليه ومن قبل كانوا يعملون السيئات.


قال: يا قوم هؤلاء بناتي هن أطهر لكم فاتقوا الله ولا تخزون في ضيفي.


قالوا: لقد علمت ما لنا في بناتك من حق وإنك لتعلم ما نريد. قال: لو أن لي بكم قوة أو آوي إلى ركن شديد.


قالوا: يا لوط إنا رسل ربك لن يصلوا إليك فأسر بأهلك بقطع من الليل ولا يلتفت منكم أحد إلا امرأتك.


فلما جاء أمرنا جعلنا عاليها سافلها وأمطرنا عليها حجارة من سجيل منضود.`,

{
    id: 43,
    title: "قصة إبراهيم عليه السلام (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/21",
    full_text: `ملخّصٌ وافٍ لقصة إبراهيم عليه السلام مع قومه كما وردت في سورة الأنبياء (الآيات 51-70):


ولقد آتينا إبراهيم رشده من قبل وكنا به عالمين. إذ قال لأبيه وقومه: ما هذه التماثيل التي أنتم لها عاكفون؟ قالوا: وجدنا آباءنا لها عابدين.


قال: لقد كنتم أنتم وآباؤكم في ضلال مبين. قالوا: أجئتنا بالحق أم أنت من اللاعبين؟ قال: بل ربكم رب السماوات والأرض الذي فطرهن وأنا على ذلكم من الشاهدين.


وتالله لأكيدن أصنامكم بعد أن تولوا مدبرين. فجعلهم جذاذًا إلا كبيرًا لهم لعلهم إليه يرجعون.


قالوا: من فعل هذا بآلهتنا إنه لمن الظالمين؟ قالوا: سمعنا فتى يذكرهم يقال له إبراهيم. قالوا: فأتوا به على أعين الناس لعلهم يشهدون.


قالوا: أأنت فعلت هذا بآلهتنا يا إبراهيم؟ قال: بل فعله كبيرهم هذا فاسألوهم إن كانوا ينطقون. فرجعوا إلى أنفسهم فقالوا: إنكم أنتم الظالمون. ثم نكسوا على رؤوسهم لقد علمت ما هؤلاء ينطقون.


قال: أفتعبدون من دون الله ما لا ينفعكم شيئًا ولا يضركم؟ أف لكم ولما تعبدون من دون الله أفلا تعقلون؟ قالوا: حرقوه وانصروا آلهتكم إن كنتم فاعلين. قلنا يا نار كوني بردًا وسلامًا على إبراهيم.`,
    source: "القرآن الكريم — سورة الأنبياء (51-70)",

    title: "قصة يوسف عليه السلام (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/12",
    full_text: `ملخّصٌ وافٍ لقصة يوسف عليه السلام كما وردت في سورة يوسف:


رأى يوسف رؤيا أحد عشر كوكبًا والشمس والقمر له ساجدين، فقصها على أبيه يعقوب، فقال: يا بني لا تقصص رؤياك على إخوتك فيكيدوا لك كيدًا.


فكاد له إخوته وألقوه في الجب، فالتقطه بعض السيارة وباعوه بثمن بخس دراهم معدودة. واشتراه عزيز مصر، ثم راودته امرأة العزيز عن نفسه وغلقت الأبواب وقالت هيت لك. قال: معاذ الله إنه ربي أحسن مثواي.


فاستعصم، فسجن، ثم فسر رؤيا الملك، فخرج من السجن واستوزر على خزائن الأرض. ثم جاءه إخوته يطلبون الطعام فعرفهم وهم له منكرون. ثم جمع بينه وبين أبويه وإخوته وخروا له سجدًا وقال: يا أبت هذا تأويل رؤياي من قبل قد جعلها ربي حقًا.`,
    source: "القرآن الكريم — سورة يوسف",
    benefits: [

{
    id: 45,
    title: "قصة موسى وفرعون (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/20",
    full_text: `ملخّصٌ وافٍ لقصة موسى وفرعون كما وردت في سورة طه (الآيات 9-98):


أرسل الله موسى إلى فرعون: اذهب إلى فرعون إنه طغى. فقولا له قولًا لينًا لعله يتذكر أو يخشى. قالا: ربنا إننا نخاف أن يفرط علينا أو أن يطغى. قال: لا تخافا إنني معكما أسمع وأرى.


فأتياه فقالا: إنا رسولا ربك فأرسل معنا بني إسرائيل ولا تعذبهم. قال: ألم نربك فينا وليدًا ولبثت فينا من عمرك سنين وفعلت فعلتك التي فعلت وأنت من الكافرين.


قال: فعلتها إذا وأنا من الضالين. ففررت منكم لما خفتكم فوهب لي ربي حكمًا وجعلني من المرسلين.


قال فرعون: وما رب العالمين؟ قال: رب السماوات والأرض وما بينهما إن كنتم موقنين.


فألقى السحرة حبالهم وعصيهم، فألقى موسى عصاه فإذا هي تلقف ما يأفكون. فخر السحرة سجدًا قالوا: آمنا برب هارون وموسى.


ثم أخذ فرعون موسى وقومه فأغرقهم الله، وأنجى موسى ومن معه.`,
    source: "القرآن الكريم — سورة طه (9-98)",
    benefits: [

        "الشجاعة في الدعوة.",
        "اللين في القول.",

        "عاقبة الطغيان."
    ]

{
    id: 46,
    title: "قصة هابيل وقابيل (من القرآن الكريم)",

    text_status: "summary_with_reference",
    source_url: "https://quran.com/5",
    full_text: `ملخّصٌ وافٍ لقصة ابني آدم كما وردت في سورة المائدة (الآيات 27-31):


واتل عليهم نبأ ابني آدم بالحق إذ قربا قربانًا فتقبل من أحدهما ولم يتقبل من الآخر. قال: لأقتلنك. قال: إنما يتقبل الله من المتقين.


لئن بسطت إلي يدك لتقتلني ما أنا بباسط يدي إليك لأقتلك، إني أخاف الله رب العالمين. إني أريد أن تبوء بإثمي وإثمك فتكون من أصحاب النار وذلك جزاء الظالمين.

{
    id: 47,
    title: "قصة بقرة بني إسرائيل (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/2",
    full_text: `ملخّصٌ وافٍ لقصة بقرة بني إسرائيل كما وردت في سورة البقرة (الآيات 67-73):


وإذ قال موسى لقومه: إن الله يأمركم أن تذبحوا بقرة. قالوا: أتتخذنا هزوًا؟ قال: أعوذ بالله أن أكون من الجاهلين.


قالوا: ادع لنا ربك يبين لنا ما هي. قال: إنه يقول إنها بقرة لا فارض ولا بكر عوان بين ذلك.


قالوا: ادع لنا ربك يبين لنا ما لونها. قال: إنه يقول إنها بقرة صفراء فاقع لونها تسر الناظرين.


قالوا: ادع لنا ربك يبين لنا ما هي إن البقر تشابه علينا. قال: إنه يقول إنها بقرة لا ذلول تثير الأرض ولا تسقي الحرث مسلمة لا شية فيها.


فذبحوها وما كادوا يفعلون. وإذ قتلتم نفسًا فادارأتم فيها والله مخرج ما كنتم تكتمون. فقلنا اضربوه ببعضها كذلك يحيي الله الموتى ويريكم آياته لعلكم تعقلون.`,
    source: "القرآن الكريم — سورة البقرة (67-73)",
    benefits: [
        "الاستجابة لأمر الله.",
        "عدم السخرية.",
        "الإيمان بالبعث.",
        "التسليم.",
        "عاقبة الجدال."
    ]
},
{
    id: 48,
    title: "قصة الغلام والراهب (مفصلة)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "near_verbatim",
    source_url: "https://sunnah.com/muslim:3005",
    full_text: `عن صهيب أن رسول الله ﷺ قال: «كان ملك فيمن كان قبلكم، وكان له ساحر، فلما كبر قال للملك: إني قد كبرت، فابعث إلي غلامًا أعلمه السحر. فبعث إليه غلامًا يعلمه.


فكان في طريقه إذا سلك راهب، فقعد إليه وسمع كلامه فأعجبه، فكان إذا أتى الساحر مر بالراهب وقعد إليه، فإذا أتى الساحر ضربه، فشكى ذلك إلى الراهب، فقال: إذا خشيت الساحر فقل: حبسني أهلي، وإذا خشيت أهلك فقل: حبسني الساحر.


فبينما هو كذلك إذ أتى على دابة عظيمة قد حبست الناس، فقال: اليوم أعلم الساحر أفضل أم الراهب أفضل. فأخذ حجرًا فقال: اللهم إن كان أمر الراهب أحب إليك من أمر الساحر، فاقتل هذه الدابة حتى يمضي الناس. فرماهما فقتلها، ومضى الناس.


فأتى الراهب فأخبره، فقال له الراهب: أي بني، أنت اليوم أفضل مني، قد بلغ من أمرك ما أرى، وإنك ستبتلى، فإن ابتليت فلا تدل علي.


وكان الغلام يبرئ الأكمه والأبرص، ويداوي الناس من سائر الأدواء. فسمع جليس للملك كان قد عمي، فأتاه بهدايا كثيرة، فقال: ما هاهنا لك أجمع إن أنت شفيتني. فقال: إني لا أشفي أحدًا، إنما يشفي الله، فإن أنت آمنت بالله دعوت الله فشفاك. فآمن بالله فشفاه الله.


فأتى الملك فجلس إليه كما كان يجلس، فقال له الملك: من رد عليك بصرك؟ قال: ربي. قال: ولك رب غيري؟ قال: ربي وربك الله. فأخذه فلم يزل يعذبه حتى دل على الغلام. فجيء بالغلام، فقال له الملك: أي بني، قد بلغ من سحرك ما تبرئ الأكمه والأبرص وتفعل وتفعل؟ فقال: إني لا أشفي أحدًا، إنما يشفي الله. فأخذه فلم يزل يعذبه حتى دل على الراهب.


فجيء بالراهب، فقيل له: ارجع عن دينك. فأبى، فدعا بالمئشار فوضع المئشار في مفرق رأسه فشقه حتى وقع شقاه. ثم جيء بجليس الملك فقيل له: ارجع عن دينك. فأبى، فوضع المئشار في مفرق رأسه فشقه به حتى وقع شقاه.


ثم جيء بالغلام فقيل له: ارجع عن دينك. فأبى، فدفعه إلى نفر من أصحابه فقال: اذهبوا به إلى جبل كذا وكذا، فاصعدوا به الجبل، فإذا بلغتم ذروته فإن رجع عن دينه وإلا فاطرحوه. فذهبوا به فصعدوا به الجبل، فقال: اللهم اكفنيهم بما شئت. فرجف بهم الجبل فسقطوا، وجاء يمشي إلى الملك.


فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فدفعه إلى نفر من أصحابه فقال: اذهبوا به فاحملوه في قرقور، فتوسطوا به البحر، فإن رجع عن دينه وإلا فاقذفوه. فذهبوا به، فقال: اللهم اكفنيهم بما شئت. فانكفأت بهم السفينة فغرقوا، وجاء يمشي إلى الملك.


فقال له الملك: ما فعل أصحابك؟ قال: كفانيهم الله. فقال للملك: إنك لست بقاتلي حتى تفعل ما آمرك به. قال: وما هو؟ قال: تجمع الناس في صعيد واحد، وتصلبني على جذع، ثم خذ سهمًا من كنانتي، ثم ضع السهم في كبد القوس، ثم قل: بسم الله رب الغلام، ثم ارمي، فإنك إذا فعلت ذلك قتلتني.


فجمع الناس في صعيد واحد، وصلبه على جذع، ثم أخذ سهمًا من كنانته، ثم وضع السهم في كبد القوس، ثم قال: بسم الله رب الغلام، ثم رماه، فوقع السهم في صدغه، فوضع يده في صدغه في موضع السهم فمات.


فقال الناس: آمنا برب الغلام، آمنا برب الغلام، آمنا برب الغلام. فأتي الملك فقيل له: أرأيت ما كنت تحذر، قد والله نزل بك حذرك، قد آمن الناس. فأمر بالأخدود في أفواه السكك فخدت، وأضرم النيران، وقال: من لم يرجع عن دينه فأحموه فيها، أو قيل له اقتحم. ففعلوا، حتى جاءت امرأة ومعها صبي يرضع، فتقاعست أن تقع في النار، فقال لها الغلام: يا أمه اصبري فإنك على الحق».`,
    source: "صحيح مسلم (3005)",
    benefits: [
        "الثبات على الحق.",
        "الشفاء بيد الله.",
        "الغلام سبب إيمان أمة.",
        "كرامات الأولياء.",
        "ذم الظلم."
    ]
},

    id: 50,
    title: "قصة الهدهد وملكة سبأ (من القرآن الكريم)",
    category: "قصص الأنبياء والأمم السابقة",
    text_status: "summary_with_reference",
    source_url: "https://quran.com/27",
    full_text: `ملخّصٌ وافٍ لقصة الهدهد وملكة سبأ كما وردت في سورة النمل (الآيات 20-44):


وتفقد الطير فقال: ما لي لا أرى الهدهد أم كان من الغائبين؟ فجاء الهدهد فقال: أحطت بما لم تحط به وجئتك من سبأ بنبأ يقين. إني وجدت امرأة تملكهم وأوتيت من كل شيء ولها عرش عظيم. وجدتها وقومها يسجدون للشمس من دون الله.


فأرسل سليمان كتابًا مع الهدهد: بسم الله الرحمن الرحيم ألا تعلوا علي وأتوني مسلمين.


فأرسلت الملكة هدية، فردها سليمان. ثم أمر بعرشها فأتي به. ثم دخلت الصرح فحسبته لجة وكشفت عن ساقيها. قال: إنه صرح ممرد من قوارير. قالت: رب إني ظلمت نفسي وأسلمت مع سليمان لله رب العالمين.`,

    text_status: "verbatim",
    source_url: "https://sunnah.com/bukhari:2272",
    full_text: `من حديث ابن عمر رضي الله عنهما في قصة الثلاثة أصحاب الصخرة، قال الثالث: «اللهم إني استأجرت أجراء فأعطيتهم أجرهم، غير رجل واحد ترك الذي له وذهب، فثمرت أجره حتى كثرت منه الأموال، فجاءني بعد حين فقال: يا عبد الله أد إلي أجري. فقلت له: كل ما ترى من أجرك من الإبل والبقر والغنم والرقيق. فقال: يا عبد الله لا تستهزئ بي. فقلت: إني لا أستهزئ بك. فأخذه كله فاستاقه فلم يترك منه شيئًا. اللهم إن كنت فعلت ذلك ابتغاء وجهك فافرج عنا ما نحن فيه».`,

const $ = (sel) => document.querySelector(sel);

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlightText(html, query) {
    if (!query) return html;
    const q = query.trim();
    if (!q) return html;
    const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return html.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}
function excerpt(text, len = 220) {
    const plain = text.replace(/\s+/g, ' ').trim();
    return plain.length > len ? plain.slice(0, len) + '…' : plain;
}
function showToast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}
function saveFavs() {
    localStorage.setItem('encyclopedia_favs', JSON.stringify([...state.favorites]));
}
