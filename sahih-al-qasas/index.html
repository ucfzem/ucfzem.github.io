<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صحيح القصص النبوي — د. عمر سليمان الأشقر</title>
  <meta name="description" content="كتاب «صحيح القصص النبوي» للدكتور عمر سليمان الأشقر رحمه الله — القصص والحديث النبوي الموثق، مع فهرس وبحث فوري وتلوين وتنقّل بين القصص، ويعمل دون اتصال.">
  <meta name="theme-color" content="#2e6f40">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="صحيح القصص النبوي">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="./styles.css">
  <script id="themeBoot">
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('qasas_theme') ||
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      try {
        var fs = localStorage.getItem('qasas_font');
        if (fs) document.documentElement.style.setProperty('--content-font-size', fs + 'rem');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <div id="progressBar" aria-hidden="true"></div>

  <header>
    <button id="tocToggle" aria-label="فتح فهرس القصص" title="فهرس القصص">☰</button>
    <div class="brand">
      <h1>📚 صحيح القصص النبوي</h1>
      <p>د. عمر سليمان الأشقر — رحمه الله</p>
    </div>
    <button id="themeToggle" aria-label="تبديل الوضع النهاري/الليلي" title="تبديل الوضع النهاري/الليلي">🌙</button>
  </header>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <strong>فهرس القصص</strong>
        <button id="drawerClose" aria-label="إغلاق">✕</button>
      </div>
      <input id="drawerFilter" type="search" placeholder="ابحث عن قصة…" autocomplete="off">
      <div id="drawerList" class="drawer-list"></div>
    </div>
  </div>

  <main id="app" aria-live="polite"></main>

  <footer>
    <p>📚 <b>صحيح القصص النبوي</b> — تأليف د. عمر سليمان الأشقر رحمه الله.</p>
    <p>النص مقدَّم كما هو في الكتاب، مع تنسيق للفهرس والبحث والعرض.</p>
  </footer>

  <button id="toTop" aria-label="العودة إلى الأعلى" title="إلى الأعلى" hidden>↑</button>

  <script src="./app.js"></script>
  <script data-app-sw="1">if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}</script>
</body>
</html>
