<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maktaba · UcfZem QR Code</title>
<meta name="description" content="Scan the Maktaba QR code to open https://ucfzem.github.io/works/Maktaba/">
<meta name="theme-color" content="#0b1f1a">
<link rel="canonical" href="https://ucfzem.github.io/works/Maktaba/">
<link rel="icon" type="image/svg+xml" href="../assets/maktaba.svg">
<style>
  :root {
    color-scheme: light;
    --ink: #0b1f1a;
    --teal: #0f766e;
    --muted: #5b6b66;
    --paper: #f4f1e9;
    --card: #fffdf7;
    --line: rgba(11, 31, 26, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: clamp(20px, 5vw, 56px) 16px;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 15% 10%, rgba(15, 118, 110, 0.10), transparent 34%),
      radial-gradient(circle at 85% 90%, rgba(15, 118, 110, 0.08), transparent 36%),
      var(--paper);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: min(100%, 620px);
    padding: clamp(24px, 5vw, 44px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(11, 31, 26, 0.12), 0 2px 8px rgba(11, 31, 26, 0.06);
    text-align: center;
  }
  .brand {
    margin: 0 0 4px;
    color: var(--teal);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  .subtitle {
    margin: 10px auto 0;
    max-width: 38ch;
    color: var(--muted);
    font-size: 0.98rem;
    line-height: 1.55;
  }
  .qr-card {
    margin: clamp(22px, 4vw, 32px) auto;
    padding: clamp(12px, 3vw, 20px);
    width: min(100%, 430px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .qr-card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .url {
    display: inline-block;
    margin: 0 auto 22px;
    padding: 8px 12px;
    max-width: 100%;
    overflow-wrap: anywhere;
    color: var(--teal);
    background: rgba(15, 118, 110, 0.07);
    border-radius: 999px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: transform 160ms ease, background 160ms ease, color 160ms ease;
  }
  .button:hover { transform: translateY(-1px); }
  .button.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
  }
  .button.secondary:hover { background: rgba(11, 31, 26, 0.05); }
  footer {
    margin-top: 26px;
    color: var(--muted);
    font-size: 0.76rem;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    .button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">UcfZem</p>
  <h1>Maktaba</h1>
  <p class="subtitle">Scan the code to open the Maktaba library. The QR code targets this folder directly.</p>

  <div class="qr-card">
    <picture>
      <source srcset="maktaba-qr.svg" type="image/svg+xml">
      <img src="maktaba-qr.png" alt="QR code for https://ucfzem.github.io/works/Maktaba/" width="2160" height="2160">
    </picture>
  </div>

  <div class="url">https://ucfzem.github.io/works/Maktaba/</div>

  <div class="actions">
    <a class="button" href="maktaba-qr.svg" download>Download SVG</a>
    <a class="button secondary" href="maktaba-qr.png" download>Download PNG</a>
  </div>

  <footer>High-resolution QR code · Error correction level H (30%)</footer>
</main>
</body>
</html>
